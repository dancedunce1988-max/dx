<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鉄甲兵のつなぎ橋</title>
<!-- 知識ドリルDXのミニゲーム「鉄甲兵のつなぎ橋」（2026-10-02〜、試作）。
     接続語で文と文をつなぎ、谷に橋を架けて鉄甲兵(me02)を向こう岸へ渡らせる。鉄甲兵は鎧が重いので、
     前後の関係（順接・逆接など）に合わない板を選ぶと、乗った瞬間に割れる。
     一〜四の谷で見る力を変え（板を選ぶ→板の働きを見る→長い橋を続けて架ける→腐った板を見つけて直す）、
     「挑戦の谷」で60秒のタイムアタック。
     試作なので、まだミニゲーム一覧には載せておらず、通行証のチェックも入れていない（このファイルを直接開いて遊べる）。
     本体のセーブデータ(st)にもジャンルのレベルにも触れず、このページ専用のlocalStorageキー(TB_LSKEY)だけを使う。
     鉄甲兵の絵は本番と同じスプライト(enemy_sprites_data.js)を使い、読み込めなかったときは🛡️の絵文字で代用する。 -->
<script src="enemy_sprites_data.js"></script>
<style>
  :root{
    --sky1:#1b2340; --sky2:#3a3560; --sky3:#c4704a;
    --rock1:#6b5a4a; --rock2:#4a3c31; --rock3:#2e251f;
    --wood1:#c99a5b; --wood2:#9c6c35; --woodInk:#3a2410;
    --steel:#c9d2dc; --steel2:#8a96a3;
    --gold:#ffd76b; --ok:#5fd08a; --ng:#ff6b6b; --red:#e23b2e;
    --text:#f3f1ec; --sub:#b8b2c8;
    --panel:rgba(255,255,255,.07); --line:rgba(255,255,255,.16);
    --tablet:#ece4d2; --tabletInk:#2b2318;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:linear-gradient(180deg, #11162b 0%, #1d1f38 60%, #2a2238 100%);
    background-color:#11162b;
    font-family:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
    color:var(--text); -webkit-font-smoothing:antialiased;
    user-select:none; -webkit-user-select:none;
  }
  button{ font-family:inherit; cursor:pointer; }
  .mincho{ font-family:'Hiragino Mincho ProN','Yu Mincho','YuMincho','BIZ UDMincho',serif; }
  .screen{ display:none; height:100vh; height:100dvh; flex-direction:column; overflow-y:auto; }
  .screen.show{ display:flex; }
  .wrap{ width:100%; max-width:560px; margin:0 auto; padding:0 16px; }

  #muteBtn{
    position:fixed; top:10px; right:12px; z-index:50; width:38px; height:38px; border-radius:50%;
    border:1px solid var(--line); background:rgba(0,0,0,.35); color:var(--text); font-size:17px;
  }

  /* ---------- タイトル（谷の地図） ---------- */
  #title .hero{ text-align:center; padding:26px 0 6px; }
  #title .hero img, #title .hero .emoji{ height:150px; display:block; margin:0 auto; filter:drop-shadow(0 8px 14px rgba(0,0,0,.5)); }
  #title .hero .emoji{ font-size:110px; line-height:150px; }
  #title h1{ font-size:30px; letter-spacing:.12em; margin-top:6px; color:var(--steel);
    text-shadow:0 2px 0 #3c4550, 0 0 18px rgba(201,210,220,.25); }
  #title .tag{ color:var(--sub); font-size:13px; margin-top:4px; }
  .speech{
    position:relative; background:var(--tablet); color:var(--tabletInk); border-radius:12px;
    padding:12px 14px; margin:14px 0 6px; font-size:14px; line-height:1.7;
  }
  .speech b{ color:#7a3a10; }
  .speech::before{ content:""; position:absolute; top:-9px; left:50%; margin-left:-9px;
    border:9px solid transparent; border-top:0; border-bottom-color:var(--tablet); }
  .stage-list{ display:flex; flex-direction:column; gap:10px; margin:14px 0 18px; }
  .stage-btn{
    display:flex; align-items:center; gap:12px; text-align:left; width:100%;
    background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.04));
    border:1px solid var(--line); border-radius:14px; color:var(--text); padding:12px 14px;
  }
  .stage-btn:active{ transform:translateY(1px); }
  .stage-btn .num{ flex:0 0 46px; height:46px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, var(--wood1), var(--wood2)); color:var(--woodInk); font-size:20px; font-weight:800; }
  .stage-btn .num.ch{ background:linear-gradient(180deg, #ff8a5c, #c2402a); color:#fff; font-size:15px; }
  .stage-btn h3{ font-size:16px; }
  .stage-btn p{ font-size:12px; color:var(--sub); margin-top:2px; line-height:1.5; }
  .stage-btn .mark{ margin-left:auto; font-size:12px; color:var(--gold); white-space:nowrap; }
  .foot-btns{ display:flex; justify-content:center; gap:10px; margin-bottom:24px; }
  .btn{ border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:999px; padding:10px 20px; font-size:14px; }
  .btn.primary{ background:linear-gradient(180deg, #ffcf6b, #e19a2c); color:#2a1a05; border-color:transparent; font-weight:700; }

  /* ---------- ゲーム画面 ---------- */
  #game{ overflow:hidden; }
  .hud{ display:flex; align-items:center; gap:10px; padding:10px 60px 6px 16px; flex:0 0 auto; }
  .hud .stg{ font-size:14px; font-weight:700; color:var(--steel); white-space:nowrap; }
  .hud .prog{ flex:1; height:8px; background:rgba(255,255,255,.12); border-radius:4px; overflow:hidden; }
  .hud .prog i{ display:block; height:100%; width:0; background:linear-gradient(90deg, var(--wood1), var(--gold)); transition:width .4s; }
  .hud .timer{ font-size:18px; font-weight:800; color:var(--gold); min-width:3.2em; text-align:right; }
  .hud .timer.low{ color:var(--ng); }
  .hud .timer .armor{ font-size:17px; margin-left:1px; transition:opacity .3s, filter .3s; }
  .hud .timer .armor.lost{ opacity:.25; filter:grayscale(1); }
  .hud .quit{ border:0; background:none; color:var(--sub); font-size:13px; }

  /* 谷の景色 */
  #scene{
    position:relative; flex:0 0 auto; height:clamp(170px, 30vh, 240px); overflow:hidden;
    background:
      radial-gradient(ellipse at 70% 95%, rgba(255,160,90,.55) 0%, transparent 55%),
      linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 55%, var(--sky3) 100%);
  }
  #scene .mtn{ position:absolute; left:-10%; right:-10%; bottom:20%; height:45%;
    background:#2b2a45; clip-path:polygon(0 100%,0 60%,10% 35%,20% 55%,32% 20%,45% 50%,55% 30%,68% 58%,80% 25%,92% 50%,100% 40%,100% 100%); opacity:.8; }
  #scene .river{ position:absolute; left:0; right:0; bottom:0; height:14%;
    background:repeating-linear-gradient(90deg, #1d4a6b 0 18px, #23608a 18px 30px); animation:flow 1.4s linear infinite; }
  @keyframes flow{ from{ background-position:0 0 } to{ background-position:30px 0 } }
  .plat{
    position:absolute; bottom:0; top:58%;
    background:linear-gradient(90deg, var(--rock2), var(--rock1) 45%, var(--rock2) 85%, var(--rock3));
    border-top:6px solid #5f7a3c; border-radius:4px 4px 0 0;
    box-shadow:inset 0 10px 14px rgba(0,0,0,.25);
  }
  .plank{
    position:absolute; top:calc(58% - 4px); height:24px; border-radius:4px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    color:var(--woodInk); font-weight:800; white-space:nowrap; z-index:3;
  }
  .plank.empty{ border:2px dashed rgba(255,255,255,.35); background:rgba(0,0,0,.15); }
  .plank.empty.active{ border-color:var(--gold); animation:blink 1s ease-in-out infinite; }
  @keyframes blink{ 50%{ box-shadow:0 0 12px rgba(255,215,107,.8); } }
  .plank.wood{ background:linear-gradient(180deg, var(--wood1), var(--wood2)); border:1px solid #5d3b17;
    box-shadow:0 3px 0 #5d3b17; }
  .plank.drop{ animation:drop .35s cubic-bezier(.3,.0,.5,1.4); }
  @keyframes drop{ from{ transform:translateY(-120px); opacity:.3 } to{ transform:none; opacity:1 } }
  .plank.good{ box-shadow:0 3px 0 #5d3b17, 0 0 14px rgba(95,208,138,.9); }
  .plank.rot{ background:linear-gradient(180deg, #8e8a5a, #5d5a37); }
  .plank .half{ position:absolute; top:0; bottom:0; width:50%; background:inherit; display:flex; align-items:center; overflow:hidden; }
  .plank.breaking{ background:none; border:0; box-shadow:none; overflow:visible; }
  .plank.breaking .half{ background:linear-gradient(180deg, var(--wood1), var(--wood2)); border:1px solid #5d3b17; }
  .plank.breaking .half.l{ left:0; justify-content:flex-end; animation:fallL .9s ease-in forwards; transform-origin:0 50%; }
  .plank.breaking .half.r{ right:0; justify-content:flex-start; animation:fallR .9s ease-in forwards; transform-origin:100% 50%; }
  @keyframes fallL{ 30%{ transform:rotate(35deg) } 100%{ transform:translateY(160px) rotate(80deg); opacity:0 } }
  @keyframes fallR{ 30%{ transform:rotate(-35deg) } 100%{ transform:translateY(160px) rotate(-80deg); opacity:0 } }
  #knight{
    position:absolute; z-index:5; bottom:calc(42% + 2px); width:clamp(64px, 18vw, 92px); transform:translateX(-50%);
    transition:left .8s linear;
  }
  #knight img{ width:100%; display:block; filter:drop-shadow(0 4px 4px rgba(0,0,0,.45)); }
  #knight .emoji{ font-size:48px; text-align:center; }
  #knight.walk{ animation:bob .25s ease-in-out infinite; }
  @keyframes bob{ 50%{ margin-bottom:4px } }
  #knight.shake{ animation:shake .4s; }
  @keyframes shake{ 20%{ margin-left:-6px } 40%{ margin-left:6px } 60%{ margin-left:-4px } 80%{ margin-left:3px } }
  #scene .say{
    position:absolute; z-index:6; top:8px; left:50%; transform:translateX(-50%); max-width:86%;
    background:var(--tablet); color:var(--tabletInk); border-radius:10px; padding:5px 10px;
    font-size:12.5px; font-weight:700; line-height:1.4; opacity:0; transition:opacity .25s; pointer-events:none; text-align:center;
  }
  #scene .say.show{ opacity:1; }
  .bigmark{
    position:absolute; z-index:8; left:50%; top:44%; transform:translate(-50%,-50%) scale(.4);
    font-size:110px; font-weight:900; line-height:1; opacity:0; pointer-events:none;
  }
  .bigmark.ok{ color:transparent; width:110px; height:110px; border:13px solid var(--red); border-radius:50%; }
  .bigmark.ng{ color:#3b6fd8; text-shadow:0 0 10px rgba(255,255,255,.6); }
  .bigmark.pop{ animation:pop .7s ease-out forwards; }
  @keyframes pop{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(.4) } 30%{ opacity:1; transform:translate(-50%,-50%) scale(1.05) }
    75%{ opacity:1; transform:translate(-50%,-50%) scale(1) } 100%{ opacity:0; transform:translate(-50%,-50%) scale(1) } }

  /* 問題文（石板） */
  .board{ flex:1 1 auto; overflow-y:auto; padding:12px 16px 14px; }
  .ask{ font-size:13px; color:var(--gold); font-weight:700; margin-bottom:8px; text-align:center; }
  .tablet{
    background:var(--tablet); color:var(--tabletInk); border-radius:10px; padding:12px 14px;
    font-size:17px; line-height:2.05; box-shadow:0 4px 0 #a99d82;
  }
  .tablet .slot{
    display:inline-block; min-width:4.2em; text-align:center; padding:0 6px; margin:0 3px; line-height:1.55;
    border-radius:6px; border:2px dashed #a99d82; color:#a99d82; font-weight:800; vertical-align:baseline;
  }
  .tablet .slot.active{ border-color:#d48a1d; color:#d48a1d; background:rgba(255,200,80,.2); }
  .tablet .slot.filled{ border:2px solid #9c6c35; background:linear-gradient(180deg, var(--wood1), var(--wood2)); color:var(--woodInk); }
  .tablet .slot.right{ border-color:#2f8a52; box-shadow:0 0 0 2px rgba(47,138,82,.25); }
  .tablet .slot.wrong{ background:#f3c9c4; border-color:#c0392b; color:#c0392b; text-decoration:line-through; }
  .tablet .slot.tap{ cursor:pointer; }
  .tablet .slot.tap:active{ transform:translateY(1px); }
  .tablet .slot .fix{ text-decoration:none; color:#1f6e3f; margin-left:4px; }
  .opts{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .opts.six{ grid-template-columns:1fr 1fr; }
  /* 長い文章のときは、選択肢の板を画面の下に貼りつけて、文章をスクロールしても手元に残す */
  .opts.dock{ position:sticky; bottom:-14px; z-index:4; margin:10px -16px -14px; padding:10px 16px 14px;
    background:linear-gradient(180deg, rgba(29,31,56,0), #1d1f38 18px); grid-template-columns:repeat(3, 1fr); gap:8px; }
  .opts.dock .opt{ min-height:44px; font-size:16px; padding:4px; }
  .opt{
    min-height:52px; border-radius:10px; border:1px solid #5d3b17; color:var(--woodInk);
    background:linear-gradient(180deg, var(--wood1), var(--wood2)); box-shadow:0 4px 0 #5d3b17;
    font-size:19px; font-weight:800; padding:6px 8px; line-height:1.25;
  }
  .opt small{ display:block; font-size:11px; font-weight:600; opacity:.8; margin-top:2px; }
  .opt:active{ transform:translateY(3px); box-shadow:0 1px 0 #5d3b17; }
  .opt:disabled{ opacity:.35; transform:none; box-shadow:0 4px 0 #5d3b17; }
  .opt.picked-ok{ outline:3px solid var(--ok); }
  .opt.picked-ng{ outline:3px solid var(--ng); }
  .explain{
    margin-top:12px; background:rgba(0,0,0,.3); border:1px solid var(--line); border-left:4px solid var(--ng);
    border-radius:10px; padding:10px 12px; font-size:13.5px; line-height:1.75;
  }
  .explain.okk{ border-left-color:var(--ok); }
  .explain b{ color:var(--gold); }
  .explain .next{ display:block; margin:10px auto 0; }

  .tablet.term-q{ text-align:center; font-size:30px; font-weight:800; line-height:1.6; padding:18px 14px; }
  .tablet.term-q small{ font-size:15px; font-weight:600; margin-left:4px; }
  .tablet.term-q .desc{ display:block; font-size:18px; font-weight:700; text-align:left; }

  /* ---------- 板の図鑑 ---------- */
  #zukan .wrap{ padding-top:22px; padding-bottom:24px; }
  .z-title{ font-size:22px; color:var(--steel); text-align:center; }
  .z-group{ margin-top:16px; }
  .z-group h3{ font-size:15px; color:var(--gold); margin-bottom:8px; }
  .z-term{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .z-head{ display:flex; align-items:baseline; gap:8px; }
  .z-name{ font-size:22px; font-weight:800; color:var(--steel); }
  .z-yomi{ font-size:12px; color:var(--sub); }
  .z-desc{ font-size:13.5px; margin-top:2px; line-height:1.6; }
  .z-words{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .z-plank{ background:linear-gradient(180deg, var(--wood1), var(--wood2)); color:var(--woodInk); border-radius:6px; padding:2px 10px; font-weight:800; font-size:14px; }
  .z-ex{ font-size:13.5px; margin-top:8px; line-height:1.7; color:var(--text); }
  .z-ex u{ text-decoration:none; background:rgba(255,215,107,.22); padding:0 3px; border-radius:3px; font-weight:800; }
  .z-note{ font-size:12px; color:var(--sub); margin-top:4px; line-height:1.6; }

  /* ---------- 結果 ---------- */
  #result .wrap{ padding-top:24px; padding-bottom:24px; text-align:center; }
  #result img, #result .emoji{ height:130px; display:block; margin:0 auto; }
  #result .emoji{ font-size:90px; line-height:130px; }
  #result h2{ font-size:22px; margin-top:8px; color:var(--steel); }
  #result .score{ font-size:44px; font-weight:900; color:var(--gold); margin:4px 0; }
  #result .sub{ color:var(--sub); font-size:13px; }
  .miss-list{ text-align:left; margin:16px 0; display:flex; flex-direction:column; gap:10px; }
  .miss{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.75; }
  .miss .q{ font-size:14px; }
  .miss .q u{ text-decoration:none; background:rgba(95,208,138,.25); color:#bff3d0; padding:0 4px; border-radius:4px; font-weight:800; }
  .miss .q s{ color:var(--ng); }
  .miss .w{ color:var(--sub); margin-top:4px; }
</style>
</head>
<body>
<button id="muteBtn" onclick="toggleMute()" aria-label="音のオン・オフ">🔊</button>

<!-- タイトル（谷の地図） -->
<section id="title" class="screen show">
  <div class="wrap">
    <div class="hero">
      <div id="titleKnight"></div>
      <h1 class="mincho">鉄甲兵のつなぎ橋</h1>
      <div class="tag">ことばの板で、文と文に橋を架けよう</div>
    </div>
    <div class="speech">
      わしは鉄甲兵。この鎧は重いぞ。<br>
      <b>前と後ろの文の関係に合わない板</b>では、わしの重さに耐えられず、乗ったとたんに割れてしまう。<br>
      正しい板で橋を架け、わしを向こう岸まで渡してくれ！
    </div>
    <div class="stage-list" id="stageList"></div>
    <div class="foot-btns">
      <button class="btn" onclick="showZukan()">📖 板の図鑑</button>
      <button class="btn" onclick="backToApp()">ミニゲーム一覧へ戻る</button>
    </div>
  </div>
</section>

<!-- ゲーム -->
<section id="game" class="screen">
  <div class="hud">
    <span class="stg" id="hudStage"></span>
    <span class="prog"><i id="hudProg"></i></span>
    <span class="timer" id="hudTimer"></span>
    <button class="quit" onclick="quitStage()">やめる</button>
  </div>
  <div id="scene">
    <div class="mtn"></div>
    <div class="river"></div>
    <div id="bridge"></div>
    <div id="knight"></div>
    <div class="say" id="say"></div>
    <div class="bigmark" id="bigmark">×</div>
  </div>
  <div class="board" id="board"></div>
</section>

<!-- 板の図鑑：働きの名前・意味・代表的な語・例文の一覧（覚えるためのページ） -->
<section id="zukan" class="screen">
  <div class="wrap" id="zukanBody"></div>
</section>

<!-- 結果 -->
<section id="result" class="screen">
  <div class="wrap" id="resultBody"></div>
</section>

<script>
/* =====================================================================
   接続語の種類（6つの働き）と、選択肢に出てくる語ごとの使いどころ。
   まちがえたとき「選んだ語はこういうときに使う」と見せるために、語ごとに一言ずつ持たせる。
   ===================================================================== */
const TYPES = {
  jun:  {name:"順接",       ex:"だから・すると", desc:"前のことが原因・理由になって、後ろにその結果が来る"},
  gyaku:{name:"逆接",       ex:"しかし・ところが", desc:"後ろに、前から予想されることと反対のことが来る"},
  hei:  {name:"並立・累加", ex:"また・しかも",   desc:"前のことと対等に並べたり、付け加えたりする"},
  tai:  {name:"対比・選択", ex:"一方・それとも", desc:"前と後ろを比べたり、どちらかを選んだりする"},
  setsu:{name:"説明・補足", ex:"なぜなら・つまり", desc:"前のことについて、理由・言いかえ・例・条件を補う"},
  ten:  {name:"転換",       ex:"ところで・さて", desc:"それまでの話題を変える"},
};
const TYPE_KEYS = ["jun","gyaku","hei","tai","setsu","ten"];
const WORDS = {
  "だから":     {t:"jun",   use:"前が理由で、後ろがその結果のとき"},
  "すると":     {t:"jun",   use:"前のことに続いて、後ろのことが起こるとき"},
  "そこで":     {t:"jun",   use:"前の状況を受けて、次の行動をとるとき"},
  "そのため":   {t:"jun",   use:"前が原因で、後ろがその結果のとき"},
  "しかし":     {t:"gyaku", use:"後ろに、前と反対のことが来るとき"},
  "けれども":   {t:"gyaku", use:"後ろに、前と反対のことが来るとき"},
  "ところが":   {t:"gyaku", use:"前から予想されることと反対の、意外なことが起こるとき"},
  "それなのに": {t:"gyaku", use:"当然そうなるはずなのに、そうならなかったとき"},
  "でも":       {t:"gyaku", use:"後ろに、前と反対の考えや事がらが来るとき"},
  "また":       {t:"hei",   use:"同じようなことを並べるとき"},
  "しかも":     {t:"hei",   use:"前のことに、さらに付け加えるとき"},
  "そのうえ":   {t:"hei",   use:"前のことに、さらに付け加えるとき"},
  "それに":     {t:"hei",   use:"前のことに、さらに付け加えるとき"},
  "一方":       {t:"tai",   use:"二つのことを比べるとき"},
  "これに対して":{t:"tai",  use:"二つのことを比べるとき"},
  "または":     {t:"tai",   use:"どちらか一方を選ぶとき"},
  "それとも":   {t:"tai",   use:"問いかけで、どちらかを選ばせるとき"},

/* {…} を区切って、文の切れ端と板の列にする。板は {word, wrong?} */
function parsePassage(text){
  const parts = [], planks = [];
  const re = /\{([^}]+)\}/g; let last = 0, m;
  while((m = re.exec(text))){
    parts.push(text.slice(last, m.index));
    const s = m[1];
    if(s.includes(">")){ const [w, r] = s.split(">"); planks.push({word:r, wrong:w}); }
    else planks.push({word:s});
    last = re.lastIndex;
  }
  parts.push(text.slice(last));
  return {parts, planks};
}

let AC = null, muted = false;
try{ muted = localStorage.getItem(TB_LSKEY + "_mute") === "1"; }catch(e){}
function ac(){ if(muted) return null; try{ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === "suspended") AC.resume(); }catch(e){ return null; } return AC; }
function tone(f, d, type, vol, delay, f2){
  const c = ac(); if(!c) return;
  const t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t); if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol || .15, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, vol, freq){
  const c = ac(); if(!c) return;
  const len = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, len, c.sampleRate), ch = buf.getChannelData(0);
  for(let i=0;i<len;i++) ch[i] = (Math.random()*2-1) * (1 - i/len);
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = buf; f.type = "lowpass"; f.frequency.value = freq || 1200; g.gain.value = vol || .3;
  s.connect(f); f.connect(g); g.connect(c.destination); s.start();
}

let SC = null;   // {n, plats:[{l,w}], gaps:[{l,w}], pos}
function buildScene(n){
  const P = n + 1;
  let plats = [], gaps = [];
  if(n === 1){
    plats = [{l:0, w:34}, {l:66, w:34}]; gaps = [{l:34, w:32}];
  }else{
    const g = 1.15, unit = 100 / (P + n * g);
    let x = 0;
    for(let i=0;i<P;i++){
      plats.push({l:x, w:unit}); x += unit;
      if(i < n){ gaps.push({l:x, w:unit * g}); x += unit * g; }
    }
  }
  SC = {n, plats, gaps, pos:0};
  $("bigmark").className = "bigmark";   // 画面を出し直すと、前の○×のアニメーションが再生されてしまうので消しておく
  $("bridge").innerHTML =
    plats.map(p => `<div class="plat" style="left:${p.l}%;width:${p.w}%"></div>`).join("") +
    gaps.map((g, i) => `<div class="plank empty" id="pk${i}" style="left:calc(${g.l}% - 3px);width:calc(${g.w}% + 6px)"></div>`).join("");
  const k = $("knight");
  k.style.transition = "none";
  k.style.left = platCenter(0) + "%";
  k.className = "";
  k.innerHTML = knightHtml("pose1");
  k.style.width = n >= 4 ? "clamp(50px, 13vw, 76px)" : "";
  void k.offsetWidth; k.style.transition = "";
  setActiveGap(0);
}
// 両端の岸が細いとき（長い橋）に鉄甲兵が画面からはみ出さないよう、端から少し内側に寄せる
function platCenter(i){ const p = SC.plats[i]; return Math.min(91, Math.max(9, p.l + p.w / 2)); }
function gapCenter(i){ const g = SC.gaps[i]; return g.l + g.w / 2; }
function setActiveGap(i){ SC && SC.gaps.forEach((_, j) => { const el = $("pk" + j); if(el) el.classList.toggle("active", j === i && el.classList.contains("empty")); }); }
function plankFont(word, i){
  const px = $("scene").clientWidth * SC.gaps[i].w / 100;
  return Math.max(9, Math.min(15, Math.floor(px * .86 / Math.max(2, word.length))));
}

function breakPlank(i){

let G = null;   // {stage, rounds, idx, ok, ng, misses[], busy, crossed, armor, tier}

function startStage(id){
  ac();
  const st = STAGES.find(s => s.id === id);
  let rounds;
  if(st.kind === "pick" || st.kind === "type") rounds = shuffle(PAIRS).slice(0, st.n).map(p => ({kind:st.kind, p}));
  else if(st.kind === "chain") rounds = shuffle(st.src === "long" ? LONGS : CHAINS).slice(0, st.n).map(c => ({kind:"chain", c, long:st.src === "long"}));
  else if(st.kind === "term") rounds = buildTermRounds(st.n);
  else if(st.kind === "rotten") rounds = shuffle(ROTTENS).slice(0, st.n).map(r => ({kind:"rotten", r}));
  else rounds = [];
  G = {stage:st, rounds, idx:0, ok:0, ng:0, misses:[], busy:false, crossed:0, armor:ARMOR_MAX, tier:0, over:false};
  $("hudStage").textContent = st.name.split("　")[0];
  $("hudTimer").textContent = ""; $("hudTimer").classList.remove("low");
  show("game");
  if(st.kind === "challenge") updateArmor();
  nextRound();

/* =====================================================================
   挑戦の谷（鎧の耐久戦）：時間制限なし。まちがえるたびに鎧が1つ欠け、3つとも欠けたら終わり。
   渡った橋の数で谷が深くなり（TIERS）、出る問題の種類が増える。10本渡るごとに鎧が1つ直る。
   九尾の「60秒の挑戦の間」とは違い、急がずにじっくり考えられるようにしている。
   ===================================================================== */
const ARMOR_MAX = 3;
const TIERS = [
  {from:0,  name:"浅瀬",       mix:{pick:6, termEasy:4}},
  {from:5,  name:"谷の中ほど", mix:{pick:4, type:3, term:3},
   line:"谷が深くなったぞ！ ここからは板の「働き」も問われる。"},
  {from:10, name:"深い谷",     mix:{pick:3, type:2, term:2, chain:3},
   line:"さらに深い谷だ！ 長い吊り橋が現れたぞ。"},
  {from:15, name:"底なしの谷", mix:{pick:2, type:2, term:2, chain:2, rotten:2, long:2},
   line:"ここは底なしの谷…腐った板と大河の橋にも気をつけよ！"},
];
function tierOf(n){ let t = 0; TIERS.forEach((x, i) => { if(n >= x.from) t = i; }); return t; }
function challengeRound(){
  const mix = TIERS[G.tier].mix, keys = Object.keys(mix);
  let x = Math.random() * keys.reduce((a, k) => a + mix[k], 0), kind = keys[0];
  for(const k of keys){ if((x -= mix[k]) < 0){ kind = k; break; } }
  if(kind === "pick" || kind === "type") return {kind, p:pick1(PAIRS)};
  if(kind === "termEasy") return {kind:"term", q:makeTermQ(pick1(["w2t","kanji"]))};
  if(kind === "term") return {kind:"term", q:makeTermQ(pick1(["w2t","t2w","d2t","kanji"]))};
  if(kind === "chain") return {kind:"chain", c:pick1(CHAINS)};
  if(kind === "long") return {kind:"chain", c:pick1(LONGS), long:true};
  return {kind:"rotten", r:pick1(ROTTENS)};
}
function updateArmor(){
  const el = $("hudTimer");
  el.innerHTML = Array.from({length:ARMOR_MAX}, (_, i) => `<span class="armor ${i < G.armor ? "" : "lost"}">🛡️</span>`).join("");
  el.classList.toggle("low", G.armor <= 1);
  $("hudStage").textContent = `挑戦の谷　${G.crossed}本`;
}
const armorOut = () => G.stage.kind === "challenge" && G.armor <= 0;
async function endByArmor(){
  G.busy = true;
  setPose("defeat"); say("鎧が砕けた…ここまでか…", 2200);
  await sleep(1800);
  finishStage();
}
function updateProg(){
  const st = G.stage;
  // 挑戦の谷では、次に鎧が直る（10本ごと）までの進み具合を見せる
  const pct = st.kind === "challenge" ? (G.crossed % 10) / 10 * 100 : G.idx / G.rounds.length * 100;
  $("hudProg").style.width = Math.min(100, pct) + "%";
}
function quitStage(){ stopTimer(); G.over = true; showTitle(); }

function nextRound(){
  if(G.over) return;
  updateProg();
  let r;
  G.roundNg = G.ng;
  if(G.stage.kind === "challenge") r = challengeRound();
  else{
    if(G.idx >= G.rounds.length) return finishStage();
    r = G.rounds[G.idx];
  }
  if(r.kind === "pick" || r.kind === "type") renderPair(r);
  else if(r.kind === "term") renderTerm(r);
  else if(r.kind === "chain") renderChain(r);
  else renderRotten(r);
}
async function afterRound(){
  G.idx++;
  // 挑戦の谷で数えるのは、板を1枚も割らずに渡れた橋だけ（まちがえて直してもらった橋は数えない）
  if(G.ng === G.roundNg) G.crossed++;
  if(G.stage.kind === "challenge"){
    updateArmor();
    const t = tierOf(G.crossed);
    if(G.ng === G.roundNg && G.crossed % 10 === 0 && G.armor < ARMOR_MAX){
      G.armor++; updateArmor(); sfx.clear();
      say("鎧を打ち直したぞ！ 鎧が1つ直った。", 1800); await sleep(1500);
    }
    if(t !== G.tier){
      G.tier = t; say(TIERS[t].line, 2400); await sleep(1700);
    }
    if(G.over) return;
  }
  G.busy = false; nextRound();
}

function recordOk(){ G.ok++; }
function recordNg(miss){
  G.ng++; G.misses.push(miss);
  if(G.stage.kind === "challenge"){ G.armor = Math.max(0, G.armor - 1); updateArmor(); }
}

function pairTablet(p, slotHtml){

function renderPair(r){

  }else{

    $("board").innerHTML = `<div class="ask">この板の「働き」は？ 刻印を読み当てると、板が固まる</div>` +
      pairTablet(p, `<span class="slot filled" id="slot0">${esc(p.ans)}</span>`) +
      `<div class="opts six">${TYPE_KEYS.map(k => `<button class="opt" data-t="${k}">${esc(TYPES[k].name)}<small>${esc(TYPES[k].ex)}</small></button>`).join("")}</div>`;
    $("board").querySelectorAll(".opt").forEach(b => b.onclick = () => answerType(r, b));
  }

async function answerPick(r, btn){
  if(G.busy || G.over) return; G.busy = true;
  const p = r.p, w = btn.dataset.w, ok = w === p.ans;
  document.querySelectorAll(".opt").forEach(b => b.disabled = true);
  btn.disabled = false; btn.classList.add(ok ? "picked-ok" : "picked-ng");
  const slot = $("slot0");
  slot.className = "slot filled"; slot.textContent = w;
  placePlank(0, w);
  await sleep(380);
  if(ok){
    recordOk(); slot.classList.add("right"); $("pk0").classList.add("good");
    bigMark(true); sfx.ok(); say(pickLine(OK_LINES));
    await crossGap(0);
    setPose("attack"); await sleep(450);
  }else{
    recordNg({p, chosen:w, kind:"pick"});
    bigMark(false); say(pickLine(NG_LINES));
    await failGap(0);
    slot.className = "slot filled wrong"; slot.innerHTML = `${esc(w)}`;
    slot.insertAdjacentHTML("afterend", `<span class="slot filled right">${esc(p.ans)}</span>`);
    placePlank(0, p.ans, "good");
    await waitNext(explainHtml(p.ans, w, p.why));
    if(G.over) return;
    if(armorOut()) return endByArmor();
    await crossGap(0);
  }
  afterRound();
}
async function answerType(r, btn){
  if(G.busy || G.over) return; G.busy = true;
  const p = r.p, t = btn.dataset.t, right = wordInfo(p.ans).t, ok = t === right;
  document.querySelectorAll(".opt").forEach(b => b.disabled = true);
  btn.disabled = false; btn.classList.add(ok ? "picked-ok" : "picked-ng");
  if(ok){
    recordOk(); $("pk0").className = "plank wood good"; $("slot0").classList.add("right");
    bigMark(true); sfx.ok(); say(`${TYPES[t].name}の板だ。びくともせん！`);
    await crossGap(0);
    setPose("attack"); await sleep(450);
  }else{
    recordNg({p, chosen:t, kind:"type"});
    bigMark(false); say("刻印を読みちがえたな…板がもろくなった！");
    await failGap(0);
    placePlank(0, p.ans, "good");
    const box = `「${esc(p.ans)}」は <b>${esc(TYPES[right].name)}</b>（${esc(TYPES[right].desc)}）。${esc(p.why)}` +
      `<br>選んだ${esc(TYPES[t].name)}は、${esc(TYPES[t].desc)}ときの働き。`;
    await waitNext(box);
    if(G.over) return;
    if(armorOut()) return endByArmor();
    await crossGap(0);
  }

/* ---------- 二の谷（term）：働きの名前を覚える ----------
   w2t＝語→名前、t2w＝名前→語、d2t＝説明→名前、kanji＝読み→漢字 の4種類をまぜて出す。 */
const pick1 = a => a[Math.floor(Math.random() * a.length)];
function termNote(k){
  const t = TERMS[k];
  return `<b>${esc(k)}</b>（${esc(t.yomi)}）…${esc(t.desc)}。代表的な語：${esc(t.words.join("・"))}。${esc(t.note)}`;
}
function makeTermQ(kind){
  const k = pick1(TERM_KEYS), t = TERMS[k];
  const others = TERM_KEYS.filter(x => x !== k && TERMS[x].g !== t.g);   // 同じなかま（並立と累加など）は入れない
  if(kind === "w2t"){
    const w = pick1(t.words);
    return {kind, ans:k, opts:shuffle([k].concat(shuffle(others).slice(0, 3))), ask:"この板の働きの名前は？",
      prompt:esc(`「${w}」`), plank:x => x, why:termNote(k), miss:`「${w}」の働き → ${k}`};
  }
  if(kind === "t2w"){
    const w = pick1(t.words);
    const ds = shuffle(others).slice(0, 3).map(x => pick1(TERMS[x].words));
    return {kind, ans:w, opts:shuffle([w].concat(ds)), ask:`「${k}」の働きをする板はどれ？`,
      prompt:`${esc(k)}<small>（${esc(t.yomi)}）</small>`, plank:x => x, why:termNote(k), miss:`${k}の板 → ${w}`};
  }
  if(kind === "d2t"){
    const ds = shuffle(TERM_KEYS.filter(x => x !== k)).slice(0, 3);
    return {kind, ans:k, opts:shuffle([k].concat(ds)), ask:"この働きを何という？",
      prompt:`<span class="desc">${esc(t.desc)}</span>`, plank:x => x, why:termNote(k), miss:`「${t.desc}」働き → ${k}`};
  }
  return {kind:"kanji", ans:k, opts:shuffle([k].concat(t.fakes)), ask:"漢字で正しく書くと？",
    prompt:esc(t.yomi), plank:x => x, why:termNote(k), miss:`${t.yomi} → ${k}`};
}
function buildTermRounds(n){
  // 4種類がかたよらないように、順番に並べてからまぜる
  const kinds = ["w2t","t2w","d2t","kanji"];
  const out = [];
  for(let i=0;i<n;i++) out.push({kind:"term", q:makeTermQ(kinds[i % 4])});
  return shuffle(out);
}
function renderTerm(r){
  const q = r.q;
  buildScene(1);
  G.busy = false;
  $("board").innerHTML = `<div class="ask">${esc(q.ask)}</div>` +
    `<div class="tablet mincho term-q">${q.prompt}</div>` +
    `<div class="opts">${q.opts.map(w => `<button class="opt mincho" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div>`;
  $("board").querySelectorAll(".opt").forEach(b => b.onclick = () => answerTerm(r, b));
}
async function answerTerm(r, btn){
  if(G.busy || G.over) return; G.busy = true;
  const q = r.q, w = btn.dataset.w, ok = w === q.ans;
  document.querySelectorAll(".opt").forEach(b => b.disabled = true);
  btn.disabled = false; btn.classList.add(ok ? "picked-ok" : "picked-ng");
  placePlank(0, q.plank(w));
  await sleep(380);
  if(ok){
    recordOk(); $("pk0").classList.add("good");
    bigMark(true); sfx.ok(); say(pickLine(["名前を覚えたな！", "石碑の文字が光った！", "うむ、正しい名だ。"]));
    const b = document.createElement("div"); b.className = "explain okk"; b.innerHTML = q.why;
    $("board").appendChild(b);
    await crossGap(0);
    setPose("attack"); await sleep(1100);
  }else{
    recordNg({kind:"term", q, chosen:w});
    bigMark(false); say(pickLine(NG_LINES));
    await failGap(0);
    placePlank(0, q.plank(q.ans), "good");
    await waitNext(`正解は <b>「${esc(q.ans)}」</b>。<br>` + q.why);
    if(G.over) return;
    if(armorOut()) return endByArmor();
    await crossGap(0);
  }
  afterRound();
}

/* ---------- 四の谷・六の谷（chain）：長い吊り橋・大河の橋を左から順に架ける ---------- */
function passageHtml(parsed, slotFn){
  return `<div class="tablet mincho">` + parsed.parts.map((t, i) =>
    esc(t).replace(/\n/g, "<br>") + (i < parsed.planks.length ? slotFn(i) : "")).join("") + `</div>`;
}
const CIRCLED = ["①","②","③","④","⑤","⑥","⑦"];
function renderChain(r){
  const ps = parsePassage(r.c.text);
  r.ps = ps; r.at = 0;
  buildScene(ps.planks.length);
  const pool = shuffle(ps.planks.map(p => p.word).concat(r.c.extra));
  const draw = () => {
    $("board").innerHTML = (r.long ? `<div class="ask">大河の橋「${esc(r.c.title)}」　文章の流れを読んで、①から順に板を架けよ（${CIRCLED[r.at]}／${ps.planks.length}枚）</div>`
        : `<div class="ask">左から順に板を架けよ（${r.at + 1}枚目／${ps.planks.length}枚）</div>`) +
      passageHtml(ps, i => {
        if(i < r.at) return `<span class="slot filled right">${esc(ps.planks[i].word)}</span>`;
        return `<span class="slot ${i === r.at ? "active" : ""}" id="slot${i}">${i === r.at ? CIRCLED[i] + "？" : CIRCLED[i]}</span>`;
      }) +
      `<div class="opts dock">${pool.map((w, j) => r.used && r.used[j] ? "" : `<button class="opt mincho" data-j="${j}">${esc(w)}</button>`).join("")}</div>`;
    $("board").querySelectorAll(".opt").forEach(b => b.onclick = () => answerChain(r, pool, +b.dataset.j, draw));
    $("slot" + r.at) && $("slot" + r.at).scrollIntoView({block:r.long ? "center" : "nearest"});
  };
  r.used = {};
  draw();
  G.busy = false;
}
async function answerChain(r, pool, j, draw){
  if(G.busy || G.over) return; G.busy = true;
  const ps = r.ps, i = r.at, w = pool[j], ans = ps.planks[i].word, ok = w === ans;
  document.querySelectorAll(".opt").forEach(b => b.disabled = true);
  const slot = $("slot" + i); slot.className = "slot filled"; slot.textContent = w;
  placePlank(i, w);
  await sleep(380);
  if(ok){
    recordOk(); $("pk" + i).classList.add("good"); bigMark(true); sfx.ok(); say(pickLine(OK_LINES), 1100);
    await crossGap(i);
  }else{
    const pre = ps.parts[i].replace(/\n/g, "").split("。").filter(Boolean).pop() || "", post = (ps.parts[i + 1].replace(/\n/g, "").split("。")[0] || "");
    recordNg({p:{a:pre + "。", b:post + "。", ans, why:chainWhy(ans)}, chosen:w, kind:"pick"});
    bigMark(false); say(pickLine(NG_LINES));
    await failGap(i);
    slot.className = "slot filled wrong";
    slot.insertAdjacentHTML("afterend", `<span class="slot filled right">${esc(ans)}</span>`);
    placePlank(i, ans, "good");
    await waitNext(explainHtml(ans, w, chainWhy(ans)));
    if(G.over) return;
    if(armorOut()) return endByArmor();
    await crossGap(i);
  }
  // 正解の板は使用済みにする（まちがえた板は手元に残る）
  r.used[pool.indexOf(ans)] = true;
  r.at++;
  if(r.at >= ps.planks.length){
    setPose("attack"); sfx.clear(); say("長い谷を渡りきったぞ！", 1400);
    await sleep(1300);
    return afterRound();
  }
  G.busy = false;
  setActiveGap(r.at);
  draw();
}
function chainWhy(w){ const i = wordInfo(w); return i.t ? `${typeLabel(w)}の「${w}」は、${i.use}に使う。` : ""; }

/* ---------- 四の谷（rotten）：腐った板を探して替える ---------- */
function renderRotten(r){
  const ps = parsePassage(r.r.text);
  r.ps = ps;
  const bad = ps.planks.findIndex(p => p.wrong);
  r.bad = bad;
  buildScene(ps.planks.length);
  ps.planks.forEach((p, i) => { const el = $("pk" + i); el.className = "plank wood"; el.style.fontSize = plankFont(p.wrong || p.word, i) + "px"; el.textContent = p.wrong || p.word; });
  setActiveGap(-1);
  $("board").innerHTML = `<div class="ask">一枚だけ腐った板（前後の関係に合わない板）がまじっている。どれだ？</div>` +
    passageHtml(ps, i => `<span class="slot filled tap" id="slot${i}" data-i="${i}">${esc(ps.planks[i].wrong || ps.planks[i].word)}</span>`);
  $("board").querySelectorAll(".slot.tap").forEach(s => s.onclick = () => findRotten(r, +s.dataset.i));
  G.busy = false;
  say("この橋のどこかに、腐った板がある…", 2000);
}
async function findRotten(r, i){
  if(G.busy || G.over) return; G.busy = true;
  const ps = r.ps, bad = r.bad, p = ps.planks[bad];
  document.querySelectorAll(".slot.tap").forEach(s => { s.classList.remove("tap"); s.onclick = null; });
  if(i === bad){
    recordOk(); bigMark(true); sfx.ok(); say("よくぞ見抜いた！");
  }else{
    recordNg({p:{a:"", b:"", ans:p.word, why:r.r.why}, chosen:null, kind:"find", text:r.r.text});
    bigMark(false); sfx.ng(); say(`「${ps.planks[i].word}」は丈夫な板だ。腐っておるのは…こっちだ！`, 2200);
    $("slot" + i).classList.add("right");
    await sleep(1200);
    if(armorOut()) return endByArmor();
  }
  const s = $("slot" + bad); s.className = "slot filled wrong"; s.id = "slotBad";
  $("pk" + bad).classList.add("rot");
  breakPlank(bad);
  await sleep(900);
  // 直す：正しい板を選ぶ
  const box = document.createElement("div");
  box.innerHTML = `<div class="ask" style="margin-top:14px">腐った「${esc(p.wrong)}」の代わりに架ける板は？</div>` +
    `<div class="opts">${shuffle(r.r.fix).map(w => `<button class="opt mincho" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div>`;
  $("board").appendChild(box);
  box.scrollIntoView({block:"nearest", behavior:"smooth"});
  setActiveGap(bad);
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => fixRotten(r, b));
  G.busy = false;
}
async function fixRotten(r, btn){
  if(G.busy || G.over) return; G.busy = true;
  const ps = r.ps, bad = r.bad, p = ps.planks[bad], w = btn.dataset.w, ok = w === p.word;
  document.querySelectorAll(".opt").forEach(b => b.disabled = true);
  btn.disabled = false; btn.classList.add(ok ? "picked-ok" : "picked-ng");
  const s = $("slotBad");
  if(ok){
    recordOk(); bigMark(true); sfx.ok();
    placePlank(bad, w, "good");
    s.insertAdjacentHTML("afterend", `<span class="slot filled right">${esc(w)}</span>`);
    say("これで橋は直った！ 渡るぞ！", 1400);
    await sleep(500);
  }else{
    recordNg({p:{a:"", b:"", ans:p.word, why:r.r.why}, chosen:w, kind:"fix", text:r.r.text});
    placePlank(bad, w);
    await sleep(350);
    bigMark(false); say(pickLine(NG_LINES));
    await failGap(bad > 0 ? bad : 0);
    placePlank(bad, p.word, "good");
    s.insertAdjacentHTML("afterend", `<span class="slot filled right">${esc(p.word)}</span>`);
    await waitNext(explainHtml(p.word, w, r.r.why));
    if(G.over) return;
    if(armorOut()) return endByArmor();
  }
  // 端から端まで渡る
  await walkTo(platCenter(SC.n), 600 * SC.n);
  setPose("attack"); sfx.clear();
  await sleep(900);
  afterRound();
}

/* =====================================================================
   結果
   ===================================================================== */
function finishStage(){
  if(G.over) return;
  G.over = true; stopTimer();
  const st = G.stage, sv = loadSave();
  let head, score, sub, newBest = false;
  if(st.kind === "challenge"){
    score = `${G.crossed}本`;
    head = "鎧の耐久戦";
    sub = `たどり着いた深さ：${TIERS[G.tier].name}　正解 ${G.ok}　まちがい ${G.ng}`;
    if(G.crossed > (sv.armorBest || 0)){ sv.armorBest = G.crossed; newBest = G.crossed > 0; }
  }else{
    const total = G.ok + G.ng;
    score = `${G.ok} / ${total}`;
    head = st.name.split("　")[1] + "　踏破！";
    sub = G.ng === 0 ? "一枚も割らずに渡りきった！" : `割った板：${G.ng}枚`;
    sv.clear = sv.clear || {};
    if(sv.clear[st.id] == null || G.ok > sv.clear[st.id]) sv.clear[st.id] = G.ok;
  }
  saveSave(sv);
  sfx.clear();
  const line = st.kind === "challenge"
    ? `鎧が砕けるまでに、板を割らずに${G.crossed}本の橋を渡った。割れた板の理由をたしかめて、次はもっと深くまで進むのだ。`
    : G.ng === 0 ? "見事だ！ おぬしの架ける橋なら、どんな谷でも渡れる。"
    : G.ng <= 2 ? "よくやった。割れた板の理由を、下でたしかめておくのだぞ。"
    : "板の働きを見直せば、もっと丈夫な橋が架けられるはずだ。";
  const misses = G.misses.map(m => {
    if(m.kind === "term"){
      return `<div class="miss"><div class="q mincho">${esc(m.q.miss)}</div><div class="w">「${esc(m.chosen)}」と答えた。${m.q.why}</div></div>`;
    }
    if(m.kind === "find" || m.kind === "fix"){
      const ps = parsePassage(m.text);
      const q = ps.parts.map((t, i) => esc(t) + (i < ps.planks.length ? (ps.planks[i].wrong ? `<s>${esc(ps.planks[i].wrong)}</s><u>${esc(ps.planks[i].word)}</u>` : esc(ps.planks[i].word)) : "")).join("");
      return `<div class="miss"><div class="q mincho">${q}</div><div class="w">${m.kind === "find" ? "腐った板を見のがした。" : `「${esc(m.chosen)}」に替えてしまった。`}${esc(m.p.why)}</div></div>`;
    }
    const p = m.p;
    const q = `${esc(p.a)}<u>${esc(p.ans)}</u>${esc(p.b)}`;
    const w = m.kind === "type"
      ? `働き：<b>${esc(TYPES[wordInfo(p.ans).t].name)}</b>（${esc(TYPES[m.chosen].name)}と答えた）。${esc(p.why)}`
      : `「${esc(m.chosen)}」を選んだ（${esc(typeName(m.chosen))}）。正解は${esc(typeName(p.ans))}。${esc(p.why)}`;
    return `<div class="miss"><div class="q mincho">${q}</div><div class="w">${w}</div></div>`;
  }).join("");
  $("resultBody").innerHTML = `
    ${knightHtml(st.kind === "challenge" ? "defeat" : G.ng === 0 ? "attack" : "pose1")}
    <h2 class="mincho">${esc(head)}</h2>
    <div class="score">${esc(score)}</div>
    <div class="sub">${esc(sub)}${newBest ? "　🎉 自己ベスト更新！" : ""}</div>
    <div class="speech">${esc(line)}</div>
    ${misses ? `<h3 style="margin-top:18px;font-size:15px;text-align:left">割れた板のふり返り</h3><div class="miss-list">${misses}</div>` : ""}
    <div class="foot-btns" style="margin-top:18px">
      <button class="btn primary" onclick="startStage(${st.id})">もう一度</button>
      <button class="btn" onclick="showTitle()">谷の地図へ</button>
    </div>`;
  show("result");
  $("result").scrollTop = 0;
}

/* =====================================================================
   板の図鑑
   ===================================================================== */
function showZukan(){
  const groups = TYPE_KEYS.map(g => {
    const terms = TERM_KEYS.filter(k => TERMS[k].g === g).map(k => {
      const t = TERMS[k];
      const ex = PAIRS.find(p => t.words.includes(p.ans));
      return `<div class="z-term">
        <div class="z-head"><span class="z-name mincho">${esc(k)}</span><span class="z-yomi">${esc(t.yomi)}</span></div>
        <div class="z-desc">${esc(t.desc)}</div>
        <div class="z-words">${t.words.map(w => `<span class="z-plank mincho">${esc(w)}</span>`).join("")}</div>
        ${ex ? `<div class="z-ex mincho">例）${esc(ex.a)}<u>${esc(ex.ans)}</u>${esc(ex.b)}</div>` : ""}
        ${t.note ? `<div class="z-note">${esc(t.note)}</div>` : ""}
      </div>`;
    }).join("");
    const many = TERM_KEYS.filter(k => TERMS[k].g === g).length > 1;   // 順接・逆接・転換は名前とかぶるので見出しを出さない
    return `<div class="z-group">${many ? `<h3 class="mincho">${esc(TYPES[g].name)}</h3>` : ""}${terms}</div>`;
  }).join("");
  $("zukanBody").innerHTML = `
    <h2 class="mincho z-title">📖 板の図鑑</h2>
    <div class="speech">接続語の働きには名前がある。<b>名前・読み・代表的な語</b>をセットで覚えるのだ。二の谷「名前の石碑」で腕だめしができるぞ。</div>
    ${groups}
    <div class="foot-btns" style="margin-top:18px">
      <button class="btn primary" onclick="startStage(2)">名前の石碑に挑む</button>
      <button class="btn" onclick="showTitle()">谷の地図へ</button>
    </div>`;
  show("zukan");
  $("zukan").scrollTop = 0;
}
