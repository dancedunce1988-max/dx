<!-- 通行証のチェック（2026-10-04〜、β版としてミニゲーム一覧に入れたとき、教員の指示）：知識ドリルDXの入口
     （kokugo_app.htmlのmgGoWithPass）を通らずに直接開いたときは「このファイルは開けません」とだけ表示し、ゲームを動かさない（2026-10-04〜、教員の指示。以前は本体へ戻していた）。
     sessionStorageが使えないときは、確かめようがないのでそのまま開く。 -->
<script>
(function(){
  var ok = true;
  try{ ok = !!(JSON.parse(sessionStorage.getItem("kokugo_mg_pass_v1") || "{}")["gihou"]); }catch(e){ ok = true; }
  if(!ok){ document.write('<style>html,body{margin:0;height:100%;background:#1d1f38;color:#fff;font-family:sans-serif}body{display:flex;align-items:center;justify-content:center}</style></head><body><p style="font-size:22px;font-weight:bold">このファイルは開けません</p><plaintext style="display:none">'); }
})();
</script>
<!-- 表現の魔術道（2026-10-03〜、試作。最初の仮題は「技法の魔導書」）。ジャンル「表現技法」(hyougen)をまるごと、漢字Questの「闇の魔術師」(me03)
     1体とのカードバトルにしたミニゲーム。
     ・魔術師が「呪文」（kokugo_data.jsの例文）を唱えると、魔法の玉が右の魔術師から左の自分のことのはに向かって飛んでくる。ことのははたまごから始まり、1問答えるとランダムな系統の龍として生まれ、正解を重ねるごとに伝説級まで育つ（育つほど反撃が強い）。
       玉が届く前に《　》の部分の技法カードをタップすると、ことのはから光弾が飛んで玉を打ち消し、そのまま魔術師に当たる。
       まちがえる／間に合わないと玉がプレイヤーに当たる。
     ・カードは毎回4枚。正解＋もとの4択の選択肢（開いている頁のものだけ）＋足りない分は開いている頁からランダムで、
       並びは毎回シャッフル（2026-10-03、教員の指示：「選択肢が多すぎてタップが大変、毎回シャッフルしながら4つに」）。
       「しおり」（ヒント、1回の挑戦で3枚）は4枚を2枚にしぼる。
     ・まちがえた（時間切れも）技法のカードは魔術師に「奪われ」、1〜2問あとに同じ技法の呪文が必ず来る。そこで正解すると
       「奪還」で2倍ダメージ。直喩→隠喩、擬音語→擬態語のような「紛らわしい対」を続けて唱える「対の詠唱」もある。
     ・玉が魔術師の近く（飛んできた道のりの40%まで）で打ち消すと「速詠返し」1.5倍。正解でたまる「魔術書ゲージ」が満タンの
       ときに正解すると「魔術書解放」2.5倍。
     ・3人の相手が順に勝負を仕掛けてくる：闇の魔術師見習い(基本6枚)→闇の魔術師(+倒置法・対句・反復法・呼びかけ、「名を問う詠唱」＝定義文から技法名を当てる、
       ときどき速い「加速の魔法」)→闇の大魔術師(+反語・破調、カードの説明文が消える、4問ごとに「結界の謎」＝詩の形式・字余りなど)。
     ・正解した例文は「魔術書」の頁に集まる（図鑑）。頁ごとに★1(3問正解)/★2(10問)/★3(その技法の呪文を全部集める)。
     本体のセーブデータには触れず、このページ専用の localStorage(SAVE_KEY) だけを使う。
     通行証のチェック（kokugo_mg_pass_v1）は2026-10-04に入れた（<title>の直後）。 -->
<script src="kokugo_data.js"></script>
<script src="enemy_sprites_data.js"></script>
<style>
  :root{
    --bg1:#07040f; --bg2:#140a2a; --bg3:#2a1450;
    --ink:#f3eeff; --sub:#b9a9dd; --gold:#ffd86b; --red:#ff5a7a; --green:#6bffb0; --cyan:#7ee8fa;
    --panel:rgba(255,255,255,.06); --line:rgba(255,255,255,.15);
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:radial-gradient(ellipse at 50% 0%, var(--bg3) 0%, var(--bg2) 45%, var(--bg1) 100%);
    background-color:var(--bg1);
    font-family:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased;
    user-select:none; -webkit-user-select:none;
  }
  button{ font-family:inherit; cursor:pointer; }
  .screen{ display:none; height:100vh; height:100dvh; flex-direction:column; }
  .screen.on{ display:flex; }

  /* ---------- タイトル ---------- */
  #title{ align-items:center; justify-content:center; gap:14px; padding:16px; text-align:center; overflow-y:auto; }
  #title .t-sprite{ height:min(30vh,220px); filter:drop-shadow(0 0 18px rgba(170,100,255,.7)); animation:float 3s ease-in-out infinite; }
  @keyframes float{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-8px) } }
  #title h1{ font-size:clamp(30px,6vh,48px); letter-spacing:.2em; color:var(--gold);
    text-shadow:0 0 14px rgba(255,200,80,.6), 0 2px 0 #5a2d00; font-family:'Yu Mincho','Hiragino Mincho ProN',serif; }
  #title .lead{ color:var(--sub); font-size:15px; line-height:1.7; max-width:520px; }
  .btnrow{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .btn{ border:none; border-radius:12px; padding:12px 22px; font-size:17px; font-weight:bold; color:#1a0b33;
    background:linear-gradient(180deg,#ffe9a0,#ffc83d); box-shadow:0 4px 0 #a86b00; }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #a86b00; }
  .btn.sub{ background:linear-gradient(180deg,#d9c8ff,#9d82e8); box-shadow:0 4px 0 #4b3593; }
  .btn.sub:active{ box-shadow:0 1px 0 #4b3593; }
  .btn.small{ padding:8px 16px; font-size:14px; }
  .btn.ghost{ background:var(--panel); color:var(--ink); box-shadow:none; border:1px solid var(--line); }
  .record{ font-size:13px; color:var(--sub); line-height:1.8; }
  .record b{ color:var(--gold); }

  /* ---------- バトル ---------- */
  #battle{ padding:8px 10px 10px; gap:6px; width:100%; max-width:960px; margin:0 auto; }
  .hud{ display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; }
  .bar-wrap{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .bar-wrap.right{ align-items:flex-end; }
  .bar-label{ font-size:12px; color:var(--sub); white-space:nowrap; }
  .bar{ width:100%; height:12px; border-radius:6px; background:rgba(255,255,255,.1); overflow:hidden; border:1px solid var(--line); }
  .bar > i{ display:block; height:100%; transition:width .35s; }
  #pHPbar > i{ background:linear-gradient(90deg,#3cd68a,#a6ffcf); }
  .xbar{ width:100%; height:4px; border-radius:2px; background:rgba(255,255,255,.08); overflow:hidden; }
  .xbar > i{ display:block; height:100%; background:linear-gradient(90deg,#7ee8fa,#d6fbff); transition:width .4s; }
  .dmg.exp{ font-size:14px; color:var(--cyan); top:auto; bottom:28px; text-shadow:0 0 6px #000; }
  #wHPbar > i{ background:linear-gradient(90deg,#b05cff,#ff6bd6); margin-left:auto; }
  .chapter{ font-size:13px; color:var(--gold); text-align:center; white-space:nowrap; font-weight:bold; }
  .iconbtn{ background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:3px 8px; font-size:14px; }

  /* 戦う場所：左＝自分のことのは、右＝闇の魔術師。魔法の玉は右から左へ飛ぶ */
  .field{ position:relative; flex:none; height:min(30vh,270px); display:flex; align-items:flex-end; justify-content:space-between; gap:8px;
    border-radius:14px; background:linear-gradient(180deg,rgba(255,255,255,0) 55%,rgba(170,100,255,.12)); padding:0 4%; }
  .me{ position:relative; height:100%; width:40%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; }
  #meLook{ height:calc(100% - 20px); display:flex; align-items:flex-end; justify-content:center; width:100%; }
  .me .halo{ height:100%; max-width:100%; }
  .me .halo img{ transform:scaleX(-1); } /* 元の絵は左向きなので、魔術師のいる右を向かせる */
  .me .emoji{ font-size:min(13vh,110px); line-height:1; filter:drop-shadow(0 0 14px rgba(255,216,107,.55)); }
  .me .mename{ position:relative; z-index:2; text-shadow:0 0 4px #000, 0 0 8px #000; font-size:12px; color:var(--gold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; margin-top:2px; }
  .me.hurt .halo, .me.hurt .emoji{ animation:hurt .5s; }
  @keyframes hurt{ 0%{ filter:drop-shadow(0 0 20px #ff2050) brightness(1.6) sepia(1) hue-rotate(-50deg) saturate(4); transform:translateX(-10px) } 100%{ } }
  .me.danger .halo, .me.danger .emoji{ filter:drop-shadow(0 0 16px #ff5a7a); }
  .me.fire .halo, .me.fire .emoji{ animation:fire .3s; }
  .me.wobble .halo, .me.wobble .emoji{ animation:wobble .8s ease-in-out; }
  @keyframes wobble{ 0%,100%{ transform:rotate(0) } 15%{ transform:rotate(-12deg) } 30%{ transform:rotate(10deg) } 45%{ transform:rotate(-8deg) }
                     60%{ transform:rotate(6deg) } 75%{ transform:rotate(-3deg) } }
  .me.evolve .halo, .me.evolve .emoji{ animation:evolve .9s ease-out; }
  @keyframes evolve{ 0%{ filter:brightness(4) drop-shadow(0 0 30px #fff); transform:scale(1.25) } 100%{ } }
  .me .mename .atk{ color:var(--cyan); margin-left:4px; }
  /* 龍の絵の「ふわふわの光の輪」（2026-10-03、教員の指示：「絵の周りが白っぽいのが違和感。もう少し広い範囲を同じような色で
     囲み、丸くふわふわした感じに」）。絵はもともと古紙色などの背景つきなので、その背景色（四すみの平均、--hc）で
     絵よりひと回り大きい丸い光を敷き、縁を雲のようにぼかす。絵の縁もマスクでぼかして、光の中に溶けこませる。 */
  .halo{ --hc:239,230,218; position:relative; aspect-ratio:1 / 1; display:flex; align-items:center; justify-content:center; isolation:isolate; }
  /* 光は絵の四すみまで包むように、箱より大きく広げる（絵そのものは切り抜かない） */
  .halo::before{ content:""; position:absolute; inset:-6%; border-radius:50%; z-index:-1; pointer-events:none;
    background:radial-gradient(circle closest-side, rgba(var(--hc),1) 0 84%, rgba(var(--hc),.8) 91%, rgba(var(--hc),.3) 96%, rgba(var(--hc),0) 100%);
    filter:blur(4px); animation:puff 3.2s ease-in-out infinite; }
  .halo::after{ content:""; position:absolute; inset:-14%; border-radius:50%; z-index:-1; pointer-events:none; filter:blur(8px); opacity:.85;
    background:
      radial-gradient(circle at 50% 14%, rgba(var(--hc),.9) 0 13%, transparent 14%),
      radial-gradient(circle at 80% 25%, rgba(var(--hc),.9) 0 12%, transparent 13%),
      radial-gradient(circle at 88% 55%, rgba(var(--hc),.9) 0 13%, transparent 14%),
      radial-gradient(circle at 74% 82%, rgba(var(--hc),.9) 0 12%, transparent 13%),
      radial-gradient(circle at 45% 88%, rgba(var(--hc),.9) 0 13%, transparent 14%),
      radial-gradient(circle at 18% 76%, rgba(var(--hc),.9) 0 12%, transparent 13%),
      radial-gradient(circle at 12% 45%, rgba(var(--hc),.9) 0 13%, transparent 14%),
      radial-gradient(circle at 22% 20%, rgba(var(--hc),.9) 0 12%, transparent 13%);
    animation:puffSpin 24s linear infinite; }
  @keyframes puff{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.04) } }
  @keyframes puffSpin{ to{ transform:rotate(360deg) } }
  /* 絵は切り抜かず、そのまま全部見せる（2026-10-03、教員の指示）。四角い線が目立たないよう、外側3%だけを薄くなじませる */
  .halo img{ max-width:66%; max-height:66%; object-fit:contain;
    -webkit-mask-image:linear-gradient(to right, transparent, #000 3%, #000 97%, transparent), linear-gradient(to bottom, transparent, #000 3%, #000 97%, transparent);
    -webkit-mask-composite:source-in;
    mask-image:linear-gradient(to right, transparent, #000 3%, #000 97%, transparent), linear-gradient(to bottom, transparent, #000 3%, #000 97%, transparent);
    mask-composite:intersect; }
  /* 手ごたえ：のけぞり・怒り状態・会心 */
  .stage.knock img{ animation:knock .42s ease-out; }
  @keyframes knock{ 0%{ transform:translateX(0) } 20%{ transform:translateX(26px) rotate(6deg) } 55%{ transform:translateX(-6px) rotate(-2deg) } 100%{ transform:none } }
  .stage.rage img{ animation:rage 1s ease-in-out infinite; }
  @keyframes rage{ 0%,100%{ filter:drop-shadow(0 0 12px #ff2040) } 50%{ filter:drop-shadow(0 0 30px #ff2040) saturate(1.4) brightness(1.1) } }
  .stage.rage.knock img{ animation:knock .42s ease-out; }
  /* 色違い：金と水色のオーラ。出現時は闇から浮かび上がる */
  .stage.shiny img{ filter:drop-shadow(0 0 14px #ffd86b) drop-shadow(0 0 28px #7ee8fa); }
  .stage.shiny.rage img{ animation:rageShiny 1s ease-in-out infinite; }
  @keyframes rageShiny{ 0%,100%{ filter:drop-shadow(0 0 14px #ffd86b) drop-shadow(0 0 24px #ff2040) } 50%{ filter:drop-shadow(0 0 22px #ffd86b) drop-shadow(0 0 40px #ff2040) brightness(1.15) } }
  .stage.appear img{ animation:appear 1.3s ease-out; }
  /* 相手ごとの見た目 */
  .stage img{ position:relative; z-index:1; }
  .stage.boss1 img{ filter:drop-shadow(0 0 6px rgba(190,150,255,.35)) saturate(.7) brightness(1.1); }
  .stage.boss2 img{ filter:drop-shadow(0 0 16px rgba(170,100,255,.85)) drop-shadow(0 0 4px #000); }
  .stage.boss3 img{ filter:drop-shadow(0 0 10px #000) drop-shadow(0 0 22px rgba(200,30,90,.8)) contrast(1.1); }
  .aura{ position:absolute; left:50%; bottom:3%; width:115%; height:104%; transform:translateX(-50%); z-index:0; pointer-events:none; opacity:0; transition:opacity .6s; }
  .stage.boss3 .aura, .stage.shiny .aura{ opacity:1; }
  .aura::before, .aura::after{ content:""; position:absolute; inset:0; border-radius:50% 50% 40% 40%; }
  .stage.boss3 .aura::before{ background:radial-gradient(ellipse at 50% 65%, rgba(170,0,70,.95), rgba(90,0,150,.75) 42%, rgba(40,0,60,.4) 60%, transparent 72%);
    filter:blur(10px); animation:auraPulse 1.6s ease-in-out infinite; }
  .stage.boss3 .aura::after{ background:conic-gradient(from 0deg, transparent 0 7%, rgba(255,40,110,.85) 10%, transparent 14% 28%, rgba(170,60,255,.85) 32%, transparent 36% 53%, rgba(255,40,110,.8) 57%, transparent 61% 76%, rgba(170,60,255,.8) 80%, transparent 84%);
    filter:blur(6px); animation:auraFlame 2.4s linear infinite; mix-blend-mode:screen; }
  .stage.shiny .aura::before{ background:radial-gradient(ellipse at 50% 70%, rgba(255,216,107,.5), rgba(126,232,250,.35) 45%, transparent 70%); filter:blur(12px); animation:auraPulse 1.4s ease-in-out infinite; }
  .stage.shiny .aura::after{ background:conic-gradient(from 0deg, transparent 0 10%, rgba(255,216,107,.55) 13%, transparent 17% 45%, rgba(126,232,250,.55) 48%, transparent 52% 80%, rgba(255,255,255,.5) 83%, transparent 87%);
    filter:blur(6px); animation:auraFlame 1.8s linear infinite; mix-blend-mode:screen; }
  @keyframes auraPulse{ 0%,100%{ transform:scale(1); opacity:.85 } 50%{ transform:scale(1.12); opacity:1 } }
  @keyframes auraFlame{ to{ transform:rotate(360deg) } }
  /* 入れかわり：倒れた相手は闇に消え、次の相手が降り立つ */
  .stage.leave img{ animation:leave .7s ease-in forwards; }
  @keyframes leave{ to{ opacity:0; transform:translateY(10px) scale(.85); filter:brightness(0) blur(2px); } }
  .stage.leave .aura{ opacity:0; }
  .stage.enter img{ animation:enter .9s cubic-bezier(.2,1.4,.4,1); }
  @keyframes enter{ 0%{ opacity:0; transform:translateY(-40px) scale(.7); filter:brightness(0) } 60%{ opacity:1; filter:brightness(1.6) } 100%{ transform:none } }
  /* 色違いの登場演出 */
  .shiny-dark{ position:fixed; inset:0; background:radial-gradient(ellipse at 70% 30%, rgba(30,0,60,.55), rgba(0,0,0,.88)); opacity:0; transition:opacity .6s; pointer-events:none; z-index:8; }
  .shiny-dark.on{ opacity:1; }
  /* 魔術書解放のカットイン */
  .cutin{ position:fixed; left:0; right:0; top:50%; height:170px; margin-top:-85px; z-index:14; pointer-events:none; overflow:hidden; }
  .cutin .band{ position:absolute; inset:0; background:linear-gradient(100deg, transparent 0 4%, var(--c2) 12%, var(--c1) 50%, var(--c2) 88%, transparent 96%);
    opacity:.92; transform:skewY(-4deg); box-shadow:0 0 40px var(--c1); animation:bandIn .35s ease-out both; }
  .cutin .band::after{ content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(100deg, rgba(255,255,255,.0) 0 18px, rgba(255,255,255,.35) 18px 22px); animation:speed .4s linear infinite; }
  @keyframes bandIn{ from{ transform:skewY(-4deg) scaleX(0); } }
  @keyframes speed{ to{ background-position:-120px 0; } }
  .cutin img, .cutin .ci-emoji{ position:absolute; left:6%; top:50%; height:200px; transform:translateY(-50%) scaleX(-1);
    filter:drop-shadow(0 0 18px #fff) drop-shadow(0 0 30px var(--c1)); animation:dragonIn .5s cubic-bezier(.2,1.4,.4,1) both .1s;
    -webkit-mask-image:radial-gradient(ellipse 72% 72% at 50% 50%, #000 55%, transparent 100%); mask-image:radial-gradient(ellipse 72% 72% at 50% 50%, #000 55%, transparent 100%); }
  .cutin .ci-emoji{ font-size:140px; height:auto; }
  @keyframes dragonIn{ from{ transform:translate(-120%,-50%) scaleX(-1); opacity:0; } }
  .cutin .ci-text{ position:absolute; left:34%; right:4%; top:50%; transform:translateY(-50%); text-align:left; }
  .cutin .ci-count{ color:#fff6b0; margin-left:8px; letter-spacing:.05em; }
  .cutin .ci-text small{ display:block; font-size:clamp(14px,2.2vw,20px); font-weight:bold; color:#fff; text-shadow:0 0 8px #000, 0 0 2px #000; letter-spacing:.15em;
    animation:fadeUp .4s ease-out both .2s; }
  .cutin .ci-text b{ display:block; font-family:'Yu Mincho','Hiragino Mincho ProN',serif; font-weight:900; font-size:clamp(30px,5.6vw,62px); color:#fff;
    letter-spacing:.08em; -webkit-text-stroke:1.5px rgba(0,0,0,.65); paint-order:stroke fill;
    text-shadow:0 0 6px #000, 0 0 14px var(--c2), 0 0 28px var(--c1), 0 4px 0 rgba(0,0,0,.5); opacity:0; transform:scale(2.2); }
  .cutin.name .ci-text b{ animation:nameIn .45s cubic-bezier(.2,1.4,.4,1) forwards; }
  .cutin.final .ci-text b{ color:#fff6d0; text-shadow:0 0 12px #ffd86b, 0 0 30px var(--c1), 0 0 50px #ff5a7a, 0 4px 0 rgba(0,0,0,.5); }
  @keyframes nameIn{ to{ opacity:1; transform:scale(1); } }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px); } }
  .cutin.out{ transition:opacity .4s, transform .4s; opacity:0; transform:scaleY(.2); }
  body.quake #battle{ animation:quake .12s linear infinite; }
  @keyframes quake{ 0%{ transform:translate(0,0) } 25%{ transform:translate(3px,-2px) } 50%{ transform:translate(-3px,2px) } 75%{ transform:translate(2px,3px) } 100%{ transform:translate(0,0) } }
  .lightning{ position:fixed; top:0; width:14px; height:62vh; margin-left:-7px; z-index:12; pointer-events:none;
    background:linear-gradient(180deg,#fff,#cfe9ff 60%,transparent); filter:drop-shadow(0 0 14px #9fd8ff) drop-shadow(0 0 30px #fff);
    clip-path:polygon(40% 0,70% 0,52% 35%,80% 35%,30% 100%,45% 55%,20% 55%); animation:zap .38s ease-out forwards; }
  @keyframes zap{ 0%{ opacity:1 } 60%{ opacity:1 } 100%{ opacity:0 } }
  .magic-circle{ position:fixed; width:0; height:0; z-index:9; pointer-events:none; }
  .magic-circle i{ position:absolute; left:50%; top:50%; border-radius:50%; transform:translate(-50%,-50%) scaleY(.32); }
  .magic-circle i:nth-child(1){ width:300px; height:300px; border:3px solid rgba(255,216,107,.9); box-shadow:0 0 24px #ffd86b, inset 0 0 24px #ffd86b; animation:circleIn 1s ease-out forwards, circleSpin 3s linear infinite; }
  .magic-circle i:nth-child(2){ width:230px; height:230px; border:2px dashed rgba(126,232,250,.95); box-shadow:0 0 18px #7ee8fa; animation:circleIn 1.2s ease-out forwards, circleSpinR 2.2s linear infinite; }
  .magic-circle i:nth-child(3){ width:150px; height:150px; border:4px double rgba(255,255,255,.9); animation:circleIn 1.4s ease-out forwards, circleSpin 1.6s linear infinite; }
  @keyframes circleIn{ from{ opacity:0; width:0; height:0 } }
  @keyframes circleSpin{ to{ transform:translate(-50%,-50%) scaleY(.32) rotate(360deg) } }
  @keyframes circleSpinR{ to{ transform:translate(-50%,-50%) scaleY(.32) rotate(-360deg) } }
  .magic-circle.out{ transition:opacity .6s; opacity:0; }
  .spark.gather{ position:fixed; width:9px; height:9px; margin:-4px 0 0 -4px; border-radius:50%; z-index:11; pointer-events:none; }

  .hand{ flex:none; display:grid; grid-template-columns:1fr 1fr; gap:8px; }

  .card{ position:relative; border:none; border-radius:12px; padding:8px 6px 7px; color:#fff; text-align:center;
    background:linear-gradient(160deg,var(--c1),var(--c2)); box-shadow:0 4px 0 rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.25);
    display:flex; align-items:center; justify-content:center; gap:10px; min-height:clamp(62px,9vh,86px); transition:transform .12s, opacity .2s, filter .2s; }

  /* ---------- 魔法の演出（画面全体に重ねる層） ---------- */
  #fx{ position:fixed; inset:0; pointer-events:none; z-index:10; overflow:hidden; }
  /* 魔法の玉。種類（v-○○）ごとに色・オーラ・大きさを変える。文字の説明は出さず、見た目だけで種類が伝わるようにする。
     v-normal＝ふつうの呪文（紫）／v-fast＝加速（小さく水色の稲妻）／v-steal＝奪った頁の呪文（赤黒＋鎖）／
     v-twin＝対の詠唱（金と水色の2つの玉がまわる）／v-name＝名を問う詠唱（銀白＋？）／v-barrier＝結界の謎（大きな金の結界玉） */
  .orb{ --d:46px; position:absolute; left:0; top:0; width:var(--d); height:var(--d); margin:calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
    border-radius:50%; display:none; align-items:center; justify-content:center;
    color:#fff; font-weight:900; font-family:'Yu Mincho','Hiragino Mincho ProN',serif; font-size:calc(var(--d) * .45); text-shadow:0 0 6px #000; }
  .orb::before{ content:""; position:absolute; inset:-9px; border-radius:50%; animation:spin .6s linear infinite; }
  .orb::after{ content:""; position:absolute; }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  .orb.v-normal{ background:radial-gradient(circle at 35% 32%, #fbe9ff 0%, #c27bff 28%, #6a12c9 62%, #22003f 100%);
    box-shadow:0 0 18px 6px rgba(176,96,255,.75), 0 0 40px 10px rgba(120,30,200,.45); }
  .orb.v-normal::before{ background:conic-gradient(from 0deg, transparent 0 20%, rgba(230,180,255,.9) 25%, transparent 32% 55%, rgba(230,180,255,.9) 60%, transparent 67%); }
  .orb.v-fast{ --d:30px; background:radial-gradient(circle at 35% 32%, #f2feff 0%, #7ee8fa 30%, #1f7ea8 65%, #04233a 100%);
    box-shadow:0 0 14px 5px rgba(126,232,250,.85), 0 0 30px 8px rgba(30,140,200,.5); }
  .orb.v-fast::before{ inset:-7px; animation-duration:.18s;
    background:conic-gradient(from 0deg, transparent 0 10%, #fff 12%, transparent 15% 40%, #aef6ff 42%, transparent 45% 70%, #fff 72%, transparent 75%); }
  .orb.v-steal{ --d:54px; background:radial-gradient(circle at 35% 32%, #ffe3e8 0%, #ff5a7a 24%, #7a0026 58%, #0d0006 100%);
    box-shadow:0 0 20px 7px rgba(255,40,90,.7), 0 0 44px 14px rgba(40,0,10,.85); }
  .orb.v-steal::before{ inset:-8px; border:3px dashed rgba(255,190,200,.85); animation-duration:1.4s; }
  .orb.v-twin{ --d:38px; background:radial-gradient(circle at 35% 32%, #fffbe6 0%, #ffd86b 30%, #a8630a 65%, #2a1600 100%);
    box-shadow:0 0 16px 6px rgba(255,216,107,.75), 0 0 34px 10px rgba(200,140,20,.4); }
  .orb.v-twin::before{ inset:-26px; animation-duration:.9s;
    background:radial-gradient(circle at 50% 8%, #f2feff 0, #7ee8fa 7px, rgba(126,232,250,.5) 10px, transparent 13px); }
  .orb.v-name{ --d:46px; background:radial-gradient(circle at 35% 32%, #ffffff 0%, #dfe3ff 30%, #7076b8 65%, #191a3a 100%);
    box-shadow:0 0 18px 6px rgba(220,225,255,.75), 0 0 40px 10px rgba(120,130,220,.4); }
  .orb.v-name::before{ inset:-8px; animation-duration:2.4s; border:2px dotted rgba(255,255,255,.85); }
  .orb.v-barrier{ --d:80px; background:radial-gradient(circle at 35% 32%, #fffbe0 0%, #ffd86b 22%, #8a5200 56%, #1a0f00 100%);
    box-shadow:0 0 26px 10px rgba(255,216,107,.7), 0 0 60px 20px rgba(160,100,0,.45); }
  .orb.v-barrier::before{ inset:-14px; animation-duration:4s; border:4px double rgba(255,236,170,.95); border-radius:22%; }
  .orb.v-barrier::after{ inset:-14px; border:2px solid rgba(255,236,170,.6); border-radius:22%; transform:rotate(45deg); animation:spinR 5s linear infinite; }
  @keyframes spinR{ from{ transform:rotate(45deg) } to{ transform:rotate(-315deg) } }
  /* もうすぐ当たる：色はそのままで、赤い光が脈打つ */
  .orb.danger{ animation:dangerPulse .28s ease-in-out infinite alternate; }

<script>
"use strict";
/* ================= データ ================= */
const ITEMS = (window.QUESTION_DATA && window.QUESTION_DATA.cats.hyougen) ? window.QUESTION_DATA.cats.hyougen.items : [];

// 技法カード12枚。seal＝カードの印（漢字1字）、hint＝第一章・第二章だけカードに出る短い説明、def＝魔術書の頁の説明。
const CARDS = [
  { id:'直喩',   seal:'直', c1:'#4f7cff', c2:'#2a3f9e', hint:'「ような」でたとえる',   def:'「ようだ」「みたいだ」「ごとし」など、たとえだとわかる言葉を使ってたとえる技法。' },
  { id:'隠喩',   seal:'隠', c1:'#2fb3c9', c2:'#17606e', hint:'「ような」なしでたとえる', def:'「ようだ」などを使わずに、「AはBだ」のように直接たとえる技法。暗喩ともいう。' },
  { id:'擬人法', seal:'人', c1:'#4fc46a', c2:'#22683a', hint:'人でないものを人のように', def:'人でないもの（花・風・町など）を、人のように「話す」「笑う」「踊る」などと表す技法。' },
  { id:'擬音語', seal:'音', c1:'#ff9b3d', c2:'#9e4a0a', hint:'聞こえる音をまねる',     def:'実際に耳に聞こえる音や声をまねた言葉（ざあざあ・ワンワン・ガタン）。' },
  { id:'擬態語', seal:'態', c1:'#ffc93d', c2:'#9a6a00', hint:'様子を音のように表す',   def:'音のしない様子や状態を、音のような言葉で表したもの（きらきら・にっこり・のろのろ）。' },
  { id:'体言止め', seal:'体', c1:'#c45cff', c2:'#5e1f8a', hint:'名詞で文を止める',     def:'文の終わりを名詞（体言）で止めて、余韻や印象を残す技法。' },
  { id:'倒置法', seal:'倒', c1:'#ff5a7a', c2:'#8f1530', hint:'語順を入れかえる',       def:'ふつうの言葉の順序を入れかえて、前に出した部分を強める技法。' },
  { id:'対句',   seal:'対', c1:'#5a8cff', c2:'#3a2a9e', hint:'似た組み立てを並べる',   def:'組み立てが似ている言葉や文を並べて、リズムや対比を生む技法。' },
  { id:'反復法', seal:'復', c1:'#3ad0a0', c2:'#126e55', hint:'同じ言葉をくり返す',     def:'同じ言葉やフレーズをくり返して、気持ちの強さや印象を強める技法。' },
  { id:'呼びかけ', seal:'呼', c1:'#ff7ad0', c2:'#8a1f6a', hint:'「〜よ」と語りかける', def:'人やものに向かって「〜よ」などの形で直接語りかける技法。' },
  { id:'反語',   seal:'反', c1:'#9a7cff', c2:'#3f2a8a', hint:'疑問の形で反対を言う',   def:'「〜だろうか（いや、〜ない）」のように、疑問の形で反対の意味を強く伝える技法。' },
  { id:'破調',   seal:'破', c1:'#e0643a', c2:'#6e2410', hint:'音数のリズムをくずす',   def:'短歌や俳句などで、決まった音数のリズムをわざと大きくくずす技法。' },
];
const CARD = Object.fromEntries(CARDS.map(c => [c.id, c]));
const CARD_IDS = new Set(CARDS.map(c => c.id));

// まぎらわしい対（正解した直後に35%の確率で相手側の技法を続けて唱える。4枚の手札にも優先して入れる）
const TWINS = { '直喩':'隠喩', '隠喩':'直喩', '擬音語':'擬態語', '擬態語':'擬音語', '対句':'反復法', '反復法':'対句',
                '倒置法':'体言止め', '体言止め':'倒置法', '反語':'呼びかけ', '呼びかけ':'反語', '擬人法':'直喩', '破調':'対句' };

const GENERIC_PRE = /^次の文で使われている表現技法として正しいものはどれか。$/;

// 問題を3種類に分ける
//  spell   … 例文の技法をカードで答える（正解が技法カードで、4択がすべて技法名のもの）
//  name    … 「〇〇とは、どのような表現技法か」の定義文を見せて、技法名をカードで答える
//  barrier … それ以外（詩の形式・字余り・ちがいの説明など）。終章の「結界の謎」として4択で出す
const SPELLS = [], BARRIERS = [];
ITEMS.forEach((it, idx) => {
  const ans = it.c[it.a];
  const m = it.q.match(/^(.+?)とは、どのような(?:表現技法|言葉)か/);
  if(m && CARD_IDS.has(m[1])){
    SPELLS.push({ idx, kind:'name', ans:m[1], pre:'', body:ans, lv:it.lv, orig:[m[1]], e:it.e || '' });
  }else if(CARD_IDS.has(ans) && it.c.every(x => CARD_IDS.has(x)) && !/あてはまらない/.test(it.q)){
    const lines = it.q.split('\n');
    let pre = '', body = it.q;
    if(lines.length > 1){ pre = GENERIC_PRE.test(lines[0]) ? '' : lines[0]; body = lines.slice(1).join('\n'); }
    SPELLS.push({ idx, kind:'spell', ans, pre, body, lv:it.lv, orig:it.c.slice(), e:it.e || '', collect:/《/.test(body) });
  }else{
    BARRIERS.push({ idx, kind:'barrier', q:it.q, choices:it.c.slice(), ans, lv:it.lv, e:it.e || '' });
  }
});
const COLLECT_TOTAL = {};
SPELLS.forEach(s => { if(s.collect) COLLECT_TOTAL[s.ans] = (COLLECT_TOTAL[s.ans] || 0) + 1; });
// 頁の「見分け方」は、データの解説文の【見分け方】の部分から取る
const TIPS = {};
ITEMS.forEach(it => {
  const ans = it.c[it.a];
  if(!CARD_IDS.has(ans) || TIPS[ans] || !it.e) return;
  const m = it.e.match(/【見分け方】([\s\S]*)$/);
  if(m) TIPS[ans] = m[1].trim();
});

// 章ごとの強さ（2026-10-03、教員の指示：「1体目は無強化でも攻略できるくらい、それ以降は魔術師レベルが上がってはじめて
// 攻略できるくらい。初めの方の魔術師は小さく、だんだん大きく」）。何度も挑戦して強くなる流れごとシミュレーションした目安：
// 正答率90%の生徒は、1回目は第一章はほぼ突破、全クリは約1割。初めての全クリは4回目ごろ（正答率97%なら2回目、80%なら12回目）。
// loss＝まちがえたときに受けるダメージ（lossTimeout＝時間切れ）、scale＝魔術師の大きさ（戦う場所の高さに対する割合）。
// 正解し続けても負けることがある（2026-10-03、教員の指示：「正解し続けると負けないのはつまらない」）：
//  ・余波：正解でも、玉が道のりの半分より近づいてから打ち消すと、loss×最大30%（ぎりぎりほど大きい）を受ける
//  ・闇の追撃：chaseEvery回の詠唱ごとに、防げない攻撃（chase）。守りで軽くなり、運でかわせる
// 章ではなく「3人の相手が順に勝負を仕掛けてくる」設定（2026-10-03、教員の指示）。
// foe＝相手の名前、short＝上の小さな見出し、look＝見た目のクラス（boss1：小さく淡い／boss2：大きく濃い紫の光／boss3：闇のオーラ）。
// lines：登場・倒れたとき・怒ったときの台詞。
// 強さの目安（2026-10-04、教員の指示でシミュレーションして調整。正答率80%の生徒がその相手に挑んだときの勝率）：
//  闇の魔術師見習い：強化なしでもほぼ100%。
//  闇の魔術師：まちがえたときの一撃が重い（140）。Lv.5〜7で54%、Lv.8〜9で82%、Lv.10〜12で96%（＝Lv.10あれば突破できる）。
//  闇の大魔術師：Lv.20〜24で52%、Lv.30〜34で75%、Lv.40〜49で87%（＝Lv.30あれば突破できる）。
const PHASES = [
  { foe:'闇の魔術師見習い', short:'見習い', look:'boss1', add:['直喩','隠喩','擬人法','擬音語','擬態語','体言止め'], lv:[1,3], castSec:9, hp:120, loss:20, lossTimeout:16, chaseEvery:5, chase:6, scale:.44,
    hideHint:false, nameAsk:false, fast:false, barrierEvery:0,
    intro:'し、師匠に言われて来ました…！ その魔術書、いただきます！',
    lines:{ defeat:'う、うわぁ…師匠〜！', rage:'ひ、ひぃ…もう本気出しちゃいます！' },
    note:'闇の魔術師見習いの魔法の玉が、左にいるあなたのことのはに向かって飛んでくる。届く前に、《　》の部分の技法のカードをタップして打ち消そう！\n早く打ち消すほど大ダメージ。ぎりぎりで打ち消すと余波を受ける。ときどき防げない「闇の追撃」も放ってくる。' },
  { foe:'闇の魔術師', short:'魔術師', look:'boss2', add:['倒置法','対句','反復法','呼びかけ'], lv:[2,4], castSec:8, hp:640, loss:140, lossTimeout:125, chaseEvery:4, chase:30, scale:.8,
    hideHint:false, nameAsk:true, fast:true, barrierEvery:0,
    intro:'見習いを倒したのはお前か。ならば、この私が相手をしよう。',
    lines:{ defeat:'くっ…大魔術師様、あとはお願いします…', rage:'おのれ…本気を出してやる！' },
    note:'見習いとは比べものにならない強さだ！ 歯が立たないときは、魔術ステータスを鍛えてから何度でも挑もう。\n新しい頁が4枚開いた。魔法の種類も増える。小さく速い水色の玉、金色のまわりを水色の玉がまわる玉、技法の説明だけを唱える銀色の「？」の玉…。玉の見た目をよく見よう！' },
  { foe:'闇の大魔術師', short:'大魔術師', look:'boss3', add:['反語','破調'], lv:[3,5], castSec:7.5, hp:2200, loss:200, lossTimeout:180, chaseEvery:3, chase:65, scale:1,
    hideHint:true, nameAsk:true, fast:true, barrierEvery:4,
    intro:'我が弟子たちを退けるとは…。闇の大魔術師、ここに参る！',
    lines:{ defeat:'見事だ…と言いたいところだが…', rage:'我が真の闇、とくと味わうがいい！' },
    note:'闇のオーラをまとった、弟子たちとは格のちがう相手だ。最後の2枚の頁が開いた。闇の力で、カードの説明が消えてしまう。ときどき、「封」の字の入った大きな金色の結界玉がゆっくり迫ってくる。' },
];
// 色違いの闇の魔術師（2026-10-03、教員の指示：「全クリしたら30%の確率で色違いが勝負を挑む。能力値を跳ね上げて、
// それまで集めたアイテムを駆使してようやく倒せる。倒したらこのゲームの経験値が普通の倍」）。
// 強さは「魔術ステータス」の強化とあわせてシミュレーションで調整：強化なしではほぼ勝てず、うまく強化を重ねると勝てるようになる。
// 2026-10-03、教員の指示で「必ず出る」に変更（もとは30%）。
const SHINY_CHANCE = 1;
const SHINY_PHASE = { foe:'色違いの闇の大魔術師', short:'色違い', look:'shiny', add:[], lv:[3,5], castSec:6, hp:1900, chaseEvery:3, chase:65, scale:1,
  hideHint:true, nameAsk:true, fast:true, fastP:.4, barrierEvery:3, shiny:true,
  taken:.45,       // 受けるダメージ（こちらの反撃）は0.45倍
  loss:200, lossTimeout:180, // こちらが受けるダメージ（2026-10-04、教員の指示：攻撃力は少なくとも大魔術師と同じ）
  heal:.3,         // HPが半分を切ると、1回だけ最大HPの30%を回復する
  rageAt:.4, rageMult:.8, // HPが4割を切ると怒り、玉がさらに速くなる
  intro:'…ほう、我が影を退けたか。ならば、本当の闇を見せてやろう。',
  lines:{ defeat:'ば、ばかな…この我が…！', rage:'この我を追いつめるとは…！ 許さぬ！' },
  note:'色違いの闇の大魔術師が現れた！ これまでとは比べものにならない強さだ。\n・反撃のダメージが通りにくい\n・魔法が速く、当たると痛い\n・一度だけ傷を癒やす\nこれまで高めてきた魔術の力が試される。倒せば経験値が2倍！' };
const GAUGE_MAX = 5;

/* ================= セーブ（このページ専用） ================= */
const SAVE_KEY = 'gihou_madousho_v1';
function emptySave(){ return { v:1, stats:{}, got:{}, barrierGot:{}, dragons:{}, exp:0, achv:{}, power:{}, best:null, clears:0, plays:0, sound:true }; }
let SAVE = emptySave();
try{
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if(s && s.v === 1) SAVE = Object.assign(emptySave(), s);

function tintHalos(root){
  (root || document).querySelectorAll('.halo').forEach(h => {
    const img = h.querySelector('img'); if(!img) return;
    const src = img.getAttribute('src');
    const apply = col => h.style.setProperty('--hc', col);

        const c = document.createElement('canvas'), w = c.width = im.naturalWidth, hh = c.height = im.naturalHeight;
        const x = c.getContext('2d'); x.drawImage(im, 0, 0);
        // 端ぎりぎりは暗い縁取りのことがあるので少し内側を読み、明るいほう半分の平均を使う（絵の背景の色に近くなる）
        const ix = Math.round(w * .07), iy = Math.round(hh * .07), samples = [];
        let clear = 0;
        [[ix,iy],[w-1-ix,iy],[ix,hh-1-iy],[w-1-ix,hh-1-iy],[w>>1,iy],[w>>1,hh-1-iy],[ix,hh>>1],[w-1-ix,hh>>1],
         [w>>2,iy],[w*3>>2,iy],[w>>2,hh-1-iy],[w*3>>2,hh-1-iy]].forEach(([px, py]) => {

// 魔術ステータス（2026-10-03、教員の指示：「漢字Questのように少しずつキャラそのものを強化していく方式に。ただし今のように
// 3つに1つをランダムで強化。強化がうまくいくと色違いを倒せるように」。名前は知識ドリル全体の「ことのは」のステータスと
// 混同しないよう「魔術ステータス」。どれもLv.100まで上げられ、やりこむほど少しずつ強くなる）。
// 章を突破するたびに、7つの能力のうち3つが（中身を見せずに）候補に出て、1つを選ぶ。上がった能力はずっと残る（SAVE.power）。
// 1回の強化は＋3、まれに＋6（★レア、20%）・＋10（★★超レア、5%）。Lv.100に届いた能力は候補に出ない。
// 伸び方はシミュレーションで調整：毎回うまく選ぶと、色違いへの勝率は正答率90%の生徒で10回クリア4%→20回28%→30回79%→40回99%。
const POWER_MAX = 100;
const pct = v => String(Math.round(v * 10) / 10); // 7.5→"7.5"、6→"6"
const POWERS = [
  { id:'hp',    icon:'❤️', name:'体力',   eff:n => `最大HP ＋${n * 2}` },
  { id:'atk',   icon:'⚔️', name:'攻撃',   eff:n => `反撃のダメージ ＋${pct(n * 1.2)}%` },
  { id:'def',   icon:'🛡️', name:'守り',   eff:n => `受けるダメージ −${n * 5}（1回のダメージの75%まで）` },
  { id:'spd',   icon:'💨', name:'素早さ', eff:n => `魔法の玉が届くまでの時間 ＋${pct(n * .6)}%` },
  { id:'luck',  icon:'🍀', name:'運',     eff:n => `${pct(n * .3)}%の確率で魔法をかわす` },
  { id:'magic', icon:'✨', name:'魔力',   eff:n => `魔術書解放 ＋${n}%${Math.floor(n / 25) ? `・ゲージが最初から${Math.floor(n / 25)}` : ''}` },
  { id:'wis',   icon:'🔖', name:'知恵',   eff:n => Math.floor(n / 20) ? `最初のしおり ＋${Math.floor(n / 20)}枚${n < 100 && n % 20 ? `（あとLv.${20 - n % 20}でもう1枚）` : ''}` : `Lv.20ごとに最初のしおり＋1枚（あとLv.${20 - n}）` },
].map(x => Object.assign(x, { max:POWER_MAX }));
const POWER = Object.fromEntries(POWERS.map(x => [x.id, x]));
function pw(id){ return Math.min(POWER_MAX, (SAVE.power && SAVE.power[id]) || 0); }
const PW = {
  hpPlus:  () => pw('hp') * 2,
  atkMult: () => 1 + pw('atk') * .012,
  // 守り：受けるダメージから「Lv×5」を引く（ただし1回のダメージの75%まで）。2026-10-04、教員の指示：
  // 「闇の魔術師の強い一撃は、守りLv.10くらいで防げるように」→守りLv.10で−50（魔術師のまちがい140が90に）
  reduce:  raw => Math.max(1, Math.round(raw - Math.min(raw * .75, pw('def') * 5))),
  spdMult: () => 1 + pw('spd') * .006,
  dodge:   () => pw('luck') * .003,
  relMult: () => 1 + pw('magic') * .01,
  gauge0:  () => Math.floor(pw('magic') / 25),
  hints0:  () => 3 + Math.floor(pw('wis') / 20),
};
function rollPowerChoices(){
  const pool = shuffle(POWERS.filter(x => pw(x.id) < x.max)).slice(0, 3);
  return pool.map(x => {
    const r = Math.random();
    const tier = r < .05 ? 3 : r < .25 ? 2 : 1;
    const amt = Math.min(x.max - pw(x.id), [0, 3, 6, 10][tier]);
    return { id:x.id, amt, tier };
  });
}

    <div class="chests four">${picks.map((r, i) => `<button class="chest pchoice hidden" data-i="${i}"><span class="ci">🔮</span><span class="cn">？</span><span class="cd"></span></button>`).join('')}

// 強化を保存し、今の挑戦にもすぐ反映する
function applyPower(id, amt){
  if(!SAVE.power) SAVE.power = {};
  const before = pw(id);
  SAVE.power[id] = Math.min(POWER[id].max, before + amt);
  const add = SAVE.power[id] - before;
  writeSave();
  if(id === 'hp'){ G.pMax += add * 2; G.pHP += add * 2; meFloat(`最大HP +${add * 2}`, 'grow'); }
  if(id === 'magic'){ G.gauge = Math.min(GAUGE_MAX, G.gauge + Math.floor(SAVE.power[id] / 25) - Math.floor(before / 25)); }
  if(id === 'wis'){ G.hints += Math.floor(SAVE.power[id] / 20) - Math.floor(before / 20); }
  if(Object.values(SAVE.power).reduce((a, b) => a + b, 0) >= 100) unlock('power30');
}

const MG_PENDING_LVUP_LSKEY = 'kokugo_minigame_pending_lvups_v1';
function mgAddGenreLevel(n){
  try{
    let o = null;

    if(!o || typeof o !== 'object') o = {};
    o.hyougen = (Number(o.hyougen) || 0) + n;
    // 答えた日付（本体はこれが今日なら、デイリーログイン報酬を成立させる）

function pickSpell(){
  const ph = G.phases[G.phase];
  // 奪われた頁のカウントダウン。0になった技法は必ず次に唱える
  let target = null;
  G.stolen.forEach((due, t) => { G.stolen.set(t, due - 1); });
  G.stolen.forEach((due, t) => { if(!target && due <= 0) target = t; });
  let twin = false;
  if(!target && G.lastOkTech && TWINS[G.lastOkTech] && G.cards.includes(TWINS[G.lastOkTech]) && Math.random() < .35){
    target = TWINS[G.lastOkTech]; twin = true;
  }
  const base = s => G.cards.includes(s.ans) && (s.kind === 'spell' || ph.nameAsk);
  const tries = [
    s => base(s) && !G.used.has(s.idx) && (s.kind === 'name' || (s.lv >= ph.lv[0] && s.lv <= ph.lv[1])),
    s => base(s) && !G.used.has(s.idx),
    s => base(s),
  ];
  for(const useTarget of [true, false]){
    if(useTarget && !target) continue;
    for(const f of tries){
      const pool = SPELLS.filter(s => f(s) && (!useTarget || s.ans === target));
      if(!pool.length) continue;
      // 名を問う詠唱は出すぎないように重みを下げる。苦手な技法ほど出やすい
      const q = weightedPick(pool, s => (1 + 3 * errRate(s.ans)) * (s.kind === 'name' ? .35 : 1));
      return { q, twin: useTarget && twin, forced: useTarget && !twin };
    }
  }
  return { q: SPELLS[0], twin:false, forced:false };
}

// 手札4枚：正解＋もとの4択の選択肢（開いている頁のもの）＋まぎらわしい対＋開いている頁からランダム。並びは毎回シャッフル
function buildHand(cur){
  const ans = cur.ans;
  let d = shuffle(cur.orig.filter(t => t !== ans && G.cards.includes(t)));
  const tw = TWINS[ans];
  if(tw && tw !== ans && G.cards.includes(tw) && !d.includes(tw)) d.unshift(tw);
  d = d.slice(0, 3);
  const rest = shuffle(G.cards.filter(t => t !== ans && !d.includes(t)));
  while(d.length < 3 && rest.length) d.push(rest.shift());
  return shuffle([ans].concat(d));
}

function nextSpell(){
  if(G.over) return;
  const ph0 = G.phases[G.phase];
  // 闇の追撃（詠唱がchaseEvery回終わるごと）
  if(ph0.chaseEvery && G.spellNo > 0 && G.spellNo % ph0.chaseEvery === 0 && G.lastChase !== G.spellNo){
    G.lastChase = G.spellNo; G.busy = true;
    darkChase(ph0).then(() => { if(G.pHP <= 0) endRun(G.shiny); else nextSpell(); });
    return;
  }
  const ph = G.phases[G.phase];
  G.spellNo++;
  G.usedHintNow = false;
  $('scroll').classList.remove('veil');
  let speedMult = 1;
  const isBarrier = ph.barrierEvery && G.spellNo % ph.barrierEvery === 0 && BARRIERS.length;
  if(isBarrier){
    const pool = BARRIERS.filter(b => !G.used.has(b.idx));
    const b = weightedPick(pool.length ? pool : BARRIERS, x => 1 + (SAVE.barrierGot[x.idx] ? 0 : 1));
    G.cur = b; G.used.add(b.idx);
    renderBarrier(b);
    orbKind = 'barrier';
    say('結界よ、閉じよ…！', 1500);
  }else{
    const r = pickSpell();
    G.cur = r.q; G.used.add(r.q.idx);
    G.hand = buildHand(r.q);
    if(ph.fast && !r.forced && Math.random() < (ph.fastP || .25)){ speedMult = .65; orbKind = 'fast'; }
    else if(r.forced) orbKind = 'steal';
    else if(r.twin) orbKind = 'twin';
    else if(r.q.kind === 'name') orbKind = 'name';
    else orbKind = 'normal';
    renderSpell(r.q);
    if(r.forced) say('この頁の力、使わせてもらうぞ', 1500);
    else if(r.twin) say('次は見分けられるかな？', 1500);
  }
  const len = (G.cur.body || G.cur.q || '').length;
  G.castDur = (ph.castSec + Math.min(5, len * .05) + (G.cur.kind === 'barrier' ? 6 : 0)) * speedMult * (G.rage ? (ph.rageMult || .85) : 1) * PW.spdMult();
  // 魔法を放つ
  setPose('attack', 500); beep('cast');
  G.path = orbPath();
  const o = $('orb'); o.className = 'orb v-' + orbKind; o.textContent = ORB_LOOK[orbKind].mark; o.style.display = 'flex';
  placeOrb(G.path(0), 0);
  burst(orbPos.x, orbPos.y, ORB_LOOK[orbKind].burst, orbKind === 'barrier');
  G.elapsed = 0; G.lastFrame = performance.now(); G.ticked = false;
  G.busy = false;
  updateHintBtn();
  requestAnimationFrame(tick);
}

function tick(now){
  if(!G || G.over || G.busy) return;
  const dt = Math.max(0, Math.min(.1, (now - G.lastFrame) / 1000)); G.lastFrame = now;
  if(!G.paused) G.elapsed += dt;
  const t = Math.min(1, G.elapsed / G.castDur);
  if(!G.paused){
    placeOrb(G.path(t), t);
    const danger = t > .75;
    $('orb').classList.toggle('danger', danger);
    $('me').classList.toggle('danger', danger);
    if(danger && !G.ticked){ G.ticked = true; beep('tick'); }
  }
  if(t >= 1){ answer(null); return; }
  requestAnimationFrame(tick);
}

function useHint(){

  const cur = G.cur;
  const wrongs = shuffle([...$('hand').querySelectorAll('[data-t]')].filter(x => x.dataset.t !== cur.ans)).slice(0, 2);

function answer(t, el){
  if(!G || G.busy || G.over || G.paused) return;
  if(el && el.classList.contains('dim')) return;
  G.busy = true;
  $('bHint').disabled = true;
  const cur = G.cur;
  const ok = t !== null && t === cur.ans;
  const prog = Math.min(1, G.elapsed / G.castDur);
  if(ok) onCorrect(cur, el, prog); else onWrong(cur, el, t === null);
}

async function onCorrect(cur, el, prog){
  G.correct++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
  mgAddGenreLevel(1);
  renderGenreLv(true);
  let dmg = cur.kind === 'barrier' ? 30 : 15;
  dmg += Math.min(G.combo - 1, 5) * 2;
  dmg = Math.round(dmg * (1 + G.dragon.stage * DRAGON_ATK_PER_STAGE + G.atkBuff) * PW.atkMult());
  const phNow = G.phases[G.phase];
  const tags = [];
  const crit = prog < .4;
  const splashRaw = (!crit && prog > .5) ? Math.round((G.phases[G.phase].loss || 25) * SPLASH_RATE * (prog - .5) / .5) : 0;
  if(crit){ dmg = Math.round(dmg * 1.5); G.crit++; }
  if(cur.kind !== 'barrier' && G.stolen.has(cur.ans)){
    dmg *= 2; tags.push('奪還！'); G.stolen.delete(cur.ans); G.reclaim++;
  }
  if(cur.kind === 'barrier') tags.unshift('結界破り！');
  const release = G.gauge >= GAUGE_MAX;
  // 魔術書解放は、同じ相手との戦いの中で放つたびに威力が1.2倍ずつ重なる。相手が変わるとリセット（2026-10-04、教員の指示）
  const relStack = release ? Math.pow(RELEASE_GROWTH, G.foeRelease || 0) : 1;
  if(release){ dmg = Math.round(dmg * 2.5 * PW.relMult() * relStack); G.gauge = 0; G.release++; G.foeRelease = (G.foeRelease || 0) + 1; }
  else G.gauge = Math.min(GAUGE_MAX, G.gauge + (prog < .4 ? 2 : 1));
  if(phNow.taken) dmg = Math.max(1, Math.round(dmg * phNow.taken));
  const expNow = Math.max(1, Math.round(Math.min(dmg, G.wHP) * EXP_PER_HP * (G.shiny ? 2 : 1)));
  G.wHP = Math.max(0, G.wHP - dmg); G.dmgTotal += dmg;
  // 記録
  if(cur.kind === 'barrier'){ SAVE.barrierGot[cur.idx] = true; }
  else{
    techStat(cur.ans).c++;
    if(cur.collect && !SAVE.got[cur.idx]){ SAVE.got[cur.idx] = true; G.newGot++; tags.push('📖記録'); }
    G.lastOkTech = cur.ans;
  }
  writeSave();

  // 演出：カード→玉（打ち消し）→魔術師（命中）
  const card = cur.kind === 'barrier' ? null : cur.ans;
  const color = card ? CARD[card].c1 : '#ffd86b';
  // 反撃の光弾は自分のことのはから撃つ（押したカードは光らせるだけ）
  const from = meCenter();
  if(el) el.classList.add(cur.kind === 'barrier' ? 'right' : 'shot');
  $('me').classList.add('fire'); setTimeout(() => $('me').classList.remove('fire'), 320);
  const hitAt = { x:orbPos.x, y:orbPos.y };
  const mv = release ? Object.assign(releaseMove(), { count:G.foeRelease, stack:relStack }) : null;
  if(release){ G.paused = true; await releaseCutin(mv); G.paused = false; }
  beep('shot');
  await fireBolt(from, hitAt, card, release ? 260 : 200, release);
  hideOrb(); $('me').classList.remove('danger');
  burst(hitAt.x, hitAt.y, color, release); beep('clash');
  const wiz = $('wSprite').getBoundingClientRect();
  const wizPt = { x:wiz.left + wiz.width / 2, y:wiz.top + wiz.height * .45 };
  if(release){
    say('な、なんだその光は…！', 1400);
    const me = $('me'); me.classList.add('fire'); setTimeout(() => me.classList.remove('fire'), 320);
    await releaseVolley(meCenter(), wizPt, mv.fx, mv.final);
  }else{
    await fireBolt(hitAt, wizPt, card, 220, false);
  }
  // 命中：一瞬止める（ヒットストップ）→のけぞり・数字
  $('stage').classList.add('hit'); setPose('defense', 650);
  burst(wiz.left + wiz.width / 2, wiz.top + wiz.height * .45, color, release);
  await sleep(release ? 150 : (crit ? 90 : 50));
  $('stage').classList.remove('hit');
  const st = $('stage'); st.classList.remove('knock'); void st.offsetWidth; st.classList.add('knock');
  setTimeout(() => st.classList.remove('knock'), 430);
  if(release || crit){ document.body.classList.add('shake'); setTimeout(() => document.body.classList.remove('shake'), 420); }
  beep(release ? 'release' : (crit || tags.length ? 'crit' : 'hit'));
  floatText('-' + dmg, release ? 'big' : '');
  // 余波：遅く打ち消すと、近くで爆ぜた魔法の余波を受ける（とどめの一撃のときは受けない）
  if(splashRaw > 0 && G.wHP > 0) takeChip(splashRaw, '余波');
  if(crit) floatText('会心！', 'crit');
  if(release) setTimeout(() => floatText(mv.name + '！', 'small'), 120);
  if(tags.length) setTimeout(() => floatText(tags.join(' '), 'small'), release ? 400 : 150);
  if(tags.includes('奪還！')) say('ぐっ…取り返したか！', 1400);
  setTimeout(() => { if(G && !G.over) gainExp(expNow); }, 200);
  if([3, 5, 10, 15, 20].includes(G.combo)){
    const cl = $('comboLabel'); cl.classList.remove('bump'); void cl.offsetWidth; cl.classList.add('bump');
    screenFlash('#7ee8fa', 220);
  }
  // 怒り状態（HPが3割を切ったら、赤いオーラ＋玉が速くなる）
  if(!G.rage && G.wHP > 0 && G.wHP <= G.wMax * (phNow.rageAt || .3)){
    G.rage = true; st.classList.add('rage');
    setTimeout(() => { say(phNow.lines.rage, 1600); screenFlash('#ff0030', 300); }, 300);
  }
  if(G.combo >= 10) unlock('combo10');
  if(G.crit >= 5) unlock('crit5');
  if(G.release >= 3) unlock('release3');
  if(G.reclaim >= 3) unlock('reclaim3');
  updateHUD();
  await sleep(750);
  if(G.pHP <= 0){ await sleep(300); endRun(G.shiny); return; }
  await growCheck();
  if(phNow.heal && !G.shinyHealed && G.wHP > 0 && G.wHP <= G.wMax * .5){
    G.shinyHealed = true;
    const h = Math.round(G.wMax * phNow.heal);
    G.wHP = Math.min(G.wMax, G.wHP + h);
    say('闇よ…我が傷を癒やせ！', 1600);
    const w2 = $('wSprite').getBoundingClientRect();
    burst(w2.left + w2.width / 2, w2.top + w2.height / 2, '#6bffb0', true); beep('cast');
    floatText('+' + h, 'small'); updateHUD();
    await sleep(900);
  }
  if(G.wHP <= 0) phaseClear(); else nextSpell();
}

async function onWrong(cur, el, timeout){
  mgAddGenreLevel(0);
  G.wrong++; G.combo = 0; G.lastOkTech = null;
  const phL = G.phases[G.phase];
  let loss = timeout ? (phL.lossTimeout || 20) : (phL.loss || 25);
  // 運：一定の確率でかわす／守り：受けるダメージを減らす
  const shielded = Math.random() < PW.dodge();
  if(shielded) loss = 0; else loss = PW.reduce(loss);
  G.pHP = Math.max(0, G.pHP - loss);
  let stoleNow = false;
  if(cur.kind !== 'barrier'){
    techStat(cur.ans).w++;
    // 奪われた頁は1〜2問あとに必ずもう一度唱えられる
    stoleNow = !G.stolen.has(cur.ans);
    G.stolen.set(cur.ans, 1 + Math.floor(Math.random() * 2));
  }
  writeSave();
  if(el) el.classList.add('bad');
  $('hand').querySelectorAll('[data-t]').forEach(b => { if(b.dataset.t === cur.ans) b.classList.add('right'); });
  // 演出：玉がプレイヤーへ一気に飛んできて命中
  const a = meCenter();
  if(!timeout){
    $('orb').classList.add('danger');
    const start = { x:orbPos.x, y:orbPos.y };
    const o = $('orb');
    o.style.transition = 'transform .18s ease-in';
    placeOrb({ x:a.x, y:a.y }, 1);
    await sleep(190);
    o.style.transition = '';
  }
  hideOrb();
  burst(a.x, a.y, '#ff3b6b', true);
  screenFlash('#ff0040', 380);
  $('me').classList.remove('danger'); $('me').classList.add('hurt');
  setTimeout(() => $('me').classList.remove('hurt'), 500);
  meFloat(shielded ? '🍀 ひらりとかわした！' : '-' + loss, shielded ? 'grow' : 'ouch');
  setPose('attack', 900);
  beep(stoleNow ? 'steal' : 'bad');
  document.body.classList.add('shake');
  setTimeout(() => document.body.classList.remove('shake'), 450);
  say(timeout ? '遅い！' : (stoleNow ? 'その頁、いただいた！' : 'ふははは！'), 1500);
  updateHUD();
  await sleep(700);
  showExplanation(cur, timeout, stoleNow);
}

function showExplanation(cur, timeout, stoleNow){
  const head = timeout ? '⌛ 間に合わなかった…' : '💥 打ち消せなかった…';
  const ansHTML = cur.kind === 'barrier'
    ? `<div class="ansline">正解：${esc(cur.ans)}</div>`
    : `<div class="ansline">正解：${sealHTML(cur.ans)}${esc(cur.ans)}</div>`;
  const body = cur.kind === 'barrier' ? '' : `<p style="font-size:15px">${markup(cur.body)}</p>`;
  const tip = cur.kind !== 'barrier' && !cur.e ? CARD[cur.ans].def : '';
  const steal = cur.kind !== 'barrier'
    ? `<p class="muted">⛓ 「${esc(cur.ans)}」の頁が${stoleNow ? '奪われた' : 'まだ奪われたまま'}。すぐにまた唱えてくるので、正解すれば<b style="color:var(--gold)">奪還（ダメージ2倍）</b>！</p>` : '';
  openOv(`<h2>${head}</h2>${ansHTML}${body}
    <div class="expl">${markup(cur.e || tip || '')}</div>
    ${steal}
    <div class="btnrow"><button class="btn" id="ovGo">${G.pHP <= 0 ? '結果を見る' : 'わかった'}</button></div>`);
  $('ovGo').onclick = async () => { closeOv(); if(G.pHP <= 0) endRun(G.shiny); else { renderStolen(); await growCheck(); nextSpell(); } };
}

function phaseClear(){
  G.busy = true; hideOrb();
  if(G.phase < G.phases.length - 1){
    setPose('defeat', 1400);
    $('stage').classList.remove('rage');
    say(G.phases[G.phase].lines.defeat, 1600);
    beep('win');
    setTimeout(() => $('stage').classList.add('leave'), 1200);
    const heal = Math.min(G.pMax - G.pHP, 20);
    G.pHP += heal;
    setTimeout(() => {
      updateHUD();
      if(heal > 0) meFloat(`HP +${heal}`, 'grow');
      showChest();
    }, 1500);
  }else if(!G.shiny && Math.random() < SHINY_CHANCE){
    // 色違いの闇の魔術師が現れる（派手な登場演出 shinyEntrance）
    setPose('defeat'); $('stage').classList.remove('rage');
    say(G.phases[G.phase].lines.defeat, 1800);
    beep('win');
    setTimeout(async () => {
      await shinyEntrance();
      const heal = Math.min(G.pMax - G.pHP, 20);
      G.pHP += heal; updateHUD();
      if(heal > 0) meFloat(`HP +${heal}`, 'grow');
      setTimeout(showChest, 900);
    }, 1900);
  }else{
    G.over = true; stopIdle(); setPose('defeat'); $('stage').classList.remove('rage');
    if(G.shiny) G.shinyBeaten = true;
    say(G.shiny ? G.phases[G.phase].lines.defeat : '見事だ…その魔術書、お前のものだ', 2500);
    beep('win');
    if(G.shiny){ screenFlash('#ffe9a0', 600); const c = $('wSprite').getBoundingClientRect(); burst(c.left + c.width / 2, c.top + c.height / 2, '#ffd86b', true); }
    setTimeout(() => endRun(true), 1800);
  }
}

function endRun(win){
  G.over = true; G.busy = true; stopIdle(); hideOrb();
  if(!win) setPose('pose1');
  const acc = G.correct + G.wrong ? Math.round(G.correct / (G.correct + G.wrong) * 100) : 0;
  const score = G.dmgTotal + (win ? G.pHP * 3 + G.hints * 30 + 300 : 0) + G.maxCombo * 5 + (G.shinyBeaten ? 1000 : 0);
  const rank = !win ? 'C' : G.wrong === 0 ? 'S' : G.wrong <= 2 ? 'A' : 'B';
  if(win) SAVE.clears++;
  if(G.shiny) SAVE.shinyMet = (SAVE.shinyMet || 0) + 1;
  if(G.shinyBeaten){ SAVE.shinyWins = (SAVE.shinyWins || 0) + 1; unlock('shiny'); }
  let isBest = false;
  if(!SAVE.best || score > SAVE.best.score){ SAVE.best = { score, rank }; isBest = true; }
  // 経験値は戦闘中に1回ずつ入っている。ここではこの挑戦の合計を見せるだけ
  const gained = G.expGained;
  const before = levelInfo(G.expStart);
  const after = levelInfo(SAVE.exp || 0);
  writeSave();
  if(win){ unlock('first_win'); if(G.wrong === 0) unlock('nomiss'); if(G.hintsUsed === 0) unlock('nohint'); }
  if(CARDS.every(c => starsOf(c.id) >= 1)) unlock('pages');
  if(Object.keys(SAVE.got).length >= SPELLS.filter(x => x.collect).length) unlock('spells');
  if(after.lv >= 10) unlock('lv10');
  const lvUp = after.lv > before.lv;
  const expHTML = `<div class="expbox"><div class="row"><span>Lv.<b>${after.lv}</b>　${esc(titleOf(after.lv))}</span><span>この挑戦で 経験値 <b>+${gained}</b>${G.shiny ? ' <span class="muted">（色違いへの攻撃は2倍）</span>' : ''}</span></div>
    <div class="expbar"><i id="resExp" style="width:${after.cur / after.need * 100}%"></i></div>
    ${after.lv > before.lv ? `<div class="lvup">LEVEL UP!<small>Lv.${before.lv} → Lv.${after.lv}　最大HP ＋${playerMaxHP(after.lv) - playerMaxHP(before.lv)}${titleOf(after.lv) !== titleOf(before.lv) ? `　称号「${esc(titleOf(after.lv))}」` : ''}${dragonCapFor(after.lv) > dragonCapFor(before.lv) ? `<br>🐉 ことのはが「${STAGE_LABEL[dragonCapFor(after.lv)]}」まで育てるようになった！` : ''}</small></div>` : ''}
    </div>`;
  const stolenList = [...G.stolen.keys()];
  const stolenHTML = stolenList.length
    ? `<p class="muted">⛓ 取り返せなかった頁：</p><div class="newcards">${stolenList.map(t => `<div>${sealHTML(t)}<span><b>${t}</b>　<span class="muted">${esc(CARD[t].def)}</span></span></div>`).join('')}</div>`
    : (win ? '<p class="muted">奪われた頁はすべて取り返した！</p>' : '');
  const head = G.shinyBeaten ? '✨ 色違いの闇の大魔術師を倒した！' : (G.shiny ? '🏆 闇の大魔術師は退けた…（色違いには敗れた）' : (win ? '🏆 闇の大魔術師を退けた！' : `💀 魔術書の力が尽きた…（${esc(G.phases[G.phase].foe)}に敗れた）`));
  openOv(`<h2>${head}</h2>
    <div class="rank">${rank}</div>
    <p style="text-align:center">スコア <b style="font-size:22px;color:var(--gold)">${score}</b>${isBest ? '　<span style="color:var(--green)">自己ベスト！</span>' : ''}</p>
    ${G.dragon.stage > 0 ? `<div class="dragon-res">${dragonSrc(G.dragon.line, G.dragon.stage) ? haloHTML(dragonSrc(G.dragon.line, G.dragon.stage)) : '<span style="font-size:48px">🐉</span>'}
      <div><b style="color:var(--gold);font-size:17px">${esc(dragonName(G.dragon))}</b><br><span class="muted">いっしょに戦った龍${G.dragonNew ? '　<span style="color:var(--green)">図鑑に記録！</span>' : ''}</span></div></div>` : ''}
    ${expHTML}
    ${G.correct ? `<p class="muted" style="text-align:center">📈 知識ドリルの「表現技法」のレベル <b style="color:var(--gold)">＋${G.correct}</b>（知識ドリルにすぐ反映される）</p>` : ''}
    <div class="stats">
      <div>正解<b>${G.correct}</b> / ${G.correct + G.wrong}（${acc}%）</div>
      <div>最大連鎖<b>${G.maxCombo}</b></div>
      <div>速詠返し<b>${G.crit}</b></div>
      <div>魔術書解放<b>${G.release}</b></div>
      <div>奪還<b>${G.reclaim}</b></div>
      <div>新しく記録した呪文<b>${G.newGot}</b></div>
    </div>
    ${stolenHTML}
    <div class="btnrow"><button class="btn" id="ovAgain">もう一度</button><button class="btn sub" id="ovBook">魔術書を見る</button><button class="btn ghost" id="ovTitle">タイトルへ</button></div>`);
  tintHalos($('ovBox'));
  $('ovAgain').onclick = () => { closeOv(); startRun(); };
  $('ovBook').onclick = () => { closeOv(); openBook(); };
  $('ovTitle').onclick = () => { closeOv(); showTitle(); };
}

function updateHUD(){
  const pw = (G.pHP / G.pMax * 100) + '%', ww = (G.wMax ? G.wHP / G.wMax * 100 : 100) + '%';
  $('pHPbar').querySelector('i').style.width = pw; $('pHPbar').querySelector('.lag').style.width = pw;
  const liH = levelInfo(SAVE.exp || 0);
  $('pHPlabel').textContent = `Lv.${liH.lv}　HP ${G.pHP}/${G.pMax}`;
  $('xFill').style.width = (liH.cur / liH.need * 100) + '%';
  $('wHPbar').querySelector('i').style.width = ww; $('wHPbar').querySelector('.lag').style.width = ww;
  $('buffs').textContent = '';
  const foeNow = (G.phases[G.phase] || G.phases[0]).foe;
  $('wHPlabel').textContent = `${G.phases[G.phase] && G.phases[G.phase].shiny ? '✨' : ''}${foeNow} ${G.wHP}/${G.wMax}`;
  $('comboLabel').textContent = G.combo >= 2 ? `連鎖 ×${G.combo}` : '';
  $('pips').innerHTML = Array.from({ length:GAUGE_MAX }, (_, i) => `<i class="${i < G.gauge ? 'on' : ''}"></i>`).join('');
  $('gauge').classList.toggle('full', G.gauge >= GAUGE_MAX);
  $('gauge').firstElementChild.textContent = G.gauge >= GAUGE_MAX ? '✨解放できる！' : '魔術書解放';
  renderStolen();
}
// 奪われた頁の名前は戦闘中には出さない（次に来る呪文の答えがわかってしまうため、2026-10-03 教員の指摘）。
// 奪われた頁は、まちがえたときの説明と結果画面でだけ知らせる。
function renderStolen(){ $('stolenBox').innerHTML = ''; }

function togglePause(){
  if(!G || G.over || G.busy) return;
  G.paused = !G.paused;
  $('scroll').classList.toggle('veil', G.paused);
  $('bPause').textContent = G.paused ? '▶' : '⏸';
  $('hand').style.visibility = G.paused ? 'hidden' : '';
}

/* ================= 重ね板 ================= */
function openOv(html){ $('ovBox').innerHTML = html; $('ov').classList.add('on'); $('ovBox').scrollTop = 0; }
function closeOv(){ $('ov').classList.remove('on'); }

/* ================= タイトル・魔術書 ================= */
function showTitle(){
  stopIdle(); G = null; hideOrb();
  showScreen('title');
  $('tSprite').src = spriteSrc('pose1');
  const li = levelInfo(SAVE.exp || 0);
  $('tLevel').innerHTML = `Lv.<b>${li.lv}</b>　${esc(titleOf(li.lv))}`;
  $('tExp').style.width = (li.cur / li.need * 100) + '%';
  $('tPower').innerHTML = statusPanelHTML(li.lv);
  // ホームの記録は最高記録だけ（2026-10-03、教員の指示）。呪文・龍・実績の数は魔術書の画面で見られる
  $('tRecord').innerHTML = SAVE.best ? `最高記録 <b>${SAVE.best.score}</b>（ランク${SAVE.best.rank}）` : '';
}

function openBook(){
  showScreen('book');
  const got = Object.keys(SAVE.got).length, total = SPELLS.filter(s => s.collect).length;
  const bTotal = BARRIERS.length, bGot = Object.keys(SAVE.barrierGot).length;
  $('bookSummary').textContent = `記録した呪文 ${got} / ${total}　｜　解いた結界の謎 ${bGot} / ${bTotal}`;
  const dr = SAVE.dragons || {};
  $('dragonSummary').textContent = `出会った龍 ${Object.keys(dr).length} / ${DRAGON_LINES.length}　（いちばん育った姿を記録）`;
  $('dragons').innerHTML = DRAGON_LINES.map(d => {
    if(!dr[d.id]) return `<div><span class="unknown">？</span>？？？</div>`;
    const src = dragonSrc(d.id, dr[d.id]);
    return `<div>${src ? haloHTML(src) : '<span class="unknown">🐉</span>'}<b>${d.name}</b>${STAGE_LABEL[dr[d.id]]}</div>`;
  }).join('');
  tintHalos($('dragons'));
  const av = SAVE.achv || {};
  $('achvSummary').textContent = `${Object.keys(av).length} / ${ACHV.length}`;
  $('achv').innerHTML = ACHV.map(a => `<div class="${av[a.id] ? '' : 'locked'}"><b>${av[a.id] ? '🏅' : '🔒'} ${esc(a.name)}</b>${esc(a.desc)}</div>`).join('');
  $('pages').innerHTML = CARDS.map(c => {
    const st = SAVE.stats[c.id] || { c:0, w:0 };
    const s = starsOf(c.id);
    return `<button class="page${st.c ? '' : ' blank'}" data-t="${c.id}">
      <div class="top">${sealHTML(c.id)}<span class="nm">${c.id}</span></div>
      <div class="stars">${'★'.repeat(s)}${'☆'.repeat(3 - s)}</div>
      <div class="cnt">呪文 ${collectedCount(c.id)} / ${COLLECT_TOTAL[c.id] || 0}　正解 ${st.c}・ミス ${st.w}</div></button>`;
  }).join('');
  $('pages').querySelectorAll('.page').forEach(b => b.onclick = () => openPage(b.dataset.t));
}

function openPage(t){
  const c = CARD[t];
  const list = SPELLS.filter(s => s.ans === t && s.collect && SAVE.got[s.idx]);
  const st = SAVE.stats[t] || { c:0, w:0 };
  openOv(`<h2>${sealHTML(t)} ${t}</h2>
    <p>${esc(c.def)}</p>
    ${TIPS[t] ? `<div class="expl">【見分け方】${esc(TIPS[t])}</div>` : ''}
    <p class="muted" style="margin-top:8px">★1：3問正解　★2：10問正解　★3：この頁の呪文を全部記録（正解 ${st.c}／記録 ${list.length} / ${COLLECT_TOTAL[t] || 0}）</p>
    <div class="collected">${list.length ? list.map(s => `<div>${markup(s.body)}</div>`).join('') : '<div class="muted">まだ記録した呪文はない。バトルで正解すると、ここに集まっていく。</div>'}</div>
    <div class="btnrow"><button class="btn ghost" id="ovClose">閉じる</button></div>`);
  $('ovClose').onclick = closeOv;
}

function showHow(){
  openOv(`<h2>あそびかた</h2>

$('bStart').onclick = startRun;
$('bBook').onclick = openBook;

// 知識ドリルDXへ戻る（ほかの別ページのミニゲームと同じ。?from=minigame でミニゲーム一覧が開く）
$('bHome').onclick = () => { location.href = 'kokugo_app.html?from=minigame_home'; };   // イントロを出さずにホームへ（kokugo_app.html側の ?from= 参照）
$('bMgList').onclick = () => { location.href = 'kokugo_app.html?from=minigame'; };
$('bBookBack').onclick = showTitle;
$('bHint').onclick = useHint;
$('bPause').onclick = togglePause;
function soundLabel(){ $('bSound').textContent = SAVE.sound ? '🔊' : '🔇'; }
$('bSound').onclick = () => { SAVE.sound = !SAVE.sound; writeSave(); soundLabel(); };
soundLabel();
// キー操作：1〜4でカード（日本語入力がオンのときの全角「１〜４」、テンキーも受けつける）、Hでしおり、
// P／Escで一時停止、説明の板が出ているときはEnter／スペースで先へ進む。
function keyToIndex(e){
  const m = /^(?:Digit|Numpad)([1-4])$/.exec(e.code || '');
  if(m) return +m[1] - 1;
  const k = '1234１２３４'.indexOf(e.key);
  return k >= 0 ? k % 4 : -1;
}
document.addEventListener('keydown', e => {
  if($('ov').classList.contains('on')){
    if(e.key === 'Enter' || e.code === 'Space'){
      e.preventDefault();
      const b = $('ovBox').querySelector('.btn'); if(b) b.click();
    }
    return;
  }
  if(!$('battle').classList.contains('on') || !G) return;
  const n = keyToIndex(e);
  if(n >= 0){
    e.preventDefault();
    if(G.busy || G.paused) return;
    const b = $('hand').querySelectorAll('[data-t]')[n];
    if(b && !b.classList.contains('dim')) answer(b.dataset.t, b);
  }else if(e.code === 'KeyH'){ useHint(); }
  else if(e.code === 'KeyP' || e.key === 'Escape'){ togglePause(); }
});
document.addEventListener('visibilitychange', () => { if(document.hidden && G && !G.over && !G.busy && !G.paused) togglePause(); });

showTitle();
