<!-- 通行証のチェック（2026-10-01）：知識ドリルDXの入口（kokugo_app.htmlのmgGoWithPass）を通らずに、
     直接開いたときは「このファイルは開けません」とだけ表示し、ゲームを動かさない（2026-10-04〜、教員の指示。以前は本体へ戻していた）（準備中の隠しゲームを、配布版のフォルダから開けないように）。
     ブラウザの設定でsessionStorageが使えないときは、確かめようがないのでそのまま開く。 -->
<script>
(function(){
  var ok = true;
  try{ ok = !!(JSON.parse(sessionStorage.getItem("kokugo_mg_pass_v1") || "{}")["enro"]); }catch(e){ ok = true; }
  if(!ok){ document.write('<style>html,body{margin:0;height:100%;background:#1d1f38;color:#fff;font-family:sans-serif}body{display:flex;align-items:center;justify-content:center}</style></head><body><p style="font-size:22px;font-weight:bold">このファイルは開けません</p><plaintext style="display:none">'); }
})();
</script>
<title>炎狼ラン</title>
<!-- 知識ドリルDXのミニゲーム「炎狼ラン」（2026-09-29〜、試作・準備中）。kokugo_app.htmlのミニゲーム一覧から、
     九尾の化かし合い(kitsune_bakashiai.html)と同じく同じタブのまま画面ごと遷移してくる別ページ。
     炎狼(me01)が3本の道（上＝尊敬語／中＝謙譲語／下＝丁寧語、2026-09-29 教員の指示で上下を入れかえた）を走り、迫ってくる「炎の関所」に書かれた
     敬語の種類に合う道でくぐり抜ける。正解するほど速くなる（炎狼＝素早さ特化）。
     2026-09-30〜、「分かっている人にはいつまでも終わらず退屈」との教員の指摘で、関所30個でゴールする形にし、
     最後の10個を「迷いの区間」（関所ごとに道の並びが入れかわる）にした。評価はゴール時の★（ミスの数）と得点。
     同日、教員の指示で「見きわめの区間」（敬語の使い方が正しいかを、上＝正しい／下＝正しくない で判断する。
     炎狼は関所ごとにまん中へ戻り、まん中のままだと時間切れ）を加え、4区間・関所32個にした。
     さらに教員の指示で、区間ごとに走りを止めて「完走！」と次の区間のルールを見せる画面（showZoneCard）と、
     →キーで関所の前まで一気に進むダッシュ（dash）を加え、見きわめの区間の考える時間を1.5倍にした。
     さらに教員の指示で、まちがえた関所は数に入れない（正解で通った関所だけが進む）ようにし、32個目を通ったら
     「完全クリア！」（fullClear）から「結果を見る」か「挑戦モード」（4区間の問題を1問ごとにまぜて、❤がなくなるまで）を選べるようにした。
     本体のセーブデータ(st)には一切触れず、このページ専用のlocalStorageキーだけを使う
     （2026-09-30〜、1回のゲームごとに「正解1つ＝＋1、まちがい2つ＝−1」の差し引きを本体のジャンルレベルの増減として
     MG_PENDING_LVUP_LSKEYに書き置き、本体がホーム画面で反映する。mgFlush参照）。炎狼の絵は本番と同じスプライト(enemy_sprites_data.js)を使い、
     読み込めなかったときは🐺の絵文字で代用する。 -->
<script src="enemy_sprites_data.js"></script>
<!-- 道ごとの背景（素材/画像/炎狼ラン背景.png から切り出し）。読み込めなかったときは、今までどおりの色だけの道になる -->
<script src="enro_run_bg_data.js"></script>
<style>
  :root{
    --bg1:#12070a; --bg2:#26100f; --bg3:#3d1712;
    --fire:#ff7a2f; --fire2:#ffc36b; --gold:#ffd76b;
    --teinei:#5fb8ff; --kenjo:#c49bff; --sonkei:#ffb13c;
    --ok:#5fd08a; --ng:#ff6b6b;
    --text:#fff3ea; --sub:#c9ada2;
    --panel:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:radial-gradient(ellipse at 50% -10%, var(--bg3) 0%, var(--bg2) 45%, var(--bg1) 100%);

  }

  .mincho{ font-family:'Hiragino Mincho ProN','Yu Mincho','YuMincho','BIZ UDMincho',serif; }
  .screen{ display:none; height:100vh; height:100dvh; }
  .screen.show{ display:flex; }

  .btn{
    display:block; width:100%; padding:13px; border-radius:14px; border:0; font-size:17px; font-weight:bold;

  .pill{ border:1px solid var(--line); background:rgba(0,0,0,.35); color:var(--text); border-radius:999px; font-size:13px; padding:4px 12px; cursor:pointer; }

  .wolf-img{ width:100%; height:100%; object-fit:contain; }
  .wolf-emoji{ font-size:60px; display:flex; align-items:center; justify-content:center; width:100%; height:100%; }
  .flip{ transform:scaleX(-1); }

  /* =====================================================================
     タイトル
     ===================================================================== */
  #scTitle{ align-items:center; justify-content:center; padding:16px; overflow-y:auto; }
  .title-wrap{ width:100%; max-width:920px; display:grid; grid-template-columns:300px 1fr; gap:26px; align-items:center; }
  .title-left{ display:flex; flex-direction:column; align-items:center; gap:8px; }

  .title-left h1{ font-size:34px; letter-spacing:6px; color:var(--fire2); text-shadow:0 0 18px rgba(255,122,47,.7); }
  .title-left .sub{ font-size:12px; color:var(--sub); letter-spacing:2px; }
  .title-right{ display:flex; flex-direction:column; gap:12px; }
  .how{ font-size:13.5px; line-height:1.8; color:var(--sub); }
  .catch{ font-size:clamp(22px, 5vw, 30px); font-weight:bold; color:var(--text); text-shadow:0 0 14px rgba(255,122,47,.7); }
  .tips{ list-style:none; display:flex; flex-direction:column; gap:6px; font-size:15px; }
  .tips li{ padding:8px 12px; border-radius:12px; background:var(--panel); border:1px solid var(--line); }
  .tips b{ color:var(--fire2); }
  .tips .ic{ margin-right:4px; }
  .how b{ color:var(--text); }
  .lane-guide{ display:flex; flex-direction:column; gap:6px; }
  .lg{ display:grid; grid-template-columns:64px 76px 1fr; align-items:center; gap:8px; padding:8px 12px; border-radius:12px; background:var(--panel); border-left:5px solid; font-size:13px; }
  .lg .pos{ color:var(--sub); font-size:12px; }
  .lg b{ font-size:16px; }
  .lg.t{ border-color:var(--teinei); } .lg.t b{ color:var(--teinei); }
  .lg.k{ border-color:var(--kenjo); }  .lg.k b{ color:var(--kenjo); }
  .lg.s{ border-color:var(--sonkei); } .lg.s b{ color:var(--sonkei); }
  .best-line{ font-size:13px; color:var(--sub); }
  .best-line b{ color:var(--gold); font-size:20px; }
  .title-btns{ display:grid; grid-template-columns:2fr 1fr; gap:10px; }

  /* =====================================================================
     ゲーム画面
     ===================================================================== */
  #scGame{ flex-direction:column; }
  .hud{ display:flex; align-items:center; gap:10px; padding:8px 12px; font-size:13px; flex-wrap:wrap; }
  .hud .lives{ font-size:18px; letter-spacing:2px; }
  .hud .lives .off{ filter:grayscale(1) opacity(.3); }
  .hud .score{ color:var(--sub); }
  .hud .score b{ color:var(--gold); font-size:20px; }
  .hud .zone{ color:var(--fire2); font-size:12px; }
  .hud .gates{ font-size:13px; color:var(--sub); }
  .hud .gates b{ color:var(--text); font-size:17px; }
  .hud .sp{ flex:1; }
  /* 挑戦モードの現在地（2026-10-01、教員の指示）：移動kmのすぐ横に、今いる地名と次の地名を大きめに出す */
  .travel-row{ display:flex; align-items:baseline; justify-content:center; flex-wrap:wrap; gap:4px 14px; padding:0 12px 6px; }
  .travel-row[hidden]{ display:none; }
  .travel-row .tkm{ font-size:clamp(18px, 4.4vw, 24px); font-weight:bold; color:var(--gold); white-space:nowrap; }
  .travel-row .tat{ font-size:clamp(20px, 5vw, 28px); font-weight:bold; color:var(--text); text-shadow:0 0 12px rgba(255,122,47,.7); white-space:nowrap; }
  .travel-row .tat small, .travel-row .tkm small{ font-size:12px; color:var(--sub); font-weight:normal; margin-right:4px; }
  .travel-row .tnext{ font-size:clamp(13px, 3.4vw, 16px); color:var(--fire2); white-space:nowrap; }
  .travel-row .tnext b{ font-size:1.15em; }
  .travel-row .tat.arrive{ animation:wpop .4s ease; }
  /* 炎ゲージ（2026-09-29、教員の指示で大きくし、HUDの下に1段まるごと使って置く）。8マスの区切り線つき */
  .gauge-row{ display:flex; align-items:center; justify-content:center; gap:10px; padding:2px 12px 6px; }
  .gauge-row .gl{ font-size:16px; font-weight:bold; color:var(--fire2); white-space:nowrap; }
  .gauge{
    position:relative; flex:1; max-width:560px; height:24px; border-radius:999px; overflow:hidden;
    background:rgba(255,255,255,.1); border:2px solid rgba(255,195,107,.5); box-shadow:inset 0 2px 6px rgba(0,0,0,.5);
  }
  .gauge::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(90deg, transparent 0 calc(12.5% - 2px), rgba(0,0,0,.55) calc(12.5% - 2px) 12.5%);
  }
  .gauge.hibmode::after{ display:none; }
  .gauge-fill{ height:100%; width:0; background:linear-gradient(90deg,var(--fire),var(--gold)); box-shadow:0 0 12px var(--fire); transition:width .25s; }
  .gauge-num{ font-size:15px; font-weight:bold; min-width:4.5em; white-space:nowrap; }
  .gauge.bump{ animation:gBump .4s ease; }
  @keyframes gBump{ 0%,100%{transform:scale(1)} 40%{transform:scale(1.06); border-color:var(--gold); box-shadow:0 0 16px var(--gold)} }
  .gauge.drop{ animation:gDrop .5s ease; }
  @keyframes gDrop{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px); border-color:var(--ng)} 40%{transform:translateX(5px); border-color:var(--ng)} 60%{transform:translateX(-3px)} }
  @keyframes blaze{ 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.5)} }
  /* 炎ブースト中のゲージ：赤い炎が流れ、枠ごと赤く燃える（2026-10-01、「特別感がない」との教員の指摘で強化） */
  body.hibashiri .gauge{ border-color:#ff4a2a; box-shadow:0 0 14px #ff3b1f, 0 0 28px rgba(255,40,20,.5), inset 0 2px 6px rgba(0,0,0,.5); }
  body.hibashiri .gauge-fill{
    background:linear-gradient(90deg,#ff2a1a,#ff7a2f,#ffd76b,#ff7a2f,#ff2a1a); background-size:200% 100%;
    box-shadow:0 0 16px #ff2a1a; animation:blaze .5s linear infinite, fireFlow .8s linear infinite;
  }
  @keyframes fireFlow{ 0%{background-position:0 0} 100%{background-position:-200% 0} }
  body.hibashiri .gauge-row .gl{ color:#ff6a4a; text-shadow:0 0 8px #ff2a1a, 0 0 16px rgba(255,40,20,.8); animation:glPulse .6s ease-in-out infinite; }
  body.hibashiri .gauge-num{ color:#ffd0c0; }
  @keyframes glPulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }

  .word-bar{ text-align:center; padding:6px 12px 10px; min-height:78px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .word-bar .ctx{ font-size:13px; color:var(--sub); min-height:1.2em; }
  .word-bar .word{ font-size:clamp(26px, 6.2vw, 44px); font-weight:bold; letter-spacing:2px; color:#fff; text-shadow:0 0 14px rgba(255,122,47,.8); line-height:1.3; }
  .word-bar .word.sentence{ font-size:clamp(19px, 4.4vw, 30px); letter-spacing:1px; }
  .word-bar .word .tg{ color:var(--fire2); border-bottom:3px solid var(--fire); padding:0 2px; }
  .word-bar .word.pop{ animation:wpop .28s ease; }
  @keyframes wpop{ 0%{transform:scale(.6);opacity:0} 100%{transform:scale(1);opacity:1} }

  .field{ position:relative; flex:1; overflow:hidden; border-top:1px solid var(--line); }
  .lane{ position:absolute; left:0; right:0; display:flex; align-items:center; cursor:pointer; }
  .lane.t{ background:rgba(95,184,255,.07); }
  .lane.k{ background:rgba(196,155,255,.07); border-top:1px dashed rgba(255,255,255,.12); border-bottom:1px dashed rgba(255,255,255,.12); }
  .lane.s{ background:rgba(255,177,60,.07); }
  /* 背景の景色（.bg）はゆっくり、地面の線（.scroll）は走る速さで流して奥行きを出す */
  .lane .bg{ position:absolute; inset:0; background-repeat:repeat-x; background-size:auto 100%; background-position:0 50%; }
  .lane .bg::after{ content:""; position:absolute; inset:0; background:rgba(0,0,0,.12); }
  .lane .scroll{ position:absolute; inset:0; background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 2px, transparent 2px 90px); }
  body.has-bg .lane .scroll{ background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 2px, transparent 2px 140px); -webkit-mask-image:linear-gradient(transparent 70%, #000 85%); mask-image:linear-gradient(transparent 70%, #000 85%); }
  .lane .label{
    position:relative; z-index:2; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center;
    background:rgba(0,0,0,.6); border-right:3px solid; text-align:center; padding:0 4px;
  }
  .lane .label b{ font-size:clamp(15px, 3.6vw, 20px); letter-spacing:1px; }
  .lane .label small{ font-size:10px; color:var(--sub); line-height:1.35; margin-top:2px; }
  .lane.t .label{ border-color:var(--teinei); } .lane.t .label b{ color:var(--teinei); }
  .lane.k .label{ border-color:var(--kenjo); }  .lane.k .label b{ color:var(--kenjo); }
  .lane.s .label{ border-color:var(--sonkei); } .lane.s .label b{ color:var(--sonkei); }
  .lane.ok .label{ border-color:var(--ok); } .lane.ok .label b{ color:var(--ok); }
  .lane.ng .label{ border-color:var(--ng); } .lane.ng .label b{ color:var(--ng); }
  /* 「✕正しくない」が道のラベル幅で折り返さないよう、見きわめの区間のラベルだけ少し小さくする */
  .lane.ok .label b, .lane.ng .label b, .lane.mid .label b{ font-size:clamp(12px, 2.8vw, 16px); letter-spacing:0; white-space:nowrap; }
  .lane.mid .label{ border-color:rgba(255,255,255,.3); } .lane.mid .label b{ color:var(--sub); }
  .lane.mid .bg{ filter:brightness(.55) saturate(.6); }
  .lane.here .label{ background:rgba(40,28,24,.85); }
  /* 迷いの区間：道の並びが入れかわったことが分かるように、ラベルをくるっと回して光らせる */
  .lane.shuffled .label{ animation:labelSpin .45s ease; }
  @keyframes labelSpin{ 0%{transform:rotateX(90deg); filter:brightness(2)} 100%{transform:rotateX(0); filter:brightness(1)} }
  body.maze .lane .label{ box-shadow:inset 0 0 0 2px rgba(255,195,107,.35); }
  .lane.answer{ animation:ansGlow .5s ease-in-out 3; }
  @keyframes ansGlow{ 0%,100%{box-shadow:inset 0 0 0 0 rgba(95,208,138,0)} 50%{box-shadow:inset 0 0 0 4px var(--ok)} }

  #wolf{ position:absolute; z-index:5; transition:top .13s ease-out; pointer-events:none; }
  #wolf .body{ width:100%; height:100%; }
  /* 走るアニメーション(.body の transform)と打ち消し合わないよう、左右反転は中の画像側にかける */
  #wolf .body .wolf-img{ transform:scaleX(-1); }
  #wolf.run .body{ animation:gallop .32s ease-in-out infinite; }
  @keyframes gallop{ 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-7%) rotate(-3deg)} }
  #wolf.hit .body{ animation:shiver .4s ease; }
  @keyframes shiver{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8%)} 40%{transform:translateX(8%)} 60%{transform:translateX(-5%)} 80%{transform:translateX(5%)} }
  #wolf .glow{ position:absolute; inset:10% 20% 5% -30%; border-radius:50%; background:radial-gradient(ellipse at 70% 50%, rgba(255,140,40,.55), transparent 70%); opacity:0; transition:opacity .3s; }
  body.hibashiri #wolf .glow{ opacity:1; animation:blaze .35s linear infinite; }

  /* =====================================================================
     炎ブースト（炎ゲージMAX）の演出（2026-10-01、教員の指示）：
     炎狼が赤く輝くオーラをまとい、火の粉を散らして走る。道のまわりも赤く燃え、地面の流れも速く見せる。
     ===================================================================== */
  #wolf .aura{ position:absolute; inset:-22% -12% -10% -26%; pointer-events:none; opacity:0; transition:opacity .35s; }
  #wolf .aura::before{
    content:""; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(ellipse at 55% 55%, rgba(255,80,30,.95) 0%, rgba(255,30,20,.7) 30%, rgba(220,0,0,.32) 55%, transparent 72%);
    mix-blend-mode:screen;
    animation:auraPulse .6s ease-in-out infinite;
  }
  #wolf .aura::after{
    content:""; position:absolute; inset:6% 12%; border-radius:50%; filter:blur(7px);
    background:conic-gradient(from 0deg, transparent, rgba(255,90,40,.6), transparent 22%, rgba(255,30,30,.55) 48%, transparent 64%, rgba(255,170,60,.55) 80%, transparent);
    animation:auraSpin 1.1s linear infinite;
  }
  @keyframes auraPulse{ 0%,100%{transform:scale(.94); opacity:.85} 50%{transform:scale(1.06); opacity:1} }
  @keyframes auraSpin{ 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
  #wolf .aura i{
    position:absolute; bottom:18%; width:7%; aspect-ratio:1; border-radius:50%; opacity:0;
    background:radial-gradient(circle at 40% 40%, #fff6c8, #ffb13c 40%, #ff3b1f 75%, transparent 80%);
    box-shadow:0 0 8px #ff3b1f;
  }
  #wolf .aura i:nth-child(1){ left:22%; animation-delay:0s; }
  #wolf .aura i:nth-child(2){ left:38%; animation-delay:.25s; width:5%; }
  #wolf .aura i:nth-child(3){ left:52%; animation-delay:.5s; }
  #wolf .aura i:nth-child(4){ left:66%; animation-delay:.12s; width:5%; }
  #wolf .aura i:nth-child(5){ left:78%; animation-delay:.38s; }
  #wolf .aura i:nth-child(6){ left:30%; animation-delay:.62s; width:4%; }
  @keyframes ember{
    0%{opacity:0; transform:translate(0,0) scale(1)}
    15%{opacity:1}
    100%{opacity:0; transform:translate(-120%,-420%) scale(.3)}
  }
  body.hibashiri #wolf .aura{ opacity:1; }
  body.hibashiri #wolf .aura i{ animation-name:ember; animation-duration:.85s; animation-timing-function:ease-out; animation-iteration-count:infinite; }
  /* 炎狼そのものも赤く輝く（左右反転の transform は触らず、filterだけ動かす） */
  body.hibashiri #wolf .body .wolf-img{ animation:wolfBurn .5s ease-in-out infinite; }
  @keyframes wolfBurn{
    0%,100%{filter:drop-shadow(0 0 5px #ff3b1f) drop-shadow(0 0 14px rgba(255,40,20,.8)) saturate(1.25)}
    50%{filter:drop-shadow(0 0 9px #ff6a2a) drop-shadow(0 0 24px rgba(255,20,10,1)) brightness(1.15) saturate(1.45)}
  }
  body.hibashiri #wolf .wolf-emoji{ text-shadow:0 0 12px #ff3b1f, 0 0 24px #ff2a1a; }
  /* 道のまわりが赤く燃える */
  .field::before{
    content:""; position:absolute; inset:0; z-index:3; pointer-events:none; opacity:0; transition:opacity .4s;
    box-shadow:inset 0 0 70px 12px rgba(255,40,20,.55);
    background:linear-gradient(90deg, rgba(255,50,20,.22), transparent 45%), linear-gradient(0deg, rgba(255,60,20,.18), transparent 25%);
  }
  body.hibashiri .field::before{ opacity:1; animation:fieldBurn 1s ease-in-out infinite; }
  @keyframes fieldBurn{ 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.35)} }
  body.hibashiri .lane .scroll{ background-image:repeating-linear-gradient(90deg, rgba(255,120,60,.28) 0 3px, transparent 3px 70px); }
  body.hibashiri .word-bar .word:not(.ok){ text-shadow:0 0 10px #ff2a1a, 0 0 26px rgba(255,60,20,.85); }
  body.hibashiri .hud{ box-shadow:0 2px 18px rgba(255,40,20,.45); }
  /* 炎ブーストに入った瞬間：画面全体が赤く燃え上がる */
  .hib-flash{ position:fixed; inset:0; z-index:25; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 25% 65%, rgba(255,230,160,.75), rgba(255,60,20,.5) 35%, rgba(140,0,0,.3) 75%); }
  .hib-flash.show{ animation:hibFlash 1s ease-out; }
  @keyframes hibFlash{ 0%{opacity:0} 12%{opacity:1} 100%{opacity:0} }
  .banner.hib{ border-color:#ff4a2a; color:#ffd0a0; background:linear-gradient(135deg, rgba(120,10,0,.95), rgba(40,6,6,.95));
    box-shadow:0 0 24px #ff2a1a, 0 0 60px rgba(255,40,20,.5); font-size:28px; text-shadow:0 0 12px #ff3b1f; }

  .barrier{ position:absolute; top:0; bottom:0; z-index:4; display:flex; flex-direction:column; pointer-events:none; }
  .gate{
    flex:1; margin:5px 0; border-radius:10px; position:relative;
    background:linear-gradient(180deg,#5a3226,#3a1d16); border:2px solid #8a4a2e;
    box-shadow:0 0 14px rgba(255,90,20,.55), inset 0 0 10px rgba(0,0,0,.6);
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .gate::before{ content:"🔥"; }
  .gate.open{ background:rgba(95,208,138,.25); border-color:var(--ok); box-shadow:0 0 22px var(--ok); transition:all .15s; }
  .gate.open::before{ content:"✨"; }
  .gate.crash{ background:rgba(255,107,107,.3); border-color:var(--ng); box-shadow:0 0 22px var(--ng); animation:shiver .35s ease; }
  .gate.crash::before{ content:"💥"; }
  .barrier.gone{ opacity:0; transition:opacity .4s; }

  /* 正解の演出：炎狼のいる道に「〇 正解！」の判を押し、道を緑に光らせ、上の言葉も緑に変える */
  .ok-stamp{
    position:absolute; z-index:8; left:55%; top:0; transform:translate(-50%,-50%); pointer-events:none; opacity:0;
    display:flex; align-items:center; gap:.3em; white-space:nowrap;
    font-size:clamp(30px, 6.5vw, 56px); font-weight:bold; color:#fff; text-shadow:0 0 14px var(--ok), 0 2px 4px #000;
  }
  .ok-stamp .ring{ width:1.1em; height:1.1em; border:.17em solid var(--ok); border-radius:50%; box-shadow:0 0 18px var(--ok), inset 0 0 10px var(--ok); }
  .ok-stamp small{ font-size:.45em; color:var(--ok); margin-left:.2em; }
  .ok-stamp.show{ animation:okStamp .75s ease-out; }
  @keyframes okStamp{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.3)}
    18%{opacity:1; transform:translate(-50%,-50%) scale(1.18)}
    32%{transform:translate(-50%,-50%) scale(1)}
    75%{opacity:1}
    100%{opacity:0; transform:translate(-50%,-60%) scale(1)}
  }
  .lane.good{ animation:goodFlash .5s ease-out; }
  @keyframes goodFlash{ 0%{background-color:rgba(95,208,138,.5); box-shadow:inset 0 0 0 4px var(--ok)} 100%{} }
  .word-bar .word.ok{ color:var(--ok); text-shadow:0 0 16px rgba(95,208,138,.9); transition:color .1s; }
  .gate.open.burst{ animation:burst .35s ease-out; }
  @keyframes burst{ 0%{transform:scale(1)} 40%{transform:scale(1.25)} 100%{transform:scale(1)} }
  /* 道に落ちているアイテム（🦴骨＝炎ゲージ＋3／🍖肉＝❤1つ回復）。その道を走っていれば、ぶつかってひろえる */
  .item{ position:absolute; left:0; top:0; z-index:4; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .item .ic{ position:relative; z-index:1; line-height:1; animation:itemFloat .9s ease-in-out infinite; filter:drop-shadow(0 3px 4px rgba(0,0,0,.6)); }
  .item::before{ content:""; position:absolute; inset:-10%; border-radius:50%; background:radial-gradient(circle, rgba(255,240,180,.75), rgba(255,200,80,.25) 55%, transparent 72%); animation:blaze .6s linear infinite; }
  .item.meat::before{ background:radial-gradient(circle, rgba(255,190,190,.8), rgba(255,90,110,.3) 55%, transparent 72%); }
  @keyframes itemFloat{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12%)} }
  .item.got{ transition:opacity .35s, scale .35s; opacity:0; scale:1.8; }
  .popup{ position:absolute; z-index:8; font-weight:bold; font-size:20px; color:var(--gold); text-shadow:0 0 8px rgba(0,0,0,.8); pointer-events:none; animation:floatUp .8s ease forwards; }
  @keyframes floatUp{ 0%{transform:translateY(0);opacity:1} 100%{transform:translateY(-44px);opacity:0} }

  .explain{
    position:absolute; z-index:9; left:50%; bottom:12px; transform:translateX(-50%); width:min(560px, calc(100% - 24px));
    background:rgba(20,8,8,.94); border:1.5px solid var(--ng); border-radius:14px; padding:12px 14px; font-size:14px; line-height:1.7;
    display:none; cursor:pointer;
  }
  .explain.show{ display:block; animation:wpop .2s ease; }
  .explain .head{ font-size:16px; font-weight:bold; margin-bottom:4px; }
  .explain .head .ng{ color:var(--ng); }
  .explain .next{ text-align:right; font-size:12px; color:var(--sub); margin-top:4px; }
  .explain.hib{ border-color:var(--fire2); }

  .banner{
    position:fixed; left:50%; top:38%; transform:translate(-50%,-50%); z-index:30; pointer-events:none;
    background:rgba(20,8,8,.92); border:2px solid var(--fire2); border-radius:16px; padding:14px 22px; text-align:center;
    font-size:22px; font-weight:bold; color:var(--fire2); opacity:0; transition:opacity .25s; white-space:nowrap;
  }
  .banner small{ display:block; font-size:13px; color:var(--text); font-weight:normal; margin-top:4px; white-space:normal; }
  .banner.show{ opacity:1; }

  .overlay{ position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; padding:20px; }
  .overlay.show{ display:flex; }
  .overlay .box{ width:min(340px,100%); background:#241010; border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:10px; text-align:center; }
  /* 区間の完走・次の区間のルール */
  .overlay .zone-box{ width:min(520px,100%); max-height:calc(100dvh - 40px); overflow-y:auto; text-align:left; gap:12px; }
  .zb-done{ text-align:center; font-size:clamp(20px, 5.5vw, 28px); font-weight:bold; color:var(--gold); text-shadow:0 0 14px rgba(255,215,107,.6); animation:wpop .35s ease; }
  .zb-score{ text-align:center; font-size:14px; color:var(--sub); }
  .zb-score b{ color:var(--text); font-size:18px; }
  .zb-next{ text-align:center; font-size:clamp(17px, 4.6vw, 21px); font-weight:bold; color:var(--fire2); border-top:1px solid var(--line); padding-top:10px; }
  .zb-rules{ margin:0; padding-left:1.3em; font-size:14px; line-height:1.75; }
  .zb-rules b{ color:var(--fire2); }
  .zb-lanes{ display:flex; flex-direction:column; gap:5px; }
  .zl{ display:grid; grid-template-columns:2.2em 7em 1fr; align-items:center; gap:6px; padding:6px 10px; border-radius:10px; background:var(--panel); border-left:5px solid; font-size:13px; }
  .zl span{ color:var(--sub); font-size:12px; }
  .zl b{ font-size:15px; }
  .zl small{ color:var(--sub); font-size:12px; }
  .zl.s{ border-color:var(--sonkei); } .zl.s b{ color:var(--sonkei); }
  .zl.k{ border-color:var(--kenjo); }  .zl.k b{ color:var(--kenjo); }
  .zl.t{ border-color:var(--teinei); } .zl.t b{ color:var(--teinei); }
  .zl.ok{ border-color:var(--ok); } .zl.ok b{ color:var(--ok); }
  .zl.ng{ border-color:var(--ng); } .zl.ng b{ color:var(--ng); }
  .zl.mid{ border-color:rgba(255,255,255,.3); } .zl.mid b{ color:var(--sub); }
  .zb-note{ font-size:13px; color:var(--fire2); text-align:center; }
  .zb-key{ font-size:12px; color:var(--sub); text-align:center; }
  /* ダッシュ：炎狼が前へ飛び出し、道に流線が走る */
  #wolf.dash .body{ animation:dashLunge .28s ease-out; }
  @keyframes dashLunge{ 0%{transform:translateX(0)} 35%{transform:translateX(45%) scaleX(1.08)} 100%{transform:translateX(0)} }
  .field.dashfx::after{
    content:""; position:absolute; inset:0; z-index:6; pointer-events:none;
    background:repeating-linear-gradient(180deg, transparent 0 18px, rgba(255,230,190,.35) 18px 20px, transparent 20px 46px);
    animation:dashLines .3s ease-out forwards;
  }
  @keyframes dashLines{ 0%{opacity:1; transform:translateX(30%)} 100%{opacity:0; transform:translateX(-30%)} }
  .dash-hint{ font-size:12px; color:var(--sub); }
  .overlay .clear-box{ width:min(420px,100%); gap:12px; }
  .cl-title{ font-size:clamp(28px, 7vw, 38px); font-weight:bold; color:var(--gold); text-shadow:0 0 20px rgba(255,215,107,.8); animation:wpop .4s ease; }
  .cl-sub{ font-size:12px; color:var(--sub); margin-top:-6px; }
  .travel{ text-align:center; padding:12px; border-radius:14px; background:linear-gradient(135deg, rgba(255,122,47,.18), rgba(255,215,107,.08)); border:1px solid rgba(255,195,107,.45); }
  .travel .km{ font-size:clamp(22px, 6vw, 30px); font-weight:bold; color:var(--gold); }
  .travel .place{ font-size:clamp(17px, 4.6vw, 22px); font-weight:bold; margin-top:4px; }
  .travel .next{ font-size:13px; color:var(--sub); margin-top:4px; }
  .miss .chtag{ font-size:11px; color:var(--fire2); border:1px solid var(--fire2); border-radius:6px; padding:0 4px; margin-right:4px; }
  .count{ font-size:90px; font-weight:bold; color:var(--fire2); text-shadow:0 0 30px rgba(255,122,47,.9); }

  /* =====================================================================
     結果
     ===================================================================== */
  #scEnd{ align-items:flex-start; justify-content:center; padding:16px; overflow-y:auto; }
  .end-wrap{ width:100%; max-width:760px; display:flex; flex-direction:column; gap:12px; padding-bottom:20px; }
  .end-top{ display:grid; grid-template-columns:180px 1fr; gap:16px; align-items:center; }
  .end-top .wolf{ height:140px; }
  .end-top h2{ font-size:26px; color:var(--fire2); letter-spacing:3px; }
  .end-rank{ font-size:22px; color:var(--gold); margin:4px 0; }
  .end-stars{ font-size:40px; letter-spacing:6px; color:var(--gold); text-shadow:0 0 14px rgba(255,215,107,.7); line-height:1.1; }
  .end-stars .off{ color:rgba(255,255,255,.15); text-shadow:none; }
  .end-stars .pop{ display:inline-block; animation:starPop .45s ease backwards; }
  @keyframes starPop{ 0%{transform:scale(0)} 70%{transform:scale(1.3)} 100%{transform:scale(1)} }
  .star-rule{ font-size:12px; color:var(--sub); }
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .stat{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px; text-align:center; font-size:12px; color:var(--sub); }
  .stat b{ display:block; font-size:22px; color:var(--text); }
  .stat.new b{ color:var(--gold); }
  .miss-list{ display:flex; flex-direction:column; gap:6px; }
  .miss-list h3{ font-size:15px; color:var(--fire2); }
  .miss{ background:var(--panel); border-left:4px solid; border-radius:10px; padding:8px 12px; font-size:13px; line-height:1.65; }
  .miss .w{ font-size:15px; font-weight:bold; }
  .miss .w .tg{ color:var(--fire2); }
  .miss.ok{ border-color:var(--ok); } .miss.ok .ty{ color:var(--ok); }
  .miss.ng{ border-color:var(--ng); } .miss.ng .ty{ color:var(--ng); }
  .miss.t{ border-color:var(--teinei); } .miss.k{ border-color:var(--kenjo); } .miss.s{ border-color:var(--sonkei); }
  .miss .ty{ font-weight:bold; }
  .miss.t .ty{ color:var(--teinei); } .miss.k .ty{ color:var(--kenjo); } .miss.s .ty{ color:var(--sonkei); }
  .perfect{ text-align:center; color:var(--ok); font-size:15px; padding:8px; }
  .end-btns{ display:grid; grid-template-columns:2fr 1fr; gap:10px; }
  /* 結果画面から挑戦モードへ（完全クリアした回だけ出す。2026-10-01〜） */
  .end-ch{ display:flex; flex-direction:column; gap:6px; text-align:center; }
  .end-ch[hidden]{ display:none; }
  .btn.ch{ background:linear-gradient(135deg,#ffb347,#ff3b1f); color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.5); box-shadow:0 0 18px rgba(255,59,31,.55); }

  @media (max-width:720px){
    .title-wrap{ grid-template-columns:1fr; gap:12px; }
    .title-left .wolf{ height:clamp(110px, 22vh, 170px); }
    .end-top{ grid-template-columns:110px 1fr; }
    .end-top .wolf{ height:100px; }
    .stats{ grid-template-columns:repeat(2,1fr); }
    .gauge-row .gl{ font-size:14px; }
    .dash-hint{ display:none; }
    .gauge{ height:20px; }
  }
  /* 「〜ジャンル　1レベルUP」（本体のジャンルレベルへの反映、2026-09-30〜） */
  .lvup-toast{ position:fixed; top:10px; left:50%; z-index:60; display:none; align-items:center; gap:8px; white-space:nowrap; pointer-events:none;
    padding:6px 16px; border-radius:999px; font-size:14px; color:#3a1408; background:linear-gradient(135deg,#ffe9a8,#ffb347);
    box-shadow:0 0 0 2px rgba(255,255,255,.6), 0 6px 18px rgba(0,0,0,.45); }
  .lvup-toast b{ font-size:17px; color:#b3200e; }
  .lvup-toast.show{ display:flex; animation:lvupToast 1.5s ease forwards; }
  @keyframes lvupToast{ 0%{ transform:translate(-50%,-14px); opacity:0; } 12%{ transform:translate(-50%,0); opacity:1; } 78%{ opacity:1; } 100%{ transform:translate(-50%,-6px); opacity:0; } }
  .lvup-toast.down{ background:linear-gradient(135deg,#d9e6ff,#9db8f0); }
  .lvup-toast.down b{ color:#1f3f8a; }
  .lvup-toast .t{ font-size:12px; }
  .lv-result{ margin-top:10px; padding:8px 14px; border-radius:12px; font-size:15px; line-height:1.6; text-align:center;
    background:linear-gradient(135deg,rgba(255,215,107,.22),rgba(255,154,60,.12)); border:1.5px solid rgba(255,215,107,.6); }
  .lv-result b{ font-size:24px; color:var(--gold); margin-left:4px; }
  .lv-result span{ display:block; font-size:11px; color:var(--sub); }
  .lv-result.down{ background:rgba(120,150,230,.16); border-color:rgba(150,180,255,.55); }
  .lv-result.down b{ color:#9db8f0; }
  @media (max-width:700px){ .lvup-toast{ font-size:11px; padding:5px 12px; } .lvup-toast b{ font-size:14px; } }
</style>
</head>
<body>

<!-- タイトル -->
<section id="scTitle" class="screen show">
  <div class="title-wrap">
    <div class="title-left">
      <div class="wolf flip" id="titleWolf"></div>
      <h1 class="mincho">炎狼ラン</h1>
      <div class="sub">敬語の三つの道を駆けぬけろ</div>
    </div>
    <div class="title-right">
      <!-- タイトルの説明は短く（2026-09-30、教員の指示）。区間ごとのルールは、走る前の区間の画面(showZoneCard)で見せる -->
      <div class="catch mincho">正しい敬語を使って走り抜け！</div>
      <ul class="tips">
        <li><b>→キー</b>か<b>Dキー</b>でダッシュができるぞ</li>
        <li><span class="ic">🦴</span><b>骨</b>をひろうと、炎ゲージがたまる</li>
        <li><span class="ic">🍖</span><b>肉</b>をひろうと、❤が1つ回復する</li>
      </ul>
      <div class="best-line" id="bestLine"></div>
      <div class="title-btns">
        <button class="btn" onclick="startGame()">走り出す！</button>
        <button class="btn secondary" onclick="backToApp()">ミニゲーム一覧へ</button>
      </div>
      <div style="text-align:right"><button class="pill mute-inline" onclick="toggleMute()">🔊</button></div>
    </div>
  </div>
</section>

<!-- ゲーム -->
<section id="scGame" class="screen">
  <div class="hud">
    <span class="lives" id="lives"></span>
    <span class="gates" id="gatesBox"></span>
    <span class="score" id="scoreBox"></span>
    <span class="zone" id="zone"></span>
    <span class="sp"></span>
    <span class="dash-hint">→キー／Dキーでダッシュ</span>
    <button class="pill mute-inline" onclick="toggleMute()">🔊</button>
    <button class="pill" onclick="pauseGame()">⏸</button>
  </div>
  <div class="travel-row" id="travelRow" hidden></div>
  <div class="gauge-row">
    <span class="gl" id="gaugeLabel">🔥 炎ゲージ</span>
    <span class="gauge" id="gaugeBox"><span class="gauge-fill" id="gauge" style="display:block"></span></span>
    <span class="gauge-num" id="gaugeNum"></span>
  </div>
  <div class="word-bar">
    <div class="ctx" id="wordCtx"></div>
    <div class="word mincho" id="word"></div>
  </div>
  <div class="field" id="field">
    <div class="lane s" data-lane="0"><div class="bg"></div><div class="scroll"></div><div class="label"><b>尊敬語</b><small>相手を高める</small></div></div>
    <div class="lane k" data-lane="1"><div class="bg"></div><div class="scroll"></div><div class="label"><b>謙譲語</b><small>へりくだる</small></div></div>
    <div class="lane t" data-lane="2"><div class="bg"></div><div class="scroll"></div><div class="label"><b>丁寧語</b><small>です・ます</small></div></div>
    <div class="ok-stamp" id="okStamp"></div>
    <div id="wolf" class="run"><div class="glow"></div><div class="aura"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="body" id="wolfBody"></div></div>
    <div class="explain" id="explain" onclick="continueRun()"></div>
  </div>
</section>

<!-- 結果 -->
<section id="scEnd" class="screen">
  <div class="end-wrap">
    <div class="end-top">
      <div class="wolf flip" id="endWolf"></div>
      <div>
        <h2 class="mincho" id="endTitle">ゴール！</h2>
        <div class="end-stars" id="endStars"></div>
        <div class="end-rank mincho" id="endRank"></div>
        <div style="font-size:13px;color:var(--sub)" id="endNote"></div>
      </div>
    </div>
    <div class="stats" id="endStats"></div>
    <div id="endLv"></div>
    <div class="travel" id="endTravel" hidden></div>
    <div class="miss-list" id="missList"></div>
    <div class="end-ch" id="endCh" hidden>
      <button class="btn ch" id="endChBtn" onclick="startChallengeRun()">🔥 挑戦モードに進む</button>
      <div class="cl-sub">ふり返りがすんだら、4区間の問題がまぜこぜで出る挑戦モードへ！（❤満タンから）</div>
    </div>
    <div class="end-btns">
      <button class="btn" onclick="startGame()">もう一度走る</button>
      <button class="btn secondary" onclick="showTitle()">タイトルへ</button>
    </div>
  </div>
</section>

<div class="banner" id="banner"></div>
<div class="hib-flash" id="hibFlash"></div>
<div class="overlay" id="zoneOverlay">
  <div class="box zone-box">
    <div class="zb-done" id="zbDone"></div>
    <div class="zb-score" id="zbScore"></div>
    <div class="zb-next" id="zbNext"></div>
    <ul class="zb-rules" id="zbRules"></ul>
    <div class="zb-lanes" id="zbLanes"></div>
    <div class="zb-note" id="zbNote"></div>
    <button class="btn" id="zbBtn" onclick="nextZone()">走り出す！</button>
  </div>
</div>
<div class="overlay" id="clearOverlay">
  <div class="box clear-box">
    <div class="cl-title mincho">🏆 完全クリア！</div>
    <div class="end-stars" id="clStars"></div>
    <div class="zb-score" id="clInfo"></div>
    <button class="btn" onclick="enterChallenge()">🔥 挑戦モードに突入</button>
    <div class="cl-sub">これまでの区間の問題がまぜこぜで出る。❤がなくなるまで何問続けられるか！</div>
    <button class="btn secondary" onclick="clearToResult()">結果を見る</button>
  </div>
</div>
<div class="overlay" id="countOverlay"><div class="count" id="countNum">3</div></div>
<div class="overlay" id="pauseOverlay">
  <div class="box">
    <div style="font-size:18px;font-weight:bold">ひと休み中</div>
    <button class="btn" onclick="resumeGame()">走りを再開する</button>
    <button class="btn secondary" id="quitBtn" onclick="quitGame()">やめてタイトルへ</button>
  </div>
</div>

<script>
/* =====================================================================
   問題データ：[言葉, 種類(T=丁寧語/K=謙譲語/S=尊敬語), 区間(1〜3), 解説, 前置き(省略可)]
   ・区間1：特別な言葉（いらっしゃる・参る など）と、ふつうの「です・ます」
   ・区間2：形で見分ける（お〜になる／お〜する／〜れる・られる／〜ていただく・くださる）
   ・区間3：文の中の［　］の部分を見分ける
   ・「参ります」「おります」のように謙譲語＋丁寧語が重なる形は、どちらの道も正解になってしまうので出さない。
   ===================================================================== */

   OK／MID／NGは見きわめの区間用（上＝正しい／まん中＝考え中／下＝正しくない）。 */
const TYPES = {
  S:{name:"尊敬語", cls:"s", sub:"相手を高める", color:"sonkei", bg:"S"},
  K:{name:"謙譲語", cls:"k", sub:"へりくだる",   color:"kenjo",  bg:"K"},
  T:{name:"丁寧語", cls:"t", sub:"です・ます",   color:"teinei", bg:"T"},
  OK:{name:"〇正しい",   cls:"ok",  sub:"この使い方でよい", color:"ok", bg:"S"},
  MID:{name:"考え中…",    cls:"mid", sub:"ここだと時間切れ", color:"sub", bg:"K"},
  NG:{name:"✕正しくない", cls:"ng", sub:"まちがった使い方", color:"ng", bg:"T"},
};
const TYPE_CLASSES = Object.values(TYPES).map(t => t.cls);
const MISUSE_LANES = ["OK","MID","NG"];
// 道の並び（上から0・1・2）。ふだんは上＝尊敬語／中＝謙譲語／下＝丁寧語。迷いの区間では関所ごとに入れかわる
const DEFAULT_LANES = ["S","K","T"];
let LANE_TYPE = DEFAULT_LANES.slice();
const laneOf = type => LANE_TYPE.indexOf(type);
const BG_PARALLAX = 0.35; // 背景の景色は、走る速さのこの割合で流す（遠くの景色ほどゆっくり動いて見える）

// 今のLANE_TYPEの並びに合わせて、道の色・ラベル・背景（enro_run_bg_data.js、キーは敬語の種類）をはり直す
function applyLanes(animate){
  const bg = window.ENRO_RUN_BG;
  document.querySelectorAll(".lane").forEach((el, i) => {
    const t = TYPES[LANE_TYPE[i]];
    const changed = !el.classList.contains(t.cls);
    TYPE_CLASSES.forEach(c => el.classList.toggle(c, c === t.cls));
    el.querySelector(".label").innerHTML = `<b>${t.name}</b><small>${t.sub}</small>`;
    if(bg && bg[t.bg]) el.querySelector(".bg").style.backgroundImage = `url("${bg[t.bg]}")`;
    if(animate && changed){ el.classList.remove("shuffled"); void el.offsetWidth; el.classList.add("shuffled"); }
  });
  if(bg) document.body.classList.add("has-bg");
}
applyLanes(false);
// 迷いの区間：今と違う並びになるまでまぜる
function shuffleLanes(){
  const before = LANE_TYPE.join("");
  do{ shuffle(LANE_TYPE); }while(LANE_TYPE.join("") === before);
  applyLanes(true);
}

  if(typeof s.clears !== "number") s.clears = 0;

  if(typeof s.bestKm !== "number") s.bestKm = 0;                // 挑戦モードの最長の移動距離
  if(typeof s.muted !== "boolean") s.muted = false;
  return s;
}

/* ---- 効果音（外部ファイルなし、WebAudioで鳴らす） ----
   正解＝「ピンポーン」＋炎がぬける音、不正解＝「ブッブー」＋ぶつかる音（2026-09-29、教員の指示で追加）。 */
let AC = null;
function tone(freq, dur, opt = {}){
  if(SAVE.muted) return;
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + (opt.delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = opt.type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(opt.vol || .14, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur);
  }catch(e){}
}
// ザッという音（炎・衝突用）。ホワイトノイズを帯域フィルターに通して鳴らす
function noise(dur, opt = {}){
  if(SAVE.muted) return;
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + (opt.delay || 0);
    const len = Math.floor(AC.sampleRate * dur);
    const buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = buf;
    const f = AC.createBiquadFilter(); f.type = "bandpass"; f.Q.value = opt.q || 1;
    f.frequency.setValueAtTime(opt.from || 800, t);
    f.frequency.exponentialRampToValueAtTime(opt.to || 800, t + dur);
    const g = AC.createGain();
    g.gain.setValueAtTime(opt.vol || .2, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    src.connect(f).connect(g).connect(AC.destination); src.start(t); src.stop(t + dur);
  }catch(e){}
}
const SE = {
  move(){ tone(660, .05, {type:"triangle", vol:.06}); },
  // 正解：ピン（高）ポーン（低く長く）＋ 炎がぬけるシュッという音。連続正解ほど少しずつ音が高くなる
  pass(combo){
    const k = Math.pow(2, Math.min(combo - 1, 8) / 12);
    tone(1568 * k, .18, {vol:.22}); tone(3136 * k, .12, {vol:.05});
    tone(1245 * k, .55, {vol:.22, delay:.14}); tone(2490 * k, .35, {vol:.05, delay:.14});
    noise(.25, {from:600, to:4000, q:.8, vol:.12});
  },
  // 不正解：ドンとぶつかる音 ＋ ブッブー
  crash(){
    noise(.3, {from:900, to:120, q:.7, vol:.3});
    tone(70, .25, {vol:.25});
    tone(150, .16, {type:"square", vol:.09, delay:.12});
    tone(150, .42, {type:"square", vol:.09, delay:.34});
    tone(147, .42, {type:"sawtooth", vol:.05, delay:.34});
  },
  count(){ tone(523, .12, {type:"triangle"}); },
  go(){ tone(784, .25, {type:"triangle"}); },
  fire(){ [392,523,659,784,1047].forEach((f,i) => tone(f, .18, {type:"sawtooth", vol:.07, delay:i*.06})); },
  item(){ [880,1175,1568,2093].forEach((f,i) => tone(f, .12, {type:"triangle", vol:.13, delay:i*.05})); },
  dash(){ noise(.22, {from:300, to:3000, q:.6, vol:.18}); },
  shuffle(){ [700,500,900].forEach((f,i) => tone(f, .07, {type:"square", vol:.05, delay:i*.05})); },
  win(){ [523,659,784,1047,784,1047,1319].forEach((f,i) => tone(f, .25, {type:"triangle", delay:i*.11})); },
  zone(){ [523,659,784].forEach((f,i) => tone(f, .2, {type:"triangle", delay:i*.1})); },

// まだ出していない言葉から選ぶ（同じ言葉がすぐにまた出ないよう、使い切るまでくり返さない）
function nextWord(){
  const zone = ZONES[G.zone];
  if(zone.misuse){
    // 見きわめの区間：誤用問題から、まだ出していないものを選ぶ
    let pool = MISUSE.filter(w => !G.usedMisuse.has(w[0]));
    if(!pool.length){ G.usedMisuse.clear(); pool = MISUSE.slice(); }
    const w = pool[Math.floor(Math.random() * pool.length)];
    G.usedMisuse.add(w[0]);
    return w;
  }
  const maxLv = zone.maxLv;
  // 新しい区間に入った直後は、その区間の言葉を優先して出す
  let pool = WORDS.filter(w => w[2] <= maxLv && !G.used.has(w[0]));
  if(!pool.length){ G.used.clear(); pool = WORDS.filter(w => w[2] <= maxLv && w[0] !== G.lastWord); }
  const fresh = pool.filter(w => w[2] === maxLv);
  const src = (fresh.length && Math.random() < 0.6) ? fresh : pool;
  const w = src[Math.floor(Math.random() * src.length)];
  G.used.add(w[0]); G.lastWord = w[0];
  return w;
}

/* 挑戦モードの移動距離（2026-09-30〜、教員の指示）。挑戦モードでは得点のかわりにkmがたまる（1点＝KM_PER_POINT km）。
   盛岡を出発して西回りに世界を一周し、盛岡へ帰ってくるルート。数字は盛岡からの道のり（各地点の間の大圏距離を
   足し上げたもの、km）。一周は約4万2千km。一周をこえたら2周目に入る。 */
const KM_PER_POINT = 10;
const WORLD_ROUTE = [
  [0,"盛岡","日本"],[161,"仙台","日本"],[465,"東京","日本"],[730,"名古屋","日本"],[870,"大阪","日本"],[1150,"広島","日本"],
  [1360,"福岡","日本"],[1574,"プサン（釜山）","韓国"],[1900,"ソウル","韓国"],[2852,"ペキン（北京）","中国"],
  [3919,"シャンハイ（上海）","中国"],[4609,"タイペイ（台北）","台湾"],[5420,"ホンコン（香港）","中国"],[6292,"ハノイ","ベトナム"],
  [7279,"バンコク","タイ"],[8707,"シンガポール","シンガポール"],[10622,"ヤンゴン","ミャンマー"],[11658,"コルカタ","インド"],
  [12961,"ニューデリー","インド"],[15166,"ドバイ","アラブ首長国連邦"],[17589,"カイロ","エジプト"],[18826,"イスタンブール","トルコ"],
  [19388,"アテネ","ギリシャ"],[20439,"ローマ","イタリア"],[21545,"パリ","フランス"],[21889,"ロンドン","イギリス"],
  [23778,"レイキャビク","アイスランド"],[25208,"ヌーク","グリーンランド"],[27685,"モントリオール","カナダ"],
  [28219,"ニューヨーク","アメリカ"],[29363,"シカゴ","アメリカ"],[32167,"ロサンゼルス","アメリカ"],[36287,"ホノルル","アメリカ（ハワイ）"],
  [42354,"盛岡","日本"],
];
const WORLD_LAP = WORLD_ROUTE[WORLD_ROUTE.length - 1][0];
// km進んだとき、どこまで到達したか：{laps:何周したか, at:最後に着いた地点, next:次の地点, left:次までの残りkm}
function placeOf(km){
  const laps = Math.floor(km / WORLD_LAP), r = km % WORLD_LAP;
  let i = 0;
  while(i + 1 < WORLD_ROUTE.length && WORLD_ROUTE[i + 1][0] <= r) i++;
  const next = WORLD_ROUTE[i + 1] || WORLD_ROUTE[1];
  return {laps, at:WORLD_ROUTE[i], next, left:next[0] - r};
}
// 「中国のペキン（北京）」のように国名を前につける（日本の地名と、国名と同じ地名はそのまま）
const placeName = pt => (pt[2] === "日本" || pt[1] === pt[2]) ? pt[1] : `${pt[2]}の${pt[1]}`;
const kmText = n => n.toLocaleString("ja-JP");

/* 挑戦モードの速さ（2026-09-30、教員の指示）：どの種類の問題も、見きわめの区間に入ったときの速さ（約7.6秒）から始め、
   正解CH_EVERY問ごとにCH_STEP秒ずつ速くする（最速CH_MIN秒）。2026-10-01、「速くなるのが遅い」との教員の指示で0.2→0.4秒（2倍）に。 */
const MISUSE_ZONE = ZONES.find(z => z.misuse);
const CH_START = (Math.max(TRAVEL_MIN, TRAVEL_START - MISUSE_ZONE.from * TRAVEL_STEP) + MISUSE_ZONE.extra) * MISUSE_ZONE.timeMul;
const CH_EVERY = 3, CH_STEP = 0.4, CH_MIN = 2.0;
function travelTime(){
  if(G.challenge) return Math.max(CH_MIN, CH_START - Math.floor(G.chCorrect / CH_EVERY) * CH_STEP);
  const z = ZONES[G.zone];
  return (Math.max(TRAVEL_MIN, TRAVEL_START - G.correct * TRAVEL_STEP) + (z.extra || 0)) * (z.timeMul || 1);
}
// n個の関所を（正解で）通った時点が、区間の変わり目かどうか。まちがえた関所は数えないので、nはG.correct
const isZoneBoundary = n => n > 0 && n < GOAL_GATES && ZONES.some(z => z.from === n);

function pickChallengeZone(){
  const z = Math.floor(Math.random() * ZONES.length);
  const changed = z !== G.zone;
  G.zone = z;
  document.body.classList.toggle("maze", !!ZONES[z].maze);

}

function spawnBarrier(){
  if(G.challenge) pickChallengeZone();
  else{
    // 区間が進んだか（正解で通った関所の数で決まる。ふつうはzoneBreakで切りかえ済み）
    const z = zoneOf(G.correct);
    if(z !== G.zone) enterZone(z);
  }
  if(ZONES[G.zone].maze){ shuffleLanes(); SE.shuffle(); }
  // 見きわめの区間：炎狼は関所ごとにまん中（考え中）へ戻る
  if(ZONES[G.zone].misuse) G.lane = 1;
  placeWolf();

  const el = document.createElement("div");

function spawnItem(){
  const kind = (G.lives < LIVES && Math.random() < 0.5) ? "meat" : "bone";

function moveItem(it){
  it.el.style.transform = `translate(${it.x}px, ${it.lane * geo.laneH + (geo.laneH - it.size) / 2}px)`;

function collectItem(it){
  it.done = true;
  it.el.classList.add("got");

  if(it.kind === "meat" && G.lives < LIVES){

  }else if(G.hib > 0){
    G.hib = Math.min(HIBASHIRI_LEN, G.hib + 2);
    popup(`🦴 炎ブーストがのびた！`);
  }else{
    G.gauge += it.kind === "meat" ? 1 : BONE_GAUGE;
    popup(it.kind === "meat" ? "🍖 炎ゲージ＋1" : `🦴 ${ITEMS.bone.label}`);
    if(G.gauge >= GAUGE_MAX) startHibashiri();
  }
  refreshHud();
}

function startLoop(){ lastTs = 0; rafId = requestAnimationFrame(loop); }
function stopLoop(){ if(rafId) cancelAnimationFrame(rafId); rafId = null; }

function loop(ts){
  if(!G){ rafId = null; return; }
  const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0;
  lastTs = ts;
  if(G.phase === "run"){
    G.scroll += G.speed * dt;
    document.querySelectorAll(".lane .scroll").forEach(s => s.style.backgroundPosition = `${-G.scroll}px 0`);
    document.querySelectorAll(".lane .bg").forEach(s => s.style.backgroundPosition = `${-G.scroll * BG_PARALLAX}px 50%`);
    G.barriers.forEach(b => {
      b.x -= G.speed * dt;
      b.el.style.transform = `translateX(${b.x}px)`;
      if(!b.judged && b.x <= geo.judgeX) judge(b);
    });
    // アイテム：炎狼の体に重なったとき、同じ道にいればひろう
    G.items.forEach(it => {
      it.x -= G.speed * dt;
      moveItem(it);
      if(!it.done && G.lane === it.lane && it.x <= geo.wolfX + geo.wolfW * 0.75 && it.x + it.size >= geo.wolfX + geo.wolfW * 0.2) collectItem(it);
    });
    G.items = G.items.filter(it => {
      if(it.done) return false;
      if(it.x < -it.size - 20){ it.el.remove(); return false; }
      return true;
    });
    // 通りすぎた関所を消す
    G.barriers = G.barriers.filter(b => {
      if(b.x < -geo.barW - 20){ b.el.remove(); return false; }
      return true;
    });
    if(G && G.phase === "run" && G.spawnWait > 0){
      G.spawnWait -= dt;
      if(G.spawnWait <= 0){ G.spawnWait = 0; spawnBarrier(); }
    }
  }
  if(G) rafId = requestAnimationFrame(loop);
}

function judge(b){
  b.judged = true;
  G.total++;
  const want = laneOf(b.w[1]);
  const gates = b.el.querySelectorAll(".gate");
  if(G.lane === want){
    // 正解：関所を通りぬける
    gates[want].classList.add("open", "burst");
    showCorrect(want, b.w[1]);
    mgCorrect();                                 // 本体の「敬語」ジャンル：正解1つで＋1
    G.correct++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
    let pts = 10 + Math.min(G.combo, 10) * 2;
    if(G.hib > 0) pts *= 2;
    if(G.challenge){
      const km = pts * KM_PER_POINT, before = placeOf(G.km);
      G.km += km;
      popup(`+${kmText(km)}km`);
      const after = placeOf(G.km);
      if(after.at !== before.at || after.laps !== before.laps){
        banner(after.at[0] === 0 ? `🌏 地球一周！<small>盛岡に帰ってきた！</small>` : `📍 ${placeName(after.at)} に到着！`, 1300);
      }
    }else{
      G.score += pts;
      popup(`+${pts}`);
    }
    SE.pass(G.combo);
    wolfPose("attack", 260);
    if(G.hib > 0){
      G.hib--;
      if(G.hib === 0) endHibashiri();
    }else{
      G.gauge++;
      if(G.gauge >= GAUGE_MAX) startHibashiri();
    }
    setTimeout(() => b.el.classList.add("gone"), 150);
    refreshHud();
    if(G.challenge){ G.chCorrect++; refreshHud(); G.spawnWait = 0.3; }
    else if(G.correct >= GOAL_GATES){ G.phase = "between"; setTimeout(() => { if(G && G.phase === "between") fullClear(); }, 700); }
    else if(isZoneBoundary(G.correct)){ G.phase = "between"; setTimeout(() => { if(G && G.phase === "between") zoneBreak(); }, 900); }
    else G.spawnWait = 0.3;
  }else{
    // まちがい：ぶつかる。走りを止めて、正しい道と解説を見せる
    gates[G.lane].classList.add("crash");
    mgWrong();                                   // 本体の「敬語」ジャンル：まちがい2つで−1
    gates[want].classList.add("open");
    SE.crash();
    const protectedByFire = G.hib > 0;
    if(protectedByFire){
      G.hib--;
      if(G.hib === 0) endHibashiri();
    }else{
      G.lives--;
      G.gauge = Math.max(0, G.gauge - WRONG_GAUGE_LOSS);
    }
    G.combo = 0;
    G.misses.push({w:b.w, chose:LANE_TYPE[G.lane], ch:G.challenge});
    const w = $("wolf");
    w.classList.remove("run", "hit"); void w.offsetWidth; w.classList.add("hit");
    setWolf($("wolfBody"), "defense");
    document.querySelectorAll(".lane")[want].classList.add("answer");
    refreshHud();
    G.phase = "reveal";
    G.revealBarrier = b;
    const t = TYPES[b.w[1]];
    const ex = $("explain");
    ex.className = "explain show" + (protectedByFire ? " hib" : "");
    const timeUp = LANE_TYPE[G.lane] === "MID";
    const verdict = t.cls === "ok" || t.cls === "ng"
      ? `この使い方は <span style="color:var(--${t.color})">${t.cls === "ok" ? "正しい" : "正しくない"}</span>`
      : `「${wordHtml(b.w[0])}」は <span style="color:var(--${t.color})">${t.name}</span>`;
    ex.innerHTML = `<div class="head">${protectedByFire ? "🔥 炎ブーストで守られた！　" : timeUp ? `<span class="ng">⏰ 時間切れ！</span>　` : `<span class="ng">✖ ぶつかった！</span>　`}${verdict}</div>
      ${t.cls === "ok" || t.cls === "ng" ? `<div class="mincho" style="font-size:16px">${b.w[4] ? esc(b.w[4]) : ""}${wordHtml(b.w[0])}</div>` : ""}
      <div>${esc(b.w[3])}</div>
      ${protectedByFire ? "" : `<div style="font-size:12px;color:var(--sub)">❤ −1　炎ゲージ −${WRONG_GAUGE_LOSS}</div>`}
      ${!G.challenge && G.lives > 0 ? `<div style="font-size:12px;color:var(--sub)">まちがえた関所は数に入らない。もう一度、次の関所で勝負！</div>` : ""}
      <div class="next">${G.lives > 0 ? "タップで走りを再開" : ""}</div>`;
    if(G.lives <= 0){
      setTimeout(gameOver, 1900);
    }else{
      G.revealTimer = setTimeout(continueRun, 4200);
    }
  }
}

// 解説を閉じて走りを再開する
function continueRun(){
  if(!G || G.phase !== "reveal" || G.lives <= 0) return;
  clearTimeout(G.revealTimer);
  $("explain").classList.remove("show");
  document.querySelectorAll(".lane").forEach(l => l.classList.remove("answer"));
  const b = G.revealBarrier;
  if(b){ b.el.remove(); G.barriers = G.barriers.filter(x => x !== b); G.revealBarrier = null; }
  setWolf($("wolfBody"), G.hib > 0 ? "attack" : "pose1");
  $("wolf").className = "run";
  G.phase = "run";
  G.spawnWait = 0.25;
  lastTs = 0;
}

function wolfPose(pose, ms){
  setWolf($("wolfBody"), pose);
  clearTimeout(G.poseTimer);
  G.poseTimer = setTimeout(() => { if(G && G.phase === "run") setWolf($("wolfBody"), G.hib > 0 ? "attack" : "pose1"); }, ms);
}

function startHibashiri(){
  G.gauge = 0; G.hib = HIBASHIRI_LEN;
  document.body.classList.add("hibashiri");
  SE.fire();
  const fl = $("hibFlash"); fl.classList.remove("show"); void fl.offsetWidth; fl.classList.add("show");
  banner(`🔥 炎ブースト！ 🔥<small>${HIBASHIRI_LEN}問のあいだ、得点2倍・ぶつかっても❤が減らない</small>`, 1800, "hib");
}
function endHibashiri(){
  document.body.classList.remove("hibashiri");
  setTimeout(() => { if(G && G.phase === "run") popup("炎ブーストおわり"); }, 450);   // 得点の表示と重ならないよう少しずらす
}

// 正解がはっきりわかるように：判・道の光・言葉の色・効果音
function showCorrect(lane, type){
  const st = $("okStamp");
  st.innerHTML = `<span class="ring"></span>正解！<small>${TYPES[type].name.replace(/^[〇✕]/, "")}</small>`;
  // 炎狼に重ならないよう、炎狼の右側の空いた所のまん中に、はみ出さない大きさで出す
  const right = geo.wolfX + geo.wolfW, room = geo.W - right - 16;
  st.style.fontSize = Math.max(22, Math.min(56, room / 6.4)) + "px";
  st.style.left = (right + (geo.W - right) / 2) + "px";
  st.style.top = (lane * geo.laneH + geo.laneH / 2) + "px";
  st.classList.remove("show"); void st.offsetWidth; st.classList.add("show");
  const ln = document.querySelectorAll(".lane")[lane];
  ln.classList.remove("good"); void ln.offsetWidth; ln.classList.add("good");
  $("word").classList.add("ok");
}
const MG_CAT = "keigo", MG_GENRE = "敬語";   // このゲームで上下する本体のジャンル
/* 本体（kokugo_app.html）のジャンルレベルへの反映（2026-09-30〜、教員の指示）。
   1回のゲームの中で「正解1つ＝＋1、まちがい2つ＝−1」と数え、ゲームが終わったときに差し引き
   （正解数 − まちがい数÷2の切り捨て）を「今回のジャンルレベルの増減」として本体へ渡す。
   本体のセーブには直接触れず、localStorage（MG_PENDING_LVUP_LSKEY）に{ジャンル: 増減}を書き足すだけ。
   本体がホーム画面を開くときに反映する（kokugo_app.htmlのmgApplyPendingLevelUps参照。マイナスならレベルが下がる。
   経験値はレベルから計算されるので、あわせて上下する）。
   途中でやめた・ページを離れたときも、そこまでの分を必ず渡す（まちがいが多いときにやめて、下がるのを逃れられないように）。 */
const MG_PENDING_LVUP_LSKEY = "kokugo_minigame_pending_lvups_v1";
let MGS = null;   // 今のゲームの {ok:正解数, ng:まちがい数}（ゲームの外ではnull）
const mgNet = () => MGS ? MGS.ok - Math.floor(MGS.ng / 2) : 0;
const mgSigned = n => n > 0 ? "+" + n : n < 0 ? "−" + (-n) : "±0";
function mgStart(){ mgFlush(); MGS = {ok:0, ng:0}; }
function mgCorrect0(){ if(!MGS) return; MGS.ok++; showLvupToast(1); }
function mgWrong0(){ if(!MGS) return; MGS.ng++; if(MGS.ng % 2 === 0) showLvupToast(-1); }
// ゲームの終わり：差し引きを本体への合図に足し、結果を返す（ゲーム中でなければnull）
function mgFlush(){
  if(!MGS) return null;
  const r = {ok:MGS.ok, ng:MGS.ng, net:mgNet()};
  const sent = MGS.sent || 0;   // 上がった分はその場で渡し済み（mgSyncUp）
  MGS = null;
  mgWritePending(r.net - sent);   // 残り（下がる分など）をここで精算
  return r;
}
/* 本体へのリアルタイム反映とデイリーログイン報酬（2026-10-04、教員の指示：「ミニゲームは全部ログイン報酬の対象に」
   「ジャンルレベルが上がった場合も必ずリアルタイムで反映」）。
   ・答えるたびに、本体と共通のキー（kokugo_mg_played_v1）へ今日の日付を書く。本体はこれが今日ならログイン報酬を成立させる。
   ・ジャンルレベルが上がった分は、上がったその場で書き置きに足す（本体はセーブを読むたびに取りこむ）。
     下がる分は、今までどおりゲームの終わり（mgFlush）にまとめて精算する（途中で上下をくり返してごほうびを余分にもらわないように）。 */
const MG_PLAYED_LSKEY = "kokugo_mg_played_v1";
function mgNotePlayed(){
  try{ const d = new Date(); localStorage.setItem(MG_PLAYED_LSKEY, d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0")); }catch(e){}
}
function mgWritePending(n){
  if(!n) return;
  let o = {};
  try{ o = JSON.parse(localStorage.getItem(MG_PENDING_LVUP_LSKEY)) || {}; }catch(e){ o = {}; }
  if(!o || typeof o !== "object") o = {};
  o[MG_CAT] = (Number(o[MG_CAT]) || 0) + n;
  try{ localStorage.setItem(MG_PENDING_LVUP_LSKEY, JSON.stringify(o)); }catch(e){}
}
function mgSyncUp(){ if(!MGS) return; const n = mgNet(); if(n > (MGS.sent || 0)){ mgWritePending(n - (MGS.sent || 0)); MGS.sent = n; } }
function mgCorrect(){ mgCorrect0(); mgNotePlayed(); mgSyncUp(); }
function mgWrong(){ mgWrong0(); mgNotePlayed(); }
window.addEventListener("pagehide", mgFlush);   // 「ミニゲーム一覧へ」やタブを閉じたときも、そこまでの分を渡す
// 正解・まちがい（2つめごと）のたびに画面の上へ出す表示
function showLvupToast(d, text){
  let el = document.getElementById("lvupToast");
  if(!el){ el = document.createElement("div"); el.id = "lvupToast"; el.className = "lvup-toast"; document.body.appendChild(el); }
  el.innerHTML = text || `<span class="g">${MG_GENRE}ジャンル</span><b>${d > 0 ? "1レベルUP" : "1レベルDOWN"}</b><span class="t">（今回 ${mgSigned(mgNet())}）</span>`;
  el.classList.toggle("down", d < 0);
  el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
}
// 結果画面に出す「今回のジャンルレベル」
function mgResultHtml(r){
  if(!r) return "";
  return `<div class="lv-result ${r.net < 0 ? "down" : ""}">${MG_GENRE}ジャンル　レベル <b>${mgSigned(r.net)}</b>
    <span>（正解 ${r.ok}・まちがい ${r.ng}　→　正解1つで＋1、まちがい2つで−1）</span></div>`;
}
// 途中でやめたときに、一覧・タイトルの画面で結果を知らせる
function mgShowQuitResult(r){
  if(!r || (!r.ok && !r.ng)) return;
  showLvupToast(r.net < 0 ? -1 : 1, `<span class="g">今回の${MG_GENRE}ジャンル</span><b>レベル ${mgSigned(r.net)}</b>`);
}
function popup(text){
  const p = document.createElement("div");
  p.className = "popup"; p.textContent = text;
  p.style.left = (geo.wolfX + geo.wolfW * 0.4) + "px";
  p.style.top = (G.lane * geo.laneH + geo.laneH * 0.3) + "px";
  $("field").appendChild(p);
  setTimeout(() => p.remove(), 850);
}

function refreshHud(){
  $("lives").innerHTML = Array.from({length:LIVES}, (_, i) => i < G.lives ? "❤️" : `<span class="off">❤️</span>`).join("");
  $("scoreBox").innerHTML = `得点 <b>${G.score}</b>`;
  $("scoreBox").hidden = G.challenge;   // 挑戦モードの移動kmは、下の現在地の行に大きく出す
  const tr = $("travelRow");
  tr.hidden = !G.challenge;
  if(G.challenge){
    const pl = placeOf(G.km);
    const here = G.km === 0 ? "盛岡（出発）" : placeName(pl.at);
    const arrived = tr.dataset.at !== here;
    tr.dataset.at = here;
    tr.innerHTML = `<span class="tkm"><small>移動</small>${kmText(G.km)} km</span>
      <span class="tat ${arrived ? "arrive" : ""}"><small>📍現在地</small>${esc(here)}${pl.laps > 0 ? `<small style="margin-left:6px">🌏${pl.laps}周達成</small>` : ""}</span>
      <span class="tnext">次は <b>${esc(placeName(pl.next))}</b>　あと ${kmText(pl.left)} km</span>`;
  }
  $("gatesBox").innerHTML = G.challenge ? `🔥挑戦 <b>${G.chCorrect}</b> 問`
                                       : `関所 <b>${Math.min(G.correct, GOAL_GATES)}</b> / ${GOAL_GATES}`;
  $("zone").textContent = `${G.challenge ? "挑戦モード" : ZONES[G.zone].name}　${G.combo >= 2 ? G.combo + "連続！" : ""}`;
  const g = G.hib > 0 ? G.hib / HIBASHIRI_LEN : G.gauge / GAUGE_MAX;
  $("gauge").style.width = (g * 100) + "%";
  $("gaugeLabel").textContent = G.hib > 0 ? "🔥 炎ブースト中！" : "🔥 炎ゲージ";
  $("gaugeNum").textContent = G.hib > 0 ? `あと${G.hib}問` : `${G.gauge} / ${GAUGE_MAX}`;
  const box = $("gaugeBox");
  box.classList.toggle("hibmode", G.hib > 0);
  // ふえたらはずむ、減ったらゆれる（炎ブーストの残りが減るのはふつうの消費なので、ゆらさない）
  if(G.hib === 0 && G.gauge !== G.prevGauge){
    const cls = G.gauge > G.prevGauge ? "bump" : "drop";
    box.classList.remove("bump", "drop"); void box.offsetWidth; box.classList.add(cls);
  }
  G.prevGauge = G.gauge;
}

/* ---- ダッシュ（→キー・Dキー）：考えがまとまったら、関所の前まで一気に進んでその場で判定する。
   関所・アイテム・背景をまとめて同じだけ進める（炎狼が前へ飛んだように見える）。 ---- */
function dash(){
  if(!G || G.phase !== "run") return;
  const b = G.barriers.find(x => !x.judged);
  if(!b) return;
  const d = b.x - geo.judgeX;
  if(d <= 4) return;
  G.barriers.forEach(x => { x.x -= d; x.el.style.transform = `translateX(${x.x}px)`; });
  // とびこえる間にある、今の道のアイテムはひろう（一気に動かすので、ふだんの当たり判定では取りこぼす。2026-10-01修正）
  const hitL = geo.wolfX + geo.wolfW * 0.2, hitR = geo.wolfX + geo.wolfW * 0.75;
  G.items.forEach(it => {
    const from = it.x;
    it.x -= d; moveItem(it);
    if(!it.done && it.lane === G.lane && it.x <= hitR && from + it.size >= hitL) collectItem(it);
  });
  G.scroll += d;
  const w = $("wolf"); w.classList.remove("dash"); void w.offsetWidth; w.classList.add("dash");
  const f = $("field"); f.classList.remove("dashfx"); void f.offsetWidth; f.classList.add("dashfx");
  SE.dash();
}

/* ---- 道の移動：道をタップ／キーボード（↑↓・1/2/3） ---- */
function moveTo(lane){
  if(!G || G.phase !== "run") return;
  lane = Math.max(0, Math.min(2, lane));
  if(lane === G.lane) return;
  G.lane = lane; placeWolf(); SE.move();
}
document.querySelectorAll(".lane").forEach(el => {
  el.addEventListener("pointerdown", e => {
    if(G && G.phase === "reveal"){ continueRun(); return; }
    moveTo(+el.dataset.lane);
  });
});
document.addEventListener("keydown", e => {
  if(!G) return;
  if(G.phase === "reveal" && (e.key === " " || e.key === "Enter")){ e.preventDefault(); continueRun(); return; }
  if((G.phase === "break" || G.phase === "intro") && (e.key === " " || e.key === "Enter")){ e.preventDefault(); nextZone(); return; }
  if(e.key === "ArrowRight" || e.key === "d" || e.key === "D"){ e.preventDefault(); if(!e.repeat) dash(); return; }
  if(e.key === "ArrowUp" || e.key === "w"){ e.preventDefault(); moveTo(G.lane - 1); }
  else if(e.key === "ArrowDown" || e.key === "s"){ e.preventDefault(); moveTo(G.lane + 1); }
  else if(e.key === "1") moveTo(0);
  else if(e.key === "2") moveTo(1);
  else if(e.key === "3") moveTo(2);
  else if(e.key === "Escape" || e.key === "p") pauseGame();
});

/* ---- ひと休み ---- */
function pauseGame(){
  if(!G || (G.phase !== "run" && G.phase !== "reveal")) return;
  G.pausedFrom = G.phase; G.phase = "paused";
  clearTimeout(G.revealTimer);
  $("quitBtn").textContent = G.challenge ? "挑戦を終えて結果を見る" : "やめてタイトルへ";
  $("pauseOverlay").classList.add("show");
}
function resumeGame(){
  if(!G || G.phase !== "paused") return;
  $("pauseOverlay").classList.remove("show");
  G.phase = G.pausedFrom; lastTs = 0;
  if(G.phase === "reveal") G.revealTimer = setTimeout(continueRun, 3000);
}
function quitGame(){
  $("pauseOverlay").classList.remove("show"); $("zoneOverlay").classList.remove("show");
  if(G && G.challenge){ G.phase = "over"; stopLoop(); showEnd(true); return; }
  const r = mgFlush();
  showTitle();
  mgShowQuitResult(r);
}
document.addEventListener("visibilitychange", () => { if(document.hidden) pauseGame(); });

/* =====================================================================
   ゲームオーバー → 結果
   ===================================================================== */
// ❤がなくなった。挑戦モード中なら、完全クリアしたうえでの挑戦終了として結果へ
function gameOver(){
  if(!G) return;
  G.phase = "over";
  stopLoop();
  SE.over();
  setWolf($("wolfBody"), "defeat");
  $("wolf").className = "";
  setTimeout(() => showEnd(G.challenge), 900);
}

// 関所32個を正解で通りきった：完全クリア。★はここまでのミスで決まる。結果を見るか、挑戦モードへ進むかを選ぶ
function fullClear(){
  if(!G) return;
  G.phase = "clear";
  G.clearMisses = G.misses.length;
  G.clearStars = G.clearMisses === 0 ? 3 : G.clearMisses <= STAR2_MISS ? 2 : 1;
  SE.win();
  setWolf($("wolfBody"), "attack"); $("wolf").className = "";
  document.body.classList.remove("hibashiri", "maze");
  $("clStars").innerHTML = [0,1,2].map(i => i < G.clearStars ? `<span class="pop" style="animation-delay:${.2 + i * .25}s">★</span>` : `<span class="off">★</span>`).join("");
  $("clInfo").innerHTML = `関所${GOAL_GATES}個を走りぬけた！<br>得点 <b>${G.score}</b>　ミス <b>${G.clearMisses}</b> 回`;
  $("clearOverlay").classList.add("show");
}
function clearToResult(){
  $("clearOverlay").classList.remove("show");
  G.phase = "over"; stopLoop();
  showEnd(true);
}
// 挑戦モード：❤を満タンにして、ルールの画面（区間の画面と同じもの）を見せてから走り出す
function enterChallenge(){
  $("clearOverlay").classList.remove("show");
  G.challenge = true; G.chCorrect = 0;
  G.lives = LIVES;
  G.phase = "break";
  refreshHud();
  layout(); placeWolf();   // 現在地の行が出たぶん道の高さが変わるので、配置を計算し直す
  $("zbDone").textContent = "🔥 挑戦モード突入！";
  $("zbScore").innerHTML = `❤を満タンにしたぞ！ ${"❤️".repeat(LIVES)}` + (SAVE.bestKm > 0 ? `<br>これまでの最長 <b>${kmText(SAVE.bestKm)}</b> km（${placeName(placeOf(SAVE.bestKm).at)}まで）` : "");
  $("zbNext").textContent = "挑戦モード（❤がなくなるまで）";
  $("zbRules").innerHTML = [
    "これまでの4つの区間の問題が、<b>1問ごとにまぜこぜ</b>で出る。",
    "問題ごとに<b>道の種類や並びが変わる</b>。上に出る【区間の名前】と、道のラベルをよく見よう。",
    "❤がなくなるまで、<b>何問続けられるか</b>に挑戦！　<b>3問正解するごと</b>に少しずつ速くなるぞ。",
    "挑戦モードでは、得点のかわりに<b>移動距離（km）</b>がたまる。<b>盛岡から出発して、世界中を走っていこう！</b>",
  ].map(r => `<li>${r}</li>`).join("");
  $("zbLanes").innerHTML = "";
  $("zbNote").textContent = "";
  $("zbBtn").textContent = "挑戦スタート！";
  $("zoneOverlay").classList.add("show");
}

function showEnd(cleared){
  if(!G) return;
  document.body.classList.remove("hibashiri", "maze");
  const chOnly = !!G.chOnly;   // 結果画面から挑戦モードだけを走った回（区間の★・得点はない）
  const miss = cleared && !chOnly ? G.clearMisses : G.misses.length;
  const stars = cleared ? G.clearStars : 0;
  const newBest = G.score > SAVE.best;
  const newStars = stars > SAVE.bestStars;
  const newCh = G.challenge && G.chCorrect > SAVE.bestChallenge;
  const newKm = G.challenge && G.km > SAVE.bestKm;
  if(newKm) SAVE.bestKm = G.km;
  SAVE.plays++;
  if(newBest) SAVE.best = G.score;
  if(newStars) SAVE.bestStars = stars;
  if(cleared && !chOnly) SAVE.clears++;
  if(newCh) SAVE.bestChallenge = G.chCorrect;
  if(G.correct > SAVE.bestCorrect) SAVE.bestCorrect = G.correct;
  writeSave();
  const lvr = mgFlush();
  $("endLv").innerHTML = mgResultHtml(lvr);
  let rank = RANKS[0][1]; RANKS.forEach(([n, r]) => { if(G.score >= n) rank = r; });
  setWolf($("endWolf"), cleared ? (stars === 3 ? "attack" : "pose2") : "defeat");
  $("endTitle").textContent = chOnly ? "挑戦モード終了！" : cleared ? "完全クリア！" : "リタイア…";
  $("endStars").innerHTML = chOnly ? "" : cleared
    ? [0,1,2].map(i => i < stars ? `<span class="pop" style="animation-delay:${.2 + i * .25}s">★</span>` : `<span class="off">★</span>`).join("")
    : `<span style="font-size:15px;color:var(--sub);letter-spacing:0">${G.correct + 1}個目の関所で力つきた…　あと${GOAL_GATES - G.correct}個！</span>`;
  $("endRank").textContent = chOnly ? "" : `称号：${rank}`;
  const notes = [];
  if(G.challenge) notes.push(newKm ? "🌏 最長記録！" : `最長 ${kmText(SAVE.bestKm)}km`);
  if(newStars && cleared) notes.push(`🎉 ★${stars}はじめて達成！`);
  if(newBest) notes.push("🎉 自己ベスト更新！");
  if(!notes.length) notes.push(`自己ベスト ${SAVE.best} 点`);
  if(cleared && !chOnly && stars < 3) notes.push(stars === 2 ? "ノーミスで★3！" : `ミス${STAR2_MISS}回以内で★2！`);
  $("endNote").textContent = notes.join("　");
  $("endStats").innerHTML = `
    ${chOnly ? `<div class="stat ${newKm ? "new" : ""}">移動<b>${kmText(G.km)}km</b></div>` : `<div class="stat ${newBest ? "new" : ""}">得点<b>${G.score}</b></div>`}
    <div class="stat">正解<b>${G.correct} / ${G.total}</b></div>
    <div class="stat">ミス${cleared && !chOnly ? "（クリアまで）" : ""}<b>${miss}回</b></div>
    ${G.challenge ? `<div class="stat ${newCh ? "new" : ""}">挑戦モード<b>${G.chCorrect}問</b></div>` : `<div class="stat">最大連続<b>${G.maxCombo}</b></div>`}`;
  // 挑戦モードの移動距離：盛岡からの世界一周ルートのどこまで行けたか
  const tr = $("endTravel");
  tr.hidden = !G.challenge;
  if(G.challenge){
    const pl = placeOf(G.km);
    const reached = pl.laps > 0 && pl.at[0] === 0
      ? `地球を${pl.laps}周して、盛岡に帰ってきた！`
      : `${pl.laps > 0 ? `地球を${pl.laps}周して、さらに` : ""}${G.km === 0 ? "盛岡から出発できなかった…" : `${placeName(pl.at)}まで到達した！`}`;
    tr.innerHTML = `<div>挑戦モード（${G.chCorrect}問正解）</div>
      <div class="km">移動距離 ${kmText(G.km)} km</div>
      <div class="place">${reached}</div>
      <div class="next">次の ${placeName(pl.next)} まで、あと ${kmText(pl.left)} km</div>`;
  }
  $("missList").innerHTML = !G.misses.length ? `<div class="perfect">🔥 ノーミス！ すべての関所を正しい道で走りぬけた！</div>`
    : `<h3>ぶつかった言葉をふり返ろう</h3>` + G.misses.map(m => {
    const t = TYPES[m.w[1]];
    return `<div class="miss ${t.cls}">
      <div class="w">${m.ch ? `<span class="chtag">挑戦</span>` : ""}${m.w[4] ? `<span style="font-size:12px;color:var(--sub)">${esc(m.w[4])}</span>` : ""}${wordHtml(m.w[0])}　→　<span class="ty">${t.name}</span>
        <span style="font-size:12px;color:var(--sub)">（${m.chose === "MID" ? "時間切れ" : "選んだのは" + TYPES[m.chose].name}）</span></div>
      <div>${esc(m.w[3])}</div></div>`;
  }).join("");
  // 完全クリアした回は、結果（ふり返り）を見たあとで挑戦モードへ進めるようにする
  $("endCh").hidden = !cleared;
  $("endChBtn").textContent = G.challenge ? "🔥 もう一度 挑戦モードに挑む" : "🔥 挑戦モードに進む";
  show("scEnd");
}

showTitle();
</script>
</body>
</html>
