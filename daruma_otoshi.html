#hHammer.grab svg{animation:hgrab .25s cubic-bezier(.3,1.8,.5,1)}
@keyframes hgrab{from{transform:scale(.4)}}
#fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:10}
#popLayer{position:fixed;inset:0;pointer-events:none;z-index:11}
.pop{position:absolute;font-weight:900;white-space:nowrap;transform:translate(-50%,-50%);animation:popup .9s forwards;
  text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff}
.pop.long{animation-duration:1.6s}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;box-shadow:inset 0 0 120px 40px rgba(229,57,53,.75)}
#flash.on{animation:flash .45s}
#flash.danger{animation:danger 1.1s ease-in-out infinite}
@keyframes danger{0%,100%{opacity:.05}50%{opacity:.45}}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#whiteflash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:6;opacity:0}
#whiteflash.on{animation:wf .5s}
@keyframes wf{0%{opacity:.85}100%{opacity:0}}
.stamp{position:fixed;left:50%;top:38%;z-index:8;pointer-events:none;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;
  border:9px solid #d32f2f;color:#d32f2f;font-size:62px;font-weight:900;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.75);font-family:"Yu Mincho","Hiragino Mincho ProN",serif;letter-spacing:-.05em;
  animation:stamp .45s cubic-bezier(.2,1.6,.4,1) forwards}
.stamp.perfect{border-color:#e6a100;color:#c67c00;box-shadow:0 0 30px 8px rgba(255,210,0,.6)}
.stamp.fade{animation:stampout .4s forwards}
@keyframes stamp{0%{opacity:0;transform:scale(3.2) rotate(-25deg)}100%{opacity:1;transform:scale(1) rotate(-12deg)}}
@keyframes stampout{to{opacity:0;transform:scale(.8) rotate(-12deg)}}
#bottomBar{position:relative;z-index:3;height:76px;display:flex;align-items:center;justify-content:center;background:#5e3a17}
#doneBtn{font-size:22px;font-weight:900;padding:10px 34px;border-radius:999px;border:none;color:#fff;cursor:pointer;
  background:linear-gradient(#ff7043,#d84315);box-shadow:0 5px 0 #8c2a0c;font-family:inherit}
#doneBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #8c2a0c}
#doneBtn[hidden],#bottomMsg[hidden]{display:none}
#bottomMsg{color:#f3dfb4;font-size:15px}
/* オーバーレイ（ホーム・図鑑・解説・結果） */
#overlay{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:rgba(40,20,0,.45);padding:16px}
#overlay[hidden]{display:none}
#overlay.top{align-items:flex-start;background:rgba(40,20,0,.12);padding-top:12px}
#overlay.top .card{max-height:60vh}
.card{background:#fffaf0;border-radius:20px;border:4px solid #7a1f1f;box-shadow:0 8px 0 #7a1f1f,0 14px 40px rgba(0,0,0,.4);touch-action:pan-y;
  padding:20px 22px;max-width:580px;width:100%;max-height:92vh;overflow:auto;animation:cardin .35s cubic-bezier(.2,1.4,.4,1)}
.card.wide{max-width:760px}
@keyframes cardin{0%{transform:translateY(40px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
.card h1{margin:0;font-size:30px;color:#7a1f1f;line-height:1.25}
.card h1 span{font-size:20px}
.card h2{margin:0 0 10px;font-size:22px;color:#7a1f1f}
.card h3{margin:14px 0 4px;font-size:16px;color:#7a1f1f;border-bottom:2px solid #e8d2a6;padding-bottom:2px}
.card p{line-height:1.7;margin:6px 0}
.titleRow{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:8px}
.tdaruma{width:96px;height:92px;flex:none}
.sent{font-size:22px;line-height:2;margin:8px 0;padding:8px 12px;background:#fff;border-radius:12px;border:2px dashed #d9b97f}
.sent .k{font-weight:900;padding:2px 4px;border-radius:6px;background:var(--rb);color:var(--rc)}
.sent .d{color:#b9a88a;text-decoration:line-through;text-decoration-color:#d9b97f}
.skel{font-size:26px;font-weight:900;text-align:center;margin:6px 0;color:#3a2a14}
.desc{text-align:center;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.desc span{background:var(--rb);color:var(--rc);font-weight:bold;border-radius:8px;padding:2px 8px}
.note{background:#fff3cd;border-left:6px solid #f0a800;padding:8px 12px;border-radius:8px;font-size:16px;line-height:1.7}
.btn{display:block;margin:14px auto 0;font-size:20px;font-weight:900;padding:11px 40px;border-radius:999px;border:none;color:#fff;cursor:pointer;
  background:linear-gradient(#ef5350,#c62828);box-shadow:0 5px 0 #7a1f1f;font-family:inherit}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #7a1f1f}
.btn.sub{background:linear-gradient(#8d6e63,#5d4037);box-shadow:0 5px 0 #3e2723}
.btn.zk{background:linear-gradient(#ffca28,#f57f17);box-shadow:0 5px 0 #a04000;font-size:18px;padding:9px 30px;margin-top:10px}
.stages{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.stg{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:3px solid #d9b97f;background:#fff;cursor:pointer;font-family:inherit;text-align:left;color:inherit}
.stg:hover{border-color:#c62828;background:#fff5f5}
.stg b{font-size:19px;color:#7a1f1f;white-space:nowrap}
.stg span{font-size:13px;line-height:1.45;flex:1}
.stg i{font-style:normal;font-size:12px;color:#8a6a3a;white-space:nowrap}
.howto{font-size:15px;background:#fdf0d0;border-radius:12px;padding:8px 14px;line-height:1.7}
.prog{margin-top:10px;text-align:center;font-size:16px}
.prog b{color:#c62828;font-size:20px}
.bar{height:12px;background:#ead9b5;border-radius:999px;margin:4px auto 0;max-width:420px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffca28,#ef5350);border-radius:999px}
.res{font-size:18px;line-height:2}
.res b{font-size:24px;color:#c62828}
.rank{font-size:44px;font-weight:900;text-align:center;color:#c67c00;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
/* 図鑑 */
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:10px}
.zt{position:relative;border:3px solid #d9b97f;border-radius:14px;background:#fff;padding:8px 6px;text-align:center;font-family:inherit;color:inherit;cursor:pointer}
.zt:hover{border-color:#c62828}
.zt.eq{border-color:#f0a800;background:#fff8e1;box-shadow:0 0 0 3px #ffe082}
.zt.lock{cursor:default;background:#f4ead6}
.zimg{width:84px;height:80px;margin:0 auto}
.zt.lock .zimg{filter:brightness(0);opacity:.28}
.zt b{display:block;font-size:14px;margin-top:2px}
.zt small{display:block;font-size:12px;color:#8a6a3a}
.zt em{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:#f0a800;color:#fff;font-style:normal;font-size:12px;font-weight:bold;border-radius:999px;padding:1px 8px;white-space:nowrap}
.unlock{display:flex;gap:12px;align-items:center;background:linear-gradient(#fff8e1,#ffecb3);border:3px solid #f0a800;border-radius:14px;padding:10px 12px;margin-top:10px;animation:cardin .5s .2s both}
.unlock .zimg{flex:none}
.unlock b{color:#c62828;font-size:18px}
/* ホーム：段がだるま落としのように積み上がる */
.home{max-width:640px}
.backBtn{display:inline-block;margin:-6px 0 8px;padding:5px 14px;border:2px solid #7a1f1f;border-radius:999px;background:#fff;color:#7a1f1f;
  font-family:inherit;font-size:14px;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 #7a1f1f}
.backBtn:hover{background:#fff3e0}.backBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #7a1f1f}
.hhdr{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hhdr h1{font-size:26px}
.hhdr .btn.zk{margin:0}
.home .prog{margin-top:4px}
.home .howto{font-size:14px;margin-top:6px}
.htower{display:flex;flex-direction:column;align-items:center;margin-top:6px}
.hhead{position:relative;width:128px;height:122px;border:none;background:none;cursor:pointer;padding:0;margin-bottom:-2px;
  animation:hdrop .6s cubic-bezier(.3,1.5,.5,1) backwards;font-family:inherit}
.hhead:hover svg{animation:hwob .5s}
@keyframes hwob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.hhead .sash{position:absolute;left:50%;bottom:4px;transform:translateX(-50%) rotate(-5deg);background:linear-gradient(#fff3c4,#ffb300);
  color:#5a2e00;font-weight:900;font-size:15px;padding:3px 12px;border-radius:8px;border:2px solid #fff;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.hhead i{position:absolute;left:100%;top:40px;font-style:normal;font-size:12px;color:#8a6a3a;white-space:nowrap}
.hb{position:relative;width:min(500px,100%);height:50px;border:none;border-radius:10px;display:flex;align-items:center;gap:12px;padding:0 16px;
  color:#fff;font-family:inherit;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.3);border-bottom:5px solid rgba(0,0,0,.28);border-top:2px solid rgba(255,255,255,.45);
  animation:hdrop .5s cubic-bezier(.3,1.5,.5,1) backwards;transition:transform .15s}
.hb::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.2;
  background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(0,0,0,.25) 14px 15px,transparent 15px 31px)}
.hb:hover{transform:translateX(12px) rotate(1deg)}
.hb b{font-size:20px;white-space:nowrap}
.hb span{font-size:13px;flex:1;text-align:left}
.hb i{font-style:normal;font-size:12px;white-space:nowrap}
.htable{width:min(560px,100%);height:16px;border-radius:4px;background:linear-gradient(#c99257,#7c5023 40%,#5e3a17);box-shadow:0 4px 8px rgba(0,0,0,.25)}
@keyframes hdrop{0%{transform:translateY(-480px);opacity:0}40%{opacity:1}100%{transform:none}}
.linkBtn{display:block;margin:10px auto 0;background:none;border:none;color:#8a6a3a;text-decoration:underline;font-family:inherit;font-size:13px;cursor:pointer}
/* 段の解説 */
.intro .ihead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.intro .iblk{color:#fff;font-weight:900;font-size:22px;padding:6px 18px;border-radius:10px;border-bottom:5px solid rgba(0,0,0,.28);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.intro .iblk.c3{color:#4a3000;text-shadow:none}
.skipBtn{font-family:inherit;font-weight:bold;font-size:15px;border:2px solid #8a6a3a;color:#5d4037;background:#fff;border-radius:999px;padding:5px 14px;cursor:pointer}
.ibody{font-size:16px;line-height:1.75}
.ibody b{color:#c62828}
.ibody ul{margin:4px 0;padding-left:1.3em}
.ibody table{border-collapse:collapse;margin:6px auto;font-size:15px}
.ibody td{border:1px solid #e0c99a;padding:3px 8px}
.ibody td:first-child{font-weight:bold;white-space:nowrap}
.mini{margin:10px auto 0;background:#fdf6e6;border:2px dashed #d9b97f;border-radius:14px;padding:8px 10px 12px;max-width:460px;overflow:hidden}
.mini .mcmd{text-align:center;font-weight:900;color:#7a1f1f;margin-bottom:4px}
.mini .mdar{width:56px;height:54px;margin:0 auto -2px}
.mb{position:relative;width:200px;margin:0 auto 2px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px}
.mb.keep{background:linear-gradient(#fff6c8,#ffd54f 45%,#f0a800);color:#5a2e00;box-shadow:0 0 0 2px #fff,0 0 10px rgba(255,200,0,.7)}
.mb.out{background:#e7dcc6;color:#a1907a;transform:translateX(60px) rotate(6deg);opacity:.8}
.mb.out s{text-decoration-color:#c9b48f}
.mb.out::after{content:"← はじく";position:absolute;left:100%;margin-left:8px;font-size:12px;color:#c62828;white-space:nowrap}
.mb .mtag{position:absolute;right:100%;margin-right:8px;font-size:12px;color:#fff;background:var(--rc);border-radius:999px;padding:1px 8px;white-space:nowrap}
.nomore{display:block;text-align:center;margin-top:10px;font-size:14px;cursor:pointer}
/* ホームの塔：未クリアの段は点線の「まだ積んでいないブロック」 */
.htower .hb,.htower .hhead{animation:none}
/* スマホ（2026-11-21、教員の指示）：てっぺんのだるまの右の「挑戦モード 次のだるま あと○問」が画面の右にはみ出していた */
@media (max-width:480px){.hhead i{white-space:normal;width:min(96px,calc(50vw - 92px));font-size:11px}}
.hb.locked{cursor:default}.hb.locked:hover{transform:none}
.hb.replay i{text-align:right;line-height:1.3}
.howto.hshort{text-align:center;font-size:17px;font-weight:bold}
.hb.pending,.hhead.pending{opacity:0}
.hhead.locked{cursor:not-allowed}
.hnext{display:flex;flex-direction:column;align-items:center;width:100%;margin:2px 0 16px}
.hnext.nextIn{animation:nextIn .5s cubic-bezier(.3,1.5,.5,1) backwards}
@keyframes nextIn{from{opacity:0;transform:translateY(-30px)}}
.hnext .lbl{font-weight:900;color:#c62828;font-size:15px;animation:lblink 1.2s ease-in-out infinite}
@keyframes lblink{50%{opacity:.45}}
.hb.glass{color:#8a6a3a;text-shadow:none;transition:color .7s}
.hb.glass>*{position:relative;z-index:1}
.hb.glass::before{content:"";position:absolute;inset:-2px;border-radius:inherit;z-index:0;transition:opacity .8s;
  background:linear-gradient(120deg,rgba(255,253,247,.97) 0%,rgba(255,249,236,.8) 40%,rgba(255,255,255,.95) 52%,rgba(255,249,236,.82) 64%,rgba(255,253,247,.96) 100%);
  border:2px solid #fff;box-shadow:0 0 0 2px rgba(170,140,90,.45),inset 0 0 14px rgba(255,255,255,1)}
.hb.glass:not(.filled)::after{opacity:0}
.hb.glass.filled::before{opacity:0}
.hb.glass.filled{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.hb.c3.glass.filled{color:#4a3000;text-shadow:none}
.hnext .hb.challenge{animation:bob 1.6s ease-in-out infinite;box-shadow:0 0 0 3px #fff,0 0 20px 6px rgba(255,170,0,.75)}
@keyframes bob{50%{transform:translateY(-9px)}}
.hrest{font-size:12px;color:#8a6a3a;margin-top:4px}
.hhead+.hnext{margin-top:22px}
.hnext.top{margin:0 0 4px}
.htower .hb{height:44px}
.hnext .lbl{position:relative;z-index:2;margin-bottom:4px}
.autobar{height:8px;background:#ead9b5;border-radius:999px;overflow:hidden;margin:8px auto 0;max-width:360px}
.autobar i{display:block;height:100%;background:linear-gradient(90deg,#ffca28,#ef5350);animation:autobar 3.1s linear forwards}
@keyframes autobar{from{width:0}to{width:100%}}
.hcount{text-align:center;font-weight:bold;margin-top:6px}.hcount b{color:#c62828;font-size:20px}
.hb.ghost{background:rgba(255,255,255,.55)!important;color:#a1907a;text-shadow:none;border:2px dashed #c9b48f;box-shadow:none}
.hb.ghost::after{display:none}
.hhead.ghost svg{filter:grayscale(1) opacity(.35)}
.hhead.ghost .sash{filter:grayscale(.6) opacity(.75)}
.hhead.won .sash{background:linear-gradient(#fff8c4,#ffd54f 50%,#ff8f00);box-shadow:0 0 14px 4px rgba(255,200,0,.8)}
.hhead.cheer svg{animation:hcheer .9s 2}
@keyframes hcheer{30%{transform:translateY(-30px) rotate(-10deg)}60%{transform:translateY(0) rotate(8deg)}}
.stackin{animation:hstack .55s cubic-bezier(.5,0,.9,.6) both!important}
@keyframes hstack{0%{transform:translateY(-560px) rotate(-4deg);opacity:0}25%{opacity:1}100%{transform:none}}
.home.thud{animation:thud .35s}
@keyframes thud{30%{transform:translateY(5px)}60%{transform:translateY(-2px)}}
/* 解説アニメーション */
.icmd{display:flex;align-items:center;gap:10px;justify-content:center;background:#fff;border:3px solid #7a1f1f;border-radius:14px;padding:4px 12px;box-shadow:0 3px 0 #7a1f1f}
.icmd span{font-size:12px;color:#8a6a3a;font-weight:bold;white-space:nowrap}
.icmd b{font-size:20px;color:#7a1f1f}
.icmd b.flash{animation:cflash .6s}
@keyframes cflash{0%{transform:scale(1.4);color:#e65100}}
.istage{position:relative;margin:6px auto 0;max-width:540px;background:linear-gradient(#fffaf0,#f6ead0);border-radius:12px;overflow:hidden}
.ifloor{position:absolute;left:0;right:0;bottom:0;height:14px;background:linear-gradient(#c99257,#7c5023)}
.iblock{position:absolute;left:50%;width:200px;margin-left:-100px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:18px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3);border-bottom:4px solid rgba(0,0,0,.25);
  transition:bottom .35s cubic-bezier(.4,1.5,.6,1),box-shadow .3s}
.iblock.c3{color:#4a3000;text-shadow:none}
.iblock.keep{box-shadow:0 0 0 3px #fff,0 0 14px 5px rgba(255,200,0,.95);z-index:1}
.iblock.gold{background:linear-gradient(#fff6c8,#ffd54f 45%,#f0a800);color:#5a2e00;text-shadow:none}
.iblock.odai{outline:3px dashed #fff;outline-offset:-6px}
.iblock.odai::before{content:"★お題";position:absolute;right:100%;margin-right:8px;font-size:12px;background:#fff;color:#7a1f1f;border:2px solid #7a1f1f;border-radius:999px;padding:0 7px;white-space:nowrap;text-shadow:none}
.iblock .itag{position:absolute;right:100%;margin-right:8px;font-size:13px;color:#fff;background:var(--rc);border-radius:999px;padding:1px 9px;white-space:nowrap;text-shadow:none;animation:itag .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes itag{from{transform:scale(0)}}
.iblock .ix{position:absolute;left:-30px;color:#e53935;font-size:26px;text-shadow:0 0 3px #fff;animation:itag .35s}
.iblock.shake{animation:ishake .4s}
@keyframes ishake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.iblock.drop,.idar.drop{animation:idrop .5s cubic-bezier(.3,1.5,.5,1) backwards}
@keyframes idrop{from{transform:translateY(-360px);opacity:0}}
.iblock.fly{animation:ifly .5s ease-in forwards}
@keyframes ifly{to{transform:translate(460px,-70px) rotate(50deg);opacity:0}}
.iblock.swapping{z-index:2;box-shadow:0 6px 14px rgba(0,0,0,.3);transition:bottom .6s ease-in-out}
.idar{position:absolute;left:50%;width:62px;height:59px;margin-left:-31px;transition:bottom .35s cubic-bezier(.4,1.5,.6,1)}
.idar.jump{animation:ijump .7s}
@keyframes ijump{40%{transform:translateY(-46px)}70%{transform:translateY(0) scale(1.1,.9)}}
.iham{position:absolute;width:40px;height:72px;transform-origin:50% 2%;opacity:0;pointer-events:none;z-index:3}
.iham.swing{animation:iswing .45s}
@keyframes iswing{0%{opacity:1;transform:rotate(65deg)}35%{opacity:1;transform:rotate(-4deg)}70%{opacity:1;transform:rotate(-25deg)}100%{opacity:0;transform:rotate(-30deg)}}
.iarrows{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.istamp{position:absolute;right:14%;top:14px;width:76px;height:76px;border-radius:50%;border:5px solid #d32f2f;color:#d32f2f;font-size:28px;font-weight:900;
  display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.8);font-family:"Yu Mincho",serif;animation:stamp .45s cubic-bezier(.2,1.6,.4,1) forwards}
.isay{display:flex;gap:10px;align-items:flex-start;background:#fff;border:3px solid #d9b97f;border-radius:14px;padding:10px 12px;margin-top:8px;min-height:86px}
.isay .num{flex:none;background:#7a1f1f;color:#fff;border-radius:999px;font-weight:900;padding:2px 10px;font-size:14px;white-space:nowrap}
.isay .num.dar{background:#c62828}
.isay p{margin:0;font-size:17px;line-height:1.7;animation:sayin .45s}
.isay p b{color:#c62828}
@keyframes sayin{from{opacity:0;transform:translateY(10px)}}
.inav{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px}
.inav button{font-family:inherit;font-weight:bold;border:2px solid #7a1f1f;background:#fff;color:#7a1f1f;border-radius:999px;padding:5px 16px;cursor:pointer}
.inav button:disabled{opacity:.35;cursor:default}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.random()*a.length|0];}
const clean=t=>t.replace(/[、。？！]/g,"");
function parse(item){return item.s.split("/").map(t=>{const r=t[0]==="@"?"S":t[0]==="#"?"P":null;return {text:r?t.slice(1):t,role:r};});}
function parseSeibun(item){return item.s.split("/").map(t=>{const m=t.match(/^(.*):([SPMCI])(?:>(\d+))?$/);return {text:m[1],role:m[2],to:m[3]!=null?+m[3]:null};});}
// 主語・述語のまとまり（並立・補助で二文節以上）の長さ
function grpRange(roles,i,keepArr){
  const r=roles[i];let a=i,b=i;
  if(r==="S"||r==="P"){while(a>0&&roles[a-1]===r&&(!keepArr||keepArr[a-1]))a--;while(b<roles.length-1&&roles[b+1]===r&&(!keepArr||keepArr[b+1]))b++;}
  return [a,b];
}
function labelGroups(parts,roles){
  const keep=parts.map(p=>p.keep);
  parts.forEach((p,i)=>{if(!p.keep||p.label)return;const r=roles[i],[a,b]=grpRange(roles,i,keep),multi=b>a;
    p.label=r==="S"?(multi?"主部":"主語"):r==="P"?(multi?"述部":"述語"):ROLE_NAME[r];p.cls=r;p.tag=(i===a);});
}
/* 全ジャンル出題には「主語のない文」（ひっかけの段で教えるわざ）は出さない。
   指令のことばを、実際に残すものに合わせる（2026-11-03、教員の指摘：「述語だけ残せ」なのに述部を残さないと○にならないのは理不尽）。
   補助・並立の関係で二文節以上のまとまりになっていれば「主部」「述部」と言う。文が二つで両方あるときは「述語・述部」。 */
function roleTerms(parts,r){return [...new Set(parts.filter(p=>p.keep&&p.tag&&p.cls===r).map(p=>p.label))].join("・");}
function makeKokkaku(item){
  const ps=parse(item),roles=ps.map(p=>p.role);
  const parts=ps.map(p=>({text:p.text,keep:!!p.role}));labelGroups(parts,roles);
  const S=roleTerms(parts,"S")||"主語",P=roleTerms(parts,"P")||"述語";   // 主語のない文（ひっかけ）は「主語と述語」のまま
  return {mode:"kokkaku",parts,cmd:`${S}と${P}だけ 残せ！`,head:"文の骨組みは",note:item.n||""};
}
function genKokkaku(lvs,n){return shuffle(DATA.filter(d=>lvs.includes(d.lv))).slice(0,n).map(makeKokkaku);}

function makeSeibun(item,r){
  const ps=parseSeibun(item),roles=ps.map(p=>p.role);
  if(!r){const present=[...new Set(roles)],rare=present.filter(x=>x==="I"||x==="C");
    r=(rare.length&&Math.random()<.55)?pick(rare):pick(present);}
  const parts=ps.map(p=>({text:p.text,keep:p.role===r}));labelGroups(parts,roles);
  const term=(r==="S"||r==="P")&&roleTerms(parts,r)||ROLE_NAME[r];
  const notes=[ROLE_NOTE[r]];
  if(parts.some(p=>p.keep&&(p.label==="述部"||p.label==="主部")))notes.push("二つの文節で一つのまとまり（補助・並立の関係）になっているときは、両方残します。");
  const cnt=parts.filter(p=>p.keep&&p.tag).length;
  if((r==="S"||r==="P")&&cnt>1)notes.push("この塔には文が二つあるので、"+term+"も二つあります。");
  return {mode:"seibun",parts,cmd:`${term}だけ 残せ！`,head:`残すのは「${term}」`,note:notes.join("<br>")};
}
function genSeibun(n){return shuffle(SEIBUN.slice()).slice(0,n).map(it=>makeSeibun(it));}

function shushokuOptions(ps){
  const roles=ps.map(p=>p.role),single=i=>{const [a,b]=grpRange(roles,i);return a===b;};
  const A=[],B=[];
  ps.forEach((p,t)=>{if(!single(t))return;const mods=ps.map((q,j)=>q.to===t?j:-1).filter(j=>j>=0);
    if(mods.length&&ps.length-mods.length-1>=1)A.push({t,mods});});
  ps.forEach((p,m)=>{if(p.role!=="M"||!single(p.to))return;if(ps.length-2>=1)B.push({m,t:p.to});});
  return {A,B};
}
function makeShushoku(item){
  const ps=parseSeibun(item),o=shushokuOptions(ps);
  const useA=o.A.length&&(Math.random()<.65||!o.B.length);
  const parts=ps.map(p=>({text:p.text,keep:false}));
  const q=s=>`「${clean(s)}」`;
  if(useA){
    const {t,mods}=pick(o.A);
    parts[t]=Object.assign(parts[t],{keep:true,odai:true,label:"被修飾語",cls:"T",tag:true});
    mods.forEach(j=>Object.assign(parts[j],{keep:true,label:"修飾語",cls:"M",tag:true}));
    const notes=[`${q(ps[t].text)}をくわしくしているのは、${mods.map(j=>q(ps[j].text)).join("")}。`];
    ps.forEach((p,j)=>{if(p.role==="M"&&mods.includes(p.to))notes.push(`${q(p.text)}は${q(ps[p.to].text)}をくわしくしているので、${q(ps[t].text)}を直接くわしくしてはいません。`);});
    return {mode:"shushoku",parts,cmd:`${q(ps[t].text)}を くわしくしている 文節を 残せ！`,head:"残すのは",note:notes.join("<br>")};
  }else{
    const {m,t}=pick(o.B);
    Object.assign(parts[m],{keep:true,odai:true,label:"修飾語",cls:"M",tag:true});
    Object.assign(parts[t],{keep:true,label:"被修飾語",cls:"T",tag:true});
    return {mode:"shushoku",parts,cmd:`${q(ps[m].text)}が くわしくしている 文節を 残せ！`,head:"残すのは",
      note:`${q(ps[m].text)} → ${q(ps[t].text)}。「${clean(ps[m].text)}」は「${clean(ps[t].text)}」をくわしくする修飾語です。`};
  }
}
function genShushoku(n){
  const pool=shuffle(SEIBUN.filter(it=>{const o=shushokuOptions(parseSeibun(it));return o.A.length+o.B.length>0;}));
  return pool.slice(0,n).map(makeShushoku);
}
function makeRenbun(item,kind){
  const info=RENBUN_INFO[kind],idx=item.k[kind];
  const parts=item.s.split("/").map((t,i)=>({text:t,keep:idx.includes(i)}));
  parts.forEach((p,i)=>{if(!p.keep)return;p.cls=info.cls;p.label=kind==="補助"?"補助の関係":kind;
    p.tag=kind==="並立"||!parts[i-1]||!parts[i-1].keep;});   // 並立は一つずつ、ほかはまとまりの先頭に札
  return {mode:"renbun",parts,cmd:info.cmd,head:`残すのは「${kind==="並立"||kind==="補助"?kind+"の関係":kind}」`,note:info.note+(item.n?"<br>"+item.n:"")};
}
/* 種類が偏らないよう、種類ごとに順番に取り出す（同じ文は1回だけ） */
function genRenbun(kinds,n){
  const byKind=kinds.map(k=>shuffle(RENBUN.filter(it=>it.k[k]).map(it=>({it,k}))));
  const out=[],used=new Set();
  for(let r=0;out.length<n&&byKind.some(a=>a.length);r++){
    const a=byKind[r%byKind.length];
    while(a.length){const x=a.pop();if(used.has(x.it))continue;used.add(x.it);out.push(makeRenbun(x.it,x.k));break;}
  }
  return shuffle(out);
}

let AC=null,noiseBuf=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}if(AC.state==="suspended")AC.resume();return AC;}
function tone(f,dur,type="sine",vol=.3,when=0,slide=null){
  const a=ac(),t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.03);
}
function noise(dur,freq,q,vol,when=0,type="bandpass",freqTo=null){
  const a=ac();
  if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const t=a.currentTime+when,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=noiseBuf;f.type=type;f.frequency.setValueAtTime(freq,t);if(freqTo)f.frequency.exponentialRampToValueAtTime(freqTo,t+dur);f.Q.value=q;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+dur+.03);
}
function curve(type,pts,dur,vol,when=0,vib=0){        // 周波数を折れ線で動かす音（ねこ・おばけ用）
  const a=ac(),t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;
  pts.forEach(([tt,f],i)=>i?o.frequency.linearRampToValueAtTime(f,t+tt):o.frequency.setValueAtTime(f,t));
  if(vib){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=6;lg.gain.value=vib;l.connect(lg).connect(o.frequency);l.start(t);l.stop(t+dur);}
  g.gain.setValueAtTime(.0008,t);g.gain.linearRampToValueAtTime(vol,t+.04);g.gain.setValueAtTime(vol,t+dur*.7);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.03);
}

/* ---------------- セーブ ---------------- */
const SAVE_KEY="daruma_kokkaku_save_v1";
const DEBUG_ALL=/debug=all/.test(location.search);
function loadSave(){
  let s={};try{s=JSON.parse(localStorage.getItem(SAVE_KEY))||{};}catch(e){}
  s.total=s.total||0;s.equip=s.equip||0;s.best=s.best||{};
  try{const old=JSON.parse(localStorage.getItem("daruma_kokkaku_best_v1"));if(old)for(const k in old)s.best[k]=Math.max(s.best[k]||0,old[k]);}catch(e){}
  const o=buildOrder(s);if(JSON.stringify(o)!==JSON.stringify(s.order)){s.order=o;s.__dirty=true;}
  return s;
}
/* 仲間になる順番（DARUMA_CAT の key の並び）。プレイヤーごとにランダムで、セーブ SV.order に残す（2026-11-06）。
   ・もう仲間になっただるまは、その順番のまま動かさない（SV.equip＝並びの何番目、が変わらないように）
   ・赤だるまは最初、天下一だるまは最後
   ・SV.order がない古いセーブは、旧来の固定順（カタログ0〜28番、29番目＝天下一）で仲間になった分をそのまま先頭に置く
   ・カタログにだるまが増えたら、まだ仲間になっていない所へランダムに差しこむ */
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildOrder(s){
  const N=DARUMA_CAT.length,LAST=DARUMA_CAT.findIndex(d=>d.acc==="tenka");
  const got=Math.min(N,Math.floor(s.total/UNLOCK_STEP)+1);
  let old=Array.isArray(s.order)?s.order.filter((k,i,a)=>Number.isInteger(k)&&k>=0&&k<N&&a.indexOf(k)===i):[];
  if(old.length&&old[0]!==0&&!old.includes(0))old=[];
  const pre=old.length>=got?old.slice(0,got)
    :Array.from({length:Math.min(got,30)},(_,i)=>i<29?i:LAST);   // 古いセーブ（旧30体の固定順）
  const rest=old.slice(pre.length).filter(k=>k!==LAST&&!pre.includes(k));
  shuffleArr(Array.from({length:N},(_,k)=>k).filter(k=>k!==LAST&&!pre.includes(k)&&!rest.includes(k)))
    .forEach(k=>rest.splice(Math.random()*(rest.length+1)|0,0,k));
  if(!pre.includes(LAST))rest.push(LAST);
  return pre.concat(rest);
}
let SV=loadSave();
function save(){try{const o=Object.assign({},SV);delete o.__dirty;localStorage.setItem(SAVE_KEY,JSON.stringify(o))}catch(e){}}
if(SV.__dirty){delete SV.__dirty;save();}
/* 実際に仲間になる順の並び（id＝何番目か、need＝その だるまが来る問題数） */

function unlockedN(){return DEBUG_ALL?DARUMAS.length:Math.min(DARUMAS.length,Math.floor(SV.total/UNLOCK_STEP)+1);}
function curDef(){return DARUMAS[Math.min(SV.equip,unlockedN()-1)];}

function buildTower(task){

/* 塔を1本完成：完成した塔から1段が飛び出し、柱の真上まで上がってから、まっすぐ落ちて積み上がる。
   落ちる先の場所を先に光らせ、落ちたら柱がしずみ、土ぼこり・「+1段」。50段そろったら、てっぺんのシルエットに色がついて新しいだるま */
function ssAdd(){
  if(!ssOn())return;
  const col=$("ssCol");if(!col)return;
  const got=G.newDaruma,n=got?UNLOCK_STEP:SV.total%UNLOCK_STEP;
  const el=col.children[n-1];if(!el){ssRender();return;}
  const color=SS_COLS[(n-1)%SS_COLS.length];
  const src=(stack().slice(-1)[0]||G.daruma).el.getBoundingClientRect();
  const er=el.getBoundingClientRect(),cr=col.getBoundingClientRect();
  const sx=src.left+src.width/2,sy=src.top+src.height/2,ex=er.left+er.width/2,ey=er.top+er.height/2;
  const topY=Math.max(18,cr.top-70),eh=Math.max(er.height,9);
  el.classList.add("target");
  const f=document.createElement("div");f.className="ssFly";f.style.background=color;f.textContent="1段";
  Object.assign(f.style,{left:sx+"px",top:sy+"px",width:"130px",height:"30px",transform:"translate(-50%,-50%)"});
  document.body.appendChild(f);SFX.whoosh();
  const up=f.animate([{transform:"translate(-50%,-50%) scale(1)",width:"130px",height:"30px",fontSize:"13px"},
    {transform:`translate(calc(-50% + ${ex-sx}px),calc(-50% + ${topY-sy}px)) rotate(-360deg)`,width:er.width+"px",height:eh+"px",fontSize:"0px"}],
    {duration:560,easing:"cubic-bezier(.2,.75,.35,1)",fill:"forwards"});
  up.onfinish=()=>{
    const dist=ey-topY,dur=Math.min(700,240+dist*.55);
    const fall=f.animate([{transform:`translate(calc(-50% + ${ex-sx}px),calc(-50% + ${topY-sy}px))`,width:er.width+"px",height:eh+"px"},
      {transform:`translate(calc(-50% + ${ex-sx}px),calc(-50% + ${ey-sy}px))`,width:er.width+"px",height:eh+"px"}],
      {duration:dur,easing:"cubic-bezier(.5,0,1,.6)",fill:"forwards"});   // 重力で加速しながら落ちる
    // 落ちる軌跡に残像
    const tr=setInterval(()=>{const r=f.getBoundingClientRect();const t=document.createElement("div");t.className="ssTrail";
      Object.assign(t.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px",background:color});
      document.body.appendChild(t);setTimeout(()=>t.remove(),360);},45);
    fall.onfinish=()=>{
      clearInterval(tr);f.remove();
      el.classList.remove("target");el.classList.add("on","land");el.style.background=color;
      col.classList.remove("bump");void col.offsetWidth;col.classList.add("bump");
      $("ssNum").innerHTML=`<b>${n}</b>/${UNLOCK_STEP}`;
      SFX.land(1);SFX.knock(5);
      const r=el.getBoundingClientRect();
      burst(r.left,r.top+r.height/2,{n:8,type:"dust",omni:true,cols:["#d7c3a0","#bfa77f"],speed:220});
      burst(r.right,r.top+r.height/2,{n:8,type:"dust",omni:true,cols:["#d7c3a0","#bfa77f"],speed:220});
      burst(r.left+r.width/2,r.top+r.height/2,{n:12,type:"star",omni:true,cols:["#fff59d","#ffd54f","#ffffff"],speed:360});
      popText(r.left-34,r.top-4,"+1段",color,22);
      if(!got){if(UNLOCK_STEP-n<=5)setTimeout(()=>popText(r.left-30,r.top-34,`あと${UNLOCK_STEP-n}段！`,"#d50000",20),250);return;}
      // 50段 完成 → だるまゲット
      col.classList.add("full");
      const top=$("ssTop");top.innerHTML=darumaSVG(got);
      setTimeout(()=>{top.classList.remove("sil");top.classList.add("reveal");SFX.unlock();
        const t=top.getBoundingClientRect();
        burst(t.left+t.width/2,t.top+t.height/2,{n:36,type:"star",omni:true,cols:["#fff59d","#ffd54f","#ffffff","#ff8a80"],speed:700});
        popText(t.left-30,t.bottom+20,"50段 達成！","#e65100",24);},500);
      setTimeout(()=>{col.classList.remove("full");
        [...col.children].forEach(c=>{c.classList.add("fly");c.style.transform=`translate(${(Math.random()<.5?-1:1)*(120+Math.random()*200)}px,${-200-Math.random()*300}px) rotate(${(Math.random()-.5)*400}deg)`;});
        SFX.whoosh();},2600);
      setTimeout(()=>{if(ssOn())ssRender();},3400);
    };
  };
}

let drag=null;

const hammer=document.createElement("div");hammer.id="hammer";hammer.innerHTML=HAMMER_SVG;tower.appendChild(hammer);

function swing(b,dir){
  const k=BH*1.05/54;
  hammer.style.width=100*k+"px";hammer.style.height=180*k+"px";
  hammer.style.bottom=(b.h+BH/2-31*k)+"px";
  hammer.style.left=dir>0?`calc(50% - ${BW/2+97*k}px)`:`calc(50% + ${BW/2-3*k}px)`;
  hamBase=dir>0?"":"scaleX(-1) ";

function hammerAfter(hit){
  hammer.getAnimations().forEach(a=>a.cancel());
  const kf=hit
    ?[{transform:hamBase+"rotate(-2deg)",opacity:1},{transform:hamBase+"rotate(-30deg)",opacity:1,offset:.45},{transform:hamBase+"rotate(-38deg)",opacity:0}]
    :[{transform:hamBase+"rotate(-2deg)",opacity:1},{transform:hamBase+"rotate(24deg)",opacity:1,offset:.35},{transform:hamBase+"rotate(10deg)",opacity:0}];
  hammer.animate(kf,{duration:hit?260:420,easing:"ease-out",fill:"forwards"});

function strike(b,dir){

function blockPoint(b,dir){const r=b.el.getBoundingClientRect();return {x:dir>0?r.left:r.right,y:r.top+r.height/2,cx:r.left+r.width/2,r};}

function redFlash(){$("flash").classList.remove("on");void $("flash").offsetWidth;$("flash").classList.add("on");}

function goodHit(b,dir,power=1){
  const p=blockPoint(b,dir);
  const last=stack().filter(x=>!x.keep).length===1;
  b.state="fly";b.vx=dir*(last?2600:2300)*power;b.vh=420*power;
  if(power>1.25)setTimeout(()=>popText(innerWidth/2,innerHeight*.3,"ナイス スイング！","#e65100",30),60);b.vr=dir*(700+Math.random()*500);
  G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
  const gain=100*Math.min(G.combo,10);G.score+=gain;
  SFX.knock(G.combo);SFX.whoosh();
  G.stopUntil=performance.now()+(last?90:55);G.shake=last?14:8;
  const cols=colorOf(b);
  burst(p.x,p.y,{n:22,type:"chip",dir,cols,speed:900});
  burst(p.x,p.y,{n:14,type:"spark",dir,cols:["#fff8c4","#ffffff","#ffd54f"],speed:1300});
  burst(p.x,p.y,{n:1,type:"ring",cols:["#ffffff"]});

  showCombo();

    setTimeout(()=>field.classList.remove("zoom"),700);

function missHit(b,dir){

  G.combo=0;showCombo();G.miss++;renderLives();

function dangerMsg(){

function explodeDaruma(){
  const d=G.daruma;
  if(!d||d.state!=="stack"||G.done||d.vh!==0)return;
  const r=d.el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  d.state="boom";G.booms++;
  const fn=BOOM[d.def.boom]||BOOM.fire;
  const delay=fn(cx,cy,d)||1100;
  // 爆風で塔がはねる
  stack().forEach((b,i)=>{b.vh=200+i*50+Math.random()*120;});
  G.wob.v+=(Math.random()<.5?-1:1)*40;
  setTimeout(()=>respawnDaruma(d),delay);
}

function respawnDaruma(d){

}

/* ---------------- ハンマーを持って振る（空いている所をおす → 横に振ってブロックに当てる） ---------------- */
const hHam=document.createElement("div");hHam.id="hHammer";hHam.innerHTML=HAMMER_SVG;document.body.appendChild(hHam);
const HOLD={on:false,x:0,y:0,vx:0,t:0,ang:0,cool:0,lastWhoosh:0,lastSoft:0};
const SWING_MIN=600;                 // これより遅いと「もっと強く」（px/秒）
function hamK(){return BH*1.2/54;}   // 頭の高さをブロックより少し大きく
field.addEventListener("pointerdown",ev=>{
  if(ev.target.closest(".blk,.daruma"))return;
  if(!G.blocks||G.done||!$("overlay").hidden&&!$("overlay").classList.contains("top"))return;
  ev.preventDefault();ac();
  Object.assign(HOLD,{on:true,x:ev.clientX,y:ev.clientY,vx:0,t:performance.now(),ang:0});
  hHam.style.display="block";hHam.classList.remove("bye","grab");void hHam.offsetWidth;hHam.classList.add("grab");
  field.style.cursor="grabbing";placeHeld();SFX.grab();
});
addEventListener("pointermove",ev=>{
  if(!HOLD.on)return;
  const now=performance.now(),dt=Math.max(4,now-HOLD.t)/1000,px=HOLD.x;
  HOLD.vx=HOLD.vx*.4+((ev.clientX-px)/dt)*.6;
  HOLD.x=ev.clientX;HOLD.y=ev.clientY;HOLD.t=now;
  heldCollide(px,HOLD.x,HOLD.y);
  placeHeld();
  const sp=Math.abs(HOLD.vx);
  if(sp>1100&&now-HOLD.lastWhoosh>260){SFX.whoosh();HOLD.lastWhoosh=now;}
  if(sp>900){const k=hamK();P.push({type:"trail",x:HOLD.x,y:HOLD.y,w:94*k,h:54*k,life:.1,max:.1,col:"#d7a35f"});}
});
addEventListener("pointerup",()=>releaseHold());
addEventListener("pointercancel",()=>releaseHold());
function releaseHold(){
  if(!HOLD.on)return;HOLD.on=false;field.style.cursor="";
  hHam.classList.add("bye");setTimeout(()=>{if(!HOLD.on)hHam.style.display="none";},220);
}
function placeHeld(){
  const k=hamK(),w=100*k,h=180*k;
  hHam.style.width=w+"px";hHam.style.height=h+"px";
  hHam.style.left=(HOLD.x-w/2)+"px";hHam.style.top=(HOLD.y-149*k)+"px";   // 頭の中心＝指の位置
  const m=HOLD.x<innerWidth/2?1:-1;                                      // 頭の平らな面を塔のほうへ向ける
  const target=Math.max(-40,Math.min(40,-HOLD.vx*.02));                  // 振ると柄が遅れてしなる
  HOLD.ang+=(target-HOLD.ang)*.45;
  hHam.style.transformOrigin=`50% ${149/180*100}%`;
  hHam.style.transform=`rotate(${HOLD.ang}deg) scaleX(${m})`;
}
function heldRecoil(){hHam.classList.remove("recoil","grab");void hHam.offsetWidth;hHam.classList.add("recoil");}
/* 頭の先が、ブロックの横の面を通りこした瞬間に当たり */
function heldCollide(px,nx,ny){
  if(G.busy||G.done||!G.blocks)return;
  const now=performance.now();if(now<HOLD.cool)return;
  const dir=Math.sign(nx-px);if(!dir)return;
  const k=hamK(),hw=47*k,hh=27*k,pl=px+dir*hw,cl=nx+dir*hw;
  const crossed=r=>{const e=dir>0?r.left:r.right;return dir>0?(pl<e&&cl>=e):(pl>e&&cl<=e);};
  let best=null,bd=1e9;
  for(const b of stack()){const r=b.el.getBoundingClientRect();
    if(ny+hh*.5<r.top||ny-hh*.5>r.bottom||!crossed(r))continue;
    const d=Math.abs(ny-(r.top+r.height/2));if(d<bd){bd=d;best=b;}}
  const sp=Math.abs(HOLD.vx);
  if(!best){                                   // だるまに当てると……
    const d=G.daruma;if(d&&d.state==="stack"){const r=d.el.getBoundingClientRect();
      if(ny>r.top&&ny<r.bottom&&crossed(r)&&sp>=SWING_MIN){HOLD.cool=now+500;heldRecoil();explodeDaruma();}}
    return;}
  HOLD.cool=now+170;heldRecoil();
  if(sp<SWING_MIN){                            // ゆっくりだと、少しずれるだけ
    best.vx=dir*200;SFX.land(.4);
    if(now-HOLD.lastSoft>900){const r=best.el.getBoundingClientRect();popText(r.left+r.width/2,r.top-6,"もっと 強く 振ろう！","#8a6a3a",20);HOLD.lastSoft=now;}
    return;}
  G.busy=true;
  const power=Math.max(.85,Math.min(1.5,sp/1500));
  best.odai?odaiHit(best,dir):best.keep?missHit(best,dir):goodHit(best,dir,power);
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function clearSeq(){
  G.busy=true;
  const keepTopDown=stack().slice().reverse();
  for(let i=0;i<keepTopDown.length;i++){
    const b=keepTopDown[i];b.el.classList.add("gold");b.sy=.86;b.sx=1.06;
    if(b.tag&&b.label){const t=document.createElement("span");t.className="tag "+(b.cls||"");t.textContent=b.label;b.el.appendChild(t);}
    const r=b.el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,{n:12,type:"star",omni:true,cols:["#fff59d","#ffd54f","#ffffff"],speed:500});
    SFX.ding(i);await sleep(170);
  }
  await sleep(120);
  face("joy");SFX.jump();G.daruma.vh=1250;
  await new Promise(r=>{G.onDarumaLand=r;});
  const perfect=G.miss===0;
  const dr=G.daruma.el.getBoundingClientRect();
  SFX.fanfare();G.shake=10;
  burst(dr.left+dr.width/2,dr.bottom,{n:1,type:"ring",cols:["#ffd54f"]});
  confetti();
  const st=document.createElement("div");st.className="stamp"+(perfect?" perfect":"");st.textContent=perfect?"完璧":"見事";document.body.appendChild(st);
  setTimeout(()=>{SFX.stamp();G.shake=16;},200);
  const bonus=500+(perfect?500:0);
  setTimeout(()=>{G.score+=bonus;popText(innerWidth/2,innerHeight*.38+110,perfect?`ノーミス！ +${bonus}`:`クリア +${bonus}`,"#c67c00",30);},420);
  G.cleared++;if(perfect)G.perfect++;
  recordClear();tickCountdown();mgCorrect();
  const nd=G.newDaruma;if(ssOn())setTimeout(ssAdd,300);
  if(nd){   // 柱の50段目が積まれ、てっぺんのシルエットに色がついたのを見せてから、お披露目へ
    await sleep(ssOn()?2700:1300);st.classList.add("fade");setTimeout(()=>st.remove(),400);
    await unlockCeremony(nd);
  }else{
    await sleep(ssOn()?1900:1300);
    st.classList.add("fade");setTimeout(()=>st.remove(),400);
  }
  showExplain(true);
}

   ①暗転、「……ん？」「新たな だるまが……！」「く、来るぞ……！！」→黒いシルエットが光りながらふるえる（ドラムロール、だんだん速く・激しく）
   ②白い閃光と地響き → 色つきで飛び出す。後ろで光の帯が回り、花火が何発も上がり、両側から紙ふぶき、ファンファーレ
   ③「NEW!」「新しい だるまが 仲間になった！」（1文字ずつ）、金色の名前、爆発の名前、図鑑のバー
   ④だるまをタップ（または「爆発を ためす」）で、そのだるまの爆発をその場で試せる→ふっかつ。「やった！ つぎへ」で終わり */
function unlockCeremony(d){
  return new Promise(done=>{
    releaseHold();G.cerShown=true;
    const lt=$("lvToast");if(lt)lt.classList.remove("show");
    const no=d.id+1,all=DARUMAS.length;
    const c=document.createElement("div");c.id="cer";

    document.body.appendChild(c);
    const T=[];const later=(fn,ms)=>T.push(setTimeout(fn,ms));
    const dEl=$("cerD"),msg=$("cerMsg");
    const typeIn=(el,text,step=55)=>{el.innerHTML=[...text].map((ch,i)=>`<span style="animation-delay:${i*step}ms">${ch===" "?"&nbsp;":ch}</span>`).join("");};
    // ① 予感
    msg.textContent="……ん？";
    SFX.drumroll(2.4);
    later(()=>{msg.textContent="新たな だるまが……！";c.classList.add("charge");dEl.classList.add("s1");},700);
    later(()=>{dEl.classList.replace("s1","s2");msg.textContent="く、来るぞ……！！";},1600);
    // ② 登場
    later(()=>{
      $("cerFlash").classList.add("on");SFX.boom();SFX.grand();
      c.classList.remove("charge");c.classList.add("revealed");
      dEl.className="cerD cerUp";
      const r=dEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;

      burst(cx,cy,{n:60,type:"star",omni:true,cols:["#fff59d","#ffd54f","#ffffff","#ff8a80","#80d8ff"],speed:1300});
      burst(cx,cy,{n:30,type:"spark",omni:true,cols:["#ffffff","#ffeb3b"],speed:1600});
      confetti();
      typeIn(msg,"新しい だるまが 仲間になった！");
      $("cerBody").innerHTML=`<div class="cerName" style="animation-delay:.5s">${d.name}</div>
        <div class="cerInfo" style="animation-delay:.9s">爆発：<b>${d.bn}</b>　／　だるま図鑑 <b>No.${no}</b></div>
        <div class="cerBar" style="animation-delay:1.1s"><i id="cerBar" style="width:${(no-1)/all*100}%"></i></div>
        <div class="cerInfo" style="animation-delay:1.1s;font-size:14px">図鑑 <b id="cerCnt">${no-1}</b> / ${all} 体</div>`;
      msg.insertAdjacentHTML("beforebegin",`<div class="cerNew">NEW!</div>`);
      later(()=>{$("cerBar").style.width=no/all*100+"%";SFX.ding(3);const n=$("cerCnt");if(n)n.textContent=no;},1500);
      // 花火を何発も
      const fw=i=>{const x=innerWidth*rnd(.12,.88),y=innerHeight*rnd(.1,.45);
        const cols=pick([["#ff5252","#ffeb3b","#ffffff"],["#40c4ff","#b2ff59","#ffffff"],["#e040fb","#ffd740","#ffffff"],["#ffab40","#ff4081","#fff59d"]]);

        later(()=>{burst(x,y,{n:1,type:"ring",cols:[cols[0]]});burst(x,y,{n:46,type:"spark",omni:true,cols,speed:720});
          burst(x,y,{n:18,type:"star",omni:true,cols,speed:420});},560);};
      for(let i=0;i<9;i++)later(()=>fw(i),300+i*420);

          <div class="cerTap">だるまを タップしても 爆発するよ</div>`);
        $("cerBoom").onclick=tryBoom;$("cerOk").onclick=finish;
      },1900);
    },2400);
    // その場で爆発をためす（ゲーム中と同じ BOOM[種類]）→ ふっかつ
    let booming=false;
    function tryBoom(){
      if(booming||dEl.classList.contains("sil"))return;booming=true;ac();
      const r=dEl.getBoundingClientRect(),fake={el:dEl,def:d,state:"boom"};
      const fn=BOOM[d.boom]||BOOM.fire;

}
/* だるまの数え方：全ジャンル出題（てっぺんのだるま）で完成させた塔だけを数える（2026-11-03、教員の指示）。
   50問ごとに新しいだるまを仲間にして、すぐに装備する。ほかの段は、ジャンルレベル（mgCorrect）だけ。 */
function recordClear(){
  if(!G.stage||G.stage.id!=="s4")return;
  const before=unlockedN();SV.total++;const after=unlockedN();
  if(after>before){G.newDaruma=DARUMAS[after-1];SV.equip=G.newDaruma.id;}
  save();
}

async function collapse(){
  G.busy=true;if(G.mode==='ch'){G.crash++;$("towerNo").innerHTML=towerNoHTML();}SFX.crash();face("sur");G.shake=22;
  const all=[...stack(),G.daruma];
  all.forEach((b,i)=>{b.state="fly";b.vx=(Math.random()<.5?-1:1)*(250+Math.random()*700);b.vh=200+Math.random()*700+i*30;b.vr=(Math.random()-.5)*900;});
  await sleep(500);SFX.sad();await sleep(900);
  showExplain(false);
}

function showExplain(ok){
  const t=G.task,parts=t.parts;
  const sent=parts.map(p=>p.keep?`<span class="k ${p.cls}">${p.odai?"★":""}${p.text}</span>`:`<span class="d">${p.text}</span>`).join("");
  // 残す文節を、主部・述部のまとまりごとに
  const groups=[];parts.forEach(p=>{if(!p.keep)return;if(p.tag||!groups.length)groups.push({label:p.label,cls:p.cls,odai:p.odai,text:p.text});else groups[groups.length-1].text+=p.text;});
  const skel=t.mode==="kokkaku"?groups.map(g=>g.text).join("　"):groups.map(g=>`「${clean(g.text)}」`).join("　");
  const desc=groups.map(g=>`<span class="${g.cls}">${g.odai?"★":""}${g.label}「${clean(g.text)}」</span>`).join("");
  const last=G.mode==="goal"?G.cleared>=S4_GOAL:G.mode==="ch"?G.crash>=CH_LIFE:G.ti>=G.list.length-1;
  let unlock="";
  if(G.newDaruma){const d=G.newDaruma;G.newDaruma=null;
    unlock=`<div class="unlock"><div class="zimg">${darumaSVG(d)}</div><div><b>🎉 新しいだるまが 仲間になった！</b><br>
      「${d.name}」（爆発：${d.bn}）<br><small>全ジャンル出題で${d.need}問 完成のごほうび。次の塔から 上に乗ります。<br>ホームの「だるま図鑑」で いつでも変えられます。</small></div></div>`;
    if(!G.cerShown)setTimeout(()=>{SFX.unlock();confetti();},250);G.cerShown=false;}
  openOverlay(`<div class="card">
    <h2>${ok?(G.miss===0?"🎯 完璧！":"⭕ 完成！"):"💥 だるまが 落ちてしまった…"}</h2>
    <div style="font-size:15px;color:#7a1f1f;font-weight:bold">${t.cmd}</div>
    <div class="sent">${sent}</div>
    <p style="text-align:center;margin:2px 0;color:#8a6a3a">${t.head}</p>
    <div class="skel">${skel}</div>
    <div class="desc">${desc}</div>
    ${t.note?`<div class="note">${t.note}</div>`:""}
    ${unlock}
    ${G.mode==="ch"&&!unlock&&!last?`<div class="cdline">${cdHTML()}</div>`:G.mode==="goal"&&!last?`<div class="cdline">${towerNoHTML()}</div>`:""}
    <button class="btn" id="nextBtn">${last?"結果を見る":"次の塔へ ▶"}</button></div>`,true);
  $("nextBtn").onclick=()=>{closeOverlay();last?showResult():nextTower();};
}
function nextTower(){
  SFX.whoosh();
  [...stack(),G.daruma].forEach(b=>{b.state="fly";b.vx=-2600;b.vh=150;b.vr=-120;});
  if(G.mode&&G.ti+1>=G.list.length)G.list.push(...G.stage.gen(G.stage.n));   // 全ジャンルは塔を足しながら続ける
  G.ti++;setTimeout(()=>buildTower(G.list[G.ti]),260);
}

/* ---------------- ホーム・図鑑・結果 ---------------- */
function startStage(st){
  G.stage=st;G.score=0;G.shownScore=0;G.combo=0;G.maxCombo=0;G.perfect=0;G.cleared=0;G.ti=0;G.crash=0;G.lvUp=0;
  G.mode=st.id==="s4"?(SV.done&&SV.done.s4?"ch":"goal"):"";
  G.list=st.gen(st.n);
  $("stageName").textContent=G.mode==="ch"?"👑 挑戦モード":st.name;$("score").textContent="0";showCombo();
  closeOverlay();ssRender();buildTower(G.list[0]);
}
function showResult(){
  const st=G.stage,n=G.mode?G.ti+1:G.list.length,prev=SV.best[st.id]||0,isBest=!G.timeUp&&G.score>prev;   // 3分で打ち切ったとき（G.timeUp）は記録に残さない
  if(isBest){SV.best[st.id]=G.score;save();}
  if(G.mode==="ch"){
    const nb=!G.timeUp&&G.cleared>(SV.chBest||0);if(nb){SV.chBest=G.cleared;save();}
    if(nb||isBest){confetti();SFX.fanfare();}
    openOverlay(`<div class="card"><h1 style="text-align:center">👑 挑戦モード　結果</h1>${G.timeUp?`<p style="text-align:center;margin:0 0 6px;font-weight:bold;color:#c62828">⏰ 3分たったので、ここまで！</p>`:""}
      <div class="res">完成した塔：<b>${G.cleared}</b> 本${nb?"　<span style='color:#e65100'>★最高記録！</span>":""}　　ノーミス：<b>${G.perfect}</b><br>
      最高れんだ：<b>${G.maxCombo}</b>　　とくてん：<b>${G.score}</b>${isBest?"　<span style='color:#e65100'>★自己ベスト！</span>":""}</div>
      <div class="cdline">${cdHTML()}</div>
      ${G.lvUp?`<p class="lvline">📈 文の成分ジャンル　レベル <b>+${G.lvUp}</b></p>`:""}
      <button class="btn" id="againBtn">もう一度 挑戦</button><button class="btn sub" id="titleBtn">ホームへ</button></div>`);
    $("againBtn").onclick=()=>showChallenge(st);$("titleBtn").onclick=showTitle;
    return;
  }
  const rate=G.perfect/n;
  SV.done=SV.done||{};SV.pend=SV.pend||[];
  const need=G.mode==="goal"?S4_GOAL:Math.ceil(n*CLEAR_RATE),passed=G.cleared>=need,first=passed&&!SV.done[st.id];
  if(first){SV.done[st.id]=true;SV.pend.push(st.id);save();}
  const clearMsg=first?`<div class="unlock"><div><b>🎉 段クリア！</b><br>「${st.name}」が 一段 積み上がる！ ホームに もどるよ……</div></div><div class="autobar"><i></i></div>`
    :passed?`<p style="text-align:center;color:#2e7d32;font-weight:bold">✔ この段は クリアずみ</p>`
    :`<p style="text-align:center;color:#8a6a3a">塔を <b>${need}本以上</b> 完成させると「段クリア」。ホームに一段 積み上がるよ！</p>`;
  const rank=rate===1?"名人":rate>=.7?"達人":G.cleared>=n*.6?"一人前":"見習い";
  if(rate>=.7){confetti();SFX.fanfare();}
  openOverlay(`<div class="card"><h1 style="text-align:center">${st.name}　結果</h1>
    <div class="rank">${rank}</div>
    <div class="res">完成した塔：<b>${G.cleared}</b> / ${n}　　ノーミス：<b>${G.perfect}</b><br>
    最高れんだ：<b>${G.maxCombo}</b>　　とくてん：<b>${G.score}</b>${isBest?"　<span style='color:#e65100'>★自己ベスト！</span>":""}</div>
    ${clearMsg}
    ${G.lvUp?`<p class="lvline">📈 文の成分ジャンル　レベル <b>+${G.lvUp}</b></p>`:""}
    ${progHTML()}
    ${first?"":`<button class="btn" id="againBtn">もう一度</button><button class="btn sub" id="titleBtn">ホームへ</button>`}</div>`);
  if(first){setTimeout(()=>{if($("overlay").querySelector(".autobar"))showTitle();},3200);return;}
  $("againBtn").onclick=()=>startStage(st);$("titleBtn").onclick=showTitle;
}
function progHTML(){
  const unl=unlockedN(),done=unl>=DARUMAS.length;
  const next=done?0:DARUMAS[unl].need-SV.total;
  const pct=done?100:(SV.total%UNLOCK_STEP)/UNLOCK_STEP*100;
  return `<div class="prog">全ジャンル出題で 完成：<b>${SV.total}</b> 問　${done?"すべての だるまが そろった！":`次の だるままで あと <b>${next}</b> 問`}
    <div class="bar"><i style="width:${pct}%"></i></div></div>`;
}
/* ---------------- 段の解説アニメーション ---------------- */
const IB=36,IBW=200;                   // 見本の塔のブロックの高さ・幅
const IP={gen:0,timers:[],auto:true};
function ipLater(fn,ms){const g=IP.gen;IP.timers.push(setTimeout(()=>{if(g===IP.gen)fn();},ms));}
function ipStop(){IP.gen++;IP.timers.forEach(clearTimeout);IP.timers=[];}
function showIntro(st,inGame){
  const I=INTRO[st.id];
  openOverlay(`<div class="card intro">
    <div class="ihead"><div class="iblk c${stageColor(st.id)}">${st.name}</div>
      <button class="skipBtn" id="skipBtn">${inGame?"とじて つづける ✕":"スキップして はじめる ▶▶"}</button></div>
    <div class="icmd"><span>だるまの指令</span><b id="icmd">${I.cmd}</b></div>
    <div class="istage" id="istage"></div>
    <div class="isay" id="isay"></div>
    <div class="inav"><button id="iprev">◀ もどる</button><span class="dots" id="idots"></span><button id="inext">つぎへ ▶</button></div>
    <div id="iend" hidden><div class="isum"><b>まとめ</b>${I.body}</div>
      ${inGame?`<button class="btn" id="goBtn">つづける</button>`:`<button class="btn" id="goBtn">はじめる ▶</button>`}</div>
    ${inGame?"":`<label class="nomore"><input type="checkbox" id="nomore"> 次から この段の解説を表示しない</label>
      <button class="linkBtn" id="backBtn">ホームへ もどる</button>`}
  </div>`);
  const go=()=>{ac();ipStop();
    if(inGame){closeOverlay();return;}
    if($("nomore").checked){SV.skip=SV.skip||{};SV.skip[st.id]=true;save();}
    startStage(st);};
  $("skipBtn").onclick=go;$("goBtn").onclick=go;
  if(!inGame)$("backBtn").onclick=()=>{ipStop();showTitle();};
  $("iprev").onclick=()=>{IP.auto=false;ipShow(I,Math.max(0,IP.k-1));};
  $("inext").onclick=()=>{ac();if(IP.k<I.steps.length-1)ipShow(I,IP.k+1);};
  IP.auto=true;ipShow(I,0);
}
/* k番目の場面を表示：それまでの場面は一瞬で並べ、k番目だけアニメーションする */
function ipShow(I,k){
  ipStop();IP.k=k;
  const stage=$("istage");if(!stage)return;
  const n=I.tower.length;stage.style.height=(n*IB+78)+"px";
  stage.innerHTML=`<svg class="iarrows" id="iarrows"></svg><div class="ifloor"></div>`+
    I.tower.map((t,i)=>`<div class="iblock c${(i+2)%COLORS}" data-i="${i}">${t}</div>`).join("")+
    `<div class="idar">${darumaSVG(curDef())}</div><div class="iham">${HAMMER_SVG}</div>`;
  const S={I,stage,alive:I.tower.map((_,i)=>i),arrows:[]};
  ipLayout(S);
  $("icmd").textContent=I.cmd;
  for(let j=0;j<k;j++)I.steps[j].act.forEach(a=>ipAct(S,a,false));
  ipLayout(S);
  const stp=I.steps[k];
  $("isay").innerHTML=`${stp.h?`<span class="num">${stp.h}</span>`:`<span class="num dar">だるま</span>`}<p>${stp.say}</p>`;
  $("idots").innerHTML=I.steps.map((_,j)=>`<i class="${j===k?"on":j<k?"done":""}"></i>`).join("");
  $("iprev").disabled=k===0;$("inext").disabled=k>=I.steps.length-1;
  const last=k>=I.steps.length-1;$("iend").hidden=!last;
  // k番目の動きを順番に再生
  let t=0;
  stp.act.forEach(a=>{ipLater(()=>ipAct(S,a,true),t);t+=ipDur(a);});
  if(IP.auto&&!last){const read=Math.max(2600,stp.say.replace(/<[^>]+>/g,"").length*95);ipLater(()=>{if($("istage"))ipShow(I,k+1);},t+read);}
}
function ipDur(a){return a.drop?650:a.hit?a.hit.length*520+200:a.swap?1500:a.finish?700:a.arrow?380:a.mark||a.label?380:a.cross?350:120;}
function ipBlock(S,i){return S.stage.querySelector(`.iblock[data-i="${i}"]`);}
function ipLayout(S){
  S.alive.slice().reverse().forEach((i,pos)=>{const b=ipBlock(S,i);if(b)b.style.bottom=(14+pos*IB)+"px";});
  S.stage.querySelector(".idar").style.bottom=(14+S.alive.length*IB)+"px";
}
function ipCenterY(S,i){const pos=S.alive.slice().reverse().indexOf(i);return S.stage.clientHeight-(14+pos*IB+IB/2);}
function ipDrawArrows(S){
  const svg=S.stage.querySelector("#iarrows"),W=S.stage.clientWidth,x=W/2+IBW/2+4;
  svg.setAttribute("viewBox",`0 0 ${W} ${S.stage.clientHeight}`);
  svg.innerHTML=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker></defs>`+
    S.arrows.map(([a,b,lab],k)=>{const y1=ipCenterY(S,a),y2=ipCenterY(S,b),bend=44+k*26;
      return `<path class="iarr" d="M${x} ${y1} C${x+bend} ${y1},${x+bend} ${y2},${x+6} ${y2}" fill="none" stroke="#c62828" stroke-width="3" marker-end="url(#ah)"/>`+
        (lab?`<text x="${x+bend*0.8+4}" y="${(y1+y2)/2+5}" font-size="13" font-weight="bold" fill="#c62828">${lab}</text>`:"");}).join("");
}
function ipTag(b,tag,cls){if(!b||!tag)return;b.querySelectorAll(".itag").forEach(e=>e.remove());const s=document.createElement("span");s.className="itag "+cls;s.textContent=tag;b.appendChild(s);}
function ipAct(S,a,anim){
  if(a.drop){if(anim)S.alive.slice().reverse().forEach((i,pos)=>{const b=ipBlock(S,i);b.style.animationDelay=(pos*.07)+"s";b.classList.add("drop");
      if(AC)setTimeout(()=>SFX.land(.3),pos*70+300);});
    if(anim){const d=S.stage.querySelector(".idar");d.style.animationDelay=(S.alive.length*.07)+"s";d.classList.add("drop");}}
  if(a.cmd){$("icmd").textContent=a.cmd;if(anim){const c=$("icmd");c.classList.remove("flash");void c.offsetWidth;c.classList.add("flash");}}
  if(a.unmark)S.stage.querySelectorAll(".iblock").forEach(b=>{b.classList.remove("keep");b.querySelectorAll(".itag").forEach(e=>e.remove());});
  if(a.odai!=null)ipBlock(S,a.odai).classList.add("odai");
  if(a.mark)a.mark.forEach((i,j)=>{const b=ipBlock(S,i);b.classList.add("keep");if(a.tag&&(j===0||a.each))ipTag(b,a.tag,a.cls);if(anim&&AC)SFX.ding(j+1);});
  if(a.label)a.label.forEach(i=>ipTag(ipBlock(S,i),a.tag,a.cls));
  if(a.cross)a.cross.forEach(i=>{const b=ipBlock(S,i);if(!b.querySelector(".ix")){const x=document.createElement("span");x.className="ix";x.textContent="✕";b.appendChild(x);}
    if(anim){b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");if(AC)SFX.miss();}});
  if(a.arrow){S.arrows.push(a.arrow);ipDrawArrows(S);}
  if(a.clear){S.arrows=[];ipDrawArrows(S);}
  if(a.swap){if(!anim)return;const [p,q]=a.swap,bp=ipBlock(S,p),bq=ipBlock(S,q),yp=bp.style.bottom,yq=bq.style.bottom;
    bp.classList.add("swapping");bq.classList.add("swapping");bp.style.bottom=yq;bq.style.bottom=yp;if(AC)SFX.whoosh();
    ipLater(()=>{bp.style.bottom=yp;bq.style.bottom=yq;if(AC)SFX.whoosh();},800);
    ipLater(()=>{bp.classList.remove("swapping");bq.classList.remove("swapping");},1400);}
  if(a.hit){
    if(!anim){a.hit.forEach(i=>{ipBlock(S,i).remove();S.alive=S.alive.filter(x=>x!==i);});ipLayout(S);return;}
    a.hit.forEach((i,j)=>ipLater(()=>{
      const b=ipBlock(S,i),h=S.stage.querySelector(".iham"),W=S.stage.clientWidth;
      h.style.left=(W/2-IBW/2-38)+"px";h.style.bottom=(parseFloat(b.style.bottom)+IB/2-12)+"px";
      h.classList.remove("swing");void h.offsetWidth;h.classList.add("swing");
      setTimeout(()=>{b.classList.add("fly");if(AC)SFX.knock(j+1);
        S.alive=S.alive.filter(x=>x!==i);setTimeout(()=>{b.remove();ipLayout(S);if(AC)SFX.land(.3);},260);},170);
    },j*520));
  }
  if(a.finish){S.stage.querySelectorAll(".iblock").forEach(b=>{b.classList.add("gold");});
    if(anim){const d=S.stage.querySelector(".idar");d.classList.remove("jump","drop");void d.offsetWidth;d.classList.add("jump");

}

const P=[];
const PDEF={chip:{g:1600,drag:.6,life:.8,size:[5,12]},spark:{g:0,drag:.6,life:.22,size:[3,3]},dust:{g:-60,drag:3,life:.6,size:[3,7]},

  coin:{g:2000,drag:.3,life:1.4,size:[8,12]},shard:{g:1800,drag:.4,life:1.2,size:[8,16]},ink:{g:0,drag:4,life:1.8,size:[6,24]}};
function burst(x,y,o){
  if(o.type==="ring"){P.push({type:"ring",x,y,r:10,life:.35,max:.35,col:o.cols[0]});return;}
  if(o.type==="fireball"){for(let i=0;i<(o.n||1);i++)P.push({type:"fireball",x:x+(o.n>1?rnd(-8,8):0),y,r:o.r0||20,grow:o.grow||900,life:o.life||.4,max:o.life||.4,col:o.cols[0]});return;}
  const D=PDEF[o.type]||PDEF.chip,sz=o.size||D.size,life=o.life||D.life;
  for(let i=0;i<o.n;i++){
    const ang=(!o.omni&&(o.type==="chip"||o.type==="spark"))?(o.dir>0?0:Math.PI)+(Math.random()-.5)*1.6:Math.random()*Math.PI*2;
    const sp=o.speed*(.35+Math.random()*.75);
    P.push({type:o.type,x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-(o.up!=null?o.up:o.type==="chip"?250:0),
      g:o.g!=null?o.g:D.g,drag:o.drag!=null?o.drag:D.drag,rot:Math.random()*6,vr:(Math.random()-.5)*(o.spin||20),
      size:rnd(sz[0],sz[1]),life:life*rnd(.8,1.1),max:life,col:o.cols[i%o.cols.length],ch:o.chars?o.chars[i%o.chars.length]:null,
      sway:o.sway||0,ph:Math.random()*6});
  }
}
function confetti(){

      size:6+Math.random()*6,life:2.6,max:2.6,col:cols[i%cols.length]});

}
/* 絵文字の粒は、1回だけ小さなキャンバスに描いておき、毎フレームはそれを貼るだけにする（2026-11-03、ラグ対策）。
   以前は毎フレーム・粒ごとに大きさのちがう絵文字を fillText しており、うさぎ・音楽などの爆発で1フレームに数秒かかることがあった。 */
const EMO={},EMO_FS=56,EMO_BOX=72;
function emoImg(ch,col){const k=ch+"|"+col;let c=EMO[k];if(c)return c;
  c=document.createElement("canvas");c.width=c.height=EMO_BOX;const x=c.getContext("2d");
  x.font=`${EMO_FS}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`;x.textAlign="center";x.textBaseline="middle";x.fillStyle=col;x.fillText(ch,EMO_BOX/2,EMO_BOX/2+2);
  return EMO[k]=c;}
/* 爆発で使う絵文字を、ページを開いたあと手のあいた時間に少しずつ作っておく（初めての爆発でも引っかからないように） */
function warmEmoji(){
  const src=Object.values(BOOM).map(f=>f.toString()).join(" "),jobs=[];
  (src.match(/\{[^{}]*chars:\[[^\]]*\][^{}]*\}/g)||[]).forEach(o=>{
    const chs=(o.match(/chars:\[([^\]]*)\]/)[1].match(/"([^"]*)"/g)||[]).map(x=>x.slice(1,-1));
    const cols=((o.match(/cols:\[([^\]]*)\]/)||[,""])[1].match(/"([^"]*)"/g)||['"#000"']).map(x=>x.slice(1,-1));
    chs.forEach((ch,i)=>jobs.push([ch,cols[i%cols.length]]));
    chs.forEach(ch=>cols.forEach(col=>jobs.push([ch,col])));});
  const step=()=>{const t=performance.now();while(jobs.length&&performance.now()-t<8){const [ch,col]=jobs.pop();emoImg(ch,col);}if(jobs.length)setTimeout(step,30);};
  setTimeout(step,600);
}
function drawParticles(dt){
  const dpr=window.devicePixelRatio||1;
  if(fx.width!==Math.round(innerWidth*dpr)||fx.height!==Math.round(innerHeight*dpr)){fx.width=Math.round(innerWidth*dpr);fx.height=Math.round(innerHeight*dpr);}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];p.life-=dt;if(p.life<=0){P.splice(i,1);continue;}
    const a=Math.max(0,p.life/p.max);
    ctx.globalAlpha=1;ctx.shadowBlur=0;
    if(p.type==="ring"){p.r+=dt*700;ctx.globalAlpha=a;ctx.strokeStyle=p.col;ctx.lineWidth=(p.w||6)*a;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();continue;}
    if(p.type==="fireball"){p.r+=dt*p.grow;ctx.globalAlpha=a*.85;const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
      gr.addColorStop(0,"#fffde7");gr.addColorStop(.4,p.col);gr.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();continue;}
    if(p.type==="hole"){p.r+=dt*p.grow;ctx.globalAlpha=Math.min(1,a*3);const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.2);
      gr.addColorStop(0,"#000");gr.addColorStop(.45,p.col);gr.addColorStop(.6,"#7c4dff");gr.addColorStop(1,"rgba(124,77,255,0)");ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.2,0,7);ctx.fill();continue;}
    if(p.type==="bolt"){ctx.globalAlpha=a;ctx.strokeStyle=p.col;ctx.lineWidth=6;ctx.shadowColor="#fff";ctx.shadowBlur=20;ctx.beginPath();
      p.pts.forEach(([x,y],k)=>k?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle="#fff";ctx.stroke();ctx.shadowBlur=0;continue;}
    if(p.type==="trail"){ctx.globalAlpha=a*.5;ctx.fillStyle=p.col;ctx.fillRect(p.x-p.w/2,p.y-p.h/2,p.w,p.h);continue;}
    p.vx-=p.vx*p.drag*dt;p.vy-=p.vy*p.drag*dt;p.vy+=p.g*dt;p.x+=p.vx*dt+(p.sway?Math.sin(p.ph+p.life*4)*p.sway*60*dt:0);p.y+=p.vy*dt;p.rot+=p.vr*dt;
    ctx.globalAlpha=(p.type==="conf"||p.type==="emo"||p.type==="ink"||p.type==="coin")?Math.min(1,a*2.2):a;ctx.fillStyle=p.col;ctx.strokeStyle=p.col;
    switch(p.type){
      case "spark":ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.04,p.y-p.vy*.04);ctx.stroke();break;
      case "dust":ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1.8-a),0,7);ctx.fill();break;
      case "smoke":ctx.globalAlpha=a*.55;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(2.4-a),0,7);ctx.fill();break;
      case "drop":case "ink":ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();break;
      case "bubble":ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.stroke();ctx.globalAlpha*=.5;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(p.x-p.size*.35,p.y-p.size*.35,p.size*.25,0,7);ctx.fill();break;
      case "coin":ctx.save();ctx.translate(p.x,p.y);ctx.scale(Math.cos(p.rot),1);ctx.beginPath();ctx.arc(0,0,p.size,0,7);ctx.fill();
        ctx.strokeStyle="#c49000";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#c49000";ctx.fillRect(-p.size*.2,-p.size*.2,p.size*.4,p.size*.4);ctx.restore();break;
      case "shard":ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();ctx.moveTo(0,-p.size);ctx.lineTo(p.size*.6,p.size*.5);ctx.lineTo(-p.size*.5,p.size*.3);ctx.closePath();
        ctx.fill();ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=1;ctx.stroke();ctx.restore();break;
      case "star":ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();
        for(let k=0;k<8;k++){const r=k%2?p.size*.4:p.size;ctx.lineTo(Math.cos(k*Math.PI/4)*r,Math.sin(k*Math.PI/4)*r);}ctx.fill();ctx.restore();break;
      case "comet":ctx.lineCap="round";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.14,p.y-p.vy*.14);ctx.stroke();ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();break;
      case "emo":{const im=emoImg(p.ch,p.col),sz=p.size*EMO_BOX/EMO_FS;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*.3);
        ctx.drawImage(im,-sz/2,-sz/2,sz,sz);ctx.restore();break;}
      default:ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);if(p.type==="conf")ctx.scale(Math.cos(p.rot*1.7),1);
        ctx.fillRect(-p.size/2,-p.size/3,p.size,p.size*.66);ctx.restore();
    }
  }
  ctx.globalAlpha=1;
}

/* ---------------- 物理ループ ---------------- */
let lastT=performance.now();
function loop(now){
  const rdt=Math.min(.05,(now-lastT)/1000);lastT=now;
  let ts=1;if(now<G.stopUntil)ts=0;else if(now<G.slowUntil)ts=.22;
  const dt=rdt*ts;
  if(G.blocks){
    const st=stack(),n=Math.max(1,Math.ceil(dt*240)),sdt=dt/n;
    for(let k=0;k<n;k++){st.forEach((b,i)=>stepStack(b,targetH(i),sdt));stepStack(G.daruma,st.length*BH,sdt,true);}
    G.blocks.forEach(b=>{if(b.state==="fly")stepFly(b,dt);render(b);});
    if(G.daruma.state==="fly")stepFly(G.daruma,dt);
    render(G.daruma);
  }
  const w=G.wob;for(let k=0;k<4;k++){w.v+=(-170*w.a-9*w.v)*rdt/4;w.a+=w.v*rdt/4;}
  // ミスの数に応じて、積み上がったブロックがぐらぐらゆれる（上ほど大きく）
  G.swayT=(G.swayT||0)+rdt;
  const swayA=(!G.blocks||G.done)?0:[0,3.5,11][Math.min(G.miss,2)],swF=G.miss>=2?5.4:3.3;
  if(G.blocks){const st=stack(),n=st.length;st.forEach((b,i)=>{b.sw=swayA*((i+1)/(n+1))*Math.sin(G.swayT*swF+i*.55);});
    G.daruma.sw=swayA*1.15*Math.sin(G.swayT*swF+n*.55);}
  if(G.miss>=2&&!G.done&&G.blocks&&now-(G.lastCreak||0)>1500){G.lastCreak=now;SFX.creak();}
  $("flash").classList.toggle("danger",G.miss>=2&&!G.done&&!!G.blocks);
  tower.style.transform=`rotate(${w.a*.12+(G.miss>=2&&!G.done?.9*Math.sin(G.swayT*2.6):0)}deg)`;
  // 指令の吹き出しは、だるまの頭の上についていく
  const bb=$("bubble"),dd=G.daruma;
  if(dd){bb.style.bottom=(Math.max(dd.h,0)+DW*DH_RATIO+8)+"px";
    const ov=$("overlay"),cover=!ov.hidden&&!ov.classList.contains("top");
    bb.classList.toggle("hide",dd.state!=="stack"||G.done||cover);}
  if(G.shake>.2){world.style.transform=`translate(${(Math.random()-.5)*G.shake}px,${(Math.random()-.5)*G.shake}px)`;G.shake*=Math.pow(.004,rdt);}
  else world.style.transform="";
  if(G.shownScore!==G.score){G.shownScore+=Math.ceil((G.score-G.shownScore)*Math.min(1,rdt*10));$("score").textContent=G.shownScore;}
  if(HOLD.on){if(now-HOLD.t>45){HOLD.vx*=.75;}placeHeld();}
  drawParticles(rdt);
  requestAnimationFrame(loop);
}
function stepStack(b,target,dt,isD){
  if(b.state!=="stack")return;
  if(b.h>target||b.vh!==0){
    b.vh-=GRAV*dt;b.h+=b.vh*dt;
    if(b.h<=target){
      b.h=target;const v=-b.vh;
      if(v>320){b.vh=v*.16;b.sy=Math.max(.72,1-v/9000);b.sx=2-b.sy;if(!b.landed||v>900)landFx(b,v);b.landed=true;}
      else b.vh=0;
      if(isD&&G.onDarumaLand&&b.vh===0){const f=G.onDarumaLand;G.onDarumaLand=null;f();}
    }
  }
  if(b.x!==0||b.vx!==0){b.vx+=(-900*b.x-28*b.vx)*dt;b.x+=b.vx*dt;if(Math.abs(b.x)<.3&&Math.abs(b.vx)<5){b.x=0;b.vx=0;}}
  b.sx+=(1-b.sx)*Math.min(1,dt*14);b.sy+=(1-b.sy)*Math.min(1,dt*14);
}
let lastLandSfx=0;
function landFx(b,v){
  const now=performance.now();
  if(now-lastLandSfx>45){b.isDaruma?SFX.land(1.2):SFX.land(Math.min(1,v/2500));lastLandSfx=now;}
  if(b.revived){b.revived=false;const r=b.el.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2,{n:24,type:"star",omni:true,cols:["#fff59d","#ffd54f","#ffffff"],speed:700});
    burst(r.left+r.width/2,r.bottom,{n:1,type:"ring",cols:["#ffd54f"]});}
  if(v>900){
    G.shake=Math.max(G.shake,Math.min(9,v/400));G.wob.v+=(Math.random()-.5)*8;
    const r=b.el.getBoundingClientRect();
    burst(r.left+4,r.bottom,{n:5,type:"dust",omni:true,cols:["#d7c3a0","#bfa77f"],speed:220});
    burst(r.right-4,r.bottom,{n:5,type:"dust",omni:true,cols:["#d7c3a0","#bfa77f"],speed:220});
  }
}
function stepFly(b,dt){
  b.x+=b.vx*dt;b.vh-=GRAV*.42*dt;b.h+=b.vh*dt;b.rot+=b.vr*dt;
  if(dt>0&&Math.abs(b.vx)>1500&&!b.isDaruma){
    const r=b.el.getBoundingClientRect();
    P.push({type:"trail",x:r.left+r.width/2,y:r.top+r.height/2,w:r.width*.9,h:BH*.6,life:.12,max:.12,col:colorOf(b)[0]});
  }
  if(Math.abs(b.x)>innerWidth+BW||b.h<-innerHeight){b.state="gone";b.el.style.display="none";}
}
function render(b){if(b.state==="gone")return;const sw=b.state==="stack"?(b.sw||0):0;
  b.el.style.transform=`translate(${b.x+sw}px,${-b.h}px) rotate(${b.rot+sw*.35}deg) scale(${b.sx},${b.sy})`;}

addEventListener("resize",layout);
layout();showTitle();requestAnimationFrame(loop);warmEmoji();
// 今日のミニゲーム（2026-11-06〜）：?daily=1で開いたときは、最後の挑戦をいきなり始め、1回終わったら本体へもどる（daily_minigame.js）
/* 挑戦モード（塔が3回くずれるまで続く）は、今日のミニゲームでは3分間まで（2026-11-09、教員の指示：
   「いつまでも遊べる系のゲームのみ、3分を宣言して、その間に獲得したごほうびをあげる」）。
   ・遊び方の札と挑戦モードの入口に「3分間」と書き、遊んでいる間は上の札に残り時間を出す。
   ・3分は「挑戦する！」で塔が始まったときから数える。3分たったら、その場で操作を止めて結果へ（＝最後まで遊びきった扱い、ボーナスあり）。
   ・打ち切ったときは、自己ベスト・最高記録には残さない（showResult の G.timeUp）。 */
const DAILY_CH_MS = 3 * 60 * 1000;
const DAILY_CH = !!(window.DAILY_MG && !nextStageId() && SV.done && SV.done.s4);
if(DAILY_CH){
  try{
    const k = window.DAILY_MG_BRIEF_SSKEY, b = JSON.parse(sessionStorage.getItem(k) || "null");
    if(b){ b.limit = "⏰ 遊べるのは 3分間！"; b.limitSub = "3分たつか、塔が3回くずれたらおしまい。3分の間に正解した分が、ごほうびになるよ。"; sessionStorage.setItem(k, JSON.stringify(b)); }
  }catch(e){}
  let endAt = 0, tick = null;
  const fmt = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };
  const showLeft = () => {
    const tag = document.getElementById("dailyMgTag");
    if(!tag) return;
    const left = endAt - Date.now();
    tag.textContent = "🎈 今日のミニゲーム　⏰ 残り " + fmt(left);
    tag.style.background = left <= 30000 ? "linear-gradient(135deg,#e53935,#ff7043)" : "";
  };
  const timeUp = () => {
    clearInterval(tick); tick = null;
    if(!G.stage || G.mode !== "ch" || G.timeUp) return;
    G.timeUp = true; G.done = true; G.busy = true;
    const tag = document.getElementById("dailyMgTag");
    if(tag) tag.textContent = "🎈 今日のミニゲーム　⏰ 時間！";
    try{ SFX.whistle ? SFX.whistle() : SFX.fanfare(); }catch(e){}
    closeOverlay();
    setTimeout(showResult, 400);
  };
  const origStart = startStage;
  window.startStage = function(st){
    const r = origStart.apply(this, arguments);
    if(G.mode === "ch" && !G.timeUp && !tick){
      endAt = Date.now() + DAILY_CH_MS;
      showLeft();
      tick = setInterval(() => { if(Date.now() >= endAt) timeUp(); else showLeft(); }, 250);
    }
    return r;
  };
  // 3分たったあとは、くずれた塔の解説・次の塔を出さない（結果の画面の上に重ならないように）
  ["showExplain", "nextTower", "buildTower"].forEach(n => {
    const f = window[n];
    window[n] = function(){ if(G.timeUp) return; return f.apply(this, arguments); };
  });
  // 3分より前に（塔が3回くずれて）結果になったら、時計を止める
  const origResult = showResult;
  window.showResult = function(){ if(tick){ clearInterval(tick); tick = null; } return origResult.apply(this, arguments); };
}
dailyMgPage("kokugo_app.html?from=daily", () => { const n = nextStageId(); openStage(STAGES.find(s => s.id === (n || "s4"))); }, {ends:["showResult"], quits:["showTitle"]});
