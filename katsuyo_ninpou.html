<title>活用忍伝 ―変化ノ極意―</title>
<script src="mg_save_guard.js?v=13.94" data-keys="katsuyo_ninpou_v1"></script><!-- ほかの画面で記録が変わったら読み込み直し、古い記録で上書きしない -->
<script src="jp_wrap.js?v=13.97"></script><!-- スマホ幅のとき、日本語を文節の切れ目で折り返す -->
<!-- 知識ドリルDXのミニゲーム「活用忍伝 ―変化ノ極意―」（2026-11-23〜、試作）。
     用言の活用を、忍者の「変化の術」の物語の中で、章ごとに一段ずつ身につける。
       序 変化の術       … 語幹（本体）と活用語尾（変装）。「書＿ない」に合う変装札を選ぶ
       一 六つの合言葉   … 後ろに続く言葉（合言葉）から活用形（術）を見分ける
       二 流派を見抜け   … 「ない」の煙玉で正体（ないの直前の音の段）を見て、活用の種類（流派）を当てる
       三 偽忍者の襲来   … 一段に見える五段（切る・帰る・要る…）を、煙玉なし（3つだけ）で見破る
       四 巻物の復元     … 破れた活用表の「？」を埋める（五段は必ず音便の欄を入れる＝中ボス）
       終 城での決戦     … 文の中の下線部の活用形を見抜く（3問に1問は流派も）。石化丸の体力を削る
       外 異国の術者     … 準備中（形容詞・形容動詞）
     問題はこのページの中で、動詞の一覧と活用の規則から自動で作る（何度遊んでも尽きない）。
     本体のセーブデータ(st)には直接触れず、このページ専用のlocalStorageキー(NP_LSKEY)を使う。
     正誤は「動詞の活用」（doushi_katsuyo）ジャンルのレベルに反映する（つなぎ橋の練習の谷と同じ数え方：
     正解2つ＝＋1、まちがい2つ＝−1、1回の差し引きがマイナスなら0）。
     絵は NP_IMG にdata URLを入れれば差し替わる（入っていないときは絵文字で代用）。 -->
<style>
  :root{
    --night1:#141a2e; --night2:#26304f; --night3:#3d2f4f;
    --paper:#f6ecd2; --paper2:#e8d6aa; --ink:#2b1d0e; --ink2:#6b5233;
    --red:#c8372d; --gold:#f2c14e; --ok:#4fbf7a; --ng:#e25b52; --blue:#4c7bd9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic",sans-serif;color:#fff;
    background:radial-gradient(ellipse at 50% 0%,#3b4a7a 0%,var(--night2) 40%,var(--night1) 100%);
    background-attachment:fixed;overflow-x:hidden;user-select:none;-webkit-user-select:none}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(circle at 82% 12%,rgba(255,244,200,.9) 0 26px,rgba(255,244,200,.15) 27px 60px,transparent 61px),
      linear-gradient(to top,#0b0f1c 0 60px,transparent 60px);
    opacity:.35}
  .wrap{position:relative;max-width:720px;margin:0 auto;padding:12px 12px 40px;min-height:100%}
  .screen{display:none}
  .screen.show{display:block;animation:fadeIn .35s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  button{font-family:inherit;cursor:pointer}
  .btn{border:none;border-radius:12px;padding:12px 22px;font-size:17px;font-weight:bold;color:#fff;
    background:linear-gradient(180deg,#d8463a,#a92a22);box-shadow:0 4px 0 #6f1813,0 6px 12px rgba(0,0,0,.35)}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6f1813}
  .btn.sub{background:linear-gradient(180deg,#5a6584,#3c4562);box-shadow:0 4px 0 #232a40,0 6px 12px rgba(0,0,0,.35)}
  .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .iconbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:6px 12px;font-size:14px}

  /* タイトル */
  .title-box{text-align:center;margin:18px 0 16px}
  .title-box .sub{font-size:14px;letter-spacing:.3em;color:var(--gold)}
  .title-box h1{margin:6px 0 4px;font-size:clamp(30px,8vw,46px);letter-spacing:.08em;
    text-shadow:0 3px 0 #000,0 0 18px rgba(242,193,78,.45)}
  .title-box .h1sub{font-size:16px;color:#e9dfc3}
  .title-hero{font-size:64px;margin-top:6px}
  .title-hero img{height:120px}
  .ch-list{display:grid;gap:10px}
  .ch-card{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,var(--paper),var(--paper2));
    color:var(--ink);border-radius:14px;padding:12px 14px;box-shadow:0 4px 0 #8c7347,0 8px 14px rgba(0,0,0,.35);cursor:pointer}
  .ch-card .no{flex:0 0 52px;height:52px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:bold;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
  .ch-card .tx{flex:1;min-width:0}
  .ch-card h3{margin:0 0 2px;font-size:18px}
  .ch-card p{margin:0;font-size:13px;color:var(--ink2)}
  .ch-card .st{font-size:18px;letter-spacing:2px;color:#c8902a;white-space:nowrap}
  .ch-card.locked{filter:grayscale(.9) brightness(.7);cursor:default}
  .ch-card.locked .no{background:#666}
  .note{font-size:13px;color:#cfd6ea;text-align:center;margin-top:12px;line-height:1.6}

  /* 物語 */
  .stage{position:relative;height:min(46vh,320px);border-radius:16px;overflow:hidden;
    background:linear-gradient(180deg,#2b3963,#1c2440 70%,#2a2016 70%,#1a140d);box-shadow:inset 0 0 40px rgba(0,0,0,.5)}
  .stage .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .stage .actor{position:absolute;bottom:22%;font-size:84px;line-height:1;transition:transform .3s, opacity .3s;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
  .stage .actor img{height:150px;display:block}
  .stage .actor.left{left:8%}
  .stage .actor.right{right:8%}
  .stage .actor.dim{opacity:.45;transform:scale(.92)}
  .stage .actor.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .dlg{margin-top:10px;background:rgba(10,12,24,.88);border:2px solid var(--gold);border-radius:14px;padding:12px 16px 26px;min-height:120px;position:relative;cursor:pointer}
  .dlg .who{display:inline-block;background:var(--gold);color:var(--ink);font-weight:bold;font-size:14px;padding:2px 12px;border-radius:999px;margin-bottom:6px}
  .dlg .txt{font-size:18px;line-height:1.75}
  .dlg .next{position:absolute;right:14px;bottom:6px;font-size:13px;color:var(--gold);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
  .em{color:var(--gold);font-weight:bold}
  .skip{position:absolute;top:8px;right:8px;z-index:2}

  /* 巻物（まとめ） */
  .scroll{background:linear-gradient(90deg,#c9a66b 0 14px,var(--paper) 14px calc(100% - 14px),#c9a66b calc(100% - 14px));
    color:var(--ink);border-radius:8px;padding:18px 28px;box-shadow:0 8px 18px rgba(0,0,0,.45);line-height:1.7}
  .scroll h2{margin:0 0 8px;text-align:center;font-size:22px;color:var(--red);letter-spacing:.1em}
  .scroll table{border-collapse:collapse;margin:8px auto;font-size:16px}
  .scroll td,.scroll th{border:1px solid #b79c6c;padding:4px 10px;text-align:center}
  .scroll th{background:#ead9b0}
  .scroll .big{font-size:26px;text-align:center;margin:6px 0}
  .scroll .stem{color:var(--blue);font-weight:bold}
  .scroll .end{color:var(--red);font-weight:bold}
  .chant{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
  .chant span{background:var(--red);color:#fff;border-radius:8px;padding:6px 10px;font-weight:bold;font-size:18px;animation:pop 1.8s infinite}
  @keyframes pop{0%,100%{transform:none}10%{transform:scale(1.18)}}

  /* 修行（プレイ） */
  .hud{display:flex;justify-content:space-between;align-items:center;font-size:15px;margin-bottom:6px;gap:6px;flex-wrap:wrap}
  .hud .life{font-size:20px;letter-spacing:2px}
  .hud .combo{color:var(--gold);font-weight:bold;min-width:70px;text-align:right}
  .bar{height:6px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-bottom:8px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff8b5c);transition:width .3s}
  .arena{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.25));border:1px solid rgba(255,255,255,.18);
    border-radius:16px;padding:14px 12px;text-align:center;min-height:210px}
  .arena .foe{font-size:64px;line-height:1;margin-bottom:4px;transition:transform .25s,opacity .25s}
  .arena .foe img{height:110px}
  .arena .foe.hit{animation:hit .5s}
  @keyframes hit{0%{transform:none}30%{transform:translateX(16px) rotate(8deg);opacity:.5}100%{transform:none;opacity:1}}
  .arena .prompt{font-size:14px;color:#cfd6ea;margin-bottom:6px}
  .qword{font-size:clamp(30px,8vw,44px);font-weight:bold;letter-spacing:.04em;margin:4px 0}
  .qword rt{font-size:.38em;color:#cfd6ea}
  .qword .blank{display:inline-block;min-width:1.2em;border-bottom:4px solid var(--gold);color:var(--gold)}
  .qword .fol{color:#9fd3ff}
  .lastboss{display:inline-block;background:linear-gradient(135deg,#3a0a4a,#a8182a);color:#ffd23f;border:1px solid #ffd23f;border-radius:999px;font-size:11px;padding:1px 8px;margin-right:6px;vertical-align:middle}
  .noitem{font-size:12px;color:#cfd6ea;background:rgba(0,0,0,.25);border-radius:999px;padding:4px 12px}
  /* 自宅の隅の「最初からやり直す」（目立たないように小さく） */
  .home-reset{text-align:right;margin-top:18px}
  .home-reset button{background:none;border:1px solid rgba(160,60,60,.45);color:#a05050;font-size:11px;padding:3px 8px;border-radius:6px;cursor:pointer;opacity:.75}
  /* 品詞の札（2026-11-24、教員の指示「〜ないの問題は、動詞と形容詞・形容動詞で答えが変わるので、出題時にはっきり示す」） */
  .pos-tag{display:inline-block;vertical-align:middle;font-size:clamp(14px,4vw,18px);font-weight:bold;letter-spacing:0;padding:3px 10px;margin-right:8px;border-radius:8px;border:2px solid #fff;color:#fff;transform:translateY(-4px)}
  .pos-tag.v{background:#c0392b}.pos-tag.adj{background:#1f7a3a}.pos-tag.adjv{background:#6a3aa8}
  .qword .sound{color:var(--gold);text-decoration:underline;text-underline-offset:6px}
  .smoke{display:inline-block;margin-top:6px;font-size:22px;padding:4px 14px;border-radius:12px;background:rgba(255,255,255,.1)}
  .smoke.show{animation:smoke .6s ease both}
  @keyframes smoke{0%{opacity:0;filter:blur(8px);transform:scale(1.4)}100%{opacity:1;filter:none;transform:none}}
  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:12px}
  .choice{border:none;border-radius:12px;padding:14px 6px;font-size:19px;font-weight:bold;color:var(--ink);
    background:linear-gradient(180deg,var(--paper),var(--paper2));box-shadow:0 4px 0 #8c7347}
  .choice:active{transform:translateY(3px);box-shadow:0 1px 0 #8c7347}
  .choice.fuda{font-size:28px;writing-mode:vertical-rl;padding:14px 0;min-height:86px;justify-self:center;width:64px;
    background:linear-gradient(180deg,#fff9e6,#f0dca6);border:2px solid #c8372d}
  .choice.ok{background:linear-gradient(180deg,#bff0cf,#79d39c)}
  .choice.ng{background:linear-gradient(180deg,#ffc9c4,#f08b82)}
  .choice:disabled{opacity:.85}
  .choice small{display:block;font-size:11px;font-weight:normal;color:var(--ink2)}
  .tools{display:flex;justify-content:center;gap:8px;margin-top:10px}
  .feedback{margin-top:10px;border-radius:12px;padding:10px 14px;font-size:15px;line-height:2.1;text-align:left;display:none}
  .feedback.show{display:block;animation:fadeIn .25s both}
  .feedback.ok{background:rgba(79,191,122,.18);border:1px solid var(--ok)}
  .feedback.ng{background:rgba(226,91,82,.18);border:1px solid var(--ng)}
  .feedback b{color:var(--gold)}
  .flash{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:44px;font-weight:bold;pointer-events:none;z-index:50;
    text-shadow:0 3px 0 #000;opacity:0}
  .flash.go{animation:flash .8s ease both}
  @keyframes flash{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}

  /* 結果 */
  .result{text-align:center}
  .result h2{font-size:30px;margin:10px 0}
  .result .stars{font-size:44px;letter-spacing:6px;color:var(--gold);text-shadow:0 2px 0 #000}
  .result .stat{font-size:16px;line-height:1.9}
  .lvup-toast{position:fixed;left:50%;top:10px;transform:translateX(-50%) translateY(-120%);background:#2f7a4c;color:#fff;border-radius:999px;
    padding:6px 16px;font-size:14px;z-index:60;transition:transform .3s;box-shadow:0 4px 12px rgba(0,0,0,.35);white-space:nowrap}
  .lvup-toast.down{background:#8a3a34}
  .lvup-toast.show{animation:toast 2.2s ease both}
  @keyframes toast{0%{transform:translateX(-50%) translateY(-120%)}12%,80%{transform:translateX(-50%) translateY(0)}100%{transform:translateX(-50%) translateY(-120%)}}
  .lvup-toast b{margin:0 6px}
  /* 村 */
  .vtitle{font-weight:bold;letter-spacing:.2em;color:var(--gold)}
  .vstatus{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-size:15px;margin:2px 0 8px}
  .rank{display:inline-block;color:#fff;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:bold;text-shadow:0 1px 0 rgba(0,0,0,.3)}
  .pts-badge{background:linear-gradient(135deg,#ff9a3c,#ffd23f);color:#3a2000;border-radius:999px;padding:3px 10px;font-weight:bold;font-size:13px;cursor:pointer;animation:pop 1.6s infinite}
  .village{position:relative;width:100%;aspect-ratio:3/4;max-height:max(300px,calc(100vh - 400px));margin:0 auto;border-radius:20px;overflow:hidden;
    background:radial-gradient(circle at 50% 50%,#d9c49a 0 9%,transparent 9.5%),linear-gradient(180deg,#9fd08a,#7fbf73 60%,#6aae64);
    border:3px solid #6b4f2a;box-shadow:0 6px 0 #4b371c,0 10px 20px rgba(0,0,0,.45)}
  .vroads{position:absolute;inset:0;width:100%;height:100%}
  .vroads path{fill:none;stroke:#d9c49a;stroke-width:5;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-width:18px}
  .vdeco{position:absolute;transform:translate(-50%,-50%);font-size:26px;pointer-events:none;opacity:.85}
  .vplace{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;z-index:2}
  .vplace .vicon{position:relative;font-size:46px;line-height:1;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35));transition:transform .15s}
  .vplace:active .vicon{transform:scale(.9)}
  .vplace .vname{margin-top:2px;background:rgba(40,25,10,.78);color:#ffe9b0;font-size:12px;font-weight:bold;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .vplace .vname small{display:block;font-size:9px;color:#ffb3a8}
  .vplace.soon .vicon{filter:grayscale(.6) drop-shadow(0 4px 3px rgba(0,0,0,.35))}
  /* 入れない建物（城＝任務がまだない・道場＝改修工事中・茶屋＝Lv10から・萬屋＝はじめて両を手に入れるまで）：アイコンに赤いバッテン */
  .vplace.locked .vicon{filter:grayscale(.85) brightness(.85) drop-shadow(0 4px 3px rgba(0,0,0,.35))}
  .dj-conf{position:fixed;z-index:60;font-size:20px;pointer-events:none;transform:translate(-50%,-50%);animation:djconf 1.5s ease-out both}
  @keyframes djconf{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 80px)) scale(1) rotate(200deg)}}
  .vbatsu{position:absolute;left:50%;top:-2px;width:54px;height:54px;transform:translateX(-50%);z-index:2;background:linear-gradient(45deg,transparent 43%,#e0362b 43%,#e0362b 57%,transparent 57%),linear-gradient(-45deg,transparent 43%,#e0362b 43%,#e0362b 57%,transparent 57%);pointer-events:none}
  /* 城の吹き出し：今できる任務があるとき */
  .vfuki{position:absolute;left:calc(100% + 10px);top:2px;background:#fff;color:#3a2716;font-size:11px;font-weight:bold;line-height:1.35;border:2px solid #e0362b;border-radius:10px;padding:3px 7px;width:8.5em;white-space:normal;text-align:left;filter:none;animation:bob 1.6s ease-in-out infinite;z-index:3}
  .vfuki::before{content:"";position:absolute;left:-9px;top:10px;border:5px solid transparent;border-right:7px solid #e0362b}
  .vbadge{position:absolute;right:-10px;top:-6px;background:#e0362b;color:#fff;font-size:13px;font-weight:bold;border-radius:999px;min-width:20px;height:20px;line-height:20px;animation:pop 1.2s infinite}
  .vbadge.story{background:#7a3fd1;min-width:24px;height:24px;line-height:24px;font-size:14px}
  .goal{background:rgba(40,25,70,.85);border:1px solid #b392f0;color:#f1e8ff;border-radius:12px;padding:6px 10px;font-size:13px;line-height:1.6;margin-bottom:8px}
  .goal b{color:#ffd23f}
  .goal.small{margin-top:6px;font-size:12px}
  .vtarget{position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:#e0362b;color:#fff;font-size:12px;font-weight:bold;border-radius:999px;padding:1px 8px;white-space:nowrap;animation:bob .8s ease-in-out infinite}
  @keyframes bob{50%{margin-top:-6px}}
  .qcard-main{background:linear-gradient(135deg,rgba(60,30,100,.92),rgba(30,20,60,.92));border:2px solid #b392f0;border-radius:14px;padding:8px 12px;margin-bottom:8px;color:#f1e8ff}
  .goal.small,.fgoal{font-size:12px}
  .qc-title{font-weight:bold;color:#ffd23f;font-size:15px}
  .qc-now{color:#fff;font-size:13px}
  .qc-sub{font-size:12px;color:#d9ccf5;margin:2px 0}
  .qc-steps{margin:4px 0;padding-left:4px;list-style:none;font-size:13px;line-height:1.7}
  .qc-steps li.done{color:#9fd8a8;text-decoration:line-through;text-decoration-color:rgba(159,216,168,.6)}
  .qc-steps li.now{color:#fff;font-weight:bold;background:rgba(255,210,63,.18);border-radius:6px;padding:0 4px}
  .qc-lv{font-size:12px}.qc-lv.ok{color:#9ff0b8}.qc-lv.ng{color:#ffb3a8;font-weight:bold}
  .qc-btns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .qlog{display:grid;gap:4px;text-align:left}
  .qlrow{display:grid;grid-template-columns:24px 1fr;grid-template-areas:"s n" "s t";background:#fffaf0;border:1px solid #d8c08e;border-radius:10px;padding:4px 8px}
  .qlrow span{grid-area:s;align-self:center}.qlrow b{grid-area:n}.qlrow small{grid-area:t;font-size:11px;color:var(--ink2)}
  .qlrow.now{border-color:#7a3fd1;background:#f6ecff}.qlrow.lock{opacity:.6}
  .ftarget{position:absolute;left:50%;top:-14px;transform:translateX(-50%);color:#e0362b;font-weight:bold;font-size:16px;text-shadow:0 0 4px #fff;animation:bob .8s ease-in-out infinite}
  .ft{position:relative}
  .ft.goexit{box-shadow:inset 0 0 0 3px #ffd23f}

    background:linear-gradient(135deg,#ff5f2e,#ffb347);box-shadow:0 3px 0 #9a3412;animation:pop 1.2s infinite}
  .jbtn:disabled{opacity:.5;animation:none}
  .jutsu-fx{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0}
  .jutsu-fx.go{animation:jfx 1.2s ease both}
  .jutsu-fx .jfx-ic{font-size:110px;filter:drop-shadow(0 0 20px #ff8c1a)}
  .jutsu-fx .jfx-nm{font-size:34px;font-weight:bold;color:#fff;text-shadow:0 3px 0 #000,0 0 14px #ff8c1a}
  @keyframes jfx{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
  .jlist{display:grid;gap:4px}
  .jrow{display:flex;align-items:center;gap:8px;background:#fff3e0;border:1px solid #f0b27a;border-radius:10px;padding:4px 8px}
  .jrow small{margin-left:auto;font-size:12px;color:var(--ink2)}
  .jrow .jic{font-size:22px}
  .jrow.locked{background:#eee;border-color:#ccc;color:#999}
  .rewards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;background:rgba(255,215,90,.15);border:1px solid var(--gold);border-radius:12px;padding:8px;margin:8px 0}
  .rewards span{background:rgba(0,0,0,.3);border-radius:999px;padding:2px 10px}
  .lvup{color:#9ff0b8;font-size:16px;margin:6px 0}
  .modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px}
  .modal.show{display:flex;animation:fadeIn .25s both}
  .modal-box{max-width:460px;width:100%;max-height:90vh;overflow:auto;background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--ink);border-radius:16px;padding:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:center;line-height:1.8}
  .modal-box .big{font-size:44px}
  .modal-box h3{margin:4px 0;color:var(--red)}
  .modal-box .who{display:inline-block;background:var(--ink);color:var(--gold);border-radius:999px;padding:1px 12px;font-size:13px}
  /* 四の章：活用表 */
  .ktable{border-collapse:collapse;margin:6px auto 0;font-size:16px;color:var(--ink);background:var(--paper);border-radius:8px;overflow:hidden}
  .ktable td,.ktable th{border:1px solid #b79c6c;padding:4px 10px;text-align:center}
  .ktable th{background:#ead9b0;font-size:13px}
  .ktable td.fol{color:var(--ink2);font-size:13px}
  .ktable td.fol .fol-on{color:var(--red);font-size:15px}
  .ktable td.fol .fol-off{opacity:.45;font-size:11px}
  .fol-note{margin:6px auto 0;max-width:340px;font-size:12px;line-height:1.5;color:#fff;background:rgba(0,0,0,.35);border-radius:8px;padding:4px 8px}
  .ktable td.cur{background:#fff1b8;color:var(--red);font-weight:bold;animation:pop 1.2s infinite}
  .ktable td.torn{background:repeating-linear-gradient(45deg,#d8c08e 0 6px,#c9ad74 6px 12px);color:transparent}
  .ktable td.form{font-size:18px;font-weight:bold}
  .ktable rt{font-size:.5em;color:var(--ink2)}
  .boss-tag{display:inline-block;background:var(--red);color:#fff;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:bold;margin-bottom:4px}
  /* 終の章：文と石化丸の体力 */
  .sent{font-size:clamp(20px,5.4vw,26px);line-height:2.1;margin:4px 0;color:#fff}
  .sent u{text-decoration-color:var(--gold);text-decoration-thickness:3px;text-underline-offset:7px;color:var(--gold);font-weight:bold}
  .sent rt{font-size:.45em;color:#cfd6ea}
  .bosshp{width:70%;max-width:260px;height:10px;margin:4px auto 0;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;border:1px solid rgba(255,255,255,.3)}
  .bosshp i{display:block;height:100%;background:linear-gradient(90deg,#ff5c5c,#ffb35c);transition:width .4s}
  .bossname{font-size:12px;color:#ffb3a8;margin-top:2px}
  .choice.form-c{font-size:20px}
  .choice.form-c rt{font-size:.5em}
  /* ===== 見やすさの見直し（2026-11-24、教員の指示「スマホでもパソコンでも、スクロールしなくていいように」） ===== */
  html{background:var(--night1)}
  /* 活用表の問題：表と答えのボタンを左右にならべる（縦に積むとスマホでは画面からはみ出していた） */
  #sPlay.tq .arena{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;align-items:start;
    grid-template-areas:"stage stage" "prompt prompt" "word choices" "extra choices" "tools tools" "fb fb"}
  #sPlay.tq .bstage{grid-area:stage}
  #sPlay.tq #qPrompt{grid-area:prompt}
  #sPlay.tq #qWord{grid-area:word;font-size:26px;margin:0 0 2px}
  #sPlay.tq #qExtra{grid-area:extra}
  #sPlay.tq #qChoices{grid-area:choices;grid-template-columns:1fr;align-self:center;margin-top:0;gap:7px}
  #sPlay.tq #qTools{grid-area:tools}
  #sPlay.tq #qFb{grid-area:fb}
  #sPlay.tq .ktable{margin:0;font-size:14px}
  #sPlay.tq .ktable td,#sPlay.tq .ktable th{padding:2px 7px}
  #sPlay.tq .ktable th{font-size:12px}
  #sPlay.tq .ktable td.form{font-size:17px}
  #sPlay.tq .choice{padding:10px 4px}
  #sPlay.tq .fol-note{grid-column:1/-1;margin:4px 0 0;max-width:none;text-align:left}
  @media (min-width:600px){ #sPlay.tq #qChoices{grid-template-columns:1fr 1fr} }
  /* 戦いの上の段：道具（団子・煙玉）と術を1行にまとめて、舞台と問題を上に寄せる */
  #sPlay .hud2,#sPlay .hud3{display:inline-flex;vertical-align:middle;margin:0 8px 4px 0;min-height:0}
  #sPlay .hud2:empty,#sPlay .hud3:empty{display:none}
  /* 城の任務：スマホで文字がつまらないように、ボタンを小さく */
  #sPanel .qcard .btn{padding:8px 12px;font-size:15px;white-space:nowrap}
  /* 背の低いスマホ（SEなど）：戦いの舞台とボタンを少し小さく */
  @media (max-height:760px){
    .bstage{height:190px}
    .bstage .foe .foe-ic{font-size:52px}
    .bfoe-wrap{top:14px}
    .bfoe-wrap .plat{top:52px}
    .bhero{font-size:58px}
    .bhero img{height:70px}
    .bhero-wrap{bottom:6px;width:80px}
    .choice{padding:10px 6px;font-size:18px}
    .arena{padding:10px 10px}
    .hud{margin-bottom:3px}
    .bar{margin-bottom:5px}
  }
  /* 外（フィールド）：地図・矢印・お知らせが1画面に入るように、地図の大きさを画面の高さに合わせる */
  .fgrid{max-width:min(100%,max(250px,calc((100svh - 330px) * 8 / 12)))}
  .fctrl{margin-top:6px}
  .dpad{height:40px}
  .fmsg{margin:6px 0 4px}
  /* パソコン（横長の画面）：地図の右に、操作とお知らせをならべる */
  @media (min-width:700px) and (min-height:500px){
    #sField.show{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;align-items:start;
      grid-template-areas:"top top" "map ctrl" "map msg" "map goal" "map note";grid-template-rows:auto auto auto auto 1fr}
    #sField > .topbar{grid-area:top}
    #sField > .fgrid{grid-area:map;max-width:none;width:calc((100vh - 120px) * 8 / 12);min-width:300px}
    #sField > .fctrl{grid-area:ctrl;grid-template-columns:1fr;justify-items:center;margin-top:0}
    #sField > .fctrl .fhome{justify-self:center;max-width:none}
    #sField > .fctrl .fctrl-sp{display:none}
    #sField > .fmsg{grid-area:msg}
    #sField > .fgoal{grid-area:goal}
    #sField > .note{grid-area:note;margin-top:4px}
  }
  @media (max-width:480px){
    .ktable{font-size:14px}
    .ktable td,.ktable th{padding:3px 6px}
    .dlg .txt{font-size:16px}
    .stage .actor{font-size:64px}
    .stage .actor img{height:110px}
    .scroll{padding:14px 20px}
    .scroll table{font-size:14px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 村 -->
  <section id="sVillage" class="screen">
    <div class="topbar">
      <button class="iconbtn" onclick="backToApp()">◀ ミニゲーム一覧へ</button>
      <span class="vtitle">変化の里</span>
      <button class="iconbtn" id="muteBtn" onclick="toggleMute()">🔊</button>
    </div>
    <div class="vstatus"><span id="vRank"></span><span id="vPts"></span><span id="vRyo"></span></div>
    <div class="qcard-main" id="vGoal"></div>
    <div class="village" id="village"></div>
    <div class="vmsg" id="vMsg"></div>
  </section>

  <!-- 建物の中（城・店・自宅・寺子屋） -->
  <section id="sPanel" class="screen">
    <div class="topbar"><button class="iconbtn" id="pBack" onclick="panelBack()">◀ 村へ</button><span class="ptitle" id="pTitle"></span><span></span></div>
    <div class="pbody" id="pBody"></div>
  </section>

  <!-- 茶屋の団子づくり -->
  <section id="sDango" class="screen">
    <div class="dghud" id="dgHud"></div>
    <div class="dgshop">
      <div class="dgguest" id="dgGuest"></div>
      <div class="dgskewer" id="dgSkewer"></div>
    </div>
    <div class="dgtray"><div class="dglabel"><span class="dg-p">ピンク</span>：変装（活用語尾）</div><div class="dgballs" id="dgTrayP"></div></div>
    <div class="dgtray"><div class="dglabel"><span class="dg-g">緑</span>：合言葉（後ろに続く言葉）</div><div class="dgballs" id="dgTrayG"></div></div>
    <div class="btn-row"><button class="btn" id="dgServe" onclick="serveDango(false)">🍡 お出しする！</button></div>
    <div class="feedback" id="dgFb"></div>
    <div class="btn-row"><button class="iconbtn" onclick="quitDango()">お店を閉める</button></div>
    <p class="note">刺した団子をタップすると、はずせる。</p>
  </section>

  <!-- 外（フィールド） -->
  <section id="sField" class="screen">
    <div class="topbar">
      <button class="iconbtn" onclick="FIELD = null; SAVE.here = 'gate'; saveSave(SAVE); showVillage()">⛩️ 里へ帰る</button>
      <span class="ptitle"><span id="fName"></span><small id="fLv" class="flv"></small></span>
      <span class="fryo" id="fRyo"></span>
    </div>
    <div class="fgrid" id="fGrid"></div>
    <!-- 操作（地図のすぐ下）：矢印と、装備・ステータス。2026-11-23、教員の指示で、情報は下にまとめた -->
    <div class="fctrl">
      <button class="iconbtn fhome" id="fHomeBtn" onclick="openHomeHere()">🎒 装備・ステータス</button>
      <div class="fpad">
        <button class="iconbtn dpad" data-dx="0" data-dy="-1">▲</button>
        <div><button class="iconbtn dpad" data-dx="-1" data-dy="0">◀</button><button class="iconbtn dpad" data-dx="1" data-dy="0">▶</button></div>
        <button class="iconbtn dpad" data-dx="0" data-dy="1">▼</button>
      </div>
      <span class="fctrl-sp"></span>
    </div>
    <!-- 情報 -->
    <div class="fmsg" id="fMsg"></div>
    <div class="qcard-main fgoal" id="fGoal"></div>
    <p class="note">矢印（押し続けると歩き続ける）か、行きたいマスをタップ。🌿草むらでは野良忍者が出る！</p>
  </section>

  <!-- エンディング -->
  <section id="sEnding" class="screen"><div class="ending" id="endBody"></div></section>

  <!-- 小窓 -->
  <div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>

  <!-- 物語 -->
  <section id="sStory" class="screen">
    <div class="stage" id="stage">
      <button class="iconbtn skip" onclick="storySkip()">とばす ▶▶</button>
      <div class="actor left" id="actL"></div>
      <div class="actor right" id="actR"></div>
    </div>
    <div class="dlg" id="dlg" onclick="storyNext()">
      <div class="who" id="dlgWho"></div>
      <div class="txt" id="dlgTxt"></div>
      <div class="next">▼ タップで次へ</div>
    </div>
  </section>

  <!-- 巻物（まとめ） -->
  <section id="sLesson" class="screen">
    <div class="scroll" id="lessonBody"></div>
    <div class="btn-row"><button class="btn" id="lessonBtn" onclick="lessonGo()">任務を始める</button><button class="btn sub" id="lessonSkip" style="display:none">説明をとばす ▶▶</button></div>
  </section>

  <!-- 修行 -->
  <section id="sPlay" class="screen">
    <div class="hud" id="sPlayHud">
      <span id="hudName"></span>
      <span class="combo" id="hudCombo"></span>
    </div>
    <div class="hud2"><span id="hudItems"></span></div>
    <div class="hud3" id="hudJutsu"></div>
    <div class="bar timer"><i id="qTimer"></i></div>
    <div class="arena">
      <div class="bstage" id="bStage">
        <div class="ebox" id="eBox"></div>
        <div class="bfoe-wrap"><div class="plat"></div><div class="foe" id="foe"></div></div>
        <div class="bhero-wrap"><div class="plat"></div><div class="bhero" id="bHero"></div></div>
        <div class="pbox" id="pBox"></div>
      </div>
      <div class="prompt" id="qPrompt"></div>
      <div class="qword" id="qWord"></div>
      <div id="qExtra"></div>
      <div class="choices" id="qChoices"></div>
      <div class="tools" id="qTools"></div>
      <div class="feedback" id="qFb"></div>
    </div>
    <div class="btn-row"><button class="iconbtn" id="quitBtn" onclick="quitPlay()">任務をやめる</button></div>
  </section>

  <!-- 結果 -->
  <section id="sResult" class="screen">
    <div class="result" id="resultBody"></div>
  </section>
</div>
<div class="flash" id="flash"></div>
<div class="fx-tint" id="fxTint"></div>
<canvas class="fxcanvas" id="fxCanvas"></canvas>
<div class="jutsu-fx" id="jutsuFx"></div>
<div class="special-fx" id="specialFx"></div>
<div class="end-white" id="endWhite"></div>

<script>
/* =====================================================================
   絵（教員が用意したらここにdata URLを入れる。空なら絵文字で代用）
   ===================================================================== */
const NP_IMG = {
  hero:    "",   // 主人公（見習い忍者）
  shisho:  "",   // 師匠・変化斎
  sekka:   "",   // 敵の頭領・石化丸
  minion:  "",   // 石化丸の手下（修行の相手）
  fake:    "",   // 偽忍者（三の章の相手）
  bg:      "",   // 物語の背景（夜の忍びの里）
};
const NP_EMOJI = {hero:"🥷", shisho:"👴", sekka:"🗿", minion:"👤", fake:"🎭", word:"📜", deshi:"🎩", ikoku:"🧙", kage:"👤", okina:"🧓", ouna:"👵", kaede:"👩", nushi:"😈"};
function pic(key){
  const src = NP_IMG[key];
  return src ? `<img src="${src}" alt="">` : (NP_EMOJI[key] || "");
}

/* =====================================================================
   小道具
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const pick = a => a[Math.floor(Math.random()*a.length)];
function show(id){ document.querySelectorAll(".screen").forEach(s => s.classList.toggle("show", s.id === id)); window.scrollTo(0,0); }
function backToApp(){ mgFlush(); location.href = "kokugo_app.html?from=minigame"; }
function flash(text, color){
  const el = $("flash"); el.textContent = text; el.style.color = color || "#fff";
  el.classList.remove("go"); void el.offsetWidth; el.classList.add("go");
}

/* =====================================================================
   記録
   ===================================================================== */
const NP_LSKEY = "katsuyo_ninpou_v1";
function loadSave(){ try{ const o = JSON.parse(localStorage.getItem(NP_LSKEY)); return o && typeof o === "object" ? o : {}; }catch(e){ return {}; } }
function saveSave(s){ try{ localStorage.setItem(NP_LSKEY, JSON.stringify(s)); }catch(e){} }
let SAVE = loadSave();
// 旧「真剣勝負」の品（2026-11-23に削除）が残っていたら片づける
if(SAVE.inv) delete SAVE.inv.rin_kanzashi;
if(SAVE.got) delete SAVE.got.rin_kanzashi;
if(SAVE.equip) Object.keys(SAVE.equip).forEach(k => { if(SAVE.equip[k] === "rin_kanzashi") delete SAVE.equip[k]; });
if(!SAVE.stars) SAVE.stars = {};     // 章id → 最高の星の数（0〜3）
if(!SAVE.seen) SAVE.seen = {};       // 章id → 物語を一度見たか

/* =====================================================================
   本体（kokugo_app.html）のジャンルレベルへの反映
   2026-11-23、教員の指示で数え方を変えた：「1問正解するごとに、ジャンルレベルが1つずつ上がる」（まちがえても下がらない）。
   ===================================================================== */
const MG_CAT = "doushi_katsuyo", MG_GENRE = "動詞の活用";
const MG_PENDING_LVUP_LSKEY = "kokugo_minigame_pending_lvups_v1";
const MG_PLAYED_LSKEY = "kokugo_mg_played_v1";
let MGS = null;
const mgNet = () => !MGS ? 0 : MGS.ok;
const mgSigned = n => n > 0 ? "+" + n : n < 0 ? "−" + (-n) : "±0";
function mgStart(){ mgFlush(); MGS = {ok:0, ng:0, sent:0}; }
function mgNotePlayed(){
  try{ const d = new Date(); localStorage.setItem(MG_PLAYED_LSKEY, d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0")); }catch(e){}
}
function mgWritePending(n){
  if(!n) return;
  let o = {};
  try{ o = JSON.parse(localStorage.getItem(MG_PENDING_LVUP_LSKEY)) || {}; }catch(e){ o = {}; }
  if(!o || typeof o !== "object") o = {};
  o[MG_CAT] = (Number(o[MG_CAT]) || 0) + n;
  try{ localStorage.setItem(MG_PENDING_LVUP_LSKEY, JSON.stringify(o)); }catch(e){}
}
function mgSyncUp(){ if(!MGS) return; const n = mgNet(); if(n > MGS.sent){ mgWritePending(n - MGS.sent); MGS.sent = n; } }
function mgFlush(){
  if(!MGS) return null;
  const r = {ok:MGS.ok, ng:MGS.ng, net:mgNet()};
  const sent = MGS.sent; MGS = null;
  mgWritePending(r.net - sent);
  return r;
}
function mgCorrect(){ if(!MGS) return; const b = mgNet(); MGS.ok++; const a = mgNet(); if(a !== b) showLvupToast(a - b); mgNotePlayed(); mgSyncUp(); }
function mgWrong(){ if(!MGS) return; const b = mgNet(); MGS.ng++; const a = mgNet(); if(a !== b) showLvupToast(a - b); mgNotePlayed(); }
window.addEventListener("pagehide", mgFlush);
function showLvupToast(d){
  let el = $("lvupToast");
  if(!el){ el = document.createElement("div"); el.id = "lvupToast"; el.className = "lvup-toast"; document.body.appendChild(el); }
  el.innerHTML = `📘 ${MG_GENRE} Lv<b>+1</b>（今回 ${mgSigned(mgNet())}）`;   // 毎問出るので、画面の下に小さく
  el.classList.toggle("down", d < 0);
  el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
}

/* =====================================================================
   効果音
   ===================================================================== */
let actx = null, muted = false;
try{ muted = localStorage.getItem(NP_LSKEY + "_mute") === "1"; }catch(e){}
function updateMuteBtn(){ $("muteBtn").textContent = muted ? "🔇" : "🔊"; }
function toggleMute(){ muted = !muted; try{ localStorage.setItem(NP_LSKEY + "_mute", muted ? "1" : "0"); }catch(e){} updateMuteBtn(); }
function tone(freq, dur, type, vol, when){
  if(muted) return;
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + (when || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + .02);
  }catch(e){}
}
const sfx = {
  ok(){ tone(880,.09,"square",.07); tone(1320,.14,"square",.07,.08); },
  ng(){ tone(220,.25,"sawtooth",.07); },
  smoke(){ tone(300,.3,"triangle",.06); tone(180,.3,"triangle",.05,.05); },
  clear(){ [523,659,784,1046].forEach((f,i) => tone(f,.18,"square",.07,i*.12)); },
  tap(){ tone(660,.04,"square",.04); },
};

/* =====================================================================
   動詞と活用の規則
   t: godan / kami / shimo / ka / sa
   r: 漢字の読み（ふりがな用。同じかなで別の動詞があるものには必ず付ける）
   y: 一段で、語幹の最後が漢字1字のとき、その音（「ない」の直前の音）

// 四の章の選択肢：その動詞のほかの形と、ありがちなまちがい
function tableChoices(v, f){
  const ans = conj(v, f), set = new Set();
  TABLE_ROWS.forEach(([g]) => set.add(conj(v, g)));
  if(v.t === "godan"){
    const stem = v.w.slice(0, -1);
    [...ROW[v.w.slice(-1)]].forEach(c => set.add(stem + c));
    if(f === "onbin") ["っ","ん","い"].forEach(c => set.add(stem + c));
  }
  if(v.t === "kami" || v.t === "shimo"){ const base = v.w.slice(0, -1); if(f === "katei" || f === "meirei") set.add(base + "け"); }
  set.delete(ans);
  return shuffle([ans, ...shuffle([...set]).slice(0, 3)]);
}

function rubyHtml(v, text){

/* 活用形を作る。返り値は文字列（カ変は「来」に読みを付けて返す）。
   form: mizen（ない） / mizenU（よう・五段は う） / onbin（た） / renyo（ます） / shushi / rentai / katei / meirei */
function conj(v, form){
  if(v.t === "godan"){
    const stem = v.w.slice(0, -1), last = v.w.slice(-1), row = ROW[last];
    switch(form){
      case "mizen":  return stem + row[0];
      case "mizenU": return stem + row[4];
      case "renyo":  return stem + row[1];
      case "onbin":  return stem + (v.iku ? "っ" : ONBIN[last]);
      case "shushi": case "rentai": return v.w;
      case "katei": case "meirei": return stem + row[3];
    }
  }
  if(v.t === "kami" || v.t === "shimo"){
    const base = v.w.slice(0, -1);
    switch(form){
      case "mizen": case "mizenU": case "renyo": case "onbin": return base;
      case "shushi": case "rentai": return v.w;
      case "katei": return base + "れ";
      case "meirei": return base + "ろ";
    }
  }
  if(v.t === "ka"){
    return {mizen:"来(こ)", mizenU:"来(こ)", renyo:"来(き)", onbin:"来(き)", shushi:"来る(くる)", rentai:"来る(くる)", katei:"来れ(くれ)", meirei:"来い(こい)"}[form];
  }
  if(v.t === "sa"){
    const pre = v.w.slice(0, -2);
    return pre + {mizen:"し", mizenU:"し", renyo:"し", onbin:"し", shushi:"する", rentai:"する", katei:"すれ", meirei:"しろ"}[form];
  }
}
// 「来(こ)」→ ルビ付きhtml
function formHtml(v, s){
  const m = s.match(/^(.+?)\((.+)\)$/);
  if(m){ // カ変：「来(こ)」「来る(くる)」「来い(こい)」
    const kanji = m[1][0], okuri = m[1].slice(1), yomi = m[2];
    return `<ruby>${kanji}<rt>${esc(yomi.slice(0, yomi.length - okuri.length))}</rt></ruby>${esc(okuri)}`;
  }
  // ふりがなが必要な動詞は、活用しても漢字の読みは同じ
  return rubyHtml(v, s);

const BASE_FOL = {mizen:"ない", mizenU:"よう", onbin:"た", renyo:"ます", shushi:"。", rentai:"とき", katei:"ば", meirei:"！"};
function followOf(v, form){
  if(form === "mizenU") return (v.t === "godan") ? "う" : "よう";
  if(form === "onbin") return (v.t === "godan" && !v.iku && "ぐぬぶむ".includes(v.w.slice(-1))) ? "だ" : "た";
  return {mizen:"ない", renyo:"ます", shushi:"。", rentai:"とき", katei:"ば", meirei:"！"}[form];
}
/* 活用表の合言葉の欄（2026-11-24、教員の指示「未然に『よう』とだけあると『う』の場合が、連用の『た』には『だ』の場合があることが
   わからない人がいるかも」）。「よう／う」「た／だ」と両方を書き、この言葉に合うほうを太く、もう一方を薄く出す。
   「？」がその行のときは、表の下に一言そえる（答えは出さない）。 */
function tableFolHtml(v, f, fol){
  const pair = f === "mizenU" ? ["よう", "う"] : f === "onbin" ? ["た", "だ"] : null;
  if(!pair) return fol;
  const use = followOf(v, f);
  return pair.map(x => x === use ? `<b class="fol-on">${x}</b>` : `<span class="fol-off">${x}</span>`).join("／");
}
function tableFolNote(v, f){
  if(f === "mizenU") return `<div class="fol-note">💡 「よう」のなかまの「う」：五段は「う」（書こ<b>う</b>）、ほかは「よう」（起き<b>よう</b>）</div>`;

  return "";
}
const FORM_NAME = {mizen:"未然形", mizenU:"未然形", renyo:"連用形", onbin:"連用形", shushi:"終止形", rentai:"連体形", katei:"仮定形", meirei:"命令形"};

function naiInfo(v){
  if(v.t === "ka") return {stemHtml:`<ruby>来<rt>こ</rt></ruby>`, sound:"こ", dan:"オ"};
  if(v.t === "sa"){ const pre = v.w.slice(0, -2); return {stemHtml:esc(pre) + `<span class="sound">し</span>`, sound:"し", dan:"イ"}; }
  const m = conj(v, "mizen");
  let sound = m.slice(-1), html;
  if(v.y){ sound = v.y; html = `<span class="sound"><ruby>${esc(m)}<rt>${esc(v.y)}</rt></ruby></span>`; }
  else if(v.r && /[一-鿿]/.test(m.slice(-1))){ sound = v.r.slice(-1); html = `<span class="sound">${rubyHtml(v, m)}</span>`; }
  else html = rubyHtml(v, m.slice(0, -1)) + `<span class="sound">${esc(sound)}</span>`;
  return {stemHtml:html, sound, dan:DAN[sound] || "?"};
}
function typeExplain(v){

  const ruby = rubyHtml(v);

  }
  return s;
}

/* 忍者Lv（ゲームの中だけ）。経験値 SAVE.xp。次のLvまで 20＋(Lv−1)×10。 */
const PTS_PER_LV = 4;   // ステータスが5つになったので4（2026-11-23）
const xpForNext = lv => 20 + (lv - 1) * 10;
function lvFromXp(total){
  let xp = total, lv = 1;
  while(xp >= xpForNext(lv) && lv < 99){ xp -= xpForNext(lv); lv++; }
  return {lv, xpIn:xp, xpNeed:xpForNext(lv)};
}
function ninjaInfo(){
  const L = lvFromXp(SAVE.xp || 0);
  return {lv:L.lv, xpIn:L.xpIn, xpNeed:L.xpNeed, points:(L.lv - 1) * PTS_PER_LV, rank:rankOf(L.lv)};
}
/* 戦いの経験値（2026-11-23、教員の指示：「正解したときに経験値を獲得。ただし倒し切ったときに一気に上がるように」）
   正解するたびに「獲得予定」として p.xpGot にためる（画面に＋EXPが出る）。倒したときに、勝利のボーナスと合わせて一気に入る。
   負けた・逃げられたときは、ためた分の半分だけ入る。結果画面では、経験値のバーがのびていく演出をする。 */
function awardXp(gained){
  const before = SAVE.xp || 0;
  gainXp(gained);
  return {before, gained};
}
function xpResultHtml(a, note){
  const L = lvFromXp(a.before);
  return `<div class="xpbox"><div class="xpgain">✨ 経験値 <b>+${a.gained}</b>${note ? `<small>${note}</small>` : ""}</div>
    <div class="xpline"><span class="xplv" id="xpLv">Lv${L.lv}</span><span class="xpbar2"><i id="xpFill" style="width:${L.xpIn / L.xpNeed * 100}%"></i></span></div>
    <div class="xpup" id="xpUp"></div></div>`;
}
async function animateXp(a){
  const start = a.before, end = a.before + a.gained, steps = 40;
  let lastLv = lvFromXp(start).lv, ups = 0;
  await sleep(400);
  for(let i = 1; i <= steps; i++){
    if(!$("xpFill")) return;
    const cur = Math.round(start + (end - start) * i / steps), L = lvFromXp(cur);
    $("xpFill").style.width = (L.xpIn / L.xpNeed * 100) + "%";
    $("xpLv").textContent = "Lv" + L.lv;
    if(L.lv > lastLv){
      ups += L.lv - lastLv; lastLv = L.lv;
      $("xpUp").innerHTML = `<span class="lvflash">⬆️ LEVEL UP！ 忍者Lv${L.lv}（忍術ポイント＋${ups * PTS_PER_LV}）</span>`;
      [660, 880, 1320].forEach((f, k) => tone(f, .12, "square", .06, k * .08));
    }else if(i % 4 === 0) tone(500 + i * 15, .03, "square", .025);
    await sleep(30);
  }
}
function gainXp(n){
  if(!n) return;
  const before = ninjaInfo().lv;
  SAVE.xp = (SAVE.xp || 0) + n; saveSave(SAVE);
  const after = ninjaInfo().lv;
  if(after > before){
    let el = $("ninjaToast");
    if(!el){ el = document.createElement("div"); el.id = "ninjaToast"; el.className = "lvup-toast ninja"; document.body.appendChild(el); }
    el.innerHTML = `🥷 忍者Lv <b>${after}</b> にアップ！ 忍術ポイント＋${(after - before) * PTS_PER_LV}`;
    el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
    [660, 880, 1320].forEach((f, i) => tone(f, .12, "square", .06, i * .1));
  }
}

const ELEM = {
  fire: {name:"火", icon:"🔥", beats:"wood"},

function affinity(a, d){ if(!a || !d) return 1; if(ELEM[a].beats === d) return 2; if(ELEM[d].beats === a) return .5; return 1; }
/* ふつうの攻撃・守りにも、少しだけ相性（2026-11-23、教員の指示）。術よりひかえめに ±15%。
   自分の得意属性が相手に強い → こちらの攻撃×1.15・受けるダメージ×0.85。弱い → 攻撃×0.85・受けるダメージ×1.15。 */
/* 得意属性のボーナス（2026-11-24、教員の指示「得意属性をつけると、ふつうの攻撃力が少し高くなるように」）。
   得意属性（火・水・木のどれか）をつけていれば、相性に関係なく、ふつうの攻撃×1.1。「なし」だと×1。 */
const ELEM_ATK = 1.1;
const elemAtkMul = e => e ? ELEM_ATK : 1;
const atkShown = b => `攻撃力 <b>${Math.round(b.atk * elemAtkMul(SAVE.elem))}</b>${SAVE.elem ? `<small>（得意属性×${ELEM_ATK}）</small>` : ""}`;
const normalAff = (myElem, foeElem) => { const a = affinity(myElem, foeElem); return a > 1 ? 1.15 : a < 1 ? .85 : 1; };
const defAffinity = (foeElem, myElem) => { const a = affinity(foeElem, myElem); return a > 1 ? 1.5 : a < 1 ? .6 : 1; };

/* =====================================================================
   ダメージの計算（2026-11-23、教員の指摘「攻撃力だけ高めれば、余裕で勝てる」への対応）
   原因：①敵はこちらがまちがえたときしか攻撃しなかった（正解し続ければ体力・守りは不要）
        ②攻撃を上げただけダメージが青天井に伸び、敵に守りもなかった（1〜2問で倒せた）
        ③守りは「敵の攻撃から引く」だけで、すぐ被ダメージ1に張りついた
        ④装備のステータスが振り分けより大きすぎた
   対策：①敵は「every」問ごとに必ず攻撃する（多くは毎問）。まちがい・時間切れはその場で1.5倍の反撃。
        ②与ダメージ＝攻撃−敵の守り（最低でも2割は通る）。1回の攻撃は敵の最大HPの15%（会心20%）まで
          → どんなに攻撃を上げても、最低7問は答えないと倒せない。その間に受けるダメージに耐える体力・守りが要る。
        ⑤敵の攻撃力は、シミュレーション（正答率85%）で「均等に振ると約9割勝てる・1つだけに振ると中忍以上でほぼ勝てない」
          ように決めた。本任務の敵は、正答率65%でも約9割勝てるやさしさにしてある。
        ⑥（2026-11-23、結界と属性を追加）属性のある敵は3回に1回（結界の敵は2回に1回）術で攻撃し、それは「結界」で減らす。
          「鎧」の敵は守りが固く（ふつうの攻撃は1割しか通らない）→ 忍術に振った忍者が有利（シミュレーションで約9割 対 3〜6割）。
          「結界」の敵は結界が固い → 術がほぼ効かず、ふつうの攻撃と、相手の術を防ぐ結界が大事。
        ③受けるダメージ＝敵の攻撃×40÷(40＋守り×3)。上げるほど効くが、ゼロにはならない。
        ④装備の値を小さくした（TIER_VAL）。忍術（術）は敵の守りを無視するので、守りの固い敵に強い。
   ===================================================================== */
// 術のダメージ：威力×相性−敵の結界（最低1割）。1回で最大HPの30%（相性が良ければ45%）まで
function jutsuHit(power, aff, foe){
  const raw = Math.round(power * aff);
  const d = Math.max(Math.ceil(raw * .1), raw - (foe.res || 0));
  if(noCap(foe)) return Math.max(1, d);
  return Math.max(1, Math.min(d, Math.ceil(foe.max * (aff > 1 ? .45 : .3) * (foe.makyo ? MAKYO_CAP : 1))));
}
/* 連続正解（2026-11-23、教員の指示：「連続で正解している場合は、徐々に攻撃力を高められるように」）
   STREAK はその戦いの中だけで数える（戦いが始まるたびに0。2026-11-23、教員の指示で「戦いをまたがない」に変更）。
   まちがえる（時間切れをふくむ）と0にもどる。
   攻撃力は 1連続ごとに＋10%（最大×2.0＝11連続）。1回で与えられるダメージの上限も、1連続ごとに＋2%（15%→最大35%）。
   → よく正解する人ほど早く倒せ、経験値も早くたまる。 */
let STREAK = 0;
const streakMul = () => 1 + Math.min(Math.max(STREAK - 1, 0), 10) * .1;
const streakCap = () => .15 + Math.min(Math.max(STREAK - 1, 0), 10) * .02;
/* 早さのボーナス（2026-11-23、教員の指示：「早く答えれば答えるほど攻撃力が高くなるように」）
   問題が出てから答えるまで 2秒以内×1.5、4秒以内×1.3、6秒以内×1.15。1回の上限も少し上がる（最大＋5%）。 */
const speedMul = sec => sec <= 2 ? 1.5 : sec <= 4 ? 1.3 : sec <= 6 ? 1.15 : 1;
/* 格下の野良忍者（自分よりLvが低い）には、1回のダメージの上限をかけない（2026-11-23、教員の指示）。
   攻撃力が十分なら1発で倒せる＝強くなった手ごたえ。最前線の相手・ボス・任務・道場には、今までどおり上限がある。 */
function noCap(foe){ return !!PLAY && PLAY.cfg.mode === "wild" && foe.lv != null && foe.lv < ninjaInfo().lv; }
function hitDamage(raw, foe, crit, extraCap){
  const d = Math.max(Math.ceil(raw * .1), raw - (foe.def || 0));   // 守りの固い敵には、最低1割しか通らない
  if(noCap(foe)) return Math.max(1, d);
  return Math.max(1, Math.min(d, Math.ceil(foe.max * (streakCap() + (crit ? .05 : 0) + (extraCap || 0)) * (foe.makyo ? MAKYO_CAP : 1))));
}

const takenPct = def => Math.round(4000 / (40 + def * 3));
/* 装備できるかどうかと、足りないもの（2026-11-23、教員の指示：「萬屋では、装備できるかできないかはっきり書き、
   ステータスが後どれくらいで装備できるかも示して」）。足りない条件をすべて返す。 */
function equipCheck(it){
  const ni = ninjaInfo(), s = statTotals(), lacks = [];
  if(ni.lv < it.req.lv){
    let xp = 0; for(let l = ni.lv; l < it.req.lv; l++) xp += xpForNext(l);
    xp -= ni.xpIn;
    lacks.push({kind:"lv", text:`忍者Lv あと${it.req.lv - ni.lv}（Lv${it.req.lv}が必要・今Lv${ni.lv}／経験値あと${xp}）`});
  }
  if(it.req.stat){
    // 着けかえる前の自分のステータス（その部位の装備ぶんは引く）で判定
    for(const [k, v] of Object.entries(it.req.stat)){
      const cur = s[k] - (EQUIP[SAVE.equip[it.slot]] ? (EQUIP[SAVE.equip[it.slot]].st[k] || 0) : 0);

    }
  }
  return {ok:!lacks.length, lacks};
}

function questFoe(o){
  const t = QTYPES.find(x => x.ch === o.ch);
  const R = Object.assign({elem:t.elem}, t.trait ? TRAITS[t.trait].f(QRANK[o.rank]) : QRANK[o.rank]);
  return {t, R};
}
const foeStatText = R => `${elemTag(R.elem)} HP${R.hp}・攻撃${R.atk}・守り${R.def}・結界${R.res || 0}・${R.every === 1 ? "毎問" : R.every + "問ごと"}に攻撃`;
function nextStory(){ return STORY_ORDER.find(id => !chCleared(id)) || null; }
// 序の章を終えるまでは、任務は出ない
function availableQTypes(){ return QTYPES.filter(q => chCleared(q.ch)); }
// 提案する任務を3つにそろえる（今の段位とその1つ下が中心。ときどき1つ上の「腕試し」も出す）
function fillOffers(){
  const types = availableQTypes();
  if(!types.length){ SAVE.offers = []; return; }
  const ri = rankIdx(ninjaInfo().rank.id);
  SAVE.offers = SAVE.offers.filter(o => types.some(t => t.ch === o.ch));
  while(SAVE.offers.length < 3){
    const r = Math.random();
    const k = Math.max(0, Math.min(RANKS.length - 1, r < .15 ? ri + 1 : r < .45 ? ri - 1 : ri));
    SAVE.offers.push({ch:pick(types).ch, rank:RANKS[k].id, key:Math.random().toString(36).slice(2, 8)});
  }
  saveSave(SAVE);
}
function showCastle(){
  fillOffers();
  const ni = ninjaInfo(), ns = nextStory();
  let html = `<div class="npc-line"><span class="npc">🧔</span><div>任務所の役人「${ns === "jo" ? "おお、見習いか。まずは寺子屋で師匠の話を聞いてくるのじゃ。任務はそれからじゃ。" : "里の仕事を手伝ってくれる忍を待っておった。腕に合った任務を選ぶがよい。両や装備がもらえるぞ。"}」</div></div>
    <h3 class="sec">⚔️ 任務（腕をみがき、両や装備をかせぐ）</h3>`;

  SAVE.offers.forEach((o, k) => {

    html += `<div class="qcard${ok ? "" : " locked"}">

function acceptQuest(k){
  const o = SAVE.offers[k]; if(!o) return;
  const {t, R} = questFoe(o);
  const ch = CHAPTERS[chIndex(o.ch)];
  const cfg = {mode:"quest", ch, offer:o, foe:{icon:t.icon, name:t.foe, hp:R.hp, atk:R.atk, def:R.def, res:R.res, elem:R.elem, jEvery:R.jEvery, every:R.every}, time:R.time, ryo:R.ryo, xp:R.xp, rank:o.rank};

let SHOP_TAB = "eq";
function dailySeed(){ const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function seededPick(arr, n, seed){
  const a = arr.slice(); let s = seed;
  for(let i = a.length - 1; i > 0; i--){ s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, n);
}
/* 品ぞろえ（2026-11-23、教員の指示：「売っているものが多すぎる。その時に必要な物を。少し上はよいが、低すぎる物は売らない」）
   今の段位の品（いちばん上の段階＝今の忍者Lvで着られる段階）から6つ、1つ上の段階から3つを、日替わりで並べる。
   それより下の段階は並べない。持っている物も並べない。伝説の段階と、道場・出会いでしか手に入らない物は売らない。 */
function curTier(){ const lv = ninjaInfo().lv; let t = 0; TIER.forEach((x, i) => { if(lv >= x.lv) t = i; }); return t; }
/* 2026-11-23、教員の指摘「ズボンを持っていないが、店にも売っていない。レベルは十分ある」への対応：
   ・店で売るのは上忍の段階まで。忍者Lvが伝説の段階でも、上忍の品を並べる（以前は、伝説の段階になると品が0になっていた）。
   ・持っていない部位、または今の段階より下の物しか持っていない部位の品は、必ず並べる（以前は日替わりで6つだけ選んでいた）。 */
function shopTier(){ return Math.min(curTier(), 3); }
function slotNeedsGear(slot, t){
  const best = Math.max(-1, ...Object.keys(SAVE.inv).map(id => EQUIP[id]).filter(it => it && it.slot === slot).map(it => it.tier));
  return best < t;
}
function shopStock(){
  const t = shopTier(), seed = dailySeed() * 7 + t;
  const sellable = it => it.tier <= 3 && it.src.includes("shop") && !SAVE.inv[it.id];
  const cur = Object.values(EQUIP).filter(it => it.tier === t && sellable(it));
  const need = cur.filter(it => it.slot !== "acc" && slotNeedsGear(it.slot, t));
  const rest = seededPick(cur.filter(it => !need.includes(it)), Math.max(0, 6 - need.length), seed);
  const up = t + 1 <= 3 ? seededPick(Object.values(EQUIP).filter(it => it.tier === t + 1 && sellable(it)), 3, seed + 1) : [];
  return need.concat(rest, up);
}
const priceOf = it => EQ_VALUE[it.tier];
/* 安売り（2026-11-23、教員の指示：「下位装備を図鑑に登録できるように、買えるようにする」）
   今の段位より下の段階の、店の品（持っていない物）を、半額で並べる。売るときも半額なので、もうけは出ない。 */
const salePrice = it => Math.floor(EQ_VALUE[it.tier] / 2);
function saleStock(){
  const t = shopTier();
  return Object.values(EQUIP).filter(it => it.tier < t && it.src.includes("shop") && !SAVE.inv[it.id])
    .sort((a, b) => a.tier - b.tier || SLOTS.findIndex(s => slotKind(s.id) === a.slot) - SLOTS.findIndex(s => slotKind(s.id) === b.slot));
}
function showShop(tab){
  if(tab) SHOP_TAB = tab;
  const t = shopTier();
  const talk = SHOP_TAB === "sale" ? "下の段階の品を、半額で出してるよ。図鑑をうめたい人向けだね。" : SHOP_TAB === "eq" ? `今の${TIER[t].name}向けの品と、少し上の品をそろえてるよ。品は毎日入れかわるからね。`
    : SHOP_TAB === "bag" ? "任務の前には団子と煙玉を忘れずにね。" : "いらない物は買い取るよ。ただし、買った値段の半分だけどね。";
  let html = `<div class="npc-line"><span class="npc">👩‍🦳</span><div>萬屋のおかみ「いらっしゃい！ ${talk}」</div></div>
    <div class="tabs"><button class="${SHOP_TAB === "eq" || SHOP_TAB === "sale" ? "on" : ""}" onclick="showShop('eq')">装備</button><button class="${SHOP_TAB === "bag" ? "on" : ""}" onclick="showShop('bag')">道具</button><button class="${SHOP_TAB === "sell" ? "on" : ""}" onclick="showShop('sell')">売る</button>
    <span class="purse">💰 ${SAVE.ryo}両</span></div>`;
  if(SHOP_TAB === "sale"){
    const list = saleStock();
    html += `<div class="btn-row" style="margin:4px 0 8px"><button class="iconbtn dark" onclick="showShop('eq')">◀ ふつうの品にもどる</button></div>
      <p class="note-dark">🏷️ 安売り：今より下の段階の品が<b>半額</b>。買うと装備図鑑に登録される（売るときも半額）。</p>`;
    if(!list.length) html += `<p class="note-dark">安売りの品は、もう全部持っているようだね。</p>`;
    html += list.map(it => {
      const price = salePrice(it), newDex = !(SAVE.got && SAVE.got[it.id]);
      return `<div class="eqrow">${itemChip(it, newDex ? `<span class="rare lack">図鑑に未登録</span>` : "")}
        <div class="eqst">${esc(SLOTS.find(s => slotKind(s.id) === it.slot).name.replace(/①|②/, ""))}｜${stText(it)}</div>
        <button class="btn mini" ${SAVE.ryo < price ? "disabled" : ""} onclick="buyEq('${it.id}',1)"><s style="opacity:.6;font-size:11px">${priceOf(it)}</s> ${price}両</button></div>`;
    }).join("");
  }else if(SHOP_TAB === "eq"){
    const list = shopStock();
    if(t > 0) html += `<div class="btn-row" style="margin:4px 0 8px"><button class="iconbtn dark" onclick="showShop('sale')">🏷️ 安売りの商品を見る${saleStock().length ? `（${saleStock().length}）` : ""}</button></div>`;
    if(!list.length) html += `<p class="note-dark">今日の品はもう全部持っているようだね。また明日おいで。</p>`;
    html += list.map(it => {
      const price = priceOf(it), up = it.tier > t, lack = !up && it.slot !== "acc" && slotNeedsGear(it.slot, t);
      return `<div class="eqrow">${itemChip(it, up ? `<span class="rare">少し上の品</span>` : lack ? `<span class="rare lack">${SAVE.inv && Object.keys(SAVE.inv).some(id => EQUIP[id] && EQUIP[id].slot === it.slot) ? "⬆今より上" : "未所持"}</span>` : "")}
        <div class="eqst">${esc(SLOTS.find(s => slotKind(s.id) === it.slot).name.replace(/①|②/, ""))}｜${stText(it)}<br>条件：忍者Lv${it.req.lv}〜${it.req.stat ? "・" + Object.entries(it.req.stat).map(([k, v]) => `${STATS.find(x => x.id === k).name}${v}以上`).join("・") : ""}${equipBadge(it)}</div>
        <button class="btn mini" ${SAVE.ryo < price ? "disabled" : ""} onclick="buyEq('${it.id}')">${price}両</button></div>`;
    }).join("");
  }else if(SHOP_TAB === "bag"){
    html += Object.entries(BAG).map(([id, b]) => `<div class="eqrow"><span class="eqicon">${b.icon}</span><span class="eqname">${b.name}<small>持っている：${SAVE.bag[id] || 0}</small></span>
      <div class="eqst">${b.note}</div><button class="btn mini" ${SAVE.ryo < b.price ? "disabled" : ""} onclick="buyBag('${id}')">${b.price}両</button></div>`).join("");
  }else{
    const equipped = new Set(Object.values(SAVE.equip));
    const owned = Object.keys(SAVE.inv).map(id => EQUIP[id]).filter(Boolean).sort((a, b) => a.tier - b.tier);
    html += `<p class="note-dark">売ると、買った値段の半分になる。売った物も、装備図鑑には残る。</p>`;
    html += owned.map(it => `<div class="eqrow">${itemChip(it, higherOwned(it.slot, it.tier, it.id) ? `<span class="upbubble inl">⬆ 上位装備所持</span>` : "")}<div class="eqst">${stText(it)}</div>
      ${equipped.has(it.id) ? `<span class="owned">装備中は売れない</span>` : `<button class="btn mini sell" onclick="sellEq('${it.id}')">${sellPriceEq(it)}両で売る</button>`}</div>`).join("") || `<p class="note-dark">売れる装備がない。</p>`;
    html += Object.entries(BAG).map(([id, b]) => `<div class="eqrow"><span class="eqicon">${b.icon}</span><span class="eqname">${b.name}<small>持っている：${SAVE.bag[id] || 0}</small></span>
      <div class="eqst">1つ${Math.floor(b.price / 2)}両</div><button class="btn mini sell" ${(SAVE.bag[id] || 0) ? "" : "disabled"} onclick="sellBag('${id}')">売る</button></div>`).join("");
  }
  panel("🏮 萬屋", `<div class="noren-head"><span>萬</span><span>屋</span></div>` + html);
  $("pBody").classList.add("shopwood");
}
function sellEq(id){
  const it = EQUIP[id]; if(!it || !SAVE.inv[id] || Object.values(SAVE.equip).includes(id)) return;
  const g = sellPriceEq(it);
  modal(`<div class="big">${it.icon}</div><h3>${esc(it.name)}を売る？</h3><p>${g}両で売る（買った値段${EQ_VALUE[it.tier]}両の半分）。<br>売ったら元にはもどせない。</p>`,
    [["売る", () => { delete SAVE.inv[id]; gainRyo(g); saveSave(SAVE); sfx.ok(); closeModal(); showShop("sell"); }], ["やめる", closeModal]]);
}
function sellBag(id){
  if(!(SAVE.bag[id] > 0)) return;
  SAVE.bag[id]--; gainRyo(Math.floor(BAG[id].price / 2)); saveSave(SAVE); sfx.tap(); showShop("sell");
}
function buyEq(id, sale){
  const it = EQUIP[id], price = sale ? salePrice(it) : priceOf(it);
  if(SAVE.inv[id] || SAVE.ryo < price) return;
  SAVE.ryo -= price; addItem(id); saveSave(SAVE);
  sfx.clear();
  const why = canEquip(it);
  modal(`<div class="big">${it.icon}</div><h3>${esc(it.name)}を買った！</h3><p>${stText(it)}</p>${equipBadge(it)}`,
    why ? [["もどる", () => { closeModal(); showShop(); }]] : [["すぐ着ける", () => { equipItem(id); closeModal(); showShop(); }], ["あとで", () => { closeModal(); showShop(); }]]);
}
function buyBag(id){
  const b = BAG[id];
  if(SAVE.ryo < b.price) return;
  SAVE.ryo -= b.price; SAVE.bag[id] = (SAVE.bag[id] || 0) + 1; saveSave(SAVE);
  sfx.ok(); showShop();
}

const DAN_ROWS = {ア:"あかさたなはまやらわがざだばぱ", イ:"いきしちにひみりぎじぢびぴ", ウ:"うくすつぬふむゆるぐずづぶぷ", エ:"えけせてねへめれげぜでべぺ", オ:"おこそとのほもよろをごぞどぼぽ"};
const danOf = k => Object.keys(DAN_ROWS).find(d => DAN_ROWS[d].includes(k));
// 段の仲間（にごらない音だけ）を「あ・か・さ…」の形で
const DAN_SEION = {ア:10, イ:8, ウ:9, エ:8, オ:10};
const danList = d => (DAN_ROWS[d] || "").slice(0, DAN_SEION[d] || 0).split("").join("・");
const typePool = types => shuffle([].concat(
  types.includes("godan") ? V_GODAN : [], types.includes("kami") ? V_KAMI : [], types.includes("shimo") ? V_SHIMO : [],
  types.includes("ka") ? V_KA : [], types.includes("sa") ? V_SA : [], types.includes("fake") ? V_FAKE : []));
function genDan(){
  const d = pick(["ア", "イ", "エ"]), k = pick([...DAN_ROWS[d].slice(0, 10)]);
  return {kind:"dan", k, ans:d + "段", choices:["ア段", "イ段", "エ段"]};
}
// 流派を選ぶ問題。nai：hl＝「ない」の形を出して直前の音を光らせる／plain＝形だけ出す／hint＝ボタンで出せる／none＝出さない
function genType(types, nai, pool){
  const P = typePool(pool || types);
  // カ変・サ変は数が少ないので、出る割合を少し上げる
  let v = pick(P);
  if((types.includes("ka") || types.includes("sa")) && Math.random() < .3) v = pick([...V_KA, ...V_SA]);
  return {kind:"type", v, ans:v.t, types, nai};
}
function genForm(forms, withWord, verbs){
  const f = pick(forms), v = pick(verbs || V_GODAN.filter(x => !x.iku));
  return withWord ? {kind:"form", v, f, word:conj(v, f), fol:followOf(v, f), ans:FORM_NAME[f], choices:formChoicesOf(forms)}
    : {kind:"form", only:true, v, f, fol:BASE_FOL[f], ans:FORM_NAME[f], choices:formChoicesOf(forms)};
}
const formChoicesOf = forms => FORM_LIST.filter(n => forms.some(f => FORM_NAME[f] === n));
function genTable(pool, forms){
  const v = pick(pool), f = pick(forms);
  return {kind:"table", v, f, ans:conj(v, f), torn:[], done:[]};
}
function genSent(hlK, stype, forms){
  const list = forms ? SENTENCES.filter(x => forms.includes(x.f)) : SENTENCES;
  const x = pick(list);
  return stype ? {kind:"stype", x, v:verbOf(x), ans:x.t, nai:"hint"} : {kind:"sform", x, ans:FORM_NAME[x.f], hlK};
}

function needTraining(fi, go){

  if(fi === 0 && !chCleared("jo")){ soonMsg("まずは📚寺子屋で、師匠の話を聞こう！"); return; }

  playStory([["nar", `―― 「${FIELDS[fi].name}」へ向かう前に、師匠が呼び止めた。 ――`],
    ["shisho", resume ? "おお、修行の続きじゃな。前に終えたところから始めよう。" : `「${FIELDS[fi].name}」に入る前に、身につけておくべき術がある。一つずつ、ていねいに教えよう。`]],
    () => startTraining(ch));

function soonMsg(t){ modal(`<p>${t}</p>`, [["わかった", closeModal]]); }
function startTraining(ch, fromTop){
  const steps = TRAIN_PLAN[ch];

function runStep(){
  if(!TR) return;

  if(st.kind === "talk") return showTalk(st, 0);
  // 練習の段階
  TR.win = [];

  startBattle({mode:"train", trainCh:TR.ch, ch:c, drill:st, foe:{icon:"🎯", name:"修行", hp:1, atk:0, def:0, every:999}, time:99, ryo:0, xp:2});
}
// 師匠の説明（ページめくり。「説明をとばす」で、続く説明もまとめて飛ばして次の練習へ）
function showTalk(st, page){
  const n = st.pages.length;
  $("lessonBody").innerHTML = `<div class="tstep">修行 ${stepNo()}　${esc(st.title)}</div>
    <div class="ttalk"><span class="tsensei">${pic("shisho")}</span><div class="tbubble">${st.pages[page]}</div></div>
    <div class="tpage">${n > 1 ? `${page + 1} / ${n}` : ""}</div>`;
  $("lessonBtn").textContent = page + 1 < n ? "次へ ▶" : "練習へ ▶";
  LESSON_AFTER = () => { if(page + 1 < n) showTalk(st, page + 1); else { TR.si++; saveTrainProg(); runStep(); } };
  $("lessonSkip").style.display = "";
  $("lessonSkip").onclick = () => { // 続く説明をまとめて飛ばす
    do { TR.si++; } while(TR.steps[TR.si] && TR.steps[TR.si].kind === "talk");

}
function stepNo(){ const drills = TR.steps.filter(s => s.kind === "drill"); const k = TR.steps.slice(0, TR.si + 1).filter(s => s.kind === "drill").length; return `${Math.min(k + (TR.steps[TR.si] && TR.steps[TR.si].kind === "talk" ? 1 : 0), drills.length)} / ${drills.length}`; }
function saveTrainProg(){ SAVE.trainProg = SAVE.trainProg || {}; SAVE.trainProg[TR.ch] = TR.si; saveSave(SAVE); }
function trainGoalMet(){ const g = TR.steps[TR.si].goal, w = TR.win.slice(-g.n); return w.length >= g.k && w.filter(Boolean).length >= g.k; }
function trainDotsHtml(){

  const dots = []; for(let i = 0; i < g.n; i++) dots.push(`<i class="td ${i < w.length ? (w[i] ? "on" : "ng") : ""}"></i>`);

}
// 練習1問ごと（nextQ から）：目標に届いたら次の段階へ
async function trainNext(p){

/* =====================================================================
   茶屋「三色だんご」（2026-11-23、教員の指示：「団子作りをモチーフに、別方向から活用のミニゲームを」）
   戦いは「形を見て、何形かを選ぶ（見分ける）」。団子づくりは逆に「注文された活用形を、自分で組み立てる（作る）」。
   串には白い団子（本体＝語幹）が刺さっている。そこへ
     ピンクの団子（変装＝活用語尾）と、緑の団子（合言葉＝後ろに続く言葉）を順に刺して、三色団子を完成させる。
     例：「書く」を仮定形で → 白「書」＋ピンク「け」＋緑「ば」
   1回の営業は8人のお客。お客には待てる時間がある（だんだん短くなる）。早く正しく出すほど、お代と心づけが増える。
   ・お品書き（段）は物語の進み具合で増える：五段 → いろいろな動詞 → 形容詞 → 形容動詞
   ・正解1つで「動詞の活用」ジャンル＋1（ほかの戦いと同じ）。かせいだ両は持ち物へ。3皿ごとに団子1本のおまけ。
   ===================================================================== */
const DANGO_LEVELS = [
  {id:"godan", name:"五段の団子",       icon:"🍡", need:"ichi", needName:"一の章", desc:"五段活用の動詞（書く・読む…）", kind:"verb", time:30},
  {id:"verb",  name:"いろいろな動詞",   icon:"🍢", need:"ni",   needName:"二の章", desc:"上一段・下一段・サ変もまぜて", kind:"verb", time:28},
  {id:"adj",   name:"形容詞の団子",     icon:"🍘", need:"gai1", needName:"外一の章", desc:"美しい・寒い…（命令形はない）", kind:"adj", time:28},
  {id:"adjv",  name:"形容動詞まぜ団子", icon:"🍙", need:"gai2", needName:"外二の章", desc:"静かだ・きれいだ…と形容詞をまぜて", kind:"adjv", time:28},
];
const DANGO_N = 8;
/* 2026-11-23、教員の指示で作り直し：
   ・正解が1本だけになるように。注文ごとに「ねらいの形」（活用語尾＋合言葉）を1つ決め、緑の団子の中には、
     注文の活用形の合言葉を、その1つしか入れない（例：未然形の注文で「ない」が入っていれば「う／よう」は入れない）。
   ・合言葉の種類をふやした（終止形：。・から・けれど／連体形：とき・こと・ので／連用形：ます・ながら・たい・た・て・たら …）。
   ・何形にしたいかを、大きな注文札で見せる。 */
// 活用形（conjのキー）ごとの合言葉の候補
function vFolsOf(v, k){
  const dak = v.t === "godan" && !v.iku && "ぐぬぶむ".includes(v.w.slice(-1));
  return {mizen:["ない"], mizenU:[v.t === "godan" ? "う" : "よう"], renyo:["ます", "ながら", "たい"],
    onbin:dak ? ["だ", "で", "だら"] : ["た", "て", "たら"], shushi:["。", "から", "けれど"], rentai:["とき", "こと", "ので"],
    katei:["ば"], meirei:["！"]}[k];
}
const A_FOLS = {mizenU:["う"], onbin:["た", "たら"], renyo:["なる", "ない", "て"], shushi:["。", "から", "けれど"], rentai:["とき", "こと", "ので"], katei:["ば"]};
const AV_FOLS = {mizenU:["う"], onbin:["た", "たら"], renyo:["ない", "ある"], renyo2:["なる"], shushi:["。", "から", "けれど"], rentai:["とき", "こと", "ので"], katei:["ば"]};
// 語（本体＝語幹）と、活用形ごとの「活用語尾」「合言葉の候補」
function dangoWord(lv){
  if(lv.kind === "verb"){
    const pool = lv.id === "godan" ? V_GODAN
      : [...V_GODAN, ...V_KAMI.filter(v => v.w.length >= 3), ...V_SHIMO.filter(v => v.w.length >= 3), ...V_SA.filter(v => v.w.length > 2)];
    const v = pick(pool);
    const stem = v.t === "godan" ? v.w.slice(0, -1) : v.w.slice(0, -2);
    const forms = ["mizen", "mizenU", "renyo", "onbin", "shushi", "rentai", "katei", "meirei"].map(k => ({k, name:FORM_NAME[k], e:conj(v, k).slice(stem.length), fols:vFolsOf(v, k)}));
    return {v, stem, forms, hint:FORM_HINT, row:v.t === "godan" ? [...ROW[v.w.slice(-1)], ONBIN[v.w.slice(-1)]] : []};
  }
  const useAdjv = lv.kind === "adjv" && Math.random() < .65;
  const v = pick(useAdjv ? ADJV : ADJ), FS = useAdjv ? ADJV_FORMS : ADJ_FORMS, FL = useAdjv ? AV_FOLS : A_FOLS;
  return {v, stem:aStem(v), forms:FS.map(F => ({k:F.k, name:F.name, e:F.e, fols:FL[F.k]})), hint:A_HINT, row:[]};
}
function makeDangoOrder(lv, n){
  const W = dangoWord(lv);
  const name = pick([...new Set(W.forms.map(f => f.name))]);
  // ねらいの形（活用語尾＋合言葉）を1つ決める
  const tf = pick(W.forms.filter(f => f.name === name)), tfol = pick(tf.fols);
  // 注文の活用形の合言葉は、ねらいの1つだけ。ほかの活用形の合言葉は、まどわし（入れても不正解になる）として入れる
  const sameForm = new Set(W.forms.filter(f => f.name === name).flatMap(f => f.fols));
  const others = [...new Set(W.forms.filter(f => f.name !== name).flatMap(f => f.fols))].filter(x => !sameForm.has(x));
  const folTray = shuffle([tfol].concat(shuffle(others).slice(0, 7)));
  const endings = [...new Set(W.forms.map(f => f.e).concat(W.row))];
  const extra = shuffle(["か", "け", "れ", "さ", "ろ", "い", "な", "く"].filter(x => !endings.includes(x))).slice(0, Math.max(0, 6 - endings.length));
  return {W, name, target:{e:tf.e, fol:tfol}, endTray:shuffle(endings.concat(extra)), folTray,
    guest:pick(["👵", "👴", "🧑‍🌾", "👨‍🎓", "👩", "🧒", "🧔", "👘", "🧳", "🥷"]), hint:n < 3 && lv.id === DANGO_LEVELS[0].id};
}
// 組み合わせが、その活用形として正しいか（緑の団子には、注文の形の合言葉が1つしかないので、正解は1本だけ）
function dangoIsRight(o, e, f){ return o.W.forms.some(F => F.name === o.name && F.e === e && F.fols.includes(f)); }

let CUR = null, PLAY = null;
function makeQuestions(ch){
  const qs = [];
  if(ch.id === "jo"){
    // 五段の「本体＋＿＋後ろの言葉」に合う変装札を選ぶ。札は同じ行の5つ
    const forms = shuffle(["mizen","mizenU","renyo","shushi","rentai","katei","meirei","mizen"]);
    const verbs = shuffle(V_GODAN.filter(v => !v.iku));
    for(let i = 0; i < ch.n; i++){
      const v = i === 0 ? V_GODAN[0] : verbs[i], f = forms[i % forms.length];
      const stem = v.w.slice(0, -1), row = ROW[v.w.slice(-1)];
      const ans = conj(v, f).slice(-1);
      qs.push({kind:"fuda", v, stem, fol:followOf(v, f), ans, choices:[...row], form:f});
    }
  }else if(ch.id === "ichi"){
    // 最初の4問は合言葉だけ、そのあとは「活用した形＋合言葉」
    const pool = [...V_GODAN, ...V_KAMI, ...V_SHIMO, ...V_KA, ...V_SA];
    const forms = ["mizen","mizenU","renyo","onbin","shushi","rentai","katei","meirei"];
    let fs = shuffle(forms.concat(forms));
    // 最初の5問は合言葉だけ（基本の8語「ない・よう・た・ます・。・とき・ば・！」から重ならないように）
    shuffle(Object.keys(BASE_FOL)).slice(0, 5).forEach(f => qs.push({kind:"form", only:true, v:V_GODAN[0], f, fol:BASE_FOL[f], ans:FORM_NAME[f]}));
    for(let i = 5; i < ch.n; i++){
      const f = fs.pop(), v = pick(i < 9 ? V_GODAN : pool);
      qs.push({kind:"form", v, f, word:conj(v, f), fol:followOf(v, f), ans:FORM_NAME[f]});
    }
  }else if(ch.id === "ni"){
    // 五段4・上一段3・下一段3・カ変1・サ変1（偽忍者はまだ出さない）
    const take = (arr, k) => shuffle(arr).slice(0, k);
    const vs = shuffle([...take(V_GODAN, 4), ...take(V_KAMI, 3), ...take(V_SHIMO, 3), ...V_KA, pick(V_SA)]);
    vs.slice(0, ch.n).forEach(v => qs.push({kind:"type", v, ans:v.t, autoSmoke:true}));
  }else if(ch.id === "shi"){
    // 4つの動詞（五段・上一段・下一段・カ変かサ変）の表で、それぞれ3か所の破れを順に直す。五段は必ず「た」（音便）を入れる
    const take = arr => pick(arr);
    const vs = shuffle([take(V_GODAN.filter(v => !"す".includes(v.w.slice(-1)))), take(V_KAMI), take(V_SHIMO), take([...V_KA, ...V_SA])]);
    vs.forEach(v => {
      let fs = shuffle(TABLE_ROWS.map(r => r[0]).filter(f => f !== "onbin")).slice(0, 3);
      if(v.t === "godan") fs = [fs[0], fs[1], "onbin"];
      fs = shuffle(fs);
      fs.forEach((f, i) => qs.push({kind:"table", v, f, ans:conj(v, f), torn:fs.slice(i + 1), done:fs.slice(0, i)}));
    });
  }else if(ch.id === "tsui"){
    // 文の中の下線部の活用形。3問に1問は、つづけて流派（活用の種類）も聞く
    shuffle(SENTENCES).slice(0, ch.n).forEach((x, i) => {
      qs.push({kind:"sform", x, ans:FORM_NAME[x.f]});
      if(i % 3 === 2) qs.push({kind:"stype", x, v:verbOf(x), ans:x.t});
    });
  }else if(ch.id === "gai1"){
    for(let i = 0; i < 4; i++) qs.push(genAForm("adj", true));
    for(let i = 0; i < 3; i++) qs.push(genAEnd("adj"));
    for(let i = 0; i < 4; i++) qs.push(genASent(ADJ_SENTENCES));
    qs.push(genPos(["動詞", "形容詞"], false));
    qs.splice(0, qs.length, ...shuffle(qs));
  }else if(ch.id === "gai2"){
    for(let i = 0; i < 3; i++) qs.push(genAForm("adjv", true));
    for(let i = 0; i < 2; i++) qs.push(genAEnd("adjv"));
    for(let i = 0; i < 3; i++) qs.push(genASent(ADJV_SENTENCES));
    qs.push(genASent(ADJ_SENTENCES), genAForm("adj", true));
    for(let i = 0; i < 2; i++) qs.push(genPos(["動詞", "形容詞", "形容動詞"], true));
    qs.splice(0, qs.length, ...shuffle(qs));
  }else if(ch.id === "san"){
    // 偽忍者6・本物の一段4（同じ読みの組を優先）・カ変かサ変1・ふつうの五段1
    const fakes = shuffle(V_FAKE).slice(0, 6);
    const pairs = fakes.map(f => f.pair).filter(Boolean).map(w => [...V_KAMI, ...V_SHIMO].find(x => x.w === w));
    const others = shuffle([...V_KAMI, ...V_SHIMO].filter(v => !pairs.includes(v)));
    const ichidan = pairs.concat(others).slice(0, 4);
    const vs = shuffle([...fakes, ...ichidan, pick([...V_KA, ...V_SA]), pick(V_GODAN)]);
    vs.slice(0, ch.n).forEach(v => qs.push({kind:"type", v, ans:v.t, autoSmoke:false}));
  }
  return qs;
}

function delayHint(q, show){

// 「ない」をつけた形を見せる。plain＝直前の音を光らせない
function throwSmoke(q, used, plain, withDan){
  if(q.smoked) return;
  q.smoked = true; sfx.smoke();
  const n = naiInfo(q.v);
  const html = plain ? n.stemHtml.replace(/class="sound"/g, 'class="soundplain"') : n.stemHtml;
  const dan = withDan ? `<div class="danbadge">「${esc(n.sound)}」は <b>${n.dan}段</b>（${esc(danList(n.dan))}の仲間）</div>` : "";

  if(used) $("qTools").innerHTML = "";
}
function naiHint(){ const p = PLAY; if(!p || p.lock) return; throwSmoke(p.qs[p.i], true, true); }
function explain(q){
  if(q.kind === "aform"){
    let t = `合言葉「${esc(q.fol)}」が続くのは<b>${q.ans}</b>（${A_HINT[q.ans]}）。`;
    if(!q.only) t = `「${rubyHtml(q.v, q.word)}${esc(q.fol)}」：` + t;
    if(!q.adjv && (q.fol === "ない" || q.fol === "なる" || q.fol === "て")) t += `<br>形容詞の「${esc(q.fol)}」は、連用形「<b>く</b>」につく。動詞の「書か<b>ない</b>」（未然形）とはちがうので注意！`;
    if(q.adjv && q.fol === "ない") t += `<br>形容動詞の「ない」は、連用形「<b>で</b>」につく（静か<b>で</b>ない）。`;
    if(q.adjv && q.f === "rentai") t += `<br>形容動詞の連体形は「〜<b>な</b>」。`;
    return t;
  }
  if(q.kind === "pos"){
    const b = q.base;
    if(q.ans === "動詞") return `「${rubyHtml(b)}」は動きを表し、言い切りが<b>ウ段</b>の音 → <b>動詞</b>。`;
    if(q.ans === "形容詞") return `「${rubyHtml(b)}」は様子を表し、言い切りが<b>「い」</b>${q.phrase ? "（名詞の前でも「〜い」）" : ""} → <b>形容詞</b>。`;
    return `「${rubyHtml(b)}」は様子を表し、言い切りが<b>「だ」</b>（名詞の前では<b>「〜な」</b>） → <b>形容動詞</b>。${/い$/.test(b.s) ? "<br>「い」で終わって見えても、「〜な」「〜だ」と言えれば形容動詞！" : ""}`;
  }
  if(q.kind === "dan") return `「${esc(q.k)}」は「${danList(danOf(q.k))}」の仲間 → <b>${danOf(q.k)}段</b>。`;
  if(q.kind === "fuda"){
    return `「<b>${esc(q.stem)}${esc(q.ans)}</b>${esc(q.fol)}」が正しい形。変わらない「${esc(q.stem)}」が語幹、変わる「${esc(q.ans)}」が活用語尾。`;
  }
  if(q.kind === "form"){
    const f = q.ans;
    const memo = q.fol === "う" ? "（「う」は「よう」のなかま）" : q.fol === "だ" ? "（「だ」は「た」がにごったもの）" : "";
    const naiNote = q.fol === "ない" ? "<br>※これは<b>動詞</b>の場合。形容詞（高<b>く</b>ない）・形容動詞（静か<b>で</b>ない）の「ない」は<b>連用形</b>につく。" : "";
    return `動詞に合言葉「${esc(q.fol)}」${memo}が続くのは<b>${f}</b>（${FORM_HINT[f]}）。${q.only ? "" : "形だけでなく、すぐ後ろの言葉で決まる。"}${naiNote}`;
  }
  if(q.kind === "table"){
    let t = `「${rubyHtml(q.v)}」の${FORM_NAME[q.f]}（合言葉「${followOf(q.v, q.f)}」）は「<b>${formHtml(q.v, q.ans)}</b>」。`;
    if(q.f === "onbin" && q.v.t === "godan") t += `<br>五段は「た」が続くと音が変わる（音便）。${formHtml(q.v, q.ans)}${"ぐぬぶむ".includes(q.v.w.slice(-1)) && !q.v.iku ? "だ" : "た"}。`;
    return t;
  }
  if(q.kind === "sform"){
    const x = q.x;
    return `すぐ後ろの「${esc(x.k)}」に注目 → <b>${FORM_NAME[x.f]}</b>。${x.n ? "<br>" + esc(x.n) : ""}`;
  }
  if(q.kind === "stype") return `言い切りの形は「${rubyHtml(q.v)}」。` + typeExplain(q.v);
  return typeExplain(q.v);
}
/* =====================================================================
   戦闘の演出（2026-11-23、教員の指示：「戦闘画面があまり魅力的ではない。火・水・木の技を使うときは、もっと演出を」）
   画面全体にかぶせたキャンバス（#fxCanvas）に、粒（絵文字・光の玉・線）を飛ばして描く。
   fxFire / fxWater / fxWood / fxThunder / fxHeal / fxBunshin：術ごとの演出（約1.3秒。終わるまで待てる）
   fxSlash：ふつうの攻撃（会心は金色の大きな斬撃）、fxEnemyHit：敵からの攻撃（術なら属性の色）
   ===================================================================== */
const FX = {parts:[], running:false, ctx:null, w:0, h:0, last:0};
function fxResize(){
  const c = $("fxCanvas"); if(!c) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  FX.w = innerWidth; FX.h = innerHeight;
  c.width = FX.w * dpr; c.height = FX.h * dpr;
  FX.ctx = c.getContext("2d"); FX.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", fxResize);
function fxAdd(p){
  p.age = 0; p.life = p.life || 1;
  FX.parts.push(p);
  if(!FX.running){ FX.running = true; FX.last = performance.now(); requestAnimationFrame(fxLoop); }
}
function fxLoop(now){
  const dt = Math.min(.05, (now - FX.last) / 1000); FX.last = now;
  const ctx = FX.ctx; if(!ctx){ FX.running = false; return; }
  ctx.clearRect(0, 0, FX.w, FX.h);
  FX.parts = FX.parts.filter(p => {
    p.age += dt; if(p.age >= p.life) return false;
    const k = p.age / p.life;
    if(p.draw){ ctx.save(); p.draw(ctx, k, p); ctx.restore(); return true; }
    p.vx = (p.vx || 0) * (p.drag || 1); p.vy = (p.vy || 0) + (p.g || 0) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot = (p.rot || 0) + (p.vr || 0) * dt;
    const a = p.fadeIn && k < .15 ? k / .15 : 1 - Math.max(0, (k - (p.hold ?? .5)) / (1 - (p.hold ?? .5)));
    ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, a)); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
    const sc = p.grow ? 1 + p.grow * k : 1; ctx.scale(sc, sc);
    if(p.ch){ ctx.font = `${p.size || 24}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(p.ch, 0, 0); }
    else{
      ctx.globalCompositeOperation = "lighter";
      const r = Math.max(.1, p.r || 6), g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
      g.addColorStop(0, p.c0 || "#fff"); g.addColorStop(.4, p.c1 || p.c0 || "#fa0"); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    return true;
  });
  if(FX.parts.length) requestAnimationFrame(fxLoop);
  else { FX.running = false; ctx.clearRect(0, 0, FX.w, FX.h); }
}
const rnd = (a, b) => a + Math.random() * (b - a);
function centerOf(el){
  if(!el) return {x:FX.w / 2, y:FX.h / 3};
  const r = el.getBoundingClientRect();
  return {x:r.left + r.width / 2, y:r.top + r.height / 2};
}
const foeC = () => centerOf(document.querySelector("#foe .foe-ic") || $("foe"));
const heroC = () => centerOf($("bHero"));
function shake(px){
  const s = $("sPlay"); if(!s) return;
  s.style.setProperty("--sh", (px || 8) + "px");
  s.classList.remove("shake2"); void s.offsetWidth; s.classList.add("shake2");
}
function tint(cls){
  const t = $("fxTint"); if(!t) return;
  t.className = "fx-tint " + cls; void t.offsetWidth; t.classList.add("go");
}
function ring(x, y, color, r, life){
  fxAdd({x, y, life:life || .6, draw:(ctx, k) => {
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = color; ctx.lineWidth = 8 * (1 - k) + 1;
    ctx.shadowColor = color; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(x, y, Math.max(.1, (r || 90) * (.2 + k)), 0, Math.PI * 2); ctx.stroke();
  }});
}
function burst(x, y, n, opt){
  for(let i = 0; i < n; i++){
    const a = rnd(0, Math.PI * 2), sp = rnd(opt.sp0 || 120, opt.sp1 || 380);
    fxAdd(Object.assign({x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp, drag:.96, life:rnd(.5, .9), vr:rnd(-6, 6)}, opt.p(i)));
  }
}

  for(let i = 0; i < 26; i++) fxAdd({x:rnd(0, FX.w), y:FX.h + 20, vx:rnd(-20, 20), vy:rnd(-520, -320), life:rnd(.7, 1.1), ch:"🔥", size:rnd(24, 46), hold:.4});
  for(let i = 0; i < 30; i++) fxAdd({x:h.x + rnd(-30, 30), y:h.y + rnd(-10, 20), vx:rnd(-40, 40), vy:rnd(-200, -80), life:rnd(.4, .8), r:rnd(8, 18), c0:"#fff6c0", c1:"#ff7a1a"});
  await sleep(350);
  // 火の玉
  const T = .42;
  fxAdd({life:T, draw:(ctx, k) => {
    const x = h.x + (f.x - h.x) * k, y = h.y + (f.y - h.y) * k - Math.sin(k * Math.PI) * 60;
    ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(x, y, 0, x, y, 46); g.addColorStop(0, "#fffbe0"); g.addColorStop(.35, "#ffb020"); g.addColorStop(1, "rgba(255,60,0,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 46, 0, Math.PI * 2); ctx.fill();
  }});
  for(let i = 0; i < 14; i++) setTimeout(() => {
    const k = i / 14, x = h.x + (f.x - h.x) * k, y = h.y + (f.y - h.y) * k - Math.sin(k * Math.PI) * 60;
    fxAdd({x, y, vx:rnd(-40, 40), vy:rnd(-40, 40), life:.45, r:rnd(10, 18), c0:"#fff1a0", c1:"#ff5a00"});
  }, i * T * 1000 / 14);
  tone(220, .4, "sawtooth", .05);
  await sleep(T * 1000);

  await sleep(500);
}

/* ---------- 水遁：大波が画面を横切り、敵の上で水しぶきがはじける ---------- */
async function fxWater(){
  const f = foeC();
  tint("water");
  const top = f.y - 120, bottom = f.y + 120;
  fxAdd({life:.9, draw:(ctx, k) => {
    const front = -200 + (FX.w + 400) * k;
    for(let layer = 0; layer < 3; layer++){
      ctx.globalAlpha = .55 - layer * .12;
      ctx.fillStyle = ["#7fd3ff", "#3a9be8", "#1f5fbf"][layer];
      ctx.beginPath(); ctx.moveTo(front - FX.w - 200, bottom + 60);
      for(let x = front - FX.w - 200; x <= front; x += 12){
        const amp = 26 + layer * 10, y = top + layer * 30 + Math.sin(x / 38 + k * 14 + layer) * amp * (1 - Math.abs(x - front) / (FX.w + 200));
        ctx.lineTo(x, y);
      }
      ctx.quadraticCurveTo(front + 60, top - 40 + layer * 30, front + 20, bottom + 60);
      ctx.closePath(); ctx.fill();
    }
  }});
  for(let i = 0; i < 18; i++) fxAdd({x:rnd(0, FX.w), y:FX.h + 10, vx:0, vy:rnd(-260, -140), life:rnd(.8, 1.2), ch:"🫧", size:rnd(14, 26), fadeIn:true});

/* ---------- 木遁：木の葉の嵐が敵をつつみ、つるが巻きつく ---------- */

    fxAdd({life:1.15, draw:(ctx, k) => {
      const r = r0 * (1 - k * .85), a = a0 + k * spin;
      const x = f.x + Math.cos(a) * r, y = f.y + Math.sin(a) * r * .6;
      ctx.globalAlpha = k < .1 ? k * 10 : k > .85 ? (1 - k) / .15 : 1;
      ctx.translate(x, y); ctx.rotate(a * 2);
      ctx.font = `${22 + (1 - k) * 10}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(ch, 0, 0);

  for(let v = 0; v < 4; v++){

    const sx = f.x + (v - 1.5) * 70, sy = st.bottom - 4, ph = rnd(0, 6);   // 舞台の地面から生える

      ctx.strokeStyle = "#2f8a3a"; ctx.lineWidth = 7; ctx.lineCap = "round"; ctx.shadowColor = "#7dff8a"; ctx.shadowBlur = 12;
      ctx.globalAlpha = k > .85 ? (1 - k) / .15 : 1;
      ctx.beginPath(); ctx.moveTo(sx, sy);
      for(let t = 0; t <= g; t += .02){
        const y = sy + (f.y - sy) * t, x = sx + (f.x - sx) * t + Math.sin(t * 12 + ph) * 26 * (1 - t);

function fxSlash(crit){
  const f = foeC(), len = crit ? 150 : 100;
  for(let s = 0; s < (crit ? 3 : 1); s++){
    const ang = -Math.PI / 4 + s * .5 + rnd(-.15, .15);
    setTimeout(() => fxAdd({life:.28, draw:(ctx, k) => {
      ctx.globalAlpha = 1 - k; ctx.strokeStyle = crit ? "#ffe066" : "#ffffff"; ctx.lineWidth = (crit ? 9 : 6) * (1 - k * .6);
      ctx.shadowColor = crit ? "#ffb300" : "#9fd3ff"; ctx.shadowBlur = 18; ctx.lineCap = "round";
      const p = Math.min(1, k * 3);
      ctx.beginPath();
      ctx.moveTo(f.x - Math.cos(ang) * len, f.y - Math.sin(ang) * len);
      ctx.lineTo(f.x - Math.cos(ang) * len + Math.cos(ang) * len * 2 * p, f.y - Math.sin(ang) * len + Math.sin(ang) * len * 2 * p);
      ctx.stroke();
    }}), s * 90);
  }
  burst(f.x, f.y, crit ? 18 : 8, {sp0:120, sp1:crit ? 380 : 240, p:() => ({r:rnd(5, 10), c0:"#ffffff", c1:crit ? "#ffd23f" : "#9fd3ff"})});

}

/* =====================================================================
   戦い（任務・本任務・練習）
   正解＝攻撃（会心は2倍）、まちがい・時間切れ＝反撃（守りで減る。装備の「無効」があれば先に使う）。

let TIMER = null;
function startBattle(cfg){
  const b = battleStats(), ch = cfg.ch;

    foe:Object.assign({}, cfg.foe, {max:cfg.foe.hp}), timeBase:cfg.time + b.time, lv0:ninjaInfo().lv, dmgDealt:0, charge:0, xpGot:0};

    gainRyo(g); rewards.push(`💰 ${g}両${p.stolen ? `（取り返した${p.stolen}両をふくむ）` : ""}`);
    let rareGot = null;
    if(foe.special){
      // 名のある忍：はじめて倒したときは秘宝を必ず。2回目からは、持っていなければ3割で
      const it = EQUIP[w.item], first = !(SAVE.dex[foe.kind] && SAVE.dex[foe.kind].beat);
      if(!SAVE.inv[it.id] && (first || Math.random() < .3)) rareGot = it;
    }else if(foe.golden && Math.random() < .5){
      const pool = GOLD_RARES.map(id => EQUIP[id]).filter(it => !SAVE.inv[it.id]);
      if(pool.length) rareGot = pick(pool);
    }
    if(foe.makyo && !foe.nushi) SAVE.makyoWins = makyoWins() + 1;
    if(foe.nushi){
      if(!SAVE.makyoBoss){ rareGot = EQUIP.makyo_hoju; gainRyo(30000); rewards.push("💰 30000両（初勝利）"); rewards.push("🏅 称号「魔境を制した者」"); SAVE.makyoTitle = "魔境を制した者"; }

    }
    if(rareGot){ addItem(rareGot.id); rewards.push(`<b class="hiho-get">${rareGot.icon} 秘宝「${rareGot.name}」</b>`); }
    if(Math.random() < (foe.special || foe.golden || foe.makyo ? .6 : .12)){ const d = wildDrop(foe.lv); if(d){ addItem(d.id); rewards.push(`${d.icon} ${d.name}（${TIER[d.tier].name}）`); } }

    </div>`;
  show("sResult");
  animateXp(XP_AWARD);
