  $("fGoal").innerHTML = questCardHtml(true);
  show("sField");
}
/* 地方ごとの個性（2026-11-23、教員の指示：「マップのデザインを個性的に」）
   里の外れ＝日ざしと蝶・竹林＝舞い落ちる笹の葉・川辺＝流れる霧・峠＝吹きぬける風・影の森＝暗がりと光る目。
   地方に入ると、名前の札と、その地方の短い音楽が出る。 */
function fieldOverlayHtml(ov){
  let h = `<div class="fov ov-${ov}">`;
  const n = {sun:5, leaves:10, fog:3, wind:7, dark:6}[ov] || 0;
  for(let i = 0; i < n; i++){
    const left = (i * 37 + 11) % 100, delay = (i * 1.3) % 6, dur = 5 + (i % 4);
    const ch = {sun:"🦋", leaves:"🍃", fog:"", wind:"", dark:"👀"}[ov];
    h += `<span style="left:${left}%;top:${(i * 23 + 7) % 90}%;animation-delay:-${delay}s;animation-duration:${dur}s">${ch}</span>`;
  }
  return h + `</div>`;
}
function showFieldTitle(F){
  const t = document.createElement("div");
  t.className = "ftitle"; t.innerHTML = `<small>${F.theme.sub}</small><b>〜 ${F.name} 〜</b><small>出題：${CHAPTERS[chIndex(FIELD_STORY[FIELDS.indexOf(F)])].name}</small>`;
  $("fGrid").appendChild(t); setTimeout(() => t.remove(), 2600);
  (F.theme.jingle || []).forEach((f, i) => tone(f, .22, "triangle", .05, i * .18));
}
function placeFHero(){
  const h = $("fHero"); if(!h) return;
  h.style.left = (FIELD.x + .5) / 8 * 100 + "%";
  h.style.top = (FIELD.y + .5) / FIELDS[FIELD.f].map.length * 100 + "%";
}
function fieldMsg(t){ $("fMsg").innerHTML = t; }
// 行きたいマスまでの道を探す（幅優先）
function findPath(tx, ty){
  const F = FIELDS[FIELD.f], H = F.map.length, key = (x, y) => y * 8 + x;
  const prev = new Map([[key(FIELD.x, FIELD.y), null]]), q = [[FIELD.x, FIELD.y]];
  while(q.length){
    const [x, y] = q.shift();
    if(x === tx && y === ty) break;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx, dy]) => {
      const nx = x + dx, ny = y + dy;
      if(nx < 0 || nx >= 8 || ny < 0 || ny >= H || prev.has(key(nx, ny)) || !canWalk(FIELD.f, nx, ny)) return;
      prev.set(key(nx, ny), [x, y]); q.push([nx, ny]);
    });
  }
  if(!prev.has(key(tx, ty))) return null;
  const path = []; let cur = [tx, ty];
  while(cur && !(cur[0] === FIELD.x && cur[1] === FIELD.y)){ path.unshift(cur); cur = prev.get(key(cur[0], cur[1])); }
  return path;
}
function tapTile(x, y){
  if(fieldBusy()) return;
  if(fieldTile(FIELD.f, x, y) === "U" && !exitOpen(FIELD.f)){ fieldMsg(`🚧 道がふさがれている！ 奥の${STORY_PLAN[FIELD_STORY[FIELD.f]].icon}を倒そう`); return; }
  if(!canWalk(FIELD.f, x, y)) return;
  const path = findPath(x, y);
  if(path && path.length) walkPath(path);
}
async function walkPath(path){
  FIELD.walking = true;
  for(const [x, y] of path){
    if(!FIELD || !$("sField").classList.contains("show")) break;
    const stop = await stepTo(x, y);
    if(stop) break;
    await sleep(140);
  }
  if(FIELD) FIELD.walking = false;
}
function fieldBusy(){ return !FIELD || FIELD.walking || !$("sField").classList.contains("show") || $("modal").classList.contains("show"); }
function arrowStep(dx, dy){
  if(fieldBusy()) return;
  const nx = FIELD.x + dx, ny = FIELD.y + dy;
  if(nx < 0 || nx >= 8 || ny < 0 || ny >= FIELDS[FIELD.f].map.length || !canWalk(FIELD.f, nx, ny)){
    if(fieldTile(FIELD.f, nx, ny) === "U") fieldMsg(`🚧 道がふさがれている！ 奥の${STORY_PLAN[FIELD_STORY[FIELD.f]].icon}を倒そう`);
    tone(140, .05, "square", .03); return; }
  FIELD.walking = true;
  stepTo(nx, ny).then(() => { if(FIELD) FIELD.walking = false; });
}
// 1歩進む。出会い・出口ならtrue（歩くのをやめる）
async function stepTo(x, y){
  FIELD.x = x; FIELD.y = y;
  SAVE.field = {f:FIELD.f, x, y}; saveSave(SAVE);
  placeFHero();
  const h = $("fHero"); h.classList.remove("step"); void h.offsetWidth; h.classList.add("step");
  const c = fieldTile(FIELD.f, x, y);
  if(isBossTile(FIELD.f, x, y)){   // 奥の敵（物語）
    const id = FIELD_STORY[FIELD.f];
    if(nextStory() === id){ await sleep(200); openChapter(id); }
    else fieldMsg("👀 強そうな敵が道をふさいでいる……。まずは📚寺子屋で、師匠の話を聞こう");
    return true;
  }
  if(c === "U"){
    if(FIELD.f + 1 < FIELDS.length){ await sleep(200); const nf = FIELD.f + 1; needTraining(nf, () => enterField(nf, "bottom")); }
    else fieldMsg("🚧 この先は、まだ道がない（準備中）");
    return true;
  }
  if(c === "D"){
    await sleep(200);
    if(FIELD.f === 0){ FIELD = null; SAVE.here = "gate"; saveSave(SAVE); showVillage(); }
    else enterField(FIELD.f - 1, "top");
    return true;
  }
  if(c === "G"){
    tone(900 + Math.random() * 200, .02, "triangle", .02);
    if(FIELD.safe > 0){ FIELD.safe--; return false; }
    if(Math.random() < .12){ await encounter(); return true; }
  }else if(FIELD.safe > 0) FIELD.safe--;
  return false;
}
async function encounter(){
  const F = FIELDS[FIELD.f];
  /* 出会い方：名のある忍 4%・小判鼠 3%・それ以外はふつうの野良忍者。ふつうの野良忍者は、2%で「金色の気」をまとっている */
  const r = Math.random();
  const kind = r < .04 ? F.named : r < .07 ? "koban" : pick(F.kinds);
  const W = WILD[kind];
  // 地方のLvの範囲のうち、低めのLvが出やすい（着いたばかりで強い相手ばかり、をさける）
  const lv = W.special ? W.lv : F.lv[0] + Math.floor(Math.pow(Math.random(), 1.8) * (F.lv[1] - F.lv[0] + 1));
  const foe = makeWild(kind, lv);
  if(!W.special && kind !== "koban" && Math.random() < .02){
    foe.golden = true; foe.name = "金色の" + foe.name;
    foe.hp = Math.round(foe.hp * 1.25); foe.atk = Math.round(foe.atk * 1.15);
  }
  SAVE.dex = SAVE.dex || {};
  const d = SAVE.dex[kind] = SAVE.dex[kind] || {seen:0, beat:0};
  d.seen++; saveSave(SAVE);
  // がさがさ演出
  const g = $("fGrid"); g.classList.add("rustle");
  [300, 500, 300, 700].forEach((f, i) => tone(f, .08, "square", .05, i * .09));
  await sleep(700);
  g.classList.remove("rustle");
  const w = WILD[kind];
  const sp = w.special || foe.golden;
  if(sp){   // 特別な忍者の演出：画面が光り、特別な音
    const fl = $("specialFx"); fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go");
    [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => tone(f, .14, "triangle", .07, .2 + i * .08));
    await sleep(900);
  }
  const head = w.special ? `<div class="sp-tag">✨ 名のある忍 ✨</div><h3>${esc(w.title)}が現れた！</h3>`
    : foe.golden ? `<div class="sp-tag gold">✨ 金色の気をまとっている！ ✨</div><h3>めずらしい野良忍者が現れた！</h3>` : `<h3>野良忍者が現れた！</h3>`;
  const prize = w.special ? `<p class="sp-prize">🎁 倒すと秘宝「${EQUIP[w.item].icon}${EQUIP[w.item].name}」が手に入る${SAVE.got[w.item] ? "かも" : "！"}・経験値と両が3倍</p>`
    : foe.golden ? `<p class="sp-prize">🎁 倒すと、ときどき秘宝を落とす・経験値2倍・両5倍</p>` : "";
  modal(`<div class="enc-ic${sp ? " sp" : ""}${foe.golden ? " gold" : ""}">${w.icon}</div>${head}<p style="font-size:20px"><b>${esc(foe.name)}</b>　Lv${lv}${d.beat ? "" : `　<span class="new">${d.seen > 1 ? "" : "はじめて！"}</span>`}</p>
    <p style="font-size:13px">${w.note}<br>${abText(w)}${abList(w).length ? "<br>" : ""}${foeStatText(foe)}</p>${prize}`,
    [["戦う！", () => { closeModal(); startWild(foe); }], ["逃げる", () => { closeModal(); FIELD.safe = 4; fieldMsg("うまく逃げた……"); }]]);
}
function wildCh(w){
  // その地方で学ぶ章（修行で練習した内容）から出題する（2026-11-23、教員の指示）
  const id = FIELD ? FIELD_STORY[FIELD.f] : "ichi";
  return CHAPTERS[chIndex(id)];
}
function startWild(foe){
  const w = WILD[foe.kind];
  startBattle({mode:"wild", ch:wildCh(w), foe, time:Math.max(12, 26 - Math.floor(foe.lv / 3)), xp:Math.max(1, Math.round(foe.lv / 3)), lv:foe.lv, kind:foe.kind});
}
function showDex(){
  const dex = SAVE.dex || {};
  const n = Object.keys(WILD).filter(k => dex[k] && dex[k].seen).length;
  let html = `<h3>📖 野良忍者図鑑（${n}/${Object.keys(WILD).length}）</h3><div class="dex">`;
  Object.entries(WILD).forEach(([k, w]) => {
    const d = dex[k];
    const where = FIELDS.filter(F => F.kinds.includes(k) || F.named === k).map(F => F.name).join("・") || "どこかの草むら（めったに出ない）";
    if(w.special && !(d && d.seen)){ html += `<div class="dexit unk sp"><span class="dic">✨</span><b>名のある忍　？？？</b><small>${where}（めったに出ない）</small></div>`; return; }
    html += d && d.seen
      ? `<div class="dexit${w.special ? " sp" : ""}"><span class="dic">${w.icon}</span><b>${w.special ? "✨" : ""}${w.name} ${elemTag(w.elem)}</b><small>${w.special ? `「${esc(w.title)}」Lv${w.lv}・秘宝：${SAVE.got[w.item] ? EQUIP[w.item].icon + EQUIP[w.item].name : "？？？"}<br>` : ""}${abList(w).map(a => `【${ABILITY[a].name}】`).join("")}${w.note}<br>出会った${d.seen}・倒した${d.beat}　｜${where}</small></div>`
      : `<div class="dexit unk"><span class="dic">？</span><b>？？？</b><small>${where}</small></div>`;
  });
  modal(html + `</div>`, [["とじる", closeModal]]);
}

/* =====================================================================
   はじめ
   ===================================================================== */
updateMuteBtn();
// 外の矢印ボタン：押し続けると歩き続ける
document.querySelectorAll(".dpad").forEach(btn => {
  let t = null;
  const go = () => arrowStep(+btn.dataset.dx, +btn.dataset.dy);
  btn.addEventListener("pointerdown", e => { e.preventDefault(); try{ btn.setPointerCapture(e.pointerId); }catch(err){} go(); clearInterval(t); t = setInterval(go, 190); });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => btn.addEventListener(ev, () => { clearInterval(t); t = null; }));
  btn.addEventListener("contextmenu", e => e.preventDefault());
});
document.addEventListener("keydown", e => {
  if(!$("sField").classList.contains("show") || $("modal").classList.contains("show")) return;
  const k = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0]}[e.key];
  if(k){ e.preventDefault(); arrowStep(k[0], k[1]); }
});
if(!SAVE.introSeen){
  playStory([
    ["nar", "ここは山奥の忍びの里、<span class=em>変化の里</span>。"],
    ["shisho", "目が覚めたか、見習いよ。今日からおぬしも、この里の忍じゃ。"],
    ["shisho", "里には<span class=em>城・道場・寺子屋・よろず屋・茶屋</span>がある。行きたい場所をタップすれば、歩いて行けるぞ。"],
    ["shisho", "<span class=em>城</span>では任務がもらえる。<span class=em>里の門</span>から外へ出れば、野良忍者との勝負もある。両や装備を集め、強い忍をめざすのじゃ。"],
    ["shisho", "おぬしの力は、言葉の<span class=em>【活用】</span>をどれだけ身につけたかで決まる。学べば学ぶほど強くなる。"],
    ["shisho", "……じゃが、今はそれどころではない。大変なことが起きたのじゃ。<span class=em>寺子屋</span>へ来てくれ。"],
  ], () => { SAVE.introSeen = 1; saveSave(SAVE); showVillage(); });
}else showVillage();
