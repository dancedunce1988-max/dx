<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>九尾の化かし合い</title>
<!-- 知識ドリルDXのミニゲーム「九尾の化かし合い」（2026-09-29〜、準備中）。kokugo_app.htmlの
     ミニゲーム一覧から、のびる読解(nobiru/*.html)と同じく同じタブのまま画面ごと遷移してくる別ページ。
     本体のセーブデータ(st)には一切触れず、このページ専用のlocalStorageキーだけを使う
     （経験値・ジャンルレベルにはまだ反映しない）。
     2026-09-30、教員の指示で「九本の尾を1本ずつ取る」形をやめ、話ごとに見破り方が変わるストーリー仕立て
     （一〜六話）＋全部の見破り方がまざって出る90秒の「挑戦の間」（七）に作り替えた
     （「同じことを何度もやらされる感じで飽きる」「間違いを探す楽しさを複数の視点から」という指摘による）。
     九尾(ub05)の絵は本番と同じスプライトを使う。色違い(enemy_sprites_shiny_data.js、約7MB)は
     全話クリア後に色違いを選んだときだけ後から読み込む（ensureShinySprites参照）。
     読み込めなかったときは🦊の絵文字で代用する。 -->
<script src="ura_boss_sprites_data.js"></script>
<script src="kitsune_stroke_data.js"></script>
<style>
  :root{
    --bg1:#0a0714; --bg2:#1a0f24; --bg3:#2d1530;
    --fox:#ff9a3c; --fox2:#ffd08a;
    --gold:#ffd76b; --verm:#d3462f;
    --ofuda:#fbf1d9; --ofudaInk:#3a2a12;
    --ok:#5fd08a; --ng:#ff6b6b;
    --text:#f6efff; --sub:#b3a6cc;
    --panel:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:
      radial-gradient(1.5px 1.5px at 14% 10%, rgba(255,255,255,.8), transparent),
      radial-gradient(1px 1px at 32% 22%, rgba(255,255,255,.55), transparent),
      radial-gradient(1.5px 1.5px at 72% 7%, rgba(255,255,255,.75), transparent),
      radial-gradient(1px 1px at 88% 26%, rgba(255,255,255,.5), transparent),
      radial-gradient(ellipse at 50% -10%, var(--bg3) 0%, var(--bg2) 45%, var(--bg1) 100%);
    background-color:var(--bg1);
    font-family:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
    color:var(--text); -webkit-font-smoothing:antialiased;
    user-select:none; -webkit-user-select:none;
  }
  button{ font-family:inherit; }
  .mincho{ font-family:'Hiragino Mincho ProN','Yu Mincho','YuMincho','BIZ UDMincho',serif; }
  .screen{ display:none; height:100vh; height:100dvh; }
  .screen.show{ display:flex; }

  #muteBtn{
    position:fixed; top:10px; right:12px; z-index:50; width:38px; height:38px; border-radius:50%;
    border:1px solid var(--line); background:rgba(0,0,0,.35); color:var(--text); font-size:17px; cursor:pointer;
  }
  body.in-game #muteBtn, body.in-game #backLink, body.in-story #backLink{ display:none; }

  /* ---- 九尾の絵・セリフ ---- */
  .fox-img{ width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 0 12px rgba(255,154,60,.45)); }
  .fox-emoji{ font-size:64px; display:flex; align-items:center; justify-content:center; width:100%; height:100%; }
  .hop{ animation:hop .4s ease; }
  @keyframes hop{ 0%,100%{transform:translateY(0)} 40%{transform:translateY(-8%)} }
  .shiver{ animation:shiver .4s ease; }
  @keyframes shiver{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6%)} 40%{transform:translateX(6%)} 60%{transform:translateX(-4%)} 80%{transform:translateX(4%)} }
  .bubble{
    position:relative; background:rgba(255,255,255,.08); border:1px solid rgba(255,208,138,.35);
    border-radius:14px; padding:10px 12px; font-size:14px; line-height:1.65;
  }
  .bubble b{ color:var(--fox2); }

  .btn{
    display:block; width:100%; padding:13px; border-radius:14px; border:0; font-size:17px; font-weight:bold;
    color:#3a1408; background:linear-gradient(135deg,var(--fox2),var(--fox)); box-shadow:0 4px 16px rgba(255,154,60,.35); cursor:pointer;
  }
  .btn:hover{ filter:brightness(1.06); }
  .btn:disabled{ opacity:.45; cursor:default; filter:none; }
  .btn.secondary{ background:rgba(255,255,255,.08); color:var(--text); box-shadow:none; border:1px solid rgba(255,255,255,.2); font-size:15px; }
  .btn.small{ padding:9px; font-size:14px; }
  .btn[hidden]{ display:none; }
  .pill{ border:1px solid var(--line); background:rgba(0,0,0,.3); color:var(--text); border-radius:999px; font-size:12px; padding:2px 10px; cursor:pointer; }
  @keyframes pulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
  @keyframes got{ 0%{transform:scale(1)} 40%{transform:scale(1.4)} 100%{transform:scale(1)} }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  @keyframes fadeUp{ from{ transform:translateY(10px); opacity:0; } }

  /* =====================================================================
     一覧（タイトル兼、話の一覧）
     ===================================================================== */
  #scMap{ align-items:center; justify-content:center; padding:16px; }
  .map-wrap{ width:100%; max-width:1000px; display:grid; grid-template-columns:250px 1fr; gap:26px; align-items:center; }
  .map-left{ display:flex; flex-direction:column; gap:10px; }
  .map-left .fox{ height:clamp(130px, 30vh, 230px); cursor:pointer; }
  .map-title{ text-align:center; }
  .map-title h1{ font-size:30px; letter-spacing:5px; color:var(--fox2); text-shadow:0 0 18px rgba(255,154,60,.6); }
  .map-title .sub{ font-size:12px; color:var(--sub); letter-spacing:2px; }
  .map-right{ display:flex; flex-direction:column; gap:12px; }
  .ep-list{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .ep-btn{
    position:relative; display:grid; grid-template-columns:40px 1fr auto; align-items:center; gap:10px; text-align:left;
    border-radius:14px; border:1.5px solid rgba(255,255,255,.18); background:rgba(255,255,255,.05);
    color:var(--text); padding:8px 12px; cursor:pointer;
  }
  .ep-btn .n{ font-size:24px; font-weight:bold; color:var(--fox2); text-align:center; }
  .ep-btn .t{ font-size:15px; font-weight:bold; }
  .ep-btn .d{ font-size:11px; color:var(--sub); line-height:1.4; margin-top:1px; }
  .ep-btn .st{ font-size:11px; font-weight:bold; white-space:nowrap; }
  .ep-btn .st.clear{ color:var(--gold); }
  .ep-btn .st.new{ color:#3a1408; background:var(--fox2); border-radius:999px; padding:1px 8px; }
  .ep-btn.cleared{ background:linear-gradient(160deg,rgba(255,215,107,.18),rgba(255,154,60,.06)); border-color:rgba(255,215,107,.45); }
  .ep-btn.next{ border-color:var(--fox2); box-shadow:0 0 14px rgba(255,208,138,.55); animation:pulse 1.6s ease-in-out infinite; }
  .ep-btn.locked{ opacity:.35; cursor:default; }
  .ep-btn.challenge{ grid-column:1 / -1; background:linear-gradient(135deg,rgba(211,70,47,.28),rgba(255,154,60,.12)); border-color:rgba(255,154,60,.55); }
  .ep-btn.challenge.locked{ background:rgba(255,255,255,.04); border-color:rgba(255,255,255,.18); }
  .ep-btn:hover:not(.locked){ filter:brightness(1.15); }
  .map-btns{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .back-link{ position:fixed; top:10px; left:12px; z-index:50; }

  /* =====================================================================
     ストーリー（会話）
     ===================================================================== */
  #scStory{ align-items:center; justify-content:center; padding:16px; }
  .story-wrap{ width:100%; max-width:900px; display:grid; grid-template-columns:260px 1fr; gap:24px; align-items:center; }
  .story-wrap .fox{ height:clamp(160px, 42vh, 320px); }
  .story-box{
    position:relative; cursor:pointer; min-height:220px; display:flex; flex-direction:column; gap:8px;
    background:linear-gradient(180deg,rgba(40,20,50,.92),rgba(20,10,30,.92)); border:2px solid rgba(255,208,138,.45);
    border-radius:20px; padding:18px 22px; box-shadow:0 0 30px rgba(255,154,60,.2);
  }
  .story-ep{ font-size:12px; color:var(--sub); letter-spacing:2px; }
  .story-name{ align-self:flex-start; font-size:13px; font-weight:bold; color:#3a1408; background:var(--fox2); border-radius:999px; padding:1px 12px; }
  .story-name[hidden]{ display:none; }
  .story-text{ flex:1; font-size:clamp(17px, 2.8vh, 21px); line-height:1.95; animation:fadeUp .35s ease; }
  .story-text.narr{ color:var(--sub); font-size:clamp(15px, 2.5vh, 18px); }
  .story-text b{ color:var(--fox2); }
  .story-foot{ display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--sub); }
  .story-next{ animation:pulse 1.2s ease-in-out infinite; }

  /* =====================================================================
     ゲーム画面（パソコン：左に状況、右に問題）
     ===================================================================== */
  #scGame{ position:relative; gap:28px; padding:16px 20px; width:100%; max-width:1180px; margin:0 auto; }
  .side{ width:290px; flex-shrink:0; display:flex; flex-direction:column; justify-content:center; gap:14px; }
  .side-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; color:var(--sub); }
  .side-top b{ color:var(--fox2); }
  .side-top .tools{ display:flex; gap:6px; flex-shrink:0; }
  .foxbox{ display:flex; flex-direction:column; gap:10px; }
  .foxbox .fox{ height:clamp(110px, 26vh, 210px); }
  .foxbox .bubble{ min-height:5.2em; }
  .prog-label{ font-size:12px; color:var(--sub); margin-bottom:6px; }
  .pips{ display:flex; flex-wrap:wrap; align-items:center; gap:7px; }
  .pip{ width:16px; height:16px; transform:rotate(45deg); border:2px solid var(--fox2); border-radius:3px; }
  .pip.on{ background:var(--gold); border-color:var(--gold); box-shadow:0 0 8px var(--gold); }
  .pip.on.got{ animation:got .5s ease; }
  .ch-box[hidden], .prog-box[hidden]{ display:none; }
  .scoreline{ display:flex; justify-content:space-between; align-items:baseline; }
  .scoreline .k{ font-size:12px; color:var(--sub); }
  .scoreline b{ font-size:32px; color:var(--gold); }
  .scoreline .plus{ font-size:15px; font-weight:bold; color:var(--gold); margin-left:6px; }
  .scoreline .plus.pop{ animation:fadeUp .4s ease; }
  .timer{ height:12px; border-radius:999px; background:rgba(255,255,255,.1); overflow:hidden; margin-top:8px; }
  .timer-fill{ height:100%; width:100%; background:linear-gradient(90deg,var(--fox),var(--gold)); }
  .timer-fill.hurry{ background:linear-gradient(90deg,var(--verm),var(--ng)); }
  .clock-label{ display:flex; justify-content:space-between; font-size:12px; color:var(--sub); margin-top:4px; }
  .clock-label b{ color:var(--text); font-size:15px; }
  .combo{ height:22px; text-align:center; font-weight:bold; color:var(--gold); font-size:15px; }
  .combo.pop{ animation:got .35s ease; }

  .board{ flex:1; min-width:0; min-height:0; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  .board-head{ font-size:15px; color:var(--sub); }
  .board-head b{ color:var(--gold); font-size:20px; }
  .qnote{ min-height:2.9em; text-align:center; font-size:15px; line-height:1.6; max-width:640px; }
  .qnote .ng{ color:var(--ng); font-weight:bold; }
  .qnote .okc{ color:var(--ok); font-weight:bold; }
  .qnote .mincho{ font-size:1.25em; }
  .qfoot{ min-height:46px; display:flex; justify-content:center; }
  .next-btn{ width:auto; padding:10px 40px; animation:fadeUp .3s ease; }

  /* ---- 札あらため（札を並べる） ---- */
  .grid{ flex:1; min-height:0; display:grid; gap:12px; width:100%; max-width:calc((100dvh - 80px) * var(--cols) / var(--rows) * .8); }
  .card{
    position:relative; border-radius:12px; border:0; cursor:pointer; container-type:size;
    background:linear-gradient(180deg,#fff9ea,var(--ofuda)); color:var(--ofudaInk);
    box-shadow:0 4px 0 #b89a62, 0 8px 16px rgba(0,0,0,.35);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:transform .1s, filter .1s;
  }
  .card:hover:not(.done){ transform:translateY(-3px); filter:brightness(1.04); }
  .card:active:not(.done){ transform:translateY(2px); }
  .card::before{ content:""; position:absolute; inset:6px; border:1.5px solid rgba(211,70,47,.35); border-radius:8px; pointer-events:none; }
  .card .word{ font-weight:bold; line-height:1.1; white-space:nowrap; }
  .card .word.l2{ font-size:min(36cqw, 30cqh); }
  .card .word.l3{ font-size:min(27cqw, 28cqh); }
  .card .word.l4{ font-size:min(21cqw, 24cqh); }
  .card .fix{ font-size:min(11cqw, 11cqh); margin-top:4cqh; font-weight:bold; }
  .card .fix s{ color:var(--verm); }
  .card .fix b{ color:#1b7a44; }
  .card .tag{ position:absolute; top:5cqh; left:0; right:0; text-align:center; font-size:min(10cqw,9cqh); font-weight:bold; }
  .card.deal{ animation:deal .35s ease backwards; }
  @keyframes deal{ from{ transform:translateY(24px) rotateY(80deg); opacity:0; } }
  .card.done{ cursor:default; }
  .card.found{ background:linear-gradient(180deg,#eafff0,#c9f2d6); animation:poof .45s ease; }
  .card.found .tag{ color:#1b7a44; }
  .card.real{ background:linear-gradient(180deg,#f4f4f4,#dcdcdc); opacity:.6; animation:shake .35s ease; }
  .card.real .tag{ color:#555; }
  .card.hint{ box-shadow:0 4px 0 #b89a62, 0 0 0 4px rgba(255,215,107,.9), 0 0 26px rgba(255,215,107,.9); animation:hintGlow 1s ease-in-out infinite; }
  @keyframes hintGlow{ 50%{ transform:scale(1.03); } }
  @keyframes poof{ 0%{transform:scale(1)} 35%{transform:scale(1.1) rotate(-3deg); filter:blur(1.5px)} 100%{transform:scale(1)} }
  .smoke{ position:absolute; font-size:min(30cqw,30cqh); pointer-events:none; animation:smoke .7s ease forwards; }
  @keyframes smoke{ 0%{opacity:1; transform:scale(.6)} 100%{opacity:0; transform:scale(1.8) translateY(-14px)} }
  .dizzy{ pointer-events:none; }
  .dizzy .card{ filter:saturate(.6); }

  /* ---- 問題の上に出す読みと熟語 ---- */
  .qhead{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .qhead .yomi{ font-size:14px; color:var(--sub); letter-spacing:2px; }
  .qhead .qword{ font-size:clamp(30px, 6vh, 48px); font-weight:bold; letter-spacing:4px; }
  .qhead .qword em{ font-style:normal; color:var(--fox2); text-decoration:underline wavy rgba(255,208,138,.6); text-underline-offset:6px; }

  /* ---- 部分あらため（大きな字の化けた部分を指さす） ---- */
  .bwrap, .cwrap, .fwrap, .dwrap{ width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  .bchar{ height:min(52vh, 86vw); aspect-ratio:1; background:linear-gradient(180deg,#fff9ea,var(--ofuda)); border-radius:18px; box-shadow:0 5px 0 #b89a62, 0 10px 22px rgba(0,0,0,.35); padding:3%; }
  .bchar svg{ width:100%; height:100%; display:block; cursor:crosshair; touch-action:manipulation; }
  .bchar .guide{ stroke:rgba(211,70,47,.22); stroke-width:.6; stroke-dasharray:2 2; fill:none; }
  .bchar .fk path{ fill:none; stroke:#2a1c0c; stroke-width:4.6; stroke-linecap:round; stroke-linejoin:round; transition:stroke .3s, opacity .3s; }
  .bchar .rl path{ fill:none; stroke:var(--ok); stroke-width:4.6; stroke-linecap:round; stroke-linejoin:round; opacity:0; }
  .bchar svg.solved .fk path.t{ stroke:var(--verm); animation:blink .5s ease 2; }
  .bchar svg.solved.fixed .fk path.t{ opacity:.18; }
  .bchar svg.solved.fixed .rl path{ opacity:1; stroke:#1b9a54; stroke-dasharray:1; stroke-dashoffset:1; animation:draw .6s ease forwards; }
  @keyframes blink{ 50%{ opacity:.25; } }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  .bmark{ font-size:12px; font-weight:bold; fill:var(--verm); animation:markFade .8s ease forwards; }
  @keyframes markFade{ 0%{opacity:1} 70%{opacity:1} 100%{opacity:0} }
  .bhint{ fill:rgba(255,215,107,.28); stroke:rgba(255,190,60,.9); stroke-width:1.2; animation:hintPulse 1s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes hintPulse{ 50%{ transform:scale(1.15); } }

  /* ---- 化けの皮はがし（化けた字を正しい字に直す） ---- */
  .ctiles{ display:flex; gap:12px; }
  .ctile{
    width:clamp(74px, 15vh, 128px); aspect-ratio:1; border:0; border-radius:14px; cursor:pointer;
    font-size:clamp(46px, 10vh, 88px); font-weight:bold; color:var(--ofudaInk);
    background:linear-gradient(180deg,#fff9ea,var(--ofuda)); box-shadow:0 4px 0 #b89a62, 0 8px 16px rgba(0,0,0,.35);
  }
  .ctile:hover:not(:disabled){ transform:translateY(-3px); }
  .ctile:disabled{ cursor:default; }
  .ctile.shake{ animation:shake .35s ease; }
  .ctile.bake{ background:linear-gradient(180deg,#ffe9e4,#ffc9bd); color:var(--verm); box-shadow:0 4px 0 #b3564a, 0 0 0 4px rgba(255,107,107,.5); }
  .ctile.fixed{ background:linear-gradient(180deg,#eafff0,#c9f2d6); color:#1b7a44; box-shadow:0 4px 0 #6aa37f; animation:poof .45s ease; }
  .cchoices{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; width:min(520px,100%); }
  .cchoices[hidden]{ display:none; }
  .cbtn{
    font-size:clamp(32px, 6.5vh, 50px); font-weight:bold; padding:8px 0; border-radius:14px; cursor:pointer;
    background:rgba(255,255,255,.08); color:var(--text); border:1.5px solid rgba(255,255,255,.25); animation:fadeUp .3s ease backwards;
  }
  .cbtn:hover:not(:disabled){ background:rgba(255,255,255,.16); }
  .cbtn:disabled{ cursor:default; }
  .cbtn.no{ opacity:.25; animation:shake .35s ease; }
  .cbtn.yes{ background:var(--ok); color:#0c3a1e; border-color:var(--ok); }

  /* ---- 高札（文の中の化け字） ---- */
  .kousatsu{
    width:min(780px, 100%); color:#2b1a08; border-radius:8px; padding:14px 22px 16px;
    background:linear-gradient(180deg,#e6c894,#d4ae72); border:7px solid #6e4520; box-shadow:0 10px 26px rgba(0,0,0,.45);
  }
  .ks-title{ text-align:center; font-weight:bold; letter-spacing:.6em; font-size:18px; border-bottom:1.5px solid rgba(110,69,32,.4); padding-bottom:4px; margin-bottom:4px; }
  .ks-line{ font-size:clamp(19px, 3.4vh, 28px); line-height:2.15; padding:0 4px; border-radius:6px; transition:background .3s; }
  .ks-line span{ position:relative; border-radius:4px; }   /* inlineのまま（inline-blockにすると行頭禁則が効かず「、」が行頭に来る） */
  .ks-line span.kj{ cursor:pointer; }
  .ks-line span.kj:hover{ background:rgba(255,255,255,.35); }
  .ks-line span.fk.hit{ color:var(--verm); background:rgba(211,70,47,.14); cursor:default; animation:poof .45s ease; }
  .ks-line span.fk.hit::after{ content:attr(data-fix); position:absolute; left:50%; top:-.78em; transform:translateX(-50%); font-size:.62em; line-height:1; color:#11703c; font-weight:bold; }
  .ks-line span.nope{ animation:nope .5s ease; }
  @keyframes nope{ 50%{ background:rgba(60,30,10,.3); } }
  .ks-line.hint{ background:rgba(255,236,160,.75); }
  .ks-fixes{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
  .ks-fix{ background:rgba(255,255,255,.08); border:1px solid var(--line); border-radius:10px; padding:6px 10px; font-size:13px; line-height:1.5; max-width:340px; animation:fadeUp .4s ease backwards; }
  .ks-fix .f{ color:var(--ng); font-weight:bold; font-size:16px; }
  .ks-fix .t{ color:var(--ok); font-weight:bold; font-size:16px; }

  /* ---- 茶屋の口車（本物か化け札かを見きわめる） ---- */
  .fwrap{ max-width:560px; margin:0 auto; }
  .fclaim{ width:100%; font-size:16px; text-align:center; }
  .fcard{ width:min(340px, 72vw); height:min(210px, 26vh); cursor:default; }
  .fcard .word{ font-size:min(30cqw, 50cqh); }
  .fcard.found .word, .fcard.realok .word{ font-size:min(26cqw, 38cqh); }
  .fcard.realok{ background:linear-gradient(180deg,#eef6ff,#d6e6fb); }
  .fbtns{ width:100%; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .fbtns .btn{ font-size:19px; padding:15px; }

  /* ---- 総仕上げ：化け札を見つけたら、その場で指さし→直す ---- */
  .deep{ position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; padding:8px; border-radius:18px; background:#140a1e; box-shadow:0 0 0 6px #140a1e; animation:fadeUp .25s ease; }

<body>
<button id="muteBtn" onclick="toggleMute()" title="音のオン・オフ">🔊</button>

<button class="pill back-link" id="backLink" onclick="backToApp()">← ミニゲーム一覧へ</button>

<!-- 一覧（タイトル兼、話の一覧） -->
<section id="scMap" class="screen show">
  <div class="map-wrap">
    <div class="map-left">
      <div class="fox" id="mapFox" onclick="foxTalk()" title="九尾に話しかける"></div>
      <div class="bubble" id="mapLine"></div>
    </div>
    <div class="map-right">
      <div class="map-title">
        <h1 class="mincho">九尾の化かし合い</h1>
        <div class="sub">― 化けた漢字を見破れ ―</div>
      </div>
      <div class="ep-list" id="epList"></div>
      <div class="map-btns">
        <button class="btn secondary" onclick="openZukan()" id="zukanBtn">化け字図鑑</button>
        <button class="btn secondary" id="shinyBtn" onclick="toggleShiny()" hidden></button>
      </div>
    </div>
  </div>
</section>

<!-- ストーリー（会話） -->
<section id="scStory" class="screen">
  <div class="story-wrap">
    <div class="fox" id="storyFox"></div>
    <div class="story-box" onclick="storyNext()">
      <div class="story-ep" id="storyEp"></div>
      <div class="story-name" id="storyName">九尾</div>
      <div class="story-text mincho" id="storyText"></div>
      <div class="story-foot">
        <button class="pill" onclick="event.stopPropagation(); storySkip()">とばす ≫</button>
        <span class="story-next">▼ タップで つぎへ</span>
      </div>
    </div>
  </div>
</section>

<!-- ゲーム -->
<section id="scGame" class="screen">
  <aside class="side">
    <div class="side-top">
      <span id="epLabel"></span>
      <span class="tools">
        <button class="pill mute-inline" onclick="toggleMute()" title="音のオン・オフ">🔊</button>
        <button class="pill" onclick="restAndMap()">ひと休み</button>
      </span>
    </div>
    <div class="foxbox">
      <div class="fox" id="gameFox"></div>
      <div class="bubble" id="gameLine"></div>
    </div>
    <div class="prog-box" id="progBox">
      <div class="prog-label" id="progLabel"></div>
      <div class="pips" id="pips"></div>
    </div>
    <div class="ch-box" id="chBox" hidden>
      <div class="scoreline"><span class="k">得点</span><span><b id="score">0</b><span class="plus" id="plus"></span></span></div>
      <div class="timer"><div class="timer-fill" id="timerFill"></div></div>
      <div class="clock-label"><span>見破った数 <b id="chCorrect">0</b></span><span>のこり <b id="timeLeft">90</b> 秒</span></div>
    </div>
    <div class="combo" id="combo"></div>
  </aside>
  <main class="board" id="board"></main>
</section>

<div class="banner" id="banner"></div>
<div class="modal" id="modal" onclick="if(event.target===this) closeModal()">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <div class="modal-body" id="modalBody"></div>
    <button class="btn secondary small" onclick="closeModal()">とじる</button>
  </div>
</div>

};
const pick = a => a[Math.floor(Math.random()*a.length)];
const fill = (s, o) => s.replace(/\{(\w)\}/g, (_, k) => o[k]);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const $ = id => document.getElementById(id);
function fakeWordOf(w){ return w[0].slice(0, w[2]) + w[3] + w[0].slice(w[2]+1); }
const realCharOf = w => w[0][w[2]];
const KANJI_RE = /[㐀-鿿々]/;
const strokesReady = () => typeof KITSUNE_STROKES !== "undefined" && typeof KITSUNE_DIFF !== "undefined";
const canPoint = w => strokesReady() && KITSUNE_DIFF[w[0]] && KITSUNE_DIFF[w[0]][2] === 1;

/* =====================================================================
   保存（この端末だけ）：クリアした話・図鑑のスタンプ・挑戦の間の最高記録・音・色違い
   図鑑 zk：{熟語: "ABCDF"のうち、その見破り方で見破ったことのある文字}
   旧版(kitsune_bakashiai_v3、九本の尾)で見破った化け字は、「札」のスタンプとして引きつぐ。

const SAVE_KEY = "kitsune_bakashiai_v4";
function loadSave(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){}
  if(!s){
    s = {};
    try{
      const old = JSON.parse(localStorage.getItem("kitsune_bakashiai_v3"));
      if(old){
        s.zk = {};
        (old.found || []).forEach(w => { s.zk[w] = "A"; });
        if(typeof old.muted === "boolean") s.muted = old.muted;
      }
    }catch(e){}
  }
  if(!Array.isArray(s.cleared)) s.cleared = [];
  if(!s.zk || typeof s.zk !== "object") s.zk = {};
  if(typeof s.best !== "number") s.best = 0;
  if(typeof s.bestCorrect !== "number") s.bestCorrect = 0;
  if(typeof s.chPlays !== "number") s.chPlays = 0;
  if(typeof s.muted !== "boolean") s.muted = false;
  if(typeof s.useShiny !== "boolean") s.useShiny = false;
  return s;
}
function writeSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); }catch(e){} }
let SAVE = loadSave();
writeSave();
const allCleared = () => EPISODES.every((_, i) => SAVE.cleared[i]);
const nextEpisode = () => { const i = EPISODES.findIndex((_, k) => !SAVE.cleared[k]); return i; };
const shinyOn = () => SAVE.useShiny && allCleared();
const zkCount = () => Object.keys(SAVE.zk).length;
const zkGold = () => Object.values(SAVE.zk).filter(s => s.length >= 5).length;

/* ---- 効果音（外部ファイルなし、WebAudioで鳴らす） ---- */
let AC = null;
function tone(freq, dur, opt = {}){
  if(SAVE.muted) return;
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + (opt.delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = opt.type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(opt.vol || .14, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur);
  }catch(e){}
}
const SE = {
  found(combo){ const up = Math.min(combo, 8) * 60; tone(880 + up, .09); tone(1320 + up, .16, {delay:.08}); },
  wrong(){ tone(220, .18, {type:"triangle", vol:.12}); tone(175, .25, {type:"triangle", vol:.1, delay:.12}); },
  close(){ tone(660, .08, {type:"triangle", vol:.08}); tone(620, .12, {type:"triangle", vol:.08, delay:.08}); },
  deal(i){ tone(500 + i*25, .04, {type:"triangle", vol:.05, delay:i*.04}); },
  start(){ tone(392, .12, {type:"triangle"}); tone(523, .2, {type:"triangle", delay:.12}); },
  clear(){ [523,659,784,1047].forEach((f,i) => tone(f, .22, {type:"triangle", delay:i*.09})); },
  hint(){ [1568,1319,1568].forEach((f,i) => tone(f, .12, {vol:.07, delay:i*.1})); },
  tick(){ tone(1000, .05, {type:"square", vol:.04}); },
  talk(){ tone(740, .04, {type:"triangle", vol:.04}); },
  win(){ [523,659,784,1047,784,1047,1319].forEach((f,i) => tone(f, .25, {type:"triangle", delay:i*.11})); },
};

/* =====================================================================
   ゲーム進行
   ・G.token：画面を離れたら古いsetTimeoutを無効にするための番号
   ・G.taskId：問題ごとの番号（前の問題のヒント用タイマーなどを無効にする）
   ・話：G.queueの問題を順に解く。茶屋の口車だけは、まちがえた問題のかわりを後ろに足す
     （「8回見きわめる」まで続く。まちがえても減るものはない）
   ・挑戦の間：CH_SECONDS秒のあいだ、A/B/C/D/Fの問題をまぜて出し続ける
   ===================================================================== */
let G = null, TOKEN = 0;
let RECENT = [];   // 直近に出た熟語（一覧に戻っても覚えておく。保存はしない）
function later(ms, fn){ const tk = G && G.token; setTimeout(() => { if(G && G.token === tk) fn(); }, ms); }
function laterTask(ms, fn){ const tk = G.token, t = G.taskId; setTimeout(() => { if(G && G.token === tk && G.taskId === t) fn(); }, ms); }

function newGame(opt){
  G = Object.assign({token:++TOKEN, taskId:0, combo:0, active:false, found:[]}, opt);
}
// 直近に出た熟語はなるべく避けて選ぶ
function pickWords(pool, n){
  const recent = new Set(RECENT);
  const fresh = shuffle(pool.filter(w => !recent.has(w[0])));
  const rest  = shuffle(pool.filter(w =>  recent.has(w[0])));
  const out = fresh.concat(rest).slice(0, n);
  RECENT = RECENT.concat(out.map(w => w[0])).slice(-40);
  return out;
}
const lvPool = lv => WORDS.filter(w => w[4] >= lv[0] && w[4] <= lv[1]);

function startEpisode(i){
  const E = EPISODES[i];
  showStory(`${E.no}話　${E.title}`, E.pre, () => playEpisode(i));
}
function playEpisode(i){
  const E = EPISODES[i];
  const tasks = E.mode === "F"
    ? Array.from({length:E.count}, () => ({mode:"F", lv:E.lv}))
    : E.tasks.map(t => Object.assign({mode:E.mode}, t));
  // 画のデータが読めなかったときは、部分あらためを化けの皮はがしで代用する
  if(!strokesReady()) tasks.forEach(t => { if(t.mode === "B") t.mode = "C"; });
  newGame({ep:i, challenge:false, queue:tasks, total:tasks.length, done:0});
  show("scGame");
  $("epLabel").innerHTML = `<b class="mincho">${E.no}話</b>　${E.title}`;
  $("progBox").hidden = false; $("chBox").hidden = true;
  $("progLabel").textContent = E.mode === "F" ? "見きわめた数（8回で勝ち）" : "進みぐあい";
  renderPips();
  setCombo(0);
  $("gameLine").innerHTML = pick(["さあ、化かし合いじゃ！","見破れるかのう？ ほほほ。","わらわの術、とくと見よ。"]);
  setFox($("gameFox"), "pose2", "hop");
  $("board").innerHTML = "";
  SE.start();
  showBanner(`<div class="big mincho">${E.no}話</div><div class="small mincho" style="font-size:clamp(20px,3.4vh,28px)">${E.title}</div>`);
  later(1100, () => { hideBanner(); nextTask(); });
}
function renderPips(justGot){
  $("pips").innerHTML = Array.from({length:G.total}, (_, i) => `<span class="pip ${i < G.done ? "on" : ""} ${justGot && i === G.done - 1 ? "got" : ""}"></span>`).join("");
}
function nextTask(){
  if(G.challenge) return nextChallengeTask();
  if(!G.queue.length) return episodeClear();
  runTask(G.queue.shift());
}
function runTask(task){
  G.taskId++;
  G.active = true;
  const board = $("board");
  board.innerHTML = "";
  const done = ok => {
    if(!G || G.over) return;
    G.active = false;
    if(!G.challenge){
      if(ok){ G.done++; renderPips(true); }
      else G.queue.push(Object.assign({}, task));  // 口車でまちがえたときだけ：かわりの1問を足す
    }
    nextTask();
  };
  RUN[task.mode](board, task, done);
}

/* ---- 正解・まちがいの共通処理 ---- */
function stamp(w, mode){
  if(!w) return false;
  const s = SAVE.zk[w[0]] || "";
  const isNew = !s;
  if(!s.includes(mode)) SAVE.zk[w[0]] = s + mode;
  writeSave();
  if(!G.found.some(x => x.w === w)) G.found.push({w, isNew});
  return isNew;
}
function onFound(w, mode){
  G.combo++;
  stamp(w, mode);
  SE.found(G.combo); setCombo(G.combo);
  if(G.challenge){
    const pts = 100 + Math.min(G.combo - 1, 5) * 20;
    G.score += pts; G.correct++;
    $("score").textContent = G.score; $("chCorrect").textContent = G.correct;
    const p = $("plus"); p.textContent = "+" + pts; p.classList.remove("pop"); void p.offsetWidth; p.classList.add("pop");
  }
  $("gameLine").innerHTML = G.combo >= 3 ? pick(LINES.combo) : pick(LINES.found);
  setFox($("gameFox"), "defense", "shiver");
}
function onMiss(line){
  G.combo = 0; setCombo(0);
  SE.wrong();
  $("gameLine").innerHTML = line || pick(LINES.fooled);
  setFox($("gameFox"), "attack", "hop");
}
function setCombo(n){
  const el = $("combo");
  el.textContent = n >= 2 ? `${n} れんぞく！` : "";
  if(n >= 2){ el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
}
// 解説を読んでから進む：話では「つぎへ」ボタン、挑戦の間・総仕上げの途中は自動で進む
function finishStep(foot, t, ok, done){

  const b = document.createElement("button");
  b.className = "btn next-btn"; b.textContent = "つぎへ ▶";
  b.onclick = () => { b.disabled = true; done(ok); };
  foot.appendChild(b);
}
const fixHtml = w => `<span class="ng mincho">${w[3]}</span> → <span class="okc mincho">${realCharOf(w)}</span>　${w[5]}`;

/* =====================================================================
   A 札あらため（E 総仕上げもこれを使い、化け札を見つけるたびに指さし→直すへ進む）
   ===================================================================== */
function layoutGrid(n){
  const portrait = window.innerWidth / window.innerHeight < 1 || window.innerWidth <= 700;
  const cols = n <= 9 ? 3 : (portrait ? 3 : 4);
  const rows = Math.ceil(n / cols);
  const g = $("grid");
  if(!g) return;
  g.style.setProperty("--cols", cols); g.style.setProperty("--rows", rows);
  g.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  g.style.gridTemplateRows = `repeat(${rows},1fr)`;
}
window.addEventListener("resize", () => { const g = $("grid"); if(g) layoutGrid(g.children.length); });
function lenCls(word){ return "word mincho l" + Math.min(4, Math.max(2, word.length)); }
function cardInner(c){
  if(c.state === "found"){
    return `<span class="tag">見破った！</span>
      <div class="${lenCls(c.w[0])}">${c.w[0]}</div>
      <div class="fix"><s>${c.w[3]}</s> → <b>${realCharOf(c.w)}</b></div>`;
  }
  const shown = c.fake ? fakeWordOf(c.w) : c.w[0];
  return (c.state === "real" ? `<span class="tag">本物</span>` : "") + `<div class="${lenCls(shown)}">${shown}</div>`;
}
function runA(board, t, done){
  const deepMode = t.mode === "E";
  const fakes = pickWords(deepMode ? lvPool(t.lv).filter(canPoint).concat(strokesReady() ? [] : lvPool(t.lv)) : lvPool(t.lv), t.fakes);
  const used = new Set(fakes.map(w => w[0]));
  const reals = pickWords(WORDS.filter(w => w[4] <= t.lv[1] && !used.has(w[0])), t.cards - t.fakes);
  const cards = shuffle(fakes.map(w => ({w, fake:true, state:"open"})).concat(reals.map(w => ({w, fake:false, state:"open"}))));
  let remaining = t.fakes;
  board.innerHTML = `<div class="board-head" id="aHead"></div><div class="grid" id="grid"></div>`;
  const head = () => $("aHead").innerHTML = remaining ? `化け札 あと <b>${remaining}</b> 枚` : `すべて見破った！`;
  head();
  layoutGrid(cards.length);
  const grid = $("grid");
  cards.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "card deal";
    b.style.animationDelay = (i * 0.04) + "s";
    b.innerHTML = cardInner(c);
    b.onclick = () => tap(i);
    grid.appendChild(b);
    SE.deal(i);
  });
  const update = i => { const el = grid.children[i]; el.className = "card done " + cards[i].state; el.style.animationDelay = "0s"; el.innerHTML = cardInner(cards[i]); };
  // しばらく見つからないときは、九尾が化け札を1枚光らせる
  const armHint = () => laterTask(G.challenge ? 12000 : 22000, () => {
    if(!G.active) return armHint();
    const i = cards.findIndex(c => c.fake && c.state === "open");
    if(i >= 0){ grid.children[i].classList.add("hint"); SE.hint(); $("gameLine").innerHTML = LINES.hint; setFox($("gameFox"), "pose1", "hop"); }
  });
  armHint();
  let busy = false;
  function tap(i){
    const c = cards[i];
    if(!G.active || busy || c.state !== "open") return;
    if(c.fake){
      c.state = "found"; remaining--;
      onFound(c.w, "A");
      update(i); head();
      const s = document.createElement("span"); s.className = "smoke"; s.textContent = "💨"; grid.children[i].appendChild(s);
      const after = () => { if(remaining <= 0){ G.active = false; laterTask(700, () => done(true)); } };
      if(deepMode){
        // 総仕上げ：その場で「どこが化けておる？」→「正しい字は？」
        busy = true;
        laterTask(450, () => {
          const deep = document.createElement("div"); deep.className = "deep"; board.appendChild(deep);
          const toC = () => runC(deep, {word:c.w, skipPick:true, auto:true}, () => { deep.remove(); busy = false; after(); });
          if(canPoint(c.w)) runB(deep, {word:c.w, auto:true}, toC); else toC();
        });
      }else after();
    }else{
      c.state = "real";
      onMiss();
      update(i);
      busy = true; grid.classList.add("dizzy");
      laterTask(500, () => { grid.classList.remove("dizzy"); busy = false; });
    }
  }
}

/* =====================================================================
   B 部分あらため：化けた字を大きく出し、化けている画（足りない画は本来の場所）を指でさす
   ===================================================================== */
function runB(el, t, done){
  const w = t.word || pickWords(lvPool(t.lv).filter(canPoint), 1)[0];
  const F = w[3], R = realCharOf(w);
  const [fu, ru] = KITSUNE_DIFF[w[0]];
  const fake = fakeWordOf(w);
  el.innerHTML = `<div class="bwrap">
    <div class="qhead"><span class="yomi">${w[1]}</span><span class="qword mincho">${[...fake].map((c, i) => i === w[2] ? `<em>${c}</em>` : c).join("")}</span></div>
    <div class="bchar"><svg viewBox="0 0 109 109" id="bsvg">
      <path class="guide" d="M54.5 2V107M2 54.5H107"/>
      <g class="fk">${KITSUNE_STROKES[F].map((d, i) => `<path d="${d}" class="${fu.includes(i) ? "t" : ""}"/>`).join("")}</g>
      <g class="rl">${ru.map(i => `<path d="${KITSUNE_STROKES[R][i]}" pathLength="1"/>`).join("")}</g>
      <g id="bmarks"></g></svg></div>
    <div class="qnote" id="bnote">「<span class="mincho">${F}</span>」の<b>どこが化けておる？</b>　指でさしてみよ</div>
    <div class="qfoot" id="bfoot"></div></div>`;
  const svg = el.querySelector("#bsvg");
  // ねらう場所：化けた字だけにある画＋本物だけにある画（＝足りない画のあるはずの場所）
  const pts = [];
  svg.querySelectorAll(".fk path.t, .rl path").forEach(p => {
    const L = p.getTotalLength(), n = Math.max(6, Math.ceil(L / 2.5));
    for(let k = 0; k <= n; k++){ const q = p.getPointAtLength(L * k / n); pts.push([q.x, q.y]); }
  });
  let misses = 0, solved = false, lock = false;
  svg.addEventListener("pointerdown", e => {
    if(!G.active || solved || lock || !pts.length) return;
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const d = Math.min(...pts.map(q => Math.hypot(q[0] - p.x, q[1] - p.y)));
    if(d <= 10.5){
      solved = true;
      svg.classList.add("solved");
      svg.querySelectorAll(".bhint").forEach(c => c.remove());
      onFound(w, "B");
      el.querySelector(".qword").innerHTML = [...w[0]].map((c, i) => i === w[2] ? `<em style="color:var(--ok)">${c}</em>` : c).join("");
      $("bnote").innerHTML = `そこじゃ！　${fixHtml(w)}`;
      laterTask(650, () => svg.classList.add("fixed"));
      finishStep($("bfoot"), t, true, done);
    }else{
      misses++;
      const m = document.createElementNS("http://www.w3.org/2000/svg", "text");
      m.setAttribute("x", p.x); m.setAttribute("y", p.y); m.setAttribute("text-anchor", "middle"); m.setAttribute("dominant-baseline", "middle");
      m.setAttribute("class", "bmark"); m.textContent = "✕";
      $("bmarks").appendChild(m);
      onMiss(pick(["そこは本物どおりじゃ。","ほほほ、そこは化けておらぬ。","ちがう、ちがう。よく見くらべよ。"]));
      lock = true; laterTask(350, () => lock = false);
      if(misses === 2){
        // ヒント：ねらう場所のまん中あたりを光らせる
        const cx = pts.reduce((s, q) => s + q[0], 0) / pts.length, cy = pts.reduce((s, q) => s + q[1], 0) / pts.length;
        const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
        const r = Math.max(12, Math.min(34, Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) / 2 + 6));
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.setAttribute("r", r); c.setAttribute("class", "bhint");
        svg.insertBefore(c, svg.querySelector(".fk"));
        SE.hint(); $("gameLine").innerHTML = "……しかたないのう。<b>このあたり</b>じゃ。";
      }
    }
  });
}

/* =====================================================================
   C 化けの皮はがし：化けた字をタップ→正しい字を4つから選ぶ（skipPick：化けた字は最初から示す）
   ===================================================================== */
function runC(el, t, done){
  const w = t.word || pickWords(lvPool(t.lv), 1)[0];
  const R = realCharOf(w);
  const opts = shuffle([R, ...[...(CHOICES[w[0]] || "")].slice(0, 3)]);
  const fake = fakeWordOf(w);
  el.innerHTML = `<div class="cwrap">
    <div class="qhead"><span class="yomi">${w[1]}</span></div>
    <div class="ctiles">${[...fake].map((c, i) => `<button class="ctile mincho" data-i="${i}">${c}</button>`).join("")}</div>
    <div class="qnote" id="cnote"></div>
    <div class="cchoices" id="cch" hidden>${opts.map(c => `<button class="cbtn mincho">${c}</button>`).join("")}</div>
    <div class="qfoot" id="cfoot"></div></div>`;
  const tiles = [...el.querySelectorAll(".ctile")];
  const note = el.querySelector("#cnote"), cch = el.querySelector("#cch");
  let picked = false, missPick = 0;
  const openChoices = () => {
    picked = true;
    tiles[w[2]].classList.add("bake");
    tiles.forEach(b => b.disabled = true);
    note.innerHTML = `化け字「<span class="ng mincho">${w[3]}</span>」の<b>正体</b>は？　正しい字を選べ`;
    cch.hidden = false;
  };
  if(t.skipPick) openChoices();
  else note.innerHTML = `この熟語は化けておる。<b>化けた字</b>をタップせよ`;
  tiles.forEach((b, i) => b.onclick = () => {
    if(!G.active || picked) return;
    if(i === w[2]){ SE.close(); openChoices(); }
    else{
      missPick++;
      b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
      onMiss("ほほほ、その字は本物じゃ。");
      if(missPick === 2){ tiles[w[2]].style.boxShadow = "0 4px 0 #b89a62, 0 0 0 4px rgba(255,215,107,.9), 0 0 22px rgba(255,215,107,.9)"; SE.hint(); }
    }
  });
  cch.querySelectorAll(".cbtn").forEach(b => b.onclick = () => {
    if(!G.active || b.disabled) return;
    if(b.textContent === R){
      b.classList.add("yes");
      cch.querySelectorAll(".cbtn").forEach(x => x.disabled = true);
      const tile = tiles[w[2]];
      tile.classList.remove("bake"); tile.classList.add("fixed"); tile.textContent = R;
      onFound(w, "C");
      note.innerHTML = `化けの皮がはがれた！　${fixHtml(w)}`;
      finishStep(el.querySelector("#cfoot"), t, true, done);
    }else{
      b.classList.add("no"); b.disabled = true;
      onMiss(pick(["ふふ、それも似ておるがちがうのう。","残念、その字ではない。"]));
    }
  });
}

/* =====================================================================
   D 高札：文の中の化けた字をタップする（1文に1つ）。同じ熟語の別の字は「おしい」
   ===================================================================== */
function sentenceHtml(w, li){
  const s = SENTENCES[w[0]];
  const a = s.indexOf("{"), b = s.indexOf("}");
  const plain = str => [...str].map(c => KANJI_RE.test(c) ? `<span class="kj">${c}</span>` : `<span>${c}</span>`).join("");
  const fake = [...fakeWordOf(w)];
  return `<p class="ks-line" data-l="${li}">` + plain(s.slice(0, a)) +
    fake.map((c, i) => i === w[2] ? `<span class="kj fk" data-l="${li}" data-fix="${realCharOf(w)}">${c}</span>` : `<span class="kj fw">${c}</span>`).join("") +
    plain(s.slice(b + 1)) + `</p>`;
}
function runD(el, t, done){
  const ws = pickWords(lvPool(t.lv).filter(w => SENTENCES[w[0]]), t.n);
  let remaining = ws.length, misses = 0;
  el.innerHTML = `<div class="dwrap">
    <div class="board-head" id="dHead"></div>
    <div class="kousatsu"><div class="ks-title mincho">${t.n > 1 ? "おしらせ" : "高札"}</div><div class="ks-body mincho">${ws.map(sentenceHtml).join("")}</div></div>
    <div class="qnote" id="dnote">文を読んで、<b>おかしな字</b>をタップせよ</div>
    <div class="ks-fixes" id="dfix"></div>
    <div class="qfoot" id="dfoot"></div></div>`;
  const head = () => el.querySelector("#dHead").innerHTML = remaining ? `化け字 あと <b>${remaining}</b> 字` : `すべて見破った！`;
  head();
  let lock = false;
  el.querySelector(".ks-body").addEventListener("click", e => {
    const sp = e.target.closest("span");
    if(!sp || !G.active || lock || !remaining) return;
    if(sp.classList.contains("fk")){
      if(sp.classList.contains("hit")) return;
      sp.classList.add("hit");
      const w = ws[+sp.dataset.l];
      remaining--; head();
      sp.parentElement.classList.remove("hint");
      onFound(w, "D");
      el.querySelector("#dfix").insertAdjacentHTML("beforeend",
        `<div class="ks-fix"><span class="f mincho">${fakeWordOf(w)}</span> → <span class="t mincho">${w[0]}</span>　${w[5]}</div>`);
      if(!remaining){
        el.querySelector("#dnote").innerHTML = "高札の化け字を、すべて見破った！";
        finishStep(el.querySelector("#dfoot"), t, true, done);
      }
    }else if(sp.classList.contains("fw")){
      SE.close();
      $("gameLine").innerHTML = LINES.close;
      setFox($("gameFox"), "pose2", "hop");
    }else if(sp.classList.contains("kj")){
      misses++;
      sp.classList.remove("nope"); void sp.offsetWidth; sp.classList.add("nope");
      onMiss("ほほほ、その字は本物じゃ。");
      lock = true; laterTask(300, () => lock = false);
      if(misses % 3 === 0){
        const f = el.querySelector(".fk:not(.hit)");
        if(f){ f.parentElement.classList.add("hint"); SE.hint(); $("gameLine").innerHTML = "……しかたないのう。<b>光っている文</b>の中じゃ。"; }
      }
    }
  });
}

/* =====================================================================
   F 茶屋の口車：九尾の言葉（本当かうそかは半々）にまどわされず、本物か化け札かを決める
   ===================================================================== */
function runF(el, t, done){
  const w = pickWords(lvPool(t.lv), 1)[0];
  const isFake = Math.random() < .5, claimFake = Math.random() < .5;
  const lie = isFake !== claimFake;
  const shown = isFake ? fakeWordOf(w) : w[0];
  el.innerHTML = `<div class="fwrap">
    <div class="fclaim bubble"><b>九尾</b>「${pick(claimFake ? LINES.claimFake : LINES.claimReal)}」</div>
    <div class="card fcard" id="fcard"><div class="${lenCls(shown)}">${shown}</div></div>
    <div class="fbtns"><button class="btn secondary" id="fReal">本物</button><button class="btn" id="fFake">化け札！</button></div>
    <div class="qnote" id="fnote">この札は、本物か？ 化け札か？</div>
    <div class="qfoot" id="ffoot"></div></div>`;
  const card = el.querySelector("#fcard");
  const answer = sayFake => {
    if(!G.active || card.dataset.done) return;
    card.dataset.done = "1";
    el.querySelectorAll(".fbtns .btn").forEach(b => b.disabled = true);
    const ok = sayFake === isFake;
    if(isFake){ card.className = "card fcard done found"; card.innerHTML = cardInner({w, fake:true, state:"found"}); }
    else{ card.className = "card fcard done realok"; card.innerHTML = `<span class="tag" style="color:#2a5a9a">本物</span><div class="${lenCls(w[0])}">${w[0]}</div>`; }
    if(ok){
      onFound(isFake ? w : null, "F");
      if(lie) $("gameLine").innerHTML = pick(LINES.liedCaught);
    }else{
      onMiss(lie ? "ほほほ、わらわのうそに乗せられたのう！" : "ふふ、わらわは本当のことを言うておったのに。");
    }
    el.querySelector("#fnote").innerHTML = (ok ? "<b style='color:var(--ok)'>見きわめた！</b>　" : "<b style='color:var(--ng)'>化かされた……</b>　") +
      (isFake ? fixHtml(w) : `これは本物の「<span class="mincho">${w[0]}</span>」（${w[1]}）じゃ。`) +
      (!G.challenge && !ok ? "<br><span style='font-size:13px;color:var(--sub)'>かわりの札が1枚ふえるぞ。</span>" : "");
    finishStep(el.querySelector("#ffoot"), t, ok, done);
  };
  el.querySelector("#fReal").onclick = () => answer(false);
  el.querySelector("#fFake").onclick = () => answer(true);
}

const RUN = {A:runA, E:runA, B:runB, C:runC, D:runD, F:runF};

/* ---- 話のクリア ---- */
function episodeClear(){
  G.active = false;
  const i = G.ep, E = EPISODES[i];
  const wasAll = allCleared();
  SAVE.cleared[i] = true; writeSave();
  SE.clear();
  setFox($("gameFox"), "defeat");
  $("gameLine").innerHTML = "ぐぬぬ……見事じゃ。";
  const chips = G.found.slice(0, 12).map((x, k) => `<span class="chip" style="animation-delay:${.4 + k*.07}s">
      <span class="f mincho">${fakeWordOf(x.w)}</span> → <span class="t mincho">${x.w[0]}</span>${x.isNew ? `<span class="new">図鑑NEW</span>` : ""}</span>`).join("");
  showBanner(`<div class="big mincho">${E.no}話 クリア！</div>
    <div class="small">見破った化け字 <b style="color:var(--gold)">${G.found.length}</b> 個</div>
    <div class="chips">${chips}</div>
    <div class="banner-btns one"><button class="btn" id="bnGo">つづきを見る ▶</button></div>`, true);
  $("bnGo").onclick = () => {
    hideBanner();
    const epTitle = `${E.no}話　${E.title}`;
    if(G){ G.token++; }
    showStory(epTitle, E.post, () => { if(!wasAll && allCleared()) SE.win(); showMap(); });
  };
}

/* =====================================================================
   七 挑戦の間：CH_SECONDS秒で、一〜五話の見破り方をまぜて出す。時間が来たら「記録」として終わる
   （負けではない。まちがえても減点はなく、連続が切れるだけ）。
   正解1つ＝100点＋連続ボーナス（2連続目から20点ずつ、最大+100点）。
   正解数が増えるほど、むずかしい熟語もまざる。
   ===================================================================== */
let clockId = null;
function stopClock(){ if(clockId){ clearInterval(clockId); clockId = null; } }
function startChallenge(){
  newGame({challenge:true, score:0, correct:0, over:false, last:null});
  show("scGame");
  $("epLabel").innerHTML = `<b class="mincho">七</b>　挑戦の間`;
  $("progBox").hidden = true; $("chBox").hidden = false;
  $("score").textContent = "0"; $("chCorrect").textContent = "0"; $("plus").textContent = "";
  $("timeLeft").textContent = CH_SECONDS; $("timerFill").style.width = "100%"; $("timerFill").classList.remove("hurry");
  setCombo(0);
  $("gameLine").innerHTML = `${CH_SECONDS}秒勝負じゃ！　どこまで見破れるかのう？`;
  setFox($("gameFox"), "attack", "hop");
  $("board").innerHTML = "";
  SE.start();
  showBanner(`<div class="big mincho">挑戦の間</div><div class="small">${CH_SECONDS}秒で、どれだけ見破れるか！<br><span style="font-size:.85em;color:var(--sub)">見破り方は、一問ごとに変わる</span></div>`);
  later(1600, () => { hideBanner(); startClock(); nextChallengeTask(); });
}
function startClock(){
  stopClock();
  const t0 = performance.now();
  let lastSec = CH_SECONDS;
  clockId = setInterval(() => {
    if(!G || !G.challenge || G.over){ stopClock(); return; }
    const left = Math.max(0, CH_SECONDS - (performance.now() - t0) / 1000);
    $("timerFill").style.width = (left / CH_SECONDS * 100) + "%";
    const sec = Math.ceil(left);
    if(sec !== lastSec){
      lastSec = sec; $("timeLeft").textContent = sec;
      if(sec <= 10 && sec > 0){ $("timerFill").classList.add("hurry"); SE.tick(); }
    }
    if(left <= 0) finishChallenge();
  }, 100);
}
function nextChallengeTask(){
  if(G.over) return;
  const lv = G.correct < 4 ? [1,1] : G.correct < 10 ? [1,2] : [1,3];
  const modes = ["A","B","C","D","F"].filter(m => m !== G.last && (m !== "B" || strokesReady()));
  const m = pick(modes);
  G.last = m;
  const task = m === "A" ? {mode:"A", cards:6, fakes:1, lv} : m === "D" ? {mode:"D", n:1, lv} : {mode:m, lv};
  runTask(task);
}
function finishChallenge(){
  if(G.over) return;
  G.over = true; G.active = false; stopClock();
  $("timeLeft").textContent = 0; $("timerFill").style.width = "0%";
  const prev = SAVE.best;
  const isNew = G.score > prev;
  if(isNew) SAVE.best = G.score;
  if(G.correct > SAVE.bestCorrect) SAVE.bestCorrect = G.correct;
  SAVE.chPlays++;
  writeSave();
  SE.win();
  setFox($("gameFox"), "defeat", "hop");
  $("gameLine").innerHTML = G.correct >= 15 ? "ま、参った……なんという目じゃ。" : G.correct >= 8 ? "ふむ、なかなかやるのう。" : "ふふ、次はもっと見破ってみせよ。";
  showBanner(`<div class="big mincho">そこまで！</div>
    <div class="score-big">${G.score}<small>点</small></div>
    <div class="small">見破った数 <b style="color:var(--gold)">${G.correct}</b>　／　これまでの最高 ${Math.max(prev, G.score)}点</div>
    ${isNew && prev > 0 ? `<div class="newrec">最高記録こうしん！</div>` : ""}
    <div class="rank">称号<b class="mincho">${rankName(G.score)}</b></div>
    <div class="banner-btns"><button class="btn" id="bnAgain">もう一度 挑戦</button><button class="btn secondary" id="bnMap">一覧へ</button></div>`, true);
  $("bnAgain").onclick = () => { hideBanner(); startChallenge(); };
  $("bnMap").onclick = () => showMap();
}
// 称号の目安：1問4〜6秒で15〜20問見破り、連続もつながると3000点前後
function rankName(score){
  if(score >= 4000) return "九尾も認める 見破りの名人";
  if(score >= 3000) return "化け字の達人";
  if(score >= 2000) return "腕利きの見破り手";
  if(score >= 1000) return "一人前の見破り手";
  return "見破り手の見習い";
}

function restAndMap(){ stopClock(); showMap(); }

/* ---- 中央の大きな表示 ---- */
function showBanner(html, clickable){
  const b = $("banner");
  b.innerHTML = `<div class="panel">${html}</div>`;
  b.className = "banner show" + (clickable ? " clickable" : "");
}
function hideBanner(){ $("banner").className = "banner"; }

showMap();
</script>
