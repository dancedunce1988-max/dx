<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知識ドリルDX</title>
<style>
  :root{
    --bg:#f7f4ee; --card:#ffffff; --ink:#2b2b2b; --sub:#6b6b6b;
    --accent:#c0392b; --accent2:#2c6e63; --line:#e4ded3;
    --ok:#2e7d32; --ng:#c62828; --okbg:#e8f5e9; --ngbg:#fdecea;
    --gold:#b8860b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.7;
    display:flex; justify-content:center; min-height:100vh;
  }
  #app{width:100%; max-width:720px; padding:16px 16px 48px;}
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:12px 4px 16px; border-bottom:3px double var(--line); margin-bottom:16px;
  }
  header h1{font-size:1.35rem; letter-spacing:.15em;}
  header h1 span{color:var(--accent);}
  header h1 .ver-tag{color:var(--sub); font-size:.62rem; letter-spacing:0; margin-left:6px; font-weight:normal; vertical-align:middle;}
  .header-actions{display:flex; gap:8px; flex-shrink:0;}
  header .home-btn{
    background:none; border:1px solid var(--line); border-radius:8px;
    padding:6px 14px; cursor:pointer; font-size:.85rem; color:var(--sub);
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:20px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .menu-card{cursor:pointer; transition:transform .1s, box-shadow .1s; display:flex; gap:12px; align-items:center; padding:14px 16px;}
  .menu-card:hover{transform:translateY(-2px); box-shadow:0 4px 10px rgba(0,0,0,.08);}
  .menu-icon{
    font-size:1.3rem; width:44px; height:44px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg); border-radius:10px;
  }
  .menu-card h2{font-size:.98rem; margin-bottom:0;}
  .menu-card p{font-size:.78rem; color:var(--sub);}
  .menu-card .right{margin-left:auto; text-align:right; flex-shrink:0;}
  .menu-card.review{border-left:5px solid var(--accent);}
  /* ストーリーモードの章解放システム（2026-07-19〜）で、まだ解放されていない章のカードに使う。 */
  .menu-card.locked{cursor:default; opacity:.55;}
  /* 期間限定イベントバナー */
  .event-banner{border:2px solid #e8a000; background:linear-gradient(135deg,#fffbe6,#fff3c0); padding:14px 16px;}
  .event-banner-head{font-size:1.05rem; font-weight:bold; color:#b87000; margin-bottom:4px;}
  .event-banner-body{font-size:.88rem; line-height:1.7; color:#333;}
  .event-banner-pts{font-size:1.1rem; font-weight:bold; color:#c05000; margin-top:4px;}
  /* 言の刃ゲーム内イベント表示 */
  .bg-event-hud{position:absolute; top:6px; right:8px; font-size:.72rem; background:rgba(255,200,0,.18); border:1px solid #e8a000; border-radius:6px; padding:2px 8px; color:#8a5000; font-weight:bold; pointer-events:none;}
  .menu-card.locked:hover{transform:none; box-shadow:none;}
  .menu-card.locked .menu-icon{background:var(--line); color:var(--sub);}
  .menu-card.locked .shogo-badge{background:var(--sub);}
  .menu-card.balanced-btn{
    background:linear-gradient(135deg, var(--accent2), var(--accent));
    border:none; padding:20px 16px; margin-bottom:18px;
    box-shadow:0 6px 16px rgba(0,0,0,.18);
  }
  .menu-card.balanced-btn:hover{transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.22);}
  .menu-card.balanced-btn .menu-icon{background:rgba(255,255,255,.22); font-size:1.7rem; width:54px; height:54px;}
  .menu-card.balanced-btn h2{color:#fff; font-size:1.15rem;}
  .menu-card.balanced-btn p{color:rgba(255,255,255,.9);}
  .count{font-size:.7rem; color:var(--sub); display:block;}
  .shogo-badge{
    display:inline-block; font-size:.78rem; font-weight:bold; padding:2px 10px;
    border-radius:99px; background:var(--accent2); color:#fff; white-space:nowrap;
  }
  .shogo-badge.top{background:var(--gold);}
  /* 第8章「体育祭」の組バッジ（2026-07-22〜、教員の指示で組団カラーに変更）。碧組・紅組・黄組は
     既存のテーマカラー（--accent2/--accent/--gold）が偶然にも近い色味だったのでそのまま流用し、
     蒼組（青系）だけ新しい色を追加した。 */
  .shogo-badge.kumi-jupiter{background:var(--accent2);}   /* 碧組（ジュピター） */
  .shogo-badge.kumi-rigel{background:#2f5fa8;}             /* 蒼組（ライジェル） */
  .shogo-badge.kumi-rose{background:var(--accent);}        /* 紅組（ローズ） */
  .shogo-badge.kumi-amaterasu{background:var(--gold);}     /* 黄組（アマテラス） */
  .tag{
    display:inline-block; font-size:.72rem; padding:1px 8px; border-radius:99px;
    background:var(--bg); color:var(--accent2); border:1px solid var(--line); margin-left:6px;
  }
  .session-bar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:14px; font-size:.85rem; color:var(--sub); flex-wrap:wrap;
  }
  .session-bar .catstat{
    background:linear-gradient(135deg, #2c6e63, #1d4f47); color:#fff;
    border-radius:99px; padding:4px 14px; font-size:.82rem; font-weight:bold;
  }
  .session-bar .recent-acc{ color:var(--accent2); font-weight:bold; }
  .q-category{font-size:.75rem; color:var(--accent2); letter-spacing:.1em; margin-bottom:6px; display:flex; gap:10px; flex-wrap:wrap;}
  .q-category .redo{color:var(--accent); font-weight:bold;}
  .q-sub{font-size:.85rem; color:var(--sub); margin-bottom:4px;}
  .q-text{font-size:1.15rem; font-weight:bold; margin-bottom:16px; white-space:pre-wrap;}
  .tech-mark{
    background:none; color:var(--accent); font-weight:bold;
    text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:3px;
    padding:0 1px;
  }
  .choices{display:flex; flex-direction:column; gap:10px;}
  /* 漢文の返り点選択問題（ckb）で、白文が長い（上下点＋レ点混在など9〜11字）場合、
     選択肢を縦書きの4択のまま縦に並べると画面が非常に長くなってしまう。該当する場合だけ
     .choices-kanbun-rowを付与し、横に並べて折り返す（教員の指摘、2026-08-04）。 */
  .choices.choices-kanbun-row{ flex-direction:row; flex-wrap:wrap; }
  .choices.choices-kanbun-row .choice{ flex:0 0 auto; }
  .choice{
    text-align:left; background:var(--card); border:2px solid var(--line);
    border-radius:10px; padding:12px 16px; font-size:.98rem; cursor:pointer;
    transition:border-color .1s, background .1s; font-family:inherit; line-height:1.6;
  }
  .choice:hover:not(:disabled){border-color:var(--accent2);}
  .choice:disabled{cursor:default;}
  .choice.correct{border-color:var(--ok); background:var(--okbg);}
  .choice.wrong{border-color:var(--ng); background:var(--ngbg);}
  .choice.dim{opacity:.55;}
  .choice.selected{border-color:var(--accent2); background:#eef6f4;}
  .choice-num{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:50%; background:var(--bg); color:var(--sub);
    font-size:.75rem; font-weight:bold; margin-right:10px; flex-shrink:0; vertical-align:middle;
  }
  .choice.selected .choice-num{background:var(--accent2); color:#fff;}
  .ans-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .ans-input{
    flex:1; min-width:200px; font-size:1.1rem; padding:12px 14px;
    border:2px solid var(--line); border-radius:10px; font-family:inherit;
  }
  .ans-input:focus{outline:none; border-color:var(--accent2);}
  .ans-input:disabled{background:var(--bg); color:var(--sub);}
  .feedback{margin-top:16px; border-radius:10px; padding:14px 16px; font-size:.92rem; display:none;}
  .feedback.show{display:block;}
  .feedback.ok{background:var(--okbg); border:1px solid var(--ok);}
  .feedback.ng{background:var(--ngbg); border:1px solid var(--ng);}
  .feedback .verdict{font-weight:bold; margin-bottom:4px;}
  .feedback.ok .verdict{color:var(--ok);}
  .feedback.ng .verdict{color:var(--ng);}
  .lvup-chip{
    display:inline-block; background:var(--gold); color:#fff; font-weight:bold;
    font-size:.8rem; border-radius:99px; padding:2px 12px; margin-left:8px;
    animation:pop .35s ease;
  }
  .evolve{
    text-align:center; font-size:1.25rem; font-weight:bold; color:var(--gold);
    background:#fdf6e3; border:2px solid var(--gold); border-radius:12px;
    padding:14px; margin-top:12px; animation:pop .4s ease;
  }
  @keyframes pop{0%{transform:scale(.7); opacity:0;} 100%{transform:scale(1); opacity:1;}}
  /* 「問題全開放のお祝い」演出（2026-08-03〜）。既存の.evolve（解禁通知）より一段派手にして、
     マイルストーン到達という「お祝い」の瞬間だとひと目でわかるようにする。 */
  @keyframes celebrateShine{
    0%,100%{ box-shadow:0 0 14px rgba(184,134,11,.35), 0 0 0 rgba(192,57,43,0); }
    50%{ box-shadow:0 0 28px rgba(184,134,11,.65), 0 0 14px rgba(192,57,43,.25); }
  }
  .celebrate{
    text-align:center; font-size:1.1rem; font-weight:bold; color:#fff;
    background:linear-gradient(150deg,#ffb703 0%,#fb8500 100%);
    border:2px solid var(--gold); border-radius:12px;
    padding:14px; margin-top:12px; line-height:1.6;
    animation:pop .4s ease, celebrateShine 1.8s ease-in-out infinite;
  }
  .btn{
    display:inline-block; background:var(--accent2); color:#fff; border:none;
    border-radius:10px; padding:12px 28px; font-size:1rem; cursor:pointer;
    font-family:inherit; margin-top:16px;
  }
  .btn.secondary{background:var(--card); color:var(--ink); border:1px solid var(--line);}
  .btn.inline{margin-top:0; padding:12px 20px;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap;}
  .passage{
    background:#fffdf7; border:1px solid var(--line); border-radius:10px;
    padding:18px; font-size:.95rem; margin-bottom:18px; max-height:320px; overflow-y:auto;
  }
  .passage p{text-indent:1em; margin-bottom:.4em;}
  .passage-title{font-weight:bold; margin-bottom:8px; text-indent:0 !important;}
  .result-score{font-size:2.6rem; font-weight:bold; text-align:center; color:var(--accent2); margin:8px 0;}
  .combo-countdown{font-size:4.5rem; font-weight:bold; text-align:center; color:var(--accent2); margin:48px 0; animation:pop .3s ease;}
  .match-rows{display:flex; flex-direction:column; gap:8px; margin:14px 0;}
  .match-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px; border:2px solid var(--line); border-radius:10px;
    transition:border-color .15s, background .15s;
  }
  .match-desc{flex:1; font-size:.9rem; line-height:1.6;}
  .match-select{font-size:.88rem; padding:6px 8px; border-radius:8px; border:1px solid var(--line); font-family:inherit; flex-shrink:0;}
  .match-select:disabled{color:var(--ink); opacity:1;}
  .result-msg{text-align:center; color:var(--sub); margin-bottom:8px;}
  table.stats{width:100%; border-collapse:collapse; font-size:.86rem;}
  table.stats th, table.stats td{padding:8px 6px; border-bottom:1px solid var(--line); text-align:left;}
  table.stats td.num{text-align:right;}
  .bar{height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:4px;}
  .bar > div{height:100%; background:var(--accent2);}
  .weak{color:var(--accent); font-size:.8rem;}
  /* 出題中も常に見える「問題解放率」フッター（2026-08-02〜）。screen.innerHTMLの子として
     出し入れされるだけなので、他の画面に遷移すればinnerHTML入れ替えで自動的に消える
     （bodyにクラスを付け外しするような後始末は不要）。固定表示ぶんの高さは、直後の
     .unlock-footer-spacerで埋め合わせ、下部ボタンがフッターの裏に隠れないようにする。 */
  .unlock-footer{
    position:fixed; left:0; right:0; bottom:0; max-width:720px; margin:0 auto;
    background:var(--card); border-top:1px solid var(--line); box-shadow:0 -2px 8px rgba(0,0,0,.06);
    padding:8px 16px; display:flex; align-items:center; gap:10px; font-size:.76rem; color:var(--sub); z-index:400;
  }
  .unlock-footer .bar{flex:1; margin-top:0;}
  .unlock-footer-pct{font-weight:bold; color:var(--accent2); flex-shrink:0;}
  .unlock-footer-spacer{height:60px;}
  /* ================= 漢字の書き取り学習 ================= */
  .kw-level-card.disabled{cursor:default; opacity:.5;}
  .kw-level-card.disabled:hover{transform:none; box-shadow:none;}
  .kw-level-tag{
    display:inline-block; background:var(--accent2); color:#fff; font-weight:bold;
    border-radius:99px; padding:2px 12px; font-size:.85rem; margin-right:8px; flex-shrink:0;
  }
  .kw-level-acc{font-size:.78rem; color:var(--sub);}
  .kw-sentence{
    font-size:1.55rem; font-weight:bold; line-height:1.9; margin:20px 0 22px; text-align:center;
    white-space:pre-wrap;
  }
  .kw-answer-box{text-align:center; margin:18px 0 22px;}
  .kw-answer-kanji{
    /* Windows機種・バージョンごとにUDデジタル教科書体の登録名がゆれるため、
       新しい名前（Win11 24H2以降で統合された名前）から順に並べ、
       見つからない環境ではHGS教科書体→明朝体にフォールバックする。 */
    font-family:"UD デジタル 教科書体 NP","UD デジタル 教科書体 NP-R","UD デジタル 教科書体 N-R",
      "HGS教科書体","HG教科書体","Yu Mincho",serif;
    font-size:4.2rem; font-weight:normal; color:var(--accent2); line-height:1.2;
  }
  .kw-info-card{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; margin-top:4px; font-size:.9rem; line-height:1.8;
  }
  .kw-info-card h4{font-size:.85rem; color:var(--accent2); margin-bottom:4px;}
  .kw-info-card .kw-char-block{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
  .kw-info-card .kw-char-block:first-child{margin-top:0; padding-top:0; border-top:none;}
  .kw-selfjudge-row{display:flex; gap:12px; margin-top:20px;}
  .kw-ok-btn, .kw-ng-btn{
    flex:1; border:none; border-radius:10px; padding:16px; font-size:1.05rem; font-weight:bold;
    cursor:pointer; font-family:inherit;
  }
  .kw-ok-btn{background:var(--ok); color:#fff;}
  .kw-ng-btn{background:var(--ng); color:#fff;}
  .kw-lv-badge{
    text-align:center; font-weight:bold; color:var(--accent2); margin-bottom:14px; font-size:1.05rem;
  }
  /* 百人一首・一覧モードのカード（かるた風に、番号＋歌をひとまとまりで見せる） */
  .hyakunin-card{padding:14px 16px;}
  .hyakunin-head{display:flex; align-items:center; gap:12px; cursor:pointer;}
  .hyakunin-no{
    flex-shrink:0; width:34px; height:34px; border-radius:50%; background:var(--accent);
    color:#fff; font-weight:bold; font-size:.85rem; display:flex; align-items:center; justify-content:center;
  }
  .hyakunin-poem-inline{flex:1; font-size:.95rem; line-height:1.6;}
  .hyakunin-shimo{color:var(--sub);}
  .hyakunin-toggle{flex-shrink:0; color:var(--sub); font-size:.8rem;}
  .hyakunin-detail{margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); font-size:.9rem; line-height:1.85;}
  .hyakunin-detail-row b{color:var(--accent2);}
  .hyakunin-authorinfo, .hyakunin-techdetail{color:var(--sub); font-size:.85rem;}
  .hyakunin-marked-poem{font-size:1rem; line-height:1.8; margin:4px 0;}
  .hyakunin-highlight{
    margin-top:8px; background:var(--bg); border-left:4px solid var(--gold);
    border-radius:0 8px 8px 0; padding:10px 12px; font-size:.85rem;
  }
  .hyakunin-highlight b{display:block; color:var(--gold); margin-bottom:2px;}
  .note{font-size:.78rem; color:var(--sub); margin-top:10px;}
  h3.section{font-size:1rem; margin:18px 0 10px; padding-left:10px; border-left:4px solid var(--accent);}
  h3.section:first-child{margin-top:0;}
  .mastery{display:flex; gap:14px; font-size:.8rem; color:var(--sub); margin-top:8px; flex-wrap:wrap;}
  .mastery b{color:var(--ink);}
  ul.misslist{list-style:none; margin-top:6px;}
  ul.misslist li{
    padding:8px 4px; border-bottom:1px dashed var(--line); font-size:.88rem;
    display:flex; justify-content:space-between; gap:10px; align-items:baseline;
  }
  ul.misslist .cat{font-size:.72rem; color:var(--accent2); white-space:nowrap;}
  ul.titlelist{list-style:none; font-size:.88rem; columns:2; column-gap:24px;}
  ul.titlelist li{padding:4px 0; border-bottom:1px dashed var(--line); break-inside:avoid;}
  .signature{text-align:right; font-size:.68rem; color:var(--line); margin-top:18px; letter-spacing:.05em;}
  .kotonoha-card{background:linear-gradient(135deg,#fffdf7,#fbf2e0);}
  .kotonoha-row{display:flex; gap:16px; align-items:center;}
  .kotonoha-icon{
    font-size:2.4rem; width:64px; height:64px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg); border-radius:50%; border:2px solid var(--line);
    cursor:pointer;
  }
  .kotonoha-icon.kotonoha-type1{filter:grayscale(.75) brightness(.85); border-color:#9a9284;}
  .kotonoha-icon.kotonoha-type2{border-color:var(--accent2);}
  .kotonoha-icon.kotonoha-type3{filter:saturate(1.5) brightness(1.05); border-color:#e08a2b; box-shadow:0 0 10px rgba(224,138,43,.35);}
  .kotonoha-icon.kotonoha-type4{filter:saturate(1.35); border-color:var(--gold); box-shadow:0 0 14px rgba(184,134,11,.55);}
  .kotonoha-icon.kotonoha-type5{filter:saturate(1.5) brightness(1.05); border-color:#e0512b; box-shadow:0 0 10px rgba(224,81,43,.4);}
  .kotonoha-icon.kotonoha-type6{filter:saturate(1.5) brightness(1.05); border-color:#2b9ee0; box-shadow:0 0 10px rgba(43,158,224,.4);}
  .kotonoha-icon.kotonoha-type7{filter:saturate(1.5) brightness(1.05); border-color:#8a5ce0; box-shadow:0 0 10px rgba(138,92,224,.4);}
  .kotonoha-icon.kotonoha-type8{filter:saturate(1.5) brightness(1.05); border-color:#e02b8a; box-shadow:0 0 10px rgba(224,43,138,.4);}
  .kotonoha-icon.kotonoha-type9{filter:saturate(1.5) brightness(1.05); border-color:#e068a8; box-shadow:0 0 10px rgba(224,104,168,.4);}
  .kotonoha-icon.kotonoha-overridden{border-color:#8e44ad; box-shadow:0 0 10px rgba(142,68,173,.5);}
  .kotonoha-icon.kotonoha-icon-img{
    width:88px; height:88px; object-fit:contain; font-size:0; box-sizing:border-box;
    background:var(--card); border-color:var(--gold); border-width:3px; border-radius:10px;
  }
  .kotonoha-rebirth-note{background:var(--bg); border:1px dashed var(--line); border-radius:8px; padding:8px 10px; margin-top:10px;}
  .kotonoha-info{flex:1; min-width:0;}
  .kotonoha-name{font-weight:bold; font-size:1.05rem;}
  .kotonoha-stage{
    display:inline-block; font-size:.68rem; font-weight:bold; color:#fff; background:var(--sub);
    border-radius:6px; padding:1px 7px; margin-right:6px; vertical-align:middle;
  }
  .kotonoha-stage.final{ background:var(--gold); box-shadow:0 0 8px rgba(184,134,11,.6); }
  .kotonoha-type{
    display:inline-block; font-size:.7rem; color:var(--accent2); background:var(--bg);
    border:1px solid var(--line); border-radius:99px; padding:1px 10px; margin:3px 0 5px;
  }
  /* 「ことのはの称号」バッジ（旧「すがた」、2026-08-01〜）。カスタム表示中を示す既存の紫アクセント
     （.kotonoha-icon.kotonoha-overriddenと同系色）を流用し、分野レベルごとの称号バッジ
     （.shogo-badge）と混同しないよう視覚的に区別する。 */
  .kotonoha-shogo-badge{
    display:inline-block; font-size:.7rem; color:#8e44ad; background:var(--bg);
    border:1px solid #8e44ad; border-radius:99px; padding:1px 10px; margin:3px 0 5px 4px;
  }
  /* 伝説級到達時のホーム画面背景演出（教員の指示、2026-08-01〜）。#appのpadding(16px 16px 48px)を
     打ち消す負のマージンで、画面の端まで色が届くようにする。中のカード群の見た目は変えない。 */
  .kotonoha-legendary-bg{

  .kotonoha-legendary-bg-shigen{ background-image:linear-gradient(120deg,#ff6a3d,#ffe98a 20%,#4f9c3a 40%,#2b6fd6 60%,#8a5ce0 80%,#ff6a3d); }
  /* 伝説級の淡い（seiki）系統だけ、カード内の文字色が浮かないよう既存のink色のままでよいが、
     見出し等の白文字前提の演出（もしあれば）と衝突しないことを別途確認済み（カードは元々不透明な
     白背景を持つため、背景演出は主にカードの外側の余白・隙間にだけ見える）。 */
  .kotonoha-xp{font-size:.82rem; color:var(--sub); margin-top:2px; margin-bottom:2px;}

  .kanbun-box{
    writing-mode: vertical-rl; text-orientation: upright;
    font-size:1.6rem; line-height:3.1; letter-spacing:.35em;
    background:#fffdf7; color:#2b2b2b; border:1px solid var(--line); border-radius:10px;
    padding:20px 30px; margin-bottom:16px; display:inline-block; min-height:170px;
  }
  .kb-char{ position:relative; display:inline-block; }
  /* 送り仮名・返り点の注記は、本文と同じ縦書き（vertical-rl）を基本とする（教員の指示、
     2026-08-04：「文字が重ならないなら縦書きにしてほしい」）。.kanbun-boxのline-height/
     letter-spacingを広めに確保済み（2026-08-04の別修正）なので、1〜4文字程度の注記は
     縦書きのままでも上下の文字と重ならない。letter-spacingは継承されるプロパティなので、
     本文側の広い字間をそのまま引き継ぐと注記の文字どうしの間隔まで不必要に広がってしまう
     （実測で発覚）ため、注記側は明示的にnormalへ戻す。 */
  .kb-ok{
    position:absolute; right:-.3em; bottom:.1em;
    letter-spacing:normal;
    font-size:.4em; color:var(--sub); line-height:1.05; white-space:nowrap;
  }
  /* 5文字以上の長い送り仮名（「ザルガゴトクニシテ」等の決まり文句をまとめて添えた場合）だけは、
     縦書きのままだと高さが伸びて上下の文字と重なってしまうため、横書き（writing-mode:
     horizontal-tb）に切り替えたうえで折り返す（2026-08-04、教員の指摘。「重なるなら横書きでよい」
     との指示どおり、重なりが実際に起きる長い注記だけを例外的に横書きにする）。 */
  .kb-ok.kb-long{
    writing-mode: horizontal-tb; text-orientation: mixed;
    font-size:.3em; white-space:normal; max-width:3em; text-align:right; right:-.35em;
  }
  .kb-mark{
    position:absolute; left:-.3em; bottom:.1em;
    letter-spacing:normal;
    font-size:.46em; color:var(--accent); font-weight:bold; line-height:1.05; white-space:nowrap;
  }

  .finisher-btn.secondary{

  /* 必殺技の「溜め」「技名」演出は、ボス戦カード内(#fb)だと目立たず見づらいため、
     .boss-battle-screenの構造を無視してdocument.body直下に全画面オーバーレイで出す
     （教員の指示、2026-07-20）。showFinisherOverlay/hideFinisherOverlayが動的に生成・削除する。 */
  .finisher-overlay{
    position:fixed; inset:0; z-index:9500;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 50%, rgba(45,20,70,.88) 0%, rgba(8,4,14,.94) 75%);
    padding:24px; text-align:center; pointer-events:none;
    animation:finisherOverlayFadeIn .25s ease;
  }
  .finisher-overlay-text{
    color:#ffe9a8; font-weight:bold; font-size:1.4rem; line-height:1.6;
    text-shadow:0 0 10px rgba(184,134,11,.8);
    animation:finisherChargePulse .9s ease infinite;
  }
  .finisher-overlay-text.finisher-name-big{
    font-size:3rem; letter-spacing:.06em;
    background:linear-gradient(90deg,#ffe08a,#ffd76a,#fff3c4,#ffd76a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:none; filter:drop-shadow(0 0 26px rgba(255,215,100,.85));
    animation:bossVictoryPop .4s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes finisherOverlayFadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes finisherChargePulse{
    0%{ opacity:.5; } 50%{ opacity:1; text-shadow:0 0 22px rgba(184,134,11,1); } 100%{ opacity:.85; }
  }
  .boss-battle-screen.finisher-shake{ animation:finisherShake .55s ease; }
  @keyframes finisherShake{
    0%{ transform:translate(0,0); box-shadow:0 0 30px rgba(140,90,255,.25); }
    15%{ transform:translate(-7px,3px); box-shadow:0 0 50px rgba(184,134,11,.9); }
    30%{ transform:translate(6px,-3px); }
    45%{ transform:translate(-5px,2px); box-shadow:0 0 50px rgba(184,134,11,.9); }
    60%{ transform:translate(4px,-2px); }
    75%{ transform:translate(-2px,1px); }
    100%{ transform:translate(0,0); box-shadow:0 0 30px rgba(140,90,255,.25); }
  }
  /* 系統別必殺技の演出を系統ごとに個性化（教員の指示、2026-08-01〜）。言霊一閃／大きないびき
     （fxクラス無し）は上の既存スタイルのまま変更しない。系統技を使ったときだけ、
     showFinisherOverlay/triggerFinisherShakeがfx-◯◯クラスを追加してここが効く。 */
  .finisher-line-portrait{
    display:block; width:min(30vw,120px); height:min(30vw,120px); object-fit:contain; box-sizing:border-box;
    background:rgba(255,255,255,.12); border-radius:12px; margin:0 auto 10px; border:2px solid rgba(255,255,255,.6);
  }
  /* 天翔（風）：水色、素早く鋭い斜め振動 */
  .finisher-overlay.fx-tensho{ background:radial-gradient(circle at 50% 50%, rgba(30,70,90,.88) 0%, rgba(4,14,18,.95) 75%); }
  .finisher-overlay-text.fx-tensho{ color:#d8faff; text-shadow:0 0 10px rgba(102,224,255,.9); }
  .finisher-overlay-text.finisher-name-big.fx-tensho{
    background:linear-gradient(90deg,#8fe8ff,#c9f8ff,#eafcff,#8fe8ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 26px rgba(102,224,255,.85));
  }
  .boss-battle-screen.finisher-shake.fx-tensho{ animation:finisherShakeTensho .4s ease; }
  @keyframes finisherShakeTensho{
    0%{ transform:translate(0,0); } 20%{ transform:translate(-10px,4px) rotate(-1deg); }
    40%{ transform:translate(9px,-4px) rotate(1deg); } 60%{ transform:translate(-7px,3px); }
    80%{ transform:translate(5px,-2px); } 100%{ transform:translate(0,0); }
  }
  /* 焔獄（火）：赤〜オレンジ、縦方向の素早いチラつき */
  .finisher-overlay.fx-engoku{ background:radial-gradient(circle at 50% 50%, rgba(90,30,10,.88) 0%, rgba(18,4,4,.95) 75%); }
  .finisher-overlay-text.fx-engoku{ color:#ffd9b8; text-shadow:0 0 10px rgba(255,106,61,.9); }
  .finisher-overlay-text.finisher-name-big.fx-engoku{
    background:linear-gradient(90deg,#ff6a3d,#ffae42,#ffcf7a,#ff6a3d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 26px rgba(255,106,61,.85));
  }
  /* 灼熱の連撃：連続使用数が多いほど発光が強くなる（4段階、上限あり） */
  .finisher-overlay-text.fx-engoku.fx-engoku-c1{ filter:brightness(1.1); }
  .finisher-overlay-text.fx-engoku.fx-engoku-c2{ filter:brightness(1.25); }
  .finisher-overlay-text.fx-engoku.fx-engoku-c3{ filter:brightness(1.4) saturate(1.15); }
  .finisher-overlay-text.fx-engoku.fx-engoku-c4{ filter:brightness(1.6) saturate(1.3); }
  .boss-battle-screen.finisher-shake.fx-engoku{ animation:finisherShakeEngoku .5s ease; }
  @keyframes finisherShakeEngoku{
    0%{ transform:translate(0,0); box-shadow:0 0 30px rgba(255,106,61,.3); }

  .prologue-text{color:#f5f1e6; font-size:1.15rem; line-height:1.9; max-width:480px; white-space:pre-line; opacity:0; animation:prologueRise .7s ease forwards .25s;}
  .prologue-hint{position:absolute; bottom:26px; color:#c9c2a8; font-size:.78rem; opacity:0; animation:prologueRise .7s ease forwards .9s;}
  .prologue-skip{position:absolute; top:18px; right:20px; color:#c9c2a8; font-size:.78rem; text-decoration:underline; padding:4px;}
  @keyframes prologueFadeIn{from{opacity:0} to{opacity:1}}
  @keyframes prologueRise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
  /* ===== ストーリーモード（削除する場合はこのブロックとJS内の「ストーリーモード」ブロックを削除するだけでよい） ===== */
  .menu-card.story-btn{background:linear-gradient(135deg, #2e7d32, #43a047); border:none;}
  .menu-card.story-btn:hover{transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.22);}
  .menu-card.story-btn .menu-icon{background:rgba(255,255,255,.22); font-size:1.7rem; width:54px; height:54px;}
  .menu-card.story-btn h2{color:#fff; font-size:1.15rem;}
  .menu-card.story-btn p{color:rgba(255,255,255,.9);}
  /* ミニゲーム（旧サブクエスト）の入口カード。ストーリーモードの直下、ホーム画面に
     独立して置く（教員の指示、2026-08-17〜）。story-btnと見分けがつくよう別の色にする。 */
  .menu-card.minigame-btn{background:linear-gradient(135deg, #5e35b1, #8561d6); border:none;}
  .menu-card.minigame-btn:hover{transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.22);}
  .menu-card.minigame-btn .menu-icon{background:rgba(255,255,255,.22); font-size:1.7rem; width:54px; height:54px;}
  .menu-card.minigame-btn h2{color:#fff; font-size:1.15rem;}
  .menu-card.minigame-btn p{color:rgba(255,255,255,.9);}
  .story-scene{text-align:left;}
  .story-speaker{font-weight:bold; color:var(--accent2); margin-bottom:6px; font-size:.95rem;}
  .story-face{float:right; width:78px; margin:0 0 8px 12px; border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,.15);}
  .story-face.story-face-emoji{
    height:78px; display:flex; align-items:center; justify-content:center;
    font-size:2.2rem; background:var(--bg); border:1px solid var(--line);
  }
  .story-text{white-space:pre-line; line-height:1.85; margin:4px 0 6px;}
  .story-choices{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  .story-chapter-end{font-size:1.2rem; font-weight:bold; text-align:center; margin-bottom:10px; color:var(--accent);}
  /* 選択肢問題（judgedChoice、正誤あり）を、地の文の分岐用choice（正誤なし）と見た目で
     はっきり区別するための専用スタイル（2026-07-17〜）。カード左端に金色のラインを入れ、
     「正しいものを選んでください」の目印バッジを金色で強調する。 */
  .judged-scene{ border-left:5px solid var(--gold); }
  .judged-badge{
    display:inline-block; background:rgba(184,134,11,.12); color:var(--gold);
    border:1.5px solid var(--gold); font-weight:bold; font-size:.85rem;
    border-radius:8px; padding:3px 12px; margin:2px 0 12px;
  }
  /* 校正ミニゲーム（proofread beat、2026-07-17〜、第3章の中ボス代わり）。文章を単語単位の
     タップ可能な.proof-tokenに分割して表示する。誤字トークンを見つけると.found、正しい
     言葉を誤ってタップすると.tried（そのトークンはそれ以降タップ不可）、時間切れ/クリア後に
     見つけられなかった誤字を.missedで開示する。色は既存の.choice.correct/.wrongと同じ変数を流用。 */
  .proof-passage{ line-height:2.4; font-size:1.05rem; }
  .proof-token{ cursor:pointer; padding:1px 3px; border-radius:4px; transition:background .15s,color .15s; }
  .proof-token:hover{ background:rgba(255,255,255,.08); }
  .proof-token.found{ background:var(--okbg); color:var(--ok); font-weight:bold; text-decoration:underline; cursor:default; }
  .proof-token.tried{ background:var(--ngbg); color:var(--ng); opacity:.6; cursor:default; }
  .proof-token.missed{ background:var(--ngbg); color:var(--ng); text-decoration:underline wavy; cursor:default; }

  /* 語句選択ミニゲーム（wordPick beat、2026-07-22〜、第8章の中ボス代わり）。単語をチップ状の
     ボタンとして並べて表示する。found/tried/missedの色付けは.proof-tokenのルールをそのまま
     共用する（要素にproof-token wordpick-tokenの両方のクラスを付与するため、新しい色ルールは
     追加していない）。 */
  .wordpick-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .wordpick-token{ display:inline-block; background:var(--card); border:2px solid var(--line); border-radius:10px; padding:6px 12px; font-size:.95rem; }

  /* 野球ミニゲーム（baseball beat、2026-07-17〜、第4章用）。既存の.boss-name/.boss-q-card/
     .boss-timer-bar/.choices/.choiceは他の中ボスと共通のまま再利用し、スコアボード・
     ダイヤモンド・アウトカウント・投球前カウントダウンだけ専用CSSを追加する。 */
  .bb-scoreboard{ border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:14px; }
  .bb-sb-row{ display:flex; }
  .bb-sb-row.head{ background:var(--ink); }
  .bb-sb-team{ width:52px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:.78rem; background:var(--card); border-right:1px solid var(--line); }
  .bb-sb-row.head .bb-sb-team{ background:transparent; border-right:none; }
  .bb-sb-cell{ flex:1; text-align:center; padding:5px 2px; border-right:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .bb-sb-row.head .bb-sb-cell{ color:#e8ddc0; font-size:.72rem; border-right:1px solid rgba(255,255,255,.15); }
  .bb-sb-cell.total{ background:var(--ink); color:#f2ead9; font-weight:bold; border-right:none; }
  .bb-sb-row:not(.head) .bb-sb-cell{ background:var(--card); font-weight:bold; }
  .bb-field-wrap{ max-width:260px; margin:0 auto 10px; }
  .bb-field{ aspect-ratio:1/1; background:#dcead0; border:2px solid var(--accent2); border-radius:10px; overflow:hidden; }
  .bb-outs-row{ display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:14px; font-size:.8rem; color:var(--sub); }
  .bb-out-dot{ width:11px; height:11px; border-radius:50%; display:inline-block; background:var(--line); }
  .bb-out-dot.used{ background:var(--ng); }
  .bb-ready-card{ text-align:center; }
  .bb-ready-warn{ color:var(--accent); font-weight:bold; font-size:.85rem; margin:8px 0 12px; }
  .bb-countdown{ text-align:center; padding:20px 0; }
  .bb-countdown-num{ font-size:3rem; font-weight:bold; color:var(--accent2); font-variant-numeric:tabular-nums; }
  .bb-countdown-label{ font-size:.78rem; color:var(--gold); letter-spacing:.1em; margin-top:6px; }
  .bb-log{ font-size:.78rem; color:var(--sub); margin-top:12px; }
  .bb-log div{ line-height:1.6; }

  /* 野球ミニゲームの勝利画面だけ、他の中ボスより派手な演出にする（2026-07-18、教員の指示）。 */
  @keyframes bbBurst{ 0%{ transform:scale(.4) rotate(-8deg); opacity:0; } 60%{ transform:scale(1.15) rotate(3deg); opacity:1; } 100%{ transform:scale(1) rotate(0deg); opacity:1; } }
  @keyframes bbShine{ 0%,100%{ box-shadow:0 0 18px rgba(184,134,11,.35), 0 0 0 rgba(192,57,43,0); } 50%{ box-shadow:0 0 34px rgba(184,134,11,.65), 0 0 18px rgba(192,57,43,.25); } }
  .bb-victory{
    text-align:center; position:relative; overflow:hidden;
    background:linear-gradient(150deg,#fff6da 0%,#ffe6ae 55%,#ffd88a 100%);
    border:3px solid var(--gold); border-radius:16px;
    animation:bbBurst .5s cubic-bezier(.22,1.4,.4,1), bbShine 2.2s ease-in-out infinite;
  }
  .bb-victory-burst{ font-size:2.6rem; letter-spacing:.15em; margin-bottom:2px; }
  .bb-victory-title{
    font-size:1.7rem; font-weight:bold; color:var(--accent);
    letter-spacing:.08em; margin:2px 0 10px; text-shadow:0 0 14px rgba(192,57,43,.3);
  }
  .bb-victory-score{
    display:inline-block; font-size:1.35rem; font-weight:bold; color:var(--ink);
    background:rgba(255,255,255,.6); border-radius:10px; padding:6px 18px; margin-bottom:12px;
    font-variant-numeric:tabular-nums;
  }
  @media (prefers-reduced-motion: reduce){
    .bb-victory{ animation:none; }
  }
  /* .drop-item/.treasure-dropは元々ボス戦の暗い背景を想定した淡い金色文字なので、
     このbb-victoryの明るい金色背景の上では読みにくい。ここだけ濃い色に上書きする
     （2026-07-18、章クリア画面で同種の問題が起きた前例[[kokugo-story-mode]]と同じ対策）。 */
  .bb-victory .drop-item{ color:var(--accent); background:rgba(255,255,255,.6); border-color:rgba(192,57,43,.4); }
  .bb-victory .drop-item.treasure-drop{ color:#8a5a00; background:rgba(255,255,255,.75); box-shadow:0 0 10px rgba(184,134,11,.4); }

  /* ===== サブクエスト「ボキャブラ・シューティング」（2026-08-10〜） ===== */
  .vs-topbar{ display:flex; justify-content:flex-end; align-items:flex-start; margin-bottom:6px; }
  /* ライフ表示はスコア欄と離れて見づらいとの指摘で、ヘッダーからゲーム画面(canvas)左上への
     重ね表示に変更した（教員の指示、2026-08-10〜。.vs-wrap内に置くことで、位置合わせは
     .vs-wrapのposition:relativeにそのまま乗せられる）。 */
  .vs-lives{
    position:absolute; top:8px; left:8px; z-index:2;
    display:flex; gap:3px; font-size:16px;
    background:rgba(5,5,20,0.55); padding:4px 7px; border-radius:10px;
  }
  .vs-lives .heart{ color:#ff5577; }
  .vs-lives .heart-empty{ color:rgba(255,85,119,0.28); }
  .vs-scorebox{ text-align:right; }
  .vs-score{ font-size:20px; font-weight:bold; color:var(--gold); font-variant-numeric:tabular-nums; }
  /* ベストスコアもライフと同じくcanvas右上への重ね表示にする（教員の指示、2026-08-10〜。
     プレイ中に現在スコアがベストを上回ったらvsUpdateHud()内でリアルタイムに更新する）。 */
  .vs-best{
    position:absolute; top:8px; right:8px; z-index:2;
    font-size:11px; color:#e8f0ff;
    background:rgba(5,5,20,0.55); padding:5px 7px; border-radius:10px;
  }
  .vs-wordbanner{ text-align:center; margin-bottom:8px; }
  .vs-word{ font-size:clamp(20px,6vw,28px); font-weight:bold; letter-spacing:2px; color:var(--ink); }
  .vs-sub{ font-size:11px; color:var(--sub); margin-top:2px; }
  .vs-wrap{ position:relative; width:fit-content; max-width:100%; margin:0 auto; touch-action:none; }
  /* デスクトップ相当の画面幅では、ゲーム画面を大きく表示する（教員の指示、2026-08-10〜）。
     canvas自体の内部解像度もvsComputeCanvasSize()でこの閾値に合わせて切り替えているので、
     ここは表示サイズの上限を広げるだけでよい（引き伸ばしによるぼやけは発生しない）。 */
  @media (min-width:700px){
    .vs-wrap canvas{ max-width:400px; }
  }
  /* canvasは横幅だけでなく画面の高さでも収まるようにする（教員の指示、2026-08-19〜：
     PCで見たとき、ウィンドウが低いと「お題」（.vs-wordbanner）と機体・ライフが同時に
     画面内に収まらず、スクロールしないと機体側が見えなかったため）。max-heightで頭上の
     見出し類がだいたい収まる分（ヘッダー・カード余白・スコア欄・お題欄など）を差し引き、
     canvas自体をビューポートの高さに応じて縮小させる。widthをautoにしたことで、.vs-wrapを
     width:fit-contentにした効果と合わせ、縮小時もcanvasの実際の見た目の幅にvs-lives等の
     重ね要素がぴったり追従する。 */
  .vs-wrap canvas{
    width:auto; height:auto; max-width:340px; max-height:clamp(320px, calc(100vh - 260px), 700px);
    display:block; border-radius:12px;
    background:linear-gradient(180deg,#0a0a1a 0%,#12122a 100%); box-shadow:0 0 24px rgba(80,120,255,0.2);
  }
  .vs-fire{
    position:absolute; right:12px; bottom:22px; z-index:2;
    width:64px; height:64px; border-radius:50%; border:3px solid rgba(255,255,255,0.5);
    background: radial-gradient(circle at 35% 30%, #ff9dc0, #ff6b9d 60%, #c4498a 100%);
    color:#fff; font-weight:bold; font-size:11px; letter-spacing:1px;
    box-shadow:0 4px 16px rgba(255,107,157,0.55), inset 0 -3px 6px rgba(0,0,0,0.25);
  }
  .vs-fire:active{ transform:scale(0.92); }
  .vs-level-banner{
    position:absolute; top:38%; left:50%; z-index:3;
    transform:translate(-50%,-50%) scale(0.85);
    padding:10px 18px; border-radius:12px; text-align:center;
    background: linear-gradient(135deg, rgba(196,113,237,0.92), rgba(126,232,250,0.92));
    color:#0a0a1a; font-weight:bold; font-size:13px; letter-spacing:1px;
    box-shadow: 0 0 24px rgba(196,113,237,0.6);
    opacity:0; pointer-events:none; white-space:nowrap;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .vs-level-banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  /* スタート前・ゲームオーバー時にcanvasの上に重ねる半透明オーバーレイ（教員の指示、2026-08-10〜。
     スタンドアロン版vocab_shooter.htmlの#overlayと同じ見せ方：ゲーム画面自体は常に見えていて、
     その上に説明・スタートボタンや結果を重ねる）。 */
  .vs-overlay{
    position:absolute; inset:0; z-index:4; border-radius:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:20px; gap:4px;
    background:rgba(5,5,20,0.88); color:#fff;
    overflow-y:auto; /* 結果画面の「まちがえた言葉」一覧が長いと収まらないため、縦スクロール可にする */
  }
  .vs-overlay h4{
    font-size:16px; margin-bottom:6px; letter-spacing:1px;
    background:linear-gradient(90deg,#7ee8fa,#eec0c6);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .vs-overlay p{ font-size:12px; color:#aab8dd; line-height:1.7; max-width:280px; }
  .vs-overlay-big{ font-size:clamp(26px,8vw,38px); font-weight:bold; color:#ffe66d; margin:8px 0; }
  .vs-overlay-btn{
    margin-top:14px; padding:11px 34px; font-size:15px; font-weight:bold;
    background:linear-gradient(135deg,#ff6b9d,#c471ed); color:#fff; border:none; border-radius:26px;
    box-shadow:0 4px 16px rgba(196,113,237,0.5); letter-spacing:1px;
  }
  .vs-newbest{ text-align:center; font-weight:bold; color:#ffe66d; margin:6px 0; }
  /* 自己ベストが100点きざみの大台を初めて超えたときの、経験値お祝いメッセージ
     （教員の指示、2026-08-17〜：「演出と共に、お祝いメッセージをはっきりと示すこと」）。 */
  .vs-xp-celebrate{
    text-align:center; font-size:13px; font-weight:bold; line-height:1.7; color:#3a2a00;
    background:linear-gradient(135deg,#ffe66d,#ffb347); border-radius:10px;
    padding:9px 14px; margin:6px 0 8px; box-shadow:0 3px 12px rgba(255,179,71,.45);
    animation:vsXpCelebrateGo .5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes vsXpCelebrateGo{0%{opacity:0;transform:scale(.7);}60%{opacity:1;transform:scale(1.06);}100%{transform:scale(1);}}
  .vs-level-result{ text-align:center; font-size:13px; color:#aab8dd; line-height:1.6; margin:4px 0 2px; }
  .vs-controls-hint{ text-align:center; font-size:11px; color:var(--sub); opacity:0.75; margin-top:10px; line-height:1.6; }
  .vs-wronglist{ width:100%; max-width:280px; margin-top:14px; text-align:left; }
  .vs-wronglist-title{ font-size:12px; color:#aab8dd; margin-bottom:6px; text-align:center; }
  .vs-wronglist-item{
    font-size:12px; line-height:1.5; padding:6px 10px; margin-bottom:4px;
    background:rgba(255,255,255,0.08); border-radius:8px; color:#e8f0ff;
  }
  .vs-wronglist-q{ font-weight:bold; color:#ffe66d; margin-right:6px; }

  /* ===== サブクエスト「文節斬り」（2026-08-12〜、2026-08-14 本家エンジンを忠実移植） =====
     独立版（文節切り/bunsetsu_giri_3.html）のCSSをほぼそのまま移植している。
     ただし以下の3点だけ手を入れている（教員の指示：「基本的にはこれをそのまま入れる」）。
     1) :root{--sumi:...; --sub:...; --line:...; ...} は、このアプリ自身の:root
        （--sub/--lineが既に別の色で定義されている）と衝突するため、#bgApp{...}に
        スコープし直した。#bgAppの子孫はCSS変数の継承でそのまま同じ値を拾える。
     2) html,body{height:100%} と body{display:flex;justify-content:center;...} は、
        独立版が「ページ全体がこのゲームそのもの」だったための指定なので不要。
        該当のfont-family/背景/overflow:hiddenは#bgApp自身に移した。
     3) それ以外の全セレクタは、このアプリの.btn/.big等と名前がぶつかるため、
        「#bgApp 」を頭に付けて子孫セレクタ化しただけで、中身（プロパティ）は
        独立版と一字一句同じ。@keyframesは名前の衝突が無いことを確認済みなので無改造。 */
  #bgApp{
    --sumi:#22262b; --kinari:#e8e1d2; --maki:#f7f3e9;
    --ai:#14395e; --ai-l:#2c5c86; --shu:#c2412c; --kin:#9c7c2a;
    --midori:#2f7d5b;
    --sub:#7b7466; --line:#d6cdb9;
    --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    --mincho:"Yu Mincho","YuMincho","Hiragino Mincho ProN","MS PMincho",serif;
    width:100%;max-width:520px;height:clamp(440px,72vh,660px);margin:0 auto;
    display:flex;flex-direction:column;position:relative;
    font-family:var(--gothic);background:var(--kinari);color:var(--sumi);
    overflow:hidden;border-radius:12px;
    background-image:
      repeating-linear-gradient(58deg, rgba(140,125,95,.035) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(-32deg, rgba(140,125,95,.025) 0 1px, transparent 1px 6px);
  }
  #bgApp *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

  /* ===== 藍の帯 ===== */
  #bgApp .hud{
    background:var(--ai);color:#f2ede0;padding:9px 14px;
    display:flex;align-items:center;gap:12px;flex-shrink:0;
    box-shadow:0 2px 0 rgba(0,0,0,.12);
  }
  #bgApp .hud .title{font-family:var(--mincho);font-size:.98rem;letter-spacing:.3em;font-weight:600;margin-right:auto;}
  #bgApp .hud .gauge{display:flex;align-items:center;gap:5px;font-size:.72rem;letter-spacing:.06em;}
  #bgApp .hud .gauge b{font-family:var(--mincho);font-size:1rem;letter-spacing:.1em;font-weight:600;}
  #bgApp .life-dot{width:13px;height:13px;border-radius:50%;background:var(--shu);
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35);transition:background .2s,opacity .2s;}
  #bgApp .life-dot.gone{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28);opacity:.5;}
  #bgApp .hud .multBox{display:flex;align-items:baseline;gap:3px;font-family:var(--mincho);
    letter-spacing:.04em;transition:color .2s,transform .12s;}
  #bgApp .hud .multBox .x{font-size:.72rem;opacity:.75;}
  #bgApp .hud .multBox .v{font-size:1.2rem;font-weight:600;font-variant-numeric:tabular-nums;}
  #bgApp .hud .multBox.hot{color:var(--kin);}
  #bgApp .hud .multBox.blaze{color:#ffd36e;text-shadow:0 0 9px rgba(255,190,80,.75);}
  #bgApp .hud .multBox.pop{animation:multPop .2s ease-out;}
  @keyframes multPop{0%{transform:scale(1.4);}100%{transform:scale(1);}}
  #bgApp .hud .snd{background:transparent;border:1px solid rgba(242,237,224,.45);color:#f2ede0;
    border-radius:3px;font-size:.68rem;letter-spacing:.08em;padding:4px 8px;cursor:pointer;font-family:var(--gothic);}
  #bgApp .hud .snd.off{opacity:.5;}
  /* 重要な巻（三の巻・六の巻）をプレイ中は、藍の帯を朱・金基調に変えて分かるようにする
     （教員の指示、2026-08-19〜：「重要性をアピールしてください」）。 */
  #bgApp.important-stage .hud{background:linear-gradient(120deg, var(--shu), #7a2113);}
  #bgApp.important-stage .infobar{border-bottom-color:var(--kin);}

  /* ===== 情報バー ===== */
  #bgApp .infobar{display:flex;align-items:baseline;gap:10px;padding:7px 14px 5px;

  #bgApp .progress{height:3px;background:var(--line);flex-shrink:0;}

  /* 切れ目に残る印 */

  #bgApp .cutmark.pass{color:#b9b3a4;}

  #bgApp .cutmark .hbar{

  /* 文節の切れ目「／」は、以前は文字グリフのまま置いていたため細く見づらかった

     色つきの太い棒をCSSで描く方式にしたが、今度は太すぎて文字に被るようになったため

  /* ライフ回復アイテム（3文クリアごとに休みの拍に浮かぶ、教員の指示、2026-08-15〜）。

  #bgApp .bgItem{

  #bgApp .itemFxCore{

    z-index:7; animation:itemFxLabel .95s ease-out forwards; white-space:nowrap;

    100%{opacity:0; transform:translateY(-22px) scale(1);}
  }

  /* 斬撃線：拍ごとに脈打つ */
  #bgApp .blade{position:absolute;left:0;right:0;height:0;pointer-events:none;}
  #bgApp .blade i{position:absolute;left:14px;right:14px;top:-1px;height:2px;

  #bgApp .blade i::before,#bgApp .blade i::after{content:"";position:absolute;top:-5px;
    border-top:6px solid transparent;border-bottom:6px solid transparent;}
  #bgApp .blade i::before{left:-9px;border-left:9px solid var(--shu);}
  #bgApp .blade i::after{right:-9px;border-right:9px solid var(--shu);}
  #bgApp .blade u{position:absolute;left:0;right:0;display:block;background:rgba(194,65,44,.055);text-decoration:none;}

  @keyframes beatDot{0%{opacity:.85;transform:scale(1.5);}100%{opacity:0;transform:scale(.6);}}

  /* ===== 斬撃エフェクト ===== */
  #bgApp .cutfx{position:absolute;left:0;width:100%;height:0;pointer-events:none;z-index:5;}

    100%{opacity:0;transform:scaleX(1.15) rotate(-2deg);}
  }
  #bgApp .flashcore{position:absolute;left:50%;top:-2px;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
    background:radial-gradient(circle,#fff 0%,var(--shu) 45%,transparent 72%);animation:flashCore .32s ease-out forwards;}
  #bgApp .flashcore.perfect{width:40px;height:40px;margin:-20px 0 0 -20px;

  #bgApp .shard{position:absolute;left:50%;top:-3px;width:6px;height:6px;background:var(--shu);opacity:.9;

  /* 小刀（単語）の会心も同じ「会心」スタンプを出す（教員の指示、2026-08-19〜：

  #bgApp .hanko.ko{

  #bgApp .screenflash{position:absolute;inset:0;background:#fff;pointer-events:none;animation:screenFlashGo .26s ease-out forwards;}
  @keyframes screenFlashGo{0%{opacity:.5;}100%{opacity:0;}}
  #bgApp .badcut{position:absolute;left:0;width:100%;text-align:center;color:var(--shu);

     1) :root{--bg1;--bg2;--tsum-*} は #psApp{...} にスコープし直した。

  /* ボーナス正解後の15秒間：#psApp.psDoubleScoreBg（転成名詞ボーナス）と同じ仕組みだが、
     見分けがつくよう緑系の色でうっすら演出している。最初は金→ピンクの2色を0.9秒周期で
     切り替える派手な明滅にしていたが「目がちかちかする」→次に緑系2色の切り替えに変えたが
     それでも「まだチカチカする」とのフィードバックを受けて2026-08-21に再修正：
     background（グラデーション）そのものをkeyframesで切り替える書き方は、ブラウザが2つの
     状態を滑らかに補間できず必ず一瞬でパッと切り替わってしまうのが「チカチカ」の正体だった。
     そこで、同じ帯を横に連ねた1枚の大きいグラデーション画像を用意し、background-position
     （これは滑らかに補間できるプロパティ）を動かして横にゆっくり流れさせる方式に変更。
     色の切り替わりが一切なく、常に連続的に推移するので明滅・点滅がなくなる。転成名詞
     ボーナスと同時に発動しても見た目が競合しないよう、psBonusRewardBgを後勝ちにする
     （CSS順序で下に書き、同じ.psApp要素に両クラスが付いてもこちらが効くようにする）。 */
  #psApp.psBonusRewardBg{
    background-image: linear-gradient(120deg, #eef8e0, #d8f0c4, #b9e0b0, #d8f0c4, #eef8e0);
    background-size: 300% 300%;
    /* alternate（往復）にすることで、ループの継ぎ目でパッと戻る瞬間を作らない。
       0%→100%→0%と向きが変わるだけで位置は常に連続しているので、動きが途切れない。 */
    animation: psBonusRewardShimmer 6s ease-in-out infinite alternate;
  }
  @keyframes psBonusRewardShimmer{
    0%{ background-position: 0% 50%; }
    100%{ background-position: 100% 50%; }
  }
