    const t = e.touches ? e.touches[0] : e;
    shoot.player.targetX = vsGetCanvasX(canvas, t.clientX);
  };
  const touchMove = e=>{ e.preventDefault(); move(e); };
  const mouseMove = e=>{ if(e.buttons!==1) return; move(e); };
  canvas.addEventListener('touchstart', touchMove, {passive:false});
  canvas.addEventListener('touchmove', touchMove, {passive:false});
  canvas.addEventListener('mousemove', mouseMove);
  canvas.addEventListener('mousedown', move);
  const fireStart = e=>{ e.preventDefault(); shoot.isFiring = true; };
  const fireEnd = e=>{ if(e) e.preventDefault(); shoot.isFiring = false; };
  fireBtn.addEventListener('touchstart', fireStart, {passive:false});
  fireBtn.addEventListener('touchend', fireEnd, {passive:false});
  fireBtn.addEventListener('touchcancel', fireEnd);
  fireBtn.addEventListener('mousedown', fireStart);
  /* window直付けのキーボード・mouseupリスナーだけは、画面遷移してもcanvas/fireBtnと違って
     自動では消えない（DOM要素と一緒に回収されない）ので、shoot.handlersに控えておき、
     vsStopLoop()で明示的に外す。
     キーボード操作（教員の指示、2026-08-10〜）：数字キー1〜4でその選択肢のレーンへ直接移動、
     矢印キー(←→)で隣のレーンへ1つずつ移動。発射はSpaceキーに加えてEnterキーでも
     できるようにする（押している間、連射。SHOOTボタンと同じisFiringフラグを共有）。 */
  const keydown = e=>{
    if(!storyRun || storyRun.shoot !== shoot) return;
    if(e.code==='Space' || e.key==='Enter'){ e.preventDefault(); shoot.isFiring = true; }
    else if(e.key>='1' && e.key<='4'){ e.preventDefault(); vsMoveToLane(shoot, Number(e.key)-1); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); vsMoveToLane(shoot, shoot.laneIndex-1); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); vsMoveToLane(shoot, shoot.laneIndex+1); }
  };
  const keyup = e=>{
    if(!storyRun || storyRun.shoot !== shoot) return;
    if(e.code==='Space' || e.key==='Enter'){ shoot.isFiring = false; }
  };
  const mouseUp = ()=>{ shoot.isFiring = false; };
  window.addEventListener('keydown', keydown);
  window.addEventListener('keyup', keyup);
  window.addEventListener('mouseup', mouseUp);
  shoot.handlers = {keydown, keyup, mouseUp};
}
function vsStopLoop(){
  const shoot = storyRun && storyRun.shoot;
  if(!shoot) return;
  if(shoot.rafId){ cancelAnimationFrame(shoot.rafId); shoot.rafId = null; }
  if(shoot.handlers){
    window.removeEventListener('keydown', shoot.handlers.keydown);
    window.removeEventListener('keyup', shoot.handlers.keyup);
    window.removeEventListener('mouseup', shoot.handlers.mouseUp);
    shoot.handlers = null;
  }
  shoot.isFiring = false;
}
function vsGetCanvasX(canvas, clientX){
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) * (VS_W/rect.width);
}
/* 現在の選択肢の数（＝レーン数。goiは常に4択だが、将来別カテゴリを使う可能性も考えて
   currentOrderから動的に求める）。 */
function vsLaneCount(shoot){
  return (shoot.currentOrder && shoot.currentOrder.length) || 4;
}
/* 指定したレーン番号(0始まり)の中央へ、自機の目標位置(targetX)を移動する。
   範囲外の番号は端に丸める。 */
function vsMoveToLane(shoot, idx){
  const n = vsLaneCount(shoot);
  idx = Math.max(0, Math.min(n-1, idx));
  shoot.laneIndex = idx;
  const laneW = shoot.W / n;
  shoot.player.targetX = laneW*idx + laneW/2;
}
/* 次に出題する単語を選ぶ。今の出題レベル(vsLevelIndex)のプールから、そのレベル内で
   一巡するまで同じ単語が続けて出ないようにする（usedWords、スタンドアロン版のpickNextWordと
   同じ方式）。プールが1問しかない場合の無限ループを避けるため、その場合はusedWordsを無視する。 */
function vsPickNextItem(){
  const shoot = storyRun.shoot;
  const pool = vsLevelPool(shoot.vsLevelIndex);
  if(shoot.usedWords.length >= pool.length) shoot.usedWords = [];
  let idx;
  do { idx = Math.floor(Math.random()*pool.length); } while(pool.length > 1 && shoot.usedWords.includes(idx));
  shoot.usedWords.push(idx);
  const it = pool[idx];
  shoot.lastQ = it.q;
  shoot.currentItem = it;
  shoot.currentOrder = shuffledOrder(it.c.length);
  shoot.spawnedForItem = false;
  shoot.bullets = [];
  const el = document.getElementById("vsWord");
  if(el) el.innerHTML = markQuestionHtml(it.q);
}
/* レベルアップ演出：画面中央に大きく一度だけバナー表示する（スタンドアロン版のshowLevelUpBanner
   を移植）。setTimeoutでの非表示は、その間に別のセッションが始まっていないか
   （storyRun.shoot === shootの一致）を確認してから行う。 */
function vsShowLevelUpBanner(){
  const shoot = storyRun.shoot;
  const el = document.getElementById("vsLevelBanner");
  if(!el) return;
  el.textContent = `レベル${shoot.vsLevelIndex+1} 〜${VS_LEVEL_NAMES[shoot.vsLevelIndex]}〜`;
  el.classList.add("show");
  vsBeep(660,0.1,'triangle',0.12);
  setTimeout(()=>vsBeep(990,0.15,'triangle',0.14), 120);
  setTimeout(()=>{
    if(storyRun && storyRun.shoot === shoot){
      const el2 = document.getElementById("vsLevelBanner");
      if(el2) el2.classList.remove("show");
    }
  }, 2200);
}
/* オーブの高さは、中の文章の長さに応じて動的に決める（教員の指摘、2026-08-10〜。
   語彙の説明文は最長26文字ほどあり、固定の高さ(旧:50px)だとはみ出すことがあった）。
   実際にvsWrapLines()で折り返した行数から必要な高さを逆算するので、どんなに長い
   説明文でも箱からはみ出さない。 */
function vsSpawnOrbs(){
  const shoot = storyRun.shoot;
  const it = shoot.currentItem, order = shoot.currentOrder;
  let speedMul = 1;
  if(shoot.slowCharges > 0){ speedMul = 0.5; shoot.slowCharges--; }
  const laneW = shoot.W / order.length;
  const canvas = document.getElementById("vsCanvas");
  const ctx = canvas && canvas.getContext('2d');
  const orbW = laneW*0.92;
  shoot.orbs = order.map((origIdx, i) => {
    const text = it.c[origIdx];
    let lineCount = 2;
    if(ctx){
      ctx.font = VS_ORB_FONT;
      lineCount = vsWrapLines(ctx, text, orbW - 10).length;
    }
    const hp = shoot.vsLevelIndex + 1;
    /* HPドット(○)は本文の下に専用の帯(dotRowH)を確保して描く（教員の指摘、2026-08-10〜。
       以前は本文の下端ぎりぎりにドットを重ねて描いていたため、文章が2〜3行になると
       最後の行とドットが接近して読みにくかった）。maxHp===1(ドットを出さないレベル1)の
       ときは帯を確保しない。 */
    const dotRowH = hp > 1 ? 16 : 0;
    return {
      text, correct: origIdx === it.a,
      x: laneW*i + laneW/2, y: -50 - i*70 - Math.random()*40,
      vy: (shoot.orbFallSpeed + Math.random()*0.3) * speedMul,
      w: orbW, h: Math.max(40, lineCount * VS_ORB_LINE_H + 18 + dotRowH), hit:false,
      hp, maxHp: hp, flashTime:0,
    };
  });
  shoot.spawnedForItem = true;
  shoot.itemShownAt = Date.now();
}
function vsGetBulletPattern(shipLevel){
  if(shipLevel===0) return [{dx:0, vx:0, big:false, diag:false}];
  if(shipLevel===1) return [{dx:-7,vx:0,big:false,diag:false},{dx:7,vx:0,big:false,diag:false}];
  if(shipLevel===2) return [
    {dx:-7,vx:0,big:false,diag:false},{dx:7,vx:0,big:false,diag:false},
    {dx:-14,vx:-1.8,big:false,diag:true},{dx:14,vx:1.8,big:false,diag:true}
  ];
  return [
    {dx:0,vx:0,big:true,diag:false},
    {dx:-14,vx:-1.8,big:false,diag:true},{dx:14,vx:1.8,big:false,diag:true}
  ];
}
/* 弾1発あたりの攻撃力（教員の指示、2026-08-10〜）。機体強化(shipLevel)が上がるほど、
   弾を1発当てたときにオーブへ与えるダメージも増える（第一形態=1発分、第二形態=2発分…）。 */
function vsBulletDamage(shipLevel){
  return shipLevel + 1;
}
function vsFireBullet(){
  const shoot = storyRun.shoot;
  const now = performance.now();
  if(now - shoot.lastFire < shoot.fireCooldown) return;
  shoot.lastFire = now;
  const dmg = vsBulletDamage(shoot.shipLevel);
  vsGetBulletPattern(shoot.shipLevel).forEach(p=>{
    shoot.bullets.push({x:shoot.player.x+p.dx, y:shoot.player.y-20, vx:p.vx, vy:-9, big:p.big, diag:p.diag, dmg});
  });
  vsBeep(880,0.05,'square',0.06);
}
let vsAudioCtx = null;
function vsBeep(freq, dur, type, vol){
  try{
    if(!vsAudioCtx) vsAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = vsAudioCtx.createOscillator(), g = vsAudioCtx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(vsAudioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, vsAudioCtx.currentTime + dur);
    o.stop(vsAudioCtx.currentTime + dur);
  }catch(e){}
}
/* 機体強化(ship)は3段階が上限なので、すでに最大まで強化済みならそもそも候補から除外する
   （教員の指示、2026-08-10〜。以前は上限後も同じ確率で出続け、拾っても「機体最大強化中!」と
   出るだけの無駄なアイテムになっていた）。除外した分の重みは、残りの種類（スロー/ライフ）に
   自動的に再配分される（totalが除外後の合計になるため）。 */
function vsPickItemType(shipLevel){
  const pool = VS_ITEM_TYPES.filter(t => t.type !== 'ship' || shipLevel < 3);
  const total = pool.reduce((s,t)=>s+t.weight,0);
  let r = Math.random()*total;
  for(const t of pool){ if(r < t.weight) return t; r -= t.weight; }
  return pool[0];
}
function vsSpawnItem(){
  const shoot = storyRun.shoot;
  const def = vsPickItemType(shoot.shipLevel);
  shoot.items.push({
    type: def.type, color: def.color, symbol: def.symbol,
    x: 30 + Math.random()*(shoot.W-60), y:-30, vy: 1.6+Math.random()*0.4, r:16,
  });
}
function vsCollectItem(it){
  const shoot = storyRun.shoot;
  vsBeep(1500,0.1,'triangle',0.15);
  if(it.type === 'slow'){
    shoot.slowCharges += 3;
    vsSpawnPopup(it.x, it.y, 'スロー×3問!', '#4fc3f7');
    vsSpawnParticles(it.x, it.y, '#4fc3f7', 16);
  }else if(it.type === 'life'){
    if(shoot.lives < shoot.maxLives){ shoot.lives++; vsSpawnPopup(it.x, it.y, 'HP回復!', '#ff5577'); }
    else vsSpawnPopup(it.x, it.y, 'HP満タン', '#8899cc');
    vsSpawnParticles(it.x, it.y, '#ff5577', 16);
  }else if(it.type === 'ship'){
    /* 表示する「Lv」は必ずvsBulletDamage(shoot.shipLevel)＝実際の弾の攻撃力と同じ数字にする
       （教員の指摘、2026-08-10〜。以前は内部のshipLevelをそのまま表示していたため、
       「Lv2」なのに実際の攻撃力は3(=shipLevel+1)という1ズレが起き、「HPと攻撃力が同じ数の
       はずなのに1発で倒せた」という混乱の原因になっていた）。 */
    if(shoot.shipLevel < 3){ shoot.shipLevel++; shoot.maxLives++; vsSpawnPopup(it.x, it.y, `機体強化 Lv${vsBulletDamage(shoot.shipLevel)}!`, '#ffd24f'); }
    else vsSpawnPopup(it.x, it.y, '機体最大強化中!', '#ffd24f');
    shoot.lives = shoot.maxLives;
    vsSpawnParticles(it.x, it.y, '#ffd24f', 22);
  }
  vsUpdateHud();
}
function vsSpawnParticles(x,y,color,n){
  const shoot = storyRun.shoot;
  for(let i=0;i<n;i++){
    const ang = Math.random()*Math.PI*2, spd = 1+Math.random()*3.5;
    shoot.particles.push({x,y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, life:1, color, size:2+Math.random()*3});
  }
}
function vsSpawnPopup(x,y,text,color){
  storyRun.shoot.popups.push({x,y,text,color,life:1});
}
function vsUpdateHud(){
  const shoot = storyRun.shoot;

  if(scoreEl) scoreEl.textContent = shoot.score;
  const livesEl = document.getElementById("vsLives");

    for(let i=0;i<shoot.lives;i++){ const s=document.createElement("span"); s.className="heart"; s.textContent="♥"; livesEl.appendChild(s); }
    for(let i=0;i<shoot.maxLives-shoot.lives;i++){ const s=document.createElement("span"); s.className="heart-empty"; s.textContent="♥"; livesEl.appendChild(s); }
  }
  /* ベストスコアはプレイ中に現在スコアが上回った瞬間からリアルタイムで更新表示する

     従来どおりvsEndGame()でのみ行うので、ここはあくまで表示だけの先行更新。 */
  const bestEl = document.getElementById("vsBest");
  if(bestEl) bestEl.textContent = `ベスト：${Math.max(shoot.bestBefore || 0, shoot.score)}`;
}
/* オーブに弾は当たったが、まだHPが残っていて撃破に至らなかったときの軽い演出
   （教員の指示、2026-08-10〜。出題レベルが上がるほどオーブのHPが増え、複数発
   当てないと撃破できなくなる。正解・誤答どちらのオーブも同じHPにしてあるので、
   このかすり演出だけでは正解／不正解の見分けがつかない＝答えのヒントにならない）。 */
function vsGrazeOrb(o){
  o.flashTime = 6;
  vsSpawnParticles(o.x, o.y, '#cfd8ff', 4);
  vsBeep(1400, 0.04, 'square', 0.05);
}
/* 結果画面の最後に出す「間違えた問題」一覧のために、その単語の正しい意味を記録する
   （教員の指示、2026-08-10〜）。誤答オーブに命中した瞬間・正解オーブを撃ちもらした瞬間の
   両方から呼ぶ。shoot.wrongWordsは{単語: 正しい意味}のオブジェクトなので、同じ単語で
   複数回まちがえてもリストには1回しか載らない（重複排除）。currentItem.c[currentItem.a]は
   シャッフル前の元配列を見るので、画面上の選択肢の並び順には左右されない。 */
function vsRecordWrongWord(shoot){
  const it = shoot.currentItem;
  if(!it) return;
  shoot.wrongWords[it.q] = it.c[it.a];
}
/* 正解オーブに命中したとき／誤答オーブに命中したときの処理。record()は正解命中時のみ
   ここで呼ぶ（誤答命中は、単体では分野レベル・診断的難度調整に触れない既存仕様）。
   ここに来るのはオーブのHPが0以下になった＝撃破が確定した弾のときだけ。 */
function vsHitOrb(o){
  const shoot = storyRun.shoot;
  o.hit = true; o.gone = true;
  const elapsedMs = Date.now() - (shoot.itemShownAt || Date.now());
  if(o.correct){
    shoot.combo++;
    const gain = 10 + shoot.combo*2;
    shoot.score += gain;
    vsSpawnParticles(o.x,o.y,'#7ee8fa',20);
    const r = record(shoot.cat, shoot.currentItem, true, elapsedMs, {skipRecentAcc:true});
    vsSpawnPopup(o.x,o.y, `+${gain}` + (shoot.combo>1?`  ${shoot.combo}COMBO`:``), '#ffe66d');
    if(r.lvup) vsSpawnPopup(o.x,o.y-24, `語彙 Lv.${r.lv} UP!`, '#8ff0d6');
    if(r.evolved) vsSpawnPopup(o.x,o.y-48, `${r.evolved.icon} ${r.evolved.name}に進化！`, '#ffd24f');
    vsBeep(1200,0.12,'sine',0.15);
    shoot.orbs.forEach(other=>{ if(!other.hit){ other.hit=true; other.gone=true; } });
    shoot.bullets = [];
    if(Math.random() < VS_ITEM_DROP_CHANCE) vsSpawnItem();
    // 出題レベルの進行（まだ最大レベルでなければ）
    if(shoot.vsLevelIndex < VS_LEVEL_NAMES.length-1){
      shoot.correctSinceLevelUp++;
      if(shoot.correctSinceLevelUp >= VS_CORRECT_PER_LEVEL){
        shoot.correctSinceLevelUp = 0;
        shoot.vsLevelIndex++;
        shoot.usedWords = [];
        vsShowLevelUpBanner();
      }
    }
    // 落下速度は最初から、正解を重ねるごとに徐々に上がっていく
    shoot.correctSinceSpeedUp++;
    if(shoot.correctSinceSpeedUp >= VS_CORRECT_PER_SPEEDUP){
      shoot.correctSinceSpeedUp = 0;
      shoot.orbFallSpeed += VS_SPEEDUP_STEP;
      vsSpawnPopup(shoot.W/2, shoot.H/2, 'スピードアップ!', '#ff9dc0');
    }
  }else{
    shoot.combo = 0;
    vsSpawnParticles(o.x,o.y,'#ff5577',14);
    vsSpawnPopup(o.x,o.y,'ちがう!', '#ff5577');
    vsBeep(220,0.18,'sawtooth',0.12);
    vsRecordWrongWord(shoot);
    vsLoseLife();
  }
  vsUpdateHud();
}
/* ミス（誤答オーブに命中／正解を撃ちもらす）のたびに呼ぶ。ライフを1減らすのに加えて、
   落下速度を2段階分やわらげる（ペナルティではなく、直後の1〜2問の難易度を一旦下げて
   立て直せるようにする救済措置、教員の指示、2026-08-10〜）。speedUpの歩数(correctSinceSpeedUp)
   は0に戻さない——ここをリセットすると次のスピードアップまでの必要正解数が変わってしまい、
   意図（速度そのものを下げる）とズレるため。 */
function vsLoseLife(){
  const shoot = storyRun.shoot;
  shoot.lives--; shoot.shakeTime = 12;
  const before = shoot.orbFallSpeed;
  shoot.orbFallSpeed = Math.max(VS_BASE_SPEED, shoot.orbFallSpeed - VS_SPEEDUP_STEP*2);
  if(shoot.orbFallSpeed < before) vsSpawnPopup(shoot.W/2, shoot.H/2 - 40, 'スピードダウン', '#4fc3f7');
  vsUpdateHud();
}
function vsRoundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function vsWrapLines(ctx, text, maxWidth){
  const chars = String(text).split('');
  let lines = [], cur='';
  chars.forEach(ch=>{
    const test = cur+ch;
    if(ctx.measureText(test).width > maxWidth && cur!==''){ lines.push(cur); cur=ch; }
    else cur = test;
  });
  if(cur) lines.push(cur);
  return lines;
}
function vsWrapText(ctx, text, x, y, maxWidth, lineHeight){
  const lines = vsWrapLines(ctx, text, maxWidth);
  const totalH = lines.length*lineHeight;
  lines.forEach((line,i)=>{ ctx.fillText(line, x, y - totalH/2 + lineHeight/2 + i*lineHeight); });
}
function vsRender(){
  const shoot = storyRun.shoot;
  const canvas = document.getElementById("vsCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = shoot.W, H = shoot.H;
  ctx.save();
  if(shoot.shakeTime>0) ctx.translate((Math.random()-0.5)*6, (Math.random()-0.5)*6);
  ctx.clearRect(-10,-10,W+20,H+20);

  ctx.fillStyle='rgba(255,255,255,0.5)';
  for(let i=0;i<40;i++){
    const sx=(i*97)%W, sy=(i*53+(performance.now()*0.02))%H;
    ctx.globalAlpha = 0.15+(i%5)*0.05;
    ctx.fillRect(sx,sy,2,2);
  }
  ctx.globalAlpha=1;

  shoot.orbs.forEach(o=>{
    if(o.hit) return;
    ctx.save();
    ctx.translate(o.x,o.y);
    const grad = ctx.createLinearGradient(-o.w/2,0,o.w/2,0);
    if(o.flashTime>0){ grad.addColorStop(0,'#8fb0ff'); grad.addColorStop(1,'#aac0ff'); }
    else{ grad.addColorStop(0,'#2a3a6a'); grad.addColorStop(1,'#3a4a8a'); }
    ctx.fillStyle = grad;
    vsRoundRect(ctx,-o.w/2,-o.h/2,o.w,o.h,10);
    ctx.fill();
    ctx.strokeStyle='rgba(126,232,250,0.35)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='#e8f0ff'; ctx.font=VS_ORB_FONT;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    vsWrapText(ctx, o.text, 0, 0, o.w-10, VS_ORB_LINE_H);
    /* 出題レベルが2以上（maxHp>=2）のときだけ、残りHPを丸ドットで表示する。
       正解・誤答どちらのオーブも同じmaxHpなので、これを見ても答えは分からない。 */
    if(o.maxHp > 1){
      const dotR = 3, gap = 9, totalW = (o.maxHp-1)*gap;
      for(let i=0;i<o.maxHp;i++){
        ctx.beginPath();
        ctx.arc(-totalW/2 + i*gap, o.h/2 - 6, dotR, 0, Math.PI*2);
        ctx.fillStyle = i < o.hp ? '#ffe66d' : 'rgba(255,255,255,0.25)';
        ctx.fill();
      }
    }
    ctx.restore();
  });

  shoot.items.forEach(it=>{
    const bob = Math.sin(performance.now()*0.006+it.x)*3;
    ctx.save();
    ctx.translate(it.x, it.y+bob);
    ctx.shadowColor = it.color; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(0,0,it.r,0,Math.PI*2);
    const g = ctx.createRadialGradient(0,0,2,0,0,it.r);
    g.addColorStop(0,'#ffffff'); g.addColorStop(0.35,it.color); g.addColorStop(1,'#1a1a3e');
    ctx.fillStyle=g; ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle='#1a1a3e'; ctx.font='bold 14px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(it.symbol,0,1);
    ctx.restore();
  });

  const bulletColors=['#7ee8fa','#8ff0d6','#ffe38a','#ffb37e'];
  const bulletColor = bulletColors[Math.min(shoot.shipLevel,bulletColors.length-1)];
  const baseBulletW = 4+shoot.shipLevel*1.2, baseBulletH = 14+shoot.shipLevel*2;
  const rainbowHue = (performance.now()*0.25)%360;
  shoot.bullets.forEach(b=>{
    const bw = b.big?baseBulletW*2.1:baseBulletW, bh = b.big?baseBulletH*1.35:baseBulletH;
    ctx.save();
    if(b.big){
      const hue=(rainbowHue+b.x)%360;
      const rc = `hsl(${hue},90%,65%)`;
      ctx.shadowColor=rc; ctx.shadowBlur=18; ctx.fillStyle=rc;
    }else if(b.diag){
      ctx.shadowColor=bulletColor; ctx.shadowBlur=6+shoot.shipLevel*2;
      ctx.globalAlpha=0.75; ctx.fillStyle=bulletColor;
    }else{
      ctx.shadowColor=bulletColor; ctx.shadowBlur=8+shoot.shipLevel*3; ctx.fillStyle=bulletColor;
    }
    vsRoundRect(ctx, b.x-bw/2, b.y-bh/2, bw, bh, bw/2.2);
    ctx.fill();
    ctx.restore();
  });

  ctx.save();
  ctx.translate(shoot.player.x, shoot.player.y);
  const shipScale = 1+shoot.shipLevel*0.1;
  ctx.scale(shipScale,shipScale);
  const shipColors=['#ff6b9d','#ff6b9d','#c9a4ff','#ffd24f'];
  const shipColor = shipColors[Math.min(shoot.shipLevel,shipColors.length-1)];
  ctx.shadowColor=shipColor; ctx.shadowBlur=14+shoot.shipLevel*5;
  ctx.fillStyle=shipColor;
  ctx.beginPath();
  ctx.moveTo(0,-22); ctx.lineTo(18,18); ctx.lineTo(0,10); ctx.lineTo(-18,18); ctx.closePath();
  ctx.fill();
  if(shoot.shipLevel>=1){
    ctx.fillStyle='rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.moveTo(-18,18); ctx.lineTo(-28,10); ctx.lineTo(-14,6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(18,18); ctx.lineTo(28,10); ctx.lineTo(14,6); ctx.closePath(); ctx.fill();
  }
  if(shoot.shipLevel>=2){
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(0,2,4,0,Math.PI*2); ctx.fill();
  }
  if(shoot.shipLevel>=3){
    ctx.fillStyle='rgba(255,210,79,0.5)';
    ctx.beginPath(); ctx.moveTo(-8,16); ctx.lineTo(0,32); ctx.lineTo(8,16); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  shoot.particles.forEach(p=>{
    ctx.globalAlpha = Math.max(p.life,0);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  });
  ctx.globalAlpha=1;

  shoot.popups.forEach(p=>{
    ctx.globalAlpha = Math.max(p.life,0);
    ctx.fillStyle = p.color;
    ctx.font='bold 14px sans-serif';
    ctx.textAlign='center';
    ctx.fillText(p.text, p.x, p.y);
  });
  ctx.globalAlpha=1;

  ctx.restore();
}
function vsLoop(){
  const shoot = storyRun && storyRun.shoot;
  if(!shoot || shoot.phase !== "playing") return;

  shoot.player.x += (shoot.player.targetX - shoot.player.x) * 0.18;
  shoot.player.x = Math.max(24, Math.min(shoot.W-24, shoot.player.x));

  if(shoot.isFiring) vsFireBullet();

  if(!shoot.spawnedForItem) vsSpawnOrbs();

  shoot.bullets.forEach(b=>{ b.y += b.vy; b.x += (b.vx||0); });
  shoot.bullets = shoot.bullets.filter(b=> b.y > -20 && b.x > -40 && b.x < shoot.W+40);

  shoot.orbs.forEach(o=>{ if(!o.hit) o.y += o.vy; });

  /* 機体レベル1・2は非diag弾を1回の発射で2発同時に(dx±7で)撃つため、幅の広いオーブに
     その2発が同じフレームでどちらも命中してしまい、「1発分」のはずの攻撃力が実質2倍
     （ダメージが二重に入る）になってしまうバグがあった（教員の指摘、2026-08-10〜。
     ○(HP)が3つ表示されているのに機体レベル2で瞬殺できる、という違和感の原因）。
     1フレームにつき1オーブへのダメージ適用は1回までに制限する（弾自体は見た目のつじつまが
     合うよう、命中した弾は全て消費する＝的に当たって消える）。 */
  shoot.orbs.forEach(o=>{ o.hitThisFrame = false; });
  shoot.bullets.forEach(b=>{
    if(b.diag) return;
    shoot.orbs.forEach(o=>{
      if(o.hit) return;
      if(Math.abs(b.x-o.x) < o.w/2 && Math.abs(b.y-o.y) < o.h/2){
        b.y = -9999;
        if(o.hitThisFrame) return;
        o.hitThisFrame = true;
        o.hp -= (b.dmg || 1);
        if(o.hp <= 0) vsHitOrb(o);
        else vsGrazeOrb(o);
      }
    });
  });

  shoot.orbs.forEach(o=>{ if(o.flashTime>0) o.flashTime--; });

  shoot.orbs.forEach(o=>{
    if(!o.hit && o.y > shoot.H+30){
      o.hit = true; o.gone = true;
      if(o.correct){
        vsLoseLife();
        vsSpawnPopup(o.x, shoot.H-100, "取り逃し!", "#ff5577");
        vsRecordWrongWord(shoot);
        const elapsedMs = Date.now() - (shoot.itemShownAt || Date.now());
        record(shoot.cat, shoot.currentItem, false, elapsedMs, {skipRecentAcc:true});
      }
    }
  });
  shoot.orbs = shoot.orbs.filter(o=>!o.gone);

  if(shoot.spawnedForItem && shoot.orbs.length===0) vsPickNextItem();

  shoot.items.forEach(it=>{
    it.y += it.vy;
    const dx = Math.abs(it.x - shoot.player.x), dy = Math.abs(it.y - shoot.player.y);
    if(!it.gone && dx < (shoot.player.w/2 + it.r*0.7) && dy < (shoot.player.h/2 + it.r*0.7)){
      it.gone = true; vsCollectItem(it);
    }else if(!it.gone && it.y > shoot.H+30){ it.gone = true; }
  });
  shoot.items = shoot.items.filter(it=>!it.gone);

  shoot.particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.life-=0.03; });
  shoot.particles = shoot.particles.filter(p=>p.life>0);

  shoot.popups.forEach(p=>{ p.y -= 0.6; p.life -= 0.02; });
  shoot.popups = shoot.popups.filter(p=>p.life>0);

  if(shoot.shakeTime>0) shoot.shakeTime--;

  vsRender();

  if(shoot.lives<=0){ vsEndGame(); return; }
  shoot.rafId = requestAnimationFrame(vsLoop);
}
function vsEndGame(){
  const shoot = storyRun.shoot;
  vsStopLoop();
  shoot.phase = 'gameover';
  const st = loadStats();
  const prevBest = st.vocabShooterHighScore || 0;
  const isNewRecord = shoot.score > 0 && shoot.score > prevBest;
  shoot.xpGained = 0; shoot.xpTierReached = 0;
  if(isNewRecord){
    st.vocabShooterHighScore = shoot.score;
    /* 自己ベストが100点きざみの大台（100・200・300…）を初めて超えるたびに、お祝いとして
       経験値＋10（教員の指示、2026-08-17〜）。すでに超えた大台は、以後は同じか下回る
       自己ベストを出しても再加算しない。いきなり400点なら、100〜400の4段ぶんまとめて
       ＋40。次に一度も更新できなかったあと500点を初めて超えたら、そのぶんだけ＋10。
       すでに超えた大台の位置は、st.vocabShooterXpTier（超えた最大の「◯◯0点」÷100）に
       持たせておく。 */
    const oldTier = st.vocabShooterXpTier || 0;
    const newTier = Math.floor(shoot.score / 100);
    if(newTier > oldTier){
      const gained = (newTier - oldTier) * 10;
      st.vocabShooterBonusExp = (st.vocabShooterBonusExp||0) + gained;
      st.vocabShooterXpTier = newTier;
      shoot.xpGained = gained;
      shoot.xpTierReached = newTier * 100;
    }
    saveStats(st);
  }
  shoot.finalScore = shoot.score;
  shoot.isNewRecord = isNewRecord;
  shoot.bestAfter = Math.max(prevBest, shoot.score);
  /* 出題レベルはvsStartGameで必ずvsLevelIndex:0(表示上は「レベル1」)から始まるので、
     終了時点のvsLevelIndexがそのまま「今回のプレイで何回レベルアップしたか」になる
     （教員の指示、2026-08-10〜。結果画面に到達レベルとレベルアップ数を表示するため）。 */
  shoot.finalLevelIndex = shoot.vsLevelIndex;
  shoot.levelUpsGained = shoot.vsLevelIndex;
  vsRenderGameScreen(); // gameover状態のオーバーレイ(vsOverlayHtml)を重ねて表示
}

/* コンボアタック（combo beat、2026-07-19〜、第5章「朝読書をしよう！」用）。beat.cat（この章では
   ことわざ）の4択問題をSTORY_COMBO_TIME_MS（60秒）のあいだ連続で出題し続け、何問正解できたか、
   また連続正解（コンボ）が何回続いたかを競うタイムアタック形式。時間を使い切るまでずっと出題を
   続け（教員の指示どおり、目標のコンボ数に届いた瞬間に打ち切ることはしない）、その中で最大コンボが
   STORY_COMBO_NEED以上になっていればクリア。クリアできなければ他の中ボス（battle/proofread/
   baseball）と同じく「もう一度挑戦する」で何度でも再挑戦できる（beatIdxは進めない）。
   出題はpickBattleQuestionをそのまま使う（新規データ不要）。baseball beatと同じく、教員の
   指示でこのミニゲームだけは正誤をrecord()に反映する（skipRecentAcc:trueで直近正答率・
   fastGuess判定には混ぜない。詳細はstoryComboAnswer参照）。
   このbeatだけの特徴として、章クリア後もst.story.comboBest[章key]に自己ベストの最大コンボ数を
   セーブし、章選択画面のボタンに表示する（storyChapterButtonHtml参照）。状態はstoryRun.combo
   （非セーブのランタイムオブジェクト）に持たせ、gateBeatIdx等と同じくcomboBeatIdxで
   beat切り替えを検知する。
   進行はready（説明文＋「はじめる」ボタン）→countdown（3・2・1のカウントダウン）→
   playing（出題中）→done（結果画面）の4フェーズ（2026-07-19〜、教員の指示でready/countdownを
   追加）。beat.readyText/clearFlavor/failFlavorで、開始前の説明・クリア時・失敗時の一言を
   章ごとにカスタマイズできる（未指定時は汎用の文面にフォールバックするので、他の章でこの
   beat型を再利用するときは省略してもよい）。 */
const STORY_COMBO_TIME_MS = 60000;
const STORY_COMBO_NEED = 9;
const STORY_COMBO_COUNTDOWN_MS = 800;
const STORY_COMBO_DEFAULT_READY_TEXT = "60秒間で、できるだけ多くの問題に正解しよう。正解数だけでなく、何問連続で正解できたか（コンボ）が合格のカギになるよ。";
function storyRenderCombo(beat, idx){
  if(storyRun.comboBeatIdx !== idx){
    storyRun.comboBeatIdx = idx;
    storyComboReset(beat);
  }
  storyRun.curBeat = beat;
  const c = storyRun.combo;
  if(c.phase === "playing") storyComboRenderQuestion();
  else if(c.phase === "countdown") storyComboRenderCountdown();
  else if(c.phase === "done") storyComboReveal();
  else storyComboRenderReady(beat);
}
function storyComboReset(beat){
  storyRun.combo = {
    cat: beat.cat, phase:"ready", correct:0, answered:0, streak:0, maxStreak:0,
    deadline:null, done:false, timerId:null, countdownTimerId:null, countdownN:3, lastQ:null, cur:null,
  };
}
function storyComboRenderReady(beat){
  const boss = STORY_EVENT_BOSSES[beat.boss];
  screen.innerHTML = `
    <div class="card story-scene">
      <div class="boss-name">${esc(boss.icon)} ${esc(boss.name)}</div>
      <p class="story-text">${esc(beat.readyText || STORY_COMBO_DEFAULT_READY_TEXT)}</p>
      <div class="btn-row" style="justify-content:center">
        <button class="btn story-advance-btn" onclick="storyComboStart()">はじめる</button>
      </div>
    </div>
    ${storyFooterHtml()}`;
}
function storyComboStart(){
  const c = storyRun.combo;
  if(!c || c.phase !== "ready") return;
  c.phase = "countdown";
  c.countdownN = 3;
  storyComboRenderCountdown();
  storyComboTickCountdown();
}
function storyComboRenderCountdown(){
  const c = storyRun.combo;
  const label = c.countdownN > 0 ? String(c.countdownN) : "スタート！";
  screen.innerHTML = `
    <div class="card story-scene">
      <div class="combo-countdown">${esc(label)}</div>
    </div>
    ${storyFooterHtml()}`;
}
/* 3・2・1・スタート！の4コマを、STORY_COMBO_COUNTDOWN_MSごとにsetTimeoutでつないで表示する。
   guard（storyRun!==run または storyRun.combo!==c）は、途中でホームに戻る等してbeatを離れた
   場合の保険。実際にホームへ戻ったときは、showHome()側でclearStoryComboTimer()を呼び
   （countdownTimerIdもここでクリアされる）このタイマー自体を止めるので、通常はguardに
   引っかかる前にタイマーが消えている。 */
function storyComboTickCountdown(){
  const c = storyRun.combo;
  const run = storyRun;
  c.countdownTimerId = setTimeout(() => {
    if(storyRun !== run || storyRun.combo !== c) return;
    c.countdownN--;
    if(c.countdownN < 0){
      c.countdownTimerId = null;
      storyComboBeginPlay();
    }else{
      storyComboRenderCountdown();
      storyComboTickCountdown();
    }
  }, STORY_COMBO_COUNTDOWN_MS);
}
function storyComboBeginPlay(){
  const c = storyRun.combo;
  c.phase = "playing";
  c.deadline = Date.now() + STORY_COMBO_TIME_MS;
  storyComboRenderQuestion();
}
function storyComboRenderQuestion(){
  const c = storyRun.combo;
  const boss = STORY_EVENT_BOSSES[storyRun.curBeat.boss];
  const it = pickBattleQuestion(c.cat, c.lastQ);
  c.lastQ = it.q;
  c.cur = it;
  c.shownAt = Date.now();
  storyRun.order = shuffledOrder(it.c.length);
  screen.innerHTML = `
    <div class="card story-scene">
      <div class="boss-name">${esc(boss.icon)} ${esc(boss.name)}</div>
      <p class="note">残り時間内に、できるだけたくさん正解しよう！ コンボ（連続正解）が${STORY_COMBO_NEED}回続けばクリアだよ。</p>
      <p class="note" id="comboProgress">正解数：${c.correct}問　　いまのコンボ：${c.streak}　　最大コンボ：${c.maxStreak}</p>
      <div class="boss-timer-row"><div class="boss-timer-bar"><div id="comboTimerFill" class="boss-timer-fill"></div></div></div>
      <div class="boss-q-card">
        ${subInstructionHtml(c.cat, it)}
        <div class="boss-q-text">${markQuestionHtml(it.q)}</div>
        <div class="choices">
          ${storyRun.order.map((oi,pos)=>`<button class="choice" onclick="storyComboAnswer(${oi})"><span class="choice-num">${pos+1}</span>${esc(it.c[oi])}</button>`).join("")}
        </div>
        <div class="feedback" id="fb"></div>
      </div>
    </div>
    ${storyFooterHtml()}`;
  setupChoiceKeys(pos => storyComboAnswer(storyRun.order[pos]), it.c.length);
  startStoryComboTimer();
}
function startStoryComboTimer(){
  clearStoryComboTimer();
  const run = storyRun;
  run.combo.timerId = setInterval(() => {
    if(storyRun !== run || !storyRun.combo) return;
    if(storyRun.combo.deadline - Date.now() <= 0){
      clearStoryComboTimer();
      storyComboTimeUp();
    }
  }, 200);
  renderStoryComboTimerBar();
}
function clearStoryComboTimer(){
  if(storyRun && storyRun.combo){
    if(storyRun.combo.timerId){ clearInterval(storyRun.combo.timerId); storyRun.combo.timerId = null; }
    if(storyRun.combo.countdownTimerId){ clearTimeout(storyRun.combo.countdownTimerId); storyRun.combo.countdownTimerId = null; }
  }
}
function renderStoryComboTimerBar(){
  const el = document.getElementById("comboTimerFill");
  if(!el || !storyRun || !storyRun.combo) return;
  const remain = Math.max(0, storyRun.combo.deadline - Date.now());
  el.style.transition = "none";
  el.style.width = (100*remain/STORY_COMBO_TIME_MS) + "%";
  void el.offsetWidth;
  if(typeof requestAnimationFrame !== "function") return;
  requestAnimationFrame(() => {
    el.style.transition = `width ${remain}ms linear`;
    el.style.width = "0%";
  });
}
/* 1問答えるたびに次の問題へ自動で進む（コンボのテンポを保つため、他のbeatと違って
   「つぎへ」ボタンを挟まない）。正誤の色分けを一瞬見せてから、次の問題を描画する。
   野球ミニゲーム（baseball beat）と同じく、教員の指示でこのミニゲームだけは正誤をrecord()に
   反映する（他の中ボス・校正ミニゲームはrecord()を呼ばず分野レベルに影響しない設計のまま）。
   正解した瞬間に分野（ことわざ）のレベルが上がりうる。skipRecentAcc:trueにより、コンボアタック
   特有の速いペースが「直近の正答率」（分野別・分野横断とも）やfastGuess判定に混ざらないように
   している（baseball beatと同じ理由）。 */
function storyComboAnswer(origIdx){
  const c = storyRun.combo;
  if(!c || c.done) return;
  clearChoiceKeys();
  const ok = origIdx === c.cur.a;
  c.answered++;
  if(ok){ c.correct++; c.streak++; if(c.streak > c.maxStreak) c.maxStreak = c.streak; }
  else c.streak = 0;
  const elapsedMs = Date.now() - (c.shownAt || Date.now());
  const r = record(c.cat, c.cur, ok, elapsedMs, {skipRecentAcc:true});
  const btns = screen.querySelectorAll(".choice");
  btns.forEach((b,pos)=>{
    const oi = storyRun.order[pos];
    b.disabled = true;
    if(oi === c.cur.a) b.classList.add("correct");
    else if(oi === origIdx) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const lvChip = r.lvup ? `<span class="lvup-chip">${esc(CATS[c.cat].name)} Lv.${r.lv} にアップ！</span>` : "";
  const fb = document.getElementById("fb");
  fb.className = "feedback show " + (ok?"ok":"ng");
  fb.innerHTML = `<div class="verdict">${ok?"○ 正解！":"× ざんねん…"}${lvChip}</div>`;
  const progressEl = document.getElementById("comboProgress");
  if(progressEl) progressEl.textContent = `正解数：${c.correct}問　　いまのコンボ：${c.streak}　　最大コンボ：${c.maxStreak}`;
  if(c.deadline - Date.now() <= 0){
    clearStoryComboTimer();
    storyComboTimeUp();
  }else{
    setTimeout(() => {
      if(storyRun && storyRun.combo === c && !c.done) storyComboRenderQuestion();
    }, 550);
  }
}
function storyComboTimeUp(){
  const c = storyRun.combo;
  if(!c || c.done) return;
  c.done = true;
  c.phase = "done";
  storyComboReveal();
}
function storyComboReveal(){
  const c = storyRun.combo;
  const beat = storyRun.curBeat;
  const cleared = c.maxStreak >= STORY_COMBO_NEED;
  const boss = STORY_EVENT_BOSSES[beat.boss];
  const flavor = cleared ? beat.clearFlavor : beat.failFlavor;
  const st = loadStats();
  const sp = storyProgress(st);
  if(!sp.comboBest) sp.comboBest = {};
  const prevBest = sp.comboBest[sp.chapter] || 0;
  const isBetter = c.maxStreak > prevBest;
  if(isBetter) sp.comboBest[sp.chapter] = c.maxStreak;
  const isReplay = sp.completedChapters.includes(sp.chapter);
  let gotTreasure = false;
  if(cleared && !isReplay){
    st.items[boss.item] = (st.items[boss.item]||0) + 1;
    if(treasureDropAllowed(st)){
      st.bossPity[boss.id] = (st.bossPity[boss.id]||0) + 1;
      if(st.bossPity[boss.id] >= BOSS_PITY_MAX || Math.random() < BOSS_TREASURE_RATE){
        gotTreasure = true;
        st.bossPity[boss.id] = 0;
        st.items[boss.treasure] = (st.items[boss.treasure]||0) + 1;
      }
    }
  }
  saveStats(st);
  const rewardNote = !cleared ? "" : isReplay
    ? `<p class="story-text">「${esc(boss.name)}」を乗りこえた！（再プレイのため、今回はアイテムの入手はありません）</p>`
    : `<p class="story-text">「${esc(boss.name)}」を乗りこえた！<br>${esc(boss.icon)} <span class="drop-item">【${esc(boss.item)}】</span>を手に入れた！${gotTreasure ? `<br>✨ さらに、宝具<span class="drop-item treasure-drop">【${esc(boss.treasure)}】</span>を手に入れた！ ✨` : ""}</p>`;
  screen.innerHTML = `
    <div class="card story-scene">
      <div class="story-chapter-end">${cleared ? "🎉 クリア！" : "⏰ 時間切れ…"}</div>
      ${flavor ? `<p class="story-text">${esc(flavor)}</p>` : ""}
      <p class="story-text">正解数：${c.correct}問（${c.answered}問中）<br>最大コンボ：${c.maxStreak}回（${STORY_COMBO_NEED}回でクリア）</p>
      ${isBetter ? `<p class="note">🔥 最大コンボの自己ベストを更新しました！</p>` : ""}
      ${rewardNote}
      <div class="btn-row" style="justify-content:center">
        ${cleared
          ? `<button class="btn story-advance-btn" onclick="storyAdvance()">つづける</button>`
          : `<button class="btn" onclick="storyComboRetry()">もう一度挑戦する</button>`}
      </div>
    </div>

}
/* 再挑戦は毎回「はじめる」ボタンからではなく、テンポを保つためカウントダウンから再開する
   （説明文はもう読んでいるはずなので、ready画面は初回だけでよい、という判断）。 */
function storyComboRetry(){
  storyComboReset(storyRun.curBeat);
  const c = storyRun.combo;
  c.phase = "countdown";
  c.countdownN = 3;
  storyComboRenderCountdown();
  storyComboTickCountdown();
}

function storyResetJudgedRun(sp){
  sp.judgedRunCorrect = 0;
  sp.judgedRunTotal = 0;
}
/* 章クリア時に、この周回で解いた選択肢問題（judgedChoice beat）の正答率を確定させる。
   sp.judgedRunCorrect/judgedRunTotalは章を最初から始めるたび（startStoryMode／
   storyReplayChapter）に0リセットされる、章1回分の周回カウンタ。
   このプレイの正答率が自己ベスト（sp.judgedBest[章key]）より高いときだけ上書きする
   （分数の大小比較は掛け算で行い、ゼロ除算・浮動小数の誤差を避ける）。
   自己ベストが今回はじめて100%に達したときだけ、STORY_JUDGED_PERFECT_ITEMを1個渡す
   （すでに100%を達成済みの章を再プレイしても、何度でも入手できてしまわないようにするため）。
   その章にまだ選択肢問題が1問もない場合（total===0）はnullを返し、呼び出し側は何も表示しない。 */
function storyFinalizeJudgedRate(st, sp){
  const total = sp.judgedRunTotal || 0;
  const correct = sp.judgedRunCorrect || 0;
  storyResetJudgedRun(sp);
  if(total === 0) return null;
  if(!sp.judgedBest) sp.judgedBest = {};
  const prev = sp.judgedBest[sp.chapter];
  const isBetter = !prev || correct * prev.total > prev.correct * total;
  const wasPerfect = !!prev && prev.correct >= prev.total;
  if(isBetter) sp.judgedBest[sp.chapter] = {correct, total};
  const nowPerfect = correct >= total;
  let gotPerfectItem = false;
  if(isBetter && nowPerfect && !wasPerfect){
    st.items[STORY_JUDGED_PERFECT_ITEM] = (st.items[STORY_JUDGED_PERFECT_ITEM]||0) + 1;
    gotPerfectItem = true;
  }
  return {correct, total, pct: Math.round(100*correct/total), isBetter, gotPerfectItem};
}
function storyChapterEnd(){
  const st = loadStats();
  const sp = storyProgress(st);
  if(!sp.completedChapters.includes(sp.chapter)) sp.completedChapters.push(sp.chapter);
  const rate = storyFinalizeJudgedRate(st, sp);
  /* 第3章クリアで、通常のボス戦だけで使える必殺技システムを解放する（教員の指示、2026-07-20〜）。
     st.specialMoveUnlockedの真偽で一度きりの宣言にしているので、この章を再プレイしても
     （すでにtrueのままなので）二度目の解放メッセージは出ない。 */
  let unlockedFinisher = false;
  if(sp.chapter === "ch3" && !st.specialMoveUnlocked){
    st.specialMoveUnlocked = true;
    unlockedFinisher = true;
  }
  /* 第8章クリアで、太郎・花子のセリフに顔画像が表示されるようになる（教員の指示、2026-07-23〜）。
     specialMoveUnlockedと同じく、一度きりの宣言にするためのフラグ（再プレイでは出さない）。 */
  let unlockedFace = false;
  if(sp.chapter === "ch8" && !st.storyFaceUnlocked){
    st.storyFaceUnlocked = true;
    unlockedFace = true;
  }
  /* 第9章クリアで、ことのはの「転生」システムを解放する（教員の指示、2026-07-31〜）。
     第9章のストーリー本編（ビート・クイズプール）は未実装のため、この分岐は現状は
     到達不能（＝STORY_CHAPTERSにch9が存在せず、sp.chapterが"ch9"になることがない）だが、
     specialMoveUnlocked/storyFaceUnlockedと同じ一度きり宣言のパターンで先に用意しておき、
     第9章を実装する際にそのまま機能する。 */
  let unlockedRebirth = false;
  if(sp.chapter === "ch9" && !st.kotonohaRebirthUnlocked){
    st.kotonohaRebirthUnlocked = true;
    unlockedRebirth = true;
  }
  saveStats(st);
  const pronoun = sp.chapter === "ch1" ? STORY_PRONOUN_LABELS[sp.flags.pronoun] : null;
  const pronounNote = pronoun ? `<p class="note">✨ 一人称が、「${esc(pronoun)}」に設定されました！</p>` : "";
  const kumi = sp.chapter === "ch8" ? STORY_KUMI_LABELS[sp.flags.kumiSlogan] : null;
  const kumiNote = kumi ? `<p class="note">✨ 組団が、「${esc(kumi)}」に設定されました！</p>` : "";
  const rateNote = rate
    ? `<p class="note">クリア率 ${rate.pct}%${rate.isBetter ? "　※自己ベストを更新しました！" : ""}</p>`
    : "";
  const perfectNote = rate && rate.gotPerfectItem
    ? `<p class="note">🎉 選択肢問題、全問正解達成！ 🎁<span class="drop-item">【${esc(STORY_JUDGED_PERFECT_ITEM)}】</span>を手に入れた！</p>`
    : "";
  const finisherNote = unlockedFinisher
    ? `<p class="note finisher-unlock-note">⚡必殺技システムを解放した！　通常のボス戦で５問連続正解するとゲージが満タンになり、「${esc(finisherMoveName(st))}」が使えるようになる。</p>`
    : "";
  const faceNote = unlockedFace
    ? `<p class="note">✨ これから、太郎や花子が話すときに、その顔が画面に表示されるようになる！</p>`
    : "";
  /* ストーリー中（kotonohaRebirthReveal）で実際に転生が実行できていれば、ここでの文面は
     「もう一度、育て直せる」という案内に変える（一度目はすでに体験済みのため）。育ち方の
     都合で実行できなかった場合は、従来どおり「これから使えるようになる」という案内のまま。 */
  const rebirthNote = unlockedRebirth
    ? (sp.flags.ch9RebirthDone === "yes"
        ? `<p class="note">🔁 ことのはの「転生」が解放された！　これからは、ホーム画面からいつでも卵の姿に立ち返って育て直せる。</p>`
        : `<p class="note">🔁 ことのはの「転生」を解放した！　分野のバランスが整えば、ホーム画面から卵の姿に戻って育て直せるようになる。</p>`)
    : "";
  screen.innerHTML = `
    <div class="card story-scene">
      <div class="story-chapter-end">📖 ${esc(storyChapterDef(sp.chapter).title)} クリア！</div>
      <p class="story-text">${esc(storyChapterDef(sp.chapter).epilogue || "")}</p>
      ${pronounNote}
      ${kumiNote}
      ${rateNote}
      ${perfectNote}
      ${finisherNote}
      ${faceNote}
      ${rebirthNote}
      <div class="btn-row" style="justify-content:center">
        <button class="btn" onclick="showHome()">ホームへ</button>
        <button class="btn secondary" onclick="storyReplayChapter()">もう一度プレイする</button>
      </div>
      <p class="note">※ボス戦のアイテム・宝具は再プレイではもらえません。選択肢問題の正答率は、今回の記録の方が自己ベストより高い場合だけ更新されます。</p>
    </div>`;
}
/* クリア済みの章を最初からもう一度プレイする。completedChaptersはそのままなので、
   record()や宝具・クリア報酬アイテムのドロップは自動的に封じられる
   （storyGradeQuiz・storyBattleResolve内のisReplay判定を参照）。
   選択肢問題の正答率だけは例外で、自己ベストを上回れば再プレイでも更新される
   （storyFinalizeJudgedRate参照）ので、judgedRunCorrect/judgedRunTotalもここで0に戻す。 */
function storyReplayChapter(){
  const st = loadStats();
  const sp = storyProgress(st);
  sp.beatIdx = 0;
  storyResetJudgedRun(sp);
  saveStats(st);
  storyRun = storyFreshRun();
  storyRenderBeat();
}

  g.gain.setValueAtTime(0.0001,t0);

   一時的な状態（セーブしない、教員の指示、2026-08-20〜：「7巻まで達成した場合は、
   シンプルにしたい。『〜巻』というボタンはやめて、4つだけに」）。「クリアした問題に
   挑戦」ボタンを押すとtrueにして通常の一覧を出す。サブクエストに入り直すたび
   （bgLoadRec）に、必ず簡易表示へ戻す。 */
let bgShowFullList = false;
function bgLoadRec(){
  const st = loadStats();
  BG_REC = (st.bunsetsuGiri && st.bunsetsuGiri.open) ? st.bunsetsuGiri : {open:1, rank:{}, best:{}};
  if(!BG_REC.rank) BG_REC.rank={};
  if(!BG_REC.best) BG_REC.best={};
  /* 「文節」編・「単語」編・最後の巻のオールクリアお祝い（＋30経験値・ド派手な演出）は
     一度きりなので、すでにお祝い済みかどうかをここに持たせる（教員の指示、2026-08-17〜）。 */
  if(!BG_REC.milestones) BG_REC.milestones = {bunsetsu:false, tango:false, final:false};
  if(BG_REC.version !== BG_REC_VERSION){
    BG_REC = {open:1, rank:{}, best:{}, milestones:{bunsetsu:false, tango:false, final:false}, version:BG_REC_VERSION};
    bgSaveRec();
  }
  bgShowFullList = false;
}
function bgSaveRec(){
  const st = loadStats();
  st.bunsetsuGiri = BG_REC;
  saveStats(st);
}
/* clearCountを持つ巻（三・六・七の巻）は、合格ラインの問数に達したあとも「腕試し」として
   問題が出続け（count問まで、または力尽きるまで）、段位・次の巻の解放は今までbgShowResult
   （その回が正式に終わったとき＝力尽きたか、countぶん全部解き終えたとき）でしか保存して
   いなかった。そのため、合格ラインの20問（七の巻は10問）を正解していても、その後「腕試し」
   区間の途中でホームに戻る・アプリを閉じるなどして回を最後まで終えなかった場合、その回の
   結果が一切保存されず、次の巻が開かないことがあった（教員の指摘、2026-08-21〜：「20問以上
   正解しているのに七の巻が開かないことがある」）。これを防ぐため、合格ラインに達した
   その瞬間（bgUpdateSentenceのjustCleared）に、最低でも「初伝」の段位と次の巻の解放を
   その場で確定・保存する。escalate系の巻の最終段位（bgRankOfEscalate）は合格すれば必ず
   初伝以上になる設計なので、ここで先に初伝を確定させても、あとで回を最後まで終えたときに
   より良い段位（目録・免許・皆伝）で上書きされる分には何の問題もない（bgShowResult側の
   「今までより良い段位のときだけ上書き」という既存ロジックがそのまま働く）。 */
function bgSecureClearUnlock(sid){
  const wasRank = BG_REC.rank[sid];
  if(BG_RANK_ORDER["初　伝"] > (wasRank!==undefined ? BG_RANK_ORDER[wasRank] : -1)){
    BG_REC.rank[sid] = "初　伝";
  }
  if(BG_REC.open===sid && sid<BG_STAGES.length){ BG_REC.open = sid+1; }
  bgSaveRec();
}
const BG_BEST = {};

/* ---------- 拍・盤面の寸法 ---------- */
const BG_BLADE_RATIO = 0.36;
const BG_MARK_H_RATIO = 0.62;
let BG_M = null;
function bgMeasure(){
  const field = bg$("bgField");
  const h=field.clientHeight, w=field.clientWidth;
  const cell=Math.max(26, Math.min(46, Math.floor(h/13), Math.floor(w/5.2)));
  BG_M={H:h, W:w, CELL:cell, BLADE:Math.round(h*BG_BLADE_RATIO)};
  return BG_M;
}
function bgMetrics(){ return BG_M || bgMeasure(); }
function bgComboMult(){ return Math.min(BG_COMBO_CAP, 1 + BG.combo*BG_COMBO_STEP); }
function bgAddScore(n){ BG.score += Math.round(n * BG.tempo.mult); }

/* ---------- 区切り記号の解釈（独立版のまま） ---------- */
function bgParseSeg(seg){
  const chars=[], gapType={};
  let pending=null;
  for(const ch of seg){
    if(ch==="/") pending="bunsetsu";
    else if(ch==="|"){ if(pending!=="bunsetsu") pending="tango"; }
    else{ if(chars.length>0 && pending) gapType[chars.length]=pending; pending=null; chars.push(ch); }
  }
  return {chars, gapType};
}
function bgParseBunsetsu(seg){ return seg.split("/").map(b=>b.split("|")); }

/* =========================================================================
   まちがいの解説
   独立版の留め（時間の外でもう一度確かめる画面）は廃止した（教員の指示：
   「止めは廃止」）。代わりに、実際に斬りそこねた・取り違えたそのgap（BG.track.gaps
   の要素）の中身から、結果画面でその場で理由を組み立てる。1つの文のgapは
   すべてsi（文番号）が同じで、chars（その文の全文字）を共有しているので、
   同じ文のgapを集めればgapType（切れ目の種類）を作り直せる。 */
function bgWordAt(chars, gapType, i){
  let j=i+1;
  while(j<chars.length && !gapType[j]) j++;
  return chars.slice(i,j).join("");
}
function bgEnclosingWord(chars, gapType, i){
  let start=i; while(start>0 && !gapType[start]) start--;
  let end=i; while(end<chars.length && !gapType[end]) end++;
  return chars.slice(start,end).join("");
}
function bgStripPunct(s){ const t = s.replace(/[。、]+$/,""); return t || s; }
/* si番目の文のgapType（{ci: "bunsetsu"|"tango"}）を、BG.track.gapsから作り直す。 */
function bgGapTypeOfSentence(si){
  const gapType={};
  BG.track.gaps.forEach(g=>{ if(g.si===si && g.raw) gapType[g.ci]=g.raw; });
  return gapType;
}
/* 1件のまちがい（BG.missesの要素）から、具体的な語を示した解説文を作る。
   karaburi（空振り）だけは、当たったgapが無い（見当のずれ）ので語を示せない。 */
/* 文法が苦手な子でも読めるように、（教員の指示、2026-08-16〜）
   ①その語が何なのか一言で言う → ②なぜそこが切れ目なのか／ではないのかを短く言う →
   ③次はどうすればいいかで締める、の3段構えにそろえてある。専門用語（自立語・付属語）は
   必ず、それが何かの説明をカッコで添えてから使う。 */
function bgExplainMiss(mi){
  if(!mi.chars) return "タイミングがずれたか、切れ目のない場所で刀を振っちゃったみたい。あわてなくて大丈夫。拍に合わせて、もう一度ねらってみよう。";
  const chars=mi.chars, gapType=bgGapTypeOfSentence(mi.si), ci=mi.ci;
  if(mi.kind==="gochu"){
    const word = bgStripPunct(bgEnclosingWord(chars, gapType, ci));
    const pos = bgPosOf(word);
    return (pos ? `「${word}」は${pos}だよ。` : `「${word}」は、これで1つの言葉だよ。`)
      + `ここは1つの単語のとちゅう。ここで切ってしまうと、意味がわからないバラバラの音になってしまうよ。`;
  }
  const word = bgStripPunct(bgWordAt(chars, gapType, ci));
  const info = BG_PARTICLE_NOTES[word];
  const wordPos = BG_WORD_POS[word] || "自立語";
  if(mi.kind==="minogashi"){
    return `「${word}」は${wordPos}だよ。自分1つだけで意味がわかる言葉（これを「自立語」と呼ぶよ）は、いつも新しい文節のスタート地点。だから、ここは大太刀で切ってほしかったところ。`;
  }
  if(mi.kind==="minogashiT"){
    return info
      ? `「${word}」は${info.pos}。${info.note}こういう、前の言葉にくっついてはたらく言葉（「付属語」と呼ぶよ）の前は、単語としては切れ目になる。ここは小刀で切ってほしかったところ。`
      : `「${word}」は、前の言葉にくっついてはたらく「付属語」だよ。付属語の前は、単語としては切れ目になる。ここは小刀で切ってほしかったところ。`;
  }
  if(mi.kind==="ooburi"){
    return (info ? `「${word}」は${info.pos}。${info.note}` : `「${word}」は、前の言葉にくっついてはたらく「付属語」だよ。`)
      + `付属語は前の自立語とセットで1つの文節を作るから、ここではまだ文節は終わっていないよ。単語としては切れても、文節としてはまだ続いているから、大太刀ではなく小刀の出番だった。`;
  }
  if(mi.kind==="kogatana"){
    return `「${word}」は${wordPos}だよ。自分1つだけで意味がわかる言葉（「自立語」）だから、ここから新しい文節が始まる。単語の切れ目でもあるけれど、それ以上に文節の切れ目。だから小刀ではなく大太刀の出番だった。`;
  }
  return "";
}

/* =========================================================================
   出題する文を選ぶ
   独立版のbuildTrack()は「巻の対象lvの文をシャッフルして先頭からcount個」だったが、
   ここではボキャブラ・シューティングのvsPickNextItem（既出単語を使い切るまで
   同じ語を引かない）と同じ考え方に組み替える（教員の指示「出題の範囲・選び方を
   知識DXを利用して組み替える」）。対象となる文の範囲（stage.lv）自体は
   STAGES定義のまま変えていない。使用済みの記録はプレイセッション中だけ持てば
   十分なので（vsのusedWordsと同じく）永続化はしない。 */
let bgUsedIdx = {};
function bgPickOneSentence(stage){
  const key = stage.lv.join(",");
  const pool = BUNSETSU_SENTENCES
    .map((s, idx) => ({s, idx}))
    .filter(x => stage.lv.includes(x.s.lv));
  if(!pool.length) return null;
  if(!bgUsedIdx[key] || bgUsedIdx[key].length >= pool.length) bgUsedIdx[key] = [];
  const used = bgUsedIdx[key];
  let pick;
  do{ pick = pool[Math.floor(Math.random()*pool.length)]; }
  while(pool.length > 1 && used.includes(pick.idx));
  used.push(pick.idx);
  return pick.s;
}
/* 合格に必要な問数（stage.clearCount、無ければstage.count）ぶんは、これまでどおり
   やさしい文から順に並べる「本編」。六の巻のように count が clearCount より大きい巻は、
   本編のあとに残りをそのままランダムな順（並べ替えない）で継ぎ足す「腕試し」区間になる
   （教員の指示、2026-08-20〜：「クリアとなる20問以降も、問題は出続けるように」）。
   bgPickOneSentence自体がプールを使い切ったら払い出し済みをリセットして続けられるので、
   countがプールの総数（46）を超えても問題なく必要数だけ引ける。 */
function bgPickSentencesForStage(stage){
  const coreN = Math.min(stage.clearCount || stage.count, stage.count);
  const core = [];
  for(let i=0;i<coreN;i++){
    const s = bgPickOneSentence(stage);
    if(s) core.push(s);
  }
  core.sort((x,y)=>x.lv-y.lv);              // 本編は、易しい文から
  const tail = [];
  for(let i=coreN;i<stage.count;i++){
    const s = bgPickOneSentence(stage);
    if(s) tail.push(s);
  }
  return core.concat(tail);
}

/* =========================================================================
   巻物を編む（独立版buildTrackと同じ組み立て方。出題の抽選だけbgPickSentencesForStageへ差し替え）
   ========================================================================= */
/* 文と文のあいだの休み（BG_REST_BEATS）に、ライフ回復アイテムをランダムに置く
   （教員の指示、2026-08-15〜は「3文クリアごと」の固定間隔だったが、2026-08-19〜
   「5問に1回を目安に、ランダムで出現」に変更。1文ごとに20％の確率で抽選するので、
   平均すれば5問に1回のペースで出現する）。手本（kind==="demo"）は数えない。
   休みは2拍あるので、その2拍目（b+1）に置けば次の文の1文字目とは重ならない。 */
const BG_ITEM_CHANCE = 0.2;
function bgBuildTrack(stage){
  const picked = bgPickSentencesForStage(stage);

  const cells=[], gaps=[], sentences=[], items=[];
  let b = BG_LEAD_BEATS, si = 0;
  picked.forEach(s => {
    const passes = stage.demo ? ["demo","echo"] : ["solo"];
    passes.forEach(kind => {
      const {chars, gapType} = bgParseSeg(s.seg);
      const start = b;
      chars.forEach((ch,i) => {
        if(i>0){
          const raw = gapType[i];
          let need = null;
          if(raw){
            if(stage.blades.length === 2)         need = raw;
            else if(stage.blades[0]==="bunsetsu") need = (raw==="bunsetsu") ? "bunsetsu" : null;
            else                                  need = "tango";
          }
          gaps.push({beat:b, need, raw, si, ci:i, chars, demo:(kind==="demo"),
                     done:false, judged:null});
        }
        cells.push({ch, beat:b, si});
        b++;
      });
      sentences.push({seg:s.seg, lv:s.lv, chars, start, end:b, idx:si, kind});
      si++;
      if(kind!=="demo" && Math.random() < BG_ITEM_CHANCE){
        items.push({beat:b+1, done:false});
      }
      b += BG_REST_BEATS;
    });
  });
  /* clearCountを持つ巻（六の巻）は、合格ラインまでの拍数も控えておく（進み具合バーを
     「合格までの距離」として見せるのに使う、bgUpdateSentence参照。教員の指示、
     2026-08-20〜：「クリアとなる20問以降も、問題は出続けるように」）。 */
  const clearBeat = stage.clearCount ? (sentences[stage.clearCount-1] || sentences[sentences.length-1] || {}).end : null;
  return {cells, gaps, sentences, items, totalBeats:b, picked, hints:!!stage.hints, clearBeat};
}

/* =========================================================================
   段を始める（独立版startStageのまま。要素はすべてbg$で取得）
   独立版にあった「同じ譜面をそのまま再走できる」keepTrack/bgRewindは廃止し、
   もう一度あそぶときも常に新しくbgBuildTrackする（教員の指示：「一回やって、
   そのあとまたやろうとしたら、動きません」の修正。gaps/itemsをrewindで
   使い回す作りが再走時の不具合の温床になっていたため、作り直しに一本化した）。 */
function bgStartStage(stageId, tempo){
  bgAc();
  const stage = BG_STAGES.find(s=>s.id===stageId);
  const track = bgBuildTrack(stage);
  BG = {
    stage, tempo, track,
    beatMs: Math.round(stage.beat * tempo.rate),
    speedStep: 0,
    renderFrom: 0,
    phase:"countin",
    beat:-BG_LEAD_BEATS,
    t0:0, score:0, combo:0, maxCombo:0,
    life:BG_LIFE_MAX, failed:false,
    misses:[], offsets:[],
    hit:0, perfect:0, miss:0, eventCorrect:0,
    gi:0, di:0,
    schedBeat:0,
    audio0:null, beat0:0,
    lastCount:-99,
    curSentence:0, cleanSentences:0, sentenceClean:true, sentenceLifeLost:false,
    clearAnnounced:false,
  };
  bg$("bgVeil").style.display="none";
  bg$("bgHudTitle").textContent = stage.name;
  bg$("bgInfoLv").textContent = stage.sub;
  bg$("bgInfoBpm").textContent = stage.escalate ? (tempo.name+"（速さ100%）") : tempo.name;
  bgSetPad(stage);
  bgDemoNow=false; bg$("bgField").style.opacity=""; bgTagKind=null; bg$("bgDemoTag").className="demotag";
  bg$("bgApp").classList.toggle("important-stage", !!stage.important);
  bgMeasure();
  bgBuildStrip();
  bgDrawHud();
  bgLastT=0;
  if(!bgRaf) bgRaf=requestAnimationFrame(bgLoop);
}
/* 「まとめ」の巻の速度アップ（教員の指示、2026-08-19〜）。bgUpdateSentenceが、
   文を1つ解き終えるたびに呼ぶ（正解・ミスは問わない）。BG_SPEED_GRACE問より先は
   何もせず、それ以降はBG_SPEED_INTERVAL問ごとに1段だけ速度を上げる。BG.speedStepに
   際限なく足していくだけなので、速度そのものに頭打ちは無い（BG_SPEED_MULT_FLOORは
   拍間隔が0や負値に壊れないための技術的な下限）。BG.beatMsを引き直したあと、
   bgLoopの拍換算アンカー（audio0/beat0）も同時に引き直すことで、速度が変わった
   瞬間に帯の動きが飛ばないようにする。 */
function bgSpeedStepUp(){
  if(!BG || !BG.stage.escalate) return;
  BG.speedStep = (BG.speedStep||0) + 1;
  const mult = Math.max(BG_SPEED_MULT_FLOOR, 1 - BG.speedStep*BG_SPEED_STEP_DELTA);
  BG.beatMs = Math.round(BG.stage.beat * BG.tempo.rate * mult);
  BG.beat0 = BG.beat;
  const ctxRaw = BG_SND.on ? bgAc() : null;
  const ctx = (ctxRaw && ctxRaw.state === "running") ? ctxRaw : null;
  BG.audio0 = ctx ? ctx.currentTime : null;
  const pct = Math.round(100/mult);
  const bpmEl = bg$("bgInfoBpm");
  if(bpmEl) bpmEl.textContent = BG.tempo.name+"（速さ"+pct+"%）";
}
function bgSetPad(stage){
  const two = stage.blades.length===2;
  bg$("bgBtnCut").classList.toggle("hidden", !stage.blades.includes("bunsetsu"));
  bg$("bgBtnKo").classList.toggle("hidden",  !stage.blades.includes("tango"));
  bg$("bgBtnCut").disabled=false; bg$("bgBtnKo").disabled=false;
  if(stage.blades[0]==="tango" && !two){
    bg$("bgBtnKo").innerHTML = "小　刀<small>単語の切れ目</small>";
    bg$("bgHint").textContent = "スペース／→／F＝小刀　　語の途中は見送る";
  }else if(!two){
    bg$("bgHint").textContent = "スペース／→／J＝大太刀　　文節でないところは見送る";
  }else{
    bg$("bgHint").textContent = "←／F＝小刀　　→／J／スペース＝大太刀　　語の途中は見送る";
  }
}
/* ---------- 盤面（独立版のまま） ---------- */
const BG_SMALL_KANA="ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮ";
function bgBuildStrip(){
  const m=bgMeasure(), tr=BG.track;
  const stripEl=bg$("bgStrip"), bladeEl=bg$("bgBlade"), beatDotEl=bg$("bgBeatdot"),
        bandEl=bg$("bgBladeBand"), cellsEl=bg$("bgCells");
  stripEl.style.width=m.CELL+"px";
  bladeEl.style.top=m.BLADE+"px";
  beatDotEl.style.top=m.BLADE+"px";
  const tolPx = BG_WIN_HIT*m.CELL;
  bandEl.style.top=(-tolPx)+"px"; bandEl.style.height=(tolPx*2)+"px";
  cellsEl.innerHTML="";
  /* リサイズ時などbgBuildStripが再実行されると、cells全部に新しいDOM要素が作り直される
     （tr.cells.forEachの中でc.elを丸ごと差し替える）。bgRenderの間引きポインタ
     （BG.renderFrom）を進めたままにしておくと、差し替わった先頭側の要素が二度と
     位置・非表示の更新を受けられず置き去りになるので、作り直すたびに0へ戻す。 */
  BG.renderFrom=0;
  tr.cells.forEach(c => {
    const d=document.createElement("div");
    d.className="cell";
    if(c.ch==="。"||c.ch==="、") d.classList.add("kutou");
    else if(BG_SMALL_KANA.includes(c.ch)) d.classList.add("small");
    d.innerHTML="<span></span>"; d.firstChild.textContent=c.ch;
    d.style.height=m.CELL+"px";
    d.style.fontSize=Math.round(m.CELL*0.72)+"px";
    d.style.left=(m.W/2-m.CELL/2)+"px";
    d.style.width=m.CELL+"px";
    /* 文字が流れる帯の上のほうに、黒い■のような塊が出るバグの修正（教員の指示、
       2026-08-20〜）。原因はbgRenderの間引き最適化：まだ画面に入ってこない先の文字は
       「触らずに済ませる」ため一切のスタイル更新をスキップするようにしたが、生成した
       直後のcell要素はtransform（位置）はおろかvisibilityも一度も設定されていない状態
       だった。position:absoluteでtopもtransformも無い要素は、初期状態のまま帯の
       いちばん上（0付近）に visible で重なって並んでしまい、まだ出番の来ていない
       何十〜何百文字ぶんの文字（色は--sumiの濃いインク色）が積み重なって、遠目には
       黒く塗りつぶしたような塊に見えていた。生成した時点で最初からvisibility:hiddenに
       しておき、bgRenderが実際に画面内に入ってきたときだけ表示・位置決めするように
       直す（bgRender側の「触らずに済ませる」最適化はそのまま活かせる）。 */
    d.style.visibility="hidden";
    cellsEl.appendChild(d);
    c.el=d;
  });
  BG.marks = BG.marks || {};
  const keep = (BG.markData || []).filter(k=>!k.hint);
  BG.markData = [];
  keep.forEach(k => bgAddMark(k.beat, k.kind, k.type));
  if(BG.track.hints){
    BG.track.gaps.forEach(g => {
      if(!g.need || g.done) return;
      const isB = (g.raw==="bunsetsu");
      const el=document.createElement("div");
      el.className="cutmark";
      el.style.fontSize=Math.round(m.CELL*(isB?0.46:0.56))+"px";
      el.style.height=Math.round(m.CELL*BG_MARK_H_RATIO)+"px";
      el.style.left=(m.W/2-m.CELL/2)+"px"; el.style.width=m.CELL+"px";
      el.innerHTML=isB?'<span class="ne">ね</span>':'<span class="ko-hint"></span>';
      cellsEl.appendChild(el);
      BG.markData.push({beat:g.beat, el, hint:true, guide:g});
    });
  }
  (tr.items||[]).forEach(it => {
    if(it.done) return;
    const el=document.createElement("div");
    el.className="bgItem";
    /* 「❤」を異体字セレクタ（U+FE0F）無しで使うと、端末やフォントによっては
       絵文字ではなく文字扱いになり、対応するグリフが無いフォントで黒い「■」
       （いわゆる「豆腐」）として表示されてしまう（教員の指示、2026-08-20〜：
       「流れる文字の上の方に、黒い『■』が表示されるバグ」の原因）。アプリの
       他の箇所（STAT_LABEL_SHORT等）はすべて「❤️」とVS16付きで統一しているので、
       ここも合わせる。 */
    el.innerHTML="<span>❤️</span>";
    el.style.height=m.CELL+"px";
    el.style.fontSize=Math.round(m.CELL*0.6)+"px";
    el.style.left=(m.W/2-m.CELL/2)+"px";
    el.style.width=m.CELL+"px";
    cellsEl.appendChild(el);
    it.el=el;
  });
}

function bgYOf(beat){ const m=bgMetrics(); return m.BLADE + (beat - BG.beat)*m.CELL; }

/* ---------- 切れ目の印（独立版のまま） ---------- */
function bgAddMark(beat, kind, type){
  const m=bgMetrics();
  const small=(type==="tango");
  const el=document.createElement("div");
  el.className="cutmark"+(kind==="missed"?" missed":kind==="pass"?" pass":"")+(small?" tango":"");
  el.style.fontSize=Math.round(m.CELL*0.56)+"px";
  el.style.height=Math.round(m.CELL*BG_MARK_H_RATIO)+"px";
  el.innerHTML = small ? '<span class="hbar"></span>' : '<span class="slash"></span>';
  el.style.left=(m.W/2-m.CELL/2)+"px";
  el.style.width=m.CELL+"px";
  bg$("bgCells").appendChild(el);
  BG.markData.push({beat, kind, type, el});
}
/* =========================================================================
   メインループ（独立版のまま。時間だけが進む。押しても止まらない）
   ========================================================================= */
let bgLastT=0;
function bgLoop(t){
  bgRaf=requestAnimationFrame(bgLoop);
  if(!BG){ return; }
  const dt = bgLastT ? Math.min(0.1,(t-bgLastT)/1000) : 0;
  bgLastT=t;

  if(BG.phase==="countin" || BG.phase==="run"){
    const ctxRaw = BG_SND.on ? bgAc() : null;
    const ctx = (ctxRaw && ctxRaw.state === "running") ? ctxRaw : null;
    if(ctx){
      if(BG.audio0===null || Math.abs((ctx.currentTime-BG.audio0)*1000/BG.beatMs - (BG.beat-BG.beat0)) > 0.9){
        BG.audio0 = ctx.currentTime; BG.beat0 = BG.beat;
      }
      BG.beat = BG.beat0 + (ctx.currentTime - BG.audio0)*1000/BG.beatMs;
    }else{
      BG.audio0 = null;
      BG.beat += dt*1000 / BG.beatMs;
    }
    bgSchedule();
    bgPulse();
    if(BG.phase==="countin"){
      bgCountIn();
      if(BG.beat >= 0){ BG.phase="run"; }
    }
    if(BG.phase==="run"){
      bgAutoDemo();
      const dm=bgInDemo(BG.beat);
      if(dm!==bgDemoNow){
        bgDemoNow=dm;
        bg$("bgBtnCut").disabled=dm; bg$("bgBtnKo").disabled=dm;
        bg$("bgField").style.opacity = dm ? ".82" : "";
      }
      if(BG.stage.demo) bgSetDemoTag(bgCurrentKind(BG.beat));
      bgSweepMissed();
      bgSweepItems();
      if(BG.phase!=="run"){ bgRender(); return; }   // ライフが尽きてbgFailStageが呼ばれた場合はここで打ち切る
      bgUpdateSentence();
      if(BG.beat > BG.track.totalBeats + 1){ bgFinishStage(); return; }
    }
  }
  bgRender();
}

function bgSchedule(){
  const ctxRaw = BG_SND.on ? bgAc() : null;
  const ctx = (ctxRaw && ctxRaw.state === "running") ? ctxRaw : null;
  if(!ctx) { BG.schedBeat = Math.floor(BG.beat)+1; return; }
  const now = ctx.currentTime, secPerBeat = BG.beatMs/1000;
  let b = Math.max(BG.schedBeat, Math.ceil(BG.beat));
  while((b - BG.beat)*secPerBeat < 0.3){
    const at = (BG.audio0!==null) ? BG.audio0 + (b - BG.beat0)*secPerBeat : now + (b - BG.beat)*secPerBeat;
    if(at > now - 0.02) bgSchedKo(ctx, Math.max(now, at), ((b%4)+4)%4===0);
    b++;
    if(b > BG.track.totalBeats+2) break;
  }
  BG.schedBeat = b;
}
function bgPulse(){
  const b=Math.floor(BG.beat);
  if(b!==BG.lastPulse){
    BG.lastPulse=b;
    const bladeEl=bg$("bgBlade"), beatDotEl=bg$("bgBeatdot");
    bladeEl.classList.remove("beat"); void bladeEl.offsetWidth; bladeEl.classList.add("beat");
    beatDotEl.classList.remove("on"); void beatDotEl.offsetWidth; beatDotEl.classList.add("on");
  }
}
function bgCountIn(){
  const n = Math.ceil(-BG.beat);
  if(n!==BG.lastCount && n>=1 && n<=BG_LEAD_BEATS){
    BG.lastCount=n;
    const w=document.createElement("div");
    w.className="countin";
    w.innerHTML='<span class="go">'+["","一","二","三","四"][Math.min(4,n)]+'</span>';
    bg$("bgField").appendChild(w); setTimeout(()=>w.remove(), 520);
  }
}

/* 手本：機械がその場で斬ってみせる（独立版のまま） */
function bgAutoDemo(){
  const tr=BG.track;
  while(BG.di < tr.gaps.length){
    const g=tr.gaps[BG.di];
    if(!g.demo){ BG.di++; continue; }
    if(BG.beat >= g.beat){
      if(!g.done && g.need){
        g.done=true; g.judged="demo";
        bgAddMark(g.beat,"cut",g.need);
        bgEatHint(g.beat);
        bgFxSlash(bgYOf(g.beat), false, g);
        g.need==="tango" ? bgSndKo() : bgSndCut(false);
      }else if(!g.done){ g.done=true; g.judged="pass"; }
      BG.di++;
    }else break;
  }
}
let bgDemoNow=false, bgTagKind=null;
function bgCurrentKind(beat){
  const s=BG.track.sentences.find(x=>beat>=x.start-1 && beat<=x.end+0.5);
  return s ? s.kind : null;
}
function bgInDemo(beat){ return bgCurrentKind(beat)==="demo"; }
function bgSetDemoTag(kind){
  if(kind===bgTagKind) return;
  bgTagKind=kind;
  const el=bg$("bgDemoTag");
  if(kind==="demo"){
    el.className="demotag on demo";
    el.innerHTML='手 本 中<small>見て覚える。まだ斬らなくていい</small>';
  }else if(kind==="echo"){
    el.className="demotag on echo";
    el.innerHTML='返 し<small>いまの手本のとおりに、自分で斬る</small>';
  }else{
    el.className="demotag";
  }
}
function bgEatHint(beat){
  const i=(BG.markData||[]).findIndex(k=>k.hint && Math.abs(k.beat-beat)<0.01);
  if(i>=0){ BG.markData[i].el.remove(); BG.markData.splice(i,1); }
}

/* 見のがし：狙点を当たり幅ぶん過ぎたら確定（独立版のまま） */
function bgSweepMissed(){
  const tr=BG.track;
  while(BG.gi < tr.gaps.length){
    const g=tr.gaps[BG.gi];
    if(g.done){ BG.gi++; continue; }
    if(BG.beat > g.beat + BG_WIN_HIT){
      g.done=true;
      if(g.demo){ g.judged="demo"; BG.gi++; continue; }
      if(g.need){
        g.judged="missed";
        bgAddMark(g.beat,"missed",g.need);
        bgEatHint(g.beat);
        bgOnMiss(g.need==="bunsetsu"?"minogashi":"minogashiT", g);
        bgVerdict("見のがし","#7b7466"); bgSndMiss();
      }else{
        g.judged="pass";
      }
      BG.gi++;
    }else break;
  }
}
/* ライフ回復アイテム：タップ不要。斬撃線（画面中央あたり）に来た瞬間、自動で回収する
   （教員の指示、2026-08-16〜：「画面の中央に来たら、軽い演出と共に回復した/得点に
   ＋したことを伝える」）。ライフが満タンのときに回収すると、代わりに得点が入る。
   毎フレームbgLoopから呼ばれるので、BG.beatがit.beatを超えた最初のフレームで発火する。 */
function bgSweepItems(){
  ((BG.track.items)||[]).forEach(it => {
    if(it.done) return;
    if(BG.beat >= it.beat){
      it.done=true;
      const y = bgYOf(it.beat);
      let gained;
      if(BG.life < BG_LIFE_MAX){
        BG.life++;
        gained = {text:"ライフ回復！", sub:"❤️ +1", color:"#2f7d5b"};
      }else{
        bgAddScore(200*bgComboMult());
        gained = {text:"ライフは満タン！", sub:"かわりに ＋200点", color:"#9c7c2a"};
      }
      bgFxItem(y, gained);
      if(it.el){ it.el.remove(); it.el=null; }
      const ctx=bgAc(); if(ctx) bgTone(ctx,"sine",1046.5,1568,ctx.currentTime,0.3,0.12);
      bgDrawHud();
    }
  });
}
/* アイテム回収の軽い演出：光の輪が一瞬広がり、粒がぱっと散って、
   「ライフ回復！／ライフは満タン！」の文字が浮かんで消える（独立版のfxSlashを
   参考にした簡易版）。 */
function bgFxItem(y, gained){
  const fieldEl=bg$("bgField");
  const core=document.createElement("div");
  core.className="itemFxCore";
  core.style.top=y+"px";
  core.style.setProperty("--fxc", gained.color);
  fieldEl.appendChild(core);
  setTimeout(()=>core.remove(), 400);

  const n=7;
  for(let i=0;i<n;i++){
    const p=document.createElement("div");
    p.className="itemFxSpark";
    p.style.top=y+"px";
    p.style.background=gained.color;
    const ang=(i/n)*Math.PI*2 + Math.random()*0.4;
    p.style.setProperty("--dx", Math.round(Math.cos(ang)*44)+"px");
    p.style.setProperty("--dy", Math.round(Math.sin(ang)*44)+"px");

    setTimeout(()=>p.remove(), 480);
  }

  const label=document.createElement("div");
  label.className="itemFxLabel";
  label.style.top=y+"px";
  label.style.color=gained.color;
  label.innerHTML=gained.text+'<span class="itemFxSub">'+gained.sub+'</span>';
  fieldEl.appendChild(label);
  setTimeout(()=>label.remove(), 950);
}
function bgUpdateSentence(){
  const tr=BG.track;
  const s=tr.sentences[BG.curSentence];
  const nx=tr.sentences[BG.curSentence];
  if(nx && !nx.announced && BG.beat > nx.start - BG_LEAD_BEATS + 1){
    nx.announced=true;
    if(nx.kind==="demo") bgBanner("手　本","見ているだけでいい");
    else if(nx.kind==="echo") bgBanner("返　し","いまのとおりに斬る");
  }
  if(s && BG.beat > s.end){
    if(s.kind==="demo"){ BG.sentenceClean=true; BG.sentenceLifeLost=false; BG.curSentence++; bgDrawHud(); return; }
    /* clearCountを持つ巻（六の巻）は、その問数に達した瞬間だけ「一刀両断」の
       代わりにクリア達成の合図を出す（教員の指示、2026-08-20〜：「六巻は20問で
       クリア。クリアとなる20問以降も、問題は出続けるようにして」）。同じ拍に
       2つの中央バナーが重ならないよう、一刀両断とは排他で出す。 */
    const justCleared = !!(BG.stage.clearCount && !BG.clearAnnounced && (BG.curSentence+1) >= BG.stage.clearCount);
    if(justCleared) bgSecureClearUnlock(BG.stage.id);
    if(BG.sentenceClean){
      BG.cleanSentences++;
      bgAddScore(300*bgComboMult());
      const lvResult = bgLevelUpShikibetsu();
      if(justCleared){
        BG.clearAnnounced = true;
        bgBanner("クリア達成","ここからは腕試し。速さはさらに上がる");
      }else{
        bgBanner("一刀両断","＋三〇〇");
      }
      bgSndClear();
      /* レベルアップ・称号アップは、問題の文字が流れる中央帯に被らないよう、
         右側の専用表示に出す（教員の指示、2026-08-19〜：「文字が小さく見にくいので、
         右側〈問題の邪魔にならないところ〉にはっきりと表示して」）。称号が変わった
         節目は、レベル表示を兼ねたより目立つカードにまとめて出す（重ねて出さない）。 */
      if(lvResult.titleUp) bgFxTitleUp(lvResult.lvAfter, lvResult.titleName, lvResult.titleIcon);
      else if(lvResult.leveledUp) bgFxLevelUp(lvResult.lvAfter);
    }else if(justCleared){
      /* ミスがあった文でクリア問数に到達した場合も、達成そのものは変わらず伝える。 */
      BG.clearAnnounced = true;
      bgBanner("クリア達成","ここからは腕試し。速さはさらに上がる");
    }
    BG.sentenceClean=true;
    BG.sentenceLifeLost=false;
    BG.curSentence++;
    /* 速度スケジュール：正解・ミスは問わず、解いた文の数だけで判定する
       （教員の指示、2026-08-19〜。詳しくはbgSpeedStepUpのコメント参照）。 */
    if(BG.stage.escalate && BG.curSentence > BG_SPEED_GRACE &&
       (BG.curSentence - BG_SPEED_GRACE) % BG_SPEED_INTERVAL === 0){
      bgSpeedStepUp();
    }
    bgDrawHud();
  }
  /* clearCountを持つ巻（六の巻）は、進み具合バー・問題番号を「合格ラインまでの距離」で
     見せ、合格後はバーを満タンのまま、番号は「腕試し中」と数字だけの表示に切り替える
     （教員の指示、2026-08-20〜：「クリアとなる20問以降も、問題は出続けるように」。
     合格ラインより先の、まだ用意しただけの問題数を見せても混乱するだけなので隠す）。 */
  const progDenom = (BG.stage.clearCount && BG.track.clearBeat) ? BG.track.clearBeat : BG.track.totalBeats;
  bg$("bgProg").style.width = Math.min(100, Math.max(0, BG.beat/progDenom*100))+"%";
  const real=BG.track.sentences.filter(x=>x.kind!=="demo");
  const doneReal=BG.track.sentences.slice(0,BG.curSentence+1).filter(x=>x.kind!=="demo").length;
  const shownDone = Math.max(1,Math.min(real.length,doneReal));
  if(BG.stage.clearCount){
    bg$("bgInfoNo").textContent = shownDone<=BG.stage.clearCount
      ? "第"+bgKansuji(shownDone)+"文／"+bgKansuji(BG.stage.clearCount)
      : "第"+bgKansuji(shownDone)+"文（腕試し中）";
  }else{
    bg$("bgInfoNo").textContent = "第"+bgKansuji(shownDone)+"文／"+bgKansuji(real.length);
  }
}
/* 1文をノーミスでクリアするたびに、分野レベルの「識別」を1つ上げる（教員の指示、
   2026-08-17〜：「分野レベルの『識別』に影響するようにして。経験値の＋も、それに
   応じて変更があるようにする」）。以前はst.bunsetsuGiriBonusExpという、どの分野にも
   属さない専用の経験値ぷ―ルに+1していたが、それをやめて、record()のレベルアップ
   処理（st.lv[cat]++・totalLevelUps・10回ごとの挑戦チケット）だけを、識別カテゴリに
   対してその場で再現する。record()本体は呼ばない：本体はst.q（問題ごとの正誤履歴）・
   間隔反復レビュー・分野の出題プール解放率のような、実在の問題プールを前提にした
   仕組みも一緒に更新してしまい、文節斬りの文（QUESTION_DATA外）には当てはまらないため。
   st.bunsetsuGiriBonusExpの加算自体は今後行わないが、これまでに貯まった分は
   kotonohaTotalXP/totalEarnedStatPoints側の加算式にそのまま残してあるので、
   すでに稼いだ経験値が消えることはない。
   2026-08-19〜、教員の指示「テキストを一つ正解したら経験値が上がるシステムのはず。
   ゲーム画面でもレベルが上がっていることを表示して。称号がUPした場合もそのことを
   伝えて」に対応するため、上がった後のレベル・称号が変わったかどうかを呼び出し元
   （bgUpdateSentence）へ返すようにした。称号の比較にはTITLES／titleOf（既存の
   分野共通の称号テーブル）をそのまま使う。 */
function bgLevelUpShikibetsu(){
  const st = loadStats();
  const lvBefore = st.lv.shikibetsu||1;
  let lvAfter = lvBefore, leveledUp = false;
  if(lvBefore < MAX_CAT_LV){
    lvAfter = lvBefore + 1;
    st.lv.shikibetsu = lvAfter;
    st.totalLevelUps = (st.totalLevelUps||0) + 1;
    if(st.totalLevelUps % 10 === 0) st.bossTickets = (st.bossTickets||0) + 1;
    leveledUp = true;
  }
  saveStats(st);
  const titleBefore = titleOf(lvBefore), titleAfter = titleOf(lvAfter);
  return {
    leveledUp, lvAfter,
    titleUp: leveledUp && titleBefore.name !== titleAfter.name,
    titleName: titleAfter.name, titleIcon: titleAfter.icon,
  };
}

/* 称号アップの専用演出（レベルアップ表示より目立たせる、教員の指示、2026-08-19〜）。
   同じく右側に、プレイを止めない軽いカードを出し、簡単なファンファーレを鳴らす。
   称号が変わった節目はレベル表示を兼ねる（bgUpdateSentence側でbgFxLevelUpと

const BG_KANSUJI=["〇","一","二","三","四","五","六","七","八","九","十"];
function bgKansuji(n){ if(n<=10) return BG_KANSUJI[n]; if(n<20) return "十"+BG_KANSUJI[n-10];
  const t=Math.floor(n/10),o=n%10; return BG_KANSUJI[t]+"十"+(o?BG_KANSUJI[o]:""); }

/* モバイルで遊ぶほど（＝時間が経つほど）ラグがひどくなるバグの修正（教員の指示、
   2026-08-20〜：「モバイル版でやってみたら、ラグついてしまうバグが発生しているので、
   修正して」）。原因は2つ重なっていた。
   1. 斬った跡の印（BG.markData、bgAddMark）が、画面外に去ったあとも配列にもDOMにも
      残り続けていた。六の巻の「腕試し」区間（合格後も出題が続く）のように長く遊ぶほど、
      毎フレーム動かす印の数が際限なく増えていき、じわじわ重くなっていく（＝プレイ時間に
      比例して悪化する、まさに「ラグついてしまう」症状）。→ 画面から永久に去った印は
      DOM要素ごと間引く。
   2. 文字のセル（BG.track.cells）を、六の巻のように用意する問題数が多い巻では
      毎フレーム全部（六の巻は最大で数百個）走査していた。cellsはbeatの昇順で並んでいる
      （bgBuildTrackが先頭からbeatを増やしながら積むだけなので必ず昇順）ので、
      「もう二度と画面に映らない」と分かった先頭側だけを指すポインタ（BG.renderFrom、
      前にしか進めない）を導入し、そこより前は毎フレーム触らずに済ませる。あわせて、
      まだ画面に入ってこない先の文字も、最初に1つ見つかった時点で打ち切ることで、
      実質「今どのみち見えている範囲」の分だけを毎フレーム処理するようにした。 */
function bgRender(){
  if(!BG || !BG.track) return;
  const m=bgMetrics();
  const top=-m.CELL*2, bot=m.H+m.CELL*2;
  const cells=BG.track.cells;
  let i=BG.renderFrom||0;
  while(i<cells.length){
    const c=cells[i];
    const y=c.el ? bgYOf(c.beat) : -Infinity;
    if(y>=top-m.CELL*6) break;
    if(c.el && c.el.style.visibility!=="hidden") c.el.style.visibility="hidden";
    i++;
  }
  BG.renderFrom=i;
  for(; i<cells.length; i++){
    const c=cells[i];
    if(!c.el) continue;
    const y=bgYOf(c.beat);
    if(y>bot+m.CELL*6) break;
    if(c.el.style.visibility==="hidden") c.el.style.visibility="";
    c.el.style.transform="translateY("+y+"px)";
  }
  if(BG.markData && BG.markData.length){
    const kept=[];
    for(const k of BG.markData){
      const y=bgYOf(k.beat) - Math.round(m.CELL*BG_MARK_H_RATIO)/2;
      if(y<top-m.CELL*6){ if(k.el) k.el.remove(); continue; }
      if(k.el) k.el.style.transform="translateY("+y+"px)";
      kept.push(k);
    }
    BG.markData=kept;
  }
  (BG.track.items||[]).forEach(it => {
    if(it.done || !it.el) return;
    it.el.style.transform="translateY("+bgYOf(it.beat)+"px)";
  });
}
/* =========================================================================
   斬る（独立版のまま）
   ========================================================================= */
function bgSlash(blade){
  if(!BG || BG.phase!=="run") return;
  if(!BG.stage.blades.includes(blade)) return;
  if(bgInDemo(BG.beat)){ bgVerdict("いまは見る","#7b7466"); return; }
  const tr=BG.track;
  let best=null, bd=1e9;
  for(let i=Math.max(0,BG.gi-2); i<tr.gaps.length; i++){
    const g=tr.gaps[i];
    if(g.done) continue;
    const d=Math.abs(g.beat-BG.beat);
    if(d<bd){ bd=d; best=g; }
    if(g.beat-BG.beat > 1.2) break;
  }
  if(!best || bd>BG_WIN_HIT){
    bgLoseCombo(); bgPushMiss("karaburi", null);
    bgVerdict("空振り","#7b7466"); bgSndAir(); bgDrawHud();
    return;
  }
  best.done=true;
  const off = BG.beat - best.beat;
  if(best.need===blade){
    BG.offsets.push(off);
    const perfect = Math.abs(off)<=BG_WIN_PERFECT;
    BG.hit++; if(perfect) BG.perfect++;
    if(eventActive("2026_09_bunsetsu")) BG.eventCorrect++;
    best.judged="cut";
    bgAddMark(best.beat,"cut",best.need);
    bgEatHint(best.beat);
    bgFxSlash(bgYOf(best.beat), perfect, best);
    BG.combo++; BG.maxCombo=Math.max(BG.maxCombo,BG.combo);
    const base=(best.need==="bunsetsu")?100:80;
    bgAddScore((perfect?base*1.6:base)*bgComboMult());
    if(perfect) bgSndCut(true);
    else { blade==="tango"?bgSndKo():bgSndCut(false);
           if(Math.abs(off)>0.30) bgVerdict(off<0?"早い":"遅い", off<0?"#2c5c86":"#9c7c2a"); }
    bgDrawHud();
    if(perfect) bgBumpCombo(true);
  }else{
    let kind;
    if(!best.need)                                        kind="gochu";
    else if(blade==="bunsetsu" && best.need==="tango")    kind="ooburi";
    else                                                  kind="kogatana";
    best.judged="bad";
    bgAddMark(best.beat,"missed",best.need||blade);
    bgEatHint(best.beat);
    bgOnMiss(kind,best);
    bgFxBad(bgYOf(best.beat));
    bgSndBad();
  }
}

/* ---------- ミスの記録と代償（独立版のまま） ---------- */
function bgLoseCombo(){
  const before=BG.combo;
  BG.combo=0;
  if(before>=8) bgFxComboBreak(before);
}
function bgPushMiss(kind, g){
  const around = g ? (g.chars.slice(Math.max(0,g.ci-3),g.ci).join("")+"／"+g.chars.slice(g.ci,g.ci+3).join("")) : "";
  BG.misses.push({kind, at:around, si: g?g.si:null, ci: g?g.ci:null, chars: g?g.chars:null});
  BG.sentenceClean=false;
}
/* ライフが0になったら、そこで強制終了する（教員の指示、2026-08-15〜。独立版は
   「曲は最後まで流れきる」設計だったが、ライフを本物の失敗条件に変える）。
   ライフが減るのは1文につき1回だけ（教員の指示：「ライフの減り方は、一文につき、
   ミスがあれば一つ減るように変更して」）。同じ文の中で2回目以降のミスは、
   連斬が切れて記録には残るが、ライフはもう減らない。次の文に進むと
   sentenceLifeLostがbgUpdateSentenceで改めてfalseに戻る。 */
function bgOnMiss(kind,g){
  bgPushMiss(kind,g);
  bgLoseCombo();
  BG.miss++;
  if(!BG.sentenceLifeLost){
    BG.sentenceLifeLost = true;
    BG.life = Math.max(0, BG.life-1);
  }
  const fieldEl=bg$("bgField");
  fieldEl.classList.remove("shake"); void fieldEl.offsetWidth; fieldEl.classList.add("shake");
  bgDrawHud();
  if(BG.life<=0) bgFailStage();
}

/* ---------- 演出（独立版のまま） ---------- */
function bgFxSlash(y, perfect, g){
  const small=(g.need==="tango");
  const m=bgMetrics();
  const fieldEl=bg$("bgField");
  const box=document.createElement("div");
  box.className="cutfx"; box.style.top=y+"px";
  const s1=document.createElement("div");
  s1.className="streak"+(perfect?" perfect":"")+(small?" ko":"");
  const s2=document.createElement("div"); s2.className="streak after";
  const core=document.createElement("div");
  core.className="flashcore"+(perfect?" perfect":"")+(small?" ko":"");
  box.appendChild(s2); box.appendChild(s1); box.appendChild(core);
  const n=small?4:(perfect?10:6);
  for(let i=0;i<n;i++){
    const sh=document.createElement("div");
    sh.className="shard"+(perfect?" perfect":"")+(small?" ko":"");
    const dir=i%2?1:-1, dist=(perfect?46:32)+Math.random()*46;
    sh.style.setProperty("--dx",(dir*dist)+"px");
    sh.style.setProperty("--dy",((Math.random()-0.45)*54)+"px");
    sh.style.setProperty("--rot",Math.round((Math.random()-0.5)*540)+"deg");
    sh.style.animationDelay=(Math.random()*0.05)+"s";
    sh.style.marginLeft=Math.round((Math.random()-0.5)*m.CELL*0.7)+"px";
    box.appendChild(sh);
  }
  if(perfect){
    /* 小刀（単語）の会心にもスタンプを出す（教員の指示、2026-08-19〜：「単語で分けるときも
       会心の演出を入れて」）。画面フラッシュは大太刀の一撃だけに残す（小刀は打つ回数が
       多く、毎回フラッシュすると目がちかちかするため）。 */
    const hk=document.createElement("div"); hk.className="hanko"+(small?" ko":""); hk.textContent="会心";
    box.appendChild(hk);
    if(!small){
      const fl=document.createElement("div"); fl.className="screenflash";
      fieldEl.appendChild(fl); setTimeout(()=>fl.remove(),280);
    }
  }
  fieldEl.appendChild(box);
  setTimeout(()=>box.remove(), perfect?620:500);
  const cells=BG.track.cells;
  for(let i=0;i<cells.length;i++){
    if(cells[i].beat>=g.beat && cells[i].beat<g.beat+2 && cells[i].el){
      const el=cells[i].el;
      el.classList.remove("jolt"); void el.offsetWidth; el.classList.add("jolt");
      setTimeout(((e)=>()=>e.classList.remove("jolt"))(el),430);
    }
  }
}

/* =========================================================================
   HUD（独立版のまま）
   ========================================================================= */
function bgDrawHud(){
  bg$("bgScore").textContent=BG.score;
  const mv=bgComboMult(), mb=bg$("bgMultBox"), shown=mv.toFixed(1);
  if(mb.dataset.v!==shown){
    mb.dataset.v=shown; bg$("bgMultV").textContent=shown;
    mb.classList.remove("pop"); void mb.offsetWidth; mb.classList.add("pop");
  }

  bg$("bgHudCombo").textContent=BG.combo;
  let lb="";
  for(let i=0;i<BG_LIFE_MAX;i++) lb+='<span class="life-dot'+(i<BG.life?"":" gone")+'"></span>';

  if(BG.combo>=1){
    comboEl.classList.add("on");

    comboEl.classList.toggle("blaze", BG.combo>=25);
