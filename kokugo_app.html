/* 「一レ」「上レ」など合体マークを縦並び2段書きにする。ktMarkInner()は「返り点をつける」
   （#ktApp）・「読む順タップ」（#yjApp）の両方から呼ばれる共通関数なので、出力するクラスは
   どちらのスコープにも属さない共通クラス.mark-stackにする（教員の指摘、2026-08-22：
   「読む順タップの一レ点や上下点で、一レ・上レが縦並びに表示されていない」。原因は、
   以前はkt-mark-stackというktApp専用クラス名を出力していたため、#yjApp側ではCSSが
   一切効かず横並びのまま表示されていたこと）。 */
function ktMarkInner(v){
  if(v.length===2) return `<span class="mark-stack"><span>${esc(v[0])}</span><span>${esc(v[1])}</span></span>`;
  return esc(v);
}
function ktRuby(s){
  return esc(s).replace(/([^()ぁ-んー]+)\(([^)]+)\)/g, (m, base, yomi) => `<ruby>${base}<rt>${yomi}</rt></ruby>`);
}

/* 「返り点をつける」問題一覧（8問グループごとの解禁状況を表示）。 */
function ktShowMenu(){
  const st = loadStats();
  const groups = ktGroups();
  const unlockedN = ktUnlockedGroupCount(st);
  const pct = ktUnlockedQuestionPct(st);
  let html = `
    <h3 class="section">🖌️ 返り点をつける</h3>
    <p class="note">漢文の白文に、返り点をドラッグ（またはタップ）で置く特訓です。8問のまとまりを解き終えるごとに、次のまとまりが解禁されます。正解すると「漢文」のレベルが上がります。</p>
    ${unlockFooterHtml("漢文（返り点をつける）", pct)}
  `;
  groups.forEach((g,gi)=>{
    const locked = (gi+1) > unlockedN;
    const solvedCount = g.indices.filter(i=>ktIsSolved(st,i)).length;
    const firstIdx = g.indices[0];
    const lastLabel = KT_PROBLEMS[g.indices[0]].lv.replace(/^れんしゅう\d+　|^そうごう\d+　/,"");
    html += `
    <div class="card menu-card${locked?" locked":""}" ${locked?"":`onclick="ktStart(${firstIdx})"`}>
      <div class="menu-icon">${locked?"🔒":(solvedCount===g.indices.length?"✅":"🖌️")}</div>
      <div><h2>まとまり${g.level}（${g.indices.length}問）</h2><p>${locked?"前のまとまりを解き終えると解禁されます":esc(lastLabel)+" など"}</p></div>
      <div class="right"><span class="count">${solvedCount}/${g.indices.length}問クリア</span></div>
    </div>`;
  });
  html += `<div class="btn-row"><button class="btn secondary" onclick="showHome()">ホームへ</button></div>`;
  screen.innerHTML = html;
}

function ktStart(i){
  const st = loadStats();
  if(i < KT_PROBLEMS.length && i >= ktUnlockedCount(st)){
    // まだ解禁されていない問題（不正な直接呼び出し対策）。問題一覧へ戻す。
    ktShowMenu();
    return;
  }
  KT.renderGen++;
  KT.qi = i;
  if(i < KT_PROBLEMS.length){
    const p = KT_PROBLEMS[KT.qi];
    KT.placed = p.chars.map(()=>null);
    KT.attempts = 0;
    KT.selectedVal = null;
    KT.correctLocked = p.chars.map(()=>false);
    KT.shownAt = Date.now();
  }
  ktRender();
}

function ktRender(){
  if(KT.qi >= KT_PROBLEMS.length){
    screen.innerHTML = `<div id="ktApp"><div class="kt-done">
      <div class="kt-big">全問クリア！</div>
      <div class="kt-stat">${KT_PROBLEMS.length}問すべての返り点を正しく置けました。</div>
    </div></div>
    <div class="btn-row">
      <button class="btn secondary" onclick="ktStart(0)">もう一度さいしょから</button>
      <button class="btn secondary" onclick="showHome()">ホームへ</button>
    </div>`;
    return;
  }

  const p = KT_PROBLEMS[KT.qi];
  const anyPlaced = KT.placed.some(v=>v);
  const palette = KT_BASELINE_MARKS.concat(p.extra || []);

  const rowsHtml = p.chars.map((c,idx)=>{
    const filled = KT.placed[idx];
    const lockedCls = KT.correctLocked[idx] ? " ok" : "";
    const comboCls = filled && filled.length===2 ? " combo" : "";
    const slotHtml = `<span class="kt-slot${filled?" filled":""}${comboCls}${lockedCls}" data-idx="${idx}">${filled?ktMarkInner(filled):""}</span>`;
    const okHtml = c.ok ? `<span class="kt-ok">${esc(c.ok)}</span>` : "";
    const okuriCls = c.okuri && c.okuri.length>=3 ? " long" : "";
    const okuriHtml = c.okuri ? `<span class="kt-okuri${okuriCls}">${esc(c.okuri)}</span>` : "";
    const annoHtml = (okHtml || okuriHtml) ? `<span class="kt-anno">${okHtml}${okuriHtml}</span>` : "";
    return `<div class="kt-row"><span class="kt-glyph">${esc(c.ch)}<span class="kt-order-badge" data-badge="${idx}"></span>${annoHtml}</span>${slotHtml}</div>`;
  }).join("");

  const chipsHtml = palette.map(v=>`<div class="kt-chip${v===KT.selectedVal?" selected":""}" data-val="${esc(v)}">${esc(v)}</div>`).join("");

  screen.innerHTML = `
  <div id="ktApp">
    <div class="kt-hud">
      <div class="kt-title">返り点をつける</div>
      <div class="kt-prog">問 ${KT.qi+1} / ${KT_PROBLEMS.length}</div>
    </div>
    <div class="kt-progress"><i style="width:${100*KT.solved/KT_PROBLEMS.length}%"></i></div>

    <div class="kt-card">
      <span class="kt-lv-badge">${esc(p.lv)}</span>
      <div class="kt-instr">白文「<b>${esc(p.white)}</b>」が、右の書き下し文のとおりに読めるように、返り点が必要な字の<b>マス</b>に、下のカードから正しい返り点をドラッグ（またはタップ）して置こう。（返り点がいらない字のマスは、空のままでよい）</div>
      <div class="kt-help" id="ktHelpNote" style="display:none">${esc(p.note)}</div>
      <button class="kt-help-btn" onclick="ktToggleHelp()">ヒントを見る</button>
    </div>

    <div class="kt-card" style="padding:14px 12px;">
      <div class="kt-stage">
        <div class="kt-stage-row">
          <div class="kt-actions-mid">
            <button class="btn" id="ktJudgeBtn" ${anyPlaced?"":"disabled"} onclick="ktJudge()">判定する</button>
            <button class="btn secondary" id="ktNextBtn" style="display:none" onclick="ktStart(KT.qi+1)">次の問題へ</button>
          </div>
          <div class="kt-box" id="ktBox">${rowsHtml}</div>
          <div class="kt-kudashi" id="ktKudashiBox">
            <div class="kt-kudashi-label">書き下し文</div>
            <div class="kt-kudashi-text">${ktRuby(p.kudashi)}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="kt-msg" id="ktMsg"></div>
    <div class="kt-stars" id="ktStars"></div>

    <div class="kt-tray-label">返り点カード（何回でも使える。タップして選び、マスをタップ／またはドラッグして置く）</div>
    <div class="kt-tray" id="ktTray">${chipsHtml}</div>
  </div>
  <div class="btn-row">
    <button class="btn secondary" onclick="ktShowMenu()">問題一覧へ</button>
    <button class="btn secondary" onclick="showHome()">ホームへ</button>
  </div>`;

  ktAttachEvents();
}

function ktToggleHelp(){
  const el = document.getElementById("ktHelpNote");
  el.style.display = el.style.display==="none" ? "block" : "none";
}

function ktDropMark(idx, newVal){
  const cur = KT.placed[idx];
  if(cur && KT_COMBINABLE_WITH_RE.includes(cur) && newVal==="レ"){
    KT.placed[idx] = cur + "レ";
  } else if(cur==="レ" && KT_COMBINABLE_WITH_RE.includes(newVal)){
    KT.placed[idx] = newVal + "レ";
  } else {
    KT.placed[idx] = newVal;
  }
}

function ktAttachEvents(){
  document.querySelectorAll("#ktApp .kt-row").forEach(row=>{
    row.addEventListener("click", ()=>{
      const idx = +row.querySelector(".kt-slot").dataset.idx;
      if(KT.correctLocked[idx]) return;
      if(KT.selectedVal){
        ktDropMark(idx, KT.selectedVal);
        KT.selectedVal = null;
        ktRender();
      } else if(KT.placed[idx]){
        KT.placed[idx] = null;
        ktRender();
      }
    });
  });
  document.querySelectorAll("#ktApp .kt-chip").forEach(el=>{
    el.addEventListener("pointerdown", ktChipPointerDown);
    el.addEventListener("click", ()=>{
      if(KT.dragCtx && KT.dragCtx.moved) return;
      const v = el.dataset.val;
      KT.selectedVal = (KT.selectedVal===v) ? null : v;
      // カード選択だけなら画面全体を作り直さない（教員の指摘、2026-08-22：
      // 選択のたびに画面全体を再描画すると不自然に揺れる）。選択の色つけだけ軽く更新する。
      document.querySelectorAll("#ktApp .kt-chip").forEach(c=>{
        c.classList.toggle("selected", KT.selectedVal!==null && c.dataset.val===KT.selectedVal);
      });
    });
  });
}

function ktSlotUnderPoint(x,y){
  const under = document.elementFromPoint(x,y);
  if(!under || !under.closest) return null;
  let slot = under.closest(".kt-slot");
  if(slot) return slot;
  const row = under.closest(".kt-row");
  if(row) return row.querySelector(".kt-slot");
  return null;
}

function ktChipPointerDown(e){
  const el = e.currentTarget;
  const val = el.dataset.val;
  const startX = e.clientX, startY = e.clientY;
  el.setPointerCapture(e.pointerId);

  // 単なるタップ（選択）では、回転・拡大したゴーストを一切出さない（教員の指摘、2026-08-22：
  // 「タップした瞬間に画面が揺れる」の原因が、動いてもいないのに一瞬だけ出るゴーストの
  // 回転・拡大アニメーションだった）。実際に指がある程度動いてから、初めてゴーストを作る。
  const DRAG_THRESHOLD = 6;
  KT.dragCtx = {val, el, ghost:null, moved:false, pointerId:e.pointerId, ox:0, oy:0};

  const startGhost = (ev)=>{
    const rect = el.getBoundingClientRect();
    const ghost = el.cloneNode(true);
    ghost.classList.add("ghost");
    ghost.style.width = rect.width+"px";
    ghost.style.height = rect.height+"px";
    ghost.style.left = rect.left+"px";
    ghost.style.top = rect.top+"px";
    document.body.appendChild(ghost);
    el.classList.add("dragging");
    KT.dragCtx.ghost = ghost;
    KT.dragCtx.ox = startX-rect.left;
    KT.dragCtx.oy = startY-rect.top;
    KT.dragCtx.moved = true;
    ghost.style.left = (ev.clientX-KT.dragCtx.ox)+"px";
    ghost.style.top = (ev.clientY-KT.dragCtx.oy)+"px";
  };

  const move = (ev)=>{
    if(!KT.dragCtx || ev.pointerId!==KT.dragCtx.pointerId) return;
    if(!KT.dragCtx.moved){
      if(Math.hypot(ev.clientX-startX, ev.clientY-startY) < DRAG_THRESHOLD) return;
      startGhost(ev);
    } else {
      KT.dragCtx.ghost.style.left = (ev.clientX-KT.dragCtx.ox)+"px";
      KT.dragCtx.ghost.style.top = (ev.clientY-KT.dragCtx.oy)+"px";
    }
    document.querySelectorAll("#ktApp .kt-slot.target-hover").forEach(s=>s.classList.remove("target-hover"));
    document.querySelectorAll("#ktApp .kt-row.row-hover").forEach(r=>r.classList.remove("row-hover"));
    const slot = ktSlotUnderPoint(ev.clientX, ev.clientY);
    if(slot && !KT.correctLocked[+slot.dataset.idx]){
      slot.classList.add("target-hover");
      slot.closest(".kt-row").classList.add("row-hover");
    }
  };
  const up = (ev)=>{
    if(!KT.dragCtx || ev.pointerId!==KT.dragCtx.pointerId) return;
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    document.querySelectorAll("#ktApp .kt-slot.target-hover").forEach(s=>s.classList.remove("target-hover"));
    document.querySelectorAll("#ktApp .kt-row.row-hover").forEach(r=>r.classList.remove("row-hover"));
    if(KT.dragCtx.moved){
      KT.dragCtx.ghost.remove();
      el.classList.remove("dragging");
      const slot = ktSlotUnderPoint(ev.clientX, ev.clientY);
      if(slot && !KT.correctLocked[+slot.dataset.idx]){
        ktDropMark(+slot.dataset.idx, KT.dragCtx.val);
        KT.selectedVal = null;
        ktRender();
      }
    }
    KT.dragCtx = null;
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", up);
}

function ktJudge(){
  const p = KT_PROBLEMS[KT.qi];
  const gen = KT.renderGen;
  KT.attempts++;
  let allOk = true;
  let anyBad = false;
  p.chars.forEach((c,idx)=>{
    const slotEl = document.querySelector(`#ktApp .kt-slot[data-idx="${idx}"]`);
    if(!slotEl) return;
    const val = KT.placed[idx];
    const expect = c.mark || null;
    if(val === expect){
      slotEl.classList.remove("bad","missing");
      if(val) slotEl.classList.add("ok");
      KT.correctLocked[idx] = true;
    } else if(val){
      slotEl.classList.add("bad");
      anyBad = true; allOk = false;
      setTimeout(()=>{ if(gen!==KT.renderGen) return; KT.placed[idx] = null; ktRender(); }, 550);
    } else {
      slotEl.classList.add("missing");
      allOk = false;
    }
  });

  const msg = document.getElementById("ktMsg");
  if(allOk){
    msg.textContent = "正解！すべての返り点が正しく置けました。";
    msg.className = "kt-msg good";
    document.getElementById("ktJudgeBtn").style.display = "none";
    ktShowStars();
    ktAnimateReveal();
    document.getElementById("ktNextBtn").style.display = "inline-block";
    /* 判定後は、ヒントボタン等を除く画面のどこをタップしても次の問題に進めるようにする
       （教員の指示、2026-08-22：「判定した後は、適当に押せば次の問題に行くように」）。
       ktJudge()はDOMを直接書き換えるだけでktRender()を呼び直さないため、このリスナーは
       正解した瞬間に一度だけ付ければよい（次の問題に進む＝ktStart()が新しく#ktAppを
       作り直すので、古いリスナーが残って二重に効くことはない）。 */
    const ktAppEl = document.getElementById("ktApp");
    if(ktAppEl){
      ktAppEl.addEventListener("click", (e)=>{
        if(e.target.closest("button")) return; // ヒントを見るボタン等は個別の動作を優先する
        ktStart(KT.qi+1);
      });
    }
    const ktKudashiBox = document.getElementById("ktKudashiBox");
    if(ktKudashiBox && !ktKudashiBox.querySelector(".kt-tap-hint")){
      const hint = document.createElement("div");
      hint.className = "kt-tap-hint";
      hint.textContent = "画面をタップすると次の問題へ";
      ktKudashiBox.appendChild(hint);
    }
    KT.solved++;
    const bar = document.querySelector("#ktApp .kt-progress i");
    if(bar) bar.style.width = (100*KT.solved/KT_PROBLEMS.length) + "%";
    /* ミスなく（判定するボタンを1回押しただけで）正解できたときだけ、漢文レベル・経験値と
       まとまり解禁の対象にする（教員の指示、2026-08-22：「1回でもミスしたら、漢文のジャンルの
       レベルは上がらないようにしてほしい」）。星の判定（3つ星＝attempts<=1）と同じ基準。
       ミスがあった場合はrecord()自体を呼ばない＝正誤記録にも解禁ストリークにも一切影響しない
       （不正解として記録してマイナスにするのではなく、今回ぶんの加点なしという扱いにする）。 */
    if(KT.attempts === 1){
      const elapsedMs = Date.now() - (KT.shownAt || Date.now());
      const r = record("kanbun", {q:p.white, lv:KT.qi+1}, true, elapsedMs, {skipRecentAcc:true});
      const st2 = loadStats();
      const groupUnlocked = ktMarkSolvedAndCheckUnlock(st2, KT.qi);
      saveStats(st2);
      if(r.lvup){
        const extra = document.createElement("div");
        extra.className = "kt-msg good";
        extra.style.marginTop = "4px";
        extra.textContent = r.evolved ? `漢文 Lv.${r.lv} UP！${r.evolved.icon} ${r.evolved.name}になりました` : `漢文 Lv.${r.lv} UP！`;
        msg.after(extra);
      }
      if(groupUnlocked){
        const extra2 = document.createElement("div");
        extra2.className = "kt-msg good";
        extra2.style.marginTop = "4px";
        extra2.textContent = "🎉 次のまとまり（8問）が解禁されました！";
        msg.after(extra2);
      }
    } else {
      const extra3 = document.createElement("div");
      extra3.className = "kt-msg";
      extra3.style.marginTop = "4px";
      extra3.textContent = "ミスがあったので、今回は漢文のレベルアップの対象外です。";
      msg.after(extra3);
    }
  } else if(anyBad){
    msg.textContent = "ちがう場所（または印）があります。赤いマスはいったん空になります。";
    msg.className = "kt-msg bad";
  } else {
    msg.textContent = "まだ印が足りないマスがあります（金色のマス）。";
    msg.className = "kt-msg bad";
  }
}

function ktShowStars(){
  const starsEl = document.getElementById("ktStars");
  const n = KT.attempts<=1 ? 3 : KT.attempts===2 ? 2 : 1;
  let html = "";
  for(let i=0;i<3;i++) html += `<span class="${i<n?"on":""}">★</span>`;
  starsEl.innerHTML = html;
}

function ktAnimateReveal(){
  const gen = KT.renderGen;
  setTimeout(()=>{
    if(gen !== KT.renderGen) return;
    const kb = document.getElementById("ktKudashiBox");
    if(kb) kb.classList.add("solved");
  }, 200);
}

/* ============ 読む順タップ（2026-〜）============
   「返り点をつける」（KT）の対になる問題。あちらは白文に返り点を置く問題、こちらは
   返り点がすでに付いている白文を見て、読む順に字をタップする問題。
   問題データはKT_PROBLEMS（56問、教員確認済み）をそのまま流用する：chars（ch/mark/oki/ok/okuri）・
   order・kudashi・note・lvの形が完全に一致するため、複製せず同じ配列を参照する。
   出題・解禁の方式は、KTの「8問ずつ手動で選ぶまとまり画面」ではなく、20分野・百人一首と同じ
   「はじめは8問のプールからランダムに出題し、正答率・連続正解に応じて次の8問が自動的に解禁される」
   方式にする（教員の指摘、2026-08-22：「そういうことではない。他のジャンルの問題と同じシステムで、
   初めは8つの問題からランダムで出し、正答率等に応じて少しずつ開くシステムに。ボタンを分ける
   ということではない」）。そのため、専用のGROUP_SIZE・UnlockEngine・fastUnlockEligibleは
   ホームの「返り点をつける」ボタンとは分けたまま、既存の20分野／百人一首と全く同じ判定式
   （UnlockEngine.isGroupCleared、GROUP_UNLOCK_STREAK/QUORUM/ACC、高速解放モード）を流用する。
   グループ解禁の進捗（st.groupUnlock.kanbun_yj）・解禁の材料になる連続正解数はKT側とは独立させる
   （KTと同じキーや同じqKeyを使うと、片方だけ解いてももう片方まで解禁・進捗してしまうため、
   st.q側のキーもyjQ()で"読順:"という専用の接頭辞を付けて区別する）。 */
const YJ_PROBLEMS = KT_PROBLEMS;

function yjQ(idx){ return "読順:" + YJ_PROBLEMS[idx].white; }

let _yjGroupsCache = null;
function yjGroups(){
  if(_yjGroupsCache) return _yjGroupsCache;
  const groups = [];
  for(let i=0;i<YJ_PROBLEMS.length;i+=GROUP_SIZE){
    const indices = YJ_PROBLEMS.slice(i, i+GROUP_SIZE).map((_,j)=>i+j);
    groups.push({level:groups.length+1, indices, keys: indices.map(idx => qKey("kanbun", yjQ(idx)))});
  }
  _yjGroupsCache = groups;
  return groups;
}
function yjUnlockedGroupCount(st){
  return (st.groupUnlock && st.groupUnlock.kanbun_yj) || 1;
}
function yjUnlockedQuestionPct(st){
  if(YJ_PROBLEMS.length === 0) return null;
  const groups = yjGroups();
  const n = Math.min(yjUnlockedGroupCount(st), groups.length);
  let unlockedQ = 0;
  for(let i=0;i<n;i++) unlockedQ += groups[i].indices.length;
  return Math.round(unlockedQ / YJ_PROBLEMS.length * 100);
}
/* 現在解禁済みの全グループぶんの出題インデックス（累積的・不可逆。20分野のgroupUnlockedPoolと同じ方針）。 */
function yjUnlockedIndices(st){
  const groups = yjGroups();
  const n = Math.min(yjUnlockedGroupCount(st), groups.length);
  const out = [];
  for(let i=0;i<n;i++) out.push(...groups[i].indices);
  return out;
}
/* 高速解放モード中に使う「今まさに解禁の最前線になっている8問」だけのインデックス（20分野の
   activeGroupPoolと同じ考え方）。既に全解禁済みならnullを返し、呼び出し側が通常の
   yjUnlockedIndicesにフォールバックする。 */
function yjActiveGroupIndices(st){
  const groups = yjGroups();
  const count = yjUnlockedGroupCount(st);
  if(count >= groups.length) return null;
  return groups[count - 1].indices;
}
function yjFastUnlockEligible(st){
  const recent = st.yjRecent || [];
  const misses = recent.reduce((n,v) => n + (v ? 0 : 1), 0);
  return misses <= FAST_UNLOCK_MAX_MISSES;
}
/* 正解のたびに呼ぶ。20分野のcheckGroupUnlock／百人一首のhyaCheckGroupUnlockと同じ判定式を、
   yj専用の記録（st.yjRecent＝高速解放判定用の直近30件、st.yjGroupRecent＝現在の最前線グループへの
   直近正答率、st.q[yjQ(idx)]の連続正解数k＝record()が既に積んでくれている）だけを使って行う。 */
function yjCheckGroupUnlock(st, idx, correct){
  if(!Array.isArray(st.yjRecent)) st.yjRecent = [];
  st.yjRecent.push(correct ? 1 : 0);
  while(st.yjRecent.length > FAST_UNLOCK_RECENT_WINDOW) st.yjRecent.shift();

  const groups = yjGroups();
  const gIdx = yjUnlockedGroupCount(st) - 1;
  if(gIdx >= groups.length - 1) return false; // 既に全解禁
  const cur = groups[gIdx];
  if(cur.indices.includes(idx)){
    if(!Array.isArray(st.yjGroupRecent)) st.yjGroupRecent = [];
    st.yjGroupRecent.push(correct ? 1 : 0);
    while(st.yjGroupRecent.length > GROUP_RECENT_WINDOW) st.yjGroupRecent.shift();
  }
  if(correct && yjFastUnlockEligible(st)){
    if(!st.groupUnlock) st.groupUnlock = {};
    st.groupUnlock.kanbun_yj = yjUnlockedGroupCount(st) + 1;
    st.yjGroupRecent = [];
    return true;
  }
  const streakMap = {};
  cur.keys.forEach(k => { const rec = st.q[k]; streakMap[k] = rec ? (rec.k||0) : 0; });
  const recentWindow = st.yjGroupRecent || [];
  if(UnlockEngine.isGroupCleared(cur.keys, streakMap, recentWindow, GROUP_UNLOCK_STREAK, GROUP_UNLOCK_ACC, GROUP_UNLOCK_QUORUM)){
    if(!st.groupUnlock) st.groupUnlock = {};
    st.groupUnlock.kanbun_yj = yjUnlockedGroupCount(st) + 1;
    st.yjGroupRecent = [];
    return true;
  }
  return false;
}
/* 出題する1問をランダムに選ぶ（20分野の考え方に合わせ、直前と同じ問題は連続させない）。
   高速解放モード中は、解禁済み全問題ではなく「今解禁されたばかりの8問」だけから出す
   （教員の指示、2026-08-04の20分野・百人一首と同じ意図：既習問題の正解だけで
   どんどん解放され続けてしまうのを防ぐ）。 */
function yjSelectOne(st, lastIdx){
  let pool = yjFastUnlockEligible(st) ? (yjActiveGroupIndices(st) || yjUnlockedIndices(st)) : yjUnlockedIndices(st);
  if(pool.length > 1 && lastIdx != null) pool = pool.filter(i => i !== lastIdx);
  return pool[Math.floor(Math.random()*pool.length)];
}

const YJ = {
  idx:0, lastIdx:null, nextPos:0, tappedNum:[], mistakes:0, solvedThis:false, solved:0,
  badTapIdx:null, renderGen:0, shownAt:0,
};

function yjStart(){
  YJ.solved = 0;
  YJ.lastIdx = null;
  yjNextQuestion();
}

function yjNextQuestion(){
  const st = loadStats();
  YJ.renderGen++;
  YJ.idx = yjSelectOne(st, YJ.lastIdx);
  YJ.lastIdx = YJ.idx;
  YJ.nextPos = 0;
  YJ.tappedNum = [];
  YJ.mistakes = 0;
  YJ.solvedThis = false;
  YJ.badTapIdx = null;
  YJ.shownAt = Date.now();
  yjRender();
}

function yjRetry(){
  YJ.renderGen++;
  YJ.nextPos = 0;
  YJ.tappedNum = [];
  YJ.mistakes = 0;
  YJ.solvedThis = false;
  YJ.badTapIdx = null;
  YJ.shownAt = Date.now();
  yjRender();
}

function yjRender(){
  const p = YJ_PROBLEMS[YJ.idx];
  const nextLabel = YJ.solvedThis ? "" : `${YJ.nextPos+1}番目に読む字をさがして、タップしよう。`;
  const st = loadStats();

  const rowsHtml = p.chars.map((c,idx)=>{
    const num = YJ.tappedNum[idx];
    const markHtml = c.mark
      ? `<span class="yj-mark${c.mark.length===2?" combo":""}">${ktMarkInner(c.mark)}</span>`
      : `<span class="yj-mark"></span>`;
    const okHtml = c.ok ? `<span class="yj-ok">${esc(c.ok)}</span>` : "";
    const okuriCls = c.okuri && c.okuri.length>=3 ? " long" : "";
    const okuriHtml = c.okuri ? `<span class="yj-okuri${okuriCls}">${esc(c.okuri)}</span>` : "";
    const annoHtml = (okHtml || okuriHtml) ? `<span class="yj-anno">${okHtml}${okuriHtml}</span>` : "";
    const badgeHtml = `<span class="yj-order-badge${num?" show":""}">${num||""}</span>`;
    const rowCls = (num?" done":"") + (YJ.badTapIdx===idx?" bad-tap":"");
    return `<div class="yj-row${rowCls}" data-idx="${idx}">
      <span class="yj-glyph">${esc(c.ch)}${badgeHtml}${annoHtml}</span>
      ${markHtml}
    </div>`;
  }).join("");

  screen.innerHTML = `
  <div id="yjApp">
    <div class="yj-hud">
      <div class="yj-title">読む順タップ</div>
      <div class="yj-prog">今回 ${YJ.solved}問クリア</div>
    </div>

    <div class="yj-card">
      <span class="yj-lv-badge">${esc(p.lv)}</span>
      <div class="yj-instr">白文「<b>${esc(p.white)}</b>」には、すでに返り点が付いています。<b>読む順に</b>字をタップしていこう。（書き下し文は、全部読み終わるまでナイショ）</div>
      <div class="yj-help" id="yjHelpNote" style="display:none">${esc(p.note)}</div>
      <button class="yj-help-btn" onclick="yjToggleHelp()">ヒントを見る</button>
    </div>

    <div class="yj-card" style="padding:14px 12px;">
      <div class="yj-stage"><div class="yj-box" id="yjBox">${rowsHtml}</div></div>
      <div class="yj-progress-text" id="yjProgressText">${esc(nextLabel)}</div>
      <div class="yj-msg" id="yjMsg"></div>
      <div class="yj-stars" id="yjStars"></div>
      <div class="yj-kudashi${YJ.solvedThis?" show":""}" id="yjKudashiBox" style="display:${YJ.solvedThis?"block":"none"}">
        <div class="yj-kudashi-label">書き下し文</div>
        <div class="yj-kudashi-text">${ktRuby(p.kudashi)}</div>
        <div class="yj-tap-hint">画面をタップすると次の問題へ</div>
      </div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn secondary" onclick="yjRetry()">この問題をやり直す</button>
    <button class="btn secondary" id="yjNextBtn" style="display:${YJ.solvedThis?"inline-block":"none"}" onclick="yjNextQuestion()">次の問題へ</button>
    <button class="btn secondary" onclick="showHome()">ホームへ</button>
  </div>
  ${unlockFooterHtml("漢文（読む順タップ）", yjUnlockedQuestionPct(st))}`;

  if(YJ.solvedThis) yjShowStars();
  yjAttachEvents();
}

function yjToggleHelp(){
  const el = document.getElementById("yjHelpNote");
  el.style.display = el.style.display==="none" ? "block" : "none";
}

function yjAttachEvents(){
  document.querySelectorAll("#yjApp .yj-row").forEach(row=>{
    row.addEventListener("click", ()=>{
      yjHandleTap(+row.dataset.idx);
    });
  });
  /* 正解して書き下し文が表示された後は、ヒントボタンなどを除く画面のどこをタップしても
     次の問題に進めるようにする（教員の指示、2026-08-22：「答えが表示されている画面からは、
     どこかを押せば、次の問題に進むように」）。#yjAppはyjRender()のたびにinnerHTMLごと
     作り直されるので、ここで付けたリスナーが前回描画ぶんと二重に残ることはない。 */
  if(YJ.solvedThis){
    const appEl = document.getElementById("yjApp");
    if(appEl){
      appEl.addEventListener("click", (e)=>{
        if(e.target.closest("button")) return; // ヒントを見るボタン等は個別の動作を優先する
        yjNextQuestion();
      });
    }
  }
}

function yjHandleTap(idx){
  if(YJ.solvedThis) return;
  const p = YJ_PROBLEMS[YJ.idx];
  if(YJ.tappedNum[idx]) return; // すでに読んだ字は無視（誤タップ扱いにしない）

  const expectedIdx = p.order[YJ.nextPos];

  if(idx === expectedIdx){
    YJ.tappedNum[idx] = YJ.nextPos+1;
    YJ.nextPos++;
    YJ.badTapIdx = null;
    if(YJ.nextPos === p.order.length){
      YJ.solvedThis = true;
      YJ.solved++;
      yjRender();
      const msg = document.getElementById("yjMsg");
      msg.textContent = "正解！すべて読む順どおりにタップできました。";
      msg.className = "yj-msg good";
      /* ミスなく（誤タップ0回で）正解できたときだけ、漢文レベル・経験値と解禁ストリークの
         対象にする（教員の指示、2026-08-22：「1回でもミスしたら、漢文のジャンルのレベルは
         上がらないようにしてほしい」、返り点をつける側と同じ基準）。星の判定
         （3つ星＝mistakes===0）と同じ。ミスがあった場合はrecord()自体を呼ばない。 */
      if(YJ.mistakes === 0){
        const elapsedMs = Date.now() - (YJ.shownAt || Date.now());
        const r = record("kanbun", {q:yjQ(YJ.idx)}, true, elapsedMs, {skipRecentAcc:true});
        const st2 = loadStats();
        const groupUnlocked = yjCheckGroupUnlock(st2, YJ.idx, true);
        saveStats(st2);
        if(r.lvup){
          const extra = document.createElement("div");
          extra.className = "yj-msg good";
          extra.style.marginTop = "4px";
          extra.textContent = r.evolved ? `漢文 Lv.${r.lv} UP！${r.evolved.icon} ${r.evolved.name}になりました` : `漢文 Lv.${r.lv} UP！`;
          msg.after(extra);
        }
        if(groupUnlocked){
          const extra2 = document.createElement("div");
          extra2.className = "yj-msg good";
          extra2.style.marginTop = "4px";
          extra2.textContent = "🎉 次の8問が解禁されました！";
          msg.after(extra2);
        }
      } else {
        const extra3 = document.createElement("div");
        extra3.className = "yj-msg";
        extra3.style.marginTop = "4px";
        extra3.textContent = "ミスがあったので、今回は漢文のレベルアップの対象外です。";
        msg.after(extra3);
      }
      yjAnimateReveal();
    } else {
      yjRender();
      document.getElementById("yjMsg").textContent = "";
    }
  } else {
    YJ.mistakes++;
    YJ.badTapIdx = idx;
    yjRender();
    const m2 = document.getElementById("yjMsg");
    m2.textContent = YJ_PROBLEMS[YJ.idx].chars[idx].oki
      ? "その字は置き字。声に出して読まない字だよ。"
      : "ちがう字だよ。もう一度、次に読む字をさがしてみよう。";
    m2.className = "yj-msg bad";
    const gen = YJ.renderGen;
    setTimeout(()=>{
      if(gen !== YJ.renderGen) return;
      YJ.badTapIdx = null;
      const row = document.querySelector(`#yjApp .yj-row[data-idx="${idx}"]`);
      if(row) row.classList.remove("bad-tap");
    }, 400);
  }
}

function yjShowStars(){
  const starsEl = document.getElementById("yjStars");
  const n = YJ.mistakes===0 ? 3 : YJ.mistakes<=2 ? 2 : 1;
  let html = "";
  for(let i=0;i<3;i++) html += `<span class="${i<n?"on":""}">★</span>`;
  starsEl.innerHTML = html;
}

function yjAnimateReveal(){
  const gen = YJ.renderGen;
  setTimeout(()=>{
    if(gen !== YJ.renderGen) return;
    const kb = document.getElementById("yjKudashiBox");
    if(kb){ kb.style.display = "block"; requestAnimationFrame(()=> kb.classList.add("show")); }
  }, 200);
}

bootApp();
</script>
</body>
</html>
