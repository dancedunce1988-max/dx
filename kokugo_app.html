    background:linear-gradient(180deg,#ffb877,#e0722f);
    color:#fff; font-weight:bold; font-size:1.15em;
    box-shadow:0 3px 6px rgba(0,0,0,0.2);
  }
  #psApp .psThemeBadge.final{
    animation:psThemeBadgePop 0.4s ease-out;
    background:linear-gradient(180deg,#7dd0a0,#2e9e5b);
  }
  @keyframes psThemeBadgePop{
    0%{ transform:scale(0.5); opacity:0; }
    60%{ transform:scale(1.15); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }
  #psApp .psCountdownNum{
    font-size:3.2em;
    font-weight:900;
    color:#e0722f;
    margin-top:8px;
    min-height:1.2em;
  }
  #psApp .psCountdownNum.pop{
    animation:psCountdownPop 0.6s ease-out;
  }
  @keyframes psCountdownPop{
    0%{ transform:scale(0.3); opacity:0; }
    40%{ transform:scale(1.3); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }
  #psApp .psUnlockCelebrate{
    display:inline-block;
    margin-top:10px;
    padding:10px 24px;
    border-radius:22px;
    font-weight:900;
    font-size:1.15em;
    color:#fff;
    background:linear-gradient(180deg,#ffd76b,#e0a72f);
    box-shadow:0 4px 10px rgba(224,167,47,0.45);
    animation: psUnlockPop 0.8s cubic-bezier(.34,1.56,.64,1);
  }
  #psApp .psUnlockCelebrate.allClear{
    font-size:1.3em;
    background:linear-gradient(180deg,#ff9f57,#e0722f 55%,#ffd76b);
    box-shadow:0 0 0 4px #fff, 0 0 22px 8px rgba(255,215,80,0.7);
    animation: psUnlockPop 1s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes psUnlockPop{
    0%{ transform:scale(0.3) rotate(-10deg); opacity:0; }
    55%{ transform:scale(1.18) rotate(4deg); opacity:1; }
    80%{ transform:scale(0.94) rotate(-2deg); }
    100%{ transform:scale(1) rotate(0deg); opacity:1; }
  }
  #psApp .psBtnRow{
    display:flex; gap:12px; justify-content:center; margin-top:16px; flex-wrap:wrap;
  }
  #psApp .psBtnCol{
    display:flex; flex-direction:column; gap:10px; margin-top:16px;
  }
  #psApp .psLevelRow{
    display:flex; align-items:center; gap:14px;
    text-align:left;
  }
  #psApp .psLevelRow .psStartBtn{ flex:0 0 auto; min-width:88px; }
  #psApp .psLevelRow .psLevelDesc{ margin:0; flex:1 1 auto; }
  #psApp button.psStartBtn{
    padding:10px 26px;
    font-size:1.02em;
    font-weight:bold;
    color:#fff;
    background:linear-gradient(180deg,#ff9f57,#e0722f);
    border:none;
    border-radius:24px;
    box-shadow:0 4px 8px rgba(0,0,0,0.25);
    cursor:pointer;
  }
  #psApp button.psStartBtn.secondary{ background:linear-gradient(180deg,#8fb3d9,#4a7fb0); }
  #psApp button.psStartBtn.lv1{ background:linear-gradient(180deg,#8bc98f,#4e9c56); }
  #psApp button.psStartBtn.lv2{ background:linear-gradient(180deg,#8fb3d9,#4a7fb0); }
  #psApp button.psStartBtn.lv3{ background:linear-gradient(180deg,#f0ad4e,#d98a2b); }
  #psApp button.psStartBtn.lv4{ background:linear-gradient(180deg,#e57373,#c0392b); }
  #psApp button.psStartBtn.lv5{ background:linear-gradient(180deg,#b48ee0,#7d4fb0); }
  #psApp button.psStartBtn.lv6{ background:linear-gradient(180deg,#7fbf5c,#457a34); }
  #psApp button.psStartBtn.lv7{ background:linear-gradient(180deg,#5c5c5c,#2e2e2e); }
  #psApp button.psStartBtn:active{ transform:translateY(2px); }
  #psApp .psLevelDesc{
    font-size:0.8em; color:#6b5744; margin:0 0 2px;
  }
  #psApp #psRuleText{
    color:#6b5744; font-size:0.85em; margin:2px 0 0;
  }

  /* スマホなど横幅が狭い画面向け：ボムパネルを盤面の横から下へ移し、盤面の横幅を
     フルに使えるようにする（教員の指示：モバイルで文字が葉からはみ出す問題の修正）。
     マスの文字サイズ自体はpsPositionEl側でマスの実サイズに比例させて解決済みなので、
     ここではレイアウトの取り合いだけを直す。 */
  @media (max-width:480px){
    #psApp{ padding:6px; height:clamp(420px, 82vh, 700px); }
    #psApp h1{ font-size:1.1em; margin:2px 0 4px; }
    #psApp #psHud{ padding:4px 8px; gap:8px; font-size:0.82em; margin-bottom:6px; }
    #psApp #psHud .val{ font-size:1.05em; }
    #psApp #psPlayArea{ flex-direction:column; gap:6px; }
    #psApp #psBombPanel{ flex-direction:row; width:auto; gap:8px; }
    #psApp .psBombAlert{ min-height:1.3em; font-size:0.68em; writing-mode:horizontal-tb; }
    #psApp #psBombIcon{ width:44px; height:44px; font-size:1.1em; }
    #psApp #psBombGaugeWrap{ width:10px; height:44px; }
    #psApp #psLegend{ margin-top:6px; }
    #psApp .psLegendItem{ font-size:0.7em; padding:3px 9px; }
    #psApp #psRuleText{ font-size:0.68em; }
    #psApp #psOverlayCard{ padding:16px 14px; }
    #psApp #psOverlayCard h2{ font-size:1.05em; }
    #psApp .psLevelDesc{ font-size:0.72em; }
    #psApp .psLevelRow{ gap:8px; }
    #psApp button.psStartBtn{ padding:8px 16px; font-size:0.9em; }
    #psApp .psBonusCard{ width:auto; padding:16px 14px 18px; }
    #psApp .psBonusWord{ font-size:1.35em; }
    #psApp .psBonusQText{ font-size:0.88em; }
    #psApp button.psBonusChoice{ font-size:0.85em; padding:8px 4px; }
    #psApp .psBonusResult .psBonusMedal{ font-size:2.6em; }
  }

  /* ============ かなづかい特訓「光る竹」（2026-〜）============
     光村図書の古典単元（竹取物語・いろは歌・枕草子・徒然草・平家物語・おくのほそ道）から、
     歴史的仮名遣いの変化点が多い一節を出題する専用ミニゲーム。#kzAppの中だけで完結する
     ように、色などは全て--kz-プレフィックスの独自変数にして、アプリ本体の:root変数
     （--sub等）とは絶対に衝突しないようにしてある。 */
  #kzApp{
    --kz-bg1:#0b1030; --kz-bg2:#161c46; --kz-bg3:#1f2a5e;
    --kz-gold:#ffd76b; --kz-gold2:#ffb347;
    --kz-teal:#7fe9c8; --kz-teal2:#4fd6b0;
    --kz-paper:#fbf3df; --kz-paper2:#f3e6c4; --kz-ink:#4a3a20;
    --kz-text:#eef0ff; --kz-sub:#a9b2e8;
    background:
      radial-gradient(1.5px 1.5px at 20% 15%, rgba(255,255,255,.9), transparent),
      radial-gradient(1.5px 1.5px at 70% 8%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 85% 25%, rgba(255,255,255,.8), transparent),
      radial-gradient(ellipse at 50% -10%, var(--kz-bg3) 0%, var(--kz-bg2) 45%, var(--kz-bg1) 100%);
    color:var(--kz-text); border-radius:18px; padding:18px 16px 20px; margin:10px 0;
    font-family:'Hiragino Sans','Yu Gothic',sans-serif;
  }
  #kzApp h3.kz-title{
    text-align:center; font-size:clamp(18px,5.5vw,24px); letter-spacing:2px; margin-bottom:2px;
    background:linear-gradient(90deg,var(--kz-gold),#fff6dd,var(--kz-gold2));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    text-shadow:0 0 30px rgba(255,215,107,.25);
  }
  #kzApp .kz-tabs-row{ display:flex; gap:8px; overflow-x:auto; padding:12px 2px 4px; scrollbar-width:none; }
  #kzApp .kz-tabs-row::-webkit-scrollbar{ display:none; }
  #kzApp .kz-tab{
    flex:0 0 auto; padding:9px 16px; border-radius:999px; font-size:12.5px; font-weight:bold;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); color:var(--kz-sub);
    white-space:nowrap; display:flex; align-items:center; gap:5px; cursor:pointer;
  }
  #kzApp .kz-tab .kz-src{ font-size:9.5px; font-weight:normal; opacity:.75; }
  #kzApp .kz-tab.active{
    background:linear-gradient(135deg,var(--kz-gold),var(--kz-gold2)); color:#3a2c0c; border-color:transparent;
    box-shadow:0 4px 16px rgba(255,183,71,.4);
  }
  #kzApp .kz-tab.locked{ opacity:.45; cursor:default; }
  #kzApp .kz-reassure{
    margin:10px 0 14px; padding:12px 14px; border-radius:14px;
    background:linear-gradient(135deg, rgba(127,233,200,.14), rgba(255,215,107,.10));
    border:1px solid rgba(127,233,200,.35);
    font-size:12.5px; line-height:1.7; color:#dff7ec;
  }
  #kzApp .kz-reassure b{ color:var(--kz-teal); }
  #kzApp .kz-bamboo-row{ display:flex; gap:6px; justify-content:center; margin:16px 0 20px; flex-wrap:wrap; }
  #kzApp .kz-fushi{
    width:34px; height:46px; border-radius:9px;
    background:linear-gradient(180deg,#1c3d33,#12261f);
    border:1px solid rgba(127,233,200,.25); position:relative; overflow:hidden; transition:all .5s ease;
  }
  #kzApp .kz-fushi::after{ content:""; position:absolute; left:0; right:0; top:50%; height:2px; background:rgba(0,0,0,.35); }
  #kzApp .kz-fushi.lit-self{
    background:linear-gradient(180deg,#5a4415,#7a5c12 40%, #3a2c0c);
    box-shadow:0 0 18px rgba(255,215,107,.7), inset 0 0 12px rgba(255,246,220,.4); border-color:var(--kz-gold);
  }
  #kzApp .kz-fushi.lit-hint{
    background:linear-gradient(180deg,#124a42,#0f3730);
    box-shadow:0 0 16px rgba(127,233,200,.55), inset 0 0 10px rgba(127,233,200,.25); border-color:var(--kz-teal);
  }
  @keyframes kzFushiPop{ 0%{transform:scale(1);} 40%{transform:scale(1.35);} 65%{transform:scale(.92);} 100%{transform:scale(1);} }
  #kzApp .kz-fushi.fresh{ animation:kzFushiPop .5s ease; }
  #kzApp .kz-progress-label{ text-align:center; font-size:11.5px; color:var(--kz-sub); margin-bottom:4px; }
  #kzApp .kz-scroll{
    background:linear-gradient(180deg,var(--kz-paper),var(--kz-paper2));
    color:var(--kz-ink); border-radius:16px; padding:26px 20px 24px;
    box-shadow:0 10px 40px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.4); position:relative;
  }
  #kzApp .kz-scroll-badge{
    position:absolute; top:-11px; left:16px; right:16px;
    background:var(--kz-gold); color:#3a2c0c; font-family:'Hiragino Sans','Yu Gothic',sans-serif;
    font-size:11px; font-weight:bold; padding:3px 10px; border-radius:999px; box-shadow:0 2px 8px rgba(0,0,0,.3);
    max-width:fit-content; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #kzApp .kz-scroll-body{
    font-family:'Hiragino Mincho ProN','Yu Mincho',serif; font-size:17px; line-height:2.4; letter-spacing:.5px;
    line-break:strict; word-break:normal; overflow-wrap:normal; text-align:justify;
  }
  #kzApp .kz-cand{
    position:relative; display:inline-block; white-space:nowrap; cursor:pointer;
    padding:1px 7px 1px 3px; margin:0 1px; border-radius:5px; transition:background .35s ease, box-shadow .35s ease;
  }
  #kzApp .kz-cand:not(.lit){ background:rgba(255,183,71,.18); box-shadow:0 0 0 1px rgba(255,183,71,.35) inset; }
  #kzApp .kz-cand:not(.lit)::after{
    content:"✦"; font-size:9px; color:#c9860f; position:absolute; top:-2px; right:-1px;
    animation:kzTwinkle 1.6s ease-in-out infinite;
  }
  @keyframes kzTwinkle{ 0%,100%{opacity:.35;} 50%{opacity:1;} }
  #kzApp .kz-cand.lit-self{ background:rgba(255,215,107,.4); box-shadow:0 0 0 1px rgba(255,183,71,.6) inset; }
  #kzApp .kz-cand.lit-hint{ background:rgba(127,233,200,.35); box-shadow:0 0 0 1px rgba(79,214,176,.6) inset; }
  #kzApp .kz-cand.lit::after{ content:""; }
  #kzApp .kz-hint-note{ text-align:center; font-size:11px; color:var(--kz-sub); margin-top:10px; }
  #kzModalWrap{
    position:fixed; inset:0; background:rgba(6,8,26,.72);
    display:none; align-items:center; justify-content:center; z-index:9999; padding:20px;
    font-family:'Hiragino Sans','Yu Gothic',sans-serif;
  }
  #kzModalWrap.show{ display:flex; }
  #kzModalWrap .kz-modal{
    width:100%; max-width:380px; background:linear-gradient(180deg,#1c234f,#12173a);
    border:1px solid rgba(255,215,107,.25); border-radius:18px; padding:20px 18px; box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  #kzModalWrap .kz-context{
    text-align:center; font-family:'Hiragino Mincho ProN','Yu Mincho',serif;
    font-size:16px; line-height:2; color:#c3caf2; margin-bottom:6px; letter-spacing:.5px; word-break:keep-all;
  }
  #kzModalWrap .kz-context-target{
    font-size:30px; font-weight:bold; color:#ffd76b; padding:0 5px; letter-spacing:1px;
    text-shadow:0 0 18px rgba(255,215,107,.6);
  }
  #kzModalWrap .kz-ask{ text-align:center; font-size:12.5px; color:#a9b2e8; margin-bottom:16px; }
  #kzModalWrap .kz-keep-btn{
    width:100%; margin-top:10px; padding:11px 8px; border-radius:12px; border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.06); color:#eef0ff; font-size:13px; font-weight:bold; text-align:center;
  }
  #kzModalWrap .kz-keep-btn:active{ transform:scale(.97); background:rgba(255,215,107,.18); }
  #kzModalWrap .kz-input-area{ margin-top:6px; }
  #kzModalWrap .kz-input-area input{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08); color:#eef0ff; font-size:16px; text-align:center; letter-spacing:1px;
  }
  #kzModalWrap .kz-input-area input::placeholder{ color:#8891c9; }
  #kzModalWrap .kz-submit-btn{
    width:100%; margin-top:10px; padding:12px; border-radius:12px; border:none;
    background:linear-gradient(135deg,#7fe9c8,#4fd6b0); color:#0c2b23; font-weight:bold; font-size:14px;
  }
  #kzModalWrap .kz-submit-btn:active{ transform:scale(.98); }
  #kzModalWrap .kz-feedback{ margin-top:14px; font-size:13px; line-height:1.8; border-radius:12px; padding:0; }
  #kzModalWrap .kz-feedback.show{ padding:12px 14px; }
  #kzModalWrap .kz-feedback.ok{ background:rgba(255,215,107,.14); border:2px solid rgba(255,215,107,.7); color:#ffe9b0; }
  #kzModalWrap .kz-feedback.hint{ background:rgba(127,233,200,.12); border:1px solid rgba(127,233,200,.4); color:#d6fff1; }
  #kzModalWrap .kz-verdict-ok{
    font-size:22px; font-weight:bold; color:#ffd76b; margin-bottom:6px;
    text-shadow:0 0 16px rgba(255,215,107,.6); animation:kzVerdictPop .4s ease;
  }
  @keyframes kzVerdictPop{ 0%{transform:scale(.6);opacity:0;} 60%{transform:scale(1.12);opacity:1;} 100%{transform:scale(1);} }
  #kzModalWrap .kz-continue-btn{
    width:100%; margin-top:10px; padding:12px; border-radius:12px; border:none;
    background:linear-gradient(135deg,#7fe9c8,#4fd6b0); color:#0c2b23; font-weight:bold; font-size:14px;
    animation:kzContPulse 1.6s ease-in-out infinite;
  }
  #kzModalWrap .kz-continue-btn:active{ transform:scale(.97); }
  @keyframes kzContPulse{ 0%,100%{box-shadow:0 0 0 rgba(127,233,200,0);} 50%{box-shadow:0 0 16px rgba(127,233,200,.55);} }
  #kzModalWrap .kz-hint-link{
    display:block; text-align:center; margin-top:14px; font-size:12px; color:#a9b2e8;
    text-decoration:underline; text-underline-offset:3px; cursor:pointer;
  }
  #kzModalWrap .kz-close-btn{
    display:block; margin:16px auto 0; padding:10px 26px; border-radius:999px;
    border:1px solid rgba(255,255,255,.25); background:transparent; color:#a9b2e8; font-size:12px;
  }
  #kzApp .kz-firefly{ font-size:18px; margin-right:6px; }
  #kzApp .kz-trans-toggle{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin:14px auto 0; padding:9px 18px; width:fit-content; border-radius:999px; cursor:pointer; user-select:none;
    background:rgba(127,233,200,.12); border:1px solid rgba(127,233,200,.4);
    color:var(--kz-teal); font-size:12.5px; font-weight:bold; letter-spacing:.5px; transition:background .25s ease;
  }
  #kzApp .kz-trans-toggle .kz-arrow{ display:inline-block; transition:transform .3s ease; font-size:10px; }
  #kzApp .kz-trans-toggle.open .kz-arrow{ transform:rotate(180deg); }
  #kzApp .kz-trans-panel{
    max-height:0; overflow:hidden; opacity:0;
    transition:max-height .4s ease, opacity .35s ease, margin .4s ease; margin-top:0;
  }
  #kzApp .kz-trans-panel.open{ max-height:400px; opacity:1; margin-top:10px; }
  #kzApp .kz-trans-panel-inner{
    background:linear-gradient(135deg, rgba(127,233,200,.10), rgba(79,214,176,.06));
    border:1px solid rgba(127,233,200,.3); border-radius:14px; padding:14px 16px; font-size:13.5px; line-height:1.95; color:#e2fbf3;
  }
  #kzApp .kz-trans-panel-title{ font-size:11px; font-weight:bold; color:var(--kz-teal); letter-spacing:1px; margin-bottom:6px; }

  /* かなづかいの直し方ガイド（教員の指示：初心者でも分かるように、いつでもボタンで
     見られるようゲーム画面の一番上に置く）。翻訳トグルと同じ開閉パターンを流用。 */
  #kzApp .kz-guide-toggle{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin:0 auto 4px; padding:11px 20px; width:fit-content; border-radius:999px; cursor:pointer; user-select:none;
    background:linear-gradient(135deg, rgba(255,215,107,.22), rgba(255,183,71,.14));
    border:1px solid rgba(255,215,107,.5);
    color:var(--kz-gold); font-size:13px; font-weight:bold; letter-spacing:.5px; transition:background .25s ease;
  }
  #kzApp .kz-guide-toggle .kz-arrow{ display:inline-block; transition:transform .3s ease; font-size:10px; }
  #kzApp .kz-guide-toggle.open .kz-arrow{ transform:rotate(180deg); }
  #kzApp .kz-guide-panel{
    max-height:0; overflow:hidden; opacity:0;
    transition:max-height .5s ease, opacity .4s ease, margin .4s ease; margin-top:0;
  }
  #kzApp .kz-guide-panel.open{ max-height:2000px; opacity:1; margin-top:10px; }
  #kzApp .kz-guide-inner{
    background:linear-gradient(180deg,var(--kz-paper),var(--kz-paper2));
    color:var(--kz-ink); border-radius:16px; padding:18px 18px 16px;
    box-shadow:0 10px 30px rgba(0,0,0,.3); font-size:13.5px; line-height:1.85;
  }
  #kzApp .kz-guide-lead{ margin-bottom:14px; }
  #kzApp .kz-guide-rule{
    background:rgba(255,255,255,.5); border-radius:12px; padding:10px 12px; margin-bottom:10px;
    border-left:4px solid var(--kz-gold2);
  }
  #kzApp .kz-guide-rule-title{ font-weight:bold; margin-bottom:3px; }
  #kzApp .kz-guide-example{ color:#6b5636; font-size:12.5px; }
  #kzApp .kz-guide-warn{
    background:rgba(127,200,180,.18); border-radius:12px; padding:10px 12px; margin-top:4px;
    border-left:4px solid var(--kz-teal2);
  }
  #kzApp .kz-guide-warn-title{ font-weight:bold; margin-bottom:3px; color:#1f6b57; }
  #kzApp .kz-guide-foot{ margin-top:12px; font-size:12.5px; }

  /* 結果画面 */
  #kzApp .kz-result-visual{ width:110px; height:130px; position:relative; margin:6px auto 14px; }
  @keyframes kzRiseIn{ 0%{opacity:0; transform:translateY(24px) scale(.85);} 100%{opacity:1; transform:translateY(0) scale(1);} }
  #kzApp .kz-result-visual{ animation:kzRiseIn 1s ease; }
  #kzApp .kz-fv-glow{
    position:absolute; inset:-26px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,246,220,.9), rgba(255,215,107,.3) 45%, transparent 70%);
    filter:blur(2px); animation:kzPulseGlow 2.4s ease-in-out infinite;
  }
  @keyframes kzPulseGlow{ 0%,100%{transform:scale(1);opacity:.85;} 50%{transform:scale(1.15);opacity:1;} }
  #kzApp .kz-fv-fig{
    position:absolute; left:50%; top:26px; transform:translateX(-50%); width:60px; height:88px;
    background:linear-gradient(180deg,#fff6dd,#ffe2a8); border-radius:50% 50% 40% 40% / 55% 55% 45% 45%;
    box-shadow:0 0 40px rgba(255,246,220,.9);
  }
  #kzApp .kz-fv-emoji{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-size:46px; filter:drop-shadow(0 0 18px rgba(255,246,220,.8));
  }
  #kzApp .kz-result-title{ text-align:center; font-size:20px; color:var(--kz-gold); margin-bottom:8px; letter-spacing:1px; }
  #kzApp .kz-result-msg{ text-align:center; font-size:13.5px; color:var(--kz-sub); line-height:1.8; margin:0 auto 18px; max-width:340px; }
  #kzApp .kz-stat-card{
    background:rgba(255,255,255,.05); border-radius:14px; padding:16px; margin-bottom:14px;
  }
  #kzApp .kz-stat-big{ font-size:17px; font-weight:bold; color:var(--kz-gold); text-align:center; margin-bottom:4px; }
  #kzApp .kz-stat-sub{ font-size:12px; color:var(--kz-sub); text-align:center; }
  #kzApp .kz-lvup-card{
    background:linear-gradient(135deg, rgba(255,215,107,.16), rgba(255,183,71,.08));
    border:1px solid rgba(255,215,107,.4); border-radius:14px; padding:16px; margin-bottom:14px; text-align:center;
  }
  #kzApp .kz-lvup-card .kz-lv-row{ font-size:18px; font-weight:bold; color:var(--kz-gold); margin-bottom:4px; }
  #kzApp .kz-lvup-card .kz-lv-sub{ font-size:12px; color:var(--kz-sub); }
  #kzApp .kz-recap{ background:rgba(255,255,255,.05); border-radius:14px; padding:14px 16px; margin-bottom:16px; }
  #kzApp .kz-recap-title{ font-size:11px; color:var(--kz-sub); margin-bottom:8px; letter-spacing:1px; }
  #kzApp .kz-recap-item{ display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px dashed rgba(255,255,255,.1); }
  #kzApp .kz-recap-item:last-child{ border-bottom:none; }
  #kzApp .kz-recap-item .kz-badge{ font-size:11px; color:var(--kz-sub); }

  /* 「一レ」「上レ」など合体マークの縦並び2段書き。ktMarkInner()（返り点をつける・読む順タップの
     両方から呼ばれる共通関数）が出力する共通クラスなので、#ktApp/#yjAppどちらのスコープにも
     属さない共通ルールにしてある（色に依存しないレイアウトのみなので、スコープごとの独自変数は不要）。 */
  .mark-stack{ display:flex; flex-direction:column; align-items:center; line-height:.88; }
  .mark-stack span{ display:block; }

  /* ============ 返り点をつける（2026-〜）============
     漢文の白文に、返り点をドラッグ／タップで置く専用ミニゲーム。#ktAppの中だけで完結する
     ように、色・フォントなどは全て--kt-プレフィックスの独自変数にして、アプリ本体の
     :root変数とは絶対に衝突しないようにしてある（かなづかい特訓「光る竹」と同じ方針）。
     ナビゲーション用ボタン（次の問題へ／ホームへ等）はアプリ本体の.btnをそのまま使う。 */
  #ktApp{
    --kt-sumi:#22262b; --kt-kinari:#e8e1d2; --kt-maki:#f7f3e9; --kt-card:#fffdf7;
    --kt-ai:#14395e; --kt-ai-l:#2c5c86; --kt-shu:#c2412c; --kt-kin:#9c7c2a; --kt-midori:#2f7d5b;
    --kt-sub:#7b7466; --kt-line:#d6cdb9;
    --kt-mincho:"Yu Mincho","YuMincho","Hiragino Mincho ProN","MS PMincho",serif;
    font-family:'Hiragino Sans','Yu Gothic',sans-serif; color:var(--kt-sumi);
    background:var(--kt-kinari); border-radius:14px; padding:14px 12px 18px; margin:10px 0;
    background-image:
      repeating-linear-gradient(58deg, rgba(140,125,95,.035) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(-32deg, rgba(140,125,95,.025) 0 1px, transparent 1px 6px);
  }
  #ktApp .kt-hud{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  #ktApp .kt-title{ font-family:var(--kt-mincho); font-size:1.05rem; letter-spacing:.24em; font-weight:600; color:var(--kt-ai); margin-right:auto; }
  #ktApp .kt-prog{ font-size:.72rem; color:var(--kt-sub); letter-spacing:.06em; }
  #ktApp .kt-progress{ height:3px; background:var(--kt-line); border-radius:2px; margin-bottom:10px; overflow:hidden; }
  #ktApp .kt-progress i{ display:block; height:100%; background:var(--kt-ai); transition:width .35s cubic-bezier(.2,.9,.3,1); }
  #ktApp .kt-card{ background:var(--kt-card); border:1px solid var(--kt-line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  #ktApp .kt-lv-badge{ display:inline-block; font-size:.68rem; letter-spacing:.08em; color:#fff; background:var(--kt-ai-l); border-radius:99px; padding:2px 10px; margin-bottom:8px; font-weight:600; }
  #ktApp .kt-instr{ font-size:.86rem; line-height:1.6; }
  #ktApp .kt-instr b{ color:var(--kt-shu); }
  #ktApp .kt-help{ font-size:.72rem; color:var(--kt-sub); line-height:1.6; margin-top:8px; border-top:1px dashed var(--kt-line); padding-top:8px; }
  #ktApp .kt-help-btn{ margin-top:8px; font-size:.7rem; padding:6px 12px; background:transparent; color:var(--kt-ai); border:1.5px solid var(--kt-ai-l); border-radius:8px; cursor:pointer; }
  #ktApp .kt-stage{ display:flex; justify-content:center; padding:10px 4px; }
  #ktApp .kt-stage-row{ display:flex; flex-direction:row; align-items:flex-start; gap:14px; }
  #ktApp .kt-actions-mid{ display:flex; flex-direction:column; justify-content:center; align-self:stretch; gap:8px; }
  #ktApp .kt-actions-mid .btn{ padding:14px 8px; font-size:.78rem; letter-spacing:.15em; writing-mode:vertical-rl; text-orientation:upright; margin-top:0; min-width:auto; }
  #ktApp .kt-box{
    font-family:var(--kt-mincho); background:var(--kt-card); border:1px solid var(--kt-line); border-radius:10px;
    padding:16px 30px 26px 30px; display:inline-flex; flex-direction:column; align-items:flex-end; gap:30px;
  }
  #ktApp .kt-row{ display:flex; flex-direction:row-reverse; align-items:flex-end; gap:3px; position:relative; padding:4px 2px; border-radius:8px; transition:background .12s; }
  #ktApp .kt-row.row-hover{ background:rgba(44,92,134,.1); }
  #ktApp .kt-glyph{ position:relative; font-size:1.9rem; line-height:1; width:2.1rem; height:2.1rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  /* 読み仮名(.kt-ok)・送り仮名(.kt-okuri)の置き場所。文字(kt-glyph)と同じ高さぶんを確保した
     専用のflexコンテナ(.kt-anno)を右横に置き、中でflexboxに配置を任せる（返り点タッチの
     試作で「bottom:0の絶対配置は文字数が多いと右下に収まって見えない」と分かったための
     改良版。教員の指摘、2026-08-22で本体側にも反映）。 */
  #ktApp .kt-anno{ position:absolute; left:100%; top:0; bottom:0; margin-left:3px; display:flex; flex-direction:column; align-items:center; }
  #ktApp .kt-ok{ writing-mode:vertical-rl; text-orientation:upright; font-family:'Hiragino Sans','Yu Gothic',sans-serif; font-weight:700; font-size:.6rem; color:var(--kt-sub); letter-spacing:0; line-height:1; white-space:nowrap; }
  /* 送り仮名(okuri)が無く、読み仮名(ok)だけの字は、そのままだと一番上に張り付いてしまう
     （okuriのmargin-top:autoが無いため）。ひとりっ子のときだけ上下autoで縦の中央＝字の真横に
     くるようにする（教員の指摘、2026-08-22：「不」の「ず」の位置が上過ぎる）。 */
  #ktApp .kt-anno .kt-ok:only-child{ margin-top:auto; margin-bottom:auto; }
  #ktApp .kt-okuri{ writing-mode:vertical-rl; text-orientation:upright; font-family:'Hiragino Sans','Yu Gothic',sans-serif; font-weight:700; font-size:.6rem; color:var(--kt-sub); letter-spacing:0; line-height:1; white-space:nowrap; margin-top:auto; }
  #ktApp .kt-okuri.long{ font-size:.46rem; }
  #ktApp .kt-slot{
    width:25px; height:25px; flex-shrink:0; position:relative; top:25px;
    display:flex; align-items:center; justify-content:center;
    font-size:.7rem; font-weight:bold; color:var(--kt-shu); line-height:1;
    border-radius:5px; border:1.5px dashed rgba(123,116,102,.5); background:rgba(255,255,255,.65);
    transition:background .15s, border-color .15s, transform .12s;
  }
  #ktApp .kt-slot.filled{ border-style:solid; border-color:var(--kt-shu); background:#fff3ea; }
  #ktApp .kt-slot.combo{ font-size:.54rem; }
  #ktApp .kt-slot.target-hover{ border-color:var(--kt-ai); background:#eaf1f8; transform:scale(1.08); }
  #ktApp .kt-slot.ok{ border-color:var(--kt-midori); background:#eef7f0; color:var(--kt-midori); }
  #ktApp .kt-slot.bad{ animation:ktSlotShake .32s ease-out; border-color:var(--kt-shu); background:#fdeceb; }
  #ktApp .kt-slot.missing{ border-color:var(--kt-kin); background:#fbf3df; }
  @keyframes ktSlotShake{
    0%{transform:translateX(0);} 20%{transform:translateX(-6px);} 45%{transform:translateX(5px);}
    70%{transform:translateX(-3px);} 100%{transform:translateX(0);}
  }
  #ktApp .kt-order-badge{
    position:absolute; right:-8px; top:-8px; font-family:'Hiragino Sans','Yu Gothic',sans-serif; font-size:.66rem; font-weight:700;
    color:#fff; background:var(--kt-ai); border-radius:50%; width:19px; height:19px;
    display:flex; align-items:center; justify-content:center; opacity:0; transform:scale(.4);
    transition:opacity .25s, transform .25s;
  }
  #ktApp .kt-order-badge.show{ opacity:1; transform:scale(1); }
  #ktApp .kt-kudashi{
    display:flex; flex-direction:column; align-items:center;
    background:var(--kt-maki); border:1.5px solid var(--kt-ai-l); border-radius:10px;
    padding:10px 10px 14px; transition:background .3s, border-color .3s;
  }
  #ktApp .kt-kudashi-label{ font-size:.62rem; color:var(--kt-ai); letter-spacing:.1em; font-weight:700; margin-bottom:6px; }
  #ktApp .kt-kudashi-text{ writing-mode:vertical-rl; text-orientation:mixed; font-family:var(--kt-mincho); font-size:1rem; letter-spacing:.1em; color:var(--kt-sumi); line-height:1.9; max-height:250px; }
  #ktApp .kt-kudashi-text ruby rt{ font-size:.5em; color:var(--kt-sub); letter-spacing:0; }
  #ktApp .kt-kudashi.solved{ background:#eef7f0; border-color:var(--kt-midori); cursor:pointer; }
  #ktApp .kt-kudashi.solved .kt-kudashi-label{ color:var(--kt-midori); }
  #ktApp .kt-tap-hint{ writing-mode:horizontal-tb; font-size:.6rem; color:var(--kt-sub); letter-spacing:.02em; margin-top:8px; }
  #ktApp .kt-msg{ text-align:center; font-size:.8rem; min-height:1.2em; color:var(--kt-sub); letter-spacing:.04em; margin-top:10px; }
  #ktApp .kt-msg.good{ color:var(--kt-midori); font-weight:700; }
  #ktApp .kt-msg.bad{ color:var(--kt-shu); font-weight:700; }
  #ktApp .kt-stars{ text-align:center; font-size:1.2rem; letter-spacing:.15em; min-height:1.5em; }
  #ktApp .kt-stars span{ opacity:.25; transition:opacity .2s, transform .2s; }
  #ktApp .kt-stars span.on{ opacity:1; transform:scale(1.15); }
  #ktApp .kt-tray-label{ font-size:.66rem; color:var(--kt-sub); letter-spacing:.08em; margin:10px 0 6px; text-align:center; }
  #ktApp .kt-tray{ display:flex; gap:9px; justify-content:center; flex-wrap:wrap; background:var(--kt-maki); border:1px solid var(--kt-line); border-radius:12px; padding:11px; min-height:58px; }
  #ktApp .kt-chip{
    font-family:var(--kt-mincho); font-size:1.15rem; font-weight:700; color:var(--kt-shu);
    background:#fff; border:1.5px solid var(--kt-shu); border-radius:8px; width:48px; height:48px;
    display:flex; align-items:center; justify-content:center; cursor:grab; touch-action:none;
    box-shadow:0 2px 0 rgba(194,65,44,.18); transition:transform .12s, box-shadow .12s, opacity .15s;
    writing-mode:vertical-rl; text-orientation:upright; letter-spacing:0;
  }
  #ktApp .kt-chip:active{ cursor:grabbing; }
  #ktApp .kt-chip.selected{ outline:3px solid var(--kt-ai-l); outline-offset:2px; transform:translateY(-2px); }
  #ktApp .kt-chip.dragging{ opacity:.25; }
  #ktApp .kt-chip.ghost{ position:fixed; z-index:999; pointer-events:none; box-shadow:0 6px 14px rgba(0,0,0,.22); transform:scale(1.06) rotate(-3deg); }
  #ktApp .kt-done{ text-align:center; padding:30px 16px; }
  #ktApp .kt-done .kt-big{ font-family:var(--kt-mincho); font-size:1.3rem; color:var(--kt-ai); letter-spacing:.15em; margin-bottom:10px; }
  #ktApp .kt-done .kt-stat{ font-size:.84rem; color:var(--kt-sub); margin-bottom:18px; }
  @media (max-width:360px){ #ktApp .kt-box{ padding:14px 22px 20px 22px; } #ktApp .kt-chip{ width:44px; height:44px; font-size:1.05rem; } }

  /* ============ 読む順タップ（2026-〜）============
     「返り点をつける」（#ktApp）の対になる問題。あちらは白文に返り点を置く問題、
     こちらは返り点がすでに付いている白文を見て、読む順に字をタップする問題
     （教員の提案、2026-08-22：案A「順番タップ」）。問題データはKT_PROBLEMSをそのまま
     流用する（chars/order/kudashi/noteの形が完全に一致するため）。
     ドラッグ操作は無いのでトレイやチップは無く、代わりに返り点は最初から読み取り専用で
     表示する（.yj-mark。位置はktの.kt-slotと同じ「文字の左下」＝row-reverse＋flex-end＋
     top:25pxのオフセットを踏襲。教員の指示：「返り点は漢字の左下につくものだから、
     返り点の位置をしっかり確認して作成すること」）。
     書き下し文は正解するまで隠す（先に見せると読む順の答えになってしまうため。
     返り点をつける側とは逆の設計判断）。 */
  #yjApp{
    --yj-sumi:#22262b; --yj-kinari:#e8e1d2; --yj-maki:#f7f3e9; --yj-card:#fffdf7;
    --yj-ai:#14395e; --yj-ai-l:#2c5c86; --yj-shu:#c2412c; --yj-kin:#9c7c2a; --yj-midori:#2f7d5b;
    --yj-sub:#7b7466; --yj-line:#d6cdb9;
    --yj-mincho:"Yu Mincho","YuMincho","Hiragino Mincho ProN","MS PMincho",serif;
    font-family:'Hiragino Sans','Yu Gothic',sans-serif; color:var(--yj-sumi);
    background:var(--yj-kinari); border-radius:14px; padding:14px 12px 18px; margin:10px 0;
    background-image:
      repeating-linear-gradient(58deg, rgba(140,125,95,.035) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(-32deg, rgba(140,125,95,.025) 0 1px, transparent 1px 6px);
  }
  #yjApp .yj-hud{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  #yjApp .yj-title{ font-family:var(--yj-mincho); font-size:1.05rem; letter-spacing:.24em; font-weight:600; color:var(--yj-ai); margin-right:auto; }
  #yjApp .yj-prog{ font-size:.72rem; color:var(--yj-sub); letter-spacing:.06em; }
  #yjApp .yj-card{ background:var(--yj-card); border:1px solid var(--yj-line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  #yjApp .yj-lv-badge{ display:inline-block; font-size:.68rem; letter-spacing:.08em; color:#fff; background:var(--yj-ai-l); border-radius:99px; padding:2px 10px; margin-bottom:8px; font-weight:600; }
  #yjApp .yj-instr{ font-size:.86rem; line-height:1.6; }
  #yjApp .yj-instr b{ color:var(--yj-shu); }
  #yjApp .yj-help{ font-size:.72rem; color:var(--yj-sub); line-height:1.6; margin-top:8px; border-top:1px dashed var(--yj-line); padding-top:8px; }
  #yjApp .yj-help-btn{ margin-top:8px; font-size:.7rem; padding:6px 12px; background:transparent; color:var(--yj-ai); border:1.5px solid var(--yj-ai-l); border-radius:8px; cursor:pointer; }
  #yjApp .yj-stage{ display:flex; justify-content:center; padding:14px 4px 4px; }
  #yjApp .yj-box{
    font-family:var(--yj-mincho); background:var(--yj-card); border:1px solid var(--yj-line); border-radius:10px;
    padding:16px 30px 22px 30px; display:inline-flex; flex-direction:column; align-items:flex-end; gap:14px;
  }
  #yjApp .yj-row{ display:flex; flex-direction:row-reverse; align-items:flex-end; gap:5px; position:relative; padding:5px 3px; border-radius:8px; transition:background .12s; cursor:pointer; }
  #yjApp .yj-row.row-hover, #yjApp .yj-row:active{ background:rgba(44,92,134,.1); }
  #yjApp .yj-row.done{ cursor:default; }
  #yjApp .yj-row.done .yj-glyph{ color:var(--yj-midori); }
  #yjApp .yj-glyph{ position:relative; font-size:1.9rem; line-height:1; width:2.1rem; height:2.1rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:color .15s; }
  #yjApp .yj-anno{ position:absolute; left:100%; top:0; bottom:0; margin-left:3px; display:flex; flex-direction:column; align-items:center; }
  #yjApp .yj-ok{ writing-mode:vertical-rl; text-orientation:upright; font-family:'Hiragino Sans','Yu Gothic',sans-serif; font-weight:700; font-size:.6rem; color:var(--yj-sub); letter-spacing:0; line-height:1; white-space:nowrap; }
  #yjApp .yj-anno .yj-ok:only-child{ margin-top:auto; margin-bottom:auto; }
  #yjApp .yj-okuri{ writing-mode:vertical-rl; text-orientation:upright; font-family:'Hiragino Sans','Yu Gothic',sans-serif; font-weight:700; font-size:.6rem; color:var(--yj-sub); letter-spacing:0; line-height:1; white-space:nowrap; margin-top:auto; }
  #yjApp .yj-okuri.long{ font-size:.46rem; }
  /* 返り点（読み取り専用）：ktの.kt-slotと同じ「文字の左下」の位置・大きさに、
     押せない表示として出す（マス枠は無し）。マスが無い字も同じ幅を確保して字がまっすぐ並ぶ。 */
  #yjApp .yj-mark{
    width:25px; height:25px; flex-shrink:0; position:relative; top:25px;
    display:flex; align-items:center; justify-content:center;
    font-size:.7rem; font-weight:bold; color:var(--yj-shu); line-height:1;
  }
  #yjApp .yj-mark.combo{ font-size:.54rem; }
  #yjApp .yj-row.bad-tap .yj-glyph{ animation:yjGlyphShake .32s ease-out; color:var(--yj-shu); }
  @keyframes yjGlyphShake{
    0%{transform:translateX(0);} 20%{transform:translateX(-5px);} 45%{transform:translateX(4px);}
    70%{transform:translateX(-2px);} 100%{transform:translateX(0);}
  }
  #yjApp .yj-order-badge{
    position:absolute; right:-8px; top:-8px; font-family:'Hiragino Sans','Yu Gothic',sans-serif; font-size:.66rem; font-weight:700;
    color:#fff; background:var(--yj-ai); border-radius:50%; width:19px; height:19px;
    display:flex; align-items:center; justify-content:center; opacity:0; transform:scale(.4);
    transition:opacity .18s, transform .18s;
  }
  #yjApp .yj-order-badge.show{ opacity:1; transform:scale(1); background:var(--yj-midori); }
  #yjApp .yj-progress-text{ text-align:center; font-size:.78rem; color:var(--yj-ai); font-weight:700; letter-spacing:.04em; min-height:1.2em; margin-top:6px; }
  #yjApp .yj-kudashi{
    width:100%; text-align:center; background:var(--yj-maki); border:1.5px solid var(--yj-midori);
    border-radius:10px; padding:12px 16px; margin-top:12px; opacity:0; transform:translateY(6px);
    transition:opacity .35s, transform .35s; display:none;
  }
  #yjApp .yj-kudashi.show{ opacity:1; transform:translateY(0); cursor:pointer; }
  #yjApp .yj-kudashi-label{ font-size:.62rem; color:var(--yj-midori); letter-spacing:.1em; font-weight:700; margin-bottom:4px; }
  #yjApp .yj-kudashi-text{ font-family:var(--yj-mincho); font-size:1.1rem; letter-spacing:.06em; color:var(--yj-sumi); line-height:1.7; }
  #yjApp .yj-kudashi-text ruby rt{ font-size:.5em; color:var(--yj-sub); letter-spacing:0; }
  #yjApp .yj-tap-hint{ font-size:.66rem; color:var(--yj-sub); letter-spacing:.04em; margin-top:8px; }
  #yjApp .yj-msg{ text-align:center; font-size:.8rem; min-height:1.2em; color:var(--yj-sub); letter-spacing:.04em; margin-top:10px; }
  #yjApp .yj-msg.good{ color:var(--yj-midori); font-weight:700; }
  #yjApp .yj-msg.bad{ color:var(--yj-shu); font-weight:700; }
  #yjApp .yj-stars{ text-align:center; font-size:1.2rem; letter-spacing:.15em; min-height:1.5em; }
  #yjApp .yj-stars span{ opacity:.25; transition:opacity .2s, transform .2s; }
  #yjApp .yj-stars span.on{ opacity:1; transform:scale(1.15); }
  @media (max-width:360px){ #yjApp .yj-box{ padding:14px 22px 18px 22px; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>知識ドリル<span>DX</span><span class="ver-tag">ver9.13</span></h1>
    <div class="header-actions">
      <button class="home-btn" onclick="showHelp()">📖 せつめい</button>
      <button class="home-btn" onclick="showHome()">ホームへ</button>

/* 各問題には、学習指導要領・教科書の内容をもとに判定した「学年の目安」(grade, 1〜6)が付与されている。
   1:小学校中学年 2:小学校高学年 3:中学校1年 4:中学校2年 5:中学校3年 6:高校以上
   出題目標レベル(diffLv)にいちばん近いlvを持つ問題群の平均gradeから、今のおおよその学年を推定する。 */
const GRADE_LABELS = {1:"小学校中学年", 2:"小学校高学年", 3:"中学校1年", 4:"中学校2年", 5:"中学校3年", 6:"高校以上"};
function estimateGrade(cat, diffLv){
  const items = CATS[cat].items;
  if(!items.length || items.some(it => typeof it.grade !== "number")) return null;
  const targetLv = Math.round(diffLv);
  let nearestLv = items[0].lv, minDiff = Math.abs(items[0].lv - targetLv);
  items.forEach(it => { const d = Math.abs(it.lv - targetLv); if(d < minDiff){ minDiff = d; nearestLv = it.lv; } });
  const pool = items.filter(it => it.lv === nearestLv);
  const avgGrade = pool.reduce((s,it) => s + it.grade, 0) / pool.length;
  return Math.min(6, Math.max(1, Math.round(avgGrade)));
}

const STORE_KEY = "kokugoTrainingStats_v5";
/* セーブデータの一方向互換ルール：

const SAVE_FORMAT_VERSION = 45;

/* ステータスポイントは保存された数値ではなく、常にその場で計算する：
   「分野レベルの合計（＝これまで獲得した経験値の合計）」から「すでに割りふった分」を引いた残り。
   分野レベルは最初から正確に記録されているので、statPointsをいつ導入したかに関係なく、
   前から遊んでいるプレイヤーの過去の経験値もすべて正しく反映される。
   1つの分野のレベルが1000を超えた分は、レベル1につき0.2ptに逓減する（1分野への一極集中を防ぎ、
   いろいろな分野に挑戦したくなるようにするため、2026-07-14〜）。宝具を使ってもらえる経験値（bonusExp）と
   百人一首の正解ぶん（st.hyakuninBonusExp、2026-08-02〜）は、どちらも分野に関係なく全額そのまま加算する。 */
/* 「ことのはの経験値」の上限（2026-07-22〜、教員の指示）。20000を超えた分は切り捨てて常に20000
   として扱う。正解数の記録・各分野のレベルアップ自体は今までどおり無制限に続く（st.cats/st.lvは
   このキャップの影響を受けない）ので、プレイ自体は変わらず遊べるが、①ステータスポイント
   （totalEarnedStatPoints、割りふれる分）と②ボス出現・経験値ゲート・防御力ゲートの判定
   （kotonohaTotalXP）がこの値以上には増えなくなる。既存のボス出現しきい値の最大値は
   無敵艦隊１年３組のxp>=10000で、20000はその2倍の余裕があるため、このキャップを入れても
   既存のどのボスも出現できなくなることはない（ことのはの「すがた」進化システム
   ＝KOTONOHA_STAGE_XPの最終段階も上限10000なので、同様に影響なし）。「毎度計算し直す」という
   指示どおり、保存された値ではなく、既存の設計のままその場で計算した値をMath.minでクランプする
   だけなので、キャップの値をあとで変えても過去のセーブデータに一切影響しない。 */
const KOTONOHA_XP_CAP = 30000;
function catExpPoints(lv){
  /* LV100まではレベルアップごとに3pt、LV500までは2pt、LV1000までは1pt、それ以降は0.2ptに逓減する
     （2026-07-17〜。境界値で連続になるよう、各段の到達値を積み上げて計算する）。 */
  const L = Math.max(1, lv||1);
  if(L <= 100) return (L - 1) * 3;
  if(L <= 500) return 297 + (L - 100) * 2;
  if(L <= 1000) return 1097 + (L - 500);
  return 1597 + (L - 1000) * 0.2;
}
/* ================= 期間限定イベント経験値プール =================
   イベントIDをキーに、そのイベントで獲得した経験値を st.eventBonusEarned に積み上げる。
   rawKotonohaExp / kotonohaTotalXP の両方に totalEventBonusExp(st) として加算される。
   新しい期間限定イベントを追加するときは、EVENTS オブジェクトにエントリを追加し、
   対象のゲームの「正解ハンドラ」で eventBonusAdd(st, eventId, amount) を呼ぶだけでよい。 */
const EVENTS = {
  "2026_09_bunsetsu": {
    label: "言の刃 正解数イベント",
    end: new Date('2026-09-10T23:59:59'),
    desc: "言の刃（文節斬り）での正解1回 ＝ 経験値＋1！",
  },
};
function eventActive(id){ return new Date() <= EVENTS[id].end; }
function anyEventActive(){ return Object.keys(EVENTS).some(id => eventActive(id)); }
function totalEventBonusExp(st){
  return Object.values(st.eventBonusEarned||{}).reduce((s,v) => s+(v||0), 0);
}
function eventBonusAdd(st, id, amount){
  if(!st.eventBonusEarned) st.eventBonusEarned = {};
  st.eventBonusEarned[id] = (st.eventBonusEarned[id]||0) + amount;
}
/* 「ことのはの経験値」の生の計算式（totalEarnedStatPoints・kotonohaTotalXPの両方が使う共通部分）。
   百人一首の正解ぶん（st.hyakuninBonusExp）・問題全開放のお祝い経験値（totalUnlockCelebrationExp、
   2026-08-23〜はst.unlockBonusEarnedへの積み上げ方式）・文節斬りの巻クリアぶん
   （st.bunsetsuGiriBonusExp）・ボキャブラ・シューティングの自己ベスト突破ぶん
   （st.vocabShooterBonusExp）・野球で勝負！の勝利ぶん（st.baseballBonusExp）は、いずれも
   st.lvの分布を見ずに全額そのまま加算する（進化の分岐＝kotonohaBaseCategoryはst.lvの分布だけを
   見て判定するため、これらの加算は分岐判定に一切影響しない）。 */
function rawKotonohaExp(st){
  const fromLevels = CAT_KEYS.reduce((sum,k) => sum + catExpPoints(st.lv[k]||1), 0);
  return fromLevels + effectiveBonusExp(st) + (st.hyakuninBonusExp||0) + (st.bunsetsuGiriBonusExp||0) + (st.vocabShooterBonusExp||0) + (st.baseballBonusExp||0) + (st.partsOfSpeechBonusExp||0) + totalUnlockCelebrationExp(st) + totalEventBonusExp(st);
}
function spentStatPoints(st){
  return Object.values(st.stats||{}).reduce((sum,v) => sum + (v||0), 0);
}
/* 経験値は、これまでに実際に使ったステータスポイント（spentStatPoints）を絶対に下回らない
   （2026-08-23〜、教員の指示：「全プレイヤーに、自動的に不足分を補填する仕組みを」）。
   CAT_POOL_VERSIONによる問題解放率の強制リセットなど、将来また何らかの理由で
   rawKotonohaExpが一時的に下がる事態が起きても、既に振り分け済みのステータスポイントの
   裏付けが消えることはない（「レベルは上がるのに経験値・ステータスが増えない」不具合の
   根本対策。積み上げ方式＝st.unlockBonusEarned導入だけでは、導入タイミングによっては
   その時点で既に生じていた不足分までは救えなかったため、この床上げを追加した）。
   通常運用ではspentStatPoints<=rawKotonohaExpが常に成り立つ（稼いだ分しか配分できない
   ため）ので、この床は普段は何も変えず、rawKotonohaExpがそのまま使われる。 */
function totalEarnedStatPoints(st){
  return Math.min(KOTONOHA_XP_CAP, Math.max(Math.floor(rawKotonohaExp(st)), spentStatPoints(st)));
}
function unspentStatPoints(st){
  return Math.max(0, totalEarnedStatPoints(st) - spentStatPoints(st));
}
function loadStats(){
  try{
    const s = localStorage.getItem(STORE_KEY);
    if(s){
      const st = JSON.parse(s);
      if(st && st.cats && st.q && st.lv){
        CAT_KEYS.concat(["dokkai"]).forEach(k => {
          if(!st.cats[k]) st.cats[k] = {t:0,c:0};
          if(!st.lv[k]) st.lv[k] = 1;
        });
        if(!st.items) st.items = {};
        if(!st.usedTreasures) st.usedTreasures = {};
        if(!st.usedStoryRewards) st.usedStoryRewards = {};
        if(!st.bossPity) st.bossPity = {};
        if(!st.bossItemPity) st.bossItemPity = {};
        if(typeof st.bossTickets !== "number") st.bossTickets = 0;
        if(typeof st.totalLevelUps !== "number") st.totalLevelUps = 0;
        if(typeof st.bonusExp !== "number") st.bonusExp = 0;
        if(typeof st.hyakuninBonusExp !== "number") st.hyakuninBonusExp = 0;
        if(typeof st.specialMoveUnlocked !== "boolean") st.specialMoveUnlocked = false;
        if(typeof st.storyFaceUnlocked !== "boolean") st.storyFaceUnlocked = false;
        if(typeof st.kotonohaRebirthUnlocked !== "boolean") st.kotonohaRebirthUnlocked = false;
        if(st.kotonohaRebirth === undefined) st.kotonohaRebirth = null;
        /* 「聖輝」「冥淵」の卵アンロック（2026-08-01〜）導入前のセーブデータを補完する。
           既にどこかの転生で「成熟体」（KOTONOHA_MATURE_STAGE_IDX）まで見た(seenStage)ことが
           あるプレイヤーは、この機能導入前の達成として静かにアンロック済み扱いにする
           （再度「成熟体」まで育て直させることはしない。祝福メッセージも今さら出さない）。 */
        if(typeof st.kotonohaSeigakiMeienUnlocked !== "boolean"){
          st.kotonohaSeigakiMeienUnlocked = !!(st.kotonohaRebirth && (st.kotonohaRebirth.seenStage||0) >= KOTONOHA_MATURE_STAGE_IDX);
        }
        /* 進化演出（showKotonohaEvolveCutscene）の追加より前のセーブ（seenStageが無い）は、
           既に進んでいた分をさかのぼって演出しないよう、現在の段階をそのまま「見た」ことにする。 */
        if(st.kotonohaRebirth && typeof st.kotonohaRebirth.seenStage !== "number"){
          st.kotonohaRebirth.seenStage = kotonohaRebirthStageIndex(st);
        }
        delete st.statPoints; // 旧バージョンの保存値。今後は使わず、常に導出する
        if(!st.stats) st.stats = {hp:0, atk:0, def:0, luck:0};
        if(typeof st.stats.spd !== "number") st.stats.spd = 0;
        if(!st.diffLv) st.diffLv = {};
        /* 出題目標レベルが未設定の分野は、これまでの分野レベルから相当する値を初期値にする

        CAT_KEYS.forEach(k => {
          if(typeof st.diffLv[k] !== "number") st.diffLv[k] = targetLv(k, st.lv[k]||1);
        });
        if(!st.kanjiWrite) st.kanjiWrite = {totalOk:0, itemHist:{}, levelRecent:{}};
        if(!st.kanjiWrite.itemHist) st.kanjiWrite.itemHist = {};
        if(!st.kanjiWrite.levelRecent) st.kanjiWrite.levelRecent = {};
        if(typeof st.kanjiWrite.totalOk !== "number") st.kanjiWrite.totalOk = 0;
        if(!st.kanjiWriteElem) st.kanjiWriteElem = {totalOk:0, itemHist:{}, targetLv:1, recent:[]};
        if(!st.kanjiWriteElem.itemHist) st.kanjiWriteElem.itemHist = {};
        if(!Array.isArray(st.kanjiWriteElem.recent)) st.kanjiWriteElem.recent = [];
        if(typeof st.kanjiWriteElem.totalOk !== "number") st.kanjiWriteElem.totalOk = 0;
        if(typeof st.kanjiWriteElem.targetLv !== "number") st.kanjiWriteElem.targetLv = 1;
        if(!st.hyakunin) st.hyakunin = {totalOk:0, itemHist:{}, targetLv:1, recent:[]};
        if(!st.hyakunin.itemHist) st.hyakunin.itemHist = {};
        if(!Array.isArray(st.ktSolved)) st.ktSolved = [];
        if(!Array.isArray(st.hyakunin.recent)) st.hyakunin.recent = [];
        if(typeof st.hyakunin.totalOk !== "number") st.hyakunin.totalOk = 0;
        if(typeof st.hyakunin.targetLv !== "number") st.hyakunin.targetLv = 1;
        delete st.hyakunin.unlockedGroupCount; // 決まり字グループ方式（旧）の名残。8問グループ方式のst.groupUnlock.hyakuninに統合した
        delete st.hyakunin.poemStreak;
        delete st.hyakunin.groupProgress;
        /* 間隔反復レビュー導入前のセーブデータには3フィールドが無いので補完する（2026-07-29〜。
           2026-07-30〜、対象をst.qだけでなく百人一首・小学生の漢字を復習するモードのitemHistにも拡大） */
        [st.q, st.hyakunin.itemHist, st.kanjiWriteElem.itemHist].forEach(histMap => {
          Object.keys(histMap).forEach(k => {
            const rec = histMap[k];
            if(typeof rec.reviewStage !== "number") rec.reviewStage = 0;
            if(typeof rec.pendingReview !== "boolean") rec.pendingReview = false;
            if(rec.questionsUntilReview === undefined) rec.questionsUntilReview = null;
          });
        });
        if(!st.groupUnlock) st.groupUnlock = {};
        /* ジャンルの出題プール構成（lv割り当て・問題の追加削除）を大きく変えたときに、そのジャンルだけ
           問題解放率を強制的にグループ1（ほぼ0%）へ巻き戻すための、カテゴリ別バージョン管理
           （CAT_POOL_VERSION、百人一首のHYAKUNIN_POOL_VERSIONと同じ考え方。教員の指示、2026-08-04：
           「問題を挿入した場合には0%から再スタートする設計に」）。値を書いていないカテゴリは
           バージョン0として扱う。この管理自体を初めて導入したタイミング（st.catPoolVersion[cat]が
           まだ無い）では、それまで通り運用されてきたジャンル（CAT_POOL_VERSIONに値が無い＝0のまま）
           まで巻き込んでリセットしないよう、want>0（＝このタイミングで実際にプールを変えたジャンル）
           のときだけリセットする。
           2026-08-23〜：ここでリセットするのはst.groupUnlock（問題解放率のもと）だけで、
           st.unlockBonusEarned（解放お祝い経験値の積み上げ、下部のtotalUnlockCelebrationExp
           参照）には触れない。以前は解放お祝い経験値を毎回その場で計算していたため、この
           リセットだけで既に稼いだ経験値まで一緒に失われる不具合があった。積み上げ方式に
           変えた今は、このリセットをしても経験値は後退せず、もう一度解放し直せばそのぶん
           改めて加算される（教員の指示）。 */
        if(!st.catPoolVersion) st.catPoolVersion = {};
        GROUP_UNLOCK_CATS.forEach(cat => {
          const want = CAT_POOL_VERSION[cat] || 0;
          const had = st.catPoolVersion[cat];
          if(had === undefined){
            if(want > 0) st.groupUnlock[cat] = 1;
            st.catPoolVersion[cat] = want;
          }else if(had !== want){
            st.groupUnlock[cat] = 1;
            st.catPoolVersion[cat] = want;
          }
        });
        /* 8問グループの段階的アンロック導入（2026-08-01〜）：既存の正誤履歴(st.q)から初期の
           unlockedGroupCountを一回限り算出する（全員グループ1からやり直しにはしない）。
           GROUP_UNLOCK_CATSを今後広げたときも、st.groupUnlockにまだ無いジャンルだけが
           ここで新たに算出されるので、同じマイグレーション処理をそのまま使い回せる
           （上のCAT_POOL_VERSIONによるリセット対象になったジャンルは、groupUnlock[cat]が
           既に1という数値になっているため、ここではもう再算出されない）。 */
        GROUP_UNLOCK_CATS.forEach(cat => {
          if(typeof st.groupUnlock[cat] !== "number") st.groupUnlock[cat] = migrateInitialGroupUnlock(st, cat);
        });
        /* 百人一首は出題プールの生成方法（hyaPool）が20分野と異なるため、同じ判定ロジックを
           hyaGroups系として個別に実装しているが、マイグレーションの考え方は同じ（[[kokugo-drill-dx-workflow]]）。
           決まり字グループ方式（旧、2026-07-31〜）から8問グループ方式（2026-08-01〜）へ移行。 */
        /* 出題形式の追加・削除・並べ替え（HYAKUNIN_POOL_VERSION参照）でグループの中身が変わると、
           既存プレイヤーの解放済みグループ数をそのまま新しい並び順に適用した場合、意図しない
           内容が一気に解放されてしまう。バージョンが古いセーブは、下のmigrateInitialHyaGroupUnlock
           （itemHistの蓄積から初回導入時の解放状況を推定するための処理で、こちらには使わない）を
           経由させず、必ずグループ1（問題解放率ほぼ0%）へ強制的に巻き戻す。 */
        if(st.hyakunin.poolVersion !== HYAKUNIN_POOL_VERSION){
          st.groupUnlock.hyakunin = 1;
          st.hyakunin.poolVersion = HYAKUNIN_POOL_VERSION;
        }
        if(typeof st.groupUnlock.hyakunin !== "number") st.groupUnlock.hyakunin = migrateInitialHyaGroupUnlock(st);
        /* 解放お祝い経験値の「積み上げ方式」導入（2026-08-23〜、教員の指示）：それまでは
           毎回その場でcatUnlockedQuestionPct/hyaUnlockedQuestionPctから計算していたが、
           CAT_POOL_VERSIONによる問題解放率の強制リセットと組み合わさると、既に稼いだ分の
           経験値・ステータスポイントが一瞬で失われる不具合につながっていた（[[kokugo-drill-dx-workflow]]
           参照）。今後はcrossedUnlockMilestones判定時（record()/hyaRecord()参照）に一度だけ
           加算し、st.unlockBonusEarnedへ積み上げる。導入した瞬間に「今まで享受できていたはずの
           解放ボーナス」までゼロから始まってしまわないよう、まだ記録が無いプレイヤーは、
           この時点の解放率からその場で計算した値をそのまま初期値として引き継ぐ（この直後の
           時点なら、まだ今回導入分の巻き戻りは起きていないので後退にはならない。ただし
           CAT_POOL_VERSIONによる強制リセットが既にこのタイミングより前に行われた分＝
           2026-08-23の事故対応で影響した18ジャンルぶんは、この時点で既に低い解放率になって
           いるため、そのまま低い初期値になる＝もう一度解いて自然に埋め直す、教員の指示）。 */
        if(!st.unlockBonusEarned){
          st.unlockBonusEarned = {};
          GROUP_UNLOCK_CATS.forEach(cat => {
            st.unlockBonusEarned[cat] = unlockCelebrationExpForPct(catUnlockedQuestionPct(st, cat));
          });
          st.unlockBonusEarned.hyakunin = unlockCelebrationExpForPct(hyaUnlockedQuestionPct(st));
        }
        /* 一度限り是正（2026-08-23〜の床上げ追加の追加対策）：CAT_POOL_VERSIONリセット等で
           spentStatPointsがrawKotonohaExpを上回っている場合、差分を振り分け済みの最大ステータス項目
           から順に引いてspentStatPointsをrawKotonohaExpに揃える。これにより次のレベルアップから
           正常に新ポイントが得られるようになる。 */
        if(!st.statPointsGapFixed){
          st.statPointsGapFixed = true;
          let _gap = spentStatPoints(st) - Math.floor(rawKotonohaExp(st));
          if(_gap > 0 && st.stats){
            const _keys = ['hp','atk','def','spd','luck'];
            while(_gap > 0){
              const _top = _keys.reduce((a,b) => (st.stats[a]||0) >= (st.stats[b]||0) ? a : b);
              if((st.stats[_top]||0) <= 0) break;
              const _cut = Math.min(_gap, st.stats[_top]);
              st.stats[_top] -= _cut;
              _gap -= _cut;
            }
          }
        }
        /* デイリーログイン報酬（7日サイクル、2026-08-01〜）導入前のセーブデータには
           dailyLoginが無いので補完する。totalLoginDays等を過去にさかのぼって推定することはせず、
           素直に0から開始する（「今日初めて解答した」時点からカウントが始まる）。 */
        if(!st.dailyLogin) st.dailyLogin = {lastDate:null, cycleDay:0, totalLoginDays:0};
        if(st.pendingDailyLoginStamp === undefined) st.pendingDailyLoginStamp = null;
        if(!st.notLearnedCats) st.notLearnedCats = {};
        if(!st.eventBonusEarned) st.eventBonusEarned = {};
        if(!st.story) st.story = {chapter:"ch1", beatIdx:0, flags:{}, completedChapters:[], judgedRunCorrect:0, judgedRunTotal:0, judgedBest:{}, comboBest:{}};
        if(!st.story.flags) st.story.flags = {};
        if(!Array.isArray(st.story.completedChapters)) st.story.completedChapters = [];
        if(typeof st.story.beatIdx !== "number") st.story.beatIdx = 0;
        if(!st.story.chapter) st.story.chapter = "ch1";
        if(typeof st.story.judgedRunCorrect !== "number") st.story.judgedRunCorrect = 0;
        if(typeof st.story.judgedRunTotal !== "number") st.story.judgedRunTotal = 0;
        if(!st.story.judgedBest) st.story.judgedBest = {};
        if(!st.story.comboBest) st.story.comboBest = {};
        /* 章に選択肢問題(judgedChoice)を追加・削除して母数が変わった場合、既存プレイヤーの
           自己ベスト（古い母数のまま）が実態と食い違ったパーセンテージで表示され続けてしまう
           （例：1問だった章が2問になっても、記録はずっと「1/1・100%」のまま）。読み込むたびに
           STORY_CHAPTERSの現在の問題数と突き合わせ、食い違う章の自己ベストは破棄する
           （その章を再プレイすれば、今の問題数であらためて記録される）。 */
        Object.keys(st.story.judgedBest).forEach(chapterKey => {
          const chapter = STORY_CHAPTERS[chapterKey];
          const actualTotal = chapter ? chapter.beats.filter(b => b.type === "judgedChoice").length : 0;
          if(st.story.judgedBest[chapterKey].total !== actualTotal) delete st.story.judgedBest[chapterKey];
        });
        if(!Array.isArray(st.kotonohaSeenForms)) st.kotonohaSeenForms = [];
        if(st.kotonohaDisplayOverride === undefined) st.kotonohaDisplayOverride = null;
        /* 転生の系統選択機能（2026-08-03〜）のための移行。旧セーブには「これまで転生した系統」の
           履歴が無いため、今まさに転生中の系統だけは「出会ったことがある」ものとして遡って
           記録する（それ以前に別の系統だったことがあっても、そこまでは追跡できないため対象外）。 */
        if(!Array.isArray(st.kotonohaRebirthLinesSeen)) st.kotonohaRebirthLinesSeen = [];
        if(st.kotonohaRebirth && !st.kotonohaRebirthLinesSeen.includes(st.kotonohaRebirth.line)){
          st.kotonohaRebirthLinesSeen.push(st.kotonohaRebirth.line);
        }
        /* 旧バージョンで「３領域以上バランス型」が固定されていた場合、今の見た目をそのまま引き継ぐ
           （次に進化するタイミングから、新しいランダム抽選のしくみに切りかわる）。 */
        if(!st.kotonohaOtherRoll && KOTONOHA_OTHER_TYPES.includes(st.kotonohaBranch)){
          st.kotonohaOtherRoll = {stageIdx: kotonohaStageIndex(kotonohaTotalXP(st)), type: st.kotonohaBranch};
        }
        if(st.kotonohaOtherRoll === undefined) st.kotonohaOtherRoll = null;
        delete st.kotonohaBranch;
        return st;
      }
    }
  }catch(e){}
  return memStats || emptyStats();
}
function saveStats(st){
  st.saveFormatVer = SAVE_FORMAT_VERSION;
  memStats = st;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(st)); }catch(e){}
}
function qKey(cat, qText){
  let h = 5381;
  for(let i=0;i<qText.length;i++){ h = ((h<<5)+h+qText.charCodeAt(i))|0; }
  return cat + "|" + (h>>>0).toString(36);
}
/* 直近何問ぶんの正誤で正答率を見るか、正答率がどこを下回るとレベルアップを止めるか。
   4択を適当に選ぶと正答率は理論上25%になるが、直近10問など短い区間だとブレが大きく、
   たまたま閾値を超えて素通りしてしまうことが多かった。30問でまとめて見ることでブレを抑えている。
   30問・30%にすると、乱択（25%）は約56%の確率でレベルアップが止まる一方、
   まじめに取り組んでいるプレイヤー（正答率40%以上）にはほとんど影響しないことを確認している。 */
const RECENT_ACC_WINDOW = 30;
const RECENT_ACC_THRESHOLD = 0.3;
/* 「素早く適当に答える」検知（2026-07-15〜）。RECENT_ACC_WINDOW(30問)は母数が大きい分ブレには強いが、
   正答率35〜40%程度の「時々当たる適当な答え方」はすり抜けてしまう。正答率だけでは「じっくり考えて
   間違えた」生徒と「考えずに答えた」生徒を区別できないため、もう一つの手がかりとして
   「問題が表示されてから答えるまでの時間」を見る。直近4問と少ない母数にする代わりに、
   FAST_ANSWER_MS未満で答えたときだけ判定対象にすることで、まじめに考えて偶然間違いが続いた
   ケースを誤検知しにくくしている（じっくり考える生徒は、そもそもこんなに速く答えない）。 */
const FAST_ANSWER_MS = 2000;
const FAST_ANSWER_WINDOW = 4;
const FAST_ANSWER_ACC_THRESHOLD = 0.3;
/* 正誤を記録。正解ならその分野のレベル+1。ただし直近の正答率が極端に低いとき（適当に答えている
   おそれがあるとき）、または直近4問を2秒未満で答えていて正答率も低いとき（考えずに素早く
   答えているおそれがあるとき）はレベルアップを止める。elapsedMsは問題表示から解答までの
   経過ミリ秒（呼び出し元が計測。渡されなければ時間による判定はスキップされる）。
   opts.skipRecentAcc=trueを渡すと、st.recentCorrect[cat]・st.recentCorrectAll（ボス遭遇率・
   宝具ドロップ判定・成績画面の「直近30問」表示に使う、分野横断/分野別の直近正答率）を一切
   更新しない（2026-07-18〜、野球ミニゲーム用。制限時間が最短0.5秒まで縮む特殊なペース配分の
   ミニゲームなので、その結果を「じっくり取り組む通常のクイズ」の正答率に混ぜたくない、という
   教員の指示。この場合lowAccuracy/fastGuessの判定も行わず、正解なら無条件でレベルアップする）。
   {lvup, evolved, lv, gotTicket, lowAccuracy, fastGuess} を返す */
function record(cat, item, correct, elapsedMs, opts){
  const trackRecentAcc = !(opts && opts.skipRecentAcc);
  const st = loadStats();
  maybeGrantDailyLogin(st);
  st.cats[cat].t++; if(correct) st.cats[cat].c++;
  const key = qKey(cat, item.q);
  if(!st.q[key]) st.q[key] = {t:0, c:0, k:0, cat, q:item.q};
  st.q[key].t++; if(correct) st.q[key].c++;
  st.q[key].k = correct ? (st.q[key].k||0)+1 : 0;   // 連続正解数
  if(MAX_LV[cat]){
    if(!st.diffLv) st.diffLv = {};
    const maxLv = MAX_LV[cat];
    const curDiff = typeof st.diffLv[cat] === "number" ? st.diffLv[cat] : 1;
    st.diffLv[cat] = correct
      ? Math.min(maxLv, curDiff + DIFF_LV_STEP)
      : Math.max(1, curDiff - DIFF_LV_STEP);
    /* 間隔反復レビューの更新は、出題目標レベル(diffLv)を持つ分野（＝適応的難度調整の対象）でのみ行う。
       野球ミニゲーム等のskipRecentAcc指定時（trackRecentAcc===false）は、通常のクイズの正答率に
       混ぜない既存方針にならい、レビュー段階も更新しない。 */
    if(trackRecentAcc) ReviewSystem.onAnswer(st.q, key, correct, item.lv, curDiff);
  }
  let lowAccuracy = false, fastGuess = false;
  if(trackRecentAcc){
    if(!st.recentCorrect) st.recentCorrect = {};
    const recent = (st.recentCorrect[cat] || []).slice();
    recent.push(correct ? 1 : 0);
    while(recent.length > RECENT_ACC_WINDOW) recent.shift();
    st.recentCorrect[cat] = recent;
    /* 分野をまたいだ「直近30回」の正答率（ボス戦のランダム遭遇の判定に使う、2026-07-16〜）。
       ボス戦自体はrecord()を呼ばないので、この配列にボス戦の結果が混ざることはない
       （野球ミニゲームはrecord()を呼ぶが、skipRecentAcc:trueを渡すのでここには混ざらない）。 */
    if(!Array.isArray(st.recentCorrectAll)) st.recentCorrectAll = [];
    const recentAll = st.recentCorrectAll.slice();
    recentAll.push(correct ? 1 : 0);
    while(recentAll.length > RECENT_ACC_WINDOW) recentAll.shift();
    st.recentCorrectAll = recentAll;
    const recentAcc = recent.reduce((a,b)=>a+b, 0) / recent.length;
    lowAccuracy = recent.length >= RECENT_ACC_WINDOW && recentAcc < RECENT_ACC_THRESHOLD;
    const recentFast = recent.slice(-FAST_ANSWER_WINDOW);
    const recentFastAcc = recentFast.length ? recentFast.reduce((a,b)=>a+b, 0) / recentFast.length : 1;
    fastGuess = typeof elapsedMs === "number" && elapsedMs < FAST_ANSWER_MS
      && recentFast.length >= FAST_ANSWER_WINDOW && recentFastAcc < FAST_ANSWER_ACC_THRESHOLD;
  }
  /* st.recentCorrect[cat]・fastGuessが確定した直後に呼ぶ（高速解放モードの判定に両方使うため、
     st.q更新の直後だった旧位置から移動した、2026-08-02〜） */
  const pctBeforeUnlock = catUnlockedQuestionPct(st, cat);
  const groupJustUnlocked = checkGroupUnlock(st, cat, item, correct, fastGuess);
  /* 今回新しく跨いだマイルストーン（お祝い演出用、かつ2026-08-23〜は経験値の加算元でもある）。 */
  const celebrateMilestones = groupJustUnlocked
    ? crossedUnlockMilestones(pctBeforeUnlock, catUnlockedQuestionPct(st, cat))
    : [];
  /* 解放お祝い経験値は「毎回その場で解放率から計算」ではなく、今回のグループ解禁で新しく
     跨いだマイルストーンぶんだけを一度きり加算して積み上げる方式にした（2026-08-23〜、教員の
     指示）。CAT_POOL_VERSIONによる問題解放率の強制リセット（loadStats()参照）が起きても、
     ここに積み上げた分は減らない。かつリセット後にもう一度同じマイルストーンへ到達すれば
     crossedUnlockMilestonesがまた「新しく跨いだ」と判定するため、そのぶんもう一度加算される
     （教員の指示：「早く解放するほど、あとで巻き戻りがあってもまた確認できる」ので二重加算を
     あえて許容する。通常運用ではpctは単調増加するため同じマイルストーンを二重に跨ぐことはない）。 */
  if(celebrateMilestones.length){
    if(!st.unlockBonusEarned) st.unlockBonusEarned = {};
    const gain = celebrateMilestones.reduce((s,m) => s + m.exp, 0);
    st.unlockBonusEarned[cat] = (st.unlockBonusEarned[cat]||0) + gain;
  }

  let lvup = false, evolved = null, gotTicket = false;
  if(correct && !lowAccuracy && !fastGuess && st.lv[cat] < MAX_CAT_LV){
    const before = titleOf(st.lv[cat]);
    st.lv[cat]++;
    lvup = true;
    st.totalLevelUps = (st.totalLevelUps||0) + 1;
    if(st.totalLevelUps % 10 === 0){
      st.bossTickets = (st.bossTickets||0) + 1;
      gotTicket = true;
    }
    const after = titleOf(st.lv[cat]);
    if(after !== before) evolved = after;
  }
  saveStats(st);
  return {lvup, evolved, lv:st.lv[cat], gotTicket, lowAccuracy: correct && lowAccuracy, fastGuess: correct && fastGuess, groupJustUnlocked, celebrateMilestones};
}
function qStat(st, cat, item){ return st.q[qKey(cat, item.q)] || null; }

/* ================= 間隔反復レビュー（difficultyとは独立） =================
   分野ごとの「出題目標レベル」による難度調整（diffLv系）とは完全に別物。こちらは問題1問ごとに
   「習熟度（reviewStage）」を管理し、正解が続けば「次に出すまでの残り問題数」を段階的に延ばし、
   不正解なら1段階だけ戻す。呼び出し側が用意した「問題ごとの履歴オブジェクト」（st.q[qKey(cat,q)]・
   st.hyakunin.itemHist[id]・st.kanjiWriteElem.itemHist[id]など、{t,c,...}を持つ任意のオブジェクト）に
   3つのフィールドを追加する形で持たせる：
     reviewStage         : 0（対象外）〜REVIEW_STAGE_MASTERED(6=定着済み)
     pendingReview        : 「今の実力より難しい問題」に初めて間違えたときだけ立つ保留フラグ
     questionsUntilReview : 次のレビューまでの残り問題数（null＝レビュー予定なし）
   出題目標レベル(diffLv)より難しい問題に初回で間違えた場合は、まだ実力不足だっただけの可能性が
   高いため、その場ではレビュー登録せずpendingReviewだけ立てる。次に遭遇したときに再び間違えたら
   レビュー段階1で登録し、正解できればpendingReviewを解除するだけで終わる（教員の指示、2026-07-29）。
   histMap（履歴を{key: rec}の形で持つオブジェクト）とkeyを渡すジェネリックな形にしているのは、
   「正解で少し難しく・不正解で少し簡単に」という同じ適応的難度調整のパターンが、通常の20分野クイズ
   （st.q）だけでなく百人一首クイズ（st.hyakunin.itemHist）・小学生の漢字を復習するモード
   （st.kanjiWriteElem.itemHist）にも独立に実装されており、この3つ全てに同じレビューの仕組みを
   適用する必要があったため（2026-07-30、教員から「百人一首で復習が来ない」との指摘を受けて対応）。
   漢字の書き取り（高校入試向け、kanjiWrite）はレベルを生徒が手動選択する方式で自動難度調整
   （diffLv相当の仕組み）自体が存在しないため、この対象には含めない。 */
const ReviewSystem = {
  /* 1問答えるたびに呼ぶ。histMap[key]（呼び出し側で作成済みの履歴オブジェクト）のレビュー状態を
     更新し、それ以外の「レビュー待ち」の項目は残り問題数を1減らす。 */
  onAnswer(histMap, key, correct, itemLv, diffLvAtAnswer){
    const rec = histMap[key];
    if(typeof rec.reviewStage !== "number") rec.reviewStage = 0;
    if(typeof rec.pendingReview !== "boolean") rec.pendingReview = false;
    if(rec.questionsUntilReview === undefined) rec.questionsUntilReview = null;

    if(correct){
      if(rec.pendingReview){
        rec.pendingReview = false; // 格上問題に2回目で正解できた → 保留解除のみ、レビュー登録なし
      }else if(rec.reviewStage > 0 && rec.reviewStage < REVIEW_STAGE_MASTERED){
        rec.reviewStage++;
        rec.questionsUntilReview = rec.reviewStage < REVIEW_STAGE_MASTERED ? REVIEW_INTERVALS[rec.reviewStage] : null;
      }
      // reviewStage===0 && !pendingReview（初回正解）は何もしない。定着済み(6)もそのまま。
    }else{
      if(rec.reviewStage > 0){
        rec.reviewStage = Math.max(1, rec.reviewStage - 1); // 完全リセットではなく1段階だけ戻す
        rec.questionsUntilReview = REVIEW_INTERVALS[rec.reviewStage];
      }else if(rec.pendingReview){
        rec.pendingReview = false;
        rec.reviewStage = 1;
        rec.questionsUntilReview = REVIEW_INTERVALS[1];
      }else if(itemLv <= diffLvAtAnswer){
        rec.reviewStage = 1;
        rec.questionsUntilReview = REVIEW_INTERVALS[1];
      }else{
        rec.pendingReview = true; // 今の実力より難しい問題の初回不正解 → まだ登録しない
      }
    }
    this._tickOthers(histMap, key);
  },
  /* 今回答えた項目(exceptKey)以外で、レビュー待ち（1〜5段階かつ残り問題数>0）のものを1問分進める */
  _tickOthers(histMap, exceptKey){
    Object.keys(histMap).forEach(k => {
      if(k === exceptKey) return;
      const rec = histMap[k];
      if(rec.reviewStage > 0 && rec.reviewStage < REVIEW_STAGE_MASTERED
        && typeof rec.questionsUntilReview === "number" && rec.questionsUntilReview > 0){
        rec.questionsUntilReview--;
      }
    });
  },
  /* レビュー期限が到来した（questionsUntilReview<=0）項目のうち、最も待たされたキーを返す
     （なければnull）。excludeKeyは直前に出した項目のキー（連続で同じ問題を出さないため）。
     百人一首・小学生の漢字を復習するモードのように、項目がidだけで一意に決まる場合はこちらを使う。 */
  getDueKey(histMap, excludeKey){
    let bestKey = null, bestRec = null;
    Object.keys(histMap).forEach(k => {
      if(k === excludeKey) return;
      const rec = histMap[k];
      if(!rec || rec.reviewStage <= 0 || rec.reviewStage >= REVIEW_STAGE_MASTERED) return;
      if(typeof rec.questionsUntilReview !== "number" || rec.questionsUntilReview > 0) return;
      if(!bestRec || rec.questionsUntilReview < bestRec.questionsUntilReview){ bestRec = rec; bestKey = k; }
    });
    return bestKey;
  },
  /* 通常の20分野クイズ（st.q、キーはqKey(cat,q)）専用の薄いラッパー。excludeQには直前の問題文を
     渡す（キーではなく問題文で比較するのは、既存の`selectOne`の「直前と同じ問題文は除く」という
     挙動に合わせたもの）。restrictCatを渡すと、そのジャンルの項目だけを対象にする（特定ジャンルを
     選んでプレイ中は、他ジャンルの復習が紛れ込まないようにするため。教員の指示、2026-08-02）。 */
  getDueItem(st, excludeQ, restrictCat){
    let best = null;
    Object.keys(st.q).forEach(k => {
      const rec = st.q[k];
      if(restrictCat && rec.cat !== restrictCat) return;
      if(rec.reviewStage <= 0 || rec.reviewStage >= REVIEW_STAGE_MASTERED) return;
      if(typeof rec.questionsUntilReview !== "number" || rec.questionsUntilReview > 0) return;
      if(excludeQ && rec.q === excludeQ) return;
      if(!best || rec.questionsUntilReview < best.rec.questionsUntilReview) best = {rec, cat:rec.cat};
    });
    if(!best) return null;
    const cats = CATS[best.cat];
    const item = cats && cats.items.find(it => it.q === best.rec.q);
    return item ? {cat:best.cat, item} : null; // 問題データ自体が更新で消えていた場合はスキップ
  }
};

/* ================= 出題の重みづけ =================
   [履歴] 正解するたび×0.75で出づらく、間違えるたび×1.5で出やすく
          （0.05〜8倍。ゼロにはならない）
   [難度] 出題目標レベル（st.diffLv[cat]）に近い問題ほど出やすい。
          正解するたび目標レベルが少し上がり、間違えるたび少し下がる（record()内、DIFF_LV_STEP刻み）ので、
          正解が続けばやや難しい問題が、間違いが続けばやや簡単な問題が出やすくなっていく。 */
function historyWeight(st, cat, item){
  const s = qStat(st, cat, item);
  if(!s || s.t === 0) return 1.2;
  const wrong = s.t - s.c;
  const w = Math.pow(0.75, s.c) * Math.pow(1.5, wrong);
  return Math.max(0.05, Math.min(8, w));
}
/* 苦手復習専用の重みづけ：不正解率（不正解数÷回答数）が高いほど出やすくする */
function reviewWeight(st, cat, item){
  const s = qStat(st, cat, item);
  if(!s || s.t === 0) return 1;
  const wrongRate = (s.t - s.c) / s.t;   // 0〜1
  return 0.2 + wrongRate * wrongRate * 12;   // 不正解率が高いほど、急激に出やすくなる
}
/* 出題目標レベルの初期値（分野レベルから換算）。新しい難度調整の仕組み導入前からの
   プレイヤーの出題目標レベルに、最初の値を与えるためだけに使う（loadStatsのマイグレーション参照）。 */
function targetLv(cat, catLv){
  return 1 + Math.min(MAX_LV[cat] - 1, (catLv - 1) / LV_PER_STEP);
}
function difficultyWeight(cat, item, diffLv){
  return Math.exp(-1.2 * Math.abs(item.lv - diffLv));
}
function pickOne(pool, weights){
  let total = 0;
  for(const w of weights) total += w;
  let r = Math.random() * total;
  for(let i=0;i<pool.length;i++){
    r -= weights[i];
    if(r <= 0) return pool[i];
  }
  return pool[pool.length-1];
}
const CONFIRM_CHECK_RATE = 0.1; // 目標レベルが上がりきっても、他のレベルの理解が抜け落ちていないか、ときどき確認するための確率
/* 分野から1問選ぶ（直前の問題はさける）。
   CONFIRM_CHECK_RATEの確率で、今の目標レベルによる重みづけをやめて、その分野の全問題から
   レベルに関係なく1問ごとに均等に出題する（「確認チェック」）。目標レベルが上がりきったプレイヤーが、
   簡単な問題や中くらいの問題をずっと出題されないまま、そこでの理解の抜けに気づけない、という状態を
   防ぐため。（historyWeightによる「すでによく正解している問題は出にくい」という重みづけだけは、
   確認チェックでも生かしておく。）正解・不正解の結果は通常どおり目標レベルに反映されるので、この
   確認チェックで間違えれば目標レベルもきちんと下がる。 */
function selectOne(cat, lastQ){
  const st = loadStats();
  let pool = fastUnlockEligible(st, cat) ? (activeGroupPool(st, cat) || groupUnlockedPool(st, cat)) : groupUnlockedPool(st, cat);
  if(pool.length > 1 && lastQ) pool = pool.filter(it => it.q !== lastQ);
  const isConfirmCheck = Math.random() < CONFIRM_CHECK_RATE;
  const diffLv = typeof st.diffLv[cat] === "number" ? st.diffLv[cat] : 1;
  const weights = pool.map(it => historyWeight(st, cat, it) * (isConfirmCheck ? 1 : difficultyWeight(cat, it, diffLv)));
  return pickOne(pool, weights);
}
function weakItems(){
  const st = loadStats();
  const list = [];
  CAT_KEYS.forEach(cat=>{
    CATS[cat].items.forEach(it=>{
      const s = qStat(st, cat, it);
      /* 一度でも間違えた問題のうち、まだ直近の解答で正解できていないもの
         （2026-07-15〜：以前は2回連続正解が必要だったが、1回正解した時点で
         苦手リストから外れるように変更） */
      if(s && s.t > 0 && s.c < s.t && (s.k||0) < 1) list.push({cat, it});
    });
  });
  return list;
}

/* ================= 共通 ================= */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
/* 問題文中の《…》を、太字＋下線の強調表示に変換する（表現技法などで、該当箇所を示すのに使う）。
   《》を含まない通常の問題文は、esc(q)と同じ結果になる（安全に共通で使える）。 */
function markQuestionHtml(q){
  return String(q).split(/(《[^》]*》)/).map(part => {
    const m = part.match(/^《([^》]*)》$/);
    if(m) return `<mark class="tech-mark">${esc(m[1])}</mark>`;
    return esc(part);
  }).join("");
}
function shuffledOrder(n){
  const a = [...Array(n).keys()];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
/* 記述式の答え合わせ用：カタカナ→ひらがな、空白除去 */
function normalizeAns(s){
  return String(s)
    .replace(/[\s　]/g, "")
    .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
}
function catBadge(cat){
  const st = loadStats();
  const lv = st.lv[cat], t = titleOf(lv);
  return `${t.icon} ${esc(t.name)}　Lv.${lv}`;
}

/* 選択問題を、数字キー(選んで反転表示)＋Enter(確定)でも回答できるようにする仕組み。
   choiceKeyCount 個のボタンが今の画面にそのまま揃っているときだけ有効。
   途中で画面が変わったりすでに答え終わっていたら自動的に何もしなくなる。 */
let activeChoiceKeyHandler = null;  // (displayPos) => void
let choiceKeySelected = null;
let choiceKeyCount = 0;
function setupChoiceKeys(handler, count){
  activeChoiceKeyHandler = handler;
  choiceKeySelected = null;
  choiceKeyCount = count;
}
function clearChoiceKeys(){
  activeChoiceKeyHandler = null;
  choiceKeySelected = null;
  choiceKeyCount = 0;
}
function selectChoiceVisual(displayPos){
  choiceKeySelected = displayPos;
  screen.querySelectorAll(".choice").forEach((b,pos)=>{
    b.classList.toggle("selected", pos === displayPos);
  });
}
/* 要素が実際に画面上に見えているか（自分自身にstyle.display:noneが無くても、祖先要素が
   display:noneならoffsetParentがnullになる、という標準的な判定方法。祖先のdisplay:noneを
   自前で辿らずに済む）。 */
function isVisibleEl(el){
  return !!el && el.offsetParent !== null;
}
/* ストーリーモードで、問題に答えたあとなどに出る「つぎへ」「つづける」的な、その場面の
   唯一の進行ボタンをEnterキーで押せるようにする（2026-07-19、教員の指示）。対象のボタンには
   story-advance-btnクラスを付けてあるだけで、beatの種類ごとの個別対応は不要。 */
function storyHandleEnterAdvance(e){
  if(e.key !== "Enter") return;
  const btn = document.querySelector(".story-advance-btn");
  if(btn && isVisibleEl(btn) && !btn.disabled){
    e.preventDefault();
    btn.click();
  }
}
function handleChoiceKey(e){
  if(bossPromptActive){
    if(e.key === "ArrowRight"){ e.preventDefault(); moveBossPromptSelection("yes"); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); moveBossPromptSelection("no"); }
    else if(e.key === "Enter"){ e.preventDefault(); resolveBossPrompt(bossPromptSelection); }
    return;
  }
  if(!activeChoiceKeyHandler){
    storyHandleEnterAdvance(e);
    return;
  }
  const btns = screen.querySelectorAll(".choice");
  if(btns.length !== choiceKeyCount || (btns[0] && btns[0].disabled)){
    clearChoiceKeys();
    storyHandleEnterAdvance(e);
    return;
  }
  if(e.key >= "1" && e.key <= "9"){
    const pos = Number(e.key) - 1;
    if(pos < choiceKeyCount){
      e.preventDefault();
      selectChoiceVisual(pos);
    }
  }else if(e.key === "Enter" && choiceKeySelected !== null){
    e.preventDefault();
    const handler = activeChoiceKeyHandler, pos = choiceKeySelected;
    clearChoiceKeys();
    handler(pos);
  }
}
document.addEventListener("keydown", handleChoiceKey);
/* ストーリーモード以外の全ての出題画面（通常クイズ・読解・漢字の書き取り系・二人対戦・ボス戦）で、
   「次へ」「つづける」的なボタン（tap-advance-btnクラス）が表示されているときは、画面の
   どこをタップしても次へ進めるようにする（2026-07-19、教員の指示）。ボタン・リンク・入力欄
   （「ホームへ」「今日はここまで」等の、進行以外の操作を持つものを含む）を直接タップした
   場合は、そちらの本来の動作をそのまま優先する（このリスナーでは何もしない）。 */
document.addEventListener("click", function(e){
  const btn = document.querySelector(".tap-advance-btn");
  if(!btn || !isVisibleEl(btn) || btn.disabled) return;
  if(e.target.closest("button, a, input, select, textarea, label")) return;
  btn.click();
});

/* ================= ことのは（経験値キャラクター） =================
   経験値 = 全領域（知識分野）のレベル合計。合計の伸びに応じて段階的に進化する
   （レベルと称号の関係と同じ考え方）。
   進化の「見た目の系統」は、領域ごとの偏り方によって4通りに分岐する：
     1. 一領域特化型：最も伸びている1領域だけで経験値の80%以上を占める
     2. 二領域特化型：上位2領域の合計で経験値の70%以上を占める
     3. ３領域以上バランス型：上記にも下記にもあてはまらない、ゆるやかな偏り
     4. 全領域バランス型：すべての領域が平均レベルの±20%以内におさまっている
   1は不健康、2はそれより元気、3はさらに元気、4は伝説級の見た目にする。 */
/* 分野ごとの「称号みちのり」（Lv1,10,30,60,100,150,210,280,360,450,550,660,780,900）と
   同じ間隔パターンを流用し、経験値1000で旧・最終形態（14段階目）に到達するようにする。
   そこから経験値200ごとに5段階（15〜19段階目）を追加し（2026-07-13）、
   さらに経験値300ごとに11段階（20〜30段階目）を追加してある（2026-07-15、30段階目が新しい最終形態）。
   2026-07-17、経験値10000到達までの31〜37段階目を追加。1段階に必要な経験値の間隔を
   350→400→500→600→750→900→1200と段階ごとに広げてあり、後半ほど次の進化までが遠くなる
   （37段階目＝経験値10000ちょうどが当時の最終形態）。
   2026-08-08、KOTONOHA_XP_CAP（20000）まで称号を伸ばすため38〜43段階目を追加。間隔は
   1200からさらに1400→1500→1600→1700→1800→2000と広げ続け、43段階目＝経験値20000ちょうど
   （＝ことのはの経験値の上限そのもの）が新しい最終形態になる。 */
const KOTONOHA_STAGE_XP = [0, 10, 30, 60, 100, 150, 210, 280, 360, 450, 550, 660, 780, 900, 1000,

const KOTONOHA_TYPE_LABEL = {
  1:"一領域特化型", 2:"二領域特化型", 4:"全領域バランス型",
  3:"３領域以上バランス型（のびのび系）", 5:"３領域以上バランス型（ほのお系）", 6:"３領域以上バランス型（うみかぜ系）",

};
/* 「３領域以上バランス型」に分類される場合、6系統（のびのび・ほのお・うみかぜ・ほしぞら・おとの・はなぞの）
   から完全ランダムに1つを選ぶ。一領域特化・二領域特化・全領域バランスの条件を満たすときだけ
   特定の系統（1・2・4）が確定し、それ以外（＝「３領域以上バランス型」）は進化するたびに毎回抽選し直す
   （同じ段階の間は再抽選しないよう、直前に抽選した「段階」を記録しておく）。 */
const KOTONOHA_OTHER_TYPES = [3, 5, 6, 7, 8, 9];
/* 「聖輝」（8＝おとの系）「冥淵」（7＝ほしぞら系）は初期状態では抽選対象外（残り4種のみ）。
   いずれかの転生先が「成熟体」に到達したことがある（st.kotonohaSeigakiMeienUnlocked）とき
   初めて、他の4系統と同じ抽選プールに加わる（教員の指示、2026-08-01〜）。KOTONOHA_OTHER_TYPES
   自体はカテゴリ判定・キャッシュ済みロールの正当性チェックに今までどおり使うため変更しない。 */
const KOTONOHA_LOCKED_OTHER_TYPES = [7, 8];
function kotonohaOtherTypePool(st){
  return st.kotonohaSeigakiMeienUnlocked
    ? KOTONOHA_OTHER_TYPES
    : KOTONOHA_OTHER_TYPES.filter(t => !KOTONOHA_LOCKED_OTHER_TYPES.includes(t));
}
function kotonohaTotalXP(st){
  /* 生の計算式（rawKotonohaExp、上部のtotalEarnedStatPoints周辺参照）はステータスポイント側と
     完全に共通。1領域のレベルが1000を超えた分は0.2ptに逓減する（2026-07-15〜。従来はここだけ
     逓減なしの生レベル合計だったため、1領域だけをlv1000超まで伸ばすとことのはの経験値だけ
     青天井で伸びてしまう不整合があった）。st.lvから毎回その場で計算し直すので、旧セーブを
     引き継いだ場合も自動的に反映される。KOTONOHA_XP_CAP（20000、2026-07-22〜）で、これ以上は
     増えないようクランプする。
     2026-08-23〜：totalEarnedStatPointsと同じく、spentStatPoints（実際に使ったステータス
     ポイント）を下回らない床上げも共通で適用する（教員の指示）。これにより「ことのはの経験値」
     表示と「割りふれるステータスポイント」の計算が常に完全に一致し続ける。 */
  return Math.min(KOTONOHA_XP_CAP, Math.max(Math.floor(rawKotonohaExp(st)), spentStatPoints(st)));
}
function kotonohaOtherType(st, stageIdx){
  const roll = st.kotonohaOtherRoll;
  if(roll && roll.stageIdx === stageIdx && KOTONOHA_OTHER_TYPES.includes(roll.type)){
    return roll.type;
  }
  const pool = kotonohaOtherTypePool(st);
  const type = pool[Math.floor(Math.random() * pool.length)];
  st.kotonohaOtherRoll = {stageIdx, type};
  saveStats(st);
  return type;
}
/* CAT_KEYSの分野別レベル分布だけを見た、副作用のない純粋なカテゴリ判定
   （1=一領域特化 / 2=二領域特化 / 4=全領域バランス / "other"=３領域以上バランス型）。
   「other」の中のどの系統か（乱数を消費する）はkotonohaType/kotonohaOtherTypeの責務のまま。 */
function kotonohaBaseCategory(st){
  const lvs = CAT_KEYS.map(k => st.lv[k]||1);

   ここでは進化演出を二重に出さない。

   という訂正指示を受け、元の「初回無料・2回目以降だけ種を消費」に戻した。種の消費判定・処理は

/* chosenLine：プレイヤーが自分で選んだ系統（kotonohaCanChooseRebirthLineがtrueのときだけ、

   省略時（story演出の初回転生など）は今までどおりkotonohaPickRebirthLineのランダム抽選。 */
function kotonohaDoRebirth(st, chosenLine){
  let line = null;
  if(chosenLine){
    const eligible = kotonohaEligibleRebirthLines(st);
    const seen = st.kotonohaRebirthLinesSeen || [];
    if(eligible.includes(chosenLine) && seen.includes(chosenLine)) line = chosenLine;
  }
  if(!line) line = kotonohaPickRebirthLine(st);
  if(!line) return false;
  if(!Array.isArray(st.kotonohaRebirthLinesSeen)) st.kotonohaRebirthLinesSeen = [];
  if(!st.kotonohaRebirthLinesSeen.includes(line)) st.kotonohaRebirthLinesSeen.push(line);

/* 転生の瞬間だけの使い切りキラキラ粒子（12個、位置・速さ・大きさをランダムに散らす）。 */
function kotonohaRebirthSparkleHtml(){

/* ================= 系統別・必殺技バリエーション =================

   小さく、伝説級（6）に向けて段階的に育っていく（t = (段階-2)/4、範囲0〜1でクランプ）。
   経験値・宝具・ステータス割りふりには一切影響させず、ボス戦の必殺技発動処理

/* 系統別必殺技が使える段階まで育っているか（転生済み＆少年体以上）。ボタンを出すかどうかの

/* stageIdxの時点での技名（少年体未満はnull＝まだ使えない）。線形にKOTONOHA_LINE_MOVE_MIN_STAGE

  const def = KOTONOHA_LINE_MOVES[lineKey];
  if(!def || !def.names || stageIdx < KOTONOHA_LINE_MOVE_MIN_STAGE) return null;
  const i = Math.max(0, Math.min(def.names.length-1, stageIdx - KOTONOHA_LINE_MOVE_MIN_STAGE));

/* 今のボス戦で実際に使う必殺技。教員の指示（2026-07-31〜）で、系統別必殺技と既存の言霊一閃

   見て判定する（＝押す前は常にnull＝言霊一閃側にフォールバックする）。 */
function kotonohaActiveLineMove(st){
  if(!bossBattle || !bossBattle.kotonohaFinisherUseLine) return null;
  if(!st.kotonohaRebirth) return null;
  const stageIdx = kotonohaRebirthStageIndex(st);
  if(stageIdx < KOTONOHA_LINE_MOVE_MIN_STAGE) return null;
  let lineKey = st.kotonohaRebirth.line;
  if(lineKey === "shigen"){
    /* 始原龍は専用の技を持たず、bossUseFinisherで発動のたびに抽選した6系統のどれかを
       そのまま借りる。まだ抽選していない（発動直後、announce前など）ときはnullを返す。 */
    if(!bossBattle.kotonohaShigenMoveLine) return null;
    lineKey = bossBattle.kotonohaShigenMoveLine;
  }
  const def = KOTONOHA_LINE_MOVES[lineKey];
  if(!def) return null;
  return {def, t: kotonohaLineMoveT(stageIdx), name: kotonohaLineMoveNameForStage(lineKey, stageIdx)};
}

  const lm = kotonohaActiveLineMove(st);

  return FINISHER_GAUGE_MAX;
}

/* ================= ボス戦ステータス（分野レベルアップでたまるポイントを割りふる） =================
   ボス戦だけに効果があるステータス。1ポイントごとの効果量は STAT_*_PER_POINT を参照。 */
function showStatusAllocation(){
  const st = loadStats();
  const s = st.stats;
  const pts = unspentStatPoints(st);
  /* たまるステータスポイントの総量は「ことのは」の経験値（kotonohaTotalXP、catExpPointsの
     逓減つき合計）にほぼ比例して大きくなるため、+1/+10だけだと配分に手間がかかる。
     2026-07-18〜、教員の指示で「いずれかの分野がlv1000超」ではなく「ことのはの経験値が
     1000を超えたら」という判定に変更した（1分野だけ極端に伸ばした場合ではなく、全分野の
     育成状況を反映するkotonohaTotalXPを基準にする方が実態に合っているため）。 */
  const hasHighXP = kotonohaTotalXP(st) > 1000;
  const rows = [
    {key:"hp",   label:"❤️ HP",    desc:"ボス戦での最大HPが上がる"},
    {key:"atk",  label:"⚔️ 攻撃力", desc:"正解したときにボスへ与えるダメージが増える"},
    {key:"def",  label:"🛡️ 防御力", desc:"ボスの攻撃で受けるダメージが減る"},
    {key:"spd",  label:"💨 素早さ", desc:"ボスの攻撃を回避できる確率が上がる。自分の攻撃も命中しやすくなる"},
    {key:"luck", label:"🍀 運",     desc:"正解したときに「会心の一撃」が出やすくなる。ボスとの遭遇率が高まります"},
  ];
  let html = `
    <div class="card">
      <h3 class="section">💪 ボス戦ステータス</h3>
      <p class="note">分野のレベルが1つ上がるたびに、ポイントを1つもらえます。ここで割りふった効果は、ボスとの戦いのときだけ発揮されます（二人対戦には影響しません）。</p>
      <p style="text-align:center; font-size:1.15rem; font-weight:bold; margin-top:10px">
        のこりポイント：<span style="color:var(--accent)">${pts}</span>
      </p>
    </div>`;
  rows.forEach(r=>{
    html += `
    <div class="card status-row">
      <div class="status-row-info">
        <div class="status-row-label">${r.label}</div>
        <div class="note" style="margin-top:2px">${esc(r.desc)}</div>
      </div>
      <div class="status-row-ctrl">
        ${hasHighXP ? `<button class="btn inline secondary stat-step-btn" ${(s[r.key]||0)<=0?'disabled':''} onclick="allocateStat('${r.key}', -100)">－100</button>` : ""}
        <button class="btn inline secondary stat-step-btn" ${(s[r.key]||0)<=0?'disabled':''} onclick="allocateStat('${r.key}', -10)">－10</button>
        <button class="btn inline secondary stat-step-btn" ${(s[r.key]||0)<=0?'disabled':''} onclick="allocateStat('${r.key}', -1)">－1</button>
        <span class="status-row-val">${s[r.key]||0}</span>
        <button class="btn inline stat-step-btn" ${pts<=0?'disabled':''} onclick="allocateStat('${r.key}', 1)">＋1</button>
        <button class="btn inline stat-step-btn" ${pts<=0?'disabled':''} onclick="allocateStat('${r.key}', 10)">＋10</button>
        ${hasHighXP ? `<button class="btn inline stat-step-btn" ${pts<=0?'disabled':''} onclick="allocateStat('${r.key}', 100)">＋100</button>` : ""}
      </div>
    </div>`;
  });
  html += `
    <div class="btn-row">
      <button class="btn secondary" onclick="distributeEvenly()">⚖️ バランスよく配分する</button>
      <button class="btn secondary" onclick="resetStatusAllocation()">🔄 配分をリセット</button>
      <button class="btn secondary" onclick="showHome()">ホームへ</button>
    </div>`;
  screen.innerHTML = html;
}
function allocateStat(key, delta){
  const st = loadStats();
  if(delta > 0){
    const add = Math.min(delta, unspentStatPoints(st));
    if(add <= 0) return;
    st.stats[key] = (st.stats[key]||0) + add;
  }else{
    const remove = Math.min(-delta, st.stats[key]||0);
    if(remove <= 0) return;
    st.stats[key] -= remove;
  }
  saveStats(st);
  showStatusAllocation();
}
/* のこりポイントを、HP・攻撃力・防御力・素早さ・運の5つに、あまりなく均等に振り分ける
   （すでに割りふった分はそのままに、のこりポイントぶんだけ上乗せする）。 */
function distributeEvenly(){
  const st = loadStats();
  const pts = unspentStatPoints(st);
  if(pts <= 0){ alert("配分できるポイントがありません。"); return; }
  const keys = ["hp","atk","def","spd","luck"];
  const each = Math.floor(pts / keys.length);
  let remainder = pts - each * keys.length;
  keys.forEach(k=>{
    let add = each;
    if(remainder > 0){ add += 1; remainder -= 1; }
    st.stats[k] = (st.stats[k]||0) + add;
  });
  saveStats(st);
  showStatusAllocation();
}
function resetStatusAllocation(){
  const st = loadStats();
  const spent = spentStatPoints(st);
  if(spent === 0){ alert("まだポイントを割りふっていません。"); return; }
  if(!confirm("ステータスの配分をすべてリセットして、ポイントを割りふり直せるようにします。よろしいですか？")) return;
  st.stats = {hp:0, atk:0, def:0, spd:0, luck:0};
  saveStats(st);
  showStatusAllocation();
}
