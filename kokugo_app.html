/* ================= デイリーログイン報酬（7日サイクル、2026-08-01〜） =================
   「その日初めて問題を1問解答した」時点で成立する（アプリを起動しただけでは成立しない）。
   record()・hyaRecord()・kwRecord()・kweRecord()（＝正誤を記録する4つの入口すべて）の冒頭、
   loadStats()の直後から呼ぶ。保存は呼び出し元の既存saveStats()に任せるだけの、
   引数のstを直接書き換える関数（ReviewSystem.onAnswerと同じ設計）。
   サイクルは「7日連続」を要求しない（教員の指示：連続でなくても構わず、通算ログイン日数で
   カウントする）。前回ログイン日からの日数に関係なく、日付が変わるたびにcycleDayを
   単純に1→2→…→7→1と進めるだけ。通算ログイン日数(totalLoginDays)は毎回+1する。
   1・3・5・6日目は演出のみで報酬なし（教員確認済み）。2日目は既存の通常アイテムから、
   4日目は既存の通常宝具からランダムで1つ。7日目は「転生の種」を1つ付与してサイクル完了。 */
const DAILY_LOGIN_CYCLE = 7;
function todayLocalDateStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
/* 「転生の種」（デイリーログイン7日目の報酬）。通常アイテム（ITEM_EFFECTS、ボス戦で消費）・
   宝具（TREASURE_NAMES、アイテム一覧からいつでも経験値に変換）・クリア報酬アイテム
   （STORY_REWARD_ITEM_EXP、使うと経験値）のどれとも異なり、「ことのはの転生」
   （kotonohaRebirthConfirmed、2回目以降の育て直しのみ）でだけ消費される専用アイテム。 */
const REBIRTH_SEED_ITEM = "転生の種";
function isRebirthSeedItem(name){ return name === REBIRTH_SEED_ITEM; }
function maybeGrantDailyLogin(st){
  const today = todayLocalDateStr();
  if(!st.dailyLogin) st.dailyLogin = {lastDate:null, cycleDay:0, totalLoginDays:0};
  if(st.dailyLogin.lastDate === today) return; // 今日はすでに成立済み
  st.dailyLogin.lastDate = today;
  st.dailyLogin.cycleDay = (st.dailyLogin.cycleDay % DAILY_LOGIN_CYCLE) + 1;
  st.dailyLogin.totalLoginDays = (st.dailyLogin.totalLoginDays||0) + 1;
  let rewardName = null, rewardKind = null;
  if(st.dailyLogin.cycleDay === 2){
    const pool = Object.keys(ITEM_EFFECTS);
    rewardName = pool[Math.floor(Math.random()*pool.length)];
    rewardKind = "item";
  }else if(st.dailyLogin.cycleDay === 4){
    const pool = [...TREASURE_NAMES];
    rewardName = pool[Math.floor(Math.random()*pool.length)];
    rewardKind = "treasure";
  }else if(st.dailyLogin.cycleDay === DAILY_LOGIN_CYCLE){
    rewardName = REBIRTH_SEED_ITEM;
    rewardKind = "seed";
  }
  if(rewardName){
    if(!st.items) st.items = {};
    st.items[rewardName] = (st.items[rewardName]||0) + 1;
  }
  st.pendingDailyLoginStamp = {cycleDay: st.dailyLogin.cycleDay, totalLoginDays: st.dailyLogin.totalLoginDays, rewardName, rewardKind};
}
/* スタンプ演出：ことのはの進化演出（kotonohaEvolveOverlayEl）と同じ、document.body直下の
   専用オーバーレイの手法を流用する。showHome()の冒頭で、pendingDailyLoginStampが残っていれば
   通常のホーム描画より先にこちらを見せる。 */
function dailyLoginStampOverlayEl(){
  let el = document.getElementById("dailyLoginStampOverlay");
  if(!el){
    el = document.createElement("div");
    el.id = "dailyLoginStampOverlay";
    document.body.appendChild(el);
  }
  return el;
}
function hideDailyLoginStampOverlay(){
  const el = document.getElementById("dailyLoginStampOverlay");
  if(el && el.parentNode) el.parentNode.removeChild(el);
}
const DAILY_LOGIN_REWARD_LABEL = {item:"通常アイテム", treasure:"宝具", seed:"特別アイテム"};
function showDailyLoginStampOverlay(st){
  const info = st.pendingDailyLoginStamp;
  const el = dailyLoginStampOverlayEl();
  const rewardLine = info.rewardName
    ? `<p class="daily-login-reward">🎁 ${esc(DAILY_LOGIN_REWARD_LABEL[info.rewardKind]||"")}「${esc(info.rewardName)}」を手に入れた！</p>`
    : "";
  el.className = "daily-login-stamp-overlay";
  el.innerHTML = `
    <div class="daily-login-stamp-card">
      <div class="daily-login-stamp">${info.cycleDay}日目</div>
      <p class="daily-login-text">${info.cycleDay}日目のログイン報酬を手に入れた！</p>
      <p class="note">（通算${info.totalLoginDays}日）</p>
      ${rewardLine}
      <button class="btn" onclick="dailyLoginStampDone()">つづける</button>
    </div>`;
}
function dailyLoginStampDone(){
  hideDailyLoginStampOverlay();
  const st = loadStats();
  st.pendingDailyLoginStamp = null;
  saveStats(st);
  showHome();
}
/* アイテム一覧画面（showItemCollection）用の「転生の種」専用セクション。通常アイテム・宝具・
   クリア報酬アイテムのどの一覧にも混ぜず、独立枠として表示する（storyRewardSectionHtmlと
   同じパターン）。「使う」ボタンはここには置かず、ことのはカードの転生導線からのみ消費する。 */
function rebirthSeedSectionHtml(st){
  const count = (st.items && st.items[REBIRTH_SEED_ITEM]) || 0;
  if(count <= 0) return "";
  return `<h4 class="item-group-title treasure-title">🌱 転生の種</h4>
    <ul class="item-list treasure-list"><li class="treasure"><span>🌱 ${esc(REBIRTH_SEED_ITEM)}</span><span class="item-count">×${count}</span></li></ul>
    <p class="note">🌱 ホーム画面の「ことのは」カードから、転生して育て直すときに1つ使います。デイリーログイン報酬の7日目で手に入ります。</p>`;
}

/* ================= 幻のボス「シランちゃん」 =================
   通常のボスとは別枠の、1/1000のごく低確率で現れるネタボス。BOSSESには含めないので、
   挑戦チケットやランダムボス抽選（BOSSES配列からの選出）には一切登場しない。
   HPが1しかなく、攻撃さえ当たれば必ず倒せるが、回避率90%固定（素早さステータスの
   命中率ボーナスも効かない）なので当てるのは難しい。プレイヤーはアイテムを使えず、
   ボスの反撃も一切なく（「校歌を熱唱するだけ」）、代わりに毎ターン20%の確率で逃げてしまう。 */
const SHIRAN_ENCOUNTER_RATE = 1/1000;
/* シランちゃんも、分野をまたいだ「直近30回」の正答率が一定値以上のときだけ遭遇しうる
   （2026-07-16〜、教員の指示）。基本のボスと違い「出やすさが上がる」段階はなく、しきい値未満だと
   0%になるだけのシンプルな足切り。30回に満たないうちはデータ不足として、これまでどおり無条件で許可する。 */
const SHIRAN_MIN_ACC = 0.7;
function shiranEncounterAllowed(st){
  const acc = recentAccAll(st);
  return acc === null || acc >= SHIRAN_MIN_ACC;
}
const SHIRAN_FLEE_RATE = 0.3;
const SHIRAN_BOSS = {
  id:"shiran", name:"幻のボス【シランちゃん】", icon:"👻",
  item:"シランちゃんのサイン", treasure:"シランちゃんの秘密ノート",
  hp:1, atk:1, defPct:1, accuracy:1, evadePct:95, luck:1,
  lv:null, recPts:0, fixedEvade:true, noItems:true, isShiran:true,
};
TREASURE_NAMES.add(SHIRAN_BOSS.treasure);

/* ================= 伝説の存在「国語の神」 =================
   1/1,000,000という、シランちゃん（1/1000）よりさらに3桁低い確率でのみ現れる特別な存在。
   BOSSESにもSHIRAN_BOSSにも属さない完全に別枠（ランダム遭遇のみ、挑戦チケットの対象外）。
   通常の反撃は一切せず（「国語の神は、動かない。」）、そのかわり1問でも間違えた瞬間に
   プレイヤーのHPが100%失われ即敗北する（`instantLoseOnWrong`、bossGrade内で分岐）。
   10問連続正解（`streakToWin`）で、HPの残量に関わらず討伐成功となる（bossHp<=0による
   通常の撃破条件とは別の、並列した勝利条件）。全ジャンルからランダムに出題
   （`pendingBossAllGenre=true`で遭遇させる）。回答制限時間は10秒（`answerTimeMs`、
   他の時間制限つきボスの15秒とは個別に指定、`bossHasTimeLimit`側で対応）。
   atk/accuracy/evadePct/luckは反撃が発生しないため未使用（値に意味はない）。 */
const KOKUGO_KAMI_ENCOUNTER_RATE = 1/1000000;
const KOKUGO_KAMI_BOSS = {
  id:"kokugo_kami", name:"国語の神", icon:"⛩️",
  item:"文殊の知恵", treasure:"神の化身",
  hp:999999999, atk:0, defPct:0, accuracy:0, evadePct:0, luck:0,
  lv:null, recPts:0,
  answerTimeMs:10000, instantLoseOnWrong:true, streakToWin:10,
  treasureAccGate:0.8, legendary:true,
};
TREASURE_NAMES.add(KOKUGO_KAMI_BOSS.treasure);

let pendingBoss = null;
let pendingBossAllGenre = false; // 挑戦チケットからの遭遇のときtrue（全ジャンル出題・文言が変わる）
let pendingBossHyakunin = false; // 百人一首クイズ中の遭遇のときtrue（百人一首の問題を出題する。教員の指示、2026-08-02）
let bossPromptSelection = "no";
let bossPromptResumeFn = null;
let bossPromptActive = false;
let bossBattle = null;
/* ボス戦の状態を1問ごとにlocalStorageへ保存し、途中でページを閉じる／リロードしても
   同じ状態から再開できるようにする（2026-07-23〜、教員の指示）。従来はbossBattleが
   メモリ上だけの変数で、リロードすると戦闘がまるごと消えていた。負けても何も失わない
   （bossLoseにペナルティが無い）ため、劣勢になった瞬間にリロードすれば実質ノーリスクで
   何度でもやり直せてしまい、ボスごとに「意図的に見込んでいる10〜15%の負け」がほぼ無効化
   されてしまう問題があった。renderBossBattle()の冒頭で毎回保存し、endBossBattle()
   （勝ち・負け・逃走のいずれからも最終的にここを通る）で消す、という単純な仕組みにする。 */
const BOSS_BATTLE_STORE_KEY = "kokugoBossBattleState_v1";
function findBossById(id){
  if(SHIRAN_BOSS.id === id) return SHIRAN_BOSS;
  if(KOKUGO_KAMI_BOSS.id === id) return KOKUGO_KAMI_BOSS;
  return BOSSES.find(b => b.id === id) || null;
}
function saveBossBattleState(){
  if(!bossBattle) return;
  try{
    const {timerId, ...rest} = bossBattle;
    localStorage.setItem(BOSS_BATTLE_STORE_KEY, JSON.stringify(rest));
  }catch(e){}
}
function clearBossBattleState(){
  try{ localStorage.removeItem(BOSS_BATTLE_STORE_KEY); }catch(e){}
}
/* 保存されていた戦闘があれば復元してtrueを返す（呼び出し元はプロローグ等を出さず、
   そのまま戦闘画面へ直行する）。boss本体は保存データではなく、そのときのBOSSES等の
   定義から改めて引き直す（開発側でボスの数値を更新した場合に、古い保存データの数値を
   引きずらないようにするため）。見つからない場合（該当ボスが削除された等）は保存データを
   諦めて破棄し、通常起動に戻す。 */
function resumeBossBattleIfSaved(){
  let saved = null;
  try{
    const raw = localStorage.getItem(BOSS_BATTLE_STORE_KEY);
    saved = raw ? JSON.parse(raw) : null;
  }catch(e){ saved = null; }
  if(!saved || !saved.boss || !saved.boss.id) return false;
  const liveBoss = findBossById(saved.boss.id);
  if(!liveBoss){ clearBossBattleState(); return false; }
  saved.boss = liveBoss;
  saved.timerId = null;
  bossBattle = saved;
  renderBossBattle();
  startBossTimer();
  return true;
}

/* 低確率でボスが出現する。出現したら遭遇プロンプトを表示してtrueを返す（呼び出し元は処理を中断する）。
   出現しなければfalse。resumeFnは、逃げた・戦い終わったあとに元の流れへ戻るための関数。
   シランちゃん（1/1000）は通常ボスとは別枠で、こちらを先に判定する。
   どちらも直近30回の正答率による足切り／出やすさ調整がかかる（bossEncounterRate/shiranEncounterAllowed参照）。
   hyakuninMode: 百人一首クイズ（hyaNextQuestion）から呼ばれたときだけtrue。出現するボスの種類・確率には
   影響しないが、startBossBattle側で「出題を百人一首の問題にする」判定に使う（教員の指示、2026-08-02）。 */
function rollBossEncounter(resumeFn, hyakuninMode){
  if(bossPromptActive || bossBattle) return false;
  const st = loadStats();
  if(Math.random() < KOKUGO_KAMI_ENCOUNTER_RATE){
    /* 宝具のドロップ判定は「出会った時点」の直近30回正答率で決まる（bossWin参照）ので、
       ここで一度だけスナップショットしてボスオブジェクト（共有シングルトン）に持たせておく。 */
    KOKUGO_KAMI_BOSS._encounterAcc = recentAccAll(st);
    pendingBoss = KOKUGO_KAMI_BOSS;
    pendingBossAllGenre = true;
    pendingBossHyakunin = !!hyakuninMode;
    bossPromptResumeFn = resumeFn;
    bossPromptActive = true;
    bossPromptSelection = "no";
    renderBossPrompt();
    return true;
  }
  if(shiranEncounterAllowed(st) && Math.random() < SHIRAN_ENCOUNTER_RATE){
    pendingBoss = SHIRAN_BOSS;
    pendingBossAllGenre = false;
    pendingBossHyakunin = !!hyakuninMode;
    bossPromptResumeFn = resumeFn;
    bossPromptActive = true;
    bossPromptSelection = "no";
    renderBossPrompt();
    return true;
  }
  if(Math.random() >= bossEncounterRate(st)) return false;
  pendingBoss = randomEncounterBoss();
  pendingBossAllGenre = false;
  pendingBossHyakunin = !!hyakuninMode;
  bossPromptResumeFn = resumeFn;
  bossPromptActive = true;
  bossPromptSelection = "no";
  renderBossPrompt();
  return true;
}
/* ランダム遭遇の抽選対象を絞る（2026-07-15〜）。`minXpRatio`を持つボス（新規追加分）は、
   「ことのはの経験値」がrecPts×minXpRatio未満のうちはランダム遭遇に出てこない
   （挑戦チケットでの抽選＝ticketEligibleBossesも2026-07-19〜、isBossRetiredともども
   同じ条件を共有するようになった。詳細はticketEligibleBoss参照）。
   このプロパティを持たない既存ボスは、これまでどおり無条件で対象になる。
   逆方向の絞り込み（2026-07-19〜、教員の指示）：「ことのはの経験値」が一定を超えると、
   今度は適正経験値の低いボスが「卒業」して出なくなる。プレイヤーが育つにつれて簡単すぎる
   ボスと入れ替わりに、より手応えのある高適正経験値帯のボスが出るようにする仕組み。
   xpAbove（この値を超えたら）とretireAtOrBelowRecPts（この適正経験値以下のボスを除外）の
   組の配列で、複数の段階を持たせられる。 */
const BOSS_RETIREMENT_TIERS = [
  {xpAbove: 7000, retireAtOrBelowRecPts: 4999}, // 2026-08-09〜、教員の指示：経験値7000超で適正経験値5000未満のボスが卒業（5000ちょうどのルオー帯11体は対象外）
  {xpAbove: 4000, retireAtOrBelowRecPts: 2000},
  {xpAbove: 3000, retireAtOrBelowRecPts: 1000},
];
/* boss.neverRetires:trueのボス（サノー・シゲっち、2026-07-19〜）は、適正経験値の数値に関係なく
   卒業の対象外にする（教員の指示。この2体は今後もずっとランダム遭遇の候補に残り続ける）。 */
function isBossRetired(boss, xp){
  if(boss.neverRetires) return false;
  return BOSS_RETIREMENT_TIERS.some(t => xp > t.xpAbove && boss.recPts <= t.retireAtOrBelowRecPts);
}
/* `rareInPoolChance`を持つボス（天才バスケットボーラージュン、2026-07-22〜）は、通常ボスの
   抽選プールの中でだけ、その確率（0.01＝1/100）で単独抽選される特別枠。当たらなければ、
   それ以外の（rareInPoolChanceを持たない）ボスの中から今までどおり均等に1体選ぶ。
   シランちゃん・国語の神（BOSSESに属さない完全な別枠、rollBossEncounter側で判定）とは違い、
   あくまで「通常ボスの中の」レア枠という教員の指示をそのまま実装したもの。 */
function randomEncounterBoss(){
  const xp = kotonohaTotalXP(loadStats());
  const eligible = BOSSES.filter(b => (!b.minXpRatio || xp >= b.recPts * b.minXpRatio) && !isBossRetired(b, xp));
  const rare = eligible.filter(b => b.rareInPoolChance);
  for(const b of rare){
    if(Math.random() < b.rareInPoolChance) return b;
  }
  const normal = eligible.filter(b => !b.rareInPoolChance);
  return normal[Math.floor(Math.random() * normal.length)];
}
function renderBossPrompt(){
  const b = pendingBoss;
  const st = loadStats();
  const introText = b.legendary
    ? `……気配が、違う。<br>「${esc(b.name)}」が、そこにいる。`
    : pendingBossAllGenre
    ? `「${esc(b.name)}」<span class="boss-lv-tag">Lv.${b.lv||"?"}</span>が勝負したそうにこちらを見ている。`
    : `「${esc(b.name)}」<span class="boss-lv-tag">Lv.${b.lv||"?"}</span>が勝負をしかけてきた。`;
  screen.innerHTML = `
    <div class="card boss-encounter">
      <div class="boss-enc-icon">${b.icon}</div>
      <p class="boss-enc-text">${introText}<br>勝負しますか？</p>
      ${b.legendary
        ? `<p class="note boss-enc-hint">⚠️ 一問でも間違えると、その場で敗れます。10問連続で正解すれば討伐成功です（制限時間10秒）。</p>`
        : `<p class="note boss-enc-hint">適正経験値の目安：${b.hideRecPts ? "？？？" : (b.recPts||0)+"pt"}（今の経験値：${totalEarnedStatPoints(st)}pt）</p>`}
      <div class="boss-enc-choices">
        <button class="boss-enc-btn ${bossPromptSelection==='no'?'selected':''}" onclick="resolveBossPrompt('no')">いいえ</button>
        <button class="boss-enc-btn ${bossPromptSelection==='yes'?'selected':''}" onclick="resolveBossPrompt('yes')">勝負する</button>
      </div>
      <p class="note boss-enc-hint">← → で選び、Enterで決定（そのままEnterで「いいえ」）</p>
    </div>`;
}
function moveBossPromptSelection(dir){
  if(!bossPromptActive) return;
  bossPromptSelection = dir;
  renderBossPrompt();
}
function resolveBossPrompt(choice){
  if(!bossPromptActive) return;
  bossPromptActive = false;
  if(choice === "yes"){
    startBossBattle(pendingBoss, pendingBossAllGenre, pendingBossHyakunin);
  }else{
    const fn = bossPromptResumeFn;
    bossPromptResumeFn = null;
    pendingBoss = null;
    pendingBossAllGenre = false;
    pendingBossHyakunin = false;
    if(fn) fn();
  }
}
/* allGenre: 挑戦チケットを使った挑戦のときだけtrue。ランダム遭遇のときは、そのとき解いていた
   ジャンル（quizがなければランダムな1ジャンル）に固定する。
   「まだ習っていない」でONにした分野は、ジャンルが自動選択される場合（挑戦チケットの全ジャンル、
   ランダム遭遇でquiz.keyが未確定なときのランダム選択）の対象から除外する。ただしquiz.keyが
   その分野そのもの（生徒が直接その分野のクイズを選んで解いている最中）のときは、今までどおり
   その分野のままボスと戦う（生徒自身の直接の選択までは妨げない）。
   hyakuninMode: 百人一首クイズ中の遭遇（allGenreとは独立、挑戦チケットでは常にfalse）。trueのときは
   cat/catsを使わず、出題を百人一首のクイズプール（hyaPool()）に固定する（教員の指示、2026-08-02）。 */
function startBossBattle(boss, allGenre, hyakuninMode){
  const st0 = loadStats();
  const genrePool = filterNotLearned(CAT_KEYS, st0);
  const cat = (allGenre || hyakuninMode) ? null : ((quiz && quiz.key && CATS[quiz.key]) ? quiz.key : genrePool[Math.floor(Math.random()*genrePool.length)]);
  const cats = allGenre ? genrePool.slice() : null;
  const ps = kotonohaEffStats(st0);
  const maxHp = BOSS_PLAYER_HP + ps.hp * STAT_HP_PER_POINT;
  bossBattle = {
    boss, bossHp: boss.hp, bossMaxHp: boss.hp,
    playerHp: maxHp, playerMaxHp: maxHp,
    cat, cats, hyakuninMode: !!hyakuninMode, itemCat:null, item:null, order:null, lastQ:null,
    atkBuffTurns:0, atkBuffAmount:0, defBuffTurns:0, defBuffAmount:0, luckBuffTurns:0, luckBuffAmount:0, missGuard:false,
    atkMultTurns:0, atkMultAmount:1,
    showItemPanel:false, usedItemThisTurn:false, usedItemNames:{}, timerId:null,
    correctStreak:0, finisherGauge:0,
    kotonohaAtkMultStack:1, kotonohaDefBuffAmount:0,
    kotonohaSleepTurnsLeft:0, kotonohaSleepFirstTurnDone:false, kotonohaSleepWakeChance:0,
    kotonohaShigenMoveLine:null, kotonohaFinisherUseLine:false,
    kotonohaBurnPct:0, kotonohaMeienUseCount:0, kotonohaMeienMissStreak:0,
  };
  if(boss.preemptiveHalfHp){
    // 丸刈りのさるちゃん専用：戦闘開始と同時に、プレイヤーのHPを半分にする先制攻撃を受ける
    const dmg = Math.floor(bossBattle.playerMaxHp / 2);
    bossBattle.playerHp = Math.max(1, bossBattle.playerHp - dmg);
    bossBattle._preemptiveMsg = `😱 不意をつかれた！ ${boss.name}が戦闘開始と同時に攻撃をしかけてきて、HPが${dmg}減った！`;
  }
  bossNextQuestion();
}
/* ボス戦中に通常アイテムを1つ消費して効果を発動する。問題への回答前に使える
   （消費してもターンは進まない）。制限は2つ：1ターンに使えるのは1個まで、かつ同じ種類の
   アイテムはその戦闘中に1回しか使えない（usedItemNamesはbossNextQuestionでリセットしない
   ＝バトル全体を通しての制限にする）。効果はbossBattle側に持たせ、次の攻撃・防御時に反映する。 */
function useBossItem(name){
  const b = bossBattle;
  if(!b || b._resolving || b.bossHp <= 0 || b.playerHp <= 0 || b.boss.noItems) return;
  if(b.usedItemThisTurn || b.usedItemNames[name]) return;
  const effect = ITEM_EFFECTS[name];
  if(!effect) return;
  const st = loadStats();
  if(!(st.items && st.items[name] > 0)) return;
  st.items[name]--;
  if(st.items[name] <= 0) delete st.items[name];
  saveStats(st);
  let msg = "";
  if(effect.type === "heal"){
    const healed = Math.min(effect.amount, b.playerMaxHp - b.playerHp);
    b.playerHp = Math.min(b.playerMaxHp, b.playerHp + effect.amount);
    msg = healed > 0 ? `${effect.icon} 「${name}」を使った！ HPが${healed}回復した！` : `${effect.icon} 「${name}」を使った！（HPはすでに満タンだった）`;
  }else if(effect.type === "atkBuff"){
    b.atkBuffTurns = effect.turns;
    b.atkBuffAmount = effect.amount;
    msg = `${effect.icon} 「${name}」を使った！ 攻撃力が上がった！（あと${effect.turns}ターン）`;
  }else if(effect.type === "defBuff"){
    b.defBuffTurns = effect.turns;
    b.defBuffAmount = effect.amount;
    msg = `${effect.icon} 「${name}」を使った！ 防御力が上がった！（あと${effect.turns}ターン）`;
  }else if(effect.type === "luckBuff"){
    b.luckBuffTurns = effect.turns;
    b.luckBuffAmount = effect.amount;
    msg = `${effect.icon} 「${name}」を使った！ 運が上がった！（あと${effect.turns}ターン）`;
  }else if(effect.type === "missGuard"){
    b.missGuard = true;
    msg = `${effect.icon} 「${name}」を使った！ 次に1回だけ、間違えてもダメージを受けなくなった！`;
  }else if(effect.type === "hpHalve"){
    const before = b.bossHp;
    b.bossHp = Math.max(1, Math.floor(b.bossHp / 2));
    msg = `${effect.icon} 「${name}」を使った！ ${esc(b.boss.name)}のHPが半分になった！（${before} → ${b.bossHp}）`;
  }else if(effect.type === "hpCut99"){
    const before = b.bossHp;
    b.bossHp = Math.max(1, Math.floor(b.bossHp * 0.01));
    msg = `${effect.icon} 「${name}」を使った！ ${esc(b.boss.name)}のHPが99%減った！（${before} → ${b.bossHp}）`;
  }else if(effect.type === "healPct"){
    const healAmt = Math.max(1, Math.round(b.playerMaxHp * effect.amount));
    const healed = Math.min(healAmt, b.playerMaxHp - b.playerHp);
    b.playerHp = Math.min(b.playerMaxHp, b.playerHp + healAmt);
    msg = healed > 0 ? `${effect.icon} 「${name}」を使った！ HPが${healed}回復した！` : `${effect.icon} 「${name}」を使った！（HPはすでに満タンだった）`;
  }else if(effect.type === "atkMultBuff"){
    b.atkMultTurns = effect.turns;
    b.atkMultAmount = effect.mult;
    msg = effect.turns > 1
      ? `${effect.icon} 「${name}」を使った！ 次の${effect.turns}ターン、攻撃力が${effect.mult}倍になる！`
      : `${effect.icon} 「${name}」を使った！ 次のターン、攻撃力が${effect.mult}倍になる！`;
  }else if(effect.type === "defCutBuff"){
    /* 防御力アップ系（2026-08-09〜、教員の指示）。既存のdefBuff（防御力ステータスへの固定加算）
       とは別枠で、被ダメージそのものをamount(0〜1)ぶん割合カットする。bossCounterAttack側の
       通常反撃・無敵艦隊のcounterOkFixedMin反撃の2箇所で、防御力軽減の後段に適用する
       （防御力を無視するstatIgnore/fixedDamageRange系のボスにはそもそも適用箇所がないため、
       教員の指示どおり「防御力に関係なく」の演出は壊れない）。 */
    b.defCutBuffTurns = effect.turns;
    b.defCutBuffAmount = effect.amount;
    msg = `${effect.icon} 「${name}」を使った！ 次の${effect.turns}ターン、受けるダメージが${Math.round(effect.amount*100)}%減る！`;
  }else if(effect.type === "evadeBuff"){
    // 回避率アップ系：bossCounterAttack側のevasionPct計算に、素早さの回避率とは別枠でamount(pt)を加算する
    b.evadeBuffTurns = effect.turns;
    b.evadeBuffAmount = effect.amount;
    msg = `${effect.icon} 「${name}」を使った！ 次の${effect.turns}ターン、ボスの攻撃を回避しやすくなった！`;
  }else if(effect.type === "accBuff"){
    // 命中率アップ系：bossGrade側のeffEvadePct（ボスの回避率）から、素早さの命中ボーナスとは別枠でamount(pt)を差し引く
    b.accBuffTurns = effect.turns;
    b.accBuffAmount = effect.amount;
    msg = `${effect.icon} 「${name}」を使った！ 次の${effect.turns}ターン、ボスに攻撃が当たりやすくなった！`;
  }else if(effect.type === "revealWrong"){
    /* 少年コミック専用（2026-07-23〜）。記述式（it.ansが配列）の問題には効果がなく、その旨だけ
       伝えて選択肢には触れない。4択でも、すでに他の同種アイテムで1つ消えている場合や
       選択肢が2つ以下の場合はこれ以上消せないので同様に不発扱いにする（b.eliminatedChoiceに
       正解ではないoriginal indexを1つ記録し、renderBossBattle/bossAnswerChoice側で参照する）。 */
    const it = b.item;
    if(Array.isArray(it.ans)){
      msg = `${effect.icon} 「${name}」を使った！ しかし、記述式の問題には効果がなかった…。`;
    }else{
      const wrongIdxs = it.c.map((_,i)=>i).filter(i => i !== it.a && i !== b.eliminatedChoice);
      if(b.eliminatedChoice != null || wrongIdxs.length < 1 || it.c.length <= 2){
        msg = `${effect.icon} 「${name}」を使った！ しかし、これ以上は選択肢を減らせなかった…。`;
      }else{
        b.eliminatedChoice = wrongIdxs[Math.floor(Math.random() * wrongIdxs.length)];
        msg = `${effect.icon} 「${name}」を使った！ 不正解の選択肢が1つ消えた！`;
      }
    }
  }
  b.showItemPanel = false;
  b.usedItemThisTurn = true;
  b.usedItemNames[name] = true;
  b.itemUseMsg = msg;
  renderBossBattle();
  startBossTimer(BOSS_ITEM_USE_TIMER_MS);
}
function toggleBossItemPanel(){
  if(!bossBattle || bossBattle._resolving || bossBattle.usedItemThisTurn || bossBattle.boss.noItems) return;
  bossBattle.showItemPanel = !bossBattle.showItemPanel;
  renderBossBattle();
}
/* このボスに必殺技を使えるかどうか。「一般のボス」＝下記3つの特殊フラグをどれも持たないボスだけが対象
   （教員の指示、2026-07-20）。
   ・statIgnore（ステータス無視のボス＝サノー・シゲっち）：攻撃力という概念自体が無い
   ・isShiran（シランちゃん）：HP1・逃走判定つきのネタボスで、通常の攻撃力計算が意味をなさない
   ・legendary/instantLoseOnWrong（国語の神）：反撃なし・1ミス即敗北という特殊ルールのボス */
function bossFinisherEligible(boss){
  return !boss.statIgnore && !boss.isShiran && !boss.legendary && !boss.instantLoseOnWrong;
}
/* 必殺技バーのHTML（アイテムバーと同じ場所に並べて表示）。対象外のボス（bossFinisherEligible）
   にはゲージ・ボタンごと一切表示しない。ストーリーモードの戦闘はこの関数を呼ばない別実装なので影響しない。 */
/* 必殺技ゲージのバー。教員の指示（2026-07-31〜）で、転生して少年体以上に育っていると、
   系統別必殺技と既存の言霊一閃（またはあくび）の**両方**がボタンとして出て、どちらを打つか
   選べるようになる（排他ではなく併用）。天翔は系統別必殺技の必要正解数が短いため、言霊一閃側
   より先にボタンが出ることがある（ドット表示は常にFINISHER_GAUGE_MAX基準のまま）。 */
function bossFinisherBarHtml(){
  const b = bossBattle;
  if(!bossFinisherEligible(b.boss)) return "";
  const st = loadStats();
  /* st.specialMoveUnlocked（ストーリー第3章クリアで立つフラグ）だけを見ていたため、転生済み
     （st.kotonohaRebirth）なのにこのフラグが立っていないケースでゲージが一切表示されない
     バグがあった（2026-08-02、教員からの報告で発覚）。通常のストーリー進行では第9章（転生解放）
     は第3章を経由しないと到達できないため理論上は起きないはずだが、実際に転生している時点で
     必殺技を使う資格は十分にあるとみなし、st.kotonohaRebirthが立っていれば同様に許可する。 */
  if(!st.specialMoveUnlocked && !st.kotonohaRebirth) return "";
  const gauge = Math.min(FINISHER_GAUGE_MAX, b.finisherGauge||0);
  const dots = Array.from({length:FINISHER_GAUGE_MAX}, (_,i) => `<span class="finisher-dot${i < gauge ? " on" : ""}"></span>`).join("");
  const lineOk = kotonohaLineMoveStageOk(st);
  const lineReq = lineOk ? kotonohaLineGaugeRequired(st) : null;
  const lineReady = lineOk && gauge >= lineReq;
  const baseReady = gauge >= FINISHER_GAUGE_MAX;
  let buttons = "";
  if(lineReady){
    buttons += `<button class="btn inline finisher-btn" onclick="bossUseFinisher(true)">⚡${esc(kotonohaLineMoveDisplayName(st))}！</button>`;
  }
  if(baseReady){
    buttons += `<button class="btn inline finisher-btn secondary" onclick="bossUseFinisher(false)">⚡${esc(finisherMoveName(st))}！</button>`;
  }
  const nextGoal = lineOk ? Math.min(lineReq, FINISHER_GAUGE_MAX) : FINISHER_GAUGE_MAX;
  const note = buttons ? "" : `<span class="note" style="margin:0">（あと${nextGoal - gauge}問連続正解）</span>`;
  return `
    <div class="finisher-bar">
      <span class="finisher-gauge-label">必殺技ゲージ</span>
      <span class="finisher-dots">${dots}</span>
      ${buttons}${note}
    </div>`;
}
function refreshBossFinisherBar(){
  const el = document.getElementById("bossFinisherBar");
  if(el) el.innerHTML = bossFinisherBarHtml();
}
/* 戦闘エリア（.boss-battle-screen）だけを一瞬揺らす演出。bossUseFinisher専用に切り出した
   （画面全体ではなく戦闘エリアに限定、というのは教員の指示で確認済み）。 */
const KOTONOHA_FX_LINES = ["fx-tensho","fx-engoku","fx-soukai","fx-suishin","fx-seiki","fx-meien"];
/* fxLine（tensho/engoku/soukai/suishin/seiki/meien）を渡すと、系統ごとに個性化した
   揺れ方（CSS側のfx-◯◯キーフレーム）になる。省略時（言霊一閃／大きないびき使用時）は
   今までどおりの既存finisherShakeのまま（教員の指示、2026-08-01〜）。 */
function triggerFinisherShake(fxLine){
  const el = document.querySelector(".boss-battle-screen");
  if(!el) return;
  el.classList.remove("finisher-shake", ...KOTONOHA_FX_LINES);
  void el.offsetWidth; // 連続発動時にアニメーションを再トリガーするための強制リフロー
  el.classList.add("finisher-shake");
  const fxClass = fxLine ? "fx-" + fxLine : null;
  if(fxClass) el.classList.add(fxClass);
  setTimeout(() => { el.classList.remove("finisher-shake"); if(fxClass) el.classList.remove(fxClass); }, 600);
}
/* 必殺技の「溜め」「技名」演出を画面いっぱいに出すオーバーレイ。教員の指示（2026-07-20）：
   ボス戦カード内(#fb)に収めると目立たず見づらいので、.boss-battle-screenの構造を無視して
   document.bodyの直下に重ねる（screen.innerHTMLの作り直しに巻き込まれない）。
   呼び出すたびに既存のオーバーレイを消してから新しく作るので、複数回呼んでも重複しない。 */
/* fxClass（"fx-tensho"等）を渡すと、外枠・文字の両方に系統別の配色クラスが付く。
   未指定時（言霊一閃／大きないびき使用時）は今までどおりの見た目のまま。 */
function showFinisherOverlay(html, extraClass, fxClass){

  el.className = "finisher-overlay" + (fxClass ? " " + fxClass : "");

  document.body.appendChild(el);
}
function hideFinisherOverlay(){
  const el = document.getElementById("finisherOverlay");
  if(el && el.parentNode) el.parentNode.removeChild(el);
}
/* 必殺技は「押した瞬間に即発動」（教員の指示：次の正解を待つ予約制ではない）。
   一般のボス（bossFinisherEligible）が対象で、かつ必中＝回避判定を一切行わない
   （教員の指示：回避に阻まれるのでは"必殺"にならないため）。会心・防御%軽減は通常の
   攻撃と同じ式を踏襲する。アイテム使用と同じくターンは消費しない＝反撃は発生しないが、
   使った時点でその問題への回答権は失う（連打で何度も撃てないよう、ゲージも即0にする）。
   演出は3段階（教員の指示、2026-07-20〜）：
   ①bossUseFinisher：「ことのはは、必殺技を打とうとしている……」を画面いっぱいに表示（FINISHER_CHARGE_MS）
   ②bossAnnounceFinisherName：技名を画面いっぱいに大きく表示（FINISHER_NAME_MS）
   ③bossResolveFinisher：オーバーレイを消し、実際のダメージ計算・戦闘エリアの揺れ・結果表示
   一連の間は_resolvingをtrueにして、アイテム使用や連打などの割り込みをブロックする。
   教員の指示（2026-07-31〜）：転生して少年体以上に育っていても、系統別必殺技と言霊一閃
   （またはあくび）は排他ではなく併用可能にする＝ボタンが2つ出て、そのつどどちらを打つか
   選べる。引数useLineがtrueなら系統別必殺技、falseなら既存の言霊一閃側で発動する。 */
function bossUseFinisher(useLine){
  const b = bossBattle;
  if(!b || b._resolving || b.bossHp <= 0 || b.playerHp <= 0 || !bossFinisherEligible(b.boss)) return;
  const st = loadStats();
  if(!st.specialMoveUnlocked && !st.kotonohaRebirth) return; // bossFinisherBarHtmlと同じ条件に揃える
  const lineOk = useLine && kotonohaLineMoveStageOk(st);
  const required = lineOk ? kotonohaLineGaugeRequired(st) : FINISHER_GAUGE_MAX;
  if((b.finisherGauge||0) < required) return;
  b.kotonohaFinisherUseLine = lineOk;
  /* 始原龍（全領域バランス型、type4）専用：六つの力を統合した存在という設定どおり、
     系統別必殺技を選んで打つたびに天翔〜冥淵の6系統からどれか1つの力をランダムに借りる
     （kotonohaActiveLineMoveがこのb.kotonohaShigenMoveLineを参照する）。溜め演出・技名
     発表・ダメージ計算の一連の間は同じ抽選結果を使い続けるよう、発動を決めたこの時点で
     1回だけ抽選する（教員の指示：「技は毎回ランダムで決まる」＝1回の発動ごとに1回抽選）。 */
  if(lineOk && st.kotonohaRebirth.line === "shigen"){
    const keys = Object.keys(KOTONOHA_LINE_MOVES);
    b.kotonohaShigenMoveLine = keys[Math.floor(Math.random() * keys.length)];
  }
  /* 演出の色・画面の揺れ方を系統ごとに変えるためのキー（教員の指示、2026-08-01〜）。
     系統別必殺技を使ったときだけ設定し、言霊一閃／大きないびきのときはnull＝既存の見た目のまま。
     始原龍は上で抽選済みのb.kotonohaShigenMoveLineをそのまま使う。 */
  b.kotonohaFinisherFxLine = lineOk ? (st.kotonohaRebirth.line === "shigen" ? b.kotonohaShigenMoveLine : st.kotonohaRebirth.line) : null;
  clearBossTimer();
  stopBossTimerBar();
  b._resolving = true;
  // 発動を決めた時点で、その問題への回答権は失う（choices/入力欄を無効化）
  const it = b.item;
  if(!Array.isArray(it.ans)){
    screen.querySelectorAll(".choice").forEach(btn => { btn.disabled = true; });
  }else{
    const el = document.getElementById("ansIn"); if(el) el.disabled = true;
    const sbtn = document.getElementById("submitBtn"); if(sbtn) sbtn.disabled = true;
  }
  const chargeFx = b.kotonohaFinisherFxLine ? "fx-" + b.kotonohaFinisherFxLine : null;
  showFinisherOverlay("ことのはは、必殺技を打とうとしている……", "finisher-charge-text", chargeFx);
  setTimeout(() => { if(bossBattle === b && b._resolving) bossAnnounceFinisherName(); }, FINISHER_CHARGE_MS);
}
/* 溜め演出のあと、技名を画面いっぱいに大きく表示する中間ステップ。系統別必殺技のときだけ、
   技名の上に今の転生イラストを小さく添える（教員の指示：ことのはの画像を使うと効果的なら
   それもあり）。言霊一閃／大きないびきのときはテキストのみ、今までどおり。 */
function bossAnnounceFinisherName(){
  const b = bossBattle;
  const st = loadStats();
  const fx = b.kotonohaFinisherFxLine;
  /* 焔獄「灼熱の連撃」だけ、蓄積した火傷（bossResolveFinisher実行前＝今回発動する直前の値）に
     応じて発光を強くする（教員の指示：色や画面の揺らし方に変化を、の一環。威力自体の
     ロジックには触れず、見た目だけの演出。以前は連続ヒット数だったが、火傷方式への変更に
     合わせて蓄積火傷率ベースに切り替えた、2026-08-02〜）。 */
  const comboTier = fx === "engoku" ? Math.min(4, Math.floor((b.kotonohaBurnPct||0) / 0.05)) : 0;
  const fxClass = [fx ? "fx-" + fx : null, comboTier > 0 ? "fx-engoku-c" + comboTier : null].filter(Boolean).join(" ") || null;
  const portraitSrc = fx ? kotonohaRebirthImageSrc(st) : null;
  const portraitHtml = portraitSrc ? `<img class="finisher-line-portrait" src="${portraitSrc}" alt="">` : "";
  showFinisherOverlay(`${portraitHtml}⚡${esc(finisherMoveName(st))}！`, "finisher-name-big", fxClass);
  setTimeout(() => { if(bossBattle === b && b._resolving) bossResolveFinisher(); }, FINISHER_NAME_MS);
}
/* 技名表示のあと、実際にダメージを与えて結果を表示する最終ステップ。 */
function bossResolveFinisher(){
  const b = bossBattle;
  hideFinisherOverlay();
  const st = loadStats();
  const lm = kotonohaActiveLineMove(st);
  b.finisherGauge = 0;
  b.kotonohaFinisherUseLine = false; // 選択状態をリセット（次にゲージが満タンになるまでは言霊一閃側の表示に戻す）
  const ps = kotonohaEffStats(st);
  let dealt = randInt(BOSS_PLAYER_DMG[0], BOSS_PLAYER_DMG[1]) + ps.atk * STAT_ATK_PER_POINT
    + (b.atkBuffTurns > 0 ? b.atkBuffAmount : 0);
  if(b.atkMultTurns > 0) dealt = Math.round(dealt * b.atkMultAmount);
  /* 聖輝「光の高揚」はここ（必殺技ダメージ）には乗らない（教員の指示、2026-08-08〜：何度も
     打つほど必殺技自体が強くなるのは意図しない。通常攻撃側=bossGrade側のkotonohaAtkMultStack
     適用箇所だけに効かせる）。必殺技自体の威力は、他の系統と同じくpowerMult（段階に応じた
     固定倍率、発動回数では変わらない）だけを見る。 */
  /* ぶらぶら歩く人専用：必殺技のダメージを他ボスの2倍、2回目以降はさらに倍（4倍）にする新フラグ
     `finisherDamageMultBoost:[2,4]`（教員の指示、2026-07-23）。防御力が解除されない仕様
     （上のdefTripleOnMissのコメント参照）で通常攻撃だけでは実質勝てなくなったことへの救済策
     として、必殺技側を強化する形で対応した。`b.finisherUseCount`で戦闘中の使用回数を数え、
     配列の添字（0=1回目、1=2回目以降）に応じた倍率を選ぶ（3回目以降は教員の指示どおり
     4倍で打ち止め＝配列の最後の要素を使い続ける）。このボスを持たない他の全ボスは
     `finisherDamageMultBoost`を持たないため、`finisherExtraMult`は常に1のままで
     既存の必殺技バランスに一切影響しない。 */
  let finisherExtraMult = 1;
  if(b.boss.finisherDamageMultBoost){
    const stages = b.boss.finisherDamageMultBoost;
    const idx = Math.min(b.finisherUseCount||0, stages.length - 1);
    finisherExtraMult = stages[idx];
    b.finisherUseCount = (b.finisherUseCount||0) + 1;
  }
  /* 系統別必殺技の威力倍率。未転生・少年体未満のときはlmがnullで、今までどおりFINISHER_MULT。
     冥淵「深淵の守り」だけ、発動するたびに威力そのものが際限なく積み上がる（b.kotonohaMeienUseCount、
     ミスを挟んでもリセットされない＝発動した回数だけをそのまま数える）。 */
  let moveMult = lm ? lm.def.powerMult(lm.t) : FINISHER_MULT;
  if(lm && lm.def.powerGrowthPerUse){
    moveMult += (b.kotonohaMeienUseCount||0) * lm.def.powerGrowthPerUse;
    b.kotonohaMeienUseCount = (b.kotonohaMeienUseCount||0) + 1;
  }
  dealt = Math.round(dealt * moveMult * finisherExtraMult);
  const effLuck = ps.luck + (b.luckBuffTurns > 0 ? b.luckBuffAmount : 0);
  const critChance = luckCritChancePct(effLuck, st);
  let crit = false;
  if(Math.random() * 100 < critChance){
    crit = true;
    dealt = Math.round(dealt * STAT_CRIT_MULT);
  }
  dealt = Math.max(1, Math.round(dealt * (1 - (b.boss.defPct||0) / 100)));
  // 経験値ゲート・ルール①は必殺技にも適用する（必中の必殺技であっても、とどめだけは必ずかわされる）
  let dodged = false;
  if(bossXpGateActive(b.boss, st) && b.bossHp - dealt <= 0){
    dodged = true;
    dealt = 0;
  }else{
    b.bossHp = Math.max(0, b.bossHp - dealt);
  }
  // 蒼海「癒しの波動」：与えたダメージの一部を自分のHPに還元する
  let healed = 0;
  if(lm && lm.def.drainPct && dealt > 0){
    healed = Math.round(dealt * lm.def.drainPct(lm.t));
    if(healed > 0) b.playerHp = Math.min(b.playerMaxHp, b.playerHp + healed);
  }
  /* 聖輝「光の高揚」：発動のたびに自分の攻撃力を掛け算で倍化する（重ねがけ・永続、上限なし、
     2026-08-08〜）。b.kotonohaAtkMultStackに毎回この段階の倍率を掛け続けるだけの、複利式の
     持続バフ（戦闘終了までリセットされない）。教員の指示（2026-08-08〜）で、効果は通常攻撃
     （bossGrade側）だけにかかり、必殺技自体のダメージ（このbossResolveFinisher内のdealt計算）
     には乗せない＝何度打っても必殺技そのものの威力は発動回数で変わらない。 */
  let buffMsg = "";
  if(lm && lm.def.atkMultPerUse){
    const mult = lm.def.atkMultPerUse(lm.t);
    b.kotonohaAtkMultStack = (b.kotonohaAtkMultStack||1) * mult;
    buffMsg = `<div class="boss-turn">✨自分の通常攻撃力が${mult}倍になった！（現在×${b.kotonohaAtkMultStack.toFixed(2)}）</div>`;
  }
  // 翠森「眠りの胞子」：相手を数ターン行動不能にする（毎ターンの目覚め判定はbossCounterAttack側）
  let sleepMsg = "";
  if(lm && lm.def.sleepMaxTurns){
    b.kotonohaSleepTurnsLeft = lm.def.sleepMaxTurns(lm.t);
    b.kotonohaSleepWakeChance = lm.def.sleepWakeChance(lm.t);
    b.kotonohaSleepFirstTurnDone = false;
    sleepMsg = `<div class="boss-turn">💤${esc(b.boss.name)}を眠らせた！</div>`;
  }
  // 冥淵「深淵の守り」：発動するたびに次の発動の威力が上がっていく（上限なし）
  const growthMsg = (lm && lm.def.powerGrowthPerUse) ? `<div class="boss-turn">🌑必殺技の威力がさらに上がった！（次は${(lm.def.powerMult(lm.t) + b.kotonohaMeienUseCount * lm.def.powerGrowthPerUse).toFixed(1)}倍）</div>` : "";
  /* 焔獄「灼熱の連撃」→「火傷」：命中したら火傷を蓄積させる（重ねて使うほど上乗せ、上限なし）。
     実際の毎ターンのダメージ処理はkotonohaBurnTick()（bossAdvance()から呼ぶ）が担当し、
     ここでは蓄積割合を積むだけ（とどめが回避された=dodgedのときは火傷も付与しない）。 */
  let burnMsg = "";
  if(lm && lm.def.burnPctPerTurn && !dodged){
    b.kotonohaBurnPct = (b.kotonohaBurnPct||0) + lm.def.burnPctPerTurn(lm.t);
    burnMsg = `<div class="boss-turn">🔥${esc(b.boss.name)}に火傷を負わせた！（毎ターン最大HPの${Math.round(b.kotonohaBurnPct*100)}%を追加ダメージ）</div>`;
  }
  refreshBossHpBars();
  refreshBossFinisherBar();
  const fb = document.getElementById("fb");
  fb.className = "feedback show ok";
  const healMsg = healed > 0 ? `<div class="boss-turn">💚自分のHPが${healed}回復した！</div>` : "";
  fb.innerHTML = (dodged
    ? `<span class="finisher-dmg">💨 ${esc(b.boss.name)}に、すんでのところでかわされた！</span>`
    : `<span class="finisher-dmg">${crit ? "💥会心の一撃！ " : ""}${esc(b.boss.name)}に ${dealt} ダメージ！</span>`)
    + healMsg + buffMsg + sleepMsg + growthMsg + burnMsg;
  if(!dodged) triggerFinisherShake(b.kotonohaFinisherFxLine);
  if(b.bossHp <= 0){
    setTimeout(() => { if(bossBattle && bossBattle._resolving) bossWin(); }, 1300);
    return;
  }
  b._resolving = false;
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.style.display = "inline-block";
  nextBtn.textContent = "つぎへ";
  nextBtn.focus();
}
/* ボス戦中に使える（効果が定義されていて、1個以上持っていて、まだその戦闘中に使っていない）
   通常アイテムの一覧 */
function usableBossItems(){
  const st = loadStats();
  const items = st.items || {};
  const used = (bossBattle && bossBattle.usedItemNames) || {};
  return Object.keys(ITEM_EFFECTS).filter(name => (items[name]||0) > 0 && !used[name]);
}
function bossNextQuestion(){
  /* 先制攻撃メッセージ（丸刈りのさるちゃん）・火傷ダメージのメッセージ（kotonohaBurnTick）が
     あれば、次の問題画面の先頭にitemUseMsg欄で表示する（両方同時に立つことは実際にはない：
     先制攻撃は1問目だけ・火傷は最低でも必殺技を1回使った後なので）。 */
  bossBattle.itemUseMsg = bossBattle._burnMsg || bossBattle._preemptiveMsg || null;
  bossBattle._burnMsg = null;
  bossBattle._preemptiveMsg = null;
  bossBattle.showItemPanel = false;
  bossBattle.usedItemThisTurn = false;
  bossBattle.eliminatedChoice = null; // 少年コミックの効果は1問ごとにリセットする
  if(bossBattle.hyakuninMode){
    bossBattle.item = pickBattleQuestionHyakunin(bossBattle.lastQ);
    bossBattle.itemCat = null;
  }else if(bossBattle.cats){
    const picked = pickBattleQuestionMulti(bossBattle.cats, bossBattle.lastQ);
    bossBattle.item = picked.item;
    bossBattle.itemCat = picked.cat;
  }else{
    bossBattle.item = pickBattleQuestion(bossBattle.cat, bossBattle.lastQ);
    bossBattle.itemCat = bossBattle.cat;
  }
  bossBattle.lastQ = bossBattle.item.q;
  renderBossBattle();
  startBossTimer();
}
/* ボス戦の1問あたりの制限時間（2026-07-15〜）。アイテムを使った瞬間、そこから改めて
   BOSS_ITEM_USE_TIMER_MS(10秒)の制限時間に切り替わる（useBossItem内でstartBossTimerを
   呼び直す、2026-07-17〜）。renderBossBattleがDOMを丸ごと作り直すため、useBossItem側で
   明示的にタイマーを再スタートしないと、見た目のバーだけ残り時間なしに固まってしまう
   （実際のsetTimeoutは元の締切のまま動き続けるため、機能上の制限時間自体が消えるわけでは
   ないが、ユーザーには「制限時間が解除された」ように見えていた）。
   時間切れは不正解として扱う（bossTimeUp→bossGrade(false,...,true)）。
   答えた場合はbossGrade冒頭のclearBossTimer()でこのタイマーを止めるので、二重採点は起きない。
   適正経験値がBOSS_TIMER_MIN_RECPTS(501)以下のボス（旧6体・シランちゃん）は対象外
   （bossHasTimeLimitがfalseを返すので、タイマーを張らず、バーもrenderBossBattle側で表示しない）。 */
function startBossTimer(overrideMs){
  clearBossTimer();
  if(!bossHasTimeLimit(bossBattle.boss)) return;
  const battle = bossBattle;
  const ms = overrideMs || bossAnswerTimeMs(battle.boss);
  battle.timerId = setTimeout(() => {
    if(bossBattle !== battle || battle._resolving) return;
    bossTimeUp();
  }, ms);
  animateBossTimerBar(ms);
}
function clearBossTimer(){
  if(bossBattle && bossBattle.timerId){
    clearTimeout(bossBattle.timerId);
    bossBattle.timerId = null;
  }
}
function bossTimeUp(){
  if(!bossBattle || bossBattle._resolving) return;
  const it = bossBattle.item;
  if(Array.isArray(it.ans)){
    const el = document.getElementById("ansIn");
    if(el) el.disabled = true;
    const sb = document.getElementById("submitBtn");
    if(sb) sb.disabled = true;
  }
  bossGrade(false, null, null, true);
}
/* 残り時間バーをCSSトランジションだけで動かす（setIntervalで毎秒描画し直す必要がない）。
   幅100%→transition:noneで即セット→次のフレームでtransitionを付けて幅0%に変えることで、
   ブラウザに「100%から0%への変化」を検知させ、10秒かけて滑らかに縮む見た目にする。 */
function animateBossTimerBar(overrideMs){
  const el = document.getElementById("bossTimerFill");
  if(!el) return;
  const ms = overrideMs || bossAnswerTimeMs(bossBattle.boss);
  el.style.transition = "none";
  el.style.width = "100%";
  if(typeof requestAnimationFrame !== "function") return;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      el.style.transition = `width ${ms}ms linear`;
      el.style.width = "0%";
    });
  });
}
/* 回答が確定したら、バーが裏で動き続けているように見えないよう非表示にする

function bossGrade(ok, chosenOrig, typed, timedOut){
  clearBossTimer();
  stopBossTimerBar();
  const b = bossBattle, it = b.item;
  const st = loadStats();
  const gateActive = bossXpGateActive(b.boss, st);
  let dealt = 0, crit = false, evaded = false, fled = false, survived = false, bossQuit = false, meienGraceUsed = false, lowSpdTaunt = "";
  if(ok){
    b.correctStreak = (b.correctStreak||0) + 1;
    b.kotonohaMeienMissStreak = 0; // 正解でミスの連続が途切れる＝冥淵の「1回だけ許される」猶予が復活する
    /* 必殺技ゲージは「不正解でリセットされる連続正解数」で管理する（correctStreakは
       国語の神のstreakToWin判定にも使う既存カウンタなので、混同しないよう別カウンタにする）。
       満タンになったら、bossUseFinisher()側で押した瞬間に即座に発動・消費される
       （このbossGrade関数はゲージの増減だけを管理し、必殺技のダメージ計算には関与しない）。 */
    b.finisherGauge = Math.min(FINISHER_GAUGE_MAX, (b.finisherGauge||0) + 1);
    if(b.boss.statIgnore){
      // ステータス無視のボス：回避・会心・防御%の判定を一切行わず、bossMaxHpに対する
      // 固定%レンジ（playerHitMin〜playerHitMax）のランダムダメージを必ず与える。
      const pct = b.boss.playerHitMin + Math.random() * (b.boss.playerHitMax - b.boss.playerHitMin);
      dealt = Math.max(1, Math.round(b.bossMaxHp * pct));
      if(gateActive && b.bossHp - dealt <= 0){
        // 経験値ゲート・ルール①：とどめの一撃は必ず回避される
        evaded = true;
        dealt = 0;
      }else{
        b.bossHp = Math.max(0, b.bossHp - dealt);
      }
    }else{
      const ps = kotonohaEffStats(st);
      // 素早さは、ボスの回避率を少し下げる命中率ボーナスも持つ（上限つきなので他ステータスとのバランスは崩れない）
      const accBonus = STAT_SPD_ACC_MAX_BONUS * ps.spd / (ps.spd + STAT_SPD_ACC_HALF_POINT);
      /* 韋駄天専用：素早さがlowSpdEvade.threshold未満のときは、通常の回避率計算を無視して
         固定の高確率で回避する（2026-08-09〜、教員の指示）。回避が発生したターンは専用の
         セリフ(lowSpdTaunt)をdmgMsg側で表示する。 */
      const lowSpdEvadeActive = !!(b.boss.lowSpdEvade && ps.spd < b.boss.lowSpdEvade.threshold);
      const baseEvadePct = lowSpdEvadeActive ? b.boss.lowSpdEvade.evadePct
        : b.boss.fixedEvade ? (b.boss.evadePct||0) : Math.max(0, (b.boss.evadePct||0) - accBonus);
      // 命中率アップ系アイテム（バスケットボール等）：発動源に関係なく、ボスの回避率を一律で差し引く
      const effEvadePct = Math.max(0, baseEvadePct - (b.accBuffTurns > 0 ? b.accBuffAmount : 0));
      if(Math.random() * 100 < effEvadePct){
        evaded = true;
        if(lowSpdEvadeActive) lowSpdTaunt = b.boss.lowSpdEvade.taunt || "";
      }else if(b.boss.isShiran && Math.random() < SHIRAN_FLEE_RATE){
        // シランちゃんは、攻撃が命中する寸前でも一定確率で逃げ出す（正解でも不正解でも「逃げる可能性」を持たせるため）
        fled = true;
      }else if(b.boss.fixedHitTurns){
        /* 無心さん専用：攻撃力無効化（2026-08-09〜、教員の指示）。ステータス・会心を一切参照せず、
           通常攻撃は必ずbossMaxHp/fixedHitTurnsだけ削る固定ダメージにする（＝通常攻撃だけなら
           必ずfixedHitTurnsターンかかる）。必殺技は教員の指示で特別扱いとし対象外
           （bossResolveFinisherは通常どおりの計算のまま、必殺技を使えば早く倒せる）。 */
        dealt = Math.max(1, Math.round(b.bossMaxHp / b.boss.fixedHitTurns));
        if(gateActive && b.bossHp - dealt <= 0){
          evaded = true;
          dealt = 0;
        }else{
          b.bossHp = Math.max(0, b.bossHp - dealt);
        }
      }else{
        dealt = randInt(BOSS_PLAYER_DMG[0], BOSS_PLAYER_DMG[1]) + ps.atk * STAT_ATK_PER_POINT + (b.atkBuffTurns > 0 ? b.atkBuffAmount : 0);
        // さびついたノコギリ等の「次のターンだけ攻撃力n倍」効果（攻撃力依存の倍率、既存の加算式atkBuffとは別枠）
        if(b.atkMultTurns > 0) dealt = Math.round(dealt * b.atkMultAmount);
        // 聖輝「光の高揚」：発動ずみぶんの永続倍率（複利、上限なし）。通常攻撃にも乗る
        if(b.kotonohaAtkMultStack && b.kotonohaAtkMultStack !== 1) dealt = Math.round(dealt * b.kotonohaAtkMultStack);
        const effLuck = ps.luck + (b.luckBuffTurns > 0 ? b.luckBuffAmount : 0);
        const critChance = luckCritChancePct(effLuck, st);
        if(Math.random() * 100 < critChance){
          crit = true;
          dealt = Math.round(dealt * STAT_CRIT_MULT);
        }
        // 必殺技以外の通常攻撃はダメージが半減するボス（無敵艦隊１年３組）。bossResolveFinisher
        // （必殺技専用の別関数）は参照していないので、この分岐は必殺技には一切影響しない。
        if(b.boss.atkHalvedUnlessFinisher) dealt = Math.max(1, Math.round(dealt * 0.5));
        // 漫画が好きなウルトラK専用：プレイヤーの与ダメージが常に半分になる（教員の指示）
        if(b.boss.playerAtkHalved) dealt = Math.max(1, Math.round(dealt * 0.5));
        /* ぶらぶら歩く人専用：ミスするたびに3倍に複利で積み上がる防御力。2026-07-23、教員の指示で
           「正解しても防御力の跳ね上がりは解除しない（上がったら維持）」に改訂した（bossGrade側で
           b.bossDefMissStreakをリセットする行を削除済み）。必殺技（bossResolveFinisher、別関数）は
           このb.bossDefMissStreakを一切参照しないため、素のboss.defPctのみが適用される＝この
           跳ね上がった防御力の影響を受けない（教員の指示どおり）。通常攻撃だけでは実質的に
           勝てなくなる（Node.jsシミュレータで8割正解ペース・必殺技なしは勝率3.6%）ほど厳しい
           設計になるが、「必殺技を覚えてこそ倒せるボス」という位置づけとして教員が了承済み。 */
        const effBossDefPct = b.boss.defTripleOnMiss
          ? (b.boss.defPct||0) * Math.pow(3, b.bossDefMissStreak||0)
          : (b.boss.defPct||0);
        dealt = Math.max(1, Math.round(dealt * (1 - effBossDefPct / 100)));
        /* 極端な攻撃力特化ビルド対策（2026-08-03〜、教員の指示）。適正経験値5000以上のボス限定で、
           通常攻撃1発あたりの上限をボス最大HPの33%に固定する。必殺技（bossResolveFinisher、
           完全に別関数・別のdealt計算）はこの上限の対象外。鉄壁の守衛さん専用のnonCritCapPct
           （会心以外は最大HPの5%までしか通らない、2026-08-09〜、教員の指示）を持つ場合は
           そちらを優先し、会心のときだけ既存の33/40%上限を適用する。 */
        if(b.boss.nonCritCapPct && !crit){
          dealt = Math.min(dealt, Math.max(1, Math.round(b.bossMaxHp * b.boss.nonCritCapPct)));
        }else if((b.boss.recPts||0) >= NORMAL_ATK_CAP_MIN_RECPTS){
          dealt = Math.min(dealt, Math.max(1, Math.round(b.bossMaxHp * NORMAL_ATK_MAX_HIT_PCT)));
        }
        if(gateActive && b.bossHp - dealt <= 0){
          // 経験値ゲート・ルール①：とどめの一撃は必ず回避される（会心も含め、なかったことにする）
          evaded = true;
          crit = false;
          dealt = 0;
        }else if(b.boss.surviveFinisherAtOne && !b._survivedFinisher && b.bossHp - dealt <= 0){
          // キングスライムなおじい専用：とどめの一撃を一度だけ耐えてHPを1残す（2回目以降のとどめは普通に0まで減る）
          dealt = b.bossHp - 1;
          b.bossHp = 1;
          b._survivedFinisher = true;
          survived = true;
        }else{
          b.bossHp = Math.max(0, b.bossHp - dealt);
        }
      }
    }
  }else{
    // 不正解で「連続」が途切れるので、必殺技ゲージもリセットする。
    // ただし冥淵は成人体（KOTONOHA_MEIEN_GAUGE_GRACE_STAGE）以降、1回のミスだけなら
    // ゲージが解除されない（2回連続でミスして初めてリセットされる、教員の指示、2026-08-08〜）。
    b.correctStreak = 0;
    const meienGraceActive = st.kotonohaRebirth && st.kotonohaRebirth.line === "meien"
      && kotonohaRebirthStageIndex(st) >= KOTONOHA_MEIEN_GAUGE_GRACE_STAGE;
    if(meienGraceActive){
      b.kotonohaMeienMissStreak = (b.kotonohaMeienMissStreak||0) + 1;
      if(b.kotonohaMeienMissStreak >= 2){
        b.finisherGauge = 0;
        b.kotonohaMeienMissStreak = 0;
      }else{
        meienGraceUsed = true;
      }
    }else{
      b.finisherGauge = 0;
    }
    b.kotonohaFinisherUseLine = false;
    if(b.boss.defTripleOnMiss) b.bossDefMissStreak = (b.bossDefMissStreak||0) + 1;
    // ゲームマニア８９専用：プレイヤーが不正解のとき、自分の最大HPの一定割合を回復する
    if(b.boss.healOnMissPct) b.bossHp = Math.min(b.bossMaxHp, b.bossHp + Math.round(b.bossMaxHp * b.boss.healOnMissPct));
    if(b.boss.fleeAfterMisses){
      // 人間型掃除機専用：プレイヤーが通算でこの回数まちがえると、その場で戦闘を打ち切って逃げる
      b.missCount = (b.missCount||0) + 1;
      if(b.missCount >= b.boss.fleeAfterMisses) bossQuit = true;
    }
  }
  /* 経験値ゲート・ルール②③のための下準備：このターンに与えたダメージを、ボスの最大HPに
     対する割合として記録しておく（0〜1、何も与えていなければ0）。また「攻撃ミス」（不正解、
     または正解したが回避された＝①のとどめ回避も含む）かどうかも記録する。実際の反撃計算は
     bossCounterAttack側で行う（こちらはgateActiveのときだけ意味を持つ値）。 */
  b._gateDealtPct = b.bossMaxHp > 0 ? dealt / b.bossMaxHp : 0;
  b._gateWasMiss = !ok || evaded;
  refreshBossHpBars();
  if(!Array.isArray(it.ans)){
    const btns = screen.querySelectorAll(".choice");
    btns.forEach((btn,pos)=>{
      const oi = b.order[pos];
      btn.disabled = true;
      if(oi===it.a) btn.classList.add("correct");
      else if(oi===chosenOrig) btn.classList.add("wrong");
      else btn.classList.add("dim");
    });
  }
  const fb = document.getElementById("fb");
  fb.className = "feedback show " + (ok?"ok":"ng");
  let expl;
  if(Array.isArray(it.ans)){
    const wrongMsg = ok ? "" : `正解は「${esc(it.ans.join("」または「"))}」（こたえ：${esc(typed||"")}）`;
    expl = [wrongMsg, it.e ? esc(it.e) : ""].filter(Boolean).join("<br>");
  }else{
    expl = it.e ? esc(it.e) : (ok ? "" : `正解は「${esc(it.c[it.a])}」`);
  }
  const dmgMsg = ok
    ? (fled
        ? `<span class="lvup-chip">😲すんでのところで${esc(b.boss.name)}に逃げられた！</span>`
        : evaded
        ? `${lowSpdTaunt ? `<span class="lvup-chip">😤${esc(b.boss.name)}「${esc(lowSpdTaunt)}」</span>` : ""}<span class="lvup-chip">💨${esc(b.boss.name)}に回避された！</span>`
        : survived
        ? `<span class="lvup-chip">${esc(b.boss.name)}に ${dealt} ダメージ！ しかしギリギリ耐えた…！</span>`
        : `<span class="lvup-chip">${crit ? "💥会心の一撃！ " : ""}${esc(b.boss.name)}に ${dealt} ダメージ！</span>`)
    : (b.boss.healOnMissPct ? `<span class="lvup-chip">💚${esc(b.boss.name)}のHPが少し回復した！</span>` : "")
      + (meienGraceUsed ? `<span class="lvup-chip">🌑必殺技ゲージは崩れなかった！</span>` : "");
  const streakMsg = (ok && b.boss.streakToWin) ? `<span class="lvup-chip">🔥連続正解 ${b.correctStreak} / ${b.boss.streakToWin}</span>` : "";
  fb.innerHTML = `<div class="verdict">あなたのターン　${ok?"○ 正解！":(timedOut?"⏰ 時間切れ…":"× ざんねん…")}${dmgMsg}${streakMsg}</div>${expl}`;
  if(bossQuit){
    // 人間型掃除機専用：規定回数まちがえたので、反撃を挟まずその場で逃げていく（結果画面はシランちゃんと共用）
    fb.innerHTML += `<div class="boss-turn">💨 ${esc(b.boss.name)}は、動きを止めるとそのまま去っていった…。</div>`;
    bossBattle._resolving = true;
    setTimeout(() => { if(bossBattle && bossBattle._resolving) shiranFlee(); }, 1300);
    return;
  }
  if(fled){
    // 命中する寸前で逃げられたときは反撃も発生せず、少し間をおいて逃走の結果画面へ
    bossBattle._resolving = true;
    setTimeout(() => { if(bossBattle && bossBattle._resolving) shiranFlee(); }, 1300);
    return;
  }
  if(b.bossHp <= 0 || (ok && b.boss.streakToWin && b.correctStreak >= b.boss.streakToWin)){
    // ボスを倒した（HPが尽きた、または目標連続正解数に達した）ときは反撃は発生せず、
    // 少し間をおいて自動的に結果画面へ（この2つの勝利条件は並列。どちらが先に成立してもよい）
    bossBattle._resolving = true;
    setTimeout(() => { if(bossBattle && bossBattle._resolving) bossWin(); }, 1300);
    return;
  }
  if(b.boss.instantLoseOnWrong && !ok){
    // 反撃をしないボス（国語の神）は、間違えた瞬間にそのままプレイヤーのHPが尽きて敗北する
    b.playerHp = 0;
    refreshBossHpBars();
    fb.innerHTML += `<div class="boss-turn">😇 ${esc(b.boss.name)}は、動かない。</div>`;
    bossBattle._resolving = true;
    setTimeout(() => { if(bossBattle && bossBattle._resolving) bossLose(); }, 1300);
    return;
  }
  if(b.boss.instantLoseOnWrong && ok){
    // 反撃をしないボスは、正解しても（目標連続正解数に届かない限り）反撃を挟まずそのまま次の問題へ
    fb.innerHTML += `<div class="boss-turn">😇 ${esc(b.boss.name)}は、動かない。</div>`;
    const nextBtn = document.getElementById("nextBtn");
    nextBtn.style.display = "inline-block";
    nextBtn.textContent = "つぎへ";
    nextBtn.focus();
    return;
  }
  bossBattle._resolving = true;
  setTimeout(() => { if(bossBattle && bossBattle._resolving) bossCounterAttack(ok); }, 1000);
}
/* ボスの通常反撃1発ぶんのダメージ計算だけを切り出したもの（命中判定はしない＝呼び出し側で
   既にヒット確定した後の「威力」計算のみを担う）。bossCounterAttackの元々の通常分岐と、
   doubleAttackボス用のbossCounterAttackDoubleHitの両方から共用する（2026-08-18〜）。 */
function bossComputeHitDamage(b, st, ps, range, atkGrowthTurn){
  const effDef = ps.def + (b.defBuffTurns > 0 ? b.defBuffAmount : 0) + (b.kotonohaDefBuffAmount||0);
  let effAtk = defGateActive(effDef, st) ? (b.boss.atk||1) * DEF_GATE_ATK_MULT : (b.boss.atk||1);
  if(b.boss.lowDefAtkDouble && effDef < b.boss.lowDefAtkDouble.threshold){
    effAtk *= b.boss.lowDefAtkDouble.mult;
  }
  if(b.boss.selfHpAtkBoost){
    const cfg = b.boss.selfHpAtkBoost;
    const hpRatio = b.bossMaxHp > 0 ? b.bossHp / b.bossMaxHp : 1;
    effAtk *= (hpRatio < cfg.hpThreshold ? cfg.lowMult : cfg.normalMult);
  }
  if(b.boss.atkGrowthPerTurn) effAtk *= Math.pow(b.boss.atkGrowthPerTurn, atkGrowthTurn);
  let raw = randInt(range[0], range[1]) * effAtk;
  let crit = false;
  if(Math.random() * 100 < (b.boss.luck||0)){
    crit = true;
    raw *= 1.5;
  }
  const defReduction = cappedDefReduction(effDef, b.boss);
  let dmg = Math.max(1, Math.round(raw * (1 - defReduction)));
  if(b.defCutBuffTurns > 0) dmg = Math.max(1, Math.round(dmg * (1 - b.defCutBuffAmount)));
  return {crit, dmg};
}
/* doubleAttackボス（ロボットに乗ったくらちゃん）専用：1ターンに独立した2発を撃つ。
   命中判定・ダメージ計算はそれぞれ別抽選（片方だけ回避／会心もありうる）。バフのターン消費は
   通常の反撃と同じく「1ターンにつき1回」なので、2発ぶん計算し終えたあとにまとめて減らす。
   演出は1発目を即表示→画面シェイク＋「追撃」メッセージ→2発目、と時間差で出すことで、
   1回の反撃で終わらない「二段攻撃」であることが見た目でもはっきりわかるようにする。 */
function bossCounterAttackDoubleHit(b, hitChance, range, atkGrowthTurn, st, ps){
  const rollHit = () => {
    if(Math.random() >= hitChance) return {evaded:true, crit:false, dmg:0};
    const r = bossComputeHitDamage(b, st, ps, range, atkGrowthTurn);
    return {evaded:false, crit:r.crit, dmg:r.dmg};
  };
  const hit1 = rollHit();
  const hit2 = rollHit();
  if(b.atkBuffTurns > 0) b.atkBuffTurns--;
  if(b.defBuffTurns > 0) b.defBuffTurns--;
  if(b.luckBuffTurns > 0) b.luckBuffTurns--;
  if(b.atkMultTurns > 0) b.atkMultTurns--;
  if(b.defCutBuffTurns > 0) b.defCutBuffTurns--;
  if(b.evadeBuffTurns > 0) b.evadeBuffTurns--;
  if(b.accBuffTurns > 0) b.accBuffTurns--;
  const fb = document.getElementById("fb");
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.style.display = "none";
  const applyHit = (r, label) => {
    if(!r.evaded) b.playerHp = Math.max(0, b.playerHp - r.dmg);
    refreshBossHpBars();
    fb.innerHTML += r.evaded
      ? `<div class="boss-turn">👹 ${esc(b.boss.name)}の${label}。💨あなたはこうげきを回避した！</div>`
      : `<div class="boss-turn">👹 ${esc(b.boss.name)}の${label}。${r.crit ? "🔥ボスの会心の一撃！ " : ""}あなたは ${r.dmg} ダメージを受けた。</div>`;
  };
  applyHit(hit1, "1段目の攻撃");
  setTimeout(() => {
    if(bossBattle !== b) return; // 待っている間に戦闘が終了・リセットされていたら何もしない
    triggerFinisherShake();
    fb.innerHTML += `<div class="boss-turn">🤖 ${esc(b.boss.name)}は、すかさず追撃してきた！</div>`;
    setTimeout(() => {
      if(bossBattle !== b) return;
      applyHit(hit2, "2段目の攻撃");
      nextBtn.style.display = "inline-block";
      nextBtn.textContent = b.playerHp<=0 ? "けっかを見る" : "つぎへ";
      nextBtn.focus();
    }, 700);
  }, 550);
}
function bossCounterAttack(playerWasCorrect){
  const b = bossBattle;
  /* 翠森「眠りの胞子」：眠っている間はボスの反撃ターンそのものを丸ごとスキップする

     眠ったまま、2ターン目以降は毎ターンkotonohaSleepWakeChanceの確率で目覚める。目覚めた
     ターンは「目を覚ました！」のメッセージだけを出してそのターンを消費し、反撃はしない
     （教員の指示、2026-08-07〜。以前は目覚めたターンにそのまま反撃していたが、目覚める

  if((b.kotonohaSleepTurnsLeft||0) > 0){

    b.kotonohaSleepFirstTurnDone = true;

    refreshBossHpBars();
    const fb = document.getElementById("fb");
    fb.innerHTML += woke
      ? `<div class="boss-turn">💤${esc(b.boss.name)}は、目を覚ました！</div>`
      : `<div class="boss-turn">💤${esc(b.boss.name)}は、眠っていて動けない。</div>`;
    const nextBtn = document.getElementById("nextBtn");
    nextBtn.style.display = "inline-block";
    nextBtn.textContent = "つぎへ";
    nextBtn.focus();
    return;
  }
  if(bossXpGateActive(b.boss, loadStats())){
    /* 経験値ゲート・ルール②③：命中判定・防御力・ミス回避アイテムなどを一切介さない反撃。
       「攻撃ミス」（不正解、または正解したが回避された＝とどめ回避も含む）のときはルール③
       （プレイヤー最大HPの35%固定）、命中したときはルール②（与えたダメージ割合+1%）。
       メッセージは通常の反撃と同じ文面にして、特別な仕組みだと気付かれにくいようにしている
       （教員から「経験値ゲートが露骨すぎる」との指摘を受けての改訂のため、専用の説明文は
       あえて出さない）。 */
    const pct = b._gateWasMiss ? BOSS_XP_GATE_MISS_PCT : (b._gateDealtPct||0) + BOSS_XP_GATE_COUNTER_EXTRA;
    const taken = Math.max(1, Math.round(b.playerMaxHp * pct));
    b.playerHp = Math.max(0, b.playerHp - taken);
    refreshBossHpBars();
    const fb = document.getElementById("fb");
    fb.innerHTML += `<div class="boss-turn">👹 ${esc(b.boss.name)}のターン。あなたは ${taken} ダメージを受けた。</div>`;
    const nextBtn = document.getElementById("nextBtn");
    nextBtn.style.display = "inline-block";
    nextBtn.textContent = b.playerHp<=0 ? "けっかを見る" : "つぎへ";
    nextBtn.focus();
    return;
  }
  if(b.boss.isShiran){
    if(Math.random() < SHIRAN_FLEE_RATE){
      shiranFlee();
      return;
    }
    refreshBossHpBars();
    const fb = document.getElementById("fb");
    fb.innerHTML += `<div class="boss-turn">👹 ${esc(b.boss.name)}のターン。シランちゃんは、校歌を熱唱した。しかし、特に何も起こらない。</div>`;
    const nextBtn = document.getElementById("nextBtn");
    nextBtn.style.display = "inline-block";
    nextBtn.textContent = "つぎへ";
    nextBtn.focus();
    return;
  }
  if(b.boss.statIgnore){
    // ステータス無視のボス：命中判定・ミス回避アイテム・防御力を一切考慮せず、playerMaxHpに対する
    // 固定%レンジ（正解時counterOk〜、不正解時counterNg〜）のランダムダメージを必ず与える。
    const min = playerWasCorrect ? b.boss.counterOkMin : b.boss.counterNgMin;
    const max = playerWasCorrect ? b.boss.counterOkMax : b.boss.counterNgMax;
    const pct = min + Math.random() * (max - min);
    const taken = Math.max(1, Math.round(b.playerMaxHp * pct));
    b.playerHp = Math.max(0, b.playerHp - taken);
    refreshBossHpBars();
    const fb = document.getElementById("fb");
    fb.innerHTML += `<div class="boss-turn">👹 ${esc(b.boss.name)}のターン。あなたは ${taken} ダメージを受けた。</div>`;
    const nextBtn = document.getElementById("nextBtn");
    nextBtn.style.display = "inline-block";
    nextBtn.textContent = b.playerHp<=0 ? "けっかを見る" : "つぎへ";
    nextBtn.focus();
    return;
  }
  if(playerWasCorrect && b.boss.counterOkFixedMin != null){
    /* 無敵艦隊１年３組専用：正解した場合の反撃は、素早さ・回避には一切関係なく必ず命中する
       （教員の指示、「無敵」の演出）。不正解の場合はこの分岐を通らず、下の既存の通常式
       （両者のステータス依存）にそのまま流れる。
       【2026-07-21改訂】当初はb.playerMaxHpに対する固定%（素早さだけでなくHP・防御力にも
       一切影響されない）だったが、教員から「HP・防御力にも意味を持たせたい」との指示があり、
       ①割合の基準を「実際のplayerMaxHp」ではなく「基準HP」（`BOSS_PLAYER_HP+recPts`、
       ちょうど適正経験値ぶんを均等配分＝HPに1/5を振った場合のplayerMaxHpと一致する定数）に
       変更（HPを基準より多く盛った分だけ、相対的な被ダメージ割合が薄まる）、②防御力による
       軽減（既存の`bossDefHalfPoint`式、他ボスの通常反撃と同じ逓減カーブ）を追加。素早さ・
       回避だけは引き続き無関係のまま（「当たったら避けようがない」という無敵艦隊のコンセプト
       は据え置き）。基準どおり均等配分（HP・防御力とも1/5）した場合の体感割合は、軽減後も
       ちょうど8〜10%程度になるよう`counterOkFixedMin/Max`側の数値を調整済み（防御力ゼロだと
       素の16〜20%をまるごと受ける／HP・防御力を基準より厚く盛ればさらに軽くなる）。 */
    const st2 = loadStats();
    const ps2 = st2.stats || {hp:0,atk:0,def:0,spd:0,luck:0};
    const referenceHp = BOSS_PLAYER_HP + (b.boss.recPts||0);
    const pct = b.boss.counterOkFixedMin + Math.random() * (b.boss.counterOkFixedMax - b.boss.counterOkFixedMin);
    let taken = Math.round(referenceHp * pct);
    const effDef2 = ps2.def + (b.defBuffTurns > 0 ? b.defBuffAmount : 0);
    const defReduction2 = cappedDefReduction(effDef2, b.boss);
    taken = Math.max(1, Math.round(taken * (1 - defReduction2)));
    // 防御力アップ系アイテム（座布団等）：防御力ステータスとは別枠で被ダメージをさらに割合カットする
    if(b.defCutBuffTurns > 0) taken = Math.max(1, Math.round(taken * (1 - b.defCutBuffAmount)));
    b.playerHp = Math.max(0, b.playerHp - taken);
    if(b.atkBuffTurns > 0) b.atkBuffTurns--;
    if(b.defBuffTurns > 0) b.defBuffTurns--;
    if(b.luckBuffTurns > 0) b.luckBuffTurns--;
    if(b.atkMultTurns > 0) b.atkMultTurns--;
    if(b.defCutBuffTurns > 0) b.defCutBuffTurns--;
    if(b.evadeBuffTurns > 0) b.evadeBuffTurns--;
    if(b.accBuffTurns > 0) b.accBuffTurns--;
    refreshBossHpBars();
    const fb = document.getElementById("fb");
    fb.innerHTML += `<div class="boss-turn">👹 ${esc(b.boss.name)}のターン。あなたは ${taken} ダメージを受けた。</div>`;
    const nextBtn = document.getElementById("nextBtn");
    nextBtn.style.display = "inline-block";
    nextBtn.textContent = b.playerHp<=0 ? "けっかを見る" : "つぎへ";
    nextBtn.focus();
    return;
  }
  const range = playerWasCorrect ? BOSS_DMG_ON_CORRECT : BOSS_DMG_ON_WRONG;
  const st = loadStats();
  const ps = kotonohaEffStats(st);
  const accuracy = b.boss.accuracy || 100;
  const evasionHalfPoint = STAT_SPD_EVASION_HALF_POINT_BASE * (accuracy / 100);
  /* 回避率アップ系アイテム（掃除機等）：素早さによる回避率（上限35%）とは別枠でamount(pt)を上乗せ。
     アイテム込みでも際限なく100%に近づかないよう、合計は90%で頭打ちにする（2026-08-09〜、教員の指示）。 */
  const baseEvasionPct = STAT_SPD_EVASION_MAX_PCT * ps.spd / (ps.spd + evasionHalfPoint);
  const evasionPct = Math.min(90, baseEvasionPct + (b.evadeBuffTurns > 0 ? b.evadeBuffAmount : 0));
  const hitChance = 1 - evasionPct / 100;
  let taken = 0, bossCrit = false, playerEvaded = false, guarded = false;
  /* ロボットに乗ったくらちゃん専用：命中/回避に関わらず「反撃のターンそのもの」を数えて、
     攻撃力を複利で伸ばす（教員の指示で上限なし）。命中判定より前に消費しておくことで、
     ミス回避・回避で不発だったターンも1ターンとしてきちんとカウントされる。 */
  const atkGrowthTurn = b.atkGrowthTurns||0;
  if(b.boss.atkGrowthPerTurn) b.atkGrowthTurns = atkGrowthTurn + 1;
  if(!playerWasCorrect && b.missGuard){
    // ミス回避アイテムの効果：まちがえたターンのダメージを1回だけ完全に防ぐ
    b.missGuard = false;
    guarded = true;
  }else if(b.boss.doubleAttack){
    // ロボットに乗ったくらちゃん専用：1ターンに独立した2発を撃つ（詳細はbossCounterAttackDoubleHit参照）
    bossCounterAttackDoubleHit(b, hitChance, range, atkGrowthTurn, st, ps);
    return;
  }else if(Math.random() >= hitChance){
    playerEvaded = true;
  }else if(b.boss.fixedDamageRange){
    /* のろいのカラクリ人形専用：命中すれば防御力に関係なく固定レンジのダメージを必ず与える
       （2026-08-09〜、教員の指示）。命中/回避の判定（素早さ）は上のhitChanceでこれまでどおり
       行っており、防御力だけを無視する（回避には関係する）。 */
    taken = randInt(b.boss.fixedDamageRange.min, b.boss.fixedDamageRange.max);
    b.playerHp = Math.max(0, b.playerHp - taken);
  }else{
    const r = bossComputeHitDamage(b, st, ps, range, atkGrowthTurn);
    bossCrit = r.crit;
    taken = r.dmg;
    b.playerHp = Math.max(0, b.playerHp - taken);
  }
  if(b.atkBuffTurns > 0) b.atkBuffTurns--;
  if(b.defBuffTurns > 0) b.defBuffTurns--;
  if(b.luckBuffTurns > 0) b.luckBuffTurns--;
  if(b.atkMultTurns > 0) b.atkMultTurns--;
  if(b.defCutBuffTurns > 0) b.defCutBuffTurns--;
  if(b.evadeBuffTurns > 0) b.evadeBuffTurns--;
  if(b.accBuffTurns > 0) b.accBuffTurns--;
  refreshBossHpBars();
  const fb = document.getElementById("fb");
  fb.innerHTML += guarded
    ? `<div class="boss-turn">👹 ${esc(b.boss.name)}のターン。✨ミス回避が発動！ダメージを受けなかった！</div>`
    : playerEvaded
    ? `<div class="boss-turn">👹 ${esc(b.boss.name)}のターン。💨あなたはこうげきを回避した！</div>`
    : `<div class="boss-turn">👹 ${esc(b.boss.name)}のターン。${bossCrit ? "🔥ボスの会心の一撃！ " : ""}あなたは ${taken} ダメージを受けた。</div>`;
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.style.display = "inline-block";
  nextBtn.textContent = b.playerHp<=0 ? "けっかを見る" : "つぎへ";
  nextBtn.focus();
}
/* 焔獄「火傷」の毎ターンダメージ。正解/不正解・通常攻撃/必殺技のどのターンでも一律で発動する
   唯一の場所がbossAdvance()（両方の分岐が最終的にここを通ってから次の問題に進む）なので、
   ここに1箇所だけ実装すれば「毎ターン」を漏れなく満たせる（2026-08-02〜）。焔獄の必殺技を
   使っていない・まだ火傷を負わせていない戦闘では`kotonohaBurnPct`が0のままなので、他ボス・
   他系統には一切影響しない。ボスを倒した場合はtrueを返し、呼び出し元はbossNextQuestion()を
   呼ばずに終わる（勝利画面への遷移はここで仕込むsetTimeoutが担当）。 */
function kotonohaBurnTick(){
  const b = bossBattle;
  if(!b || !(b.kotonohaBurnPct > 0) || b.bossHp <= 0) return false;
  const dmg = Math.max(1, Math.round(b.bossMaxHp * b.kotonohaBurnPct));
  b.bossHp = Math.max(0, b.bossHp - dmg);
  b._burnMsg = `🔥火傷のダメージとして${dmg}ダメージ加えて与えた！`;
  refreshBossHpBars();
  if(b.bossHp <= 0){
    b._resolving = true;
    setTimeout(() => { if(bossBattle === b && bossBattle._resolving) bossWin(); }, 1300);
    return true;
  }
  return false;
}
function bossAdvance(){
  const b = bossBattle;
  if(!b || b.bossHp <= 0) return;
  b._resolving = false;
  if(b.playerHp <= 0){ bossLose(); return; }
  if(kotonohaBurnTick()) return;
  bossNextQuestion();
}
function bossWin(){
  const b = bossBattle;
  const st = loadStats();
  /* dropAccuracyThresholdを持つボスは、直近30回の正答率（分野をまたぐrecentAccAll、挑戦チケットでの
     撃破も区別しない）に応じてアイテムのドロップ確率がグラデーションで変わる（bossItemDropChance参照、
     2026-07-17〜）。持たないボス（旧6体・シランちゃん・国語の神）は今までどおり無条件100%。
     さらにitemDropPity:trueを持つボス（サノー・シゲっち）は、2回連続で落とさなかった次（3回目）を
     確定ドロップにする救済つき（st.bossItemPity）。 */
  const itemPityForced = b.boss.itemDropPity && (st.bossItemPity[b.boss.id]||0) >= BOSS_ITEM_DROP_PITY_MAX;
  const dropsLoot = itemPityForced || Math.random() < bossItemDropChance(b.boss, st);
  if(b.boss.itemDropPity){
    st.bossItemPity[b.boss.id] = dropsLoot ? 0 : (st.bossItemPity[b.boss.id]||0) + 1;
  }
  let gotTreasure = false;
  if(dropsLoot){
    if(b.boss.treasureAccGate){
      /* 国語の神専用：宝具のドロップは、天井（bossPity）や基本確率（BOSS_TREASURE_RATE）とは無関係に、
         「出会った時点」の直近30回正答率（rollBossEncounterでスナップショットしたb.boss._encounterAcc）が
         treasureAccGate(0.8)以上なら100%、それ未満なら0%という単純な二択で決まる。 */
      gotTreasure = typeof b.boss._encounterAcc === "number" && b.boss._encounterAcc >= b.boss.treasureAccGate;
    }else{
      st.bossPity[b.boss.id] = (st.bossPity[b.boss.id]||0) + 1;
      if(treasureDropAllowed(st)){
        if(st.bossPity[b.boss.id] >= BOSS_PITY_MAX){
          gotTreasure = true;
        }else if(Math.random() < BOSS_TREASURE_RATE){
          gotTreasure = true;
        }
      }
      if(gotTreasure) st.bossPity[b.boss.id] = 0;
    }
    st.items[b.boss.item] = (st.items[b.boss.item]||0) + 1;
    if(gotTreasure) st.items[b.boss.treasure] = (st.items[b.boss.treasure]||0) + 1;
  }
  saveStats(st);
  clearBossBattleState(); // 戦闘は終了済み。以降のリロードは結果画面ではなく通常起動に戻す
  screen.innerHTML = `
    <div class="boss-battle-screen boss-victory">
      <div class="boss-win-burst">✨🎉✨</div>
      <div class="boss-result-title big">勝利！！</div>
      <p class="boss-win-line">「${esc(b.boss.name)}」との戦いに勝利した！</p>
      ${b._burnMsg ? `<p class="boss-win-line">${esc(b._burnMsg)}</p>` : ""}
      ${dropsLoot
        ? `<p class="boss-win-line">「${esc(b.boss.name)}」は、<span class="drop-item">【${esc(b.boss.item)}】</span>を落とした！</p>`
        : `<p class="boss-win-line">しかし、アイテムは落とさなかった…</p><p class="note">※正答率が高くなると、アイテムが落ちやすくなります</p>`}
      ${gotTreasure ? `<p class="boss-treasure">✨ さらに、宝具<span class="drop-item treasure-drop">【${esc(b.boss.treasure)}】</span>を手に入れた！ ✨</p>` : ""}
      <div class="btn-row">
        <button class="btn tap-advance-btn" onclick="endBossBattle()">つづける</button>
        <button class="btn secondary" onclick="endBossBattle(); showItemCollection();">アイテム一覧を見る</button>
      </div>
    </div>`;
}
function bossLose(){
  const b = bossBattle;
  clearBossBattleState(); // 戦闘は終了済み。以降のリロードは結果画面ではなく通常起動に戻す
  screen.innerHTML = `
    <div class="boss-battle-screen">
      <div class="boss-result-title lose">力つきた…</div>
      <p>「${esc(b.boss.name)}」に敗れてしまった。またいどんでみよう。</p>
      <div class="btn-row">
        <button class="btn tap-advance-btn" onclick="endBossBattle()">つづける</button>
      </div>
    </div>`;
}
/* シランちゃんが逃げ出したときの結果画面（勝ちでも負けでもない、戦闘の強制終了） */
function shiranFlee(){
  const b = bossBattle;

  screen.innerHTML = `

  const fn = bossPromptResumeFn;
