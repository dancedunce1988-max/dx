    comboEl.classList.remove("pop"); void comboEl.offsetWidth; comboEl.classList.add("pop");
  }else comboEl.classList.remove("on","hot","blaze");
}
function bgBumpCombo(perfect){
  if(!perfect || BG.combo<1) return;
  const comboEl=bg$("bgCombo");
  comboEl.classList.remove("crit"); void comboEl.offsetWidth; comboEl.classList.add("crit");
  setTimeout(()=>comboEl.classList.remove("crit"), 600);
}

/* =========================================================================
   段の終わり：そのまま判定へ
   独立版にあった「留め」（時間の外でもう一度だけ確かめる画面）は廃止した
   （教員の指示：「止めは廃止」）。走り終えたら、そのまま結果画面へ進む。 */
/* イベント期間中の正解数を st.eventBonusEarned に保存する（クリア・失敗どちらも保存）。 */
function bgCommitEventExp(){
  const n = BG.eventCorrect||0;
  if(n <= 0) return;
  const st = loadStats();
  eventBonusAdd(st, "2026_09_bunsetsu", n);
  saveStats(st);
  BG.eventCorrect = 0;
}
function bgFinishStage(){
  if(BG.phase==="over") return;
  bgCommitEventExp();
  if(bgRaf){ cancelAnimationFrame(bgRaf); bgRaf=null; bgLastT=0; }
  BG.phase="over";
  bgShowResult();
}
/* ライフが尽きたときの強制終了。曲の途中でも、そこで即座に結果画面へ進む
   （クリアはできなかった扱いになる。bgShowResult側でBG.failedを見て分岐する）。 */
function bgFailStage(){
  if(BG.phase==="over") return;
  bgCommitEventExp();
  if(bgRaf){ cancelAnimationFrame(bgRaf); bgRaf=null; bgLastT=0; }
  BG.phase="over";
  BG.failed=true;
  bgShowResult();
}
/* =========================================================================
   結果：段位で返す（独立版のまま）
   ========================================================================= */
/* g.si（その区切りが属する文の番号）がBG.curSentence未満＝すでに解き終えた文だけを
   数える。以前は track.gaps 全体（＝用意した譜面の全問）を分母にしていたが、
   六の巻のように合格後もplayが続く「腕試し」区間を長く用意した巻では、まだ
   到達してすらいない先の問題まで「落とした」ことになってしまい正答率が不当に
   下がる（教員の指示、2026-08-20〜の「20問クリア後も出題を続ける」変更に対応）。
   最後まで到達した通常の巻ではBG.curSentence===sentences.lengthなので、
   この変更による見え方の違いは無い。 */
function bgNeedCount(){ return BG.track.gaps.filter(g=>g.need && !g.demo && g.si<BG.curSentence).length; }
/* 「まとめ」の巻（escalate:true）は、合格に必要な問数（clearCount、無ければcount）を
   解ききれたか（＝そこに達する前にライフが尽きて強制終了しなかったか）で合否を決める
   （教員の指示、2026-08-19〜：「◯問を攻略したら〈そこまで強制終了されなければ〉
   クリア」）。bgRankOfEscalateはbgShowResult側で「合格ラインに到達した」と判定された
   ときしか呼ばれない（BG.failedがfalseの通常クリアだけでなく、六の巻のように合格後の
   腕試し中に力尽きた場合も含む、2026-08-20〜）ので、ここに来た時点で合格（初伝以上）は
   確定している。正答率・会心率で、その中の段位（初伝〜皆伝）を決める。 */
function bgRankOfEscalate(){
  const need = bgNeedCount();
  const acc  = need ? BG.hit/need : 0;
  const pAcc = BG.hit ? BG.perfect/BG.hit : 0;
  const clean = BG.misses.filter(m=>m.kind!=="karaburi").length===0;
  if(acc>=1 && clean && pAcc>=0.8) return {mark:"皆　伝", good:true, msg:"最後まで一つも落とさず、会心も多かった。まとめは完全にものにした"};
  if(acc>=1 && clean)              return {mark:"免　許", good:true, msg:"切れ目は完璧に解ききった。あとは会心の精度だけ"};
  if(acc>=0.9)                     return {mark:"目　録", good:true, msg:"高い正答率で解ききった。落としたところだけ見ておこう"};
  return {mark:"初　伝", good:true, msg:"合格。最後まで解ききった。まとめの内容はひとまず身についた"};
}
function bgRankOf(){
  if(BG.stage.escalate) return bgRankOfEscalate();
  const need=bgNeedCount();
  const acc  = need ? BG.hit/need : 0;
  const pAcc = BG.hit ? BG.perfect/BG.hit : 0;
  const clean = BG.misses.filter(m=>m.kind!=="karaburi").length===0;
  if(acc>=1 && clean && pAcc>=0.8) return {mark:"皆　伝", good:true, msg:"一つも落とさず、拍にも乗りきった"};
  if(acc>=1 && clean)              return {mark:"免　許", good:true, msg:"切れ目は完璧。あとは拍を合わせるだけ"};
  if(acc>=0.9)                     return {mark:"目　録", good:true, msg:"あと少し。落としたところを見ておく"};
  if(acc>=0.75)                    return {mark:"初　伝", good:true, msg:"通った。同じ段をもう一度"};
  return {mark:"再　試", good:false, msg:"結果の解説を読んで、切れ目の見当からもう一度"};
}
/* まちがいの解説（結果画面用）。教員の指示：「間違ったところの解説は、きちんと
   間違った部分を示して、どこがどう間違ったか丁寧に解説して」。同じ文で複数
   まちがえていれば、その文をまとめて1つの見出しの下に並べる（chars配列は
   同じ文のgap同士でsame referenceを共有しているので、それをキーにグループ化する）。 */
function bgMistakeDetailHtml(){
  if(!BG.misses.length){
    return '<div class="tally"><h3>まちがいの解説</h3><div class="none">一度も斬りそこねなかった</div></div>';
  }
  const bySentence = new Map();
  const noLoc = [];
  BG.misses.forEach(mi=>{
    if(mi.chars){
      if(!bySentence.has(mi.chars)) bySentence.set(mi.chars, []);
      bySentence.get(mi.chars).push(mi);
    }else{
      noLoc.push(mi);
    }
  });
  let html = '<div class="tally"><h3>まちがいの解説</h3>';
  bySentence.forEach((items, chars) => {
    items.sort((a,b)=>a.ci-b.ci);
    html += '<div class="miss-sentence"><div class="miss-sentence-text">'+esc(chars.join(""))+'</div>'+
      items.map(mi => '<div class="miss-item"><div class="miss-head">'+esc(BG_MISS_LABEL[mi.kind].nm)+'</div>'+
        '<div class="miss-body">'+esc(bgExplainMiss(mi))+'</div></div>').join("")+
      '</div>';
  });
  if(noLoc.length){
    html += '<div class="miss-item"><div class="miss-head">'+esc(BG_MISS_LABEL.karaburi.nm)+'（'+noLoc.length+'回）</div>'+
      '<div class="miss-body">'+esc(bgExplainMiss(noLoc[0]))+'</div></div>';
  }
  html += '</div>';
  return html;
}
/* 「文節」編（一の巻〜三の巻、大太刀のみ）・「単語」編（四の巻〜六の巻、小刀のみ）・
   最後の巻（七の巻・免許皆伝）の区切り（教員の指示、2026-08-17〜。2026-08-19〜の
   7巻再編で、単語編は六の巻〈単語分けまとめ〉まで、最後の巻は七の巻に変更）。 */
const BG_BUNSETSU_STAGE_IDS = [1,2,3];
const BG_TANGO_STAGE_IDS = [4,5,6];
const BG_FINAL_STAGE_ID = 7;
/* 巻クリア（＋10）・オールクリアのお祝い（＋30）ぶんの経験値。以前の1文クリアぶんと違い、
   こちらは特定の分野レベルには結びつけない、達成お祝い型の経験値として、
   st.bunsetsuGiriBonusExp（百人一首のhyakuninBonusExpと同じ位置づけ）にそのまま足す。 */
function bgGrantBonusExp(amount){
  const st = loadStats();
  st.bunsetsuGiriBonusExp = (st.bunsetsuGiriBonusExp||0) + amount;
  saveStats(st);
}
function bgShowResult(){
  const fieldEl=bg$("bgField"), veilEl=bg$("bgVeil");
  fieldEl.classList.remove("peril");
  bg$("bgBtnCut").disabled=false; bg$("bgBtnKo").disabled=false;

  /* ライフが尽きた回は「クリアできず」の扱いにする（教員の指示、2026-08-15〜）。
     段位は付けず、自己ベスト・巻の解放・クリア経験値にも一切数えない。まちがいの解説は
     力尽きた回こそ大事なので、ここでも変わらず見せる。
     ただし、clearCountを持つ巻（六の巻）は、合格に必要な問数へすでに到達していれば、
     その後の「腕試し」区間で力尽きても不合格にはしない（教員の指示、2026-08-20〜：
     「クリアとなる20問以降も、問題は出続けるように」＝合格後に力尽きても合格は取り消さない）。 */
  const rawFailed = !!BG.failed;
  const clearedByCount = !!(BG.stage.clearCount && BG.curSentence >= BG.stage.clearCount);
  const trueFail = rawFailed && !clearedByCount;
  const lateFail = rawFailed && clearedByCount;
  const r = trueFail ? {mark:"力尽きた", good:false, msg:"ライフがなくなり、クリアできませんでした。もう一度挑戦してみよう。"} : bgRankOf();
  if(lateFail) r.msg = "合格ラインを超えたあとで力尽きましたが、記録は合格として残ります。　"+r.msg;
  bgSndRank(r.good);
  const key=BG.stage.id+"_"+BG.tempo.key;
  let isBest=false, opened=false, cleared=false, milestone=null;
  if(!trueFail){
    isBest = BG.score > (BG_BEST[key]||0);
    if(isBest) BG_BEST[key]=BG.score;
    const sid=BG.stage.id;
    if(!BG_REC.best[sid] || BG.score>BG_REC.best[sid]) BG_REC.best[sid]=BG.score;
    const wasRank = BG_REC.rank[sid];
    if(BG_RANK_ORDER[r.mark] > (wasRank!==undefined ? BG_RANK_ORDER[wasRank] : -1)) BG_REC.rank[sid]=r.mark;
    if(BG_RANK_ORDER[r.mark]>=1 && BG_REC.open===sid && sid<BG_STAGES.length){ BG_REC.open=sid+1; opened=true; }
    /* 巻を1つクリアするごとに＋10（教員の指示：「巻を一つクリアするごとに、経験値＋10を
       与える」。初伝以上ならクリア扱いで、同じ巻を何度クリアしても毎回もらえる）。 */
    cleared = BG_RANK_ORDER[r.mark] >= 1;
    if(cleared){
      bgGrantBonusExp(10);
      /* オールクリアのお祝い（＋30、ド派手な演出）は一度きり。BG_REC.rankを更新した
         あとで判定するので、「今回のクリアでちょうど揃った」瞬間を正しく検出できる。 */
      if(BG_BUNSETSU_STAGE_IDS.includes(sid) && !BG_REC.milestones.bunsetsu && BG_BUNSETSU_STAGE_IDS.every(id=>BG_REC.rank[id])){
        BG_REC.milestones.bunsetsu=true; bgGrantBonusExp(30);
        milestone={title:"「文節」編マスター達成！", sub:"一の巻〜三の巻を、すべて突破した"};
      }else if(BG_TANGO_STAGE_IDS.includes(sid) && !BG_REC.milestones.tango && BG_TANGO_STAGE_IDS.every(id=>BG_REC.rank[id])){
        BG_REC.milestones.tango=true; bgGrantBonusExp(30);
        milestone={title:"「単語」編マスター達成！", sub:"四の巻〜六の巻を、すべて突破した"};
      }else if(sid===BG_FINAL_STAGE_ID && !BG_REC.milestones.final){
        BG_REC.milestones.final=true; bgGrantBonusExp(30);
        milestone={title:"免許皆伝！全巻クリア！", sub:"七の巻を突破し、すべての巻を制した"};
      }
    }
    bgSaveRec();
  }

  /* 三の巻→四の巻の、得点によるもう一つの解放ルート。上のif(!trueFail)ブロックとは
     独立に判定するので、20問を解ききれず「力尽きた」扱いになった回でも、その回の
     得点が5000に届いていれば四の巻が解放される。 */
  if(BG.stage.id===3 && BG_REC.open===3 && BG.score>=BG_STAGE3_SCORE_UNLOCK){
    BG_REC.open=4;
    opened=true;
    bgSaveRec();
  }

/* =========================================================================
   得点発表（独立版のまま）
   ========================================================================= */
function bgAnimateScore(el, target){
  if(!el) return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const final = String(target);
  if(reduce){ el.textContent = final; return; }
  const len = final.length;
  const cur = new Array(len).fill("0");
  el.textContent = cur.join("");

  const SHUFFLE_MS = 480, STEP_MS = 45;
  let shuffled = 0;
  const shuffleTimer = setInterval(() => {
    for(let i=0;i<len;i++) cur[i] = String(Math.floor(Math.random()*10));
    el.textContent = cur.join("");
    shuffled += STEP_MS;
    if(shuffled >= SHUFFLE_MS){
      clearInterval(shuffleTimer);
      settle(0);
    }
  }, STEP_MS);

  function settle(i){
    if(i >= len){ el.textContent = final; return; }
    let rolls = 0;
    const rollTimer = setInterval(() => {
      cur[i] = String(Math.floor(Math.random()*10));
      el.textContent = cur.join("");
      rolls++;
      if(rolls >= 3){
        clearInterval(rollTimer);
        cur[i] = final[i];
        el.textContent = cur.join("");
        bgSndTick(true);
        setTimeout(() => settle(i+1), 45);
      }
    }, 40);
  }
}

/* 巻ごとのルールを、地の文で二・三文にまとめる（独立版のまま） */
function bgRuleProse(stage){
  const two = stage.blades.length===2;
  const unit = two
    ? "大太刀と小刀の二刀を使います。文節の変わり目は大太刀で、その中にある単語の切れ目は小刀で斬ります。"
    : stage.blades[0]==="bunsetsu"
      ? "使う刀は大太刀だけです。文節の切れ目を、大太刀で斬っていきます。"
      : "使う刀は小刀だけです。単語の切れ目を、すべて小刀で斬っていきます。";

  let support;
  if(stage.escalate){
    const clearN = stage.clearCount || stage.count;
    support = "支えは何もありません。出題はやさしい文からランダムに始まり、少しずつ難しく"+
      "なっていきます。速さは最初の"+BG_SPEED_GRACE+"問はそのまま、"+(BG_SPEED_GRACE+1)+"問目からは"+
      BG_SPEED_INTERVAL+"問ごとに際限なく上がり続けます（間違えても遅くはなりません）。"+
      (stage.clearCount
        ? clearN+"問を解ききれば合格です。そこから先も問題は出続け、速さも上がり続けます（腕試し）。"
        : "全"+clearN+"問を最後まで解ききれば合格です。");
  }else if(stage.hints && stage.demo){
    support = "切れ目にはあらかじめ印が出ていて、しかも最初にお手本も流れます。まずは見て、そのとおりに斬ってみてください。";
  }else if(stage.hints){
    support = "切れ目には緑の「ね」や横棒の印がもう出ています。迷うことはないので、拍に合わせて斬ることだけを考えてください。";
  }else if(stage.demo){
    support = "答えの印は出ませんが、同じ文が二回流れます。一回目は機械が斬ってみせるお手本なので、よく見てから、二回目に自分で真似て斬ってください。";
  }else{
    support = "支えは何もありません。自分の判断だけを頼りに、その場で答えていきます。";
  }
  return unit+" "+support;
}

     （教員の指示、2026-08-16〜）。段位を上げるための場ではなく、行き詰まったときに

     「7巻まで達成した場合の見た目は、シンプルにしたい。『〜巻』というボタンはやめて、
     『文節斬り』『単語斬り』『二刀斬り』『クリアした問題に挑戦』の四つだけに。細かい
     説明は付けない。『クリアした問題に挑戦』にすると、それまでの問題が挑戦できる形に

     このあと（allCleared && bgShowFullList）の通常一覧を出し直す。 */
  if(allCleared && !bgShowFullList){

      {id:3, label:"文節斬り"},

/* =========================================================================
   入力の取り付け・取り外し
   独立版は、静的ページの固定要素に一度だけaddEventListenerしていた。
   ここでは骨格HTMLを描くたびに（＝サブクエストへ入り直すたびに）付け直す必要が
   あるが、window直付けのkeydown/resizeだけは自動では外れない（ボキャブラ・
   シューティングのvsStopLoop/shoot.handlersと同じ理由）ので、bgHandlersに
   控えておき、bgStopLoopで明示的に外す。ボタン・field直付けの分は、骨格ごと
   screen.innerHTMLで捨てられるときに自動的に片づく。 */
let bgHandlers = null;
function bgAttachHandlers(){
  bg$("bgBtnSnd").addEventListener("click",()=>{
    BG_SND.on=!BG_SND.on;
    const b=bg$("bgBtnSnd");
    b.textContent=BG_SND.on?"♪ 入":"♪ 切";
    b.classList.toggle("off",!BG_SND.on);
    if(BG_SND.on) bgSndTick(true);
  });
  bg$("bgBtnCut").addEventListener("click",e=>{e.preventDefault(); bgSlash("bunsetsu");});
  bg$("bgBtnKo").addEventListener("click",e=>{e.preventDefault(); bgSlash("tango");});
  bg$("bgField").addEventListener("pointerdown",e=>{
    if(!BG || BG.phase!=="run") return;
    e.preventDefault();
    if(BG.stage.blades.length===1){ bgSlash(BG.stage.blades[0]); return; }
    const r=bg$("bgField").getBoundingClientRect();
    bgSlash((e.clientX-r.left)<r.width/2 ? "tango" : "bunsetsu");
  });
  const keydown = e=>{
    if(!BG || BG.phase!=="run") return;
    const one = BG.stage.blades.length===1;
    if(e.code==="Space"||e.key==="Enter"){
      e.preventDefault(); bgSlash(one?BG.stage.blades[0]:"bunsetsu"); return;
    }
    if(e.key==="ArrowRight"||e.key==="j"||e.key==="J"){
      e.preventDefault(); bgSlash(one?BG.stage.blades[0]:"bunsetsu"); return;
    }
    if(e.key==="ArrowLeft"||e.key==="f"||e.key==="F"){
      e.preventDefault(); bgSlash(one?BG.stage.blades[0]:"tango"); return;
    }
  };
  const resize = ()=>{ if(BG && (BG.phase==="run"||BG.phase==="countin")) bgBuildStrip(); };
  window.addEventListener("keydown", keydown);
  window.addEventListener("resize", resize);
  bgHandlers = {keydown, resize};
}
/* サブクエストを離れるとき（showHomeから呼ばれる）に、window直付けの
   リスナーとアニメーションループを止める。vsStopLoopと同じ役割。 */
function bgStopLoop(){
  if(bgRaf){ cancelAnimationFrame(bgRaf); bgRaf=null; }
  bgLastT=0;
  if(bgHandlers){
    window.removeEventListener("keydown", bgHandlers.keydown);
    window.removeEventListener("resize", bgHandlers.resize);
    bgHandlers=null;
  }
  BG=null;
}

function psShuffleCopy(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function psPickRandomCats(pool, count){
  return psShuffleCopy(pool).slice(0, count);
}

// そのレベルで十分に理解したと言える点数を取ると、次のレベルが解放される
const PS_LEVEL_UNLOCK_SCORE = { 1:4000, 2:4000, 3:4000, 4:4000, 5:4000, 6:4000 };

// 難易度が高いレベルほど、同じ動きでも多く得点できるようにする倍率
const PS_LEVEL_SCORE_MULT = { 6: 1.5 };
function psScoreMult(){ return PS_LEVEL_SCORE_MULT[psCurrentLevel] || 1; }

// レベル1-2:1000点ごと 3-4:900点ごと 5-6:800点ごと 7:500点ごとに「品詞」のジャンルレベルが1上がる。
// 1ラウンドで一気に上がるのは最大PS_GENRE_LV_CAPレベルまで（psEndGame参照）。
const PS_GENRE_LV_THRESHOLD = { 1:1000, 2:1000, 3:900, 4:900, 5:800, 6:800, 7:500 };
const PS_GENRE_LV_CAP = 20;

const PS_BOMB_TIME_MS = 20000;
const PS_DOUBLE_SCORE_MS = 10000;
const PS_ITEM_CHANCE = 0.06;
/* アイテムの葉（⏰・🔻）の出現率は、そのラウンドの得点が経験値上限
   （PS_GENRE_LV_THRESHOLD×PS_GENRE_LV_CAP）に近づくほど少しずつ下げていき、上限に達したら
   ちょうど0%になる（教員の指示、2026-08-21〜：経験値上限に達した後もアイテムに釣られて
   延々と遊び続けてしまうのを防ぐため。最初は上限到達で急に出なくなる作りにしていたが、
   「ぱたっと止まる」のではなく「だんだん減っていく」ほうが自然、との指示で変更）。 */
function psCurrentItemChance(){
  const threshold = PS_GENRE_LV_THRESHOLD[psCurrentLevel] || 1000;
  const capScore = threshold * PS_GENRE_LV_CAP;
  const remainRatio = capScore > 0 ? Math.max(0, 1 - psScore / capScore) : 1;
  return PS_ITEM_CHANCE * remainRatio;
}

/* ボーナスチャンス問題（2026-〜）：葉を1回消すたびに10%の確率で発生する品詞クイズ。
   発生中はメインの残り時間タイマーを止め（＝時間が止まる演出）、盤面操作もpsPlaying=falseで
   封じる。正解すると+15秒とスコア1.5倍タイムをもらえる、というボーナス版
   psActivateDoubleScore（転成名詞アイテムと同じ仕組み）。 */
const PS_BONUS_QUESTION_CHANCE = 0.10;
const PS_BONUS_QUESTION_TIME_MS = 10000;
const PS_BONUS_SETTLE_DELAY_MS = 420; // 葉が落ちて盤面が落ち着くのを待ってから出題する
const PS_BONUS_CORRECT_SHOW_MS = 1600;
const PS_BONUS_WRONG_SHOW_MS = 1100;
const PS_BONUS_REWARD_TIME_MS = 15000;
const PS_BONUS_REWARD_SCORE_MULT = 1.5;
const PS_BONUS_POS_CHOICES = ["名詞","動詞","形容詞","形容動詞","接続詞","連体詞","副詞","感動詞","助詞","助動詞"];

let psCols = 7, psRows = 8, psCell = 60;
let psCurrentLevel = 1;
let psActiveCats = [0,1];
let psWordPools = [];
let psBoard = [];
let psScore = 0, psBestCombo = 0, psTimeLeft = 60, psTimerId = null;
let psPlaying = false, psDragging = false, psChain = [];
let psBombModeActive = false, psBombEndTime = 0, psBombGaugeRAF = null;
let psDoubleScoreActive = false, psDoubleScoreTimer = null;
let psBonusActive = false, psBonusTimerId = null, psBonusCorrectName = null;
let psBonusRewardActive = false, psBonusRewardTimer = null;
let psReduceItemOnBoard = false;
let psIntroTimers = [];
let psHandlers = null;

let psAppEl=null, psBoardWrapEl=null, psSvgEl=null, psPopupLayerEl=null,
    psScoreValEl=null, psTimeValEl=null, psComboValEl=null, psLevelValEl=null,
    psOverlayEl=null, psOverlayCardEl=null, psLegendEl=null,
    psBombIconEl=null, psBombAlertEl=null, psBombGaugeWrapEl=null, psBombGaugeFillEl=null, psBombGaugeLabelEl=null,
    psPlayAreaEl=null, psBombPanelEl=null,
    psBonusOverlayEl=null, psBonusWordEl=null, psBonusTimerFillEl=null, psBonusChoicesEl=null, psBonusResultEl=null;

const ps$ = id => document.getElementById(id);

function psCacheDom(){
  psAppEl = ps$("psApp");
  psBoardWrapEl = ps$("psBoardWrap");
  psSvgEl = ps$("psLineSvg");
  psPopupLayerEl = ps$("psPopupLayer");
  psScoreValEl = ps$("psScoreVal");
  psTimeValEl = ps$("psTimeVal");
  psComboValEl = ps$("psComboVal");
  psLevelValEl = ps$("psLevelVal");
  psOverlayEl = ps$("psOverlay");
  psOverlayCardEl = ps$("psOverlayCard");
  psLegendEl = ps$("psLegend");
  psBombIconEl = ps$("psBombIcon");
  psBombAlertEl = ps$("psBombAlert");
  psBombGaugeWrapEl = ps$("psBombGaugeWrap");
  psBombGaugeFillEl = ps$("psBombGaugeFill");
  psBombGaugeLabelEl = ps$("psBombGaugeLabel");
  psPlayAreaEl = ps$("psPlayArea");
  psBombPanelEl = ps$("psBombPanel");
  psBonusOverlayEl = ps$("psBonusOverlay");
  psBonusWordEl = ps$("psBonusWord");
  psBonusTimerFillEl = ps$("psBonusTimerFill");
  psBonusChoicesEl = ps$("psBonusChoices");
  psBonusResultEl = ps$("psBonusResult");
}

function psClearIntroTimers(){
  psIntroTimers.forEach(id => { clearTimeout(id); clearInterval(id); });
  psIntroTimers = [];
}

/* サブクエストを離れるとき（showHomeから呼ばれる）に、ループ・タイマー・windowリスナーを
   確実に止める。bgStopLoopと同じ役割。 */
function psStopLoop(){
  if(psTimerId){ clearInterval(psTimerId); psTimerId = null; }
  if(psBombGaugeRAF){ cancelAnimationFrame(psBombGaugeRAF); psBombGaugeRAF = null; }
  if(psDoubleScoreTimer){ clearTimeout(psDoubleScoreTimer); psDoubleScoreTimer = null; }
  if(psBonusTimerId){ clearTimeout(psBonusTimerId); psBonusTimerId = null; }
  if(psBonusRewardTimer){ clearTimeout(psBonusRewardTimer); psBonusRewardTimer = null; }
  psClearIntroTimers();
  if(psHandlers){
    document.removeEventListener("pointermove", psHandlers.pointermove);
    document.removeEventListener("pointerup", psHandlers.pointerup);
    document.removeEventListener("pointercancel", psHandlers.pointercancel);
    window.removeEventListener("resize", psHandlers.resize);
    psHandlers = null;
  }
  psPlaying = false;
  psDragging = false;
  psBombModeActive = false;
  psDoubleScoreActive = false;
  psBonusActive = false;
  psBonusRewardActive = false;
  if(psAppEl) psAppEl.classList.remove("psBonusRewardBg");
  if(psBonusOverlayEl) psBonusOverlayEl.classList.remove("show");
}

function psAttachHandlers(){
  const pointermove = e => psOnPointerMove(e);
  const pointerup = e => psOnPointerUp(e);
  const pointercancel = e => psOnPointerUp(e);
  const resize = ()=>{
    if(!psPlaying) return;
    psSizeBoard();
    for(let r=0;r<psRows;r++) for(let c=0;c<psCols;c++){
      const cell = psBoard[r][c];
      if(cell) psPositionEl(cell.el, r, c);
    }
  };
  document.addEventListener("pointermove", pointermove, {passive:true});
  document.addEventListener("pointerup", pointerup, {passive:true});
  document.addEventListener("pointercancel", pointercancel, {passive:true});
  window.addEventListener("resize", resize);
  psHandlers = {pointermove, pointerup, pointercancel, resize};
}

function psActivateDoubleScore(){
  psDoubleScoreActive = true;
  if(psAppEl) psAppEl.classList.add("psDoubleScoreBg");
  clearTimeout(psDoubleScoreTimer);
  psDoubleScoreTimer = setTimeout(()=>{
    psDoubleScoreActive = false;
    if(psAppEl) psAppEl.classList.remove("psDoubleScoreBg");
  }, PS_DOUBLE_SCORE_MS);
}

function psStopDoubleScore(){
  psDoubleScoreActive = false;
  clearTimeout(psDoubleScoreTimer);
  psDoubleScoreTimer = null;
  if(psAppEl) psAppEl.classList.remove("psDoubleScoreBg");
}

/* ボーナス正解後の15秒間、得点1.5倍＋背景ピカピカ。転成名詞ボーナス（psActivateDoubleScore）と
   同じ「タイマーで自動解除」の作りだが、別クラス・別フラグにしてあるので両方同時に走っても
   （転成名詞2倍×ボーナス1.5倍で）矛盾なく掛け算されるだけになる。 */
function psActivateBonusReward(){
  psBonusRewardActive = true;
  if(psAppEl) psAppEl.classList.add("psBonusRewardBg");
  clearTimeout(psBonusRewardTimer);
  psBonusRewardTimer = setTimeout(()=>{
    psBonusRewardActive = false;
    if(psAppEl) psAppEl.classList.remove("psBonusRewardBg");
  }, PS_BONUS_REWARD_TIME_MS);
}
function psStopBonusReward(){
  psBonusRewardActive = false;
  clearTimeout(psBonusRewardTimer);
  psBonusRewardTimer = null;
  if(psAppEl) psAppEl.classList.remove("psBonusRewardBg");
}

/* ボーナスチャンス問題本体。盤面に残っている（＝今まさに消した葉ではない）通常の葉から
   1つ選んで、その品詞を10択で当てさせる。アイテムの葉（⏰・🔻）はcatIndex:-1で品詞を
   持たないので候補から除外する。 */
function psPickBonusWordCell(){
  const candidates = [];
  for(let r=0;r<psRows;r++){
    for(let c=0;c<psCols;c++){
      const cell = psBoard[r][c];
      if(cell && !cell.isItem && cell.word) candidates.push(cell);
    }
  }
  if(!candidates.length) return null;
  return candidates[Math.floor(Math.random()*candidates.length)];
}
function psMaybeStartBonusQuestion(){
  // psBonusRewardActive中（正解後の15秒間）は、ボーナスチャンス問題そのものを再発生させない
  // （教員の指示、2026-08-21〜：ボーナスタイムの最中にまた出題されると忙しすぎるため）。
  if(!psPlaying || psBonusActive || psBonusRewardActive) return;
  const cell = psPickBonusWordCell();
  if(!cell) return;
  psStartBonusQuestion(cell);
}
function psStartBonusQuestion(cell){
  psBonusActive = true;
  psPlaying = false;         // 盤面のドラッグ操作を封じる（「時間が止まる」演出の一部）
  psDragging = false;
  psClearHighlight();
  psChain = [];
  psUpdateLine();
  clearInterval(psTimerId);  // メインの残り時間タイマーを止める＝本当に時間が止まる

  psBonusCorrectName = PS_CATEGORIES[cell.catIndex].name;
  psBonusWordEl.textContent = cell.word;
  psBonusResultEl.className = "psBonusResult";
  psBonusResultEl.innerHTML = "";

  psBonusChoicesEl.innerHTML = PS_BONUS_POS_CHOICES.map(name=>
    `<button type="button" class="psBonusChoice">${esc(name)}</button>`
  ).join("");
  psBonusChoicesEl.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=> psAnswerBonusQuestion(btn.textContent));
  });

  const fill = psBonusTimerFillEl;
  fill.style.transition = "none";
  fill.style.transform = "scaleX(1)";
  void fill.offsetWidth; // 強制リフロー（transition:noneを実際に反映させてからアニメーションを再開させるため）
  fill.style.transition = `transform ${PS_BONUS_QUESTION_TIME_MS}ms linear`;
  fill.style.transform = "scaleX(0)";

  psBonusOverlayEl.classList.add("show");

  clearTimeout(psBonusTimerId);
  psBonusTimerId = setTimeout(()=> psAnswerBonusQuestion(null), PS_BONUS_QUESTION_TIME_MS);
}
function psAnswerBonusQuestion(picked){
  if(!psBonusActive) return;
  psBonusActive = false;
  clearTimeout(psBonusTimerId);
  psBonusTimerId = null;
  psBonusChoicesEl.querySelectorAll("button").forEach(btn=> btn.disabled = true);

  const correct = picked !== null && picked === psBonusCorrectName;
  if(correct){
    psBonusResultEl.className = "psBonusResult ok";
    psBonusResultEl.innerHTML = `<div class="psBonusMedal">💮</div><div class="psBonusMsg">15秒追加！ボーナスタイム突入！</div><div class="psBonusSub">得点1.5倍！</div>`;
  } else {
    psBonusResultEl.className = "psBonusResult ng";
    psBonusResultEl.innerHTML = `<div class="psBonusMsg">残念！</div>`;
  }

  setTimeout(()=>{
    psBonusOverlayEl.classList.remove("show");
    if(!psPlaying){           // psStopLoop等で途中離脱されていた場合はここで再開させない
      psPlaying = true;
      clearInterval(psTimerId);
      psTimerId = setInterval(psTick, 1000); // 時計が再スタートする
    }
    if(correct){
      psTimeLeft += 15;
      psTimeValEl.textContent = psTimeLeft;
      if(psTimeLeft > 10) psTimeValEl.classList.remove("warn");
      psActivateBonusReward();
    }
  }, correct ? PS_BONUS_CORRECT_SHOW_MS : PS_BONUS_WRONG_SHOW_MS);
}

function psBuildLegend(indices){
  psLegendEl.innerHTML = "";
  indices.forEach(i=>{
    const item = document.createElement("div");
    item.className = "psLegendItem";
    item.textContent = PS_CATEGORIES[i].name;
    psLegendEl.appendChild(item);
  });
}

function psSizeBoard(){
  const w = (psAppEl && psAppEl.clientWidth) || 560;
  const h = (psAppEl && psAppEl.clientHeight) || 640;
  // ボムパネルが盤面の横に並んでいる（#psPlayAreaがrow）ときだけ、その実際の幅ぶんを
  // 差し引く。狭い画面ではCSSでcolumn（縦積み）に切り替わるので、その場合は横幅を
  // 丸ごと盤面に使える（以前は固定108pxを常に引いていたため、スマホでマスが
  // 強制的に最小サイズを超えてはみ出す原因になっていた）。
  let reserveW = 0;
  if(psPlayAreaEl && psBombPanelEl){
    const isRow = getComputedStyle(psPlayAreaEl).flexDirection !== "column";
    if(isRow) reserveW = psBombPanelEl.offsetWidth + 12;
  }
  const maxW = Math.min(w - reserveW, 560);
  const maxH = Math.min(h - 230, 640);
  psCell = Math.floor(Math.min(maxW / psCols, maxH / psRows));
  psCell = Math.max(24, Math.min(72, psCell));
  psBoardWrapEl.style.width = (psCell*psCols) + "px";
  psBoardWrapEl.style.height = (psCell*psRows) + "px";
  psSvgEl.setAttribute("width", psCell*psCols);
  psSvgEl.setAttribute("height", psCell*psRows);
}

function psRandCat(){ return psActiveCats[Math.floor(Math.random()*psActiveCats.length)]; }
function psRandWord(catIndex){
  if(catIndex === PS_NOUN_CAT && Math.random() < PS_TENSEI_MEISHI_CHANCE){
    return PS_TENSEI_MEISHI_LIST[Math.floor(Math.random()*PS_TENSEI_MEISHI_LIST.length)];
  }
  const list = psWordPools[catIndex];
  return list[Math.floor(Math.random()*list.length)];
}

function psRollTile(){
  if(Math.random() < psCurrentItemChance()){
    let type = Math.random() < 0.5 ? "time" : "reduce";
    if(type === "reduce" && psReduceItemOnBoard){
      type = "time";
    }
    if(type === "reduce") psReduceItemOnBoard = true;
    return { catIndex:-1, isItem:type };
  }
  return { catIndex: psRandCat(), isItem:null };
}

function psPositionEl(el, row, col){
  const pad = 3;
  el.style.left = (col*psCell + pad) + "px";
  el.style.top = (row*psCell + pad) + "px";
  el.style.width = (psCell - pad*2) + "px";
  el.style.height = (psCell - pad*2) + "px";
  // 文字サイズをマスの実サイズに連動させる（以前は固定サイズだったため、
  // スマホ等でマスが小さくなると文字だけ大きいまま葉からはみ出していた）。
  el.style.fontSize = Math.max(9, Math.round(psCell * 0.3)) + "px";
}

function psMakeCell(row, col, tile, startAboveOffset){
  const catIndex = tile.catIndex, isItem = tile.isItem;
  const el = document.createElement("div");
  let word = null;
  if(isItem === "time"){
    el.className = "tsum item-time";
    el.innerHTML = `<span class="itemIcon">⏰<span class="itemLabel">+5秒</span></span>`;
  } else if(isItem === "reduce"){
    el.className = "tsum item-reduce";
    el.innerHTML = `<span class="itemIcon">🔻<span class="itemLabel">品詞減</span></span>`;
  } else {
    el.className = "tsum";
    word = psRandWord(catIndex);
    const sizeClass = word.length >= 8 ? " long3" : (word.length >= 6 ? " long2" : (word.length >= 5 ? " long1" : ""));
    el.innerHTML = `<span class="word${sizeClass}">${word}</span>`;
  }
  psBoardWrapEl.appendChild(el);

  const cellObj = { el, catIndex, isItem, word, row, col };

  if(startAboveOffset){
    const pad = 3;
    el.style.left = (col*psCell + pad) + "px";
    el.style.top = ((row - startAboveOffset)*psCell + pad) + "px";
    el.style.width = (psCell - pad*2) + "px";
    el.style.height = (psCell - pad*2) + "px";
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        psPositionEl(el, row, col);
      });
    });
  } else {
    psPositionEl(el, row, col);
  }

  el.addEventListener("pointerdown", (e)=> psOnCellPointerDown(e, cellObj));
  return cellObj;
}

function psInitBoard(){
  psBoardWrapEl.querySelectorAll(".tsum").forEach(n=>n.remove());
  psBoard = [];
  for(let r=0;r<psRows;r++){
    const rowArr = [];
    for(let c=0;c<psCols;c++){
      rowArr.push(psMakeCell(r,c,psRollTile(),false));
    }
    psBoard.push(rowArr);
  }
}

function psIsAdjacent(a,b){
  const dr = Math.abs(a.row-b.row), dc = Math.abs(a.col-b.col);
  return dr<=1 && dc<=1 && !(dr===0 && dc===0);
}

function psCellCenter(cellObj){
  return {
    x: cellObj.col*psCell + psCell/2,
    y: cellObj.row*psCell + psCell/2
  };
}

function psClearHighlight(){
  psChain.forEach(c=> c.el.classList.remove("selected"));
}

function psUpdateLine(){
  if(psChain.length < 2){
    psSvgEl.innerHTML = "";
    return;
  }
  const pts = psChain.map(c=>{
    const p = psCellCenter(c);
    return `${p.x},${p.y}`;
  }).join(" ");
  psSvgEl.innerHTML = `<polyline points="${pts}" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <polyline points="${pts}" fill="none" stroke="#457a34" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function psOnCellPointerDown(e, cellObj){
  if(!psPlaying) return;
  e.preventDefault();
  psDragging = true;
  psChain = [cellObj];
  cellObj.el.classList.add("selected");
  psUpdateLine();
}

function psFindCellFromPoint(x,y){
  const target = document.elementFromPoint(x,y);
  if(!target) return null;
  const tsumEl = target.closest(".tsum");
  if(!tsumEl) return null;
  for(let r=0;r<psRows;r++){
    for(let c=0;c<psCols;c++){
      const cell = psBoard[r][c];
      if(cell && cell.el === tsumEl) return cell;
    }
  }
  return null;
}

function psCurrentChainCat(){
  for(const c of psChain){ if(!c.isItem) return c.catIndex; }
  return null;
}

function psOnPointerMove(e){
  if(!psDragging || !psPlaying) return;
  const cell = psFindCellFromPoint(e.clientX, e.clientY);
  if(!cell) return;
  const last = psChain[psChain.length-1];
  if(cell === last) return;

  if(psChain.length>=2 && cell === psChain[psChain.length-2]){
    last.el.classList.remove("selected");
    psChain.pop();
    psUpdateLine();
    return;
  }

  if(psChain.includes(cell)) return;
  const targetCat = psCurrentChainCat();
  if(targetCat !== null && !cell.isItem && cell.catIndex !== targetCat) return;
  if(!psIsAdjacent(last, cell)) return;

  psChain.push(cell);
  cell.el.classList.add("selected");
  psUpdateLine();
}

function psOnPointerUp(e){
  if(!psDragging) return;
  psDragging = false;
  if(psChain.length >= 3){
    psPopChain();
  } else {
    psClearHighlight();
    psChain = [];
    psUpdateLine();
  }
}

  const p = psCellCenter(cellsForPos[Math.floor(cellsForPos.length/2)]);
  const el = document.createElement("div");
  el.className = "psFloatScore";
  el.textContent = "+" + gain;
  el.style.left = p.x + "px";
  el.style.top = p.y + "px";
  psPopupLayerEl.appendChild(el);
  setTimeout(()=> el.remove(), 900);
}

function psShowCategoryPopup(cellsForPos, catName){
  const p = psCellCenter(cellsForPos[cellsForPos.length-1]);
  const el = document.createElement("div");
  el.className = "psCategoryPopup";
  el.textContent = catName;
  el.style.left = p.x + "px";
  el.style.top = (p.y - 8) + "px";
  psPopupLayerEl.appendChild(el);
  setTimeout(()=> el.remove(), 700);
}

// 消えた葉っぱの位置から、小さな葉が舞い散るような演出を出す
function psShowLeafParticles(chainCells){
  chainCells.forEach(cellObj=>{
    const p = psCellCenter(cellObj);
    const count = 2 + Math.floor(Math.random()*2);
    for(let i=0;i<count;i++){
      const leaf = document.createElement("div");
      leaf.className = "psLeafParticle";
      leaf.textContent = "🍃";
      const angle = Math.random()*Math.PI*2;
      const dist = 22 + Math.random()*30;
      leaf.style.left = p.x + "px";
      leaf.style.top = p.y + "px";
      leaf.style.setProperty("--dx", Math.cos(angle)*dist + "px");
      leaf.style.setProperty("--dy", (Math.sin(angle)*dist - 18) + "px");
      leaf.style.setProperty("--rot", (Math.random()<0.5?-1:1) * (120 + Math.random()*160) + "deg");
      leaf.style.animationDelay = (Math.random()*0.12) + "s";
      psPopupLayerEl.appendChild(leaf);
      setTimeout(()=> leaf.remove(), 750);
    }
  });
}

function psShowItemPopup(cellsForPos, text, cls){
  const p = psCellCenter(cellsForPos[Math.floor(cellsForPos.length/2)]);
  const el = document.createElement("div");
  el.className = "psFloatScore psItemPopup " + cls;
  el.textContent = text;
  el.style.left = p.x + "px";
  el.style.top = (p.y - 24) + "px";
  psPopupLayerEl.appendChild(el);
  setTimeout(()=> el.remove(), 1000);
}

function psTriggerReduceCategory(){
  const presentCats = new Set();
  for(let r=0;r<psRows;r++) for(let c=0;c<psCols;c++){
    const cell = psBoard[r][c];
    if(cell && !cell.isItem) presentCats.add(cell.catIndex);
  }
  const list = Array.from(presentCats);
  if(list.length === 0) return { cells:[], catIndex:null };
  const removedCat = list[Math.floor(Math.random()*list.length)];
  const toClear = [];
  for(let r=0;r<psRows;r++) for(let c=0;c<psCols;c++){
    const cell = psBoard[r][c];
    if(cell && !cell.isItem && cell.catIndex === removedCat) toClear.push(cell);
  }
  toClear.forEach(cellObj=>{
    cellObj.el.classList.add("reducePop");
    psBoard[cellObj.row][cellObj.col] = null;
  });
  return { cells: toClear, catIndex: removedCat };
}

function psCollectBombCells(chainCells){
  const inChain = new Set(chainCells);
  const extra = new Set();
  chainCells.forEach(cellObj=>{
    for(let dr=-1; dr<=1; dr++){
      for(let dc=-1; dc<=1; dc++){
        if(dr===0 && dc===0) continue;
        const rr = cellObj.row+dr, cc = cellObj.col+dc;
        if(rr<0||rr>=psRows||cc<0||cc>=psCols) continue;
        const neighbor = psBoard[rr][cc];
        if(neighbor && !inChain.has(neighbor)) extra.add(neighbor);
      }
    }
  });
  return Array.from(extra);
}

function psTriggerBombEffect(chainCells){
  let sx=0, sy=0;
  chainCells.forEach(c=>{ const p=psCellCenter(c); sx+=p.x; sy+=p.y; });
  const cx = sx/chainCells.length, cy = sy/chainCells.length;

  psBoardWrapEl.classList.add("bombShake");
  setTimeout(()=> psBoardWrapEl.classList.remove("bombShake"), 420);

  const ring = document.createElement("div");
  ring.className = "psBombRing";
  ring.style.left = cx + "px";
  ring.style.top = cy + "px";
  psPopupLayerEl.appendChild(ring);
  setTimeout(()=> ring.remove(), 500);

  const colors = ["#ff6b3d","#ffcf4a","#ff3d63","#ffffff"];
  for(let i=0;i<14;i++){
    const p = document.createElement("div");
    p.className = "psBombParticle";
    const angle = (Math.PI*2*i)/14 + Math.random()*0.3;
    const dist = 40 + Math.random()*50;
    p.style.left = cx + "px";
    p.style.top = cy + "px";
    p.style.setProperty("--dx", Math.cos(angle)*dist + "px");
    p.style.setProperty("--dy", Math.sin(angle)*dist + "px");
    p.style.background = colors[i % colors.length];
    psPopupLayerEl.appendChild(p);
    setTimeout(()=> p.remove(), 600);
  }

  const label = document.createElement("div");
  label.className = "psFloatScore psBombLabel";
  label.textContent = "💥 ボム！周りも消えた！";
  label.style.left = cx + "px";
  label.style.top = (cy - 30) + "px";

  setTimeout(()=> label.remove(), 1000);
}

function psBombGaugeTick(now){
  if(!psBombModeActive) return;
  const remain = Math.max(0, psBombEndTime - now);
  const frac = Math.min(1, remain / PS_BOMB_TIME_MS);
  psBombGaugeFillEl.style.height = (frac*100) + "%";
  psBombGaugeLabelEl.textContent = Math.ceil(remain/1000) + "秒";
  if(remain <= 0){
    psStopBombMode();
    return;
  }
  psBombGaugeRAF = requestAnimationFrame(psBombGaugeTick);
}

function psExtendBombMode(extraMs){

function psPopChain(){
  const n = psChain.length;
  const sevenPlus = n >= 7;
  const isBomb = sevenPlus && psBombModeActive;

  const gotTenseiMeishi = psChain.some(c=> !c.isItem && c.word && PS_TENSEI_MEISHI.has(c.word));
  if(gotTenseiMeishi) psActivateDoubleScore();

  // 転成名詞ボーナス（×2）とボーナスチャンス問題の正解報酬（×1.5）は独立に発動しうるので、
  // 両方立っていれば掛け算でそのまま重なる（教員への確認不要な自然な仕様として掛け算にした）。
  const scoreMultAll = psScoreMult() * (psDoubleScoreActive ? 2 : 1) * (psBonusRewardActive ? PS_BONUS_REWARD_SCORE_MULT : 1);
  const gain = Math.round(n*n*5 * scoreMultAll);
  psScore += gain;
  if(n > psBestCombo) psBestCombo = n;
  psScoreValEl.textContent = psScore;
  psComboValEl.textContent = psBestCombo;
  psShowFloatScore(psChain, gain);

  if(gotTenseiMeishi){
    psShowItemPopup(psChain, "転成名詞を消した！10秒間得点2倍！", "psItemPopupDouble");
  }

  const chainCatIdx = psCurrentChainCat();
  if(chainCatIdx !== null){
    psShowCategoryPopup(psChain, PS_CATEGORIES[chainCatIdx].name);
  }

  let timeBonus = 0;
  let reducedCells = [];
  let reducedCatName = null;
  psChain.forEach(cellObj=>{
    if(cellObj.isItem === "time") timeBonus += 5;
    if(cellObj.isItem === "reduce"){
      const result = psTriggerReduceCategory();
      reducedCells = reducedCells.concat(result.cells);
      if(result.catIndex !== null) reducedCatName = PS_CATEGORIES[result.catIndex].name;
      psReduceItemOnBoard = false;
    }
  });
  if(timeBonus > 0){
    psTimeLeft += timeBonus;
    psTimeValEl.textContent = psTimeLeft;
    if(psTimeLeft > 10) psTimeValEl.classList.remove("warn");
    psShowItemPopup(psChain, `+${timeBonus}秒`, "psItemPopupTime");
  }
  if(reducedCells.length){
    const label = reducedCatName ? `「${reducedCatName}」が全部消えた！` : "品詞がへった！";
    psShowItemPopup(psChain, label, "psItemPopupReduce");
  }

  if(isBomb){
    psExtendBombMode(10000);
    psShowItemPopup(psChain, "ボムタイム+10秒！", "psItemPopupBomb");
  } else if(sevenPlus){
    psStartBombMode();
    psShowItemPopup(psChain, "💣ボムタイム突入！", "psItemPopupBomb");
  }

  const bombCells = isBomb ? psCollectBombCells(psChain) : [];

  psChain.forEach(cellObj=>{
    cellObj.el.classList.remove("selected");
    cellObj.el.classList.add("popping");
    psBoard[cellObj.row][cellObj.col] = null;
  });
  psShowLeafParticles(psChain);
  psUpdateLine();

  if(isBomb){
    psTriggerBombEffect(psChain);
    bombCells.forEach(cellObj=>{
      cellObj.el.classList.add("popping","bombPop");
      psBoard[cellObj.row][cellObj.col] = null;
      if(cellObj.isItem === "reduce") psReduceItemOnBoard = false;
    });
    const bombGain = Math.round(bombCells.length * 15 * scoreMultAll);
    if(bombGain > 0){
      psScore += bombGain;
      psScoreValEl.textContent = psScore;
    }
  }

  const poppedEls = psChain.map(c=>c.el)
    .concat(bombCells.map(c=>c.el))
    .concat(reducedCells.map(c=>c.el));
  psChain = [];

  const popDelay = isBomb ? 420 : (reducedCells.length ? 520 : 220);
  const rollBonusQuestion = Math.random() < PS_BONUS_QUESTION_CHANCE;
  setTimeout(()=>{
    poppedEls.forEach(el=> el.remove());
    psCollapseAndRefill();
    // 葉が落ちて盤面が落ち着いてから出題する（消えたばかりの葉が対象に選ばれることはない：
    // psPickBonusWordCellはpsCollapseAndRefill後のpsBoardを見るので、すでに空のマスは候補に入らない）
    if(rollBonusQuestion) setTimeout(psMaybeStartBonusQuestion, PS_BONUS_SETTLE_DELAY_MS);
  }, popDelay);
}

function psCollapseAndRefill(){
  for(let c=0;c<psCols;c++){
    let writeRow = psRows-1;
    for(let r=psRows-1;r>=0;r--){
      const cell = psBoard[r][c];
      if(cell){
        if(writeRow !== r){
          psBoard[writeRow][c] = cell;
          psBoard[r][c] = null;
          cell.row = writeRow;
          psPositionEl(cell.el, writeRow, c);
        }
        writeRow--;
      }
    }
    let fillCount = 0;
    for(let r=writeRow;r>=0;r--){
      fillCount++;
      const cellObj = psMakeCell(r, c, psRollTile(), fillCount + (writeRow - r));
      psBoard[r][c] = cellObj;
    }
  }
}

function psTick(){

function psBuildWordPools(conf){
  psWordPools = PS_CATEGORIES.map(cat=>{
    if(conf.wordSet === "conjMixed"){
      const pool = cat.base.concat(cat.extra);
      return cat.conj ? pool.concat(cat.conj) : pool;
    }
    return conf.wordSet === "all" ? cat.base.concat(cat.extra) : cat.base.slice();
  });
}

function psPlayIntroSequence(cats, onDone){
  psOverlayEl.classList.remove("hidden");
  const catNames = cats.map(i=> PS_CATEGORIES[i].name);
  const allNames = PS_CATEGORIES.map(c=> c.name);

  psOverlayCardEl.innerHTML = `
    <h2>今回のお題は…</h2>
    <div id="psThemeReveal" class="psThemeReveal"></div>
  `;
  const themeReveal = ps$("psThemeReveal");

  let flickerCount = 0;
  const flickerMax = 12;
  const flickerTimer = setInterval(()=>{
    const shuffled = psShuffleCopy(allNames).slice(0, catNames.length);
    themeReveal.innerHTML = shuffled.map(n=> `<span class="psThemeBadge">【${n}】</span>`).join("");
    flickerCount++;
    if(flickerCount >= flickerMax){
      clearInterval(flickerTimer);
      themeReveal.innerHTML = catNames.map(n=> `<span class="psThemeBadge final">【${n}】</span>`).join("");
      const t = setTimeout(startCountdown, 1800);
      psIntroTimers.push(t);
    }
  }, 80);
  psIntroTimers.push(flickerTimer);

  function startCountdown(){
    psOverlayCardEl.innerHTML = `
      <h2>今回のお題は…</h2>
      <div class="psThemeReveal">${catNames.map(n=> `<span class="psThemeBadge final">【${n}】</span>`).join("")}</div>
      <div id="psCountdownNum" class="psCountdownNum"></div>
    `;
    const numEl = ps$("psCountdownNum");
    const seq = ["3","2","1","スタート！"];
    let idx = 0;
    const showNext = ()=>{
      numEl.textContent = seq[idx];
      numEl.classList.remove("pop");
      void numEl.offsetWidth;
      numEl.classList.add("pop");
      idx++;
      if(idx < seq.length){
        const t = setTimeout(showNext, 650);
        psIntroTimers.push(t);
      } else {
        const t = setTimeout(onDone, 500);
        psIntroTimers.push(t);
      }
    };
    showNext();
  }
}

/* ラウンド終了：st.partsOfSpeechBestはレベル番号キーのオブジェクト（自己ベスト表示用）。
   経験値は固定の専用プール（partsOfSpeechBonusExp）には貯めず、「品詞」ジャンルのレベル
   （st.lv.hinshi）自体を毎ラウンドの得点に応じて上げることで連動させる（教員の指示、
   2026-08-21〜：文節斬りの「識別」ジャンルと同じ考え方）。難しいレベルほど少ない点数で
   ジャンルレベルが上がる一方、1ラウンドで一気に上がるのは最大PS_GENRE_LV_CAPレベルまでとする。
   record()本体は呼ばず、bgLevelUpShikibetsu()と同じ流れ（st.lv.hinshi++・totalLevelUps・
   10回ごとの挑戦チケット）をその場で再現する。partsOfSpeechBonusExpへの新規加算はやめるが、
   これまでに貯まった分はtotalEarnedStatPoints側の加算式にそのまま残してあるので消えない。 */
function psEndGame(){
  psPlaying = false;
  clearInterval(psTimerId);
  psDragging = false;
  psClearHighlight();
  psChain = [];
  psUpdateLine();
  psStopBombMode();
  psStopDoubleScore();
  psStopBonusReward();

  const st = loadStats();
  if(!st.partsOfSpeechBest) st.partsOfSpeechBest = {};
  if(!st.partsOfSpeechUnlockedLevel) st.partsOfSpeechUnlockedLevel = 1;
  const prevLevelBest = st.partsOfSpeechBest[psCurrentLevel] || 0;
  const isNewRecord = psScore > 0 && psScore > prevLevelBest;
  let statsChanged = false;
  if(isNewRecord){
    st.partsOfSpeechBest[psCurrentLevel] = psScore;
    statsChanged = true;
  }
  // PS_GENRE_LV_THRESHOLD・PS_GENRE_LV_CAPは上のほう（psCurrentItemChance付近）で定義済み
  let genreLvGained = 0, genreTitleUp = false, genreTitleName = "", genreTitleIcon = "";
  if(psScore > 0){
    const threshold = PS_GENRE_LV_THRESHOLD[psCurrentLevel] || 1000;
    const lvUps = Math.min(Math.floor(psScore / threshold), PS_GENRE_LV_CAP);
    if(lvUps > 0){
      const lvBefore = st.lv.hinshi || 1;
      let lvAfter = lvBefore;
      for(let i=0; i<lvUps && lvAfter < MAX_CAT_LV; i++){
        lvAfter++;
        st.totalLevelUps = (st.totalLevelUps||0) + 1;
        if(st.totalLevelUps % 10 === 0) st.bossTickets = (st.bossTickets||0) + 1;
      }
      if(lvAfter > lvBefore){
        st.lv.hinshi = lvAfter;
        genreLvGained = lvAfter - lvBefore;
        const titleBefore = titleOf(lvBefore), titleAfter = titleOf(lvAfter);
        genreTitleUp = titleBefore.name !== titleAfter.name;
        genreTitleName = titleAfter.name;
        genreTitleIcon = titleAfter.icon;
        statsChanged = true;
      }
    }
  }
  const bestAfter = Math.max(prevLevelBest, psScore);

  // そのレベルで十分に理解したと言える点数を取れたら、次のレベルを解放してお祝いする
  let justUnlocked = null;
  const needScore = PS_LEVEL_UNLOCK_SCORE[psCurrentLevel];
  if(needScore && psCurrentLevel === st.partsOfSpeechUnlockedLevel && psScore >= needScore && st.partsOfSpeechUnlockedLevel < 7){
    st.partsOfSpeechUnlockedLevel = psCurrentLevel + 1;
    justUnlocked = st.partsOfSpeechUnlockedLevel;
    statsChanged = true;
  }
  if(statsChanged) saveStats(st);
  const allClear = justUnlocked === 7;

  const recordHtml = isNewRecord ? `<p class="psLevelDesc">🎉 レベル${psCurrentLevel}の自己ベスト更新！（${psScore}点）</p>` : "";
  const xpHtml = genreLvGained > 0
    ? `<p class="psLevelDesc">🏆 「品詞」のレベルが${genreLvGained}アップした！${genreTitleUp ? `（称号「${genreTitleIcon} ${genreTitleName}」にアップ！）` : ""}</p>`
    : "";
  const unlockHtml = justUnlocked
    ? (allClear
        ? `<div class="psUnlockCelebrate allClear">🎉 全てのレベルを解放した！ 🌟</div>`
        : `<div class="psUnlockCelebrate">🔓 レベル${justUnlocked}を解放した！ ✨</div>`)
    : "";

  psOverlayCardEl.innerHTML = `
    <h2>タイムアップ！（レベル${psCurrentLevel}）</h2>
    <div class="psBigScore">${psScore} 点</div>
    <p>さいこうコンボ：${psBestCombo} 個つなげ</p>
    <p class="psLevelDesc">レベル${psCurrentLevel}の自己ベスト：${bestAfter}点</p>
    ${recordHtml}
    ${xpHtml}
    ${unlockHtml}
    <div class="psBtnRow">
      <button class="psStartBtn" id="psRetryBtn">もう一度あそぶ</button>
      <button class="psStartBtn secondary" id="psOtherLevelBtn">他のレベルに挑戦する</button>
      <button class="psStartBtn secondary" id="psHomeBtn">ホームに戻る</button>
    </div>
  `;
  psOverlayEl.classList.remove("hidden");
  ps$("psRetryBtn").addEventListener("click", ()=> psStartGame(psCurrentLevel));
  ps$("psOtherLevelBtn").addEventListener("click", psShowLevelSelect);
  ps$("psHomeBtn").addEventListener("click", showHome);
}

/* ---- 効果音（外部音源なし、Web Audioでその場生成。他ミニゲームと同じく専用のAudioContextを持つ） ---- */
let kzAudioCtx = null;
function kzGetAudioCtx(){
  if(!kzAudioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    kzAudioCtx = new AC();
  }
  if(kzAudioCtx.state === 'suspended') kzAudioCtx.resume();
  return kzAudioCtx;
}
function kzBeep(freq, start, dur, vol){
  const ctx = kzGetAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine'; osc.frequency.value = freq;
  osc.connect(gain); gain.connect(ctx.destination);
  const t0 = ctx.currentTime + start;
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.start(t0); osc.stop(t0 + dur);
}
function kzPlayCorrectChime(){ try{ kzBeep(740,0,0.10,0.14); kzBeep(990,0.07,0.16,0.16); }catch(e){} }
function kzPlayResultChime(){
  try{
    kzBeep(660,0,0.14,0.15); kzBeep(880,0.1,0.14,0.16);
    kzBeep(990,0.2,0.16,0.17); kzBeep(1320,0.32,0.34,0.2);
  }catch(e){}
}

/* 対象の語だけを見せても文脈が分からず判断できないので、前後の地の文つきで見せる。
   直前直後のトークンを文字数上限まで連結し、対象語だけ大きく強調する。 */
function kzGetContextHtml(id){
  const tokens = kzPassage().tokens;
  const idx = tokens.findIndex(t => t.type==='cand' && t.id===id);
  if(idx<0) return '';
  const BUDGET = 10;
  let before = '';
  for(let i=idx-1; i>=0 && before.length<BUDGET; i--){
    const tk = tokens[i];
    before = (tk.type==='br' ? '　' : (tk.t||'')) + before;
  }
  if(before.length>BUDGET) before = '…' + before.slice(before.length-BUDGET);
  let after = '';
  for(let i=idx+1; i<tokens.length && after.length<BUDGET; i++){
    const tk = tokens[i];
    after += (tk.type==='br' ? '　' : (tk.t||''));
  }
  if(after.length>BUDGET) after = after.slice(0,BUDGET) + '…';
  return `${esc(before)}<span class="kz-context-target">${esc(tokens[idx].t)}</span>${esc(after)}`;
}

  const fb = document.getElementById('kzFeedback');
  fb.className = 'kz-feedback show hint';
  fb.innerHTML = `<span class="kz-firefly">🌙</span>${esc(cand.rule || 'ここは形が変わらない言葉だよ。もう一度、じっくり見てみよう。')}`;
}
const KZ_PRAISE = ['そのとおり！', 'やった！', '見事！', 'さすが！', 'いいね！', 'ばっちり！'];
function kzNormalize(s){ return s.replace(/\s/g,''); }
function kzJudge(choice, value){
  if(KZ.resolved[KZ.curId]) return; // すでに光った問題を二重に採点しない（保険）
  const cand = kzCandidates().find(c=>c.id===KZ.curId);
  const fb = document.getElementById('kzFeedback');
  let correct;
  if(choice==='keep'){
    correct = (cand.needsFix===false);
  }else{
    // 直すべきでない語も、入力欄にもとの形をそのまま打てば正解とする
    // （「そのまま」ボタンと同じ判定。cand.modernは変化なしの語だと原文と同じ値になっている）。
    correct = kzNormalize(value)===kzNormalize(cand.modern);
  }
  if(correct){
    const status = KZ.hintUsed[KZ.curId] ? 'hint' : 'self';
    KZ.resolved[KZ.curId] = status;
    if(status==='self'){ KZ.selfStreak++; } else { KZ.selfStreak = 0; }
    const praise = KZ_PRAISE[Math.floor(Math.random()*KZ_PRAISE.length)];
    const streakText = KZ.selfStreak>=2 ? `　🔥自力で${KZ.selfStreak}連続！` : '';
    fb.className = 'kz-feedback show ok';
    fb.innerHTML = `<div class="kz-verdict-ok">◯ 正解！</div><span class="kz-firefly">✨</span>${esc(praise)}${cand.short ? esc(cand.short)+'のルールだね。' : ''}竹が少し明るくなった。${streakText}`;
    kzPlayCorrectChime();
    KZ.justResolvedId = KZ.curId;
    kzRenderScroll(); kzRenderBamboo();
    // 自動では進めない。解説をじっくり読みたい人もいるので、「つぎへ」を押すまで待つ。
    kzShowContinueButton('つぎへ ▶', kzAdvanceOrResults);
  }else{
    KZ.attempts[KZ.curId] = (KZ.attempts[KZ.curId]||0) + 1;
    if(KZ.attempts[KZ.curId] >= 2){
      // 2回まちがえても減点はしない。ただし「ヒントで気づけた」というのは嘘になるので、
      // まちがえたこと自体は正直に伝え、その上で正解を教えて前を向く。
      KZ.selfStreak = 0;
      fb.className = 'kz-feedback show hint';
      fb.innerHTML = `<span class="kz-firefly">🌱</span>まちがえてしまったね。${esc(cand.rule || '')}<br>正しくは「<b>${esc(cand.needsFix ? cand.modern : cand.t)}</b>」だよ。次はきっと分かるよ。`;
      kzShowContinueButton('次は頑張ろう', ()=>{
        KZ.resolved[KZ.curId] = 'missed';
        KZ.justResolvedId = KZ.curId;
        kzRenderScroll(); kzRenderBamboo();
        kzAdvanceOrResults();
      });
    }else{
      fb.className = 'kz-feedback show hint';
      let msg;
      if(choice==='keep' && cand.needsFix){
        msg = 'うーん、ここは言葉の"真ん中"にある音だよ。何かに変わりそうな気配……もう一度考えてみよう。';
      }else if(choice==='fix' && !cand.needsFix){
        msg = 'これは言葉と言葉をつなぐ「助詞」。じつは形が変わらない言葉なんだ。もう一度考えてみよう。';
      }else{
        msg = 'おしい！もういちど、' + (cand.short||'この言葉') + 'のルールを思い出してみよう。';
      }
      fb.innerHTML = `<span class="kz-firefly">🌙</span>${esc(msg)}`;
    }
  }
}

/* 1エピソード終了時、ヒントを見ずに正解した数ぶんだけ「仮名遣い」のレベルを
   まとめて上げる。文節斬りのbgLevelUpShikibetsu()と同じ方式（record()本体は
   呼ばない）で、st.lv.kanazukai・totalLevelUps・挑戦チケットだけをその場で再現する。
   selfCount回ぶんループしてから1回だけsaveStatsするので、途中経過の保存漏れはない。 */
function kzApplyLevelUp(selfCount){
  const st = loadStats();
  const lvBefore = st.lv.kanazukai||1;
  let lvAfter = lvBefore, gained = 0, ticketsGained = 0;
  for(let i=0; i<selfCount; i++){
    if(lvAfter >= MAX_CAT_LV) break;
    lvAfter++;
    st.totalLevelUps = (st.totalLevelUps||0) + 1;
    if(st.totalLevelUps % 10 === 0){ st.bossTickets = (st.bossTickets||0) + 1; ticketsGained++; }
    gained++;
  }
  st.lv.kanazukai = lvAfter;
  saveStats(st);
  const titleBefore = titleOf(lvBefore), titleAfter = titleOf(lvAfter);
  return {
    lvBefore, lvAfter, gained, ticketsGained,
    titleUp: gained>0 && titleBefore.name !== titleAfter.name,
    titleName: titleAfter.name, titleIcon: titleAfter.icon,
  };
}

/* ---- 画面：1エピソード終了時の結果画面 ---- */
function kzShowResults(){
  const p = kzPassage();
  KZ.clearedSet.add(p.key);
  const cands = kzCandidates();
  const selfCount = cands.filter(c => KZ.resolved[c.id]==='self').length;
  const pct = Math.round(selfCount/cands.length*100);
  const lv = kzApplyLevelUp(selfCount);
  kzPlayResultChime();

  const visualHtml = p.finaleVisual === 'princess'
    ? `<div class="kz-fv-glow"></div><div class="kz-fv-fig"></div>`
    : `<div class="kz-fv-glow"></div><div class="kz-fv-emoji">${p.finaleVisual}</div>`;

  const lvupHtml = lv.gained>0
    ? `<div class="kz-lvup-card">
         <div class="kz-lv-row">📈 「仮名遣い」Lv.${lv.lvBefore} → Lv.${lv.lvAfter}（+${lv.gained}）</div>
         ${lv.titleUp ? `<div class="kz-lv-sub">称号が「${lv.titleIcon} ${esc(lv.titleName)}」になりました！</div>` : ``}
         ${lv.ticketsGained>0 ? `<div class="kz-lv-sub">挑戦チケットを${lv.ticketsGained}枚獲得！</div>` : ``}
       </div>`
    : `<div class="kz-lvup-card">
         <div class="kz-lv-sub">今回はヒントを使った問題が多かったね。次はヒントなしに挑戦してみよう！（レベルアップは0でした）</div>
       </div>`;

  const recapHtml = cands.map(c=>{
    const st = KZ.resolved[c.id];
    const badge = st==='hint' ? '🌙 ヒントで気づいた' : (st==='missed' ? '🌱 まちがえたので、次は頑張ろう' : '✨ 自分で気づいた');
    return `<div class="kz-recap-item"><span>${esc(c.t)} → ${esc(c.needsFix?c.modern:'（そのまま）')}</span><span class="kz-badge">${badge}</span></div>`;
  }).join('');

  const hasNext = KZ.idx < KZ_PASSAGES.length-1;
  screen.innerHTML = `
  <div id="kzApp">
    <div class="kz-result-visual">${visualHtml}</div>
    <div class="kz-result-title">${esc(p.finaleTitle)}</div>
    <div class="kz-result-msg">${esc(p.finaleMsg)}</div>
    <div class="kz-stat-card">
      <div class="kz-stat-big">🎯 ヒントなしで正解：${selfCount} / ${cands.length}問（${pct}%）</div>
      <div class="kz-stat-sub">ヒントを見た問題・まちがえた問題も、竹はちゃんと光っています</div>
    </div>
    ${lvupHtml}
    <div class="kz-recap">
      <div class="kz-recap-title">今日、光らせた言葉</div>
      ${recapHtml}
    </div>
  </div>
  <div class="btn-row">
    <button class="btn secondary" onclick="kzStart(${KZ.idx})">この文をもう一度</button>
    ${hasNext ? `<button class="btn" onclick="kzStart(${KZ.idx+1})">つぎの文へ</button>` : ``}
    <button class="btn secondary" onclick="showHome()">ホームへ</button>
  </div>`;
}

/* ================= 「返り点をつける」の8問グループ化（段階的アンロック） =================
   20分野・百人一首と同じGROUP_SIZE(8)・st.groupUnlockを流用するが、判定方法は簡略化している：
   20分野・百人一首は「ランダム出題される小テスト」なので、streak/正答率ベースの
   UnlockEngine.isGroupClearedで習熟度を判定しているが、このコーナーは1問ごとが独立した
   パズル（同じ問題を連続で何度も出す形式ではない）なので、「今のグループの全問を
   一度でも正しく解き終えたか」だけを解禁条件にする（教員の指摘、2026-08-22：
   「8ずつチャンク化して解放するシステムを、他のジャンル同様作成して」）。
   st.groupUnlock.kanbun_ktというキーを使う（"kanbun"はCAT_KEYSの4択問題プール自身の
   解禁進捗が既に使っているキーなので、混ざらないよう別名にした。百人一首のst.groupUnlock.hyakunin
   と同じ「CAT_KEYではない専用キー」パターン）。 */
let _ktGroupsCache = null;
function ktGroups(){
  if(_ktGroupsCache) return _ktGroupsCache;
  const groups = [];
  for(let i=0;i<KT_PROBLEMS.length;i+=GROUP_SIZE){
    groups.push({level:groups.length+1, indices: KT_PROBLEMS.slice(i, i+GROUP_SIZE).map((_,j)=>i+j)});
  }
  _ktGroupsCache = groups;
  return groups;
}
function ktUnlockedGroupCount(st){
  return (st.groupUnlock && st.groupUnlock.kanbun_kt) || 1;
}
function ktUnlockedCount(st){
  const groups = ktGroups();
  const n = Math.min(ktUnlockedGroupCount(st), groups.length);
  let cnt = 0;
  for(let i=0;i<n;i++) cnt += groups[i].indices.length;
  return cnt;
}
function ktUnlockedQuestionPct(st){
  if(KT_PROBLEMS.length === 0) return null;
  return Math.round(ktUnlockedCount(st) / KT_PROBLEMS.length * 100);
}
function ktIsSolved(st, idx){
  return (st.ktSolved||[]).includes(KT_PROBLEMS[idx].white);
}
/* 今といた問題(idx)を正解ぶんとしてst.ktSolvedに記録し、それが属するグループの全問が
   解けていれば次のグループを解禁する。呼び出し側（ktJudge）でloadStats→この関数→saveStatsの
   順に呼ぶ。戻り値は「今回新しくグループが解禁されたか」。 */
function ktMarkSolvedAndCheckUnlock(st, idx){
  if(!Array.isArray(st.ktSolved)) st.ktSolved = [];
  const white = KT_PROBLEMS[idx].white;
  if(!st.ktSolved.includes(white)) st.ktSolved.push(white);
  const groups = ktGroups();
  const gIdx = ktUnlockedGroupCount(st) - 1;
  if(gIdx >= groups.length - 1) return false; // 既に全解禁
  const cur = groups[gIdx];
  if(!cur.indices.includes(idx)) return false; // 今といたのは、今アンロック中のグループの外の問題
  const allSolved = cur.indices.every(i => ktIsSolved(st, i));
  if(!allSolved) return false;
  if(!st.groupUnlock) st.groupUnlock = {};
  st.groupUnlock.kanbun_kt = ktUnlockedGroupCount(st) + 1;
  return true;
}
