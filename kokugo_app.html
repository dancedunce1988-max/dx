/* 挑戦チケットを使ってのボス挑戦：消費前に必ず警告を出す。
   resumeFn：「やめる」を押したとき、および対戦終了後に戻る画面（省略時はホーム）。
   百人一首メニューなど、ホーム以外の画面からチケットを使う場合に渡す（2026-08-01〜）。
   使うボス・出題ジャンルの抽選ロジック自体は既存のまま（全ジャンル＝CAT_KEYSからランダム）で、
   どこから呼んでも変わらない。ボス戦自体はそもそもrecord()を呼ばない設計（[[kokugo-boss-status-system]]、
   分野レベルst.lvは一切変動しない）なので、このボタンを百人一首メニューに置いても、ことのはの
   「全領域バランス型」進化判定（20分野の相対レベル差で決まる）には何の影響も生まれない。 */
/* チケットで「相手を選ぶ」ときの消費枚数（2026-08-23〜、教員の指示：
   「3枚消費すれば、現在戦う可能性のある任意のボスと戦えるように」）。候補の絞り込みは
   ticketEligibleBossesをそのまま使い、ランダム抽選(useTicketAndFight)と完全に同じ対象から
   選ばせる。1枚消費のランダム挑戦より確実に狙ったボスと戦えるぶん、割高な3枚にしている。 */
const TICKET_CHOOSE_COST = 3;
function showTicketConfirm(){
  const st = loadStats();
  if((st.bossTickets||0) <= 0){ showHome(); return; }
  const xp = kotonohaTotalXP(st);
  const candidates = ticketEligibleBosses(xp);
  const names = candidates.map(b => b.name.match(/【(.+)】/)?.[1] || b.name).join("・");
  const n = st.bossTickets||0;
  const chooseBtnHtml = n >= TICKET_CHOOSE_COST
    ? `<button class="boss-enc-btn" onclick="showTicketChooseBoss()">チケットを${TICKET_CHOOSE_COST}枚使って相手を選ぶ</button>`
    : `<button class="boss-enc-btn disabled" disabled>チケットを${TICKET_CHOOSE_COST}枚使って相手を選ぶ（あと${TICKET_CHOOSE_COST-n}枚必要）</button>`;
  screen.innerHTML = `
    <div class="card boss-encounter">
      <div class="boss-enc-icon">🎟️</div>
      <p class="boss-enc-text">挑戦チケットを1枚使って、ランダムなボスに挑戦しますか？<br><b>挑戦すると、チケットを1枚消費します。</b></p>
      <p class="note boss-enc-hint">🌐 挑戦チケットを使った対戦は、全ジャンルからランダムに出題されます（ふだんのランダム遭遇では、そのとき解いていたジャンルのまま出題されます）。</p>
      <p class="note boss-enc-hint">🎯 出現するボスの候補は、ランダム遭遇と同じ条件で絞り込まれます。今回の候補：${esc(names)}</p>
      <div class="boss-enc-choices">
        <button class="boss-enc-btn" onclick="showHome()">やめる</button>
        <button class="boss-enc-btn selected" onclick="useTicketAndFight()">チケットを1枚使って挑戦する</button>
      </div>
      <div class="boss-enc-choices">
        ${chooseBtnHtml}
      </div>
    </div>`;
}
/* 挑戦チケットの抽選対象は、ランダム遭遇（randomEncounterBoss）と完全に同じ条件にする
   （2026-07-19〜、教員の指示・確認済み）。minXpRatioを持つボスは「ことのはの経験値」が
   recPts×minXpRatio未満のうちは対象外、かつisBossRetired（経験値が伸びると低い適正経験値の
   ボスが「卒業」して対象外になる仕組み。neverRetires:trueのサノー・シゲっちは対象外）も
   同様に適用する。以前の「今の経験値（すでに使った分もふくむ）以下のボスだけ」という
   独自の上限ルールは廃止し、ランダム遭遇に出てくるボスの候補と完全に一致させる。 */
function ticketEligibleBosses(xp){
  return BOSSES.filter(b => (!b.minXpRatio || xp >= b.recPts * b.minXpRatio) && !isBossRetired(b, xp));
}
/* チケット3枚を使って、ticketEligibleBossesの候補の中から任意の1体を選んで挑戦する
   （2026-08-23〜、教員の指示）。抽選（ランダム）ではなく確定選択なので、useTicketAndFightとは
   別関数にし、候補一覧をボタンで並べる。 */
function showTicketChooseBoss(){
  const st = loadStats();
  if((st.bossTickets||0) < TICKET_CHOOSE_COST){ showTicketConfirm(); return; }
  const xp = kotonohaTotalXP(st);
  const candidates = ticketEligibleBosses(xp);
  const listHtml = candidates.map(b => `
    <button class="boss-choose-btn" onclick="useTicketAndFightChosen('${b.id}')">
      <span class="icon">${b.icon}</span>
      <span class="name">${esc(b.name)}　<span class="boss-lv-tag">Lv.${b.lv||"?"}</span></span>
      <span class="recpts">適正経験値：${b.hideRecPts ? "？？？" : (b.recPts||0)+"pt"}</span>
    </button>`).join("");
  screen.innerHTML = `
    <div class="card boss-encounter">
      <div class="boss-enc-icon">🎟️🎟️🎟️</div>
      <p class="boss-enc-text">チケットを${TICKET_CHOOSE_COST}枚使って、挑戦したいボスを選んでください。</p>
      <p class="note boss-enc-hint">（今の手持ち：${st.bossTickets||0}枚）</p>
      <div class="boss-choose-list">${listHtml}</div>
      <div class="boss-enc-choices">
        <button class="boss-enc-btn" onclick="showTicketConfirm()">もどる</button>
      </div>
    </div>`;
}
function useTicketAndFightChosen(bossId){
  const st = loadStats();
  if((st.bossTickets||0) < TICKET_CHOOSE_COST){ showHome(); return; }
  const xp = kotonohaTotalXP(st);
  const boss = ticketEligibleBosses(xp).find(b => b.id === bossId);
  if(!boss){ showTicketConfirm(); return; } // 候補から外れていたら（経験値変動等）安全に戻す
  st.bossTickets -= TICKET_CHOOSE_COST;
  saveStats(st);
  pendingBoss = boss;
  pendingBossAllGenre = true;
  pendingBossHyakunin = false;
  bossPromptResumeFn = () => showHome();
  bossPromptActive = true;
  bossPromptSelection = "no";
  renderBossPrompt();
}
function useTicketAndFight(){
  const st = loadStats();
  if((st.bossTickets||0) <= 0){ showHome(); return; }
  st.bossTickets -= 1;
  saveStats(st);
  const candidates = ticketEligibleBosses(kotonohaTotalXP(st));
  const boss = candidates[Math.floor(Math.random() * candidates.length)];
  // どのボスが出たかを見せてから、あらためて「勝負する」を選んでもらう（renderBossPromptを共用）
  pendingBoss = boss;
  pendingBossAllGenre = true;
  pendingBossHyakunin = false;
  bossPromptResumeFn = () => showHome();
  bossPromptActive = true;
  bossPromptSelection = "no";
  renderBossPrompt();
}
function isTreasureItem(name){ return TREASURE_NAMES.has(name); }
function itemListHtml(keys, items){
  return `<ul class="item-list">` + keys.map(name =>
    `<li><span>${esc(name)}</span><span class="item-count">×${items[name]}</span></li>`
  ).join("") + `</ul>`;
}
/* 宝具は、ボス戦とは別に「アイテム一覧」画面からいつでも使える（2026-07-14〜）。使うと1個消費され、
   プレイヤーの経験値（bonusExp、ステータスポイントにも「ことのは」の育成経験値にも反映される）が
   上がる。シランちゃんの宝具だけ特別に効果が大きい。使った宝具は「使用済みの宝具」として別枠に
   記録され、その分はもう使えない（消費した個数だけst.usedTreasuresに積み上がる）。 */
function treasureExpAmount(name){
  if(name === KOKUGO_KAMI_BOSS.treasure) return 1000;
  if(name === SHIRAN_BOSS.treasure) return 300;
  return 50;
}
/* シランちゃんの宝具「シランちゃんの秘密ノート」は、生涯で3回までしか使用を認めない
   （2026-07-22〜、教員の指示）。アイテム自体は今までどおり何個でもドロップ・所持できるが、
   使用（＝経験値化）だけがこの上限で止まる。 */
const SHIRAN_TREASURE_USE_CAP = 3;
/* この上限を導入する前にすでに3回を超えて使っていたプレイヤーへの遡及措置。st.bonusExpという
   「これまでに宝具で得た経験値の生の合計」自体は書き換えず（過去の履歴として正確なまま残す）、
   上限を超えて使った分の経験値だけを、totalEarnedStatPoints/kotonohaTotalXPが実際に使う
   「有効な経験値」を計算するその場で差し引く（KOTONOHA_XP_CAPと同じ「保存せず毎回計算し直す」
   設計を踏襲）。他の要素（分野レベル・他の宝具の経験値）が少ないプレイヤーは、この差し引きで
   有効な経験値がマイナスになりうる（教員の指示どおり）。 */
function shiranTreasureOverusePenalty(st){
  const used = (st.usedTreasures && st.usedTreasures[SHIRAN_BOSS.treasure]) || 0;
  return Math.max(0, used - SHIRAN_TREASURE_USE_CAP) * treasureExpAmount(SHIRAN_BOSS.treasure);
}
function effectiveBonusExp(st){
  return (st.bonusExp||0) - shiranTreasureOverusePenalty(st);
}
function useTreasureItem(name){
  const st = loadStats();
  if(!(st.items && st.items[name] > 0)) return;
  if(name === SHIRAN_BOSS.treasure){
    const used = (st.usedTreasures && st.usedTreasures[name]) || 0;
    if(used >= SHIRAN_TREASURE_USE_CAP){
      alert(`「${name}」は、もう使えません（使用回数の上限：${SHIRAN_TREASURE_USE_CAP}回に達しています）。`);
      return;
    }
  }
  const amount = treasureExpAmount(name);
  st.items[name]--;
  if(st.items[name] <= 0) delete st.items[name];
  if(!st.usedTreasures) st.usedTreasures = {};
  st.usedTreasures[name] = (st.usedTreasures[name]||0) + 1;
  st.bonusExp = (st.bonusExp||0) + amount;
  saveStats(st);
  alert(`✨「${name}」を使った！ 経験値が${amount}上がった！`);
  showItemCollection();
}
function showItemCollection(){
  const st = loadStats();
  const items = st.items || {};
  const usedTreasures = st.usedTreasures || {};
  const usedStoryRewards = st.usedStoryRewards || {};
  const allKeys = Object.keys(items);
  const normalKeys = allKeys.filter(name => !isTreasureItem(name) && !isStoryRewardItem(name) && !isRebirthSeedItem(name)).sort((a,b)=> items[b]-items[a]);
  const treasureKeys = allKeys.filter(name => isTreasureItem(name)).sort((a,b)=> items[b]-items[a]);
  const usedTreasureKeys = Object.keys(usedTreasures).filter(name => usedTreasures[name] > 0).sort((a,b)=> usedTreasures[b]-usedTreasures[a]);
  const usedStoryRewardKeys = Object.keys(usedStoryRewards).filter(name => usedStoryRewards[name] > 0);
  let html = `<div class="card"><h3 class="section">🎒 これまで獲得したアイテム</h3>`;
  if(allKeys.length === 0 && usedTreasureKeys.length === 0 && usedStoryRewardKeys.length === 0){
    html += `<p class="note">まだ何も手に入れていません。問題に取り組んでいると、ごくまれにボスが勝負をしかけてくることがあります。勝つとアイテムがもらえます。</p>`;
  }else{
    html += `<h4 class="item-group-title">📦 通常アイテム</h4>`;
    html += normalKeys.length ? itemListHtml(normalKeys, items) : `<p class="note">まだありません。</p>`;
    html += storyRewardSectionHtml(st);
    html += rebirthSeedSectionHtml(st);
    html += `<h4 class="item-group-title treasure-title">✨ 伝説の宝具</h4>`;
    html += treasureKeys.length
      ? `<ul class="item-list treasure-list">` + treasureKeys.map(name => {
          const isCappedOut = name === SHIRAN_BOSS.treasure && (usedTreasures[name]||0) >= SHIRAN_TREASURE_USE_CAP;
          const action = isCappedOut
            ? `<span class="note" style="margin:0">使用回数の上限（${SHIRAN_TREASURE_USE_CAP}回）に達したため、もう使えません</span>`
            : `<button class="btn inline" onclick="useTreasureItem('${esc(name)}')">使う（経験値+${treasureExpAmount(name)}）</button>`;
          return `<li class="treasure"><span>✨ ${esc(name)}</span><span class="item-count">×${items[name]}</span>${action}</li>`;
        }).join("") + `</ul>`
      : `<p class="note">まだ手に入れていません。ボスに勝つと、まれに手に入ります。</p>`;
    html += `<p class="note">✨ 宝具を使うと経験値が上がりますが、1個使うごとに手元から1個消費されます。</p>`;
    if(usedTreasureKeys.length){
      html += `<h4 class="item-group-title">💤 使用済みの宝具</h4>
        <ul class="item-list">` + usedTreasureKeys.map(name =>
          `<li><span>💤 ${esc(name)}</span><span class="item-count">×${usedTreasures[name]}</span></li>`
        ).join("") + `</ul>`;
    }
  }
  html += `<button class="btn secondary" onclick="showHome()">ホームへ</button></div>`;
  screen.innerHTML = html;
}

/* ================= 成績・称号 ================= */
function showStats(){
  const st = loadStats();
  const rows = CAT_KEYS.map(k => [k, CATS[k].name]).concat([["dokkai","読解"]]);
  let weakest = null;
  /* 「今のことのは（ドラゴン）の状態が記録画面でも見えるようにしてほしい」という要望
     （2026-08-21〜）を受けて追加。ホーム画面のkotonohaCardHtmlをそのまま流用しているので、
     見た目・ステータス・転生ボタンまで含めて完全に同じ内容が表示される（二重管理を避けるため
     複製せず共通関数を呼ぶだけ）。転生すると育て直し（卵からの再スタート）になる仕様上、
     ここで今の状態を確認したり、下の「記録を書き出す」でファイルに保存しておけたりする。 */
  let html = kotonohaCardHtml(st);
  html += `<div class="card"><h3 class="section">成績（累計）</h3><table class="stats">
    <tr><th>分野</th><th>称号</th><th style="text-align:right">Lv</th><th style="text-align:right">解いた数</th><th style="text-align:right">正解</th><th style="width:22%">正答率<br><span style="font-weight:normal">(直近30問)</span></th><th style="width:18%">問題解放率</th></tr>`;
  rows.forEach(([k,label])=>{
    const s = st.cats[k] || {t:0,c:0};
    /* 正答率は「解いた数」「正解」の累計比ではなく、直近30問（RECENT_ACC_WINDOW）の
       ローリング正答率を表示する（2026-07-15〜）。累計比だと、長く続けているほど
       最近の調子が反映されにくくなり、成績の推移が見えづらいというユーザーの指摘による変更。
       30問に満たない分野は、そこまでの全部が「直近」になる（st.recentCorrectはrecord()で
       すでに全分野・毎回蓄積されているので、この画面のためだけの新しい記録は不要）。 */
    const recent = (st.recentCorrect && st.recentCorrect[k]) || [];
    const rate = recent.length ? recent.reduce((a,b)=>a+b, 0) / recent.length : null;
    if(k!=="dokkai" && rate!==null && s.t>=4 && (weakest===null || rate<weakest.rate)) weakest = {label, rate};
    const t = titleOf(st.lv[k]);
    const unlockPct = catUnlockedQuestionPct(st, k);
    html += `<tr>
      <td>${esc(label)}</td>
      <td>${t.icon}${esc(t.name)}</td>
      <td class="num">${st.lv[k]}</td>
      <td class="num">${s.t}</td>
      <td class="num">${s.c}</td>
      <td>${rate===null ? "<span style='color:var(--sub)'>未挑戦</span>"
          : `${Math.round(rate*100)}%<div class="bar"><div style="width:${rate*100}%"></div></div>`}</td>
      <td>${unlockPct===null ? "<span style='color:var(--sub)'>ー</span>"
          : `${unlockPct}%<div class="bar"><div style="width:${unlockPct}%"></div></div>`}</td>
    </tr>`;
  });
  html += `</table>`;
  let mastered=0, learning=0, unseen=0, totalQ=0;
  CAT_KEYS.forEach(cat=>{
    CATS[cat].items.forEach(it=>{
      totalQ++;
      const s = qStat(st, cat, it);
      if(!s || s.t===0) unseen++;
      else if(s.t>=2 && s.c===s.t) mastered++;
      else learning++;
    });
  });
  html += `<div class="mastery">
    <span>✅ 習得ずみ <b>${mastered}</b>問</span>
    <span>📖 練習中 <b>${learning}</b>問</span>
    <span>🆕 未挑戦 <b>${unseen}</b>問</span>
    <span>（知識問題 全${totalQ}問）</span>
  </div>`;
  if(weakest && weakest.rate < 0.8){
    html += `<p class="note weak">▶ 今いちばんのばせそうなのは「${esc(weakest.label)}」。集中して取り組んでみよう。</p>`;
  }
  html += `</div>`;
  html += `<div class="card"><h3 class="section">🎓 今の学年の目安</h3>
    <p class="note">正解・不正解に応じて自動調整される出題の難しさをもとに、今どのくらいの学年の内容にちょうどよく取り組めているかの<b>目安</b>を、分野ごとに表示します。</p>
    <table class="stats"><tr><th>分野</th><th>学年の目安</th></tr>`;
  const gradeEstimates = [];
  CAT_KEYS.forEach(cat=>{
    const g = estimateGrade(cat, st.diffLv[cat]||1);
    if(g === null) return;
    gradeEstimates.push(g);
    html += `<tr><td>${esc(CATS[cat].name)}</td><td>${esc(GRADE_LABELS[g])}</td></tr>`;
  });
  html += `</table>`;
  if(gradeEstimates.length){
    const overall = Math.min(6, Math.max(1, Math.round(gradeEstimates.reduce((s,g)=>s+g,0) / gradeEstimates.length)));
    html += `<p class="note">▶ 全体の目安：<b>${esc(GRADE_LABELS[overall])}</b>くらい</p>`;
  }
  html += `</div>`;
  html += `<div class="card"><h3 class="section">称号のみちのり（分野ごと）</h3><ul class="titlelist">`;
  TITLES.filter(x=>!x.hidden).forEach(x=>{
    html += `<li>${x.icon} Lv.${x.lv}〜　${esc(x.name)}</li>`;
  });
  html += `</ul>`;
  const hidden = TITLES.filter(x=>x.hidden);
  const maxReached = Math.max(...Object.values(st.lv));
  const revealed = hidden.filter(x=>maxReached >= x.lv);
  html += `<p class="note">⚡ Lv.1000から先には、100レベルごとに<b>かくされた称号</b>が待っている（全${hidden.length}個）。到達したとき、はじめて正体が明かされる…！</p>`;
  if(revealed.length){
    html += `<p class="note">これまでに明かした称号：</p><ul class="titlelist">`;
    revealed.forEach(x=>{ html += `<li>${x.icon} Lv.${x.lv}〜　${esc(x.name)}</li>`; });
    html += `</ul>`;
  }
  const nextHidden = hidden.find(x=>maxReached < x.lv);
  if(nextHidden){
    html += `<p class="note">❓ 次のかくし称号：Lv.${nextHidden.lv}〜　？？？</p>`;
  }
  html += `</div>`;
  const misses = Object.values(st.q)
    .filter(s => s.cat !== "dokkai" && s.t > 0 && s.c < s.t)
    .sort((a,b) => (a.c/a.t) - (b.c/b.t))
    .slice(0,5);
  if(misses.length){
    html += `<div class="card"><h3 class="section">よく間違える問題</h3><ul class="misslist">`;
    misses.forEach(s=>{
      html += `<li><span>${esc(s.q)}</span>
        <span class="cat">${esc(CATS[s.cat] ? CATS[s.cat].name : s.cat)}　${s.c}/${s.t}回正解</span></li>`;
    });
    html += `</ul>
      <button class="btn" onclick="startReview()">この問題たちを復習する</button></div>`;
  }
  html += diagEntryHtml(st);
  html += `<div class="card"><h3 class="section">きろくの保存・引きつぎ</h3>
    <p style="font-size:.88rem">記録は自動でこのブラウザに保存され、再読み込みしても消えません。
    ただし<b>別のパソコンやタブレット、別のブラウザには引き継がれません</b>。
    大事な記録は「書き出す」でファイルに保存しておくと、いつでも元にもどせます。</p>
    <div class="btn-row">
      <button class="btn" onclick="exportData()">💾 記録を書き出す（保存）</button>
      <button class="btn secondary" onclick="document.getElementById('importFile').click()">📂 記録を読み込む（復元）</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importData(this)">
    </div></div>`;
  html += `<div class="btn-row" style="margin-top:4px">
      <button class="btn secondary" onclick="resetStats()">記録をリセット</button>
      <button class="btn" onclick="showHome()">ホームへ</button>
    </div>
    <p class="note">※ 記録（レベル・称号・正誤）は自動保存です。端末をかえるときは上の「書き出す→読み込む」で引きつぎできます。</p>`;
  screen.innerHTML = html;
}
function resetStats(){
  const pw = prompt("記録をリセットするには、パスワードを入力してください。");
  if(pw === null) return;
  if(pw !== "kichi1205"){ alert("パスワードが違います。"); return; }
  if(!confirm("本当にすべての記録（レベル・称号・正誤）を消しますか？")) return;
  saveStats(emptyStats());
  showStats();
}

/* ================= 記録の保存・引きつぎ ================= */
function exportData(){
  const st = loadStats();
  const payload = {app:"kokugoTraining", ver:5, savedAt:new Date().toISOString(), data:st};
  const blob = new Blob([JSON.stringify(payload)], {type:"application/json"});
  const a = document.createElement("a");
  const d = new Date();
  const pad = n => String(n).padStart(2,"0");
  a.href = URL.createObjectURL(blob);
  a.download = `知識ドリルDX記録_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const payload = JSON.parse(reader.result);
      const st = payload && payload.app === "kokugoTraining" ? payload.data : payload;
      if(!st || !st.cats || !st.q || !st.lv) throw new Error("形式ちがい");
      if(isSaveFromNewerVersion(st)){
        alert("このファイルは、これより新しいバージョンの「知識ドリルDX」で保存されたものです。\nこのページ（古いバージョン）では読み込めません。最新版のページで開き直してください。");
        return;
      }
      const saved = payload && payload.savedAt ? new Date(payload.savedAt) : null;
      const dateStr = saved && !isNaN(saved) ? `${saved.getFullYear()}年${saved.getMonth()+1}月${saved.getDate()}日 ${String(saved.getHours()).padStart(2,"0")}:${String(saved.getMinutes()).padStart(2,"0")}` : "不明";
      const xp = kotonohaTotalXP(st);
      const confirmMsg = `このファイルの記録を読み込みます。\n\n保存日時：${dateStr}\nことのはの経験値：${xp}\n\nこの内容でよろしければ「OK」を押してください。今のブラウザの記録は上書きされます。`;
      if(!confirm(confirmMsg)) return;
      saveStats(st);
      alert("記録を読み込みました！");
      showStats();
    }catch(e){
      alert("このファイルは読み込めませんでした。「記録を書き出す」で保存したファイルを選んでください。");
    }
  };
  reader.readAsText(file);
}

/* ================= オープニング演出（プロローグ） =================
   このアプリを開いたとき（＝ブラウザで最初から読み込まれたとき）に必ず一度だけ再生する、
   短い全画面演出。アプリ内の画面遷移はページの読み込み直しをともなわないため、
   「初回起動時」も「ブラウザの更新時」も、この起動シーケンスが実行されるタイミングと一致する。
   しつこくならないよう、セリフは短く・少なくしてある。 */
const PROLOGUE_STEPS = [
  {text:"言葉が力を失いつつある時代"},
  {text:"見つけた。\n\n\n僕を育ててくれる人。"},
  {icon:"🥚", text:"ぼくは、【ことのは】。\n\n\n君の言葉の力とともに\nぼくも育つ。"},
  {text:"さあ、ともに成長しよう"},
];
let prologueIdx = 0;
let prologueOnDone = null;
let prologueEl = null;
function showPrologue(onDone){
  prologueIdx = 0;
  prologueOnDone = onDone;
  prologueEl = document.createElement("div");
  document.body.appendChild(prologueEl);
  renderPrologueStep();
}
function renderPrologueStep(){
  const step = PROLOGUE_STEPS[prologueIdx];
  const isLast = prologueIdx === PROLOGUE_STEPS.length - 1;
  prologueEl.className = "prologue-overlay";
  prologueEl.onclick = advancePrologue;
  prologueEl.innerHTML = `
    ${step.icon ? `<div class="prologue-icon">${step.icon}</div>` : ""}
    <p class="prologue-text">${step.text}</p>
    <span class="prologue-skip" onclick="event.stopPropagation(); finishPrologue();">スキップ</span>
    <p class="prologue-hint">${isLast ? "タップしてはじめる" : "タップしてすすむ"}</p>`;
}
function advancePrologue(){
  prologueIdx++;
  if(prologueIdx >= PROLOGUE_STEPS.length){ finishPrologue(); return; }
  renderPrologueStep();
}
function finishPrologue(){
  if(prologueEl){ prologueEl.remove(); prologueEl = null; }
  const fn = prologueOnDone; prologueOnDone = null;
  if(fn) fn();
}

/* 起動時ガード：保存されている記録が、今開いているコードより新しいverで作られていたら、
   通常の起動（showPrologue/showHomeなど）を一切行わない。ここでアプリの初期化を止めることで、
   その後どこからもsaveStats()が呼ばれず、新しい記録が古い形式で上書きされる事故を防ぐ。 */
function bootApp(){
  let savedTooNew = false;
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) savedTooNew = isSaveFromNewerVersion(JSON.parse(raw));
  }catch(e){}
  if(savedTooNew){
    document.body.innerHTML = `
      <div style="max-width:480px;margin:60px auto;padding:24px;text-align:center;font-family:inherit;">
        <div style="font-size:2.4rem;margin-bottom:12px;">⚠️</div>
        <h2 style="margin-bottom:14px;">このページは古いバージョンです</h2>
        <p style="line-height:1.7;">保存されている記録は、これより新しいバージョンの「知識ドリルDX」で作られたものです。<br>
        このままだと記録が正しく読み込めないため、起動を停止しました。<br><br>
        最新版のページを開き直してください。</p>
      </div>`;
    return;
  }
  if(resumeBossBattleIfSaved()) return;
  showPrologue(showHome);
}

/* ================================================================
   ストーリーモード（2026-07-16〜、β版）
   丸ごと削除する場合は、このブロック全体と、以下4箇所の追記を戻すだけでよい：
   ・emptyStats()内の story フィールド
   ・loadStats()内の story マイグレーション（if(!st.story)…の8行）
   ・showHome()内の `html += storyEntryHtml(st);` の1行
   ・showItemCollection()内の3箇所（usedStoryRewards関連・normalKeysのフィルタ・storyRewardSectionHtml呼び出し）
   （SAVE_FORMAT_VERSIONは戻さなくても実害はない）

   出題の基本設計（2026-07-16〜、今後の章にも適用する標準ルール）：
   ・ミニクイズ（quiz beat）：プレイヤーのステータスに関係なく、直近STORY_QUIZGATE_WINDOW問中
     STORY_QUIZGATE_NEED問正解で次のシーンへ進める「合格ゲート」方式。制限時間なし。1問ごとに
     record()を呼ぶので分野レベル・XPには通常どおり反映される（再プレイ時を除く）。
   ・イベント戦（battle beat、中ボス）：既存のボス戦システム（HP・ステータス依存の戦闘）は使わず、
     STORY_BATTLE_TOTAL問中STORY_BATTLE_NEED問正解で確定クリアという、
     プレイヤーのステータスに一切依存しない出題形式。原則record()は呼ばない
     （このアプリの全ボス戦と同じく、イベント戦の正誤は分野レベル・XPに反映しない）が、
     beat.trackLevel:trueを付けた場合だけ例外的にrecord()を呼び、分野レベルに反映する
     （2026-07-19〜、第6章の識別テスト用。詳細はstoryGradeBattle参照）。
     1問STORY_BATTLE_TIME_MS（15秒）の制限時間があり（2026-07-17〜）、アイテムは使えない。
     時間切れは不正解として扱う。クリアできなければbeatIdxを進めず、0問目からやり直しになる。
     beat.filterTagを付けると、beat.catの問題プールのうちit.tagが一致するものだけに絞って
     出題する（pickBattleQuestion参照。カテゴリ全体ではなく特定のテーマだけ出題したいとき用）。
   ・選択肢問題（judgedChoice beat、2026-07-17〜）：正誤のある固定の選択肢問題。地の文の分岐用の
     choice beatとは別枠で、正誤をst.story.judgedRunCorrect/judgedRunTotalに積み上げ、章クリア時に
     st.story.judgedBest[章key]（自己ベストの正答率）と比較し、上回ったときだけ上書きする
     （storyFinalizeJudgedRate参照）。全問正解を達成した瞬間（自己ベストが初めて100%になったとき）
     だけ、STORY_JUDGED_PERFECT_ITEMを1個入手する（クリア報酬アイテム枠）。制限時間なし。
     beat.shuffle:trueを付けると、表示のたびに選択肢の並び順をランダム化する（2026-07-19〜、
     正解の位置を覚えてしまう対策。storyRenderJudgedChoice参照）。
   ・記述問題（shortAnswer beat、2026-07-19〜）：judgedChoiceの自由入力版。beat.answersに
     直書きした答えと、入力欄の内容をnormalizeAns経由で照合する。record()もjudgedRunCorrect/
     Totalへの加算もしない、単発の一問一答（storyRenderShortAnswer参照）。
   ・コンボアタック（combo beat、2026-07-19〜）：beat.catの4択問題をSTORY_COMBO_TIME_MS
     （60秒）のあいだ連続で出題し続けるタイムアタック。最大コンボ（連続正解）がSTORY_COMBO_NEED

/* クリア報酬アイテム（章クリアで確定ドロップする通常アイテムのうち、使うと経験値が上がるもの）。
   宝具（TREASURE_NAMES／useTreasureItem）とは別枠の、ストーリーモード専用の使用可能アイテム分類。
   名前→使用時にもらえる経験値量のMap（2026-07-19〜、教員の指示で「太郎からのお礼メモ」だけ
   標準の20ではなく50にしたため、以前のSet（全アイテム一律20）からMapに変更した）。 */
const STORY_REWARD_EXP_AMOUNT = 20;
const STORY_REWARD_ITEM_EXP = new Map([
  [STORY_EVENT_BOSSES.printPile.item, STORY_REWARD_EXP_AMOUNT],
  [STORY_EVENT_BOSSES.selfIntroCard.item, STORY_REWARD_EXP_AMOUNT],
  [STORY_EVENT_BOSSES.newsGalley.item, STORY_REWARD_EXP_AMOUNT],
  [STORY_EVENT_BOSSES.baseballMatch.item, STORY_REWARD_EXP_AMOUNT],
  [STORY_EVENT_BOSSES.kotowazaTimeAttack.item, STORY_REWARD_EXP_AMOUNT],
  [STORY_EVENT_BOSSES.setsuzokushiTest.item, STORY_REWARD_EXP_AMOUNT],
  [STORY_EVENT_BOSSES.setsuzokushiTest.item2, 50],
  [STORY_EVENT_BOSSES.busyuMaster.item, STORY_REWARD_EXP_AMOUNT],
  [STORY_EVENT_BOSSES.kumiSloganNouns.item, STORY_REWARD_EXP_AMOUNT],
  [STORY_JUDGED_PERFECT_ITEM, STORY_REWARD_EXP_AMOUNT],
]);
function isStoryRewardItem(name){ return STORY_REWARD_ITEM_EXP.has(name); }
function useStoryRewardItem(name){
  const st = loadStats();
  if(!(st.items && st.items[name] > 0)) return;
  const expAmount = STORY_REWARD_ITEM_EXP.get(name) || STORY_REWARD_EXP_AMOUNT;
  st.items[name]--;
  if(st.items[name] <= 0) delete st.items[name];
  if(!st.usedStoryRewards) st.usedStoryRewards = {};
  st.usedStoryRewards[name] = (st.usedStoryRewards[name]||0) + 1;
  st.bonusExp = (st.bonusExp||0) + expAmount;
  saveStats(st);
  alert(`🎁「${name}」を使った！ 経験値が${expAmount}上がった！`);
  showItemCollection();
}
function storyRewardSectionHtml(st){
  const items = st.items || {};
  const used = st.usedStoryRewards || {};
  const keys = Object.keys(items).filter(isStoryRewardItem).sort((a,b)=> items[b]-items[a]);
  const usedKeys = Object.keys(used).filter(name => used[name] > 0).sort((a,b)=> used[b]-used[a]);
  if(keys.length === 0 && usedKeys.length === 0) return "";
  let html = `<h4 class="item-group-title treasure-title">🎁 クリア報酬アイテム</h4>`;
  if(keys.length){
    html += `<ul class="item-list treasure-list">` + keys.map(name =>
      `<li class="treasure"><span>🎁 ${esc(name)}</span><span class="item-count">×${items[name]}</span>
        <button class="btn inline" onclick="useStoryRewardItem('${esc(name)}')">使う（経験値+${STORY_REWARD_ITEM_EXP.get(name) || STORY_REWARD_EXP_AMOUNT}）</button></li>`
    ).join("") + `</ul>`;
    html += `<p class="note">🎁 クリア報酬アイテムを使うと経験値が上がりますが、1個使うごとに手元から1個消費されます。</p>`;
  }
  if(usedKeys.length){
    html += `<h4 class="item-group-title">💤 使用済みのクリア報酬アイテム</h4>
      <ul class="item-list">` + usedKeys.map(name =>
        `<li><span>💤 ${esc(name)}</span><span class="item-count">×${used[name]}</span></li>`
      ).join("") + `</ul>`;
  }
  return html;
}

   出題ジャンルは部首→四字熟語に変更し、既存の`pickBattleQuestion`をそのまま使う（新規データ不要）。
   正解するとその場で分野レベルが上がる（他の中ボス／校正ミニゲームはrecord()を呼ばない設計だが、
   この野球ミニゲームだけは教員の指示で例外的にrecord()を呼ぶ）。 */
const BASEBALL_INNINGS_TOTAL = 3;
/* 打者ごとの制限時間（秒）。1人目10秒→2人目5秒→3人目2.5秒→4人目1.5秒→5人目1秒→
   6人目以降0.5秒、という教員指定のテーブル。アウトになるたびに1人目(10秒)へリセットされる
   （storyBaseballNextBatterでbatterNumberを1に戻すのは従来どおり、テーブルの中身だけ変更）。 */
const BASEBALL_TIME_TABLE_S = [10, 5, 2.5, 1.5, 1];
const BASEBALL_MIN_TIME_S = 0.5;
function baseballTimeLimit(n){
  return n <= BASEBALL_TIME_TABLE_S.length ? BASEBALL_TIME_TABLE_S[n - 1] : BASEBALL_MIN_TIME_S;
}
/* ピンチが深まるほど（＝ヒットが続いて打者番号が進むほど）、ピッチャーの気迫がこもっていく
   ――という演出用のラベル。制限時間テーブルと同じ人数区切りで対応させている。 */
const BASEBALL_SPEED_LABELS = [
  "様子見のストレート", "本腰を入れたストレート", "気迫のこもったストレート",
  "全力の剛速球", "渾身の一球",
];
function baseballSpeedLabel(n){
  return n <= BASEBALL_SPEED_LABELS.length ? BASEBALL_SPEED_LABELS[n - 1] : "限界を超えた渾身の一球";
}
/* 安打の結果（2026-07-19〜、教員の指示でヒットの価値をランダム抽選に変更）。球種はストレート
   一本のままだが、「当たりどころ」次第でヒット50%・二塁打25%・三塁打15%・ホームラン10%の
   いずれかになる（進塁数と実況メッセージが変わる）。累積確率で判定するので、
   BASEBALL_HIT_TYPESの並び順・weightの合計が1になっていることが前提。 */
const BASEBALL_HIT_TYPES = [
  { label:"ヒット",         bases:1, weight:0.50, msg:"快音！鋭い打球がフェアゾーンに転がる！ヒット！" },
  { label:"ツーベースヒット", bases:2, weight:0.25, msg:"強烈な打球が外野を割る！ツーベースヒットだ！" },
  { label:"スリーベースヒット", bases:3, weight:0.15, msg:"大きな当たり！三塁まで走りきるスリーベースヒット！" },
  { label:"ホームラン",       bases:4, weight:0.10, msg:"特大アーチ！スタンドまで運ぶホームランだ！" },
];
function pickBaseballHitType(){
  const r = Math.random();
  let acc = 0;
  for(const h of BASEBALL_HIT_TYPES){
    acc += h.weight;
    if(r < acc) return h;
  }
  return BASEBALL_HIT_TYPES[BASEBALL_HIT_TYPES.length - 1];
}
// bases: [1塁,2塁,3塁]の真偽値配列。advanceで打者含め押し出す(元のjsxのadvanceRunnersと同じロジック)。
function baseballAdvanceRunners(bases, n){
  const occupied = [true, ...bases];
  const newBases = [false, false, false];
  let runsScored = 0;
  for(let i = 0; i < occupied.length; i++){
    if(!occupied[i]) continue;
    const newPos = i + n;
    if(newPos >= 4) runsScored += 1;
    else if(newPos >= 1) newBases[newPos - 1] = true;
  }
  return { newBases, runsScored };
}
/* 相手チームの得点（2026-07-18〜、強豪校の設定にあわせて1〜4点のランダム、さらに10%の確率で
   5点を許してしまう、という教員指定の分布に変更）。 */
function baseballOpponentRuns(){
  if(Math.random() < 0.1) return 5;
  return 1 + Math.floor(Math.random() * 4); // 1〜4点
}

/* 一人称選択（ch1のpronoun choice）の表示名。ホーム画面の「相棒」表記などで使う。 */
const STORY_PRONOUN_LABELS = {
  watashi:"私", atashi:"あたし", ore:"俺", boku:"ボク",
  oira:"おいら", oidon:"おいどん", sessha:"せっしゃ", maro:"まろ",
};
/* 一章クリア後にのみ、選んだ一人称を返す（未クリア・未選択ならnull）。
   章を再プレイしてpronoun choiceを選び直せば、この値もすぐ更新される。 */
function storyChosenPronoun(st){
  const sp = st.story;
  if(!sp || !sp.completedChapters.includes("ch1")) return null;
  return STORY_PRONOUN_LABELS[sp.flags.pronoun] || null;
}

/* 組団スローガン選択（ch8のkumiSlogan choice）の表示名。pronounと同じパターンで、
   ホーム画面の「相棒」カードに【組】バッジとして表示する（kotonohaCardHtml参照）。 */

  jupiter:"碧組", rigel:"蒼組", rose:"紅組", amaterasu:"黄組",
};
/* 第8章クリア後にのみ、選んだ組を返す（未クリア・未選択ならnull）。
   章を再プレイしてkumiSlogan choiceを選び直せば、この値もすぐ更新される。 */
function storyChosenKumi(st){

/* サブクエストごとの自己ベストの取り出し方。多くはstに直接載せた軽量フィールド
   （vocabShooterHighScoreと同じパターン）だが、文節斬りは巻（段位）ごとに得点が
   分かれているので、その中の最高点を返す関数にしている。 */
const STORY_SIDEQUEST_BEST_FN = {
  sqShooting: st => st.vocabShooterHighScore || 0,
  sqBunsetsu: st => {
    const best = st.bunsetsuGiri && st.bunsetsuGiri.best;
    if(!best) return 0;
    return Math.max(0, ...Object.values(best));
  },
  sqBaseball: st => st.baseballHighScore || 0,
  sqPartsOfSpeech: st => {
    const b = st.partsOfSpeechBest;
    if(!b) return 0;
    return Math.max(0, ...Object.values(b));
  },
};
/* サブクエストの入口カードに出す自己ベストの文言を、単純な「自己ベスト：n点」以外の形で
   出したい場合はここに追加する（言の葉つなぎはレベルごとに得点規模が違うので、
   「最高得点：レベル◯　n点」のようにどのレベルの記録かも表示する、教員の指示）。 */
const STORY_SIDEQUEST_BEST_LABEL_FN = {
  sqPartsOfSpeech: st => {
    const b = st.partsOfSpeechBest;
    if(!b) return null;
    let bestLevel = null, bestScore = 0;
    Object.keys(b).forEach(lv=>{
      if((b[lv]||0) > bestScore){ bestScore = b[lv]; bestLevel = lv; }
    });
    if(!bestLevel || bestScore <= 0) return null;
    return `最高得点：レベル${bestLevel}　${bestScore}点`;
  },
};

/* 章の解放システム（2026-07-19〜、教員の指示で追加）。STORY_CHAPTERSの並び順で、直前の章を
   クリアしていないと次の章には挑戦できない（先頭の章は常に解放されている）。今後3章目以降を
   追加しても、この関数・呼び出し側は変更不要（並び順から自動的に判定する）。 */
function storyChapterUnlocked(key, st){
  if(STORY_SIDEQUESTS[key]) return true; // サブクエストは常に解放（メインストーリーの進行と無関係）
  const keys = Object.keys(STORY_CHAPTERS);
  const idx = keys.indexOf(key);
  if(idx <= 0) return true;
  const sp = storyProgress(st);
  return sp.completedChapters.includes(keys[idx - 1]);
}
function storyChapterButtonHtml(key, st){
  const chapter = STORY_CHAPTERS[key];
  const sp = storyProgress(st);
  if(!storyChapterUnlocked(key, st)){
    const keys = Object.keys(STORY_CHAPTERS);
    const prevTitle = STORY_CHAPTERS[keys[keys.indexOf(key) - 1]].title;
    return `

        <div><h2>${esc(chapter.title)}</h2><p>先に「${esc(prevTitle)}」をクリアすると挑戦できます。</p></div>
        <div class="right"><span class="shogo-badge">未解放</span></div>
      </div>`;
  }
  const isCompleted = sp.completedChapters.includes(key);
  const inProgress = sp.chapter === key && !isCompleted && sp.beatIdx > 0;
  const badge = isCompleted ? "クリア済み" : inProgress ? "つづきから" : "はじめから";
  const sub = isCompleted ? "クリア済み。もう一度プレイすることもできます。" : inProgress ? "続きから読み進めよう" : "タップして読みはじめる";
  const best = sp.judgedBest && sp.judgedBest[key];
  const rateNote = best ? `<p class="note">クリア率 ${Math.round(100*best.correct/best.total)}%</p>` : "";
  const comboBest = sp.comboBest && sp.comboBest[key];
  const comboNote = comboBest ? `<p class="note"><span class="shogo-badge top">🔥 最大コンボ数 ${comboBest}回</span></p>` : "";
  return `
    <div class="card menu-card" onclick="startStoryMode('${key}')">
      <div class="menu-icon">📖</div>
      <div><h2>${esc(chapter.title)}</h2><p>${esc(sub)}</p>${rateNote}${comboNote}</div>
      <div class="right"><span class="shogo-badge">${esc(badge)}</span></div>
    </div>`;
}
/* chapterKeyを渡すと、今保存されている進行中の章と違う場合だけ切り替えて先頭から始める
   （同じ章ならbeatIdxをそのまま維持し、続きから／クリア済み画面から再開する）。
   引数なしの呼び出し（既存コード・vmテスト等）は今までどおり現在の章をそのまま再開する。
   chapterKeyが指定されていて、かつまだ解放されていない章の場合は何もしない（画面上は
   ボタンのonclick自体を外しているので通常は起きないが、念のための二重ガード）。 */
function startStoryMode(chapterKey){
  if(chapterKey){
    const st = loadStats();
    if(!storyChapterUnlocked(chapterKey, st)){ showHome(); return; }
    const sp = storyProgress(st);
    /* サブクエストは「クリア」という概念のない常設スコアアタックのため、メインストーリーの
       既存の挙動（クリア済みの章をタップすると、まずクリア画面だけを再表示する。作り直すには
       専用の「もう一度プレイする」ボタンを押す必要がある）とは違い、一覧からタップするたびに
       毎回beatIdx0から新しいプレイを始める（教員の指示、2026-08-10〜）。 */
    const isSideQuest = !!STORY_SIDEQUESTS[chapterKey];
    if(sp.chapter !== chapterKey || isSideQuest){
      sp.chapter = chapterKey;
      storyResetJudgedRun(sp);
      /* サブクエストは毎回beatIdx0からだが、2回目以降は導入の「line」セリフを毎回
         読ませると煩わしいので、一度でも遊んだことがあれば最初の非line beat（ゲーム本体）
         まで自動で読み飛ばす（教員の指示、2026-08-10〜）。st.sideQuestSeenは
         vocabShooterHighScoreと同じくstに直接載せる軽量フラグで、旧セーブにも
         存在しないだけで安全にfalsy扱いされるためSAVE_FORMAT_VERSIONの更新は不要。 */
      if(isSideQuest){
        if(!st.sideQuestSeen) st.sideQuestSeen = {};
        const alreadySeen = !!st.sideQuestSeen[chapterKey];
        st.sideQuestSeen[chapterKey] = true;
        let startIdx = 0;
        if(alreadySeen){
          const beats = STORY_SIDEQUESTS[chapterKey].beats;
          const idx = beats.findIndex(b => b.type !== "line");
          if(idx >= 0) startIdx = idx;
        }
        sp.beatIdx = startIdx;
      }else{
        sp.beatIdx = 0;
      }
    }
    saveStats(st);
  }
  storyRun = storyFreshRun();
  storyRenderBeat();
}
function storyRenderBeat(){
  const st = loadStats();
  const sp = storyProgress(st);
  const chapter = storyChapterDef(sp.chapter);
  if(!chapter || sp.beatIdx >= chapter.beats.length){ storyChapterEnd(); return; }
  const beat = chapter.beats[sp.beatIdx];
  if(beat.type === "line") storyRenderLine(beat, sp);
  else if(beat.type === "choice") storyRenderChoice(beat);
  else if(beat.type === "judgedChoice") storyRenderJudgedChoice(beat);
  else if(beat.type === "shortAnswer") storyRenderShortAnswer(beat);
  else if(beat.type === "match") storyRenderMatch(beat);
  else if(beat.type === "quiz") storyRenderQuiz(beat, sp.beatIdx);
  else if(beat.type === "battle") storyRenderBattle(beat, sp.beatIdx);
  else if(beat.type === "proofread") storyRenderProofread(beat);
  else if(beat.type === "baseball") storyRenderBaseball(beat, sp.beatIdx);
  else if(beat.type === "combo") storyRenderCombo(beat, sp.beatIdx);
  else if(beat.type === "wordPick") storyRenderWordPick(beat);
  else if(beat.type === "shooting") storyRenderShooting(beat, sp.beatIdx);
  else if(beat.type === "bunsetsu") storyRenderBunsetsu(beat, sp.beatIdx);
  else if(beat.type === "partsOfSpeech") storyRenderPartsOfSpeech(beat, sp.beatIdx);
  else if(beat.type === "kotonohaRebirthReveal") storyRenderKotonohaRebirthReveal();
  else showHome();
}

/* beat.variantsは[{flag, value, text}, ...]の配列。sp.flags[flag]===valueに
   最初にマッチしたものの文面を使い、どれにも一致しなければbeat.textにフォールバックする。
   選択肢の直後のセリフを、選んだ内容に応じて少しずつ変える仕組み。 */
function storyResolveText(beat, sp){
  if(beat.variants){
    const hit = beat.variants.find(v => sp.flags[v.flag] === v.value);
    if(hit) return hit.text;
  }
  return beat.text;
}
/* 太郎・花子の顔アイコン（胸から上）は第8章「体育祭」クリア後に解禁される演出
   （教員の指示）。sp.completedChaptersに"ch8"が含まれるまでは何も表示しない。

    const st = loadStats();
    if(st.kotonohaRebirth){
      const src = kotonohaRebirthImageSrc(st);
      if(src) return `<img class="story-face" src="${src}" alt="ことのは">`;
    }
    return `<div class="story-face story-face-emoji">${kotonohaForm(st).icon}</div>`;
  }
  if(!STORY_FACE_IMAGES[speaker]) return "";
  const st = loadStats();
  const sp = storyProgress(st);
  if(!sp.completedChapters.includes("ch8")) return "";
  return `<img class="story-face" src="${STORY_FACE_IMAGES[speaker]}" alt="${esc(speaker)}">`;
}
function storyRenderLine(beat, sp){
  screen.innerHTML = `
    <div class="card story-scene">
      ${beat.speaker ? `${storyFaceIconHtml(beat.speaker)}<div class="story-speaker">${esc(beat.speaker)}</div>` : ""}
      <p class="story-text">${esc(storyResolveText(beat, sp))}</p>
      <div class="btn-row" style="justify-content:center">
        <button class="btn story-advance-btn" onclick="storyAdvance()">つぎへ</button>
      </div>
    </div>
    ${storyFooterHtml()}`;
}
function storyRenderChoice(beat){
  screen.innerHTML = `
    <div class="card story-scene">
      <p class="story-text">${esc(beat.text)}</p>
      <div class="story-choices">
        ${beat.options.map((o,i)=>`<button class="btn secondary" onclick="storyChoose(${i})">${esc(o.label)}</button>`).join("")}
      </div>
    </div>
    ${storyFooterHtml()}`;
}
function storyChoose(i){
  const st = loadStats();
  const sp = storyProgress(st);
  const chapter = storyChapterDef(sp.chapter);
  const beat = chapter.beats[sp.beatIdx];
  const opt = beat.options[i];
  if(beat.flagKey) sp.flags[beat.flagKey] = opt.value;
  sp.beatIdx++;
  saveStats(st);
  storyRenderBeat();
}
function storyAdvance(){
  if(kotonohaMaybeInterruptForEvolve(() => storyAdvance())) return;
  const st = loadStats();
  const sp = storyProgress(st);
  sp.beatIdx++;
  saveStats(st);
  storyRenderBeat();
}
/* 選択肢問題（judgedChoice beat）：地の文の分岐用choiceと違い、正誤のある固定の選択肢問題。
   beat.options[i].correctがtrueの選択肢が正解。答えた瞬間にst.story.judgedRunCorrect/
   judgedRunTotalへ積み上げる（セーブされるので、章の途中でアプリを閉じて再開しても
   正しく引き継がれる）。正誤を表示してから「つぎへ」でbeatIdxを進める、2段階の操作にする。 */
/* beat.shuffle:trueの選択肢問題は、表示のたびに選択肢の並び順をランダム化する
   （2026-07-19〜、第5章「情景描写」の選択肢問題用。正解がいつも同じ位置に来てしまうと
   考えずに覚えてしまう生徒がいる、という教員の指示）。並び順はquiz/battle beatと同じく
   storyRun.orderに保存し、ボタンのonclickには常に「元のoptions配列でのindex」を埋め込むので、
   storyJudgedChoose自体は並び替えの有無を意識しなくてよい。 */
function storyRenderJudgedChoice(beat){
  clearChoiceKeys();
  const order = beat.shuffle ? shuffledOrder(beat.options.length) : beat.options.map((_,i)=>i);
  storyRun.order = order;
  screen.innerHTML = `
    <div class="card story-scene judged-scene">
      ${beat.speaker ? `${storyFaceIconHtml(beat.speaker)}<div class="story-speaker">${esc(beat.speaker)}</div>` : ""}
      ${beat.intro ? `<p class="story-text">${esc(beat.intro)}</p>` : ""}
      <p class="story-text">${esc(beat.text)}</p>
      <p class="judged-badge">※正しいものを選んでください※</p>
      <div class="choices">
        ${order.map((oi,pos)=>`<button class="choice" onclick="storyJudgedChoose(${oi})"><span class="choice-num">${pos+1}</span>${esc(beat.options[oi].label)}</button>`).join("")}
      </div>
      <div class="feedback" id="fb"></div>
      <div class="btn-row" id="storyJudgedNextRow" style="display:none; justify-content:center">
        <button class="btn story-advance-btn" onclick="storyAdvance()">つぎへ</button>
      </div>
    </div>
    ${storyFooterHtml()}`;
  setupChoiceKeys(pos => storyJudgedChoose(order[pos]), beat.options.length);
}
function storyJudgedChoose(i){
  clearChoiceKeys();
  const st = loadStats();
  const sp = storyProgress(st);
  const chapter = storyChapterDef(sp.chapter);
  const beat = chapter.beats[sp.beatIdx];
  const opt = beat.options[i];
  const ok = !!opt.correct;
  if(beat.flagKey) sp.flags[beat.flagKey] = opt.value;
  sp.judgedRunTotal = (sp.judgedRunTotal||0) + 1;
  if(ok) sp.judgedRunCorrect = (sp.judgedRunCorrect||0) + 1;
  saveStats(st);
  const btns = screen.querySelectorAll(".choice");
  btns.forEach((b,pos)=>{
    const oi = storyRun.order ? storyRun.order[pos] : pos;
    b.disabled = true;
    if(beat.options[oi].correct) b.classList.add("correct");
    else if(oi===i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = document.getElementById("fb");
  fb.className = "feedback show " + (ok?"ok":"ng");
  fb.innerHTML = `<div class="verdict">${ok?"○ 正解！":"× ざんねん…"}</div>`;
  document.getElementById("storyJudgedNextRow").style.display = "flex";
}
/* 記述問題（shortAnswer beat、2026-07-19〜、第5章「朝読書をしよう！」用）。judgedChoiceの
   自由入力版：データファイルのカテゴリを使わず、beat.answers（正解として許容する文字列の配列）
   に直書きした答えと照合する。normalizeAns（空白除去・カタカナ→ひらがな変換のみ）で緩く

function storyShortAnswerSubmit(){

  if(nb) nb.style.display = "flex";

/* 分類マッチング問題（match beat、2026-07-19〜、第6章「説明的文章①」用）。beat.rows
   （{desc, answer}の配列。answerはbeat.labelsの1始まりのindex）を、表示のたびにshuffledOrder
   で行の並び順だけシャッフルして提示し（正解の番号自体は毎回beat.labelsの並び順のまま。
   行の順番を固定してしまうと「1行目は①、2行目は②……」という並びそのものが正解になって
   しまうため、行の方をシャッフルする）、各行のプルダウン（select）で①〜⑥を選ばせる。
   「これで答える」を押した瞬間に全行まとめて採点し、全問正解のときだけ次へ進める
   （1問でも間違っていれば、間違った行を赤く示して「もう一度えらぶ」から選び直せる）。
   judgedChoiceと同じく、record()は呼ばずjudgedRunCorrect/Totalにも積まない
   （地の文の理解を確かめる単発の演習という位置づけ）。 */
function storyRenderMatch(beat){
  clearChoiceKeys();
  storyRun.curBeat = beat;
  const order = shuffledOrder(beat.rows.length);
  storyRun.matchOrder = order;
  /* プルダウンの選択肢（beat.labels）も、表示のたびに並び順をシャッフルする（2026-07-19〜、
     教員の指示。「序論・本論・結論」のように毎回同じ並びだと、選択肢の中身を読まずに
     位置だけで覚えてしまう生徒がいるため）。value自体はbeat.labelsの元の1始まりindexの
     ままなので、storyMatchSubmit側の採点ロジックは変更不要（選択肢の見た目の並びと
     value/正解判定は独立している）。 */
  const labelOrder = shuffledOrder(beat.labels.length);
  const optionsHtml = labelOrder.map(li=>`<option value="${li+1}">${esc(beat.labels[li])}</option>`).join("");
  const rowsHtml = order.map((ri,pos)=>{
    const row = beat.rows[ri];
    return `
      <div class="match-row" id="matchRow${pos}">
        <div class="match-desc">${esc(row.desc)}</div>
        <select class="match-select" id="matchSel${pos}">
          <option value="">選んでください</option>
          ${optionsHtml}
        </select>
      </div>`;
  }).join("");
  screen.innerHTML = `
    <div class="card story-scene">
      ${beat.speaker ? `${storyFaceIconHtml(beat.speaker)}<div class="story-speaker">${esc(beat.speaker)}</div>` : ""}
      <p class="story-text">${esc(beat.text)}</p>
      <div class="match-rows">${rowsHtml}</div>
      <div class="feedback" id="fb"></div>
      <div class="btn-row" style="justify-content:center" id="matchSubmitRow">
        <button class="btn story-advance-btn" id="matchSubmitBtn" onclick="storyMatchSubmit()">これで答える</button>
      </div>
      <div class="btn-row" id="storyMatchNextRow" style="display:none; justify-content:center">
        <button class="btn story-advance-btn" onclick="storyAdvance()">つぎへ</button>
      </div>
    </div>
    ${storyFooterHtml()}`;
}
/* 2026-07-19〜、教員の指示で「間違っていても、どこが違うかは示さず、正解するまで
   その場で何度でも挑戦できる」仕様に変更。行ごとの正誤ハイライト（match-ok/match-ng）は
   行わず、全問正解かどうかだけを一言で伝える。不正解のときはプルダウンを無効化せず、
   そのまま選び直して同じボタンで再提出できる（並び順の再シャッフルもしない）。 */
function storyMatchSubmit(){
  const beat = storyRun.curBeat;
  const order = storyRun.matchOrder;
  let allCorrect = true;
  order.forEach((ri,pos)=>{
    const row = beat.rows[ri];
    const sel = document.getElementById(`matchSel${pos}`);
    const val = sel ? parseInt(sel.value, 10) : NaN;
    if(val !== row.answer) allCorrect = false;
  });
  const fb = document.getElementById("fb");
  if(allCorrect){
    order.forEach((ri,pos)=>{
      const sel = document.getElementById(`matchSel${pos}`);
      if(sel) sel.disabled = true;
    });
    fb.className = "feedback show ok";
    fb.innerHTML = `<div class="verdict">○ 全部正解！</div>`;
    document.getElementById("matchSubmitRow").style.display = "none";
    document.getElementById("storyMatchNextRow").style.display = "flex";
  }else{
    fb.className = "feedback show ng";
    fb.innerHTML = `<div class="verdict">× まだ違うところがあるよ。もう一度考えてみよう。</div>`;
  }
}
/* ミニクイズ（合格ゲート方式）：直近window問中need問正解するまで、同じbeatのまま
   問題を出し続ける（beatIdxは進めない）。1問ごとにrecord()を呼ぶので、
   合格するまでに解いた問題もすべて分野レベル・XPに反映される（再プレイ時を除く）。 */
/* quiz/battle beatが問題プールを絞り込むための共通フィルタ。beat.maxGrade（学年の目安以下に限定、
   語彙で使用）・beat.filterTag（q.tagが一致するものだけ、接続詞の種類分類や第9章の単語分け
   （tag:"basic"、教員が選んだ基本問題だけに限定、2026-08-19〜）で使用）・
   beat.filterS（q.sが完全一致するものだけ、第9章の文節分け/単語分けのように、同じカテゴリ内に
   複数の出題形式が混在していて`s`フィールドでしか区別できない場合に使用）を、あれば全部AND条件
   で組み合わせる。どれも指定がなければundefined（＝絞り込みなし）を返す。 */
function storyBeatFilter(beat){
  if(!beat.maxGrade && !beat.filterTag && !beat.filterS) return undefined;
  return q => (!beat.maxGrade || (q.grade||99) <= beat.maxGrade)
    && (!beat.filterTag || q.tag === beat.filterTag)
    && (!beat.filterS || q.s === beat.filterS);
}
function storyRenderQuiz(beat, idx){
  if(storyRun.gateBeatIdx !== idx){
    storyRun.gateBeatIdx = idx;
    storyRun.gateWindow = [];
    storyRun.gateCleared = false;
  }
  storyRun.curBeat = beat;
  /* beat.maxGradeを持つ問題ジャンル（今のところ語彙のみ）は、その学年の目安(grade)以下の
     問題だけに絞り込む（教員の指示：ストーリーの語彙問題は中学1年生でもわかる範囲に限定
     したい。カタカナ語の学術用語は軒並みgrade6=高校以上に分類済みなので、この絞り込みだけで
     自然に除外される）。 */
  const it = pickBattleQuestion(beat.cat, storyRun.lastQ, storyBeatFilter(beat));
  storyRun.lastQ = it.q;
  storyRun.curItem = it;
  storyRun.curCat = beat.cat;
  storyRun.shownAt = Date.now();
  const need = beat.need || STORY_QUIZGATE_NEED;
  const windowSize = beat.window || STORY_QUIZGATE_WINDOW;
  const correctSoFar = storyRun.gateWindow.reduce((a,b)=>a+b, 0);
  const progressNote = storyRun.gateWindow.length
    ? `<p class="note">直近${storyRun.gateWindow.length}問中 ${correctSoFar}問正解（${need}問正解で次へ進めます）</p>`
    : `<p class="note">直近${windowSize}問中${need}問正解で次へ進めます</p>`;
  const isInput = Array.isArray(it.ans);
  let answerArea;
  if(isInput){
    clearChoiceKeys();
    answerArea = `
      <div class="ans-row">
        <input type="text" id="storyAnsIn" class="ans-input" placeholder="${esc(it.ansPlaceholder || "ひらがなで入力")}" autocomplete="off"
               onkeydown="if(event.key==='Enter'){event.preventDefault();storySubmitInput();}">
        <button class="btn inline" id="storySubmitBtn" onclick="storySubmitInput()">こたえる</button>
      </div>`;
  }else{
    storyRun.order = shuffledOrder(it.c.length);
    answerArea = `
      <div class="choices">
        ${storyRun.order.map((oi,pos)=>`<button class="choice" onclick="storyAnswerChoice(${oi})"><span class="choice-num">${pos+1}</span>${esc(it.c[oi])}</button>`).join("")}
      </div>`;
  }
  screen.innerHTML = `
    <div class="card story-scene">
      ${beat.speaker ? `${storyFaceIconHtml(beat.speaker)}<div class="story-speaker">${esc(beat.speaker)}</div>` : ""}
      ${beat.intro ? `<p class="story-text">${esc(beat.intro)}</p>` : ""}
      ${progressNote}
      <div class="boss-q-card">
        ${subInstructionHtml(beat.cat, it)}
        <div class="boss-q-text">${markQuestionHtml(it.q)}</div>
        ${answerArea}
        <div class="feedback" id="fb"></div>
        <div class="btn-row"><button class="btn story-advance-btn" id="storyNextBtn" style="display:none" onclick="storyQuizNext()">つぎへ</button></div>
      </div>
    </div>
    ${storyFooterHtml()}`;
  if(isInput){ const el = document.getElementById("storyAnsIn"); if(el) el.focus(); }
  else{ setupChoiceKeys(pos => storyAnswerChoice(storyRun.order[pos]), it.c.length); }
}
function storyAnswerChoice(origIdx){
  storyGradeQuiz(origIdx === storyRun.curItem.a, origIdx, null);
}
function storySubmitInput(){
  const el = document.getElementById("storyAnsIn");
  if(!el || el.disabled) return;
  const val = normalizeAns(el.value);
  if(!val) return;
  const ok = storyRun.curItem.ans.map(normalizeAns).includes(val);
  el.disabled = true;
  const sb = document.getElementById("storySubmitBtn");
  if(sb) sb.disabled = true;
  storyGradeQuiz(ok, null, el.value);
}
function storyGradeQuiz(ok, chosenOrig, typed){
  clearChoiceKeys();
  const it = storyRun.curItem, cat = storyRun.curCat;
  /* ミニクイズ（小ボス）は、再プレイ中でも正解した問題の分野レベルアップは行う
     （アイテム等の確定報酬が無いこのタイプでは、周回でのXP稼ぎを問題視しないという
     教員の判断）。record()は常に呼ぶ。 */
  const elapsedMs = Date.now() - (storyRun.shownAt || Date.now());
  const r = record(cat, it, ok, elapsedMs);
  const btns = screen.querySelectorAll(".choice");
  btns.forEach((b,pos)=>{
    const oi = storyRun.order ? storyRun.order[pos] : pos;
    b.disabled = true;
    if(oi===it.a) b.classList.add("correct");
    else if(oi===chosenOrig) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const need = storyRun.curBeat.need || STORY_QUIZGATE_NEED;
  const windowSize = storyRun.curBeat.window || STORY_QUIZGATE_WINDOW;
  storyRun.gateWindow.push(ok ? 1 : 0);
  while(storyRun.gateWindow.length > windowSize) storyRun.gateWindow.shift();
  const correctInWindow = storyRun.gateWindow.reduce((a,b)=>a+b, 0);
  const cleared = correctInWindow >= need;
  storyRun.gateCleared = cleared;
  const fb = document.getElementById("fb");
  let expl;
  if(Array.isArray(it.ans)){
    expl = ok ? "" : `正解は「${esc(it.ans.join("」または「"))}」`;
  }else{
    expl = ok ? "" : `正解は「${esc(it.c[it.a])}」`;
  }
  const lvChip = r.lvup ? `<span class="lvup-chip">${esc(CATS[cat].name)} Lv.${r.lv} にアップ！</span>` : "";
  const clearMsg = cleared ? `<p class="lvup-chip">✅ 直近${storyRun.gateWindow.length}問中${correctInWindow}問正解！ 次へ進めます</p>` : "";
  fb.className = "feedback show " + (ok?"ok":"ng");
  fb.innerHTML = `<div class="verdict">${ok?"○ 正解！":"× ざんねん…"}${lvChip}</div>${expl}${clearMsg}`;
  const nb = document.getElementById("storyNextBtn");
  if(nb){ nb.style.display = "inline-block"; nb.textContent = cleared ? "つぎへ" : "つぎの問題へ"; }
}
function storyQuizNext(){
  if(storyRun.gateCleared) storyAdvance();
  else storyRenderBeat();
}

/* 第6章ボス「接続詞の見分けテスト」専用のヒント（教員の指示、2026-08-19〜：問題が難しすぎるので
   このボスだけ「どんな時に使う接続詞なのか」が分かるヒントを付けてほしいとのこと）。
   データ側の各問題が持つe（解説文）は、末尾に正解の分類名をそのまま含んでいる
   （例：「…あとに続く順接の接続詞。」）ので、そのまま出すと答えを教えてしまう。
   分類名＋「の接続詞」の部分だけを「接続詞」に置きかえ、使われる場面の説明だけをヒントとして見せる。
   最初はクリックで開閉する任意ヒントだったが、教員の指示（2026-08-19〜、同日中）で
   「『ヒントを見る』は廃止、最初から表示」に変更し、常時表示にした。 */
const SETSUZOKU_HINT_CATS = ["並立・累加（添加）","対比・選択","説明・補足","順接","逆接","転換"];
function storySetsuzokuHintText(e){
  let t = e;
  SETSUZOKU_HINT_CATS.forEach(cat => { t = t.split(cat + "の接続詞").join("接続詞"); });
  return t;
}
function storyBattleHintHtml(beat, it){
  if(beat.boss !== "setsuzokushiTest" || !it.e) return "";
  return `<div class="boss-hint-box">💡 ヒント：${esc(storySetsuzokuHintText(it.e))}</div>`;
}
/* イベント戦（ステータス非依存）：total問中need問正解で確定クリア。
   既存のボス戦（HP・ステータス依存の戦闘システム）は一切呼ばない、完全に別実装。 */
function storyRenderBattle(beat, idx){
  if(storyRun.battleBeatIdx !== idx){
    storyRun.battleBeatIdx = idx;
    storyRun.battleAnswered = 0;
    storyRun.battleCorrect = 0;
  }
  storyRun.curBeat = beat;
  const boss = STORY_EVENT_BOSSES[beat.boss];
  const total = beat.total || STORY_BATTLE_TOTAL;
  const it = pickBattleQuestion(beat.cat, storyRun.lastQ, storyBeatFilter(beat));
  storyRun.lastQ = it.q;
  storyRun.curItem = it;
  storyRun.curCat = beat.cat;
  storyRun.shownAt = Date.now(); // beat.trackLevel時のrecord()用（経過時間の計測）
  const isInput = Array.isArray(it.ans);
  let answerArea;
  if(isInput){
    clearChoiceKeys();
    answerArea = `
      <div class="ans-row">
        <input type="text" id="storyAnsIn" class="ans-input" placeholder="${esc(it.ansPlaceholder || "ひらがなで入力")}" autocomplete="off"
               onkeydown="if(event.key==='Enter'){event.preventDefault();storyBattleSubmitInput();}">
        <button class="btn inline" id="storySubmitBtn" onclick="storyBattleSubmitInput()">こたえる</button>
      </div>`;
  }else{
    storyRun.order = shuffledOrder(it.c.length);
    answerArea = `
      <div class="choices">
        ${storyRun.order.map((oi,pos)=>`<button class="choice" onclick="storyBattleAnswerChoice(${oi})"><span class="choice-num">${pos+1}</span>${esc(it.c[oi])}</button>`).join("")}
      </div>`;
  }

    <div class="card story-scene">

      <div class="bar"><div style="width:${100*storyRun.battleAnswered/total}%"></div></div>
      <div class="boss-q-card">
        ${subInstructionHtml(beat.cat, it)}
        <div class="boss-timer-row" id="storyTimerRow"><div class="boss-timer-bar"><div id="storyTimerFill" class="boss-timer-fill"></div></div></div>
        <div class="boss-q-text">${markQuestionHtml(it.q)}</div>
        ${storyBattleHintHtml(beat, it)}
        ${answerArea}
        <div class="feedback" id="fb"></div>
        <div class="btn-row"><button class="btn story-advance-btn" id="storyNextBtn" style="display:none" onclick="storyBattleNext()">つぎへ</button></div>
      </div>
    </div>
    ${storyFooterHtml()}`;
  if(isInput){ const el = document.getElementById("storyAnsIn"); if(el) el.focus(); }
  else{ setupChoiceKeys(pos => storyBattleAnswerChoice(storyRun.order[pos]), it.c.length); }

}
function storyBattleAnswerChoice(origIdx){
  storyGradeBattle(origIdx === storyRun.curItem.a, origIdx);
}
function storyBattleSubmitInput(){
  const el = document.getElementById("storyAnsIn");
  if(!el || el.disabled) return;
  const val = normalizeAns(el.value);
  if(!val) return;
  const ok = storyRun.curItem.ans.map(normalizeAns).includes(val);
  el.disabled = true;
  const sb = document.getElementById("storySubmitBtn");
  if(sb) sb.disabled = true;

}
/* 中ボスの1問あたりの制限時間（15秒）。既存のボス戦（bossHasTimeLimit/startBossTimer）とは
   別実装で、アイテムを使えない前提なので使用時の再スタート処理は持たない。
   時間切れはstoryBattleTimeUp→storyGradeBattle(false,...,true)で不正解として扱う。
   答えた場合はstoryGradeBattle冒頭のclearStoryBattleTimer()でこのタイマーを止めるので、
   二重採点は起きない。beatを離れて中断された場合はshowHome()側でも念のため止める。 */
function startStoryBattleTimer(){
  clearStoryBattleTimer();
  const run = storyRun;
  const ms = (run.curBeat && run.curBeat.timeMs) || STORY_BATTLE_TIME_MS;
  run.timerId = setTimeout(() => {
    if(storyRun !== run) return;
    storyBattleTimeUp();
  }, ms);
  animateStoryTimerBar(ms);
}
function clearStoryBattleTimer(){
  if(storyRun && storyRun.timerId){
    clearTimeout(storyRun.timerId);
    storyRun.timerId = null;
  }
}
function storyBattleTimeUp(){
  const it = storyRun.curItem;
  if(Array.isArray(it.ans)){
    const el = document.getElementById("storyAnsIn");
    if(el) el.disabled = true;
    const sb = document.getElementById("storySubmitBtn");
    if(sb) sb.disabled = true;
  }
  storyGradeBattle(false, null, true);
}
function animateStoryTimerBar(overrideMs){
  const el = document.getElementById("storyTimerFill");
  if(!el) return;
  const ms = overrideMs || STORY_BATTLE_TIME_MS;
  el.style.transition = "none";
  el.style.width = "100%";
  if(typeof requestAnimationFrame !== "function") return;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      el.style.transition = `width ${ms}ms linear`;
      el.style.width = "0%";
    });
  });
}
function stopStoryTimerBar(){
  const row = document.getElementById("storyTimerRow");
  if(row) row.style.display = "none";
}
function storyGradeBattle(ok, chosenOrig, timedOut){
  clearStoryBattleTimer();
  stopStoryTimerBar();
  clearChoiceKeys();
  const it = storyRun.curItem;
  storyRun.battleAnswered++;
  if(ok) storyRun.battleCorrect++;
  /* beat.trackLevel:trueのイベント戦だけは、教員の指示で正誤をrecord()に反映する
     （baseball/combo beatと同じ例外パターン。詳細はSTORY_EVENT_BOSSESの前のコメント参照）。
     15秒の制限時間は他の中ボスと同じ通常ペースなので、baseball/comboと違いskipRecentAccは
     渡さない（直近正答率・fastGuess判定にも普通に反映してよい）。 */
  let lvChip = "";
  if(storyRun.curBeat.trackLevel){
    const elapsedMs = Date.now() - (storyRun.shownAt || Date.now());
    const r = record(storyRun.curCat, it, ok, elapsedMs);
    if(r.lvup) lvChip = `<span class="lvup-chip">${esc(CATS[storyRun.curCat].name)} Lv.${r.lv} にアップ！</span>`;
  }
  const btns = screen.querySelectorAll(".choice");
  btns.forEach((b,pos)=>{
    const oi = storyRun.order ? storyRun.order[pos] : pos;
    b.disabled = true;
    if(oi===it.a) b.classList.add("correct");
    else if(oi===chosenOrig) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = document.getElementById("fb");
  let expl;
  if(Array.isArray(it.ans)){
    expl = ok ? "" : `正解は「${esc(it.ans.join("」または「"))}」`;
  }else{
    expl = ok ? "" : `正解は「${esc(it.c[it.a])}」`;
  }
  fb.className = "feedback show " + (ok?"ok":"ng");
  fb.innerHTML = `<div class="verdict">${ok?"○ 正解！":(timedOut?"⏰ 時間切れ…":"× ざんねん…")}${lvChip}</div>${expl}`;
  const total = storyRun.curBeat.total || STORY_BATTLE_TOTAL;
  const isLast = storyRun.battleAnswered >= total;
  const nb = document.getElementById("storyNextBtn");
  if(nb){ nb.style.display = "inline-block"; nb.textContent = isLast ? "けっかを見る" : "つぎへ"; }
}
function storyBattleNext(){
  const total = storyRun.curBeat.total || STORY_BATTLE_TOTAL;
  if(storyRun.battleAnswered >= total) storyBattleResolve();
  else storyRenderBeat();
}
function storyBattleResolve(){
  const beat = storyRun.curBeat;
  const boss = STORY_EVENT_BOSSES[beat.boss];
  const need = beat.need || STORY_BATTLE_NEED;
  const total = beat.total || STORY_BATTLE_TOTAL;
  const won = storyRun.battleCorrect >= need;
  if(won){
    const st = loadStats();
    const sp = storyProgress(st);
    const isReplay = sp.completedChapters.includes(sp.chapter);
    let gotTreasure = false;
    if(!isReplay){
      st.items[boss.item] = (st.items[boss.item]||0) + 1;
      if(boss.item2) st.items[boss.item2] = (st.items[boss.item2]||0) + 1;
      if(boss.treasure && treasureDropAllowed(st)){
        st.bossPity[boss.id] = (st.bossPity[boss.id]||0) + 1;
        if(st.bossPity[boss.id] >= BOSS_PITY_MAX || Math.random() < BOSS_TREASURE_RATE){
          gotTreasure = true;
          st.bossPity[boss.id] = 0;
          st.items[boss.treasure] = (st.items[boss.treasure]||0) + 1;
        }
      }
      saveStats(st);
    }
    screen.innerHTML = `
      <div class="card story-scene">
        <div class="story-chapter-end">🎉 クリア！（${storyRun.battleCorrect}／${total}問正解）</div>
        ${isReplay
          ? `<p class="story-text">「${esc(boss.name)}」を乗りこえた！（再プレイのため、今回はアイテムの入手はありません）</p>`
          : `<p class="story-text">「${esc(boss.name)}」を乗りこえた！<br>${esc(boss.icon)} <span class="drop-item">【${esc(boss.item)}】</span>を手に入れた！${boss.item2 ? `<br>${esc(boss.icon)} <span class="drop-item">【${esc(boss.item2)}】</span>を手に入れた！` : ""}${gotTreasure ? `<br>✨ さらに、宝具<span class="drop-item treasure-drop">【${esc(boss.treasure)}】</span>を手に入れた！ ✨` : ""}</p>`}
        <div class="btn-row" style="justify-content:center">
          <button class="btn story-advance-btn" onclick="storyAdvance()">つづける</button>
        </div>
      </div>`;
  }else{
    screen.innerHTML = `
      <div class="card story-scene">
        <div class="story-chapter-end">力及ばず…（${storyRun.battleCorrect}／${total}問正解、${need}問正解でクリア）</div>
        <p class="story-text">「${esc(boss.name)}」を乗りこえられなかった。もう一度挑戦しよう。</p>
        <div class="btn-row" style="justify-content:center">
          <button class="btn" onclick="storyBattleRetry()">もう一度挑戦する</button>
        </div>
      </div>
      ${storyFooterHtml()}`;
  }
}
function storyBattleRetry(){
  storyRun.battleAnswered = 0;
  storyRun.battleCorrect = 0;
  storyRenderBeat();
}

/* 校正ミニゲーム（proofread beat）：既存の中ボス（battle beat、1問ずつの正誤判定）とは別実装。
   1つの文章（STORY_PROOFREAD_PASSAGESから毎回ランダムに1パターン、直前と重複しないよう
   lastProofPassageIdxで避ける）の中の、誤りトークン（wrong:true）を全部タップできればクリア。
   制限時間はDate.now()との差分で管理する単純なポーリング式（battle beatのsetTimeout1発方式とは
   違い、誤答タップのペナルティで残り時間を動的に減らす必要があるため）。 */
function pickProofreadPassageIdx(){
  const n = STORY_PROOFREAD_PASSAGES.length;
  if(n <= 1) return 0;
  let idx;
  do { idx = Math.floor(Math.random()*n); } while(idx === storyRun.lastProofPassageIdx);
  storyRun.lastProofPassageIdx = idx;
  return idx;
}
function storyRenderProofread(beat){
  storyRun.curBeat = beat;
  storyRun.proofPassageIdx = pickProofreadPassageIdx();
  storyRun.proofFound = new Set();
  storyRun.proofDeadline = Date.now() + STORY_PROOFREAD_TIME_MS;
  storyRun.proofDone = false;
  const boss = STORY_EVENT_BOSSES[beat.boss];
  const passage = STORY_PROOFREAD_PASSAGES[storyRun.proofPassageIdx];
  const errorCount = passage.tokens.filter(t => t.wrong).length;
  screen.innerHTML = `
    <div class="card story-scene">
      <div class="boss-name">${esc(boss.icon)} ${esc(boss.name)}</div>
      <p class="note">${STORY_PROOFREAD_TIME_MS/1000}秒以内に、まちがった言葉づかいを${errorCount}つ、すべてタップして見つけよう！（正しい言葉をタップすると、残り時間が${STORY_PROOFREAD_MISS_PENALTY_MS/1000}秒減ってしまいます）</p>
      <p class="note" id="proofProgress">見つけた数：0／${errorCount}</p>
      <div class="boss-timer-row"><div class="boss-timer-bar"><div id="proofTimerFill" class="boss-timer-fill"></div></div></div>
      <div class="boss-q-card">
        <div class="proof-passage" id="proofPassage">
          ${passage.tokens.map((t,i) => `<span class="proof-token" data-i="${i}" onclick="storyProofreadTap(${i})">${esc(t.t)}</span>`).join("")}
        </div>
        <div class="feedback" id="fb"></div>
        <div class="btn-row"><button class="btn story-advance-btn" id="storyNextBtn" style="display:none" onclick="storyProofreadNext()">つぎへ</button></div>
      </div>
    </div>
    ${storyFooterHtml()}`;
  startStoryProofreadTimer();
}
function startStoryProofreadTimer(){
  clearStoryProofreadTimer();
  const run = storyRun;
  run.proofTimerId = setInterval(() => {
    if(storyRun !== run) return;
    if(run.proofDeadline - Date.now() <= 0){
      clearStoryProofreadTimer();
      storyProofreadTimeUp();
    }
  }, 200);
  renderStoryProofreadTimerBar();
}
function clearStoryProofreadTimer(){
  if(storyRun && storyRun.proofTimerId){
    clearInterval(storyRun.proofTimerId);
    storyRun.proofTimerId = null;
  }
}
/* タイマーバーの幅は、常に「STORY_PROOFREAD_TIME_MS（3分）に対する残り時間の割合」で表す。
   誤答ペナルティでdeadlineが減った瞬間、バーがその分だけ目に見えて縮むので、
   ペナルティが起きたことが直感的にわかる（減った後の残り時間ぶんだけ、あらためて0%まで
   アニメーションさせる）。 */
function renderStoryProofreadTimerBar(){
  const el = document.getElementById("proofTimerFill");
  if(!el || !storyRun) return;
  const remain = Math.max(0, storyRun.proofDeadline - Date.now());
  el.style.transition = "none";
  el.style.width = (100*remain/STORY_PROOFREAD_TIME_MS) + "%";
  void el.offsetWidth;
  if(typeof requestAnimationFrame !== "function") return;
  requestAnimationFrame(() => {
    el.style.transition = `width ${remain}ms linear`;
    el.style.width = "0%";
  });
}
function storyProofreadTap(i){
  if(!storyRun || storyRun.proofDone) return;
  const passage = STORY_PROOFREAD_PASSAGES[storyRun.proofPassageIdx];
  const token = passage.tokens[i];
  const el = document.querySelector(`.proof-token[data-i="${i}"]`);
  if(!el || el.classList.contains("found") || el.classList.contains("tried")) return;
  if(token.wrong){
    el.classList.add("found");
    storyRun.proofFound.add(i);
    const errorCount = passage.tokens.filter(t => t.wrong).length;
    const progressEl = document.getElementById("proofProgress");
    if(progressEl) progressEl.textContent = `見つけた数：${storyRun.proofFound.size}／${errorCount}`;
    if(storyRun.proofFound.size >= errorCount){
      clearStoryProofreadTimer();
      storyProofreadReveal(true);
    }
  }else{
    el.classList.add("tried");
    storyRun.proofDeadline -= STORY_PROOFREAD_MISS_PENALTY_MS;
    if(storyRun.proofDeadline - Date.now() <= 0){
      clearStoryProofreadTimer();
      storyProofreadTimeUp();
    }else{
      renderStoryProofreadTimerBar();
    }
  }
}
function storyProofreadTimeUp(){
  storyProofreadReveal(false);
}
function storyProofreadReveal(won){
  storyRun.proofDone = true;
  const passage = STORY_PROOFREAD_PASSAGES[storyRun.proofPassageIdx];
  const errorCount = passage.tokens.filter(t => t.wrong).length;
  passage.tokens.forEach((t,i) => {
    const el = document.querySelector(`.proof-token[data-i="${i}"]`);
    if(!el) return;
    el.onclick = null;
    if(t.wrong && !storyRun.proofFound.has(i)) el.classList.add("missed");
  });
  const missedList = passage.tokens
    .filter((t,i) => t.wrong && !storyRun.proofFound.has(i))
    .map(t => `「${esc(t.t)}」→「${esc(t.correct)}」`);
  const fb = document.getElementById("fb");
  fb.className = "feedback show " + (won?"ok":"ng");
  fb.innerHTML = won
    ? `<div class="verdict">○ ${errorCount}つ、すべて見つけた！</div>`
    : `<div class="verdict">⏰ 時間切れ…（${storyRun.proofFound.size}／${errorCount}つ発見）</div>` +
      (missedList.length ? `<p>見つけられなかったまちがい：${missedList.join("、")}</p>` : "");
  const nb = document.getElementById("storyNextBtn");
  if(nb){ nb.style.display = "inline-block"; nb.textContent = won ? "けっかを見る" : "もう一度挑戦する"; }
}
function storyProofreadNext(){
  const passage = STORY_PROOFREAD_PASSAGES[storyRun.proofPassageIdx];
  const errorCount = passage.tokens.filter(t => t.wrong).length;
  if(storyRun.proofFound.size >= errorCount) storyProofreadResolve();
  else storyRenderBeat();
}
function storyProofreadResolve(){
  const beat = storyRun.curBeat;
  const boss = STORY_EVENT_BOSSES[beat.boss];
  const st = loadStats();
  const sp = storyProgress(st);
  const isReplay = sp.completedChapters.includes(sp.chapter);
  let gotTreasure = false;
  if(!isReplay){
    st.items[boss.item] = (st.items[boss.item]||0) + 1;
    if(treasureDropAllowed(st)){
      st.bossPity[boss.id] = (st.bossPity[boss.id]||0) + 1;
      if(st.bossPity[boss.id] >= BOSS_PITY_MAX || Math.random() < BOSS_TREASURE_RATE){
        gotTreasure = true;
        st.bossPity[boss.id] = 0;
        st.items[boss.treasure] = (st.items[boss.treasure]||0) + 1;
      }
    }
    saveStats(st);
  }
  screen.innerHTML = `
    <div class="card story-scene">
      <div class="story-chapter-end">🎉 クリア！</div>
      ${isReplay
        ? `<p class="story-text">「${esc(boss.name)}」を乗りこえた！（再プレイのため、今回はアイテムの入手はありません）</p>`
        : `<p class="story-text">「${esc(boss.name)}」を乗りこえた！<br>${esc(boss.icon)} <span class="drop-item">【${esc(boss.item)}】</span>を手に入れた！${gotTreasure ? `<br>✨ さらに、宝具<span class="drop-item treasure-drop">【${esc(boss.treasure)}】</span>を手に入れた！ ✨` : ""}</p>`}
      <div class="btn-row" style="justify-content:center">
        <button class="btn story-advance-btn" onclick="storyAdvance()">つづける</button>
      </div>
    </div>`;
}

/* 語句選択ミニゲーム（wordPick beat、2026-07-22〜、第8章「体育祭」用）：制限時間内に、並んだ
   単語の中から名詞をすべてタップして選ぶミニゲーム。proofread beat（誤字タップ）と同じ
   「1回訪問ごとに毎回作り直す使い切りミニゲーム」設計を踏襲し、gateBeatIdx/battleBeatIdxの
   ような「同じbeatなら状態を保持する」ガードは持たない（storyRun.curBeatだけ更新し、
   タップ対象の単語セットは呼ばれるたびに必ず新しく抽選し直す）。
   名詞は専用のストック（42語）からSTORY_WORDPICK_BOARD_NOUNS(10)語、誤答（名詞以外の8品詞）は
   専用のストック（計50語、動詞/形容詞/形容動詞/連体詞/助詞/助動詞/接続詞/感動詞のすべてを含む）
   からSTORY_WORDPICK_BOARD_WRONG(20)語を、それぞれ毎回ランダムに抽出し、あわせてシャッフルして
   1つの盤面（30語）として表示する（shuffledOrderを流用）。 */
const STORY_WORDPICK_TIME_MS = 60000; // 1分（教員の指示）
const STORY_WORDPICK_MISS_PENALTY_MS = 3000; // 名詞でない単語をタップするたびに、残り時間からこの分だけ差し引く（全部タップする力任せ戦法の抑止、proofreadと同じ狙い）
const STORY_WORDPICK_BOARD_NOUNS = 10;
const STORY_WORDPICK_BOARD_WRONG = 20;
const STORY_WORDPICK_NOUN_POOL = [
  "体育祭","運動会","応援団","スローガン","組","校庭","入場門","得点板","徒競走","綱引き",
  "リレー","応援合戦","開会式","閉会式","選手宣誓","優勝旗","タオル","ハチマキ","水筒","テント",
  "笛","太鼓","放送席","保護者席","救護室","昼休み","予行練習","雲","青空","歓声",
  /* 転成名詞12語（2026-07-22〜、教員の指示で追加）。動詞・形容詞・形容動詞の語幹や連用形から
     作られた名詞も、れっきとした名詞であることを体感してもらうためのバリエーション
     （4語ずつバランスよく用意。誤答プール（STORY_WORDPICK_WRONG_POOL）に元の形（力強い→力強さ、
     真剣だ→真剣さ、爽やかだ→爽やかさ）がある語は、あえて対になるよう選んでいる）。 */
  "動き","共食い","戦い","遅れ",       // 動詞の連用形が名詞化したもの
  "優しさ","楽しさ","悔しさ","力強さ", // 形容詞の語幹＋「さ」で名詞化したもの
  "純朴さ","俊敏さ","真剣さ","爽やかさ", // 形容動詞の語幹＋「さ」で名詞化したもの
];
const STORY_WORDPICK_WRONG_POOL = [
  {w:"走る", pos:"動詞"}, {w:"応援する", pos:"動詞"}, {w:"並ぶ", pos:"動詞"}, {w:"投げる", pos:"動詞"},
  {w:"跳ぶ", pos:"動詞"}, {w:"整列する", pos:"動詞"}, {w:"優勝する", pos:"動詞"}, {w:"叫ぶ", pos:"動詞"},
  {w:"速い", pos:"形容詞"}, {w:"暑い", pos:"形容詞"}, {w:"悔しい", pos:"形容詞"}, {w:"まぶしい", pos:"形容詞"}, {w:"力強い", pos:"形容詞"}, {w:"すばらしい", pos:"形容詞"},
  {w:"にぎやかだ", pos:"形容動詞"}, {w:"元気だ", pos:"形容動詞"}, {w:"真剣だ", pos:"形容動詞"}, {w:"順調だ", pos:"形容動詞"}, {w:"爽やかだ", pos:"形容動詞"}, {w:"見事だ", pos:"形容動詞"},
  {w:"この", pos:"連体詞"}, {w:"あの", pos:"連体詞"}, {w:"大きな", pos:"連体詞"}, {w:"小さな", pos:"連体詞"}, {w:"わが", pos:"連体詞"}, {w:"いわゆる", pos:"連体詞"},
  {w:"が", pos:"助詞"}, {w:"を", pos:"助詞"}, {w:"の", pos:"助詞"}, {w:"に", pos:"助詞"}, {w:"へ", pos:"助詞"}, {w:"より", pos:"助詞"},
  {w:"だ", pos:"助動詞"}, {w:"です", pos:"助動詞"}, {w:"ます", pos:"助動詞"}, {w:"たい", pos:"助動詞"}, {w:"ようだ", pos:"助動詞"}, {w:"らしい", pos:"助動詞"},
  {w:"しかし", pos:"接続詞"}, {w:"だから", pos:"接続詞"}, {w:"そして", pos:"接続詞"}, {w:"つまり", pos:"接続詞"}, {w:"ところが", pos:"接続詞"}, {w:"それとも", pos:"接続詞"},
  {w:"わあ", pos:"感動詞"}, {w:"おお", pos:"感動詞"}, {w:"やった", pos:"感動詞"}, {w:"ありがとう", pos:"感動詞"}, {w:"よし", pos:"感動詞"}, {w:"おはよう", pos:"感動詞"},
];
function pickWordPickBoard(){
  const nounIdx = shuffledOrder(STORY_WORDPICK_NOUN_POOL.length).slice(0, STORY_WORDPICK_BOARD_NOUNS);
  const wrongIdx = shuffledOrder(STORY_WORDPICK_WRONG_POOL.length).slice(0, STORY_WORDPICK_BOARD_WRONG);
  const words = nounIdx.map(i => ({w:STORY_WORDPICK_NOUN_POOL[i], noun:true}))
    .concat(wrongIdx.map(i => ({w:STORY_WORDPICK_WRONG_POOL[i].w, noun:false, pos:STORY_WORDPICK_WRONG_POOL[i].pos})));
  const order = shuffledOrder(words.length);
  return order.map(i => words[i]);
}

function storyWordPickTap(i){
  if(!storyRun || storyRun.wpDone) return;
  const word = storyRun.wpWords[i];
  const el = document.querySelector(`.wordpick-token[data-i="${i}"]`);
  if(!el || el.classList.contains("found") || el.classList.contains("tried")) return;

    storyRun.wpDeadline -= STORY_WORDPICK_MISS_PENALTY_MS;

      clearStoryWordPickTimer();

/* 野球ミニゲーム（baseball beat）：他の中ボス（battle/proofread）と違い、3イニング制・
   アウト/走者/得点というリアルタイム性の高いミニゲーム全体を1つのbeatとして丸ごと実装する。
   状態はstoryRun.bb（非セーブのランタイムオブジェクト）に持たせ、beatに滞在している間は
   何度でも通しでプレイできる（storyRenderBeatが呼ばれるたびに、bbBeatIdxが変わらない限り
   状態を保持する。gateBeatIdx/battleBeatIdxと同じガードパターン）。
   勝敗の判定は3イニング終了後の得点比較のみ（自軍>相手で勝ち、以下は引き分け扱いで
   どちらも「もう一度挑戦する」を表示する、教員の指示どおりの仕様）。 */
function storyRenderBaseball(beat, idx){
  if(storyRun.bbBeatIdx !== idx){

}
function storyBaseballReset(){
  storyRun.bb = {
    inning:1, outs:0, bases:[false,false,false], totalRuns:0,
    inningRuns:Array(BASEBALL_INNINGS_TOTAL).fill(null),
    opponentInningRuns:Array(BASEBALL_INNINGS_TOTAL).fill(null), opponentTotalRuns:0,
    curInningRuns:0, batterNumber:1, phase:"ready",
    question:null, selected:null, feedback:null, shownAt:null,
    log:["プレイボール！「次の球」を押して勝負開始。"],
    lastQ:null, countdown:null,
    countdownTimerId:null, answerTimerId:null, answerDeadline:null, timeLimit:BASEBALL_TIME_TABLE_S[0],
    yojiLvStart: loadStats().lv.yoji || 1, // 試合開始時点の四字熟語レベル（勝利画面で伸びを表示するため）
  };
}
function baseballAddLog(msg){
  const bb = storyRun.bb;

}
function clearBaseballCountdownTimer(){
  const bb = storyRun && storyRun.bb;
  if(bb && bb.countdownTimerId){ clearInterval(bb.countdownTimerId); bb.countdownTimerId = null; }
}
function clearBaseballAnswerTimer(){
  const bb = storyRun && storyRun.bb;
  if(bb && bb.answerTimerId){ clearInterval(bb.answerTimerId); bb.answerTimerId = null; }

function storyBaseballStartPitch(){

  bb.countdownTimerId = setInterval(() => {

function storyBaseballBeginQuestion(){

function animateBaseballTimerBar(ms){

function storyBaseballTimeout(){
  const bb = storyRun.bb;
  if(bb.selected !== null) return;
  clearChoiceKeys();
  bb.selected = -1;
  const elapsedMs = Date.now() - (bb.shownAt || Date.now());
  record("yoji", bb.question, false, elapsedMs, {skipRecentAcc:true});
  bb.feedback = { ok:false, msg:"時間切れ…見逃し三振" };
  baseballAddLog(`${baseballSpeedLabel(bb.batterNumber)}を見逃す → 時間切れ → アウト`);
  bb.outs += 1;

function storyBaseballAnswer(idx){
  const bb = storyRun.bb;
  if(bb.selected !== null) return;
  clearBaseballAnswerTimer();
  clearChoiceKeys();
  bb.selected = idx;
  const correct = idx === bb.question.a;
  /* この野球ミニゲームだけは、教員の指示で正誤をrecord()に反映する（他の中ボス・校正
     ミニゲームはrecord()を呼ばず分野レベルに影響しない設計のままだが、ここは例外）。
     正解した瞬間に分野（四字熟語）のレベルが上がりうる。ただしskipRecentAcc:trueにより、
     最短0.5秒まで縮む野球ミニゲーム特有のペースが「直近の正答率」（分野別・分野横断とも）や
     fastGuess判定に混ざらないようにしている（2026-07-18、教員の指示）。 */
  const elapsedMs = Date.now() - (bb.shownAt || Date.now());
  const r = record("yoji", bb.question, correct, elapsedMs, {skipRecentAcc:true});
  if(correct){
    const hit = pickBaseballHitType();
    const { newBases, runsScored } = baseballAdvanceRunners(bb.bases, hit.bases);
    bb.feedback = { ok:true, msg:`${hit.msg}${runsScored > 0 ? `　${runsScored}点入る！` : ""}`, lvup:r.lvup };
    bb.bases = newBases;
    if(runsScored > 0){
      bb.totalRuns += runsScored;
      bb.curInningRuns += runsScored;
    }
    baseballAddLog(`${baseballSpeedLabel(bb.batterNumber)}を打ち返す → 正解 → ${hit.label}${runsScored > 0 ? `(${runsScored}点)` : ""}`);
  }else{
    bb.feedback = { ok:false, msg:"空振り三振…アウト", lvup:r.lvup };
    baseballAddLog(`${baseballSpeedLabel(bb.batterNumber)}を選択 → 不正解 → アウト`);
    bb.outs += 1;
  }
  storyRenderBaseballScreen();
  setTimeout(() => { if(storyRun && storyRun.bb === bb){ bb.phase = "resolved"; storyRenderBaseballScreen(); } }, 900);
}
/* アウトになった直後は、次の打者の制限時間を1人目(10秒)にリセットする。ヒットが続いた場合だけ
   batterNumberを1ずつ増やし、制限時間テーブルに沿って短くなっていく（＝ピッチャーが本気になり
   球が速くなっていく、という設定）。
   2026-07-18〜、教員の指示で「次の打者へ」を押したら（同じイニングが続く場合は）3秒の
   カウントダウンを待たせず即座に始まるよう変更した（storyBaseballStartPitchをそのまま呼ぶ）。 */
function storyBaseballNextBatter(){
  const bb = storyRun.bb;
  const wasHit = !!(bb.feedback && bb.feedback.ok);
  bb.question = null;
  bb.countdown = null;
  if(bb.outs >= 3){
    storyBaseballFinishInning();
    storyRenderBaseballScreen();
  }else{
    bb.batterNumber = wasHit ? bb.batterNumber + 1 : 1;
    bb.phase = "ready";
    storyBaseballStartPitch();
  }
}
function storyBaseballFinishInning(){
  const bb = storyRun.bb;
  bb.inningRuns[bb.inning - 1] = bb.curInningRuns;
  baseballAddLog(`${bb.inning}回表終了。この回 ${bb.curInningRuns}点。`);
  const oppRuns = baseballOpponentRuns();
  bb.opponentInningRuns[bb.inning - 1] = oppRuns;
  bb.opponentTotalRuns += oppRuns;
  baseballAddLog(oppRuns > 0 ? `${bb.inning}回裏、相手チームが${oppRuns}点を返す。` : `${bb.inning}回裏、相手チームを無得点に抑えた。`);
  if(bb.inning >= BASEBALL_INNINGS_TOTAL){
    bb.phase = "gameover";
    return;
  }
  bb.inning += 1;
  bb.outs = 0;
  bb.bases = [false, false, false];
  bb.curInningRuns = 0;
  bb.batterNumber = 1;
  bb.phase = "ready";
}
function storyBaseballRetry(){

        : `<p class="story-text">「${esc(boss.name)}」に勝った！<br>${esc(boss.icon)} <span class="drop-item">【${esc(boss.item)}】</span>を手に入れた！${gotTreasure ? `<br>✨ さらに、宝具<span class="drop-item treasure-drop">【${esc(boss.treasure)}】</span>を手に入れた！ ✨` : ""}</p>`}

/* ミニゲーム版「熱闘！四字熟語甲子園！」（sqBaseball、beat.free:true）の勝利画面
   （2026-08-20〜、教員の指示：「野球ゲームもミニゲームに加えて実装して。ストーリーは
   省く」）。storyBaseballResolveとの違いは、章のアイテム・宝具ドロップ（st.items/
   st.bossPity、sp.completedChaptersのisReplay判定）を一切行わない点だけ。代わりに、
   自己ベスト（st.baseballHighScore＝1試合の自軍得点の最高値、STORY_SIDEQUEST_BEST_FN
   参照）を更新し、ボキャブラ・シューティング（vocabShooterBonusExp、5点＝100点きざみの
   大台）と同じ仕組みで、自己ベストが5点きざみの大台（5・10・15…）を初めて超えるたびに
   経験値＋10を加算する（教員の指示、2026-08-20〜：「最高得点はボキャブラ・シューティング
   のように、5点ごとにお祝いの経験値を上げて」。すでに超えた大台の位置はst.baseballXpTierに
   持たせ、以後は同じか下回る自己ベストを出しても再加算しない）。四字熟語のレベルアップ
   表示は、章版と同じくそのまま見せる。 */
function storyBaseballResolveFree(){
  const bb = storyRun.bb;
  const st = loadStats();
  const prevBest = st.baseballHighScore||0;
  const isNewRecord = bb.totalRuns > prevBest;
  let xpGained = 0, xpTierReached = 0;
  if(isNewRecord){
    st.baseballHighScore = bb.totalRuns;
    const oldTier = st.baseballXpTier||0;
    const newTier = Math.floor(bb.totalRuns / 5);
    if(newTier > oldTier){
      xpGained = (newTier - oldTier) * 10;
      st.baseballBonusExp = (st.baseballBonusExp||0) + xpGained;
      st.baseballXpTier = newTier;
      xpTierReached = newTier * 5;
    }
  }
  saveStats(st);
  const yojiLvStart = bb.yojiLvStart || 1;
  const yojiLvEnd = st.lv.yoji || 1;
  const yojiLvUpHtml = yojiLvEnd > yojiLvStart
    ? `<p class="lvup-chip">📚 四字熟語 Lv.${yojiLvStart} → Lv.${yojiLvEnd} にアップ！</p>`
    : "";
  const recordHtml = isNewRecord ? `<p class="lvup-chip">🏅 自己ベスト更新！（${bb.totalRuns}点）</p>` : "";
  const xpHtml = xpGained > 0 ? `<p class="lvup-chip">🎉 自己ベスト${xpTierReached}点突破！　経験値＋${xpGained}</p>` : "";
  screen.innerHTML = `
    <div class="card story-scene bb-victory">
      <div class="bb-victory-burst">🎉⚾✨🏆✨⚾🎉</div>
      <div class="bb-victory-title">大金星！　強豪校のエースを打ち崩した！</div>
      <div class="bb-victory-score">自軍 ${bb.totalRuns} － ${bb.opponentTotalRuns} 相手</div>
      ${yojiLvUpHtml}
      ${recordHtml}
      ${xpHtml}
      <div class="btn-row" style="justify-content:center">
        <button class="btn story-advance-btn" onclick="storyAdvance()">つづける</button>
      </div>
    </div>`;
}

function baseballScoreboardHtml(bb){
  let head = `<div class="bb-sb-row head"><div class="bb-sb-team"></div>`;
  for(let n = 1; n <= BASEBALL_INNINGS_TOTAL; n++) head += `<div class="bb-sb-cell">${n}</div>`;
  head += `<div class="bb-sb-cell">計</div></div>`;
  let ownRow = `<div class="bb-sb-row"><div class="bb-sb-team">自軍</div>`;
  for(let n = 1; n <= BASEBALL_INNINGS_TOTAL; n++){
    const v = bb.inningRuns[n-1] !== null ? bb.inningRuns[n-1] : (n === bb.inning ? bb.curInningRuns : "-");
    ownRow += `<div class="bb-sb-cell">${v}</div>`;
  }
  ownRow += `<div class="bb-sb-cell total">${bb.totalRuns}</div></div>`;
  let oppRow = `<div class="bb-sb-row"><div class="bb-sb-team">相手</div>`;
  for(let n = 1; n <= BASEBALL_INNINGS_TOTAL; n++){
    const v = bb.opponentInningRuns[n-1] !== null ? bb.opponentInningRuns[n-1] : "-";
    oppRow += `<div class="bb-sb-cell">${v}</div>`;
  }
  oppRow += `<div class="bb-sb-cell total">${bb.opponentTotalRuns}</div></div>`;
  return `<div class="bb-scoreboard">${head}${ownRow}${oppRow}</div>`;
}

/* ================= サブクエスト「ボキャブラ・シューティング」（shooting beat、2026-08-10〜） =================
   元々は独立した単一HTMLファイル（ボキャブラ・シューティング/vocab_shooter.html）だったシューティング
   ゲームを、ストーリーモードのサブクエストとして移植したもの。教員の指示で、以下の点を本編仕様から
   変更している：
   1. 出題は単体データ(VOCAB_LEVELSという学年別10段階の独自プール)をやめ、知識クイズの「語彙」
      （goi）分野の問題を流用する。ただし本家のselectOne()（診断的難度調整st.diffLv.goi連動）
      とは別に、このミニゲーム専用の8段階レベル制（小学校中学年〜大学生、VS_LEVEL_NAMES）を
      再現するため、goiの各アイテムに新設した`vsLv`フィールド(1〜8)で出題プールを絞り込む
      （vsPickNextItem参照）。既存206問はgrade/lv値をもとに8段階へ再分類し、当時データが
      存在しなかった「小学校高学年」（vsLv2）だけ新規に16問を作問してgoiへ追加した
      （教員向けメモ: 2026-08-10時点でgoi全222問、分布は[[kokugo_story_mode]]参照）。
      5問正解でレベルが1つ上がり（VS_CORRECT_PER_LEVEL）、落下速度は最初から正解を重ねる
      たびに徐々に上がっていく（VS_CORRECT_PER_SPEEDUP問ごとにVS_SPEEDUP_STEP）。ミスをした
      とき（誤答オーブに命中／正解を撃ちもらす）は、ライフが1減るのに加えて、速度が2段階分
      （VS_SPEEDUP_STEP×2）下がる——ペナルティではなく、直後の1〜2問の難易度を一旦やわらげる
      救済措置という位置づけ（教員の指示、2026-08-10〜、vsLoseLife参照）。
   2. 正解するたびにrecord("goi", ...)を呼び、「語彙」分野のレベルを通常のクイズと同じ仕組みで
      上げる（診断的難度調整st.diffLv.goiも連動して上がっていく）。ただしskipRecentAcc:trueを
      指定し、野球ミニゲーム（storyBaseballAnswer参照）と同じ理由で、テンポの速いこのミニゲーム
      の結果を「直近30問の正答率」（ボスのランダム遭遇率等に使う全ジャンル共通の統計）には
      混ぜない。1つの単語（1ラウンド）につき、record()は「正解オーブに命中」または「正解オーブを
      撃ちもらして画面外へ」のどちらか一度だけ呼ぶ（誤答オーブに命中しても、そのタップ単体では
      record()を呼ばない＝ライフが減るだけの既存の「ちがう！」の挙動のまま）。上記1のミニゲーム
      専用レベルとは完全に別物（両方が同時並行で進む）。
   3. ハイスコアは、st.vocabShooterHighScore としてほかの全データと同じ`st`オブジェクトに載せ、
      saveStats()経由でlocalStorageに保存する（本編スタンドアロン版はページ内保持のみだった）。
   「クリア」という概念のない常設スコアアタックのため、章の解放は常に真（storyChapterUnlocked参照）、
   一覧からタップするたびに毎回beatIdx0から新しいプレイを始める（startStoryMode参照）。 */
let VS_W = 340, VS_H = 600; // vsComputeCanvasSize()で画面幅に応じて上書きされる
const VS_LEVEL_NAMES = [
  "小学校中学年レベル", "小学校高学年レベル", "中学1年生前半レベル", "中学1年生後半レベル",

   一方、弾1発あたりの攻撃力は機体形態(shipLevel, 0始まり)によって決まり、
   vsBulletDamage(shipLevel) = shipLevel+1 発分（第一形態=1発分、第二形態=2発分…）。

const VS_BASE_SPEED = 1.1;            // 落下速度の初期値・ミスで下がりきったときの下限
