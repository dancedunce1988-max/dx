        <li>「書けた！」が続くと少し上の学年の字が、「書けなかった」が続くと少し下の学年の字が出やすくなります（10問に1問くらいは、今のレベルに関係なく他の学年の字も確認に出ます）。</li>
      </ul>
    </div>

    <h3 class="section">🎁 アイテムのシステム（宝具も）</h3>
    <div class="card">
      <ul class="help-list">
        <li>ボスに勝つと、そのボスだけが持っている「<b>アイテム</b>」を必ず1つもらえます。</li>
        <li>さらに、まれに（だいたい10回に1回くらい）、もっとレアな「<b>宝具</b>」も手に入ります。ただし<b>直近30問の正答率が50%未満のときは、宝具は手に入りません</b>（アイテムは通常どおり手に入ります）。</li>
        <li>集めたアイテム・宝具は、成績とは別に<b>ずっと記録</b>されます。ホーム画面の「アイテム一覧」からいつでも確認できます。</li>
        <li>通常アイテムは、ボス戦中に「🎒 アイテムを使う」から<b>消費して効果を得る</b>こともできます。HPを回復するもの、数ターンのあいだ攻撃力・防御力が上がるもの、次の1回だけ間違えてもダメージを受けなくなるものなど、アイテムによって効果がちがいます。使うと1個へります。<b>1ターンに使えるアイテムは1個まで、また同じ種類のアイテムはその戦闘中に1回まで</b>です。</li>
      </ul>
    </div>

    <h3 class="section">👹 ボスのシステム</h3>
    <div class="card">
      <ul class="help-list">
        <li>ふつうに問題を解いていると、<b>ごくまれに（1/40くらいの確率で）</b>ボスが勝負をしかけてきます。ただし<b>直近30問の正答率が50%未満のときは出現しません</b>。逆に<b>直近30問の正答率が80%以上のときは、もっと高い確率（1/30くらい）</b>で出現しやすくなります。</li>
        <li>「勝負する」か「いいえ」かを、その場で選べます。断ってもペナルティはありません。</li>
        <li>ボス戦では、<b>正解するとボスにダメージ</b>を与え、<b>不正解だと自分がダメージ</b>を受けます（間違えたときのほうがダメージが大きいので、正解を積み重ねることが大切です）。</li>
        <li>ボスにはそれぞれ個性があり、<b>HPが高くて硬いボス</b>、<b>攻撃がはげしいボス</b>、<b>防御・回避にすぐれたボス</b>など、戦い方が少しずつちがいます。</li>
        <li>それぞれのボスには「<b>適正経験値</b>」の目安があり、遭遇したときに表示されます。その分のステータスポイントを持って挑めば、8割正解ペースで勝率85〜90%くらいになるよう調整されています。適正経験値より少ないと、格上のボスほど勝つのが難しくなります。</li>
        <li>負けてもアイテムを失うことはなく、何度でも挑戦できます。</li>
        <li>レベルアップでたまる「挑戦チケット」を使えば、遭遇を待たずに<b>いつでも</b>ボスに挑戦できます。挑戦チケットを使った対戦は<b>全ジャンル</b>から出題されます（ふだんのランダム遭遇では、そのとき解いていたジャンルのまま出題されます）。また、挑戦チケットでは<b>今の経験値で適正経験値以下のボスだけ</b>が出現します（経験値が50以下のときは、適正経験値50のボスのどちらかになります）。</li>
      </ul>
    </div>

    <h3 class="section">💪 ボス戦ステータスのシステム</h3>
    <div class="card">
      <ul class="help-list">
        <li>分野のレベルが1つ上がるたびに、「ステータスポイント」を1つもらえます。</li>
        <li>ホームの「ボス戦ステータス」画面で、<b>HP・攻撃力・防御力・素早さ・運</b>の5つに好きなだけ割りふれます。</li>
        <li><b>HP</b>はボス戦での最大体力、<b>攻撃力</b>は正解時のダメージ、<b>防御力</b>はボスから受けるダメージの軽減、<b>素早さ</b>はボスの攻撃を回避できる確率（あわせて自分の攻撃の命中しやすさにも少し関係）、<b>運</b>は「会心の一撃」の出やすさに加えて、ボスとの遭遇率にも関係します。どのステータスも、注げば注ぐほど少しずつ効果が伸びていくので、無駄になりません。</li>
        <li>これらの効果は<b>ボス戦だけ</b>に反映されます（二人対戦には影響しません）。ボス側にも同じような個性があり、素早さでの回避は、ボスの「命中率」との駆け引きになります。</li>
        <li>「配分をリセット」ボタンで、いつでも割りふり直せます。</li>
      </ul>
    </div>

    <h3 class="section">⚔️ 対戦モードのシステム</h3>
    <div class="card">
      <ul class="help-list">
        <li>同じ端末を2人で使って対戦する、二人対戦モードです。</li>
        <li>はじめに、<b>2人の名前</b>を入力します。</li>
        <li>次に、「<b>全ジャンル</b>」から出題するか、「<b>ジャンルを選択する</b>」で対戦したい分野を自分たちで選ぶか（複数選べます）を決めます。</li>
        <li>お互いのHPは100ずつ。交代で問題に答えて、<b>正解すると相手にダメージ</b>をあたえます。</li>
        <li>対戦モードでは、知識クイズのような難度の自動調整は行われません。<b>問題のレベルは完全にシャッフル</b>され、かんたんな問題も難しい問題も同じくらいの確率で出題されます。2人のどちらか一方に有利にならないよう、公平に出題するためです。</li>
        <li>先にHPが0になったほうが負けです。個人の称号やレベルには影響しない、対戦専用の記録が別にたまります。</li>
      </ul>
    </div>

    <button class="btn secondary" onclick="showHome()">ホームへ</button>`;
}

/* ================= 知識クイズ（エンドレス） ================= */
let quiz = null;
function startQuiz(key){
  quiz = {mode:"cat", key, n:0, correct:0, evolved:null, lastQ:null, cat:null, item:null, order:null};
  nextQuestion();
}
function startReview(){
  if(weakItems().length === 0){
    screen.innerHTML = `<div class="card"><h3 class="section">苦手復習</h3>
      <p>いま復習が必要な問題はありません。間違えた問題があると、ここにたまっていきます。</p>
      <button class="btn" onclick="showHome()">ホームへ</button></div>`;
    return;
  }
  quiz = {mode:"review", key:null, n:0, correct:0, evolved:null, lastQ:null, cat:null, item:null, order:null};
  nextQuestion();
}
/* 「バランスよく鍛える」：毎回CAT_KEYS（知識クイズ20分野）から1分野を選び、その分野の中では
   通常どおりselectOne（適応的難度調整）で1問選ぶ。読解・漢字の書き学習・苦手復習は対象外
   （CAT_KEYSにそもそも含まれないため、自然に除外される）。
   分野の選び方は単純な均等ランダムではなく、平均レベルより低い分野ほど出やすく・高い分野ほど
   出にくくする重みづけにしている（2026-07-16〜、教員から「1分野だけ極端にレベルが高くなった
   生徒がいる」という相談を受けて追加）。平均に対する比（avgLv/そのcatのlv）を重みにするので、
   低いほど出やすい・高いほど出にくいが同じ式で自然に決まり、実際に差が縮まって平均に近づくほど
   重みも1に近づいて均等ランダムへ戻っていく（＝「徐々に是正され、是正されきったら元の均等ランダムに
   なる」という設計）。極端な差でも0%にはならない（クランプの下限があるので、進みすぎた分野もごくまれに
   出る）ようにして、"その分野を完全に触れなくする"のではなく"出にくくする"程度にとどめている。 */
const BALANCED_WEIGHT_MIN = 0.2; // 平均よりかなり高い分野の重みの下限（0%にはしない）
const BALANCED_WEIGHT_MAX = 5;   // 平均よりかなり低い分野の重みの上限（際限なく出やすくしすぎない）
function balancedCatWeight(lv, avgLv){
  return Math.max(BALANCED_WEIGHT_MIN, Math.min(BALANCED_WEIGHT_MAX, avgLv / Math.max(1, lv)));
}
/* 「まだ習っていない」設定（2026-07-16〜）：授業の進度によって習っていないことがある古典・文法系の
   5分野だけ、生徒自身が「まだ習っていない」とON/OFFできるようにする。ONにした分野は、
   「バランスよく鍛える」の分野選択と、ボス戦（挑戦チケット＝全ジャンル、および通常プレイ中の
   ランダム遭遇でジャンルが未確定なとき）の対象から除外される。ホーム画面からその分野を直接選んで
   ふつうにクイズを解くこと自体は、ONのままでも今までどおりでき（生徒本人の意思による直接の選択は
   妨げない）、そのときにボスが出れば今までどおりその分野で戦う。 */
const NOT_LEARNED_ELIGIBLE_CATS = ["kanbun", "kobun", "kanazukai", "katsuyo", "shikibetsu", "doushi_katsuyo"];
function notLearnedExcludedKeys(st){
  return NOT_LEARNED_ELIGIBLE_CATS.filter(k => st.notLearnedCats && st.notLearnedCats[k]);
}
/* keysからnotLearnedCatsで除外指定された分野を取り除く。理論上ここに来ることはないが、
   万一全滅した場合は元のkeysをそのまま返す（出題不能を避けるための保険）。 */
function filterNotLearned(keys, st){
  const excluded = new Set(notLearnedExcludedKeys(st));
  if(excluded.size === 0) return keys;
  const filtered = keys.filter(k => !excluded.has(k));
  return filtered.length ? filtered : keys;
}
function selectBalancedCat(st){
  const pool = filterNotLearned(CAT_KEYS, st);
  const avgLv = pool.reduce((sum, k) => sum + (st.lv[k] || 1), 0) / pool.length;
  const weights = pool.map(k => balancedCatWeight(st.lv[k] || 1, avgLv));
  return pickOne(pool, weights);
}
function toggleNotLearnedCat(key){
  const st = loadStats();
  if(!st.notLearnedCats) st.notLearnedCats = {};
  st.notLearnedCats[key] = !st.notLearnedCats[key];
  saveStats(st);
  showNotLearnedSettings();
}
function notLearnedBtnHtml(st){
  const n = notLearnedExcludedKeys(st).length;
  const sub = n > 0 ? `現在${n}分野を除外中` : "設定なし（すべての分野が対象）";
  return `
    <div class="card menu-card" onclick="showNotLearnedSettings()">
      <div class="menu-icon">🚧</div>
      <div><h2>出題設定する</h2><p>授業でまだ習っていない分野を、バランスよく鍛える・ボス戦の対象から外せます</p></div>
      <div class="right"><span class="shogo-badge">${esc(sub)}</span></div>
    </div>`;
}
function showNotLearnedSettings(){
  const st = loadStats();
  let html = `<h3 class="section">🚧 まだ習っていない</h3>
    <p class="note">授業でまだ習っていない分野をONにすると、「バランスよく鍛える」とボス戦（挑戦チケット・ランダム遭遇）で出題されにくくなります。ホーム画面からその分野を直接選んで解くことは、ONのままでも今までどおりできます。</p>
    <div class="genre-pick-grid">`;
  NOT_LEARNED_ELIGIBLE_CATS.forEach(key=>{
    if(!CATS[key]) return;
    const on = !!(st.notLearnedCats && st.notLearnedCats[key]);
    html += `<button class="genre-pick-chip ${on?'on':''}" onclick="toggleNotLearnedCat('${key}')">${esc(CATS[key].name)}${on?" ✓":""}</button>`;
  });
  html += `</div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn secondary" onclick="showHome()">ホームへ</button>
    </div>`;
  screen.innerHTML = html;
}
function startBalanced(){
  quiz = {mode:"balanced", key:null, n:0, correct:0, evolved:null, lastQ:null, cat:null, item:null, order:null};
  nextQuestion();
}
function nextQuestion(){
  if(kotonohaMaybeInterruptForEvolve(() => nextQuestion())) return;
  if(rollBossEncounter(() => nextQuestion())) return;
  if(quiz.mode === "review"){
    const st = loadStats();
    let weak = weakItems();
    if(weak.length > 1 && quiz.lastQ) weak = weak.filter(w => w.it.q !== quiz.lastQ);
    if(weak.length === 0){ endSession(true); return; }
    const weights = weak.map(w => reviewWeight(st, w.cat, w.it));
    const picked = pickOne(weak, weights);
    quiz.cat = picked.cat; quiz.item = picked.it;
    quiz.isReviewDue = false;
  }else{
    /* 難度調整(diffLv)による通常出題より、間隔反復レビューの期限が来ている問題を優先する
       （教員の指示、2026-07-29）。既存の「苦手復習」モード（quiz.mode==="review"、上のブロック）とは
       別物で、こちらは「cat」「balanced」の通常プレイ中に自動で混ざる。 */
    const st = loadStats();
    const due = ReviewSystem.getDueItem(st, quiz.lastQ, quiz.mode === "cat" ? quiz.key : null);
    if(due){
      quiz.cat = due.cat; quiz.item = due.item; quiz.isReviewDue = true;
    }else if(quiz.mode === "balanced"){
      quiz.cat = selectBalancedCat(st);
      quiz.item = selectOne(quiz.cat, quiz.lastQ);
      quiz.isReviewDue = false;
    }else{
      quiz.cat = quiz.key;
      quiz.item = selectOne(quiz.key, quiz.lastQ);
      quiz.isReviewDue = false;
    }
  }
  quiz.lastQ = quiz.item.q;
  renderQuestion();
}
function renderQuestion(){
  quiz.shownAt = Date.now(); // 「素早く適当に答える」検知（fastGuess）用。gradeAnswerで経過時間を計算する
  const it = quiz.item, cat = quiz.cat;
  const st = loadStats();
  const s = qStat(st, cat, it);
  const redoMark = quiz.isReviewDue ? `<span class="redo">🔁 復習（段階${(s&&s.reviewStage)||1}）</span>`
    : (s && s.t > 0 && s.c < s.t) ? `<span class="redo">↻ 前に間違えた問題</span>` : "";
  const label = quiz.mode === "review" ? `苦手復習（${CATS[cat].name}）`
    : quiz.mode === "balanced" ? `バランスよく鍛える（${CATS[cat].name}）`
    : CATS[cat].name;
  const isInput = Array.isArray(it.ans);
  let answerArea;
  if(isInput){
    clearChoiceKeys();
    answerArea = `
      <div class="ans-row">
        <input type="text" id="ansIn" class="ans-input" placeholder="${esc(it.ansPlaceholder || "ひらがなで入力")}" autocomplete="off"
               onkeydown="if(event.key==='Enter'){event.preventDefault();submitInput();}">
        <button class="btn inline" id="submitBtn" onclick="submitInput()">こたえる</button>
      </div>`;
  }else{
    quiz.order = shuffledOrder(it.c.length);
    answerArea = `
      <div class="choices${choicesClass(it)}">
        ${quiz.order.map((oi,pos)=>`<button class="choice" onclick="answerChoice(${oi})"><span class="choice-num">${pos+1}</span>${it.ckb ? kanbunMiniHtml(it.ckb[oi]) : esc(it.c[oi])}</button>`).join("")}
      </div>`;
    setupChoiceKeys(pos => answerChoice(quiz.order[pos]), it.c.length);
  }
  screen.innerHTML = `
    <div class="session-bar">
      <span>${quiz.n+1}問目　｜　今回の正解 ${quiz.correct}問${recentAccDisplayHtml()}</span>
      <span class="catstat">${catBadge(cat)}</span>
    </div>
    <div class="card">
      <div class="q-category"><span>${esc(label)}</span>${redoMark}</div>
      ${subInstructionHtml(cat, it)}
      ${kanbunBoxHtml(it.kb)}
      <div class="q-text">${markQuestionHtml(it.q)}</div>
      ${answerArea}
      <div class="feedback" id="fb"></div>
      <div class="btn-row">
        <button class="btn tap-advance-btn" id="nextBtn" style="display:none" onclick="nextQuestion()">次へ</button>
        <button class="btn secondary" id="quitBtn" style="display:none" onclick="endSession(false)">今日はここまで</button>
      </div>
    </div>
    ${unlockFooterHtml(CATS[cat].name, catUnlockedQuestionPct(st, cat))}`;
  if(isInput){ const el = document.getElementById("ansIn"); if(el) el.focus(); }
}
function answerChoice(origIdx){
  const it = quiz.item;
  const ok = origIdx === it.a;
  gradeAnswer(ok, origIdx, null);
}
function submitInput(){
  const el = document.getElementById("ansIn");
  if(!el || el.disabled) return;
  const val = normalizeAns(el.value);
  if(!val) return;   // 空欄は受け付けない
  const ok = quiz.item.ans.map(normalizeAns).includes(val);
  el.disabled = true;
  const sb = document.getElementById("submitBtn");
  if(sb) sb.disabled = true;
  gradeAnswer(ok, null, el.value);
}
function gradeAnswer(ok, chosenOrig, typed){
  const it = quiz.item, cat = quiz.cat;
  quiz.n++;
  if(ok) quiz.correct++;
  const elapsedMs = Date.now() - (quiz.shownAt || Date.now());
  const r = record(cat, it, ok, elapsedMs);
  if(r.evolved) quiz.evolved = r.evolved;
  /* 選択式の色付け */
  const btns = screen.querySelectorAll(".choice");
  btns.forEach((b,pos)=>{
    const oi = quiz.order ? quiz.order[pos] : pos;
    b.disabled = true;
    if(oi===it.a) b.classList.add("correct");
    else if(oi===chosenOrig) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = document.getElementById("fb");
  fb.className = "feedback show " + (ok?"ok":"ng");
  let expl;
  if(Array.isArray(it.ans)){
    const wrongMsg = ok ? "" : `正解は「${esc(it.ans.join("」または「"))}」（あなたの答え：${esc(typed||"")}）`;
    expl = [wrongMsg, it.e ? esc(it.e) : ""].filter(Boolean).join("<br>");
  }else{
    expl = it.e ? esc(it.e) : (ok ? "" : `正解は「${esc(it.c[it.a])}」`);
  }
  const lvChip = r.lvup ? `<span class="lvup-chip">${esc(CATS[cat].name)} Lv.${r.lv} にアップ！</span>` : "";
  const evolveMsg = r.evolved
    ? `<div class="evolve">${r.evolved.hidden ? "🔓 かくされた称号が明かされた！<br>" : ""}${r.evolved.icon} 進化！　${esc(CATS[cat].name)}の称号が「${esc(r.evolved.name)}」になった！</div>` : "";
  const ticketMsg = r.gotTicket ? `<div class="evolve ticket-get">🎟️ ボスへの挑戦チケットを1枚手に入れた！</div>` : "";
  const groupMsg = r.groupJustUnlocked ? `<div class="evolve">🔓 ${esc(CATS[cat].name)}の次のグループが解禁された！</div>` : "";
  const celebrateMsg = celebrateMilestoneHtml(CATS[cat].name, r.celebrateMilestones);
  const lowAccMsg = r.lowAccuracy ? `<p class="note">⏸️ 直近の正答率が低いため、レベルアップはお休み中です。落ち着いて問題を読んで答えると、また上がるようになります。</p>` : "";
  const fastMsg = r.fastGuess ? `<p class="note">⏸️ 少し急いで答えているようです。落ち着いて問題を読んで答えると、また上がるようになります。</p>` : "";
  fb.innerHTML = `<div class="verdict">${ok?"○ 正解！":"× ざんねん…"}${lvChip}</div>${expl}${evolveMsg}${ticketMsg}${groupMsg}${celebrateMsg}${lowAccMsg}${fastMsg}`;
  document.getElementById("nextBtn").style.display = "inline-block";
  document.getElementById("quitBtn").style.display = "inline-block";
  document.getElementById("nextBtn").focus();
}
function endSession(clearedAll){
  const q = quiz;
  let head, sub = "";
  if(q.mode === "review"){
    head = clearedAll ? "苦手を全部つぶしました！　おみごと！" : "苦手復習おつかれさま！";
  }else if(q.mode === "balanced"){
    head = "バランスよく鍛えるおつかれさま！";
  }else{
    head = `${CATS[q.key].name}のトレーニングおつかれさま！`;
    sub = `<p class="result-msg">現在：${catBadge(q.key)}</p>`;
  }
  window._retry = q.mode === "review" ? startReview : q.mode === "balanced" ? startBalanced : ()=>startQuiz(q.key);
  screen.innerHTML = `
    <div class="card">
      <h3 class="section">今回の記録</h3>
      <div class="result-score">${q.correct} <span style="font-size:1.2rem;color:var(--sub)">/ ${q.n}問 正解</span></div>
      <p class="result-msg">${esc(head)}</p>
      ${sub}
      ${q.evolved ? `<div class="evolve">${q.evolved.icon} 今回「${esc(q.evolved.name)}」に進化しました！</div>` : ""}
      <div class="btn-row">
        <button class="btn" onclick="window._retry()">つづける</button>
        <button class="btn secondary" onclick="showStats()">成績を見る</button>
        <button class="btn secondary" onclick="showHome()">ホームへ</button>
      </div>
    </div>`;
}

/* ================= 総合診断テスト =================
   20分野（CAT_KEYS）を毎回まんべんなくチェックする独立モード。「漢字の書き取り学習」等と同じく
   quiz/record()の通常経路は使わず、経験値・分野レベル・diffLv・「ことのは」の成長には一切影響させない
   （固定の問題セットだと答えを覚えてしまうという教員の指摘を受け、分野ごとの出題数だけを固定し、
   実際に出す問題は毎回diffLvに関係なく分野内から無作為に選び直す設計にした）。
   ホーム画面には置かず、「成績・称号」画面の目立たない場所からだけ入れる。 */
const DIAG_PER_CAT = 2;
let diag = null;
function buildDiagnosticQueue(){
  const list = [];
  CAT_KEYS.forEach(cat=>{
    const items = CATS[cat].items;
    const n = Math.min(DIAG_PER_CAT, items.length);
    shuffledOrder(items.length).slice(0, n).forEach(i => list.push({cat, item: items[i]}));
  });
  for(let i=list.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; }
  return list;
}
function startDiagnostic(){
  const catStats = {};
  CAT_KEYS.forEach(k => { catStats[k] = {t:0, c:0}; });
  diag = {queue: buildDiagnosticQueue(), idx:0, n:0, correct:0, catStats, cat:null, item:null, order:null, shownAt:null};
  diagNextQuestion();
}
function diagNextQuestion(){
  if(diag.idx >= diag.queue.length){ diagEndSession(); return; }
  const cur = diag.queue[diag.idx];
  diag.idx++;
  diag.cat = cur.cat; diag.item = cur.item;
  diagRenderQuestion();
}
function diagRenderQuestion(){
  diag.shownAt = Date.now();
  const it = diag.item, cat = diag.cat;
  let answerArea;
  if(Array.isArray(it.ans)){
    clearChoiceKeys();
    answerArea = `
      <div class="ans-row">
        <input type="text" id="diagAnsIn" class="ans-input" placeholder="${esc(it.ansPlaceholder || "ひらがなで入力")}" autocomplete="off"
               onkeydown="if(event.key==='Enter'){event.preventDefault();diagSubmitInput();}">
        <button class="btn inline" id="diagSubmitBtn" onclick="diagSubmitInput()">こたえる</button>
      </div>`;
  }else{
    diag.order = shuffledOrder(it.c.length);
    answerArea = `
      <div class="choices${choicesClass(it)}">
        ${diag.order.map((oi,pos)=>`<button class="choice" onclick="diagAnswerChoice(${oi})"><span class="choice-num">${pos+1}</span>${it.ckb ? kanbunMiniHtml(it.ckb[oi]) : esc(it.c[oi])}</button>`).join("")}
      </div>`;
    setupChoiceKeys(pos => diagAnswerChoice(diag.order[pos]), it.c.length);
  }
  screen.innerHTML = `
    <div class="session-bar">
      <span>${diag.n+1}問目 / 全${diag.queue.length}問　｜　正解 ${diag.correct}問</span>
      <span class="catstat">${esc(CATS[cat].name)}</span>
    </div>
    <div class="card">
      <div class="q-category"><span>🔍 総合診断テスト</span></div>
      ${subInstructionHtml(cat, it)}
      ${kanbunBoxHtml(it.kb)}
      <div class="q-text">${markQuestionHtml(it.q)}</div>
      ${answerArea}
      <div class="feedback" id="diagFb"></div>
      <div class="btn-row">
        <button class="btn tap-advance-btn" id="diagNextBtn" style="display:none" onclick="diagNextQuestion()">次へ</button>
        <button class="btn secondary" id="diagQuitBtn" style="display:none" onclick="diagEndSession()">ここまでにする</button>
      </div>
    </div>`;
  if(Array.isArray(it.ans)){ const el = document.getElementById("diagAnsIn"); if(el) el.focus(); }
}
function diagAnswerChoice(origIdx){
  diagGrade(origIdx === diag.item.a, origIdx, null);
}
function diagSubmitInput(){
  const el = document.getElementById("diagAnsIn");
  if(!el || el.disabled) return;
  const val = normalizeAns(el.value);
  if(!val) return;
  const ok = diag.item.ans.map(normalizeAns).includes(val);
  el.disabled = true;
  const sb = document.getElementById("diagSubmitBtn");
  if(sb) sb.disabled = true;
  diagGrade(ok, null, el.value);
}
function diagGrade(ok, chosenOrig, typed){
  const it = diag.item, cat = diag.cat;
  diag.n++;
  if(ok) diag.correct++;
  diag.catStats[cat].t++;
  if(ok) diag.catStats[cat].c++;
  const btns = screen.querySelectorAll(".choice");
  btns.forEach((b,pos)=>{
    const oi = diag.order ? diag.order[pos] : pos;
    b.disabled = true;
    if(oi===it.a) b.classList.add("correct");
    else if(oi===chosenOrig) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = document.getElementById("diagFb");
  fb.className = "feedback show " + (ok?"ok":"ng");
  let expl;
  if(Array.isArray(it.ans)){
    const wrongMsg = ok ? "" : `正解は「${esc(it.ans.join("」または「"))}」（あなたの答え：${esc(typed||"")}）`;
    expl = [wrongMsg, it.e ? esc(it.e) : ""].filter(Boolean).join("<br>");
  }else{
    expl = it.e ? esc(it.e) : (ok ? "" : `正解は「${esc(it.c[it.a])}」`);
  }
  fb.innerHTML = `<div class="verdict">${ok?"○ 正解！":"× ざんねん…"}</div>${expl}`;
  document.getElementById("diagNextBtn").style.display = "inline-block";
  document.getElementById("diagQuitBtn").style.display = "inline-block";
  document.getElementById("diagNextBtn").focus();
}
function diagEndSession(){
  const st = loadStats();
  const groupResults = (DATA.groups || []).map(g=>{
    let t=0, c=0;
    g.keys.forEach(k=>{
      const s = diag.catStats[k];
      if(s){ t += s.t; c += s.c; }
    });
    return {name: g.name, t, c};
  });
  const catRows = CAT_KEYS.map(k=>({key:k, name:CATS[k].name, s: diag.catStats[k]})).filter(r=>r.s.t>0);
  if(!st.diag) st.diag = {};
  st.diag.lastResult = {
    at: new Date().toISOString(),
    total: diag.n, correct: diag.correct,
    groups: groupResults.filter(g=>g.t>0).map(g=>({name:g.name, t:g.t, c:g.c})),
    cats: catRows.map(r=>({name:r.name, t:r.s.t, c:r.s.c})),
  };
  saveStats(st);

  let html = `<div class="card">
    <h3 class="section">🔍 総合診断テストの結果</h3>
    <div class="result-score">${diag.correct} <span style="font-size:1.2rem;color:var(--sub)">/ ${diag.n}問 正解</span></div>`;
  if(diag.n > 0) html += `<p class="result-msg">総合正答率：${Math.round(100*diag.correct/diag.n)}%</p>`;
  const groupsSeen = groupResults.filter(g=>g.t>0);
  if(groupsSeen.length){
    html += `<table class="stats" style="margin-top:10px"><tr><th>グループ</th><th style="text-align:right">正答率</th></tr>`;
    groupsSeen.forEach(g=>{
      html += `<tr><td>${esc(g.name)}</td><td class="num">${g.c}/${g.t}（${Math.round(100*g.c/g.t)}%）</td></tr>`;
    });
    html += `</table>`;
  }
  html += `</div>`;
  if(catRows.length){
    catRows.sort((a,b)=> (a.s.c/a.s.t) - (b.s.c/b.s.t));
    html += `<div class="card"><h3 class="section">分野ごとの内訳（苦手な分野から）</h3><table class="stats"><tr><th>分野</th><th style="text-align:right">正答率</th></tr>`;
    catRows.forEach(r=>{
      html += `<tr><td>${esc(r.name)}</td><td class="num">${r.s.c}/${r.s.t}（${Math.round(100*r.s.c/r.s.t)}%）</td></tr>`;
    });
    html += `</table></div>`;
  }
  html += `<div class="btn-row">
      <button class="btn" onclick="startDiagnostic()">もう一度受ける</button>
      <button class="btn secondary" onclick="showStats()">成績を見る</button>
      <button class="btn secondary" onclick="showHome()">ホームへ</button>
    </div>`;
  screen.innerHTML = html;
}
/* 「成績・称号」画面の下のほうに置く、目立たない一行リンク（教員の指示：ホーム画面ではなく
   目立たない場所から入れる）。前回の結果があれば、日付と点数だけをさりげなく添える。 */
function diagEntryHtml(st){
  const r = st.diag && st.diag.lastResult;
  const sub = r
    ? `前回：${esc(new Date(r.at).toLocaleDateString("ja-JP"))}　${r.correct}/${r.total}問正解`
    : `20分野から${DIAG_PER_CAT}問ずつ無作為に出題（経験値には影響しません）`;
  return `<p class="note" style="margin-top:14px">
    <a href="#" onclick="startDiagnostic(); return false;">🔍 総合診断テストを受けてみる</a><br>
    <span style="font-size:.82rem; color:var(--sub)">${sub}</span>
  </p>`;
}

/* ================= 漢字の書き取り学習 =================
   高校入試頻出ランキング（上位から）をもとに、レベル別に出題する専用モード。
   「書けた！／書けなかった」の自己評価制なので、経験値・分野レベル・「ことのは」の進化には
   一切影響させない（record()・saveStatsの通常経路は使うが、cats/lv/diffLvは触らない）。
   代わりに、このモード専用の「書けたね数（＝独自の漢字レベル）」と、レベルごとの直近100回の
   自己評価正答率だけを、st.kanjiWrite に記録する。
   間違えた（＝書けなかった）漢字ほど出やすく、書けた漢字ほど出にくくなる重みづけは、
   通常モードのhistoryWeightと同じ考え方を、このモード専用データ(itemHist)に対して行う。 */
const KANJI_WRITE_LEVELS = [
  {key:"1",    label:"レベル１", topN:20,  desc:"入試頻出トップ20から出題"},
  {key:"2",    label:"レベル２", topN:50,  desc:"入試頻出トップ50から出題"},
  {key:"3",    label:"レベル３", topN:100, desc:"入試頻出トップ100から出題"},
  {key:"4",    label:"レベル４", topN:150, desc:"入試頻出トップ150から出題"},
  {key:"5",    label:"レベル５", topN:200, desc:"入試頻出トップ200から出題"},
  {key:"goku", label:"極",       topN:200, desc:"50%は上位ランキングから、50%はその他の漢字から出題", isGoku:true},
];
function kwData(){ return (window.KANJI_WRITE_DATA) || {ranked:[], other:[]}; }
/* そのレベルが今のデータ量で実際に遊べるかどうか（トップ200分・「その他」データが
   まだ揃っていないうちは、対応するレベルを「準備中」として選べなくする） */
function kwLevelReady(levelDef){
  const d = kwData();
  if(levelDef.isGoku) return d.ranked.length >= levelDef.topN && d.other.length > 0;
  return d.ranked.length >= levelDef.topN;
}
function kwHistoryWeight(st, it){
  const h = st.kanjiWrite.itemHist[it.id];
  if(!h || h.t === 0) return 1.2;
  const wrong = h.t - h.c;
  const w = Math.pow(0.75, h.c) * Math.pow(1.5, wrong);
  return Math.max(0.05, Math.min(8, w));
}
function kwPoolForLevel(levelKey){
  const d = kwData();
  if(levelKey === "goku"){
    return (Math.random() < 0.5 && d.other.length > 0) ? d.other : d.ranked;
  }
  const def = KANJI_WRITE_LEVELS.find(l => l.key === levelKey);
  return d.ranked.slice(0, Math.min(def.topN, d.ranked.length));
}
function kwSelectOne(levelKey, lastId){
  const st = loadStats();
  let pool = kwPoolForLevel(levelKey);
  if(pool.length > 1 && lastId) pool = pool.filter(it => it.id !== lastId);
  const weights = pool.map(it => kwHistoryWeight(st, it));
  return pickOne(pool, weights);
}
function kwLevelAccuracy(st, levelKey){
  const recent = (st.kanjiWrite.levelRecent[levelKey]) || [];
  if(recent.length === 0) return null;
  return Math.round(100 * recent.reduce((a,b)=>a+b, 0) / recent.length);
}
function kwLv(st){ return 1 + (st.kanjiWrite.totalOk || 0); }
/* 自己評価を記録するだけの専用関数。record()は一切呼ばず、
   st.cats・st.lv・st.diffLv（＝経験値やことのはの進化に関わる値）にはnoneも触れない。 */
function kwRecord(levelKey, it, canWrite){
  const st = loadStats();
  maybeGrantDailyLogin(st);
  const h = st.kanjiWrite.itemHist[it.id] || {t:0, c:0};
  h.t++; if(canWrite) h.c++;
  st.kanjiWrite.itemHist[it.id] = h;
  if(canWrite) st.kanjiWrite.totalOk = (st.kanjiWrite.totalOk||0) + 1;
  const recent = (st.kanjiWrite.levelRecent[levelKey] || []).slice();
  recent.push(canWrite ? 1 : 0);
  while(recent.length > 100) recent.shift();
  st.kanjiWrite.levelRecent[levelKey] = recent;
  saveStats(st);
  return {lv: kwLv(st), acc: kwLevelAccuracy(st, levelKey)};
}

/* ---- 画面：レベル選択 ---- */
function showKanjiWriteMenu(){
  const st = loadStats();
  let html = `<h3 class="section">✍️ 漢字の書き取り学習</h3>
    <p class="note">高校入試で頻出の漢字を、書き取り形式で学習します。「書けた！」「書けなかった」の自己評価制で、経験値や「ことのは」の成長には影響しません。</p>
    <div class="kw-lv-badge">✍️ 書き取りレベル Lv.${kwLv(st)}　（これまで「書けた！」${st.kanjiWrite.totalOk||0}回）</div>`;
  KANJI_WRITE_LEVELS.forEach(l=>{
    const ready = kwLevelReady(l);
    const acc = kwLevelAccuracy(st, l.key);
    const accHtml = acc === null ? "（まだ記録なし）" : `直近100回の正答率　${acc}%`;
    html += `
    <div class="card menu-card kw-level-card ${ready?"":"disabled"}" ${ready?`onclick="startKanjiWrite('${l.key}')"`:""}>
      <div class="menu-icon">✍️</div>

    </div>`;
  });
  html += `<div class="btn-row"><button class="btn secondary" onclick="showHome()">ホームへ</button></div>`;
  screen.innerHTML = html;
}
let kw = null;
function startKanjiWrite(levelKey){
  kw = {level:levelKey, n:0, okCount:0, lastId:null, item:null, revealed:false};
  kwNextQuestion();
}
function kwNextQuestion(){
  kw.item = kwSelectOne(kw.level, kw.lastId);
  kw.lastId = kw.item.id;
  kw.revealed = false;
  kwRenderQuestion();
}
function kwRenderQuestion(){
  const it = kw.item;
  const levelDef = KANJI_WRITE_LEVELS.find(l => l.key === kw.level);
  let answerArea;
  if(!kw.revealed){
    answerArea = `<div class="btn-row"><button class="btn" onclick="kwReveal()">✅ 答えを見る</button></div>`;
  }else{
    const infoBlocks = it.chars.map(c => `
      <div class="kw-char-block">
        <h4>「${esc(c.ch)}」について</h4>
        ${c.onyomi ? `<div>音読み：${esc(c.onyomi)}</div>` : ""}
        ${c.kunyomi ? `<div>訓読み：${esc(c.kunyomi)}</div>` : ""}
        ${c.origin ? `<div>成り立ち：${esc(c.origin)}</div>` : ""}
        ${c.meaning ? `<div>漢字の意味：${esc(c.meaning)}</div>` : ""}
      </div>`).join("");
    answerArea = `
      <div class="kw-answer-box"><div class="kw-answer-kanji">${esc(it.kanji)}</div></div>
      <div class="kw-info-card">
        <h4>この言葉の意味</h4>
        <div style="margin-bottom:10px">${esc(it.wordMeaning)}</div>
        ${infoBlocks}
      </div>
      <div class="kw-selfjudge-row">
        <button class="kw-ok-btn" onclick="kwGrade(true)">⭕ 書けた！</button>
        <button class="kw-ng-btn" onclick="kwGrade(false)">❌ 書けなかった</button>
      </div>
      <div class="feedback" id="kwFb"></div>
      <div class="btn-row" id="kwNextRow" style="display:none">
        <button class="btn tap-advance-btn" id="kwNextBtn" onclick="kwNextQuestion()">次へ</button>
        <button class="btn secondary" onclick="kwEndSession()">今日はここまで</button>
      </div>`;
  }
  screen.innerHTML = `
    <div class="session-bar">
      <span>${kw.n+1}問目　｜　今回「書けた！」${kw.okCount}問</span>
      <span class="catstat">✍️ ${esc(levelDef.label)}</span>
    </div>
    <div class="card">
      <div class="q-category"><span>漢字の書き取り</span></div>
      <div class="kw-sentence">${markQuestionHtml(it.sentence)}</div>
      ${answerArea}
    </div>`;
}
function kwReveal(){
  kw.revealed = true;
  kwRenderQuestion();
}
function kwGrade(canWrite){
  kw.n++;
  if(canWrite) kw.okCount++;
  const r = kwRecord(kw.level, kw.item, canWrite);
  document.querySelectorAll(".kw-ok-btn, .kw-ng-btn").forEach(b => b.disabled = true);
  const fb = document.getElementById("kwFb");
  fb.className = "feedback show " + (canWrite?"ok":"ng");
  fb.innerHTML = `<div class="verdict">${canWrite?"⭕ 書けた！":"❌ また挑戦しよう"}</div>
    書き取りレベル Lv.${r.lv}　｜　このレベルの直近100回正答率　${r.acc===null?"ー":r.acc+"%"}`;
  document.getElementById("kwNextRow").style.display = "flex";
  document.getElementById("kwNextBtn").focus();
}
function kwEndSession(){
  const k = kw;
  window._retry = () => startKanjiWrite(k.level);
  screen.innerHTML = `
    <div class="card">
      <h3 class="section">今回の記録</h3>
      <div class="result-score">${k.okCount} <span style="font-size:1.2rem;color:var(--sub)">/ ${k.n}問 書けた！</span></div>
      <p class="result-msg">漢字の書き取り学習おつかれさま！</p>
      <div class="btn-row">
        <button class="btn" onclick="window._retry()">つづける</button>
        <button class="btn secondary" onclick="showKanjiWriteMenu()">レベルを選びなおす</button>
        <button class="btn secondary" onclick="showHome()">ホームへ</button>
      </div>
    </div>`;
}

/* ================= 小学生の漢字を復習する =================
   小学校で習う漢字（学年別漢字配当表、1026字）を全学年まとめた1つのプールから出題する。
   知識クイズの「適応的難度調整」（diffLv・difficultyWeight・CONFIRM_CHECK_RATE、selectOne参照）と
   まったく同じ仕組みを、分野レベルの代わりに漢字の「配当学年」(grade、1〜6)を難度の軸にして流用している
   （書けた！→目標レベルが少し上がる＝より上の学年の字が出やすくなる、書けなかった→少し下がる、
   CONFIRM_CHECK_RATEの確率でときどき全学年から均等にチェック出題する）。
   「漢字の書き学習」モードと同じく自己評価制（書けた！／書けなかった）で、経験値・「ことのは」の
   進化には一切影響させない（st.cats・st.lv・st.diffLv・kotonohaには一切触れない）。
   このモードのデータ（kanji_write_elem_data.js）には chars（音訓・成り立ち等の解説）を用意していない。
   教員の指示により、解説データがない問題は「答えを見る」画面で答えの漢字だけを大きく表示し、
   解説は付けない。 */
function kweData(){ return (window.KANJI_WRITE_ELEM_DATA) || []; }
const KWE_MAX_LV = 6;
function kweHistoryWeight(st, it){
  const h = st.kanjiWriteElem.itemHist[it.id];
  if(!h || h.t === 0) return 1.2;
  const wrong = h.t - h.c;
  const w = Math.pow(0.75, h.c) * Math.pow(1.5, wrong);
  return Math.max(0.05, Math.min(8, w));
}
function kweDifficultyWeight(it, diffLv){
  return Math.exp(-1.2 * Math.abs(it.grade - diffLv));
}
function kweSelectOne(lastId){
  const st = loadStats();
  let pool = kweData();
  if(pool.length > 1 && lastId) pool = pool.filter(it => it.id !== lastId);
  const isConfirmCheck = Math.random() < CONFIRM_CHECK_RATE;
  const diffLv = typeof st.kanjiWriteElem.targetLv === "number" ? st.kanjiWriteElem.targetLv : 1;
  const weights = pool.map(it => kweHistoryWeight(st, it) * (isConfirmCheck ? 1 : kweDifficultyWeight(it, diffLv)));
  return pickOne(pool, weights);
}
function kweAccuracy(st){
  const recent = st.kanjiWriteElem.recent || [];
  if(recent.length === 0) return null;
  return Math.round(100 * recent.reduce((a,b)=>a+b, 0) / recent.length);
}
function kweLv(st){ return 1 + (st.kanjiWriteElem.totalOk || 0); }
function kweGradeLabel(diffLv){
  const g = Math.round(Math.max(1, Math.min(KWE_MAX_LV, diffLv)));
  return "小学" + g + "年生くらい";
}
/* 自己評価を記録するだけの専用関数。record()は一切呼ばず、
   st.cats・st.lv・st.diffLv（＝経験値やことのはの進化に関わる値）には一切触れない。 */
function kweRecord(it, canWrite){
  const st = loadStats();
  maybeGrantDailyLogin(st);
  const h = st.kanjiWriteElem.itemHist[it.id] || {t:0, c:0};
  h.t++; if(canWrite) h.c++;
  st.kanjiWriteElem.itemHist[it.id] = h;
  if(canWrite) st.kanjiWriteElem.totalOk = (st.kanjiWriteElem.totalOk||0) + 1;
  const curDiff = typeof st.kanjiWriteElem.targetLv === "number" ? st.kanjiWriteElem.targetLv : 1;
  st.kanjiWriteElem.targetLv = canWrite
    ? Math.min(KWE_MAX_LV, curDiff + DIFF_LV_STEP)
    : Math.max(1, curDiff - DIFF_LV_STEP);
  ReviewSystem.onAnswer(st.kanjiWriteElem.itemHist, it.id, canWrite, it.grade, curDiff);
  const recent = (st.kanjiWriteElem.recent || []).slice();
  recent.push(canWrite ? 1 : 0);
  while(recent.length > 100) recent.shift();
  st.kanjiWriteElem.recent = recent;
  saveStats(st);
  return {lv: kweLv(st), acc: kweAccuracy(st), gradeLabel: kweGradeLabel(st.kanjiWriteElem.targetLv)};
}

/* ---- 画面：メニュー（学年別のレベル分けはせず、全学年ミックスの単一モード） ---- */

let kwe = null;
function startKanjiWriteElem(){

}
function kweNextQuestion(){
  const st = loadStats();
  const dueKey = ReviewSystem.getDueKey(st.kanjiWriteElem.itemHist, kwe.lastId);
  const due = dueKey ? kweData().find(it => it.id === dueKey) : null;
  if(due){

function kweGrade(canWrite){

/* ================= 百人一首 =================
   HYAKUNIN_ISSHU_DATA（小倉百人一首100首の構造化データ、hyakunin_isshu_data.js）を
   唯一の情報源として、①一覧モード（100首をカードでめくって読める）と
   ②クイズモード（自動採点の四択）を提供する。
   kanji_write/kanji_write_elemと同様、独立した自己完結モードとして実装しており、
   経験値・分野レベル・「ことのは」の進化・ボス戦・二人対戦には一切影響しない
   （st.cats・st.lv・st.diffLv・kotonohaには一切触れない）。ただしkanji_write系の
   自己評価制とは異なり、正誤は自動採点で判定する（選んだ選択肢と正解indexの一致で判定）。
   クイズ問題は1問ずつ手作業で用意するのではなく、100首の構造化データから複数の出題形式
   （上の句→下の句・上の句の決まり字→下の句・意味・表現技法・作者・出典）を自動生成する。
   こうすることで、100首のデータさえ正確なら出題内容も自動的に正確になり、
   生データとクイズデータを別々に二重管理するリスクを避けられる。
   「下の句→上の句を当てる」「上の句全体→下の句を当てる」の2形式は実質同じ問題になるため、
   前者(shimo2kami)は廃止し「上の句の決まり字→下の句」に差し替えた（教員の指示、2026-08-04）。
   決まり字はkanaフィールドから自動計算する（hyaKimarijiMap参照）。 */
function hiData(){ return window.HYAKUNIN_ISSHU_DATA || []; }
const HYAKUNIN_THEMES = ["春","夏","秋","冬","恋","その他"];
/* 出題形式ごとのlvは、①hyaGroups()での8問グループの並び順（昇順）、②hyaDifficultyWeightでの
   適応的難度調整の目標レベル、の両方を兼ねる。教員の指示（2026-08-04）で解放順を
   「上の句全体→上の句の決まり字→意味→表現技法→作者→出典」に再設計したため、6種類に
   1つずつ別のlvを割り当てて完全に順番どおりに並ぶようにしている（従来は2種類で1つのlvを
   共有し、大雑把な3段階「入門/中級/上級」の目安だけを表していた）。 */
const HYAKUNIN_MAX_LV = 6;
/* 出題形式の種類・順序・並べ方（HYAKUNIN_QTYPE_LV、hyaPool内のpush呼び出し等）を変えるたびに
   この値を1つ上げること。loadStats()側でst.hyakunin.poolVersionと比較し、古いセーブは
   st.groupUnlock.hyakunin（問題解放率のもと）をグループ1（ほぼ0%）へ強制的に巻き戻す
   （教員の指示、2026-08-04：「問題を挿入した場合には0%から再スタートする設計に」。
   「解放のお祝い」経験値は積み上げ方式（2026-08-23〜、totalUnlockCelebrationExp参照）なので、
   この解放率リセット自体で既に稼いだ経験値が減ることはない。そのうえで、リセット後に
   もう一度25/50/75/100%へ到達すればhyaRecord()がまた「新しく跨いだ」と判定するため、
   そのぶんもう一度お祝いされる）。 */
const HYAKUNIN_POOL_VERSION = 2;
const HYAKUNIN_QTYPE_LV = {kami2shimo:1, kimariji2shimo:2, meaning:3, technique:4, author:5, source:6};
const HYAKUNIN_QTYPE_INSTR = {
  kami2shimo:      "次の上の句に続く、正しい下の句を選んでください。",
  kimariji2shimo:  "次は、上の句の「決まり字」（読み上げられた時点でこの歌だと決まる最初の部分）です。続く下の句を選んでください。",
  author:          "次の歌の作者として正しいものを選んでください。",
  meaning:         "次の歌の意味として正しいものを選んでください。",
  source:          "次の歌の出典（のっている歌集）として正しいものを選んでください。",
  technique:       "この歌に使われている表現技法として、最もあてはまるものを選んでください。",
};
const HYAKUNIN_QTYPE_BADGE = {
  kami2shimo:"上の句→下の句", kimariji2shimo:"決まり字→下の句", author:"作者",
  meaning:"歌の意味", source:"出典", technique:"表現技法",
};
/* 表現技法名の読み方（一覧モードのタグ表示用）。技法名そのもの（p.technique配列の値）は
   クイズの正誤判定にそのまま文字列比較で使われるため、ふりがなを混ぜて表記を変えてはいけない。
   表示のときだけ、このテーブルを見て「掛詞（かけことば）」のように読みを添える。 */
const HYAKUNIN_TECHNIQUE_READING = {
  "枕詞":"まくらことば", "掛詞":"かけことば", "序詞":"じょことば", "体言止め":"たいげんどめ",
  "擬人法":"ぎじんほう", "対句":"ついく", "倒置法":"とうちほう", "縁語":"えんご",
  "係り結び":"かかりむすび", "比喩":"ひゆ", "本歌取り":"ほんかどり",
};
function hyaTechniqueTagHtml(t){
  const r = HYAKUNIN_TECHNIQUE_READING[t];
  return `<span class="tag">${esc(t)}${r?`（${esc(r)}）`:""}</span>`;
}
function hyaFullPoem(p){ return p.kaminoku + "　" + p.shimonoku; }
/* 表現技法がある歌は、通常の全文の代わりに《》つきのマーク済みテキストを使う。
   markQuestionHtml()が《》を強調表示に変換するため、hyaExplainの戻り値は
   esc()ではなくmarkQuestionHtml()を通して描画すること（hyaAnswerChoice参照）。 */
function hyaFullPoemMarked(p){
  const hasMark = p.technique && p.technique.length && (p.kaminokuMarked || p.shimonokuMarked);
  return hasMark ? `${p.kaminokuMarked || p.kaminoku}　${p.shimonokuMarked || p.shimonoku}` : hyaFullPoem(p);
}
function hyaExplain(p){
  const authorLine = p.author + (p.authorKana?`（${p.authorKana}）`:"") + (p.authorGender?`・${p.authorGender}`:"");
  const sourceLine = p.source + (p.sourceYear?`（${p.sourceYear}）`:"");
  const kanaLine = p.kana ? `（${p.kana}）\n` : "";
  /* 表現技法の《》強調（kaminokuMarked/shimonokuMarked）だけでは「どの部分が・何という技法か」が
     太字で示されるだけなので、言葉による説明(techniqueDetail)もあわせて載せる。highlightは
     「なぜこの歌が評価されているか・どんな背景で詠まれたか」の知識（一覧モードでは既に表示済み
     だったが、クイズの解説には含まれていなかった）。教員の指示（2026-07-30）で追加。 */
  const techLine = (p.technique && p.technique.length && p.techniqueDetail) ? `\n表現技法：${p.techniqueDetail}` : "";
  const highlightLine = p.highlight ? `\nこの歌が評価されているところ：${p.highlight}` : "";
  return `${p.no}番　${hyaFullPoemMarked(p)}\n${kanaLine}作者：${authorLine}　｜　出典：${sourceLine}\n${p.meaning}${techLine}${highlightLine}`;
}
/* 「決まり字」（読み上げを聞いた時点で、他の99首と区別がつく最初の部分）を、100首の読み(kana)から
   自動計算する。歌かるたの決まり字は表記ではなく音（読み）で決まるため、比較には歴史的仮名遣いを
   実際の発音に正規化した文字列を使うが、実際に画面へ表示する文字列は正規化前（原文どおり）の
   ひらがなを使う（正規化は文字数を変えない置き換えのみ＝を→お・ゐ→い・ゑ→え・あふ→おお・
   おほ→おおなので、同じ文字数だけ原文から切り出せば表示と比較判定がずれない）。
   この3種の正規化規則だけで、実際の競技かるたの決まり字数の公式分布（1字7・2字42・3字37・
   4字6・5字2・6字6首）と完全一致することをNode.jsで検証済み（1字決まりの7首「むすめふさほせ」も
   一致）。 */
let _hyaKimarijiCache = null;
function hyaKamiKana(p){ return (p.kana||"").split("　").slice(0,3).join(""); }
function hyaNormalizeKana(s){
  return s.replace(/あふ/g,"おお").replace(/おほ/g,"おお").replace(/を/g,"お").replace(/ゐ/g,"い").replace(/ゑ/g,"え");
}
function hyaKimarijiMap(){
  if(_hyaKimarijiCache) return _hyaKimarijiCache;
  const poems = hiData();
  const kamis = poems.map(hyaKamiKana);
  const norms = kamis.map(hyaNormalizeKana);
  const map = {};
  poems.forEach((p,i)=>{
    let L = 1;
    while(L < norms[i].length){
      const pre = norms[i].slice(0,L);
      const clash = norms.some((n,j) => j!==i && n.slice(0,L)===pre);
      if(!clash) break;
      L++;
    }
    map[p.no] = kamis[i].slice(0, L);
  });
  _hyaKimarijiCache = map;
  return map;
}
function hyaKimariji(p){ return hyaKimarijiMap()[p.no] || hyaKamiKana(p); }
/* poolの中からcorrect以外をn個、重複なくランダムに選ぶ。足りなければnullを返す（出題を作らない） */
function hyaDistractors(pool, correct, n){
  const cand = [];
  const seen = new Set([correct]);
  const order = shuffledOrder(pool.length);
  for(const i of order){
    const v = pool[i];
    if(seen.has(v)) continue;
    seen.add(v); cand.push(v);
    if(cand.length >= n) break;
  }
  return cand.length >= n ? cand : null;
}
let _hyakuninPool = null;
/* 出題プールは初回アクセス時に1度だけ構築してキャッシュする（100首は固定データなので、
   セッション中に変わることはない。qKey相当の識別子は「歌番号+出題形式」で固定なので、
   選択肢の並びや誤答の組み合わせが毎回変わっても、正誤履歴（itemHist）は正しく積み上がる）。 */
function hyaPool(){
  if(_hyakuninPool) return _hyakuninPool;
  const poems = hiData();
  const items = [];
  if(poems.length >= 5){
    const allShimo = poems.map(p=>p.shimonoku);
    const allAuthors = [...new Set(poems.map(p=>p.author))];
    const allMeanings = poems.map(p=>p.meaning);
    const allSources = [...new Set(poems.map(p=>p.source))];
    const allTechniques = [...new Set(poems.flatMap(p=>p.technique||[]))];
    poems.forEach(p=>{
      const push = (qType, q, correct, pool) => {
        const ds = hyaDistractors(pool, correct, 3);
        if(!ds) return;
        const order = shuffledOrder(4);
        const opts = [correct, ...ds];
        const c = order.map(i => opts[i]);
        items.push({
          id: p.no + "_" + qType, qType, poemNo:p.no, lv:HYAKUNIN_QTYPE_LV[qType],
          instr:HYAKUNIN_QTYPE_INSTR[qType], q, c, a:c.indexOf(correct), e:hyaExplain(p),
        });
      };
      push("kami2shimo", p.kaminoku, p.shimonoku, allShimo);
      push("kimariji2shimo", hyaKimariji(p) + "……", p.shimonoku, allShimo);
      push("meaning", hyaFullPoem(p), p.meaning, allMeanings);
      push("author", hyaFullPoem(p), p.author, allAuthors);
      push("source", hyaFullPoem(p), p.source, allSources);
      /* 技法の誤答選択肢は、その歌が実際に持つ技法（p.technique）を全て除いたプールから選ぶ。
         「枕詞・掛詞・体言止め」のように1首に複数の技法がある歌で、正解にしなかった側の技法
         （例：掛詞）を誤答として出してしまうと、実は誤答も「合っている」ことになり
         正解が一意に定まらなくなるため（[[kokugo-drill-dx-workflow]]のkobun/hinshiの教訓と同種）。 */
      const techPoolForThisPoem = allTechniques.filter(t => !(p.technique||[]).includes(t));
      if((p.technique||[]).length > 0 && techPoolForThisPoem.length >= 3){
        push("technique", hyaFullPoem(p), p.technique[0], techPoolForThisPoem);
      }
    });
  }
  _hyakuninPool = items;
  return items;
}

/* ================= 段階的アンロック（ジャンル非依存の汎用判定＋百人一首固有部分） =================
   「対象キー群のうちquorum個以上がstreakThreshold回以上連続正解」かつ「直近の正答率(recentWindow)
   がaccThreshold以上」の両方を満たしたら次のグループを解禁してよい、という判定だけを行う汎用エンジン。
   グループの定義方法（決まり字・頻度ランクなど）や進捗の保存場所はジャンル側の責務（将来、他ジャンルにも
   同じ判定ロジックを再利用できるようにするための最小限の分離。過度な抽象化はしない）。
   2026-08-05〜：教員とのシミュレーション検証を経て、以下2点を変更。
   ①「8問全て」→「quorum個以上」に緩和（8問同時にstreakThreshold回以上を要求すると、実力が
   ちょうど境界あたり(グループ内の実質的な正答率が7〜8割弱程度)の生徒では、統計的にほぼ揃わず
   長時間詰まるリスクがあった。詳細は[[kokugo-drill-dx-workflow]]参照）。
   ②正答率の判定を「そのグループの全期間累計(t,c)」→「そのグループに対する直近N問(recentWindow)」
   に変更。累計だと、実力が長期的にaccThreshold未満の生徒は大数の法則で理論上永久に到達不可能に
   なってしまう（後から実力が伸びても、初期の不正解が累計を汚したままなので救われない）。直近N問なら
   古い不正解が窓から外れていくので、後から実力が伸びれば追いつける。 */
const UnlockEngine = {
  isGroupCleared(unitKeys, streakMap, recentWindow, streakThreshold, accThreshold, quorum){
    const streakedCount = unitKeys.reduce((n,k) => n + ((streakMap[k]||0) >= streakThreshold ? 1 : 0), 0);
    if(streakedCount < quorum) return false;
    if(!recentWindow || recentWindow.length === 0) return false;
    return (recentWindow.reduce((a,b)=>a+b,0) / recentWindow.length) >= accThreshold;
  }
};

/* ================= 20分野クイズの8問グループ化（段階的アンロック、2026-08-01〜） =================
   20分野側はすでにst.q（qKey単位の出題履歴、{t,c,k,...}）に「連続正解数(k)」「出題数/正解数(t/c)」
   が問題単位でそのまま蓄積されているため、専用の記録を新設する必要がない。st.groupUnlockは
   ジャンルごとの「解禁済みグループ数」という整数1つだけを持つ、最小限のデータ構造にしている。
   百人一首は出題プールの生成方法（hyaPool、後述）が大きく異なるため、同じGROUP_SIZE等の定数と
   UnlockEngineを流用しつつ、hyaGroups系として個別に実装している（決まり字グループ方式(旧、
   2026-07-31〜)からの移行、2026-08-01〜）。 */
const GROUP_SIZE = 8;
const GROUP_UNLOCK_STREAK = 2;   // 2026-08-05〜：3→2に緩和（下のGROUP_UNLOCK_QUORUMの変更とセット）
const GROUP_UNLOCK_QUORUM = 6;   // 2026-08-05〜：GROUP_SIZE(8問)中、streak要件を満たす必要がある最低数
const GROUP_UNLOCK_ACC = 0.8;
const GROUP_RECENT_WINDOW = 30;  // 2026-08-05〜：正答率判定を、そのグループへの直近この件数の解答で見る（全期間累計ではない）
/* 高速解放モード（2026-08-02〜、教員の指示）。漢字の読み(5489問・687グループ)のように問題数が
   極端に多いジャンルだと、実力的には簡単すぎる生徒でも「8問ずつ・各問3連続正解」という通常の
   グループ判定に律儀に付き合わされ、解放のペースが遅くストレスになる。直近30問（st.recentCorrect、
   RECENT_ACC_WINDOWと共通）のミスがFAST_UNLOCK_MAX_MISSES問以下（＝29/30問=約96.7%以上、
   教員の指示「97%程度」）に収まっている間は、通常のグループ判定を経由せず正解するたびに
   1グループずつ即座に解放する。新規プレイヤー（recentCorrectが空）も「まだ間違えていない」
   として対象に含む（教員の指示「完全にスタート」）。2問以上ミスが直近30問に混ざった時点で
   自動的に通常の3連続正解方式に戻り、また直近30問のミスが1問以下に収まれば高速解放を再開する
   （specific window/しきい値はいずれもrecord()側で毎回その場で判定するだけで、専用の状態は
   持たない）。「素早く適当に答える」検知(fastGuess)中は対象外にする（既存のfastGuess抑制と
   同じ趣旨で、ここだけ無防備な抜け道にしないため。30問連続正解を偶然だけで満たすのは統計的に
   ほぼ不可能だが、fastGuessは「よく考えずに機械的に選び続けて偶然通ってしまう」ケースを

const FAST_UNLOCK_RECENT_WINDOW = 30; // st.recentCorrectのRECENT_ACC_WINDOWと同じ窓を使う想定
const FAST_UNLOCK_MAX_MISSES = 1;     // 直近30問のうち、ここまでのミスは高速解放の対象に含める
function fastUnlockEligible(st, cat){
  const recent = (st.recentCorrect && st.recentCorrect[cat]) || [];
  const misses = recent.reduce((n,v) => n + (v ? 0 : 1), 0);
  return misses <= FAST_UNLOCK_MAX_MISSES;

/* 段階的アンロックの対象ジャンル。品詞(hinshi)でのパイロット動作確認（vmハーネスでの

const GROUP_UNLOCK_CATS = CAT_KEYS;

   kanji_yomi/okurigana/busyu/jukugo/taigigo/ruigigo/yoji/kotowaza/kanyoku/koji/keigo/

   （76問が復旧後になく217問が現在にしかない）機械的な復旧が危険なため対象外とし、
   yojiは復旧後の105問に、事故後に追加された記述式40問（8ccd6b7）をマージして145問にした。
   影響した全ジャンルのバージョンを一律1に設定し、問題解放率を強制リセットする
   （教員の指示「問題を挿入した場合には0%から再スタートする設計に」を踏襲）。 */
const CAT_POOL_VERSION = {
  kanbun: 4, shikibetsu: 2,
  kanji_yomi: 1, okurigana: 1, busyu: 1, jukugo: 1, taigigo: 1, ruigigo: 1,
  yoji: 1, kotowaza: 1, kanyoku: 1, koji: 1, keigo: 1, hinshi: 1, katsuyo: 1,
  kobun: 1, kanazukai: 1, kigo: 1, hyougen: 1,
};
let _catGroupsCache = {};
/* 各ジャンルの問題を8問ずつの小グループに分割する。既存のlv（難易度）フィールドの昇順で並べ、
   同lv内はデータ配列の元の順序を保つ（＝難易度が近い問題同士がまとまる）。端数は最終グループが
   8問未満のまま許容する。百人一首と同じく、データファイル側は変更せず起動時に動的計算する
   （問題文が変わらない限りグループ所属も変わらない想定だが、kokugo_data.jsの編集で
   グループ境界がずれる可能性はある）。 */
function catGroups(cat){
  if(_catGroupsCache[cat]) return _catGroupsCache[cat];
  const sorted = CATS[cat].items
    .map((it, idx) => ({it, idx}))
    .sort((a,b) => (a.it.lv - b.it.lv) || (a.idx - b.idx));
  const groups = [];
  for(let i=0;i<sorted.length;i+=GROUP_SIZE){
    const chunk = sorted.slice(i, i+GROUP_SIZE);
    /* indices: プール判定（groupUnlockedPool）に使う、データ配列上の位置そのもの。
       keys: 出題履歴st.qの参照に使うqKey(cat,q)。一部ジャンル（例：品詞の「長い」「だから」等
       8組）に問題文が完全一致する別項目が存在し、qKeyだけでは項目を一意に区別できないため、
       プールの所属判定には必ずindicesを使う（keysで判定すると、同じ問題文を持つ別グループの
       項目まで誤って混入する）。st.q側はもともと問題文単位で記録される既存の仕様上、
       これら重複ペアは元々1つの履歴を共有する（この機能が新たに生んだ挙動ではない）。 */
    groups.push({level: groups.length+1, indices: chunk.map(x => x.idx), keys: chunk.map(x => qKey(cat, x.it.q))});
  }
  _catGroupsCache[cat] = groups;
  return groups;
}
function catUnlockedGroupCount(st, cat){
  return (st.groupUnlock && st.groupUnlock[cat]) || 1;
}
/* 「総問題数のうち何%が解放されているか」（成績画面表示用、2026-08-02〜）。最終グループは
   8問に満たないことがあるため、グループ数の比率ではなく実際の問題数（indices.length）を
   積み上げて計算する。GROUP_UNLOCK_CATS対象外のジャンル（読解など）はnullを返す。 */
function catUnlockedQuestionPct(st, cat){
  if(!GROUP_UNLOCK_CATS.includes(cat)) return null;
  const groups = catGroups(cat);
  const totalQ = CATS[cat].items.length;
  if(totalQ === 0) return null;
  const n = Math.min(catUnlockedGroupCount(st, cat), groups.length);
  let unlockedQ = 0;
  for(let i=0;i<n;i++) unlockedQ += groups[i].indices.length;
  return Math.round(unlockedQ / totalQ * 100);
}
/* 現在解禁済みのグループだけを含む出題プール（累積的・不可逆：既習グループは出題プールから
   外さない＝忘却防止）。GROUP_UNLOCK_CATS対象外のジャンルは、これまでどおり全問題がプール。 */
function groupUnlockedPool(st, cat){
  if(!GROUP_UNLOCK_CATS.includes(cat)) return CATS[cat].items;
  const groups = catGroups(cat);
  const n = Math.min(catUnlockedGroupCount(st, cat), groups.length);
  const allowedIdx = new Set();
  for(let i=0;i<n;i++) groups[i].indices.forEach(idx => allowedIdx.add(idx));
  return CATS[cat].items.filter((it, idx) => allowedIdx.has(idx));
}
/* 今まさにアンロックの最前線になっているグループ（8問）だけの出題プール。高速解放モード中は
   selectOne/hyaSelectOneがgroupUnlockedPool（解禁済み全問題）の代わりにこちらを使う
   （教員の指示、2026-08-04：「連続解放モードの時は、必ず新しく解放した8問の中から1問
   ランダムで出されるようにして。既存の問題を正解することでどんどん開放することを防ぐ意図」）。
   高速解放モードは「正解するたびに次のグループが即座に解禁される」設計なので、この関数が
   毎回参照する「最前線グループ」自体も出題のたびに先へ進んでいく。既に全解禁済みのジャンル
   （もう「これから解放する」グループが存在しない）は、制限する意味が無いためnullを返し、
   呼び出し側が通常のgroupUnlockedPoolにフォールバックする。 */
function activeGroupPool(st, cat){
  if(!GROUP_UNLOCK_CATS.includes(cat)) return null;
  const groups = catGroups(cat);
  const count = catUnlockedGroupCount(st, cat);
  if(count >= groups.length) return null;
  return groups[count - 1].indices.map(i => CATS[cat].items[i]);
}
/* 現在アクティブなグループの解禁条件（8問中GROUP_UNLOCK_QUORUM問以上がGROUP_UNLOCK_STREAK回以上
   連続正解 かつ そのグループへの直近GROUP_RECENT_WINDOW問の正答率がGROUP_UNLOCK_ACC以上）を
   満たしていれば、unlockedGroupCountを1つ進める。record()内、st.recentCorrect/fastGuessの
   確定後に呼ぶ（fastUnlockEligible判定にst.recentCorrect[cat]の最新状態が要るため）。
   streakはst.qからその場で導出するだけで専用の記録を持たないが、正答率だけは「そのグループの
   問題に対する解答か」を問わないと直近N問を数えられないため、st.groupRecent[cat]という専用の
   ローリング窓を新設した（2026-08-05〜）。グループが進むたびにリセットする（前のグループの
   出来が次のグループの判定に影響しないように）。
   item：今回答えた問題（st.groupRecentの更新に使う）。correct/fastGuessは、高速解放モード
   （上のFAST_UNLOCK_*参照）の判定にも使う。 */
function checkGroupUnlock(st, cat, item, correct, fastGuess){
  if(!GROUP_UNLOCK_CATS.includes(cat)) return false;
  const groups = catGroups(cat);
  const idx = catUnlockedGroupCount(st, cat) - 1;
  if(idx >= groups.length - 1) return false; // 既に全解禁
  const cur = groups[idx];
  if(cur.keys.includes(qKey(cat, item.q))){
    if(!st.groupRecent) st.groupRecent = {};
    const rec = (st.groupRecent[cat] || []).slice();
    rec.push(correct ? 1 : 0);
    while(rec.length > GROUP_RECENT_WINDOW) rec.shift();
    st.groupRecent[cat] = rec;
  }
  if(correct && !fastGuess && fastUnlockEligible(st, cat)){
    if(!st.groupUnlock) st.groupUnlock = {};
    st.groupUnlock[cat] = catUnlockedGroupCount(st, cat) + 1;
    if(st.groupRecent) st.groupRecent[cat] = [];
    return true;
  }
  const streakMap = {};
  cur.keys.forEach(k => { const rec = st.q[k]; streakMap[k] = rec ? (rec.k||0) : 0; });
  const recentWindow = (st.groupRecent && st.groupRecent[cat]) || [];
  if(UnlockEngine.isGroupCleared(cur.keys, streakMap, recentWindow, GROUP_UNLOCK_STREAK, GROUP_UNLOCK_ACC, GROUP_UNLOCK_QUORUM)){
    if(!st.groupUnlock) st.groupUnlock = {};
    st.groupUnlock[cat] = catUnlockedGroupCount(st, cat) + 1;
    st.groupRecent[cat] = [];
    return true;
  }
  return false;
}
/* 移行ロジック（2026-08-01〜）：段階的アンロック導入より前からの生徒の既存正誤履歴(st.q)から、
   「実質どこまでのグループを習得済みか」を一回限り算出し、unlockedGroupCountの初期値にする
   （全員グループ1からやり直しにはしない、教員の指示。分野レベルst.lvには一切触れない）。
   判定基準は新規アンロック基準よりやや緩め：グループ内正答率80%以上 かつ 8問中6問以上が
   現在連続正解中(k>=1)。先頭のグループから連続してこの基準を満たす数だけ、
   最初から解禁済みとみなす（満たさないグループに達したら打ち切り）。 */
function migrateInitialGroupUnlock(st, cat){
  const groups = catGroups(cat);
  let n = 0;
  for(const g of groups){
    let t = 0, c = 0, streaked = 0;
    g.keys.forEach(k => {
      const rec = st.q[k];
      if(rec){ t += rec.t; c += rec.c; if((rec.k||0) >= 1) streaked++; }
    });
    const accOk = t > 0 && (c / t) >= GROUP_UNLOCK_ACC;
    const streakOk = streaked >= Math.ceil(g.keys.length * 0.75);
    if(accOk && streakOk) n++; else break;
  }
  return Math.max(1, Math.min(groups.length, n + 1));
}

/* ================= 百人一首の8問グループ化（段階的アンロック、2026-08-01〜） =================
   20分野と同じGROUP_SIZE/GROUP_UNLOCK_STREAK/GROUP_UNLOCK_ACC・UnlockEngineを流用するが、
   百人一首の出題プール（hyaPool）は20分野のCATS[cat].itemsと違って起動時に動的生成され、
   各itemが元からid（歌番号+出題形式、例:"3_kami2shimo"）で一意なので、20分野のcatGroupsのように
   indices/keysを分けて持つ必要がない（qKeyの文字列ハッシュも使わない。同じ歌から生成される
   author/meaning/source/technique4問はhyaFullPoem(p)＝上下句を問題文に使うため、20分野のqKey方式
   だと問題文が完全一致して衝突するが、idはqTypeを含むので衝突しない）。既存の決まり字グループ方式
   （旧、2026-07-31〜。首単位でグループ化し、専用にpoemStreak/groupProgressを記録していた）は
   このジャンル非依存の8問グループ方式に統一するため撤去した。 */
let _hyaGroupsCache = null;
function hyaGroups(){
  if(_hyaGroupsCache) return _hyaGroupsCache;
  const sorted = hyaPool()
    .map((it, idx) => ({it, idx}))
    .sort((a,b) => (a.it.lv - b.it.lv) || (a.idx - b.idx));
  const groups = [];
  for(let i=0;i<sorted.length;i+=GROUP_SIZE){
    groups.push({level: groups.length+1, ids: sorted.slice(i, i+GROUP_SIZE).map(x => x.it.id)});
  }
  _hyaGroupsCache = groups;
  return groups;
}
function hyaUnlockedGroupCount(st){
  return (st.groupUnlock && st.groupUnlock.hyakunin) || 1;
}
/* catUnlockedQuestionPctの百人一首版（成績画面表示用、2026-08-02〜）。 */
function hyaUnlockedQuestionPct(st){
  const groups = hyaGroups();
  const totalQ = hyaPool().length;
  if(totalQ === 0) return null;
  const n = Math.min(hyaUnlockedGroupCount(st), groups.length);
  let unlockedQ = 0;
  for(let i=0;i<n;i++) unlockedQ += groups[i].ids.length;
  return Math.round(unlockedQ / totalQ * 100);
}
/* 「問題全開放のお祝い」経験値（2026-08-03〜、教員の指示）。ジャンルごとの問題解放率
   （catUnlockedQuestionPct/hyaUnlockedQuestionPct）が25/50/75/100%に達した段階で、それぞれ
   固定の経験値を加算する。
   2026-08-23〜：以前は加算済みフラグや累計カウンタを持たず、totalEarnedStatPoints/
   kotonohaTotalXP側から呼ばれるたびに現在の解放率からその場で導出し直す方式だったが、
   CAT_POOL_VERSIONによる問題解放率の強制リセット（loadStats()参照）と組み合わさると、

   （その場計算なので、解放率が下がればボーナスも即座に下がる）。そこで教員の指示により、
   record()/hyaRecord()内でcrossedUnlockMilestonesが「今回新しく跨いだ」と判定した瞬間に
   一度だけst.unlockBonusEarned[cat]へ積み上げる方式に変更した。CAT_POOL_VERSIONによる
   リセットが起きてもこの積み上げ分は減らないため経験値は後退しない。かつ、リセット後に
   もう一度同じマイルストーンへ到達すればまた「新しく跨いだ」と判定されるので、そのぶん
   もう一度加算される（教員の指示：「早く解放しておくほど、あとで問題を追加・修正した
   ときにまたボーナスを確認できる」ようにしたい、とのことでこの二重加算をあえて許容する。
   通常運用ではpctは単調増加するため同じマイルストーンを二重に跨ぐことはない）。
   totalUnlockCelebrationExpは、この積み上げ済みの値の合計を返すだけになった

const UNLOCK_CELEBRATION_MILESTONES = [
  {pct:25, exp:10}, {pct:50, exp:50}, {pct:75, exp:10}, {pct:100, exp:100},
];
function unlockCelebrationExpForPct(pct){
  if(pct == null) return 0;
  return UNLOCK_CELEBRATION_MILESTONES.reduce((sum,m) => sum + (pct >= m.pct ? m.exp : 0), 0);
}
function totalUnlockCelebrationExp(st){
  const earned = st.unlockBonusEarned || {};
  const perCat = GROUP_UNLOCK_CATS.reduce((s,cat) => s + (earned[cat]||0), 0);
  return perCat + (earned.hyakunin||0);
}
/* グループが新たに解禁された直後（record()/hyaRecord()内）に、解禁前後の解放率を比べて、
   このグループ解禁ぶんで新しく跨いだマイルストーンだけを返す（お祝い演出の表示専用。
   実際の経験値への反映は上のtotalUnlockCelebrationExpが毎回その場で計算するので、ここで
   加算処理をする必要はない）。1グループの解禁で複数のマイルストーンを一度に跨ぐこともある
   （問題数が少ないジャンルほど1グループの解放率への影響が大きいため）。 */
function crossedUnlockMilestones(pctBefore, pctAfter){
  if(pctAfter == null) return [];
  const before = pctBefore == null ? -1 : pctBefore;
  return UNLOCK_CELEBRATION_MILESTONES.filter(m => before < m.pct && pctAfter >= m.pct);
}
function celebrateMilestoneHtml(genreName, milestones){
  if(!milestones || milestones.length === 0) return "";

}
/* 出題画面の下部に常に表示する「問題解放率」フッター（2026-08-02〜、教員の指示：成績画面だけ
   でなく、実際に問題を解いている最中も常に見える位置に出してほしい）。pctがnullなら何も返さない

  </div><div class="unlock-footer-spacer"></div>`;
}
/* 現在解禁済みのグループだけを含む出題プール。累積的・不可逆：一度解禁したグループは、
   以後正答率が下がっても再ロックされない（20分野のgroupUnlockedPoolと同じ方針）。 */
function hyaUnlockedPool(st){
  const groups = hyaGroups();
  const n = Math.min(hyaUnlockedGroupCount(st), groups.length);
  const allowedIds = new Set();
  for(let i=0;i<n;i++) groups[i].ids.forEach(id => allowedIds.add(id));
  return hyaPool().filter(it => allowedIds.has(it.id));
}
/* 20分野のactiveGroupPoolと同じ考え方の百人一首版（教員の指示、2026-08-04）。高速解放モード中は
   hyaSelectOneがhyaUnlockedPool（解禁済み全問題）の代わりにこちらを使い、常に「今アンロックの
   最前線になっている8問」からランダムに出題する。既に全解禁済みならnullを返し、制限しない。 */
function hyaActiveGroupPool(st){
  const groups = hyaGroups();
  const count = hyaUnlockedGroupCount(st);
  if(count >= groups.length) return null;
  const ids = new Set(groups[count - 1].ids);
  return hyaPool().filter(it => ids.has(it.id));
}
/* ReviewSystem.getDueKeyへ渡すhistMap自体を、今アンロックされている首だけに絞り込んだビュー。
   ReviewSystem本体は変更しない：これにより、ロック中の首は（既存のitemHistに間隔反復の記録が
   残っていても）復習にも一切出さない。 */
function hyaVisibleHist(st){
  const unlockedIds = new Set(hyaUnlockedPool(st).map(it => it.id));
  const out = {};
  Object.keys(st.hyakunin.itemHist).forEach(k => { if(unlockedIds.has(k)) out[k] = st.hyakunin.itemHist[k]; });
  return out;
}
/* 20分野側の高速解放モード（FAST_UNLOCK_*、checkGroupUnlock参照）の百人一首版（2026-08-02〜、
   教員の指示：「百人一首にも搭載されているか」との確認を受けて未実装と判明し追加）。
   st.hyakunin.recentは20分野のst.recentCorrectと違って直近100問ぶん保持しているが、しきい値は
   20分野と揃えるため直近30問（FAST_UNLOCK_RECENT_WINDOW）だけを見る。百人一首クイズ
   （hyaRecord）には20分野のfastGuess相当の「素早く適当に答える」検知が存在しないため、
   ここではfastGuessによるガードはかけない（30問連続正解を偶然だけで満たすのは統計的に
   ほぼ不可能なため、fastGuessなしでも実用上のリスクは小さいと判断）。 */
function hyaFastUnlockEligible(st){
  const recent = ((st.hyakunin && st.hyakunin.recent) || []).slice(-FAST_UNLOCK_RECENT_WINDOW);
  const misses = recent.reduce((n,v) => n + (v ? 0 : 1), 0);
  return misses <= FAST_UNLOCK_MAX_MISSES;
}
/* 現在アクティブなグループの解禁条件（8問中GROUP_UNLOCK_QUORUM問以上がGROUP_UNLOCK_STREAK回以上
   連続正解 かつ そのグループへの直近GROUP_RECENT_WINDOW問の正答率がGROUP_UNLOCK_ACC以上）を
   満たしていれば、st.groupUnlock.hyakuninを1つ進める。hyaRecord内、st.hyakunin.recent更新の
   直後に呼ぶ（hyaFastUnlockEligible判定にst.hyakunin.recentの最新状態が要るため）。
   streakはitemHistからその場で導出するだけだが、正答率は20分野側と同じ理由でst.hyaGroupRecent
   という専用のローリング窓を新設した（2026-08-05〜、詳細はcheckGroupUnlockのコメント参照）。
   idは今回答えた首（st.hyaGroupRecentの更新に使う）。correctは、高速解放モードの判定にも使う。 */
function hyaCheckGroupUnlock(st, id, correct){
  const groups = hyaGroups();
  const idx = hyaUnlockedGroupCount(st) - 1;
  if(idx >= groups.length - 1) return false; // 既に全解禁
  const cur = groups[idx];
  if(cur.ids.includes(id)){
    if(!st.hyaGroupRecent) st.hyaGroupRecent = [];
    const rec = st.hyaGroupRecent.slice();
    rec.push(correct ? 1 : 0);
    while(rec.length > GROUP_RECENT_WINDOW) rec.shift();
    st.hyaGroupRecent = rec;
  }
  if(correct && hyaFastUnlockEligible(st)){
    if(!st.groupUnlock) st.groupUnlock = {};
    st.groupUnlock.hyakunin = hyaUnlockedGroupCount(st) + 1;
    st.hyaGroupRecent = [];
    return true;
  }
  const streakMap = {};
  cur.ids.forEach(itemId => { const rec = st.hyakunin.itemHist[itemId]; streakMap[itemId] = rec ? (rec.k||0) : 0; });
  const recentWindow = st.hyaGroupRecent || [];
  if(UnlockEngine.isGroupCleared(cur.ids, streakMap, recentWindow, GROUP_UNLOCK_STREAK, GROUP_UNLOCK_ACC, GROUP_UNLOCK_QUORUM)){
    st.hyaGroupRecent = [];
    if(!st.groupUnlock) st.groupUnlock = {};
    st.groupUnlock.hyakunin = hyaUnlockedGroupCount(st) + 1;
    return true;
  }
  return false;
}
/* 移行ロジック（2026-08-01〜）：決まり字グループ方式（旧）からの切り替えにあたり、既存プレイヤーの
   itemHist（過去の正誤記録）から「実質どこまでのグループを習得済みか」を一回限り算出し、
   st.groupUnlock.hyakuninの初期値にする（全員グループ1からやり直しにはしない）。判定基準は
   migrateInitialGroupUnlockと同じ：グループ内正答率80%以上 かつ 8問中6問以上が現在連続正解中(k>=1)。 */
function migrateInitialHyaGroupUnlock(st){
  const groups = hyaGroups();
  let n = 0;
  for(const g of groups){
    let t = 0, c = 0, streaked = 0;
    g.ids.forEach(id => {
      const rec = st.hyakunin.itemHist[id];
      if(rec){ t += rec.t; c += rec.c; if((rec.k||0) >= 1) streaked++; }
    });
    const accOk = t > 0 && (c / t) >= GROUP_UNLOCK_ACC;
    const streakOk = streaked >= Math.ceil(g.ids.length * 0.75);
    if(accOk && streakOk) n++; else break;
  }
  return Math.max(1, Math.min(groups.length, n + 1));
}

function hyaHistoryWeight(st, it){
  const h = st.hyakunin.itemHist[it.id];
  if(!h || h.t === 0) return 1.2;
  const wrong = h.t - h.c;
  const w = Math.pow(0.75, h.c) * Math.pow(1.5, wrong);
  return Math.max(0.05, Math.min(8, w));
}
function hyaDifficultyWeight(it, diffLv){
  return Math.exp(-1.2 * Math.abs(it.lv - diffLv));
}
function hyaSelectOne(lastId){
  const st = loadStats();
  let pool = hyaFastUnlockEligible(st) ? (hyaActiveGroupPool(st) || hyaUnlockedPool(st)) : hyaUnlockedPool(st);
  if(pool.length > 1 && lastId) pool = pool.filter(it => it.id !== lastId);
  const isConfirmCheck = Math.random() < CONFIRM_CHECK_RATE;
  const diffLv = typeof st.hyakunin.targetLv === "number" ? st.hyakunin.targetLv : 1;
  const weights = pool.map(it => hyaHistoryWeight(st, it) * (isConfirmCheck ? 1 : hyaDifficultyWeight(it, diffLv)));
  return pickOne(pool, weights);
}
function hyaAccuracy(st){
  const recent = st.hyakunin.recent || [];
  if(recent.length === 0) return null;
  return Math.round(100 * recent.reduce((a,b)=>a+b, 0) / recent.length);
}
function hyaLv(st){ return 1 + (st.hyakunin.totalOk || 0); }
function hyaLvLabel(diffLv){
  const g = Math.round(Math.max(1, Math.min(HYAKUNIN_MAX_LV, diffLv)));
  return ["かるた入門（上の句→下の句）", "決まり字（上の句の決まり字→下の句）", "意味", "表現技法", "作者", "出典"][g-1];
}
/* 自動採点だが、record()は呼ばずst.hyakunin専用の記録だけを行う（分野レベルst.lvには一切触れない。
   経験値st.hyakuninBonusExpへの加算とそれ経由のステータスポイント反映はある、上のkotonohaTotalXP
   コメント参照） */
function hyaRecord(it, correct){
  const st = loadStats();
  maybeGrantDailyLogin(st);
  const h = st.hyakunin.itemHist[it.id] || {t:0, c:0};
  h.t++; if(correct) h.c++;
  h.k = correct ? (h.k||0)+1 : 0; // 連続正解数（8問グループの段階的アンロック判定に使う）
  st.hyakunin.itemHist[it.id] = h;
  let gotTicket = false;
  if(correct){
    st.hyakunin.totalOk = (st.hyakunin.totalOk||0) + 1;
    // ことのはの経験値にだけ反映する（進化の分岐＝分野レベルの分布には影響させない、教員の指示、2026-07-31）
    st.hyakuninBonusExp = (st.hyakuninBonusExp||0) + 1;
    /* 挑戦チケットのドロップ（2026-08-01〜、教員の指示）。百人一首専用のチケット入手手段は置かず、
       正解＝百人一首レベル(hyaLv)が1上がるたびに、20分野と共通のst.totalLevelUpsを一緒に進める
       （百人一首の「10回レベルアップごとに1枚」も、20分野の既存カウンタに合流させるだけの実装）。 */
    st.totalLevelUps = (st.totalLevelUps||0) + 1;
    if(st.totalLevelUps % 10 === 0){
      st.bossTickets = (st.bossTickets||0) + 1;
      gotTicket = true;
    }
  }
  const curDiff = typeof st.hyakunin.targetLv === "number" ? st.hyakunin.targetLv : 1;
  st.hyakunin.targetLv = correct
    ? Math.min(HYAKUNIN_MAX_LV, curDiff + DIFF_LV_STEP)
    : Math.max(1, curDiff - DIFF_LV_STEP);
  ReviewSystem.onAnswer(st.hyakunin.itemHist, it.id, correct, it.lv, curDiff);
  const recent = (st.hyakunin.recent || []).slice();
  recent.push(correct ? 1 : 0);
  while(recent.length > 100) recent.shift();
  st.hyakunin.recent = recent;
  /* st.hyakunin.recentが確定した直後に呼ぶ（高速解放モードの判定に使うため、旧位置=recent更新前
     から移動した、2026-08-02〜） */
  const pctBeforeUnlock = hyaUnlockedQuestionPct(st);
  const groupJustUnlocked = hyaCheckGroupUnlock(st, it.id, correct);
  const celebrateMilestones = groupJustUnlocked
    ? crossedUnlockMilestones(pctBeforeUnlock, hyaUnlockedQuestionPct(st))
    : [];
  /* 20分野側のrecord()と同じ理由（2026-08-23〜）で、その場計算ではなく積み上げ方式にする。 */
  if(celebrateMilestones.length){
    if(!st.unlockBonusEarned) st.unlockBonusEarned = {};
    const gain = celebrateMilestones.reduce((s,m) => s + m.exp, 0);
    st.unlockBonusEarned.hyakunin = (st.unlockBonusEarned.hyakunin||0) + gain;
  }
  saveStats(st);
  return {lv: hyaLv(st), acc: hyaAccuracy(st), diffLv: st.hyakunin.targetLv, groupJustUnlocked, gotTicket, celebrateMilestones};
}

  }
  hya = {n:0, correct:0, lastId:null, item:null, order:null};
  hyaNextQuestion();
}
function hyaNextQuestion(){
  if(kotonohaMaybeInterruptForEvolve(() => hyaNextQuestion())) return;
  if(rollBossEncounter(() => hyaNextQuestion(), true)) return;
  const st = loadStats();
  const dueKey = ReviewSystem.getDueKey(hyaVisibleHist(st), hya.lastId);
  const due = dueKey ? hyaPool().find(it => it.id === dueKey) : null;
  if(due){
    hya.item = due;
    hya.isReviewDue = true;
  }else{
    hya.item = hyaSelectOne(hya.lastId);
    hya.isReviewDue = false;
  }
  hya.lastId = hya.item.id;
  hya.shownAt = Date.now();
  hyaRenderQuestion();
}
function hyaRenderQuestion(){
  const it = hya.item;
  hya.order = shuffledOrder(it.c.length);
  const choicesHtml = hya.order.map((oi,pos)=>
    `<button class="choice" onclick="hyaAnswerChoice(${oi})"><span class="choice-num">${pos+1}</span>${esc(it.c[oi])}</button>`
  ).join("");
  setupChoiceKeys(pos => hyaAnswerChoice(hya.order[pos]), it.c.length);
  const st = loadStats();
  const h = st.hyakunin.itemHist[it.id];
  const redoMark = hya.isReviewDue ? `<span class="redo">🔁 復習（段階${(h&&h.reviewStage)||1}）</span>` : "";
  screen.innerHTML = `
    <div class="session-bar">
      <span>${hya.n+1}問目　｜　今回の正解 ${hya.correct}問</span>
      <span class="catstat">🎴 百人一首（${esc(HYAKUNIN_QTYPE_BADGE[it.qType])}）</span>
    </div>
    <div class="card">
      <div class="q-category"><span>百人一首クイズ</span>${redoMark}</div>
      <div class="q-sub">${esc(it.instr)}</div>
      <div class="q-text">${markQuestionHtml(it.q)}</div>
      <div class="choices">${choicesHtml}</div>
      <div class="feedback" id="hyaFb"></div>
      <div class="btn-row">
        <button class="btn tap-advance-btn" id="hyaNextBtn" style="display:none" onclick="hyaNextQuestion()">次へ</button>
        <button class="btn secondary" id="hyaQuitBtn" style="display:none" onclick="hyaEndSession()">今日はここまで</button>
      </div>
    </div>
    ${unlockFooterHtml("百人一首", hyaUnlockedQuestionPct(st))}`;
}
function hyaAnswerChoice(origIdx){
  const it = hya.item;
  const ok = origIdx === it.a;
  hya.n++;
  if(ok) hya.correct++;
  const r = hyaRecord(it, ok);
  const btns = screen.querySelectorAll(".choice");
  btns.forEach((b,pos)=>{
    const oi = hya.order[pos];
    b.disabled = true;
    if(oi===it.a) b.classList.add("correct");
    else if(oi===origIdx) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = document.getElementById("hyaFb");
  fb.className = "feedback show " + (ok?"ok":"ng");
  const unlockMsg = r.groupJustUnlocked ? `<div class="evolve">🔓 百人一首の次のグループが解禁された！</div>` : "";
  const ticketMsg = r.gotTicket ? `<div class="evolve ticket-get">🎟️ ボスへの挑戦チケットを1枚手に入れた！</div>` : "";
  const celebrateMsg = celebrateMilestoneHtml("百人一首", r.celebrateMilestones);
  fb.innerHTML = `<div class="verdict">${ok?"○ 正解！":"× ざんねん…"}</div>${markQuestionHtml(it.e).replace(/\n/g,"<br>")}
    <div class="note">百人一首レベル Lv.${r.lv}　｜　今のめやす：${esc(hyaLvLabel(r.diffLv))}</div>${unlockMsg}${ticketMsg}${celebrateMsg}`;
  document.getElementById("hyaNextBtn").style.display = "inline-block";
  document.getElementById("hyaQuitBtn").style.display = "inline-block";
  document.getElementById("hyaNextBtn").focus();
}

    </div>

      ${p.text.map(t=>`<p>${esc(t)}</p>`).join("")}
    </div>
    <div class="card">
      <div class="q-category">読解</div>
      <div class="q-text">問${dk.i+1}　${markQuestionHtml(it.q)}</div>
      <div class="q-sub">${esc(DOKKAI_INSTRUCTION)}</div>
      <div class="choices">
        ${dk.order.map((oi,pos)=>`<button class="choice" onclick="answerDokkai(${oi})"><span class="choice-num">${pos+1}</span>${esc(it.c[oi])}</button>`).join("")}
      </div>
      <div class="feedback" id="fb"></div>
      <button class="btn tap-advance-btn" id="nextBtnD" style="display:none" onclick="nextDokkai()">次へ</button>
    </div>`;
  setupChoiceKeys(pos => answerDokkai(dk.order[pos]), it.c.length);
}
function answerDokkai(origIdx){
  const it = dk.p.qs[dk.i];
  const ok = origIdx === it.a;
  if(ok) dk.correct++;
  const elapsedMs = Date.now() - (dk.shownAt || Date.now());
  const r = record("dokkai", it, ok, elapsedMs);
  if(r.evolved) dk.evolved = r.evolved;
  const btns = screen.querySelectorAll(".choice");
  btns.forEach((b,pos)=>{
    const oi = dk.order[pos];
    b.disabled = true;
    if(oi===it.a) b.classList.add("correct");
    else if(oi===origIdx) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = document.getElementById("fb");
  fb.className = "feedback show " + (ok?"ok":"ng");
  const lvChip = r.lvup ? `<span class="lvup-chip">読解 Lv.${r.lv} にアップ！</span>` : "";
  const evolveMsg = r.evolved
    ? `<div class="evolve">${r.evolved.hidden ? "🔓 かくされた称号が明かされた！<br>" : ""}${r.evolved.icon} 進化！　読解の称号が「${esc(r.evolved.name)}」になった！</div>` : "";
  const ticketMsg = r.gotTicket ? `<div class="evolve ticket-get">🎟️ ボスへの挑戦チケットを1枚手に入れた！</div>` : "";
  const lowAccMsg = r.lowAccuracy ? `<p class="note">⏸️ 直近の正答率が低いため、レベルアップはお休み中です。落ち着いて問題を読んで答えると、また上がるようになります。</p>` : "";
  const fastMsg = r.fastGuess ? `<p class="note">⏸️ 少し急いで答えているようです。落ち着いて問題を読んで答えると、また上がるようになります。</p>` : "";
  fb.innerHTML = `<div class="verdict">${ok?"○ 正解！":"× ざんねん…"}${lvChip}</div>${it.e?esc(it.e):""}${evolveMsg}${ticketMsg}${lowAccMsg}${fastMsg}`;
  document.getElementById("nextBtnD").style.display = "inline-block";
}
function nextDokkai(){
  dk.i++;
  if(dk.i < dk.p.qs.length) renderDokkai();
  else {
    const d = dk;
    window._retry = ()=>startDokkai(d.pi);
    screen.innerHTML = `
      <div class="card">
        <h3 class="section">結果発表</h3>
        <div class="result-score">${d.correct} <span style="font-size:1.2rem;color:var(--sub)">/ ${d.p.qs.length}問</span></div>
        <p class="result-msg">現在：${catBadge("dokkai")}</p>
        ${d.evolved ? `<div class="evolve">${d.evolved.icon} 「${esc(d.evolved.name)}」に進化しました！</div>` : ""}
        <div class="btn-row">
          <button class="btn" onclick="window._retry()">もう一度</button>
          <button class="btn secondary" onclick="showDokkaiMenu()">ほかの文章へ</button>
          <button class="btn secondary" onclick="showHome()">ホームへ</button>
        </div>
      </div>`;
  }
}

/* ================= 二人対戦（同じ端末で交互に対戦） =================
   同じ端末を2人で使い、ジャンルをひとつ選んで交互に出題する。
   正解すると相手のHPを削り、さきにHPを０にしたほうの勝ち。
   個人の称号・経験値には影響しない、別枠のミニゲーム。 */
const BATTLE_STORE_KEY = "kokugoBattleStats_v1";
function loadBattleStats(){
  try{
    const s = localStorage.getItem(BATTLE_STORE_KEY);
    if(s){
      const bs = JSON.parse(s);
      if(bs && typeof bs.plays === "number"){
        if(!Array.isArray(bs.history)) bs.history = [];
        return bs;
      }
    }
  }catch(e){}
  return {plays:0, byCat:{}, history:[]};
}
function saveBattleStats(bs){
  try{ localStorage.setItem(BATTLE_STORE_KEY, JSON.stringify(bs)); }catch(e){}
}
function battleCatsLabel(cats){
  if(!cats || cats.length === 0) return "";
  if(cats.length >= CAT_KEYS.length) return "全ジャンル";
  return cats.map(k => (CATS[k] ? CATS[k].name : k)).join("・");
}
function battleDateLabel(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,"0");
  return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
/* 問題の難度（it.lv）が高いほど少しダメージが大きくなる */
function battleDamage(it){
  return Math.max(8, Math.min(35, 8 + (it.lv||1)*3));
}
/* 対戦専用の出題：個人のレベル・履歴には左右されず、直前と同じ問題だけ避けて公平に選ぶ。
   filterFn（省略可）を渡すと、そのカテゴリの中の一部分だけに絞って出題できる
   （2026-07-19〜、第6章のボス戦でit.tagが特定の値の問題だけを出したいケース用）。 */
function pickBattleQuestion(cat, lastQ, filterFn){
  let pool = CATS[cat].items;
  if(filterFn){
    const filtered = pool.filter(filterFn);
    /* 絞り込み条件（beat.maxGrade等）に合う問題が1問も無い場合は、絞り込み自体を諦めて
       全体プールから出す（教員の指摘、2026-08-23：goiの441問全件にgradeフィールドが
       付いておらず、maxGrade:3で絞り込むと0件になりCannot read properties of undefinedで
       クラッシュしていた）。出題ゼロで詰まるより、学年に合わない問題が出る方がまし。 */
    pool = filtered.length > 0 ? filtered : pool;
  }
  if(pool.length > 1 && lastQ) pool = pool.filter(it => it.q !== lastQ);
  return pool[Math.floor(Math.random() * pool.length)];
}
let battle = null;
let battleSetup = null; // { nameA, nameB, picked:Set }
function pickBattleQuestionMulti(cats, lastQ){
  let pool = [];
  cats.forEach(key=>{
    const c = CATS[key];
    if(c) c.items.forEach(it => pool.push({cat:key, item:it}));
  });
  if(pool.length > 1 && lastQ) pool = pool.filter(p => p.item.q !== lastQ);
  return pool[Math.floor(Math.random() * pool.length)];
}
/* 百人一首クイズ中に遭遇したボスとの戦闘専用（教員の指示、2026-08-02）。20分野のCATSではなく、
   百人一首クイズの全問題プール（hyaPool()、未解禁のグループも含む＝20分野のボス戦がCATSの
   全件から出題するのと同じ扱い）からそのまま出題する。ボス戦はrecord()/hyaRecord()いずれも
   呼ばない設計なので、ここで選んだ問題を解いても百人一首の学習記録・解禁進捗には影響しない。 */
function pickBattleQuestionHyakunin(lastQ){
  let pool = hyaPool();
  if(pool.length > 1 && lastQ) pool = pool.filter(it => it.q !== lastQ);
  return pool[Math.floor(Math.random() * pool.length)];
}

function showBattleGenrePicker(){

function toggleBattleGenre(key){

function confirmBattleGenrePicker(){

function startBattle(cats){
  if(!Array.isArray(cats) || cats.length === 0) return;
  battle = {cats, nameA:battleSetup.nameA, nameB:battleSetup.nameB, hp:{A:100,B:100}, maxHp:100, turn:"A", lastQ:null, item:null, itemCat:null, order:null};
  battleNextQuestion();
}
function battleNextQuestion(){
  const picked = pickBattleQuestionMulti(battle.cats, battle.lastQ);
  battle.item = picked.item;
  battle.itemCat = picked.cat;
  battle.lastQ = battle.item.q;
  renderBattle();
}
function renderBattle(){
  const it = battle.item, cat = battle.itemCat;

        </div>
        <div class="vs-badge">VS</div>
        <div class="battle-side ${battle.turn==='B'?'active':''}">
          <div class="battle-name">${esc(battle.nameB)}</div>
          <div class="hpbar hpbar-b"><div style="width:${battle.hp.B/battle.maxHp*100}%"></div></div>
          <div class="hp-num">${battle.hp.B} / ${battle.maxHp}</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="q-category"><span>${esc(CATS[cat].name)}</span><span class="battle-turn-tag">${esc(turnName)}さんの番</span></div>
      ${subInstructionHtml(cat, it)}
      ${kanbunBoxHtml(it.kb)}
      <div class="q-text">${markQuestionHtml(it.q)}</div>

        <button class="btn tap-advance-btn" id="nextBtn" style="display:none" onclick="battleAdvance()">つぎへ</button>
        <button class="btn secondary" onclick="battleQuit()">たいせんをやめる</button>
      </div>

  if(isInput){ const el = document.getElementById("ansIn"); if(el) el.focus(); }

function battleAnswerChoice(origIdx){

}
function battleSubmitInput(){
  const el = document.getElementById("ansIn");
  if(!el || el.disabled) return;
  const val = normalizeAns(el.value);
  if(!val) return;
  const ok = battle.item.ans.map(normalizeAns).includes(val);
  el.disabled = true;
  const sb = document.getElementById("submitBtn");
  if(sb) sb.disabled = true;
  battleGrade(ok, null, el.value);
}
function battleGrade(ok, chosenOrig, typed){
  const it = battle.item;
  const attacker = battle.turn, defender = attacker === "A" ? "B" : "A";
  let dealt = 0;
  if(ok){
    dealt = battleDamage(it);
    battle.hp[defender] = Math.max(0, battle.hp[defender] - dealt);
  }
  if(!Array.isArray(it.ans)){
    const btns = screen.querySelectorAll(".choice");
    btns.forEach((b,pos)=>{
      const oi = battle.order[pos];
      b.disabled = true;
      if(oi===it.a) b.classList.add("correct");
      else if(oi===chosenOrig) b.classList.add("wrong");
      else b.classList.add("dim");
    });
  }
  const fb = document.getElementById("fb");
  fb.className = "feedback show " + (ok?"ok":"ng");
  let expl;
  if(Array.isArray(it.ans)){
    const wrongMsg = ok ? "" : `正解は「${esc(it.ans.join("」または「"))}」（こたえ：${esc(typed||"")}）`;
    expl = [wrongMsg, it.e ? esc(it.e) : ""].filter(Boolean).join("<br>");
  }else{
    expl = it.e ? esc(it.e) : (ok ? "" : `正解は「${esc(it.c[it.a])}」`);
  }
  const defenderName = defender === "A" ? battle.nameA : battle.nameB;
  const dmgMsg = ok ? `<span class="lvup-chip">${esc(defenderName)}に ${dealt} ダメージ！</span>` : "";
  fb.innerHTML = `<div class="verdict">${ok?"○ 正解！":"× ざんねん…"}${dmgMsg}</div>${expl}`;
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.style.display = "inline-block";
  nextBtn.textContent = battle.hp[defender] <= 0 ? "けっかを見る" : "つぎへ";
  nextBtn.focus();
}
function battleAdvance(){
  const attacker = battle.turn, defender = attacker === "A" ? "B" : "A";
  if(battle.hp[defender] <= 0){ endBattle(); return; }
  battle.turn = defender;
  battleNextQuestion();
}
function battleQuit(){
  if(!confirm("対戦をやめますか？ここまでの結果は記録されません。")) return;
  battle = null;
  showBattleGenreSelect();
}
function endBattle(){
  const winner = battle.hp.A <= 0 ? battle.nameB : battle.nameA;
  const loser = battle.hp.A <= 0 ? battle.nameA : battle.nameB;
  const bs = loadBattleStats();
  bs.plays = (bs.plays||0) + 1;
  bs.byCat = bs.byCat || {};
  battle.cats.forEach(cat => { bs.byCat[cat] = (bs.byCat[cat]||0) + 1; });
  bs.history = bs.history || [];
  bs.history.unshift({a:battle.nameA, b:battle.nameB, winner, cats:battle.cats.slice(), ts:Date.now()});
  if(bs.history.length > 50) bs.history.length = 50;
  saveBattleStats(bs);
  const b = battle;
  window._retry = () => startBattle(b.cats);
  screen.innerHTML = `
    <div class="card">
      <h3 class="section">けっか発表</h3>
      <div class="result-score" style="font-size:1.6rem">🏆 ${esc(winner)} の勝ち！</div>
      <p class="result-msg">${esc(loser)} は力つきた…</p>
      <div class="btn-row">
        <button class="btn" onclick="window._retry()">同じジャンルでもう一度</button>
        <button class="btn secondary" onclick="showBattleGenreSelect()">べつのジャンルへ</button>
        <button class="btn secondary" onclick="showHome()">ホームへ</button>
      </div>
    </div>`;
  battle = null;
}

/* ================= ボス戦（低確率のランダムイベント） =================
   知識クイズ（通常・苦手復習）で1問答えるたびに、ごくまれに(1/40)ボスが勝負をしかけてくる。
   受けて立って勝つと、そのボス固有の「アイテム」を必ず、まれに(1/10、天井10連勝で確定)
   さらに貴重な「宝具」も落とす。集めたアイテムは成績とは別に、ずっと記録される。

   バランス設計（「適正経験値」方式）：
   ボスの防御・回避は固定値の引き算ではなく割合で軽減／無効化するしくみにしている
   （数ポイントの投資で被ダメージが一律1に落ちてしまう問題を避けるため）。
   プレイヤー側の防御力・素早さ・運は、上限のある「〇%で頭打ち」の式ではなく、
   ポイントを増やすほど際限なく効果が伸びていく（ただし伸び方はゆるやかになっていく）
   「逓減式」にしている。これにより、どのステータスにポイントを注いでも無駄にならない。
   素早さ（回避）は、ボス側の新しい「命中率」と綱引きするしくみにした

   3体それぞれ、これまでにない個性を持たせてある：

     `dropChance = itemDropFloor + (itemDropCeil-itemDropFloor) * min(1, acc/dropAccuracyThreshold)`

   dropAccuracyThresholdを持たせ、atk倍率も同じ非線形の伸びの一部として探索している

     toshoiin(図書委員長)：defPct60%の純粋防御特化型（suugakuはdefPctとevadePctの複合型、judoは

     0ステータス・一点特化ビルドでも他ボスと同様0%になることも確認済み。 */
const BOSS_ENCOUNTER_RATE = 1/40;
/* ランダム遭遇は、分野をまたいだ「直近30回」の正答率（st.recentCorrectAll）で出やすさが変わる

   30回に満たないうちはデータ不足として、これまでどおり無条件でBOSS_ENCOUNTER_RATE(1/40)を使う。
   データが十分あるときは、正答率0%〜BOSS_ENCOUNTER_HOT_ACC(80%)の範囲を
   0（遭遇なし）〜BOSS_ENCOUNTER_HOT_RATE(1/25)まで直線的に補間する（80%以上は1/25で頭打ち）。
   正答率50%のときにちょうど1/40になる（(0.5/0.8)*(1/25) = 1/40）ので、
   このあたりのプレイヤーには旧仕様（階段状のときの中間段）とほぼ同じ体感になる。 */
const BOSS_ENCOUNTER_HOT_ACC = 0.8;
const BOSS_ENCOUNTER_HOT_RATE = 1/25;
function recentAccAll(st){
  const recent = st.recentCorrectAll || [];
  if(recent.length < RECENT_ACC_WINDOW) return null; // データ不足（判定なし）
  return recent.reduce((a,b)=>a+b, 0) / recent.length;
}
/* 問題を解いている画面の上部（session-bar）に常時出す「直近の正答率」表示用（2026-07-17〜）。
   ボス遭遇・宝具ドロップ判定のrecentAccAllとは違い、こちらは表示専用なので30問に満たなくても
   その時点までの件数で計算して見せる（1件もなければ空文字を返し、何も表示しない）。 */
function recentAccDisplayHtml(){
  const st = loadStats();
  const recent = st.recentCorrectAll || [];
  if(!recent.length) return "";
  const pct = Math.round(100 * recent.reduce((a,b)=>a+b, 0) / recent.length);
  return `　｜　<span class="recent-acc">直近の正答率${pct}%</span>`;
}
/* 「運」を高めるとボスへの遭遇率も上がる（2026-08-03〜、教員の指示）。正答率による基本の
   比率（下の既存ロジック）に、運の比率で決まる倍率（luckEncounterMult、0.5倍〜2倍）を
   掛け合わせる。データ不足でBOSS_ENCOUNTER_RATE固定になる場合も、この倍率は同じように適用する。 */
function bossEncounterRate(st){
  const acc = recentAccAll(st);
  const base = acc === null
    ? BOSS_ENCOUNTER_RATE
    : (Math.min(BOSS_ENCOUNTER_HOT_ACC, Math.max(0, acc)) / BOSS_ENCOUNTER_HOT_ACC) * BOSS_ENCOUNTER_HOT_RATE;
  return base * luckEncounterMult(st);
}
const BOSS_TREASURE_RATE = 0.1;
/* 宝具のドロップは、分野をまたいだ「直近30回」の正答率(st.recentCorrectAll)が
   BOSS_TREASURE_MIN_ACC(50%)以上のときしか起こらない（2026-07-16〜、教員の指示）。
   通常アイテムのドロップ(dropsLoot)や天井カウント(bossPity)自体には影響させず、
   「宝具になるかどうか」の判定だけをこの条件でガードする（bossWin参照）。
   30回に満たないうちはデータ不足として、これまでどおり無条件で許可する。 */
const BOSS_TREASURE_MIN_ACC = 0.5;
function treasureDropAllowed(st){
  const acc = recentAccAll(st);
  return acc === null || acc >= BOSS_TREASURE_MIN_ACC;
}
/* 通常アイテムのドロップ確率（2026-07-17〜）。`dropAccuracyThreshold`を持たないボス（旧6体・
   シランちゃん・国語の神）は今までどおり無条件100%（bossWin側でこの関数自体を呼ばない）。
   `dropAccuracyThreshold`を持つボスは、分野をまたいだ「直近30回」の正答率(recentAccAll、
   ボス遭遇/宝具ドロップ判定と同じ値、挑戦チケットでの撃破でも区別しない)に応じて、
   `itemDropFloor`（正答率0%のときのドロップ率）〜`itemDropCeil`（正答率
   dropAccuracyThreshold以上のときのドロップ率）の範囲でグラデーションになる。
   直近30回のデータが30件に満たないとき（acc===null）はacc=0扱い＝floorになる。 */
function bossItemDropChance(boss, st){
  if(!boss.dropAccuracyThreshold) return 1;
  const acc = recentAccAll(st);
  const effAcc = acc === null ? 0 : acc;
  const t = Math.min(1, Math.max(0, effAcc / boss.dropAccuracyThreshold));
  return boss.itemDropFloor + (boss.itemDropCeil - boss.itemDropFloor) * t;
}

   recPts/5（＝適正経験値を均等配分したときの防御力）に連動させている（bossDefHalfPoint()）。
   固定値だったときは、recPts150の最弱ボス基準（30）のまま以後のボスにも使われ続けたため、
   recPts5000のルオーでは均等配分の防御力(1000)が97%軽減という飽和域に達してしまい、
   「防御力を積んでも被ダメージがほとんど変わらない」状態になっていた（教員からの指摘で発覚）。
   recPts/5に連動させることで、「均等配分なら常に50%軽減」という基準がボスの強さに関わらず
   揃い、将来もっとrecPtsの高いボスを追加しても、このぶんの再調整が要らなくなる。 */
function bossDefHalfPoint(boss){ return Math.max(1, (boss.recPts||0) / 5); }
/* 「運」による会心率を、運の実数値ではなく「その運が、ことのはの全経験値のうち何割を
   占めているか」という比率で決める設計に変更（2026-08-03〜、教員の指示。旧式は
   `100*luck/(luck+100)`という実数値ベースの逓減カーブだった）。運の比率が10分の1(0.1)なら
   会心率11%、0なら会心率0%（会心が一切出ない）、2分の1(0.5)以上なら上限の60%、という
   3点をそのまま結ぶ区分線形（折れ線）で実装した（0→0.1の区間と0.1→0.5の区間で傾きが
   異なるため、単純な比例式1本では3点を同時に満たせない）。分母のkotonohaTotalXPには
   ことのはの経験値の全て（bonusExp・宝具・百人一首のボーナス・問題全開放のお祝いも含む）を
   使う。分母が0（新規プレイヤー）のときは比率0扱い。同じ比率の考え方を、下のボスへの
   遭遇率の倍率（luckEncounterMult）にも使う。 */
const LUCK_RATIO_MID = 0.1;   // この比率のとき「基準」になる
const LUCK_RATIO_CAP = 0.5;   // この比率以上で上限に張り付く
function luckRatioOf(effLuck, st){
  const totalXP = kotonohaTotalXP(st);
  if(totalXP <= 0) return 0;
  return Math.max(0, effLuck / totalXP);
}
const LUCK_CRIT_MID_PCT = 11, LUCK_CRIT_MAX_PCT = 60; // 会心率：比率0→0%、0.1→11%、0.5以上→60%（上限）
function luckCritChancePct(effLuck, st){
  const r = luckRatioOf(effLuck, st);
  if(r >= LUCK_RATIO_CAP) return LUCK_CRIT_MAX_PCT;
  if(r <= LUCK_RATIO_MID) return LUCK_CRIT_MID_PCT * (r / LUCK_RATIO_MID);
  return LUCK_CRIT_MID_PCT + (LUCK_CRIT_MAX_PCT - LUCK_CRIT_MID_PCT) * (r - LUCK_RATIO_MID) / (LUCK_RATIO_CAP - LUCK_RATIO_MID);
}
/* ボスへの遭遇率の倍率：比率0→0.5倍、0.1→1倍（bossEncounterRate側の「基本の比率」そのまま）、
   0.5以上→2倍（上限）。bossEncounterRate()の戻り値にこの倍率を掛け合わせて使う。 */
const LUCK_ENC_ZERO_MULT = 0.5, LUCK_ENC_BASE_MULT = 1.0, LUCK_ENC_MAX_MULT = 2.0;
function luckEncounterMult(st){
  const r = luckRatioOf(kotonohaEffStats(st).luck || 0, st);
  if(r >= LUCK_RATIO_CAP) return LUCK_ENC_MAX_MULT;
  if(r <= LUCK_RATIO_MID) return LUCK_ENC_ZERO_MULT + (LUCK_ENC_BASE_MULT - LUCK_ENC_ZERO_MULT) * (r / LUCK_RATIO_MID);
  return LUCK_ENC_BASE_MULT + (LUCK_ENC_MAX_MULT - LUCK_ENC_BASE_MULT) * (r - LUCK_RATIO_MID) / (LUCK_RATIO_CAP - LUCK_RATIO_MID);
}
