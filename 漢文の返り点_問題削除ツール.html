<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>漢文の返り点 問題削除ツール</title>
<style>
  :root{
    --bg:#f4f2ec; --panel:#fff; --ink:#2a2620; --sub:#8a8374; --line:#ddd6c7;
    --ng:#c0392b; --ok:#2f8f4e; --accent:#8a5a2b;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic","Meiryo",sans-serif;}
  header{background:#3a3226;color:#f4f2ec;padding:10px 20px;position:sticky;top:0;z-index:10;}
  header h1{font-size:16px;margin:0 0 8px;}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .toolbar input[type=text]{font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;min-width:220px;}
  .toolbar button{font-size:13px;padding:6px 14px;border:1px solid #6b5f4a;background:#4a4133;color:#f4f2ec;border-radius:6px;cursor:pointer;}
  .toolbar button:hover{background:#5a5040;}
  .toolbar button.danger{background:var(--ng);border-color:var(--ng);}
  .toolbar button.danger:hover{background:#a5311f;}
  .stat{font-size:13px;color:#e6e1d3;}
  .stat b{color:#fff;}
  main{max-width:820px;margin:0 auto;padding:16px 16px 80px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);position:relative;}
  .card .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-bottom:8px;}
  .badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:#eee;color:#666;}
  .qtext{font-size:15px;line-height:1.6;margin-bottom:6px;}
  .sub{font-size:12.5px;color:var(--sub);margin-bottom:8px;}
  .choices{list-style:none;margin:0 0 8px;padding:0;font-size:13px;}
  .choices li{padding:3px 0 3px 22px;position:relative;color:#555;}
  .choices li.correct{color:var(--ok);font-weight:bold;}
  .choices li.correct::before{content:"○";position:absolute;left:0;}
  .choices li:not(.correct)::before{content:"・";position:absolute;left:4px;color:#bbb;}
  .expl{font-size:12.5px;color:var(--sub);background:#f8f6ef;border-radius:6px;padding:8px 10px;}
  .delBtn{position:absolute;top:14px;right:14px;font-size:13px;padding:6px 14px;border:1px solid var(--ng);color:var(--ng);background:#fff;border-radius:16px;cursor:pointer;}
  .delBtn:hover{background:var(--ng);color:#fff;}
  .card.removed{background:#faf3f0;border-color:#e6b8ac;opacity:.75;}
  .card.removed .qtext{text-decoration:line-through;color:#999;}
  .restoreBtn{position:absolute;top:14px;right:14px;font-size:13px;padding:6px 14px;border:1px solid var(--ok);color:var(--ok);background:#fff;border-radius:16px;cursor:pointer;}
  .restoreBtn:hover{background:var(--ok);color:#fff;}
  h2.sectionTitle{font-size:14px;color:var(--sub);border-bottom:1px solid var(--line);padding-bottom:6px;margin:22px 0 10px;}
  #status{position:fixed;top:10px;right:16px;background:#2f8f4e;color:#fff;padding:6px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;}
  #status.show{opacity:1;}
  #exportBox{display:none;max-width:820px;margin:0 auto;padding:0 16px 40px;}
  #exportBox textarea{width:100%;height:260px;font-family:monospace;font-size:12px;padding:10px;border:1px solid var(--line);border-radius:8px;}
  .note{font-size:12.5px;color:var(--sub);}
  .hidden{display:none!important;}
  .reviewWrap{max-width:820px;margin:16px auto 0;padding:0 16px;}
  .reviewPos{font-size:13px;color:var(--sub);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .reviewCard{background:var(--panel);border:2px solid var(--accent);border-radius:10px;padding:18px 20px;box-shadow:0 2px 6px rgba(0,0,0,.08);min-height:80px;}
  .reviewCard .qtext{font-size:19px;}
  .reviewKeys{margin-top:10px;background:#f8f6ef;border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-size:12.5px;color:#555;display:flex;gap:22px;flex-wrap:wrap;}
  .reviewKeys kbd{background:#fff;border:1px solid #bbb;border-radius:4px;padding:1px 6px;font-family:inherit;box-shadow:0 1px 0 #bbb;}
  .reviewNavBtns{display:flex;gap:8px;}
  .reviewNavBtns button{font-size:12.5px;padding:5px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;}
  .badge.pendingDel{background:#f8d7d0;color:#a5311f;font-weight:bold;}
</style>
</head>
<body>
<header>
  <h1>漢文の返り点　問題削除ツール</h1>
  <div class="toolbar">
    <input type="text" id="filterInput" placeholder="問題文で検索">
    <button id="collapseAllBtn">全て閉じる／開く</button>
    <button id="exportBtn">📤 書き出す</button>
    <button id="resetAllBtn" class="danger">全て元に戻す</button>
    <span class="stat">全<b id="totalCount">0</b>問中　残す：<b id="keepCount">0</b>問　／　削除：<b id="removedCount">0</b>問</span>
  </div>
</header>

<div class="reviewWrap">
  <div class="reviewPos">
    <span>レビュー　<b id="reviewPos">0/0</b></span>
    <div class="reviewNavBtns">
      <button id="reviewPrevBtn">← 前へ</button>
      <button id="reviewKeepBtn">残す（次へ）</button>
      <button id="reviewDelBtn">🗑 削除（次へ）</button>
    </div>
  </div>
  <div class="reviewCard" id="reviewCard"></div>
  <div class="reviewKeys">
    <span><kbd>Enter</kbd> / <kbd>Space</kbd> / <kbd>→</kbd>：残して次へ</span>
    <span><kbd>Delete</kbd> / <kbd>Backspace</kbd> / <kbd>D</kbd>：削除して次へ</span>
    <span><kbd>←</kbd>：前の問題に戻る</span>
    <span>（検索窓やテキスト欄にカーソルがある間は無効です）</span>
  </div>
</div>

<main id="main"></main>

<div id="exportBox">
  <h2 class="sectionTitle">書き出し結果</h2>
  <p class="note">
    ダウンロードした .json ファイル、または下のテキストをそのまま使って、<code>kokugo_data.js</code> の
    <code>cats.kanbun.items</code> をこの内容に置き換えてください（手動マージ）。削除した問題はここには含まれません。
  </p>
  <textarea id="exportText" readonly onclick="this.select()"></textarea>
</div>

<div id="status"></div>

<script src="kokugo_data.js"></script>
<script>
(function(){
  "use strict";
  var STORAGE_KEY = "kanbunDeleteTool_removedQs_v1";
  var allItems = (window.QUESTION_DATA && window.QUESTION_DATA.cats && window.QUESTION_DATA.cats.kanbun
    && window.QUESTION_DATA.cats.kanbun.items) || [];

  function loadRemovedSet(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? new Set(JSON.parse(raw)) : new Set();
    }catch(e){ return new Set(); }
  }
  function saveRemovedSet(set){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(set))); }catch(e){}
  }
  // 問題文(q)そのものを識別キーにする（このジャンルのstats記録＝qKeyと同じ考え方。
  // 元データに配列位置以外の一意なidが無いため、qの完全一致で管理する）。
  var removedQs = loadRemovedSet();
  var filterText = "";
  var collapsed = false;
  var reviewPtr = 0; // allItemsのうち、現在フィルタに一致するものだけを歩くポインタ（レビューモード用）

  function showStatus(msg){
    var el = document.getElementById("status");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(showStatus._t);
    showStatus._t = setTimeout(function(){ el.classList.remove("show"); }, 1600);
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function render(){
    var main = document.getElementById("main");
    var kept = [], removed = [];
    allItems.forEach(function(it, idx){
      if(removedQs.has(it.q)) removed.push({it:it, idx:idx}); else kept.push({it:it, idx:idx});
    });
    document.getElementById("totalCount").textContent = allItems.length;
    document.getElementById("keepCount").textContent = kept.length;
    document.getElementById("removedCount").textContent = removed.length;

    var f = filterText.trim();
    var html = "";
    html += '<h2 class="sectionTitle">残す問題（' + kept.length + '問）</h2>';
    var shownKeep = kept.filter(function(x){ return !f || x.it.q.indexOf(f) !== -1 || (x.it.e||"").indexOf(f) !== -1; });
    if(shownKeep.length === 0) html += '<p class="note">該当する問題がありません。</p>';
    shownKeep.forEach(function(x){ html += cardHtml(x.it, x.idx, false); });

    if(removed.length){
      html += '<h2 class="sectionTitle">削除した問題（' + removed.length + '問、タップで元に戻せます）</h2>';
      removed.forEach(function(x){ html += cardHtml(x.it, x.idx, true); });
    }
    main.innerHTML = html;
    renderReview();
  }

  // レビューモード：フィルタに一致する項目だけをallItems順に歩く（フィルタが無ければ全242問）。
  // 一覧側（kept/removed）と違い、削除済みかどうかに関わらず全件を対象にする
  // （←で戻って判断をやり直せるようにするため）。
  function reviewOrder(){
    var f = filterText.trim();
    var order = [];
    allItems.forEach(function(it, idx){
      if(!f || it.q.indexOf(f) !== -1 || (it.e||"").indexOf(f) !== -1) order.push(idx);
    });
    return order;
  }
  function renderReview(){
    var order = reviewOrder();
    if(reviewPtr > order.length - 1) reviewPtr = order.length - 1;
    if(reviewPtr < 0) reviewPtr = 0;
    document.getElementById("reviewPos").textContent = order.length ? (reviewPtr + 1) + "/" + order.length : "0/0";
    var card = document.getElementById("reviewCard");
    if(!order.length){
      card.innerHTML = '<p class="note">該当する問題がありません。</p>';
      return;
    }
    var it = allItems[order[reviewPtr]];
    var isRemoved = removedQs.has(it.q);
    card.innerHTML =
      '<div class="meta"><span class="badge">Lv.' + esc(it.lv) + '</span><span class="badge">小' + esc(it.grade) + '</span>' +
      (isRemoved ? '<span class="badge pendingDel">削除予定</span>' : "") + "</div>" +
      '<div class="qtext">' + esc(it.q) + "</div>" +
      (it.s ? '<div class="sub">' + esc(it.s) + "</div>" : "") +
      choicesHtml(it) +
      (it.e ? '<div class="expl">' + esc(it.e) + "</div>" : "");
  }
  function reviewAdvance(){
    var order = reviewOrder();
    if(reviewPtr < order.length - 1) reviewPtr++;
    renderReview();
  }
  function reviewBack(){
    if(reviewPtr > 0) reviewPtr--;
    renderReview();
  }
  function reviewKeep(){
    var order = reviewOrder();
    if(!order.length) return;
    var it = allItems[order[reviewPtr]];
    if(removedQs.has(it.q)){ removedQs.delete(it.q); saveRemovedSet(removedQs); }
    render();
    reviewAdvance();
  }
  function reviewDelete(){
    var order = reviewOrder();
    if(!order.length) return;
    var it = allItems[order[reviewPtr]];
    if(!removedQs.has(it.q)){ removedQs.add(it.q); saveRemovedSet(removedQs); }
    render();
    reviewAdvance();
  }

  function choicesHtml(it){
    if(!Array.isArray(it.c)) return "";
    return '<ul class="choices">' + it.c.map(function(c, i){
      return '<li class="' + (i === it.a ? "correct" : "") + '">' + esc(c) + '</li>';
    }).join("") + '</ul>';
  }

  function cardHtml(it, idx, isRemoved){
    var body = collapsed ? "" :
      '<div class="qtext">' + esc(it.q) + '</div>' +
      (it.s ? '<div class="sub">' + esc(it.s) + '</div>' : "") +
      choicesHtml(it) +
      (it.e ? '<div class="expl">' + esc(it.e) + '</div>' : "");
    var btn = isRemoved
      ? '<button class="restoreBtn" onclick="window.__kanbunTool.restore(' + idx + ')">↩ 元に戻す</button>'
      : '<button class="delBtn" onclick="window.__kanbunTool.remove(' + idx + ')">🗑 削除</button>';
    var qtextIfCollapsed = collapsed ? '<div class="qtext">' + esc(it.q) + '</div>' : "";
    return '<div class="card' + (isRemoved ? " removed" : "") + '" data-idx="' + idx + '">' +
      '<div class="meta"><span class="badge">Lv.' + esc(it.lv) + '</span><span class="badge">小' + esc(it.grade) + '</span></div>' +
      qtextIfCollapsed + body + btn +
      '</div>';
  }

  window.__kanbunTool = {
    remove: function(idx){
      var it = allItems[idx];
      if(!it) return;
      removedQs.add(it.q);
      saveRemovedSet(removedQs);
      render();
      showStatus("削除しました（元に戻すこともできます）");
    },
    restore: function(idx){
      var it = allItems[idx];
      if(!it) return;
      removedQs.delete(it.q);
      saveRemovedSet(removedQs);
      render();
      showStatus("元に戻しました");
    }
  };

  document.getElementById("filterInput").addEventListener("input", function(e){
    filterText = e.target.value;
    reviewPtr = 0; // 検索条件が変わったら、レビューの先頭からやり直す
    render();
  });
  document.getElementById("reviewPrevBtn").addEventListener("click", reviewBack);
  document.getElementById("reviewKeepBtn").addEventListener("click", reviewKeep);
  document.getElementById("reviewDelBtn").addEventListener("click", reviewDelete);
  // キーボードでどんどん判定していけるようにする（教員の指示、2026-09-12）。
  // 検索窓など入力欄にフォーカスがある間は、通常の入力を妨げないよう無効化する。
  document.addEventListener("keydown", function(e){
    var tag = (e.target && e.target.tagName) || "";
    if(tag === "INPUT" || tag === "TEXTAREA") return;
    if(e.key === "Enter" || e.key === " " || e.key === "ArrowRight"){
      e.preventDefault();
      reviewKeep();
    } else if(e.key === "Delete" || e.key === "Backspace" || e.key === "d" || e.key === "D"){
      e.preventDefault();
      reviewDelete();
    } else if(e.key === "ArrowLeft"){
      e.preventDefault();
      reviewBack();
    }
  });
  document.getElementById("collapseAllBtn").addEventListener("click", function(){
    collapsed = !collapsed;
    render();
  });
  document.getElementById("resetAllBtn").addEventListener("click", function(){
    if(!confirm("削除予定を全て取り消して、最初の状態（全" + allItems.length + "問）に戻します。よろしいですか？")) return;
    removedQs = new Set();
    saveRemovedSet(removedQs);
    render();
    showStatus("全て元に戻しました");
  });
  document.getElementById("exportBtn").addEventListener("click", function(){
    var kept = allItems.filter(function(it){ return !removedQs.has(it.q); });
    var json = JSON.stringify(kept, null, 1);
    document.getElementById("exportText").value = json;
    document.getElementById("exportBox").style.display = "block";
    document.getElementById("exportBox").scrollIntoView({behavior:"smooth"});

    var blob = new Blob([json], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var d = new Date();
    var stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0")
      + "_" + String(d.getHours()).padStart(2,"0") + String(d.getMinutes()).padStart(2,"0");
    a.href = url;
    a.download = "kanbun_items_" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    showStatus("書き出しました（残り" + kept.length + "問）");
  });

  if(!allItems.length){
    document.getElementById("main").innerHTML = '<p class="note" style="padding:20px;">kokugo_data.js から「漢文の返り点」（cats.kanbun.items）を読み込めませんでした。このファイルと同じフォルダに kokugo_data.js があるか確認してください。</p>';
  } else {
    render();
  }
})();
</script>
</body>
</html>
