<title>品詞でGO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;background:#141c26;color:#222;min-height:100vh;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:1100px;margin:0 auto;padding:6px}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#fff;padding:2px 4px 6px}
header h1{font-size:17px;flex:1;white-space:nowrap}

#sent .tg{color:#c62828;border-bottom:3px solid #c62828;padding:0 2px}
#step{font-size:15px;color:#444;margin-top:2px;display:flex;gap:8px;align-items:center}
#step .tag{background:#1d2a3a;color:#fff;border-radius:6px;padding:0 8px;font-size:13px}
#step b{color:#1d2a3a;font-size:17px}
#route{display:flex;gap:2px;overflow-x:auto;white-space:nowrap;background:#263446;border-radius:10px;padding:5px 8px;margin-bottom:6px;scrollbar-width:thin}

#route .st i{display:block;width:10px;height:10px;border-radius:50%;border:2px solid #9fb0c3;background:#263446;margin-bottom:2px}

#route .st.done{opacity:.45}

.seg{display:flex;gap:6px;margin:8px 0}

.mapwrap{background:#fff;border-radius:12px;padding:4px;margin:6px 0}
.mapwrap .map{width:100%;height:230px;display:block;border-radius:8px}

.hbtn{display:block;width:100%;border:none;border-radius:16px;padding:14px 16px;margin-top:12px;cursor:pointer;font-family:inherit;color:#fff;text-align:left;box-shadow:0 5px 0 #0006}
.hbtn>b{display:block;font-size:26px}
.hbtn span b{font-size:15px;color:#ffeb3b}
.hbtn span{font-size:14px;line-height:1.5;opacity:.95}
.hbtn.iw{background:linear-gradient(135deg,#2e7d32,#1565c0)}
.hbtn.zk{background:linear-gradient(135deg,#00897b,#6a1b9a)}
#zukanGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:8px}
#zukanGrid .zc{border:2px solid #ddd;border-radius:10px;padding:6px 4px;text-align:center;background:#fff;font-size:12px;line-height:1.35}

#dirPanel{position:absolute;inset:0;background:#0008;display:flex;align-items:center;justify-content:center}
#dirPanel[hidden]{display:none}

#route .st u{text-decoration:none;font-size:13px;line-height:1;height:14px}
#route .st.here{color:#69f0ae}
#route .st.here i{border-color:#69f0ae;background:#69f0ae}
#sent .jt{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;line-height:1.15;margin:0 2px}
#sent .jt small{font-size:11px;color:#2e7d32;white-space:nowrap}
#sent .jt.ng small{color:#c62828}
body.zk #sent .tg,body.zk #sent .tk{display:inline-block;line-height:1.15;vertical-align:top;margin:0 2px}
#sent ruby rt{font-size:12px;font-weight:bold;color:#2e7d32;letter-spacing:0}
#sent ruby.ng rt{color:#c62828}
#sent .tk{color:#999}

#step{justify-content:center;flex-wrap:wrap;font-size:15px}
#step .hint{font-size:13px;color:#6d5f00;font-weight:normal;margin-left:6px}
#panel .card{max-height:92%;overflow:auto}
#stopBanner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(1);background:#c62828ee;color:#fff;border:4px solid #fff;border-radius:16px;padding:10px 26px;text-align:center;font-weight:bold;box-shadow:0 6px 18px #0007;pointer-events:none;transition:top .6s,transform .6s,padding .6s;z-index:1;white-space:nowrap}

#guide{position:absolute;left:2%;top:34%;width:min(40%,400px);display:flex;gap:8px;align-items:flex-start;background:#fffdf5f2;border-left:6px solid #00897b;border-radius:12px;padding:8px 10px;box-shadow:0 4px 12px #0004;z-index:5}

#talk{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(92%,580px);display:flex;gap:10px;align-items:flex-start;background:#2b1f3af5;color:#fff;border:3px solid #ffd54f;border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px #0008;z-index:8}
#talk[hidden]{display:none}

#talk .tb{flex:1;min-width:0}

#talk .th{font-size:20px;font-weight:bold;line-height:1.35}

#lesson{position:absolute;inset:0;background:#000b;display:flex;align-items:center;justify-content:center}
#lesson[hidden]{display:none}

#lesson h3{font-size:20px;color:#1d2a3a;margin-bottom:4px}

#cardsGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}

.rbtn.lock{filter:grayscale(1);opacity:.55;cursor:default}
.rbtn img{width:54px;height:54px;object-fit:contain;flex:0 0 auto;background:#0002;border-radius:8px}
#stage{position:relative;width:100%;border-radius:12px;overflow:hidden;background:#000}

#panel{position:absolute;inset:0;background:#000a;display:flex;align-items:center;justify-content:center}

<body>
<div id="app">
 <header id="hdr">
  <h1>🚃 品詞でGO</h1>
  <div class="hud">
   <div class="box">ライフ <span id="lives">❤❤❤</span></div>
   <div class="box">得点 <b id="score">0</b></div>
   <div class="box">連続 <b id="combo">0</b></div>
   <button id="pauseBtn">⏸</button><button id="mute">🔊</button><button id="homeBtn" title="タイトルへ">🏠</button>
  </div>
 </header>
 <div id="route"></div>
 <div id="stage"><canvas id="cv"></canvas>
  <div id="panel" hidden><div class="card" id="panelCard"></div></div>
  <div id="qbox"><div id="sent">　</div><div id="step"></div></div>
  <div id="stopBanner" hidden></div>
  <div id="guide" hidden><img id="guideImg" alt=""><div class="gb"><div class="gt">天狗の旅案内</div><div class="gn" id="guideName"></div><div id="guideBody"></div></div><button id="guideX" aria-label="閉じる">×</button></div>
  <div id="talk" hidden><img id="talkImg" alt=""><div class="tb"><div id="talkBody"></div><button id="talkOk">OK</button></div></div>
  <div id="lesson" hidden><div class="card" id="lessonCard"></div></div>
  <div id="dirPanel" hidden><div class="card" id="dirCard"></div></div>
  <div id="pauseMenu" hidden><div class="pm">
   <div class="pmTitle">⏸ 一時停止中</div>
   <div class="pmSub">画面をタップすると再開</div>
   <div class="pmBtns"><button id="pmRestart">🔄 最初からやり直す</button><button id="pmRoute">🏠 ホームへ</button></div>
  </div></div>
 </div>
 <div id="ctrl">
  <button class="steer" id="leftBtn">◀</button>
  <div id="lanes"></div>
  <button class="steer" id="rightBtn">▶</button>
 </div>
 <div id="ctrl2">
  <button id="brakeBtn">▼ ブレーキ</button>
  <button id="accBtn">▲ 加速</button>
 </div>
</div>

<div class="modal" id="startScreen" hidden>
 <div class="card2">

  <div class="mapwrap" id="iwMap"></div>
  <div id="routeBtns"></div>
  <button class="btn gray" id="backHome1">← ホームへ</button>
 </div>
</div>
<div id="homePage">
 <div class="cloud" style="top:6%;animation-duration:70s">☁️</div>

function nextItem(){if(!pool.length)pool=shuffle(course.pool.slice());return pool.pop();}
function chainOf(pos){const c=[];let n=course.start;while(NODES[n]){c.push(n);n=NODES[n].opts[correctIdx(n,pos)].to;}return c;}
function makeOpts(item,n){
 const chain=chainOf(item.pos),res=[item.pos];
 for(let i=chain.length-1;i>=0&&res.length<n;i--){const add=shuffle(leavesOf(chain[i]).filter(p=>!res.includes(p)));while(add.length&&res.length<n)res.push(add.pop());}
 return shuffle(res);
}

function lastX(){const f=S.forks[S.forks.length-1];return f?f.baseX+f.offs[f.sel]:0;}
function lastS(){const f=S.forks[S.forks.length-1];return f?f.s:0;}
function addFork(at,o){
 const n=o.labels.length,offs=[...Array(n)].map((_,k)=>(k-(n-1)/2)*LANE_W);
 const f={s:at,n,offs,baseX:lastX(),sel:Math.floor(Math.random()*n),locked:false,...o};
 S.forks.push(f);return f;
}
function startWord(gap){
 const item=nextItem(),amida=S.game==='iwate'||S.words<AMIDA_WORDS;
 S.cur={item,amida};
 const at=Math.max(lastS()+gap,S.s+gap*0.8);
 if(amida)amidaFork(course.start,at);
 else{
  const names=makeOpts(item,nLanes());
  addFork(at,{kind:'direct',labels:names,subs:names.map(()=>''),correct:names.indexOf(item.pos)});
 }
 showQuestion();
}
function amidaFork(node,at){
 const o=NODES[node].opts;
 S.cur.node=node;
 if(S.game==='iwate'&&ROUTE.lessons.includes(node)&&!S.lessonShown[node]){S.lessonShown[node]=true;S.pendingLesson=node;}
 addFork(at,{kind:'amida',node,labels:o.map((x,i)=>NODES[x.to]?SHORT[node][i]:x.to),subs:o.map((x,i)=>NODES[x.to]?'':SHORT[node][i]),correct:correctIdx(node,S.cur.item.pos)});
}

function trackX(s){let x=0;for(const f of S.forks){if(s<=f.s)break;x=f.baseX+f.offs[f.sel]*sm((s-f.s)/DIV);}return x;}
function curve(s){return 16*Math.sin(s/240)+8*Math.sin(s/95+1);}
function curveD(s){return 16/240*Math.cos(s/240)+8/95*Math.cos(s/95+1);}
function rx(s,x){return x+curve(s)-curve(S.s)-curveD(S.s)*(s-S.s)-S.camX;}
function proj(s,x,y){const z=s-S.s;return {X:W/2+rx(s,x)*F/z,Y:HOR+(CAM_H-y)*F/z,k:F/z,z};}

function passFork(f){
 f.locked=true;
 const ok=f.sel===f.correct;
 sfx.clack();
 if(ok){
  const mult=clamp(S.v/vBase(),0.5,1.4);
  S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);
  if(f.kind==='amida'&&NODES[NODES[f.node].opts[f.correct].to]){
   const pts=Math.round(40*mult);S.score+=pts;floatText('⭕ '+f.labels[f.correct]+' +'+pts,'#69f0ae');sfx.ok(0);
   if(S.game==='iwate')vanishFakes(f);
   amidaFork(NODES[f.node].opts[f.correct].to,f.s+Math.max(95,S.v*3.6));showQuestion();
  }else{
   const pts=Math.round(100*mult*(1+Math.min(S.combo,20)*0.1));S.score+=pts;S.oks++;
   floatText('⭕ '+S.cur.item.pos+'！ +'+pts+(mult>1.15?' 加速ボーナス':''),'#ffeb3b');sfx.ok(1);
   if(S.game==='zenkoku')tokenDone(true);else{if(S.game==='iwate'){vanishFakes(f);hitBoss();}S.words++;nextLeg();if(S.game==='iwate')maybeCard(S.cur?S.cur.item.pos:f.labels[f.correct]);}
  }
 }else{
  S.mode='wrong';S.wrongAt=f.s+26;
  const it=S.cur.item;let node=f.node;
  if(f.kind==='direct'){const chosen=f.labels[f.sel];node=chainOf(it.pos).find(n=>correctIdx(n,it.pos)!==correctIdx(n,chosen))||chainOf(it.pos)[0];}
  S.crash={item:it,node,chosen:f.labels[f.sel],kind:f.kind,label:f.labels[f.correct]};
 }
 updateHud();
}

 S.mode='crash';S.crashT=0;S.shake=1;S.lives--;S.combo=0;

const GEN=(()=>{
 const c=window.QUESTION_DATA&&window.QUESTION_DATA.cats&&window.QUESTION_DATA.cats.hinshi;
 const single=[],groups={};
 if(!c)return {single,sentences:[]};
 for(const x of c.items){
  if(!Array.isArray(x.c))continue;
  let pos=x.c[x.a];if(pos==='代名詞')pos='名詞';
  if(!POS_COLOR[pos])continue;
  const m=String(x.q).match(/^(.*)《(.*?)》(.*)$/);
  if(m){
   const it={s:m[1]+'【'+m[2]+'】'+m[3],pos,base:'',note:x.e||'',w:m[2],at:m[1].length,lv:x.lv};
   const plain=m[1]+m[2]+m[3];(groups[plain]=groups[plain]||[]).push(it);single.push(it);
  }else single.push({s:'【'+x.q+'】',pos,base:'',note:x.e||'',lv:x.lv});
 }
 const sentences=Object.entries(groups).filter(([k,v])=>v.length>=3).map(([text,v])=>({text,tokens:v.sort((a,b)=>a.at-b.at)}));
 return {single,sentences};
})();
// 言い切りの形が分からない問題（品詞ジャンル）にも使える説明
function explain(it,nid){
 const w='「'+splitS(it.s)[1]+'」',b=it.base?'「'+it.base+'」':'',i=correctIdx(nid,it.pos);
 const T={
  J1:[w+'は、それだけで意味がわかり、文節のはじめに来る → 自立語',w+'は、それだけでは文節を作れず、ほかの言葉のあとにつく → 付属語'],
  J2:[w+'は、あとにつく言葉で形が変わる'+(b?'（言い切りの形は'+b+'）':'')+' → 活用する',w+'は、形が変わらない → 活用しない'],
  J3:['言い切りの形'+(b?b+'は':'が')+'、ウ段の音で終わる → 動詞','言い切りの形'+(b?b+'は':'が')+'、「い」で終わる → 形容詞','言い切りの形'+(b?b+'は':'が')+'、「だ」で終わる → 形容動詞'],
  J4:[w+'は、「が」「は」をつけて主語になれる → 名詞（体言）',w+'は、主語にならない'],
  J5:[w+'は、あとの言葉をくわしくする（修飾語になる）',w+'は、修飾語にならない'],
  J6:[w+'は、主に用言（動き・様子の言葉）をくわしくする → 副詞',w+'は、体言（名詞）だけをくわしくする → 連体詞'],
  J7:[w+'は、前とあとをつなぐ（接続語）→ 接続詞',w+'は、よびかけ・返事・感動などを表し、ほかと直接つながらない（独立語）→ 感動詞'],
  J8:[w+'は、形が変わる'+(b?'（言い切りの形は'+b+'）':'')+' → 助動詞',w+'は、形が変わらない → 助詞'],
 };
 return T[nid][i];
}

function geoXY(n){const g=GEO[n];if(!g||typeof HT_MAP==='undefined')return null;return [(g[1]-HT_MAP.lon0)*HT_MAP.cos*HT_MAP.s,(HT_MAP.lat0-g[0])*HT_MAP.s];}

function routePts(st){
 const known=st.map((n,i)=>geoXY(n)?i:-1).filter(i=>i>=0);
 return st.map((n,i)=>{const p=geoXY(n);if(p)return p;
  let a=known.filter(k=>k<i).pop(),b=known.find(k=>k>i);if(a===undefined)a=b;if(b===undefined)b=a;
  const pa=geoXY(st[a]),pb=geoXY(st[b]),t=b===a?0:(i-a)/(b-a);return [pa[0]+(pb[0]-pa[0])*t,pa[1]+(pb[1]-pa[1])*t];});
}

function mapSVG(vb,lines,dots,extra,pxH,useIw){

  if(D.emoji)o+='<text x="'+X.toFixed(1)+'" y="'+(Y-r-2*k).toFixed(1)+'" font-size="'+((D.es||16)*k).toFixed(1)+'" text-anchor="middle">'+D.emoji+'</text>';
  if(D.label)o+='<text x="'+(X+(D.lx===undefined?r+4*k:D.lx*k)).toFixed(1)+'" y="'+(Y+(D.ly===undefined?4*k:D.ly*k)).toFixed(1)+'" font-size="'+((D.fs||12)*k).toFixed(1)+'" font-weight="bold" fill="#222" stroke="#fff" stroke-width="'+(3*k).toFixed(2)+'" paint-order="stroke"'+(D.anchor?' text-anchor="'+D.anchor+'"':'')+'>'+D.label+'</text>';}
 return o+(extra||'')+'</svg>';

const sfx={

 init(){if(!this.ac){try{this.ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(this.ac&&this.ac.state==='suspended')this.ac.resume();},

function update(dt){
 if(!S)return;
 S.floats.forEach(f=>f.life+=dt);S.floats=S.floats.filter(f=>f.life<1.6);
 S.parts.forEach(p=>{p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t==='spark')p.vy+=500*dt;else if(p.t==='magic')p.vy-=30*dt;else p.r+=dt*30;});S.parts=S.parts.filter(p=>p.life<p.max);
 if(S.shake>0)S.shake=Math.max(0,S.shake-dt*1.2);
 if(!running||paused||S.panelOpen||S.choosing||S.lessonOpen)return;
 if(S.pendingLesson){const n=S.pendingLesson;S.pendingLesson=null;showLesson(n);}
 if(!(S.station&&S.station.state==='stopped'))hideGuide();
 if(S.talkCur)holdAhead();
 const base=vBase(),st=S.station,inSt=st&&st.state==='approach'&&S.s>st.s-320;
 if(S.mode==='crash'){
  S.v=Math.max(0,S.v-30*dt);S.roll+=(0.22-S.roll)*dt*4;S.crashT+=dt;
  if(Math.random()<0.6)S.parts.push({x:W/2+(Math.random()-0.5)*W*0.6,y:HOR+(H-DASH-HOR)*0.5,vx:(Math.random()-0.5)*40,vy:-30-Math.random()*40,r:10+Math.random()*10,life:0,max:1.4,t:'smoke'});
  if(S.crashT>1.3&&!S.panelOpen)openPanel();
 }else if(st&&st.state==='stopped'){S.v=0;}
 else{
  if(keys.down){S.v-=(inSt?4.5:8)*dt;S.v=Math.max(inSt?0:6,S.v);}
  else{let tg=base*(keys.up?1.4:1);
  if(S.v<tg)S.v=Math.min(tg,S.v+(keys.up?6:S.v<base*0.6?6:3)*dt);else S.v=Math.max(tg,S.v-3*dt);}
 }
 S.s+=S.v*dt;
 S.tickAcc+=S.v*dt;if(S.tickAcc>20){S.tickAcc=0;sfx.joint();}
 const f=upcoming();
 if(f&&S.s>=f.s&&S.mode==='run')passFork(f);
 if(S.mode==='wrong'&&S.s>=S.wrongAt)doCrash();
 stationUpdate(dt);
 // ハンドルとカメラ
 const g=upcoming();let leanT=0,wheelT=0;
 if(g&&S.mode==='run'&&g.s-S.s<140){const c=(g.sel-(g.n-1)/2);leanT=c*0.9;wheelT=c/Math.max(1,(g.n-1)/2)*1.1;}
 S.lean+=(leanT-S.lean)*Math.min(1,dt*3);S.wheel+=(wheelT-S.wheel)*Math.min(1,dt*8);
 S.camX=trackX(S.s)+S.lean;
 S.forks=S.forks.filter(x=>x.s>S.s-400||x===S.forks[S.forks.length-1]);
}

function ribbon(ss,xs,a,b,y,col){
 ctx.fillStyle=col;ctx.beginPath();
 for(let i=0;i<ss.length;i++){const p=proj(ss[i],xs[i]+a,y);i?ctx.lineTo(p.X,p.Y):ctx.moveTo(p.X,p.Y);}
 for(let i=ss.length-1;i>=0;i--){const p=proj(ss[i],xs[i]+b,y);ctx.lineTo(p.X,p.Y);}
 ctx.closePath();ctx.fill();
}

 const xs=ss.map(fn);

 // 枕木（近くだけ・まとめて1回で塗る）

 const e=Math.min(s1,S.s+QS[QUAL].sleep);
 for(let s=Math.ceil(s0/2.4)*2.4;s<=e;s+=2.4){const x=fn(s),p1=proj(s,x-1.1,0.05),p2=proj(s,x+1.1,0.05),p3=proj(s+0.3,x+1.1,0.05),p4=proj(s+0.3,x-1.1,0.05);ctx.moveTo(p1.X,p1.Y);ctx.lineTo(p2.X,p2.Y);ctx.lineTo(p3.X,p3.Y);ctx.lineTo(p4.X,p4.Y);ctx.closePath();}
 ctx.fill();
 ribbon(ss,xs,-0.62,-0.5,0.12,'#cfd8dc');ribbon(ss,xs,0.5,0.62,0.12,'#cfd8dc');

  if(st.stop){const x=trackX(st.s)+2.6,b=proj(st.s,x,0),t=proj(st.s,x,2.6),c=proj(st.s,x,2.6);
  ctx.strokeStyle='#333';ctx.lineWidth=Math.max(1,0.12*b.k);ctx.beginPath();ctx.moveTo(b.X,b.Y);ctx.lineTo(t.X,t.Y);ctx.stroke();
  const sz=1.1*b.k;ctx.fillStyle='#fff';ctx.fillRect(c.X-sz/2,c.Y-sz,sz,sz);ctx.fillStyle='#e53935';ctx.fillRect(c.X-sz/2,c.Y-sz,sz,sz*0.35);
  ctx.fillStyle='#222';ctx.font='bold '+Math.max(6,sz*0.3)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('停止',c.X,c.Y-sz*0.35);}
}
 // 駅名標（ホームの上に2か所）
 for(const ns of [st.s-35,st.s-110]){
  if(ns-S.s<=NEAR||ns-S.s>FAR)continue;
  const nx=trackX(ns)+5.2,n1=proj(ns,nx-2.4,3.4),n2=proj(ns,nx+2.4,1.9),w=n2.X-n1.X,h=n2.Y-n1.Y;
  const pb=proj(ns,nx,1.0);ctx.strokeStyle='#555';ctx.lineWidth=Math.max(1,0.1*pb.k);ctx.beginPath();ctx.moveTo(pb.X,pb.Y);ctx.lineTo(pb.X,n2.Y);ctx.stroke();
  ctx.fillStyle='#fff';ctx.fillRect(n1.X,n1.Y,w,h);ctx.fillStyle=lineColor();ctx.fillRect(n1.X,n2.Y-h*0.2,w,h*0.2);
  if(h>6){ctx.fillStyle='#222';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 10px sans-serif';const fs=Math.min(h*0.5,w*0.88/ctx.measureText(st.name).width*10);ctx.font='bold '+fs+'px sans-serif';ctx.fillText(st.name,n1.X+w/2,n1.Y+h*0.42);}
 }
}
function drawDash(){
 const top=H-DASH;
 // 窓わく
 ctx.fillStyle='#1c2229';
 ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W*0.05,0);ctx.lineTo(W*0.1,top);ctx.lineTo(0,top);ctx.fill();
 ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(W*0.95,0);ctx.lineTo(W*0.9,top);ctx.lineTo(W,top);ctx.fill();
 ctx.fillRect(0,0,W,H*0.025);
 // 運転台
 ctx.fillStyle=DASHG;ctx.beginPath();ctx.moveTo(0,top+DASH*0.12);ctx.quadraticCurveTo(W/2,top-DASH*0.12,W,top+DASH*0.12);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 // 速度計
 const cx=Math.max(DASH*0.7,W*0.13),cy=top+DASH*0.6,r=DASH*0.42,kmh=S?S.v*3.6*(S.game==='zenkoku'?3.2:1):0,VM=S&&S.game==='zenkoku'?400:160;
 ctx.fillStyle='#111';ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();ctx.strokeStyle='#90a4ae';ctx.lineWidth=2;ctx.stroke();
 for(let v=0;v<=VM;v+=VM/8){const a=Math.PI*0.75+v/VM*Math.PI*1.5;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r*0.8,cy+Math.sin(a)*r*0.8);ctx.lineTo(cx+Math.cos(a)*r*0.95,cy+Math.sin(a)*r*0.95);ctx.stroke();}
 const na=Math.PI*0.75+clamp(kmh,0,VM)/VM*Math.PI*1.5;ctx.strokeStyle='#ff5252';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(na)*r*0.85,cy+Math.sin(na)*r*0.85);ctx.stroke();
 ctx.fillStyle='#fff';ctx.font='bold '+Math.round(r*0.36)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(Math.round(kmh),cx,cy+r*0.45);
 // ハンドル
 const hx=W/2,hy=H+DASH*0.35,hr=DASH*0.95;
 ctx.save();ctx.translate(hx,hy);ctx.rotate(S?S.wheel:0);
 ctx.strokeStyle='#0d0f12';ctx.lineWidth=DASH*0.16;ctx.beginPath();ctx.arc(0,0,hr,0,7);ctx.stroke();
 ctx.strokeStyle='#596470';ctx.lineWidth=DASH*0.08;ctx.beginPath();ctx.arc(0,0,hr,Math.PI*1.1,Math.PI*1.9);ctx.stroke();
 ctx.strokeStyle='#2a3038';ctx.lineWidth=DASH*0.1;for(const a of [-Math.PI/2,Math.PI*0.17,Math.PI*0.83]){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*hr,Math.sin(a)*hr);ctx.stroke();}
 ctx.fillStyle='#e53935';ctx.beginPath();ctx.arc(0,-hr,DASH*0.06,0,7);ctx.fill();
 ctx.restore();
 // 加速・ブレーキ表示
 const lx=W-Math.max(DASH*0.9,W*0.14),ly=top+DASH*0.35;
 const lamp=(t,on,c,y)=>{ctx.fillStyle=on?c:'#333';rr(lx,y,Math.max(DASH*1.1,W*0.1),DASH*0.22,5);ctx.fill();ctx.fillStyle=on?'#111':'#777';ctx.font='bold '+Math.round(DASH*0.14)+'px sans-serif';ctx.textAlign='center';ctx.fillText(t,lx+Math.max(DASH*1.1,W*0.1)/2,y+DASH*0.115);};
 lamp('加速',keys.up,'#64b5f6',ly);lamp('ブレーキ',keys.down,'#ff8a80',ly+DASH*0.28);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(){
 ctx.save();
 ctx.fillStyle=SKY;ctx.fillRect(0,0,W,H);
 if(!S){drawDash();ctx.restore();return;}
 if(S.shake>0)ctx.translate((Math.random()-0.5)*S.shake*18,(Math.random()-0.5)*S.shake*18);
 ctx.translate(W/2,HOR);ctx.rotate(S.roll);ctx.translate(-W/2,-HOR);
 // 山
 const off=(-curveD(S.s)*W*2-S.s*0.02)%(W)+W;
 ctx.fillStyle='#7a9cb8';ctx.beginPath();ctx.moveTo(-W,HOR);
 for(let x=-W;x<=W*2;x+=W/12){const h=(0.5+0.5*Math.sin((x+off)/W*Math.PI*6))*HOR*0.25+HOR*0.05;ctx.lineTo(x,HOR-h);}
 ctx.lineTo(W*2,HOR);ctx.fill();
 // 地面
 ctx.fillStyle='#6fae55';ctx.fillRect(-W,HOR,W*3,H);
 ctx.fillStyle='#66a44e';
 for(let b=Math.floor((S.s+NEAR)/12);b*12<S.s+FAR;b++){if(b%2)continue;const z1=Math.max(NEAR,b*12-S.s),z2=b*12+12-S.s;const y1=HOR+CAM_H*F/z1,y2=HOR+CAM_H*F/z2;ctx.fillRect(-W,y2,W*3,y1-y2);}
 // 線路
 const up=upcoming();
 for(const f of S.forks){
  if(!f.locked&&f!==up)continue;
  const end=f===up?S.s+FAR:f.s+75;
  const fade=f.vanishAt!==undefined?Math.max(0,1-(performance.now()-f.vanishAt)/700):1;
  if(fade<=0)continue;
  ctx.globalAlpha=fade;
  for(let k=0;k<f.n;k++){if(f.locked&&k===f.sel)continue;drawTrackLine(s=>f.baseX+f.offs[k]*sm((s-f.s)/DIV),f.s,end);}
  ctx.globalAlpha=1;
 }
 drawTrackLine(trackX,S.s,up?up.s:S.s+FAR);
 if(S.station)drawStation(S.station);
 // 電柱・木
 const objs=[];
 for(let p=Math.ceil((S.s+NEAR)/38)*38;p<S.s+FAR;p+=38){objs.push({z:p-S.s,f:()=>{const x=sceneryX(p);drawPole(p,x-11);drawPole(p,x+11);}});}
 for(let p=Math.ceil((S.s+NEAR)/17)*17;p<S.s+FAR;p+=17){const h1=hash(p),h2=hash(p+7);if(h1<QS[QUAL].trees)objs.push({z:p-S.s,f:()=>drawTree(p,sceneryX(p)+(h2<0.5?-1:1)*(15+h1*30),5+h2*5)});}
 for(const f of S.forks){if(f.s-14>S.s)objs.push({z:f.s-14-S.s,f:()=>drawGantry(f)});}
 objs.sort((a,b)=>b.z-a.z).forEach(o=>o.f());
 ctx.restore();ctx.save();
 // ずれた赤
 if(S.mode==='crash'){ctx.fillStyle='rgba(200,0,0,'+Math.min(0.35,S.crashT*0.4)+')';ctx.fillRect(0,0,W,H);}
 for(const p of S.parts){const a=1-p.life/p.max;ctx.fillStyle=p.t==='spark'?'rgba(255,200,60,'+a+')':p.t==='magic'?'rgba(206,147,216,'+a+')':'rgba(70,70,70,'+a*0.5+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
 drawDash();
 if(S.mode==='crash'){ctx.save();ctx.translate(W/2,HOR*0.9);ctx.rotate(-0.08);const fs=Math.min(W*0.13,90);ctx.font='900 '+fs+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=8;ctx.strokeStyle='#fff';ctx.strokeText('脱線！',0,0);ctx.fillStyle='#d32f2f';ctx.fillText('脱線！',0,0);ctx.restore();}
 S.floats.forEach((f,i)=>{const a=Math.min(1,(1.6-f.life)*2);ctx.globalAlpha=a;const fs=Math.round(Math.min(30,W*0.04));ctx.font='900 '+fs+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';const y=HOR*0.62-f.life*30-i*fs*1.2;ctx.lineWidth=6;ctx.strokeStyle='#000a';ctx.strokeText(f.t,W/2,y);ctx.fillStyle=f.c;ctx.fillText(f.t,W/2,y);ctx.globalAlpha=1;});
 // 次の分かれ道までの距離
 if(up&&S.mode==='run'&&!S.station&&!S.talkCur){const d=up.s-S.s;ctx.fillStyle='#000a';rr(W/2-70,8,140,26,8);ctx.fill();ctx.fillStyle=d<60?'#ff8a80':'#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('分かれ道まで '+Math.max(0,Math.round(d))+'m',W/2,21);}
 if(S.station&&S.station.state==='approach'){const d=Math.max(0,Math.round(S.station.s-S.s)),el=document.getElementById('sbDist');if(el)el.textContent='停止線まで '+d+'m'+(d<S.v*S.v/9+10?'　↓ブレーキ！':'');}
 ctx.restore();
}
let last=0,acc=0;
function loop(t){
 requestAnimationFrame(loop);
 const raw=last?(t-last)/1000:0;last=t;
 if(QS[QUAL].fps<60){acc+=raw;if(acc<1/QS[QUAL].fps-0.004)return;const dt=Math.min(0.05,acc);acc=0;update(dt);draw();return;}
 update(Math.min(0.05,raw));draw();measure(raw);
}
resize();showHome();requestAnimationFrame(loop);
if(window.ResizeObserver)new ResizeObserver(()=>{if(W)updHor();}).observe($('qbox'));
</script>
