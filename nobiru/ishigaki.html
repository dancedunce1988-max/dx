<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>のびる読解</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top">
  <h1 id="mainTitle"></h1>
  <p class="sub ui" id="subTitle"></p>
  <a class="back ui" href="../kokugo_app.html">← アプリへ戻る</a>
</div>

<div class="main">
  <div class="pane pane-text" id="paneText">
    <div class="inner">
      <div class="tools ui">
        <button id="b-conn">つなぎ</button>
        <button id="b-dem">指示語</button>
        <button id="b-role">文の役割</button>
        <button id="b-cont">対比</button>
        <button id="b-map">構造図</button>
        <span class="gap"></span>
        <button class="sz" id="b-small">小</button>
        <button class="sz" id="b-large">大</button>
      </div>
      <p class="prog ui" id="prog"></p>
      <div class="legend ui" id="legend"></div>
      <div class="demnote ui" id="demnote"></div>
      <div class="text-wrap" id="textWrap">
        <svg class="dem-svg" id="demSvg"></svg>
        <article id="text"></article>
      </div>
      <div id="map"></div>
    </div>
  </div>
  <div class="pane pane-q" id="paneQ"><div class="inner" id="qzone"></div></div>
</div>

<div class="foot">
  <span class="cap ui">記録</span>
  <div class="marks ui" id="marks"></div>
  <span class="tally ui" id="tally"></span>
</div>

<div class="gloss" id="gloss" role="dialog" aria-live="polite">
  <div class="gloss-in">
    <button class="close ui" id="glossClose" aria-label="閉じる">×</button>
    <div class="word" id="gWord"></div>
    <div class="yomi ui" id="gYomi"></div>
    <div class="mean" id="gMean"></div>
  </div>
</div>

<script src="texts/ishigaki.js"></script>
<script src="engine.js"></script>
</body>
</html>
