<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>のびる読解</title>
<link rel="stylesheet" href="style.css?v=11.79">
</head>
<body>

<div class="top">
  <h1 id="mainTitle"></h1>
  <p class="sub ui" id="subTitle"></p>
  <a class="back ui" href="../kokugo_app.html">← ホームに戻る</a>
</div>

<div class="main">
  <div class="pane pane-text" id="paneText">
    <div class="inner">
      <div class="tools ui">
        <button id="b-conn">つなぎ</button>
        <button id="b-dem">指示語</button>
        <button id="b-role">文の役割</button>
        <button id="b-cont">対比</button>
        <button id="b-map">構造図</button>
        <span class="gap"></span>
        <button class="sz" id="b-small">小</button>
        <button class="sz" id="b-large">大</button>
      </div>
      <p class="prog ui" id="prog"></p>
      <div class="legend ui" id="legend"></div>
      <div class="demnote ui" id="demnote"></div>
      <div class="text-wrap" id="textWrap">
        <svg class="dem-svg" id="demSvg"></svg>
        <article id="text"></article>
      </div>
      <div id="map"></div>
      <button class="fulltrBtn ui" id="b-fulltr" hidden>全文訳を見る</button>
    </div>
  </div>
  <div class="pane pane-q" id="paneQ"><div class="inner">
    <div class="q-tools ui">
      <button class="sz" id="q-small">小</button>
      <button class="sz" id="q-large">大</button>
    </div>
    <div id="qzone"></div>
  </div></div>
</div>

<div class="foot">
  <div class="qprog ui" id="qprog">
    <span class="qprog-label" id="qprogLabel">問題 -／-</span>
    <div class="qprog-bar"><div class="qprog-fill" id="qprogFill"></div></div>
  </div>
  <span class="cap ui">記録</span>
  <div class="marks ui" id="marks"></div>
  <button class="wordsBtn ui" id="b-words">確認した語句 <span id="wordsCount">0</span></button>
  <span class="tally ui" id="tally"></span>
</div>

<div class="gloss" id="gloss" role="dialog" aria-live="polite">
  <div class="gloss-in">
    <button class="close ui" id="glossClose" aria-label="閉じる">×</button>
    <span class="badge ui" id="gBadge" hidden>重要語句</span>
    <div class="word" id="gWord"></div>
    <div class="yomi ui" id="gYomi"></div>
    <div class="mean" id="gMean"></div>
  </div>
</div>

<div class="words-sheet ui" id="wordsSheet" role="dialog" aria-live="polite">
  <div class="words-sheet-in">
    <button class="close ui" id="wordsClose" aria-label="閉じる">×</button>
    <h2>確認した語句</h2>
    <div id="wordsList"></div>
  </div>
</div>

<div class="words-sheet ui" id="fullTrSheet" role="dialog" aria-live="polite">
  <div class="words-sheet-in">
    <button class="close ui" id="fullTrClose" aria-label="閉じる">×</button>
    <h2>全文訳（開示された段落まで）</h2>
    <div id="fullTrList"></div>
  </div>
</div>

<script src="texts/mujun.js?v=11.79"></script>
<script src="engine.js?v=11.79"></script>
</body>
</html>
