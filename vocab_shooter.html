<title>ボキャブラ・シューティング</title>
<!-- ボキャブラ・シューティング 大画面版（2026-10-03〜、試作）。
     「画面が小さくて見えにくい」という声を受け、炎狼ラン(enro_run.html)と同じく本体から切り離した別ページにして、
     ブラウザの画面いっぱいをゲーム画面に使う。本体版（kokugo_app.htmlのvs*関数）は内部解像度340×600/400×700の
     縦長canvasを最大400px幅で表示していたため、横長のPC・Chromebookでは画面の3分の1ほどしか使えず、
     オーブの文字も実寸10px前後まで縮んでいた。
     こちらはcanvasの大きさ＝実際の表示サイズ（devicePixelRatio倍で描くのでにじまない）にし、4本のレーンを画面の横幅いっぱいに
     割り当てる。オーブの文字の大きさはレーンの幅と画面の高さから決める（横長の画面ほど大きくなる）。
     ルール・得点・出題レベル・アイテムは本体版と同じ。落下速度は「画面の高さに対する割合」でそろえ、
     リフレッシュレートの高い画面で速くなりすぎないよう経過時間で動かす。
     2026-10-03（ver12.94）、教員の指示でこちらを正式版にした（ミニゲーム一覧から移ってくる。ストーリー第二部のボス戦は本体内の版のまま）。
     本体のセーブデータ(st)は読むだけで書きかえない。1問ごとの正誤とゲームの得点を localStorage の VS_PENDING_LSKEY に書き置き、
     本体がホーム画面を開くときに、本体内の版と同じ処理（record("goi")・イベント経験値・自己ベストと100点きざみの経験値）で反映する
     （kokugo_app.htmlのvsApplyPendingResults参照）。正誤は答えるたびに書くので、途中でやめてもそこまでの分は反映される
     （得点・自己ベストは本体内の版と同じく、ゲームオーバーまで遊んだときだけ）。
     問題は本体と同じ kokugo_data.js の「語彙」(goi)のうち vsLv(1〜8) が付いたもの。読み仮名表 VS_WORD_YOMI は
     kokugo_app.html からの写し（本採用するときは共通のjsファイルに切り出す）。 -->
<script src="kokugo_data.js"></script>
<style>
  :root{
    --bg1:#05050f; --bg2:#0d0d24; --bg3:#1a1a40;
    --ink:#f2f5ff; --sub:#aab8dd; --gold:#ffe66d; --pink:#ff6b9d; --cyan:#7ee8fa; --heart:#ff5577;
    --panel:rgba(255,255,255,.07); --line:rgba(255,255,255,.16);
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:radial-gradient(ellipse at 50% -10%, var(--bg3) 0%, var(--bg2) 45%, var(--bg1) 100%);
    background-color:var(--bg1);
    font-family:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased;
    user-select:none; -webkit-user-select:none;
  }
  button{ font-family:inherit; cursor:pointer; }
  #app{ display:flex; flex-direction:column; height:100vh; height:100dvh; }

  /* 上の帯：左＝ライフ・レベル／まん中＝お題（いちばん大きく）／右＝得点・ベスト */
  .top{
    display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:12px;
    padding:8px 14px; border-bottom:1px solid var(--line); background:rgba(0,0,0,.25);
  }
  .top .left, .top .right{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .top .right{ align-items:flex-end; text-align:right; }
  .lives{ font-size:clamp(18px, 3.2vh, 28px); letter-spacing:2px; white-space:nowrap; }
  .lives .on{ color:var(--heart); } .lives .off{ color:rgba(255,85,119,.25); }
  .lvname{ font-size:clamp(12px, 1.9vh, 16px); color:var(--cyan); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .score{ font-size:clamp(22px, 4vh, 38px); font-weight:bold; color:var(--gold); font-variant-numeric:tabular-nums; line-height:1.1; }
  .best{ font-size:clamp(12px, 1.9vh, 16px); color:var(--sub); white-space:nowrap; }
  .word-box{ text-align:center; min-width:0; }
  .word-label{ font-size:clamp(11px, 1.7vh, 14px); color:var(--sub); letter-spacing:2px; }
  .word{ font-size:clamp(28px, 7vh, 64px); font-weight:bold; letter-spacing:3px; line-height:1.15; white-space:nowrap; text-shadow:0 0 18px rgba(126,232,250,.45); }
  .word .yomi{ font-size:.42em; font-weight:normal; letter-spacing:0; color:var(--sub); margin-left:4px; }
  /* 幅のせまい画面（スマホの縦持ち）では、お題を2段目に回して左右の表示と重ならないようにする */
  @media (max-width:640px){
    .top{ grid-template-columns:1fr 1fr; row-gap:2px; }
    .word-box{ grid-column:1 / -1; grid-row:2; }
    .word{ font-size:clamp(26px, 9vw, 40px); white-space:normal; }
  }

  .field{ position:relative; flex:1; min-height:0; touch-action:none; }
  #cv{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  .fire{
    position:absolute; right:16px; bottom:18px; z-index:2;
    width:clamp(72px, 12vh, 104px); height:clamp(72px, 12vh, 104px); border-radius:50%;
    border:3px solid rgba(255,255,255,.5);
    background:radial-gradient(circle at 35% 30%, #ff9dc0, #ff6b9d 60%, #c4498a 100%);
    color:#fff; font-weight:bold; font-size:clamp(12px, 2vh, 16px); letter-spacing:1px;
    box-shadow:0 4px 16px rgba(255,107,157,.55), inset 0 -3px 6px rgba(0,0,0,.25);
  }
  .fire:active{ transform:scale(.92); }
  /* 指で操作する端末にだけSHOOTボタンを出す（PCはキーボード・マウス） */
  @media (hover:hover) and (pointer:fine){ .fire{ display:none; } }

  .pill{ border:1px solid var(--line); background:rgba(0,0,0,.45); color:var(--ink); border-radius:999px; font-size:12px; padding:3px 12px; margin-top:4px; }
  .pill:hover{ background:rgba(255,255,255,.12); }

  .banner{
    position:absolute; top:38%; left:50%; z-index:3; transform:translate(-50%,-50%) scale(.85);
    padding:14px 28px; border-radius:16px; text-align:center;
    background:linear-gradient(135deg, rgba(196,113,237,.94), rgba(126,232,250,.94));
    color:#0a0a1a; font-weight:bold; font-size:clamp(18px, 3.6vh, 30px); letter-spacing:1px;
    box-shadow:0 0 30px rgba(196,113,237,.6);
    opacity:0; pointer-events:none; white-space:nowrap; transition:opacity .35s ease, transform .35s ease;
  }
  .banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  /* スタート・結果の画面（ゲーム画面の上に重ねる） */
  .overlay{
    position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
    padding:16px; background:rgba(3,3,14,.86); overflow-y:auto;
  }
  .overlay[hidden]{ display:none; }
  .box{
    width:min(760px, 100%); max-height:calc(100dvh - 32px); overflow-y:auto;
    padding:clamp(18px, 3vh, 32px) clamp(18px, 3vw, 40px); border-radius:20px;
    background:rgba(20,22,50,.92); border:1px solid var(--line); text-align:center;
    display:flex; flex-direction:column; gap:12px;
  }
  .box h1{
    font-size:clamp(26px, 5vh, 44px); letter-spacing:3px;
    background:linear-gradient(90deg,#7ee8fa,#eec0c6); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .box .lead{ font-size:clamp(15px, 2.4vh, 20px); line-height:1.7; }
  .how{ list-style:none; display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:8px; text-align:left; }
  .how li{ padding:10px 14px; border-radius:12px; background:var(--panel); border:1px solid var(--line); font-size:clamp(14px, 2.1vh, 17px); line-height:1.6; }
  .how b{ color:var(--gold); }
  .kbd{ display:inline-block; min-width:1.6em; padding:0 6px; border:1px solid rgba(255,255,255,.4); border-bottom-width:3px; border-radius:6px; font-size:.9em; text-align:center; background:rgba(255,255,255,.08); }
  .btns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn{
    padding:14px 40px; font-size:clamp(16px, 2.6vh, 20px); font-weight:bold; color:#fff; border:none; border-radius:30px;
    background:linear-gradient(135deg,#ff6b9d,#c471ed); box-shadow:0 4px 16px rgba(196,113,237,.5); letter-spacing:1px;
  }
  .btn.secondary{ background:rgba(255,255,255,.1); box-shadow:none; border:1px solid var(--line); }
  .best-line{ color:var(--sub); font-size:15px; }
  .best-line b{ color:var(--gold); font-size:22px; }
  .big{ font-size:clamp(40px, 9vh, 72px); font-weight:bold; color:var(--gold); line-height:1.1; }
  .newbest{ font-weight:bold; color:var(--gold); font-size:clamp(16px, 2.6vh, 22px); }
  .xp{
    font-size:clamp(14px, 2.2vh, 18px); font-weight:bold; line-height:1.7; color:#3a2a00;
    background:linear-gradient(135deg,#ffe66d,#ffb347); border-radius:12px; padding:10px 16px;
    box-shadow:0 3px 12px rgba(255,179,71,.45);
  }

  .wrong{ text-align:left; display:flex; flex-direction:column; gap:6px; }
  .wrong .ttl{ text-align:center; color:var(--sub); font-size:14px; }
  .wrong .it{ padding:8px 12px; border-radius:10px; background:rgba(255,255,255,.07); font-size:clamp(14px, 2.1vh, 17px); line-height:1.5; }
  .wrong .q{ font-weight:bold; color:var(--gold); margin-right:8px; }
  .note{ font-size:12px; color:var(--sub); }
  mark.tech-mark{ background:none; color:var(--gold); }
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const STORE_KEY = "kokugoTrainingStats_v5";      // 本体のセーブ（読むだけ）
const VS_PENDING_LSKEY = "kokugo_vs_pending_v1";  // 本体への書き置き
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function markQuestionHtml(q){
  return String(q).split(/(《[^》]*》)/).map(part => {
    const m = part.match(/^《([^》]*)》$/);
    return m ? `<mark class="tech-mark">${esc(m[1])}</mark>` : esc(part);
  }).join("");
}
function shuffledOrder(n){
  const a = [...Array(n).keys()];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function loadPending(){
  let o = null;
  try{ o = JSON.parse(localStorage.getItem(VS_PENDING_LSKEY)); }catch(e){}
  if(!o || typeof o !== "object") o = {};
  if(!Array.isArray(o.ans)) o.ans = [];
  if(!Array.isArray(o.scores)) o.scores = [];
  return o;
}
const pendingOk = () => loadPending().ans.filter(a => Array.isArray(a) && a[1]).length;   // まだ本体に反映されていない正解の数
function pushPending(fn){ const o = loadPending(); fn(o); try{ localStorage.setItem(VS_PENDING_LSKEY, JSON.stringify(o)); }catch(e){} }
/* 自己ベストと「すでに経験値をもらった100点の段」：本体のセーブの値に、まだ本体へ反映されていない書き置きの得点を重ねて求める */
function loadSave(){
  let st = null;
  try{ st = JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){}
  st = st || {};
  const pend = loadPending().scores.map(Number).filter(n => n > 0);
  const best = Math.max(st.vocabShooterHighScore || 0, ...pend, 0);
  let tier = st.vocabShooterXpTier || 0;
  pend.forEach(n => { if(n > (st.vocabShooterHighScore || 0)) tier = Math.max(tier, Math.floor(n / 100)); });
  // 語彙のレベル表示（正解ごとに＋1。本体のrecord()と同じく、問題の解放を手動にしているときと上限10000では上がらない）
  const manual = !!(st.unlockMode && st.unlockMode.goi === 'manual');
  return {best, tier, goiLv: manual ? null : ((st.lv && st.lv.goi) || 1) + pendingOk()};
}

/* ===== 画面の大きさ ===== */
const cv = $("cv"), ctx = cv.getContext("2d");
let W = 800, H = 600, DPR = 1;
let S = 1;          // 本体版(高さ600px)に対する大きさの倍率。機体・弾・アイテムの大きさに使う
let ORB_FONT = 14;  // オーブの文字の大きさ(px)
/* アイテムの半径(px)。オーブの文字に合わせて大きくする（2026-10-03、教員の指示：「大きくなった時に負けないくらい大きく」）。 */
let ITEM_R = 16;
/* 弾の大きさの倍率（2026-10-03、教員の指示：「少し大きくして見えやすく」。本体内の版の1.6倍）。 */
let BULLET_SC = 1.6;
/* canvasの大きさを、実際に表示されている大きさに合わせる。ゲーム中に窓の大きさが変わったときは、
   画面の中の物の位置を同じ割合で動かす（レーンの位置がずれないように）。 */
function fitCanvas(){
  const r = $("field").getBoundingClientRect();
  const nW = Math.max(240, Math.round(r.width)), nH = Math.max(240, Math.round(r.height));
  const fx = nW / W, fy = nH / H;
  W = nW; H = nH; DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  S = Math.max(0.8, Math.min(2.2, H / 600));
  const laneW = W / 4;
  ORB_FONT = Math.round(Math.max(13, Math.min(laneW * 0.085, H * 0.046, 34)));
  ITEM_R = Math.round(Math.max(26*S, ORB_FONT * 1.5));
  BULLET_SC = 1.6 * S;
  if(G){
    G.player.x *= fx; G.player.targetX *= fx; G.player.y = H - 70*S;
    G.orbs.forEach(o => { o.y *= fy; layoutOrb(o); });
    G.items.forEach(it => { it.x = laneCenter(it.lane); it.y *= fy; it.r = ITEM_R; });
    G.bullets = []; G.particles = []; G.popups = [];
  }
  render();
}
window.addEventListener("resize", fitCanvas);
document.addEventListener("fullscreenchange", () => { $("fsBtn").textContent = document.fullscreenElement ? "⛶ 全画面をやめる" : "⛶ 全画面"; setTimeout(fitCanvas, 50); });
$("fsBtn").addEventListener("click", () => {

    if(document.fullscreenElement) document.exitFullscreen();

});

/* ===== ゲームの状態 ===== */
let G = null;          // プレイ中の状態（スタート前はnull）
let rafId = null, lastT = 0;

function startGame(){
  ensureAudio();
  const sv = loadSave();
  G = {
    phase:'playing', score:0, lives:3, maxLives:3, combo:0,
    player:{x:W/2, y:H-70*S, targetX:W/2},
    bullets:[], orbs:[], items:[], particles:[], popups:[],
    currentItem:null, currentOrder:null, itemShownAt:0,
    orbFallSpeed:VS_BASE_SPEED, lastFire:0, fireCooldown:220, spawnedForItem:false,
    shakeTime:0, slowCharges:0, shipLevel:0, correctSinceSpeedUp:0,
    levelIndex:0, correctSinceLevelUp:0, usedWords:[], laneIndex:1,
    isFiring:false, bestBefore: sv.best || 0, tierBefore: sv.tier || 0, goiLv: sv.goiLv, wrongWords:{},
  };
  $("overlay").hidden = true;
  pickNextItem();
  updateHud();
  lastT = performance.now();
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function pickNextItem(){
  const pool = levelPool(G.levelIndex);
  if(!pool.length){ endGame(); return; }
  if(G.usedWords.length >= pool.length) G.usedWords = [];
  let idx;
  do { idx = Math.floor(Math.random()*pool.length); } while(pool.length > 1 && G.usedWords.includes(idx));
  G.usedWords.push(idx);
  const it = pool[idx];
  G.currentItem = it;
  G.currentOrder = shuffledOrder(it.c.length);
  G.spawnedForItem = false;
  G.bullets = [];
  const yomi = VS_WORD_YOMI[it.q];
  $("word").innerHTML = markQuestionHtml(it.q) + (yomi ? `<span class="yomi">（${esc(yomi)}）</span>` : "");
}

const laneCount = () => (G && G.currentOrder && G.currentOrder.length) || 4;
const laneCenter = lane => W / 4 * lane + W / 8;
function moveToLane(idx){
  const n = laneCount();
  idx = Math.max(0, Math.min(n-1, idx));
  G.laneIndex = idx;
  G.player.targetX = W/n*idx + W/n/2;
}

/* オーブの幅・高さ・文字の折り返しを、今の画面の大きさから決め直す（出したとき・窓の大きさが変わったとき）。 */
function layoutOrb(o){
  const n = laneCount(), laneW = W / n;
  o.x = laneW*o.lane + laneW/2;
  o.w = laneW * 0.92;
  ctx.font = `bold ${ORB_FONT}px sans-serif`;
  o.lines = wrapLines(o.text, o.w - ORB_FONT*0.9);
  const lineH = ORB_FONT * 1.28;
  o.lineH = lineH;
  o.dotRowH = o.maxHp > 1 ? Math.max(14, ORB_FONT*0.9) : 0;
  o.h = Math.max(ORB_FONT*3, o.lines.length*lineH + ORB_FONT*1.2 + o.dotRowH);
}
function spawnOrbs(){
  const it = G.currentItem, order = G.currentOrder;
  let speedMul = 1;
  if(G.slowCharges > 0){ speedMul = 0.5; G.slowCharges--; }
  const hp = G.levelIndex + 1;
  G.orbs = order.map((origIdx, i) => {
    const o = { text: it.c[origIdx], correct: origIdx === it.a, lane:i, hp, maxHp:hp, flashTime:0, hit:false,
                vyBase:(G.orbFallSpeed + Math.random()*0.3) * speedMul };
    layoutOrb(o);
    o.y = -o.h/2 - (i*70 + Math.random()*40) * S;
    return o;
  });
  G.spawnedForItem = true;
  G.itemShownAt = Date.now();
}
function wrapLines(text, maxWidth){
  const lines = []; let cur = '';
  for(const ch of String(text)){
    const t = cur + ch;
    if(ctx.measureText(t).width > maxWidth && cur !== ''){ lines.push(cur); cur = ch; } else cur = t;
  }
  if(cur) lines.push(cur);
  return lines;
}

function bulletPattern(lv){
  if(lv===0) return [{dx:0, vx:0}];
  if(lv===1) return [{dx:-7,vx:0},{dx:7,vx:0}];
  if(lv===2) return [{dx:-7,vx:0},{dx:7,vx:0},{dx:-14,vx:-1.8,diag:true},{dx:14,vx:1.8,diag:true}];
  return [{dx:0,vx:0,big:true},{dx:-14,vx:-1.8,diag:true},{dx:14,vx:1.8,diag:true}];
}
const bulletDamage = lv => lv + 1;
function fireBullet(){
  const now = performance.now();
  if(now - G.lastFire < G.fireCooldown) return;
  G.lastFire = now;
  const dmg = bulletDamage(G.shipLevel);
  bulletPattern(G.shipLevel).forEach(p => {
    G.bullets.push({x:G.player.x + p.dx*BULLET_SC, y:G.player.y - 20*S, vx:p.vx*S, vy:-9*S, big:!!p.big, diag:!!p.diag, dmg});
  });
  beep(880,0.05,'square',0.06);
}

let audioCtx = null;
function ensureAudio(){ try{ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state === "suspended") audioCtx.resume(); }catch(e){} }
function beep(freq, dur, type, vol){
  try{
    ensureAudio();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function pickItemType(lv){
  const pool = VS_ITEM_TYPES.filter(t => t.type !== 'ship' || lv < 3);
  const total = pool.reduce((s,t)=>s+t.weight,0);
  let r = Math.random()*total;
  for(const t of pool){ if(r < t.weight) return t; r -= t.weight; }
  return pool[0];
}
function spawnItem(){
  const d = pickItemType(G.shipLevel);
  /* アイテムはどれかのレーンのまん中に落とす（2026-10-03、教員の指示：キーで操作する人が多いので、
     数字キー・矢印キーで移った機体の中心にちょうど来るように）。 */
  const lane = Math.floor(Math.random() * 4);
  G.items.push({type:d.type, color:d.color, symbol:d.symbol, lane, x:laneCenter(lane), y:-ITEM_R*2, vyBase:1.6+Math.random()*0.4, r:ITEM_R});
}
function collectItem(it){
  beep(1500,0.1,'triangle',0.15);
  if(it.type === 'slow'){
    G.slowCharges += 3; popup(it.x, it.y, 'スロー×3問!', '#4fc3f7'); particles(it.x, it.y, '#4fc3f7', 16);
  }else if(it.type === 'life'){
    if(G.lives < G.maxLives){ G.lives++; popup(it.x, it.y, 'HP回復!', '#ff5577'); }
    else popup(it.x, it.y, 'HP満タン', '#8899cc');
    particles(it.x, it.y, '#ff5577', 16);
  }else if(it.type === 'ship'){
    if(G.shipLevel < 3){ G.shipLevel++; G.maxLives++; popup(it.x, it.y, `機体強化 Lv${bulletDamage(G.shipLevel)}!`, '#ffd24f'); }
    else popup(it.x, it.y, '機体最大強化中!', '#ffd24f');
    G.lives = G.maxLives;
    particles(it.x, it.y, '#ffd24f', 22);
  }
  updateHud();
}
function particles(x,y,color,n){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = (1+Math.random()*3.5)*S;
    G.particles.push({x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color, size:(2+Math.random()*3)*S});
  }
}
function popup(x,y,text,color){ G.popups.push({x,y,text,color,life:1}); }

function updateHud(){
  const g = G || {score:0, lives:3, maxLives:3, levelIndex:0, bestBefore:loadSave().best||0};
  $("score").textContent = g.score;
  $("lives").innerHTML = '<span class="on">♥</span>'.repeat(Math.max(0,g.lives)) + '<span class="off">♥</span>'.repeat(Math.max(0, g.maxLives - g.lives));
  $("lvname").textContent = `レベル${g.levelIndex+1}　${VS_LEVEL_NAMES[g.levelIndex]}`;
  $("best").textContent = `ベスト：${Math.max(g.bestBefore||0, g.score)}`;
}
function showBanner(text){
  const el = $("banner");
  el.textContent = text; el.classList.add("show");
  beep(660,0.1,'triangle',0.12); setTimeout(()=>beep(990,0.15,'triangle',0.14), 120);
  const g = G; setTimeout(() => { if(G === g) el.classList.remove("show"); }, 2200);
}
function grazeOrb(o){ o.flashTime = 6; particles(o.x, o.y, '#cfd8ff', 4); beep(1400,0.04,'square',0.05); }
function recordWrong(){ const it = G.currentItem; if(it) G.wrongWords[it.q] = it.c[it.a]; }

function hitOrb(o){
  o.hit = true; o.gone = true;
  if(o.correct){
    pushPending(o => o.ans.push([G.currentItem.q, 1, Date.now() - G.itemShownAt]));
    G.combo++;
    const gain = 10 + G.combo*2;
    G.score += gain;
    particles(o.x,o.y,'#7ee8fa',20);
    popup(o.x,o.y, `+${gain}` + (G.combo>1 ? `  ${G.combo}COMBO` : ``), '#ffe66d');
    if(G.goiLv && G.goiLv < 10000){ G.goiLv++; popup(o.x, o.y - 30*S, `語彙 Lv.${G.goiLv} UP!`, '#8ff0d6'); }
    beep(1200,0.12,'sine',0.15);
    G.orbs.forEach(x => { if(!x.hit){ x.hit = true; x.gone = true; } });
    G.bullets = [];
    if(Math.random() < VS_ITEM_DROP_CHANCE) spawnItem();
    if(G.levelIndex < VS_LEVEL_NAMES.length-1){
      G.correctSinceLevelUp++;
      if(G.correctSinceLevelUp >= VS_CORRECT_PER_LEVEL){
        G.correctSinceLevelUp = 0; G.levelIndex++; G.usedWords = [];
        showBanner(`レベル${G.levelIndex+1} 〜${VS_LEVEL_NAMES[G.levelIndex]}〜`);
      }
    }
    G.correctSinceSpeedUp++;
    if(G.correctSinceSpeedUp >= VS_CORRECT_PER_SPEEDUP){
      G.correctSinceSpeedUp = 0; G.orbFallSpeed += VS_SPEEDUP_STEP;
      popup(W/2, H/2, 'スピードアップ!', '#ff9dc0');
    }
  }else{
    G.combo = 0;
    particles(o.x,o.y,'#ff5577',14);
    popup(o.x,o.y,'ちがう!', '#ff5577');
    beep(220,0.18,'sawtooth',0.12);
    recordWrong();
    loseLife();
  }
  updateHud();
}
function loseLife(){
  G.lives--; G.shakeTime = 12;
  const before = G.orbFallSpeed;
  G.orbFallSpeed = Math.max(VS_BASE_SPEED, G.orbFallSpeed - VS_SPEEDUP_STEP*2);
  if(G.orbFallSpeed < before) popup(W/2, H/2 - 40*S, 'スピードダウン', '#4fc3f7');
  updateHud();
}

/* ===== 1コマごとの処理 =====
   本体版は1フレーム＝1歩で動かしていたが、ここでは経過時間k（60fpsのときに1）を掛けて動かす。
   落下速度は高さ600pxの画面を基準に、今の画面の高さに合わせて伸ばす（H/600倍）＝どの大きさの画面でも
   上から下まで落ちきる時間は本体版と同じ。 */
function loop(t){
  if(!G || G.phase !== 'playing') return;
  const k = Math.min(3, (t - lastT) / (1000/60) || 1);
  lastT = t;
  const fall = H / 600;

  G.player.x += (G.player.targetX - G.player.x) * Math.min(1, 0.18*k);
  G.player.x = Math.max(24*S, Math.min(W-24*S, G.player.x));
  if(G.isFiring) fireBullet();
  if(!G.spawnedForItem) spawnOrbs();

  G.bullets.forEach(b => { b.y += b.vy*k; b.x += b.vx*k; });
  G.bullets = G.bullets.filter(b => b.y > -20 && b.x > -40 && b.x < W+40);
  G.orbs.forEach(o => { if(!o.hit) o.y += o.vyBase * fall * k; });

  // 1コマにつき1オーブへのダメージは1回まで（本体版と同じ。2発同時の弾で二重に削れないように）
  G.orbs.forEach(o => { o.hitThisFrame = false; });
  G.bullets.forEach(b => {
    if(b.diag) return;
    G.orbs.forEach(o => {
      if(o.hit) return;
      if(Math.abs(b.x-o.x) < o.w/2 && Math.abs(b.y-o.y) < o.h/2){
        b.y = -9999;
        if(o.hitThisFrame) return;
        o.hitThisFrame = true;
        o.hp -= b.dmg;
        if(o.hp <= 0) hitOrb(o); else grazeOrb(o);
      }
    });
  });
  if(!G) return;
  G.orbs.forEach(o => { if(o.flashTime > 0) o.flashTime -= k; });
  G.orbs.forEach(o => {
    if(!o.hit && o.y - o.h/2 > H){
      o.hit = true; o.gone = true;
      if(o.correct){
        loseLife(); popup(o.x, H - 100*S, "取り逃し!", "#ff5577"); recordWrong();
        pushPending(p => p.ans.push([G.currentItem.q, 0, Date.now() - G.itemShownAt]));
      }
    }
  });
  G.orbs = G.orbs.filter(o => !o.gone);
  if(G.spawnedForItem && G.orbs.length === 0) pickNextItem();

  G.items.forEach(it => {
    it.y += it.vyBase * fall * k;
    const dx = Math.abs(it.x - G.player.x), dy = Math.abs(it.y - G.player.y);
    if(!it.gone && dx < (20*S + it.r*0.7) && dy < (18*S + it.r*0.7)){ it.gone = true; collectItem(it); }
    else if(!it.gone && it.y > H + it.r*2) it.gone = true;
  });
  G.items = G.items.filter(it => !it.gone);
  G.particles.forEach(p => { p.x += p.vx*k; p.y += p.vy*k; p.vy += 0.08*S*k; p.life -= 0.03*k; });
  G.particles = G.particles.filter(p => p.life > 0);
  G.popups.forEach(p => { p.y -= 0.6*S*k; p.life -= 0.02*k; });
  G.popups = G.popups.filter(p => p.life > 0);
  if(G.shakeTime > 0) G.shakeTime -= k;

  render();
  if(G.lives <= 0){ endGame(); return; }
  rafId = requestAnimationFrame(loop);
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(G && G.shakeTime > 0) ctx.translate((Math.random()-0.5)*6*S, (Math.random()-0.5)*6*S);

  // 星
  ctx.fillStyle = '#fff';
  const now = performance.now();
  for(let i=0;i<90;i++){
    const sx = (i*97.3) % W, sy = (i*53.7 + now*0.02*S*(1+i%3)) % H;
    ctx.globalAlpha = 0.12 + (i%5)*0.05;
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.globalAlpha = 1;

  // レーンの区切りと、下のキー番号（横長の画面では、どのレーンが何番か分かりやすいように）
  const n = laneCount(), laneW = W / n;
  ctx.strokeStyle = 'rgba(126,232,250,0.08)'; ctx.lineWidth = 1;
  for(let i=1;i<n;i++){ ctx.beginPath(); ctx.moveTo(laneW*i, 0); ctx.lineTo(laneW*i, H); ctx.stroke(); }
  if(G){
    ctx.font = `bold ${Math.round(14*S)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for(let i=0;i<n;i++){
      ctx.fillStyle = i === G.laneIndex ? 'rgba(126,232,250,0.55)' : 'rgba(255,255,255,0.18)';
      ctx.fillText(String(i+1), laneW*i + laneW/2, H - 14*S);
    }
  }
  if(!G){ ctx.restore(); return; }

  // オーブ
  G.orbs.forEach(o => {
    if(o.hit) return;
    ctx.save();
    ctx.translate(o.x, o.y);
    const grad = ctx.createLinearGradient(-o.w/2,0,o.w/2,0);
    if(o.flashTime > 0){ grad.addColorStop(0,'#8fb0ff'); grad.addColorStop(1,'#aac0ff'); }
    else{ grad.addColorStop(0,'#2a3a6a'); grad.addColorStop(1,'#3a4a8a'); }
    ctx.fillStyle = grad;
    roundRect(-o.w/2, -o.h/2, o.w, o.h, Math.min(16, ORB_FONT*0.7));
    ctx.fill();
    ctx.strokeStyle = 'rgba(126,232,250,0.45)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#f2f6ff'; ctx.font = `bold ${ORB_FONT}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const textH = o.lines.length * o.lineH, cy = -o.dotRowH/2;
    o.lines.forEach((ln, i) => ctx.fillText(ln, 0, cy - textH/2 + o.lineH/2 + i*o.lineH));
    if(o.maxHp > 1){
      const r = Math.max(3, ORB_FONT*0.2), gap = r*3, totalW = (o.maxHp-1)*gap;
      for(let i=0;i<o.maxHp;i++){
        ctx.beginPath();
        ctx.arc(-totalW/2 + i*gap, o.h/2 - o.dotRowH/2 - 2, r, 0, Math.PI*2);
        ctx.fillStyle = i < o.hp ? '#ffe66d' : 'rgba(255,255,255,0.25)';
        ctx.fill();
      }
    }
    ctx.restore();
  });

  // アイテム
  G.items.forEach(it => {
    const bob = Math.sin(now*0.006 + it.x) * 3 * S;
    ctx.save();
    ctx.translate(it.x, it.y + bob);
    ctx.shadowColor = it.color; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(0,0,it.r,0,Math.PI*2);
    const g = ctx.createRadialGradient(0,0,2,0,0,it.r);
    g.addColorStop(0,'#ffffff'); g.addColorStop(0.35,it.color); g.addColorStop(1,'#1a1a3e');
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#1a1a3e'; ctx.font = `bold ${Math.round(it.r*0.95)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(it.symbol, 0, 1);
    ctx.restore();
  });

  // 弾
  const colors = ['#7ee8fa','#8ff0d6','#ffe38a','#ffb37e'];
  const bc = colors[Math.min(G.shipLevel, colors.length-1)];
  const bw0 = (4 + G.shipLevel*1.2)*BULLET_SC, bh0 = (14 + G.shipLevel*2)*BULLET_SC;
  const hue0 = (now*0.25) % 360;
  G.bullets.forEach(b => {
    const bw = b.big ? bw0*2.1 : bw0, bh = b.big ? bh0*1.35 : bh0;
    ctx.save();
    if(b.big){ const c = `hsl(${(hue0+b.x)%360},90%,65%)`; ctx.shadowColor = c; ctx.shadowBlur = 18; ctx.fillStyle = c; }
    else if(b.diag){ ctx.shadowColor = bc; ctx.shadowBlur = 6 + G.shipLevel*2; ctx.globalAlpha = 0.75; ctx.fillStyle = bc; }
    else{ ctx.shadowColor = bc; ctx.shadowBlur = 8 + G.shipLevel*3; ctx.fillStyle = bc; }
    roundRect(b.x-bw/2, b.y-bh/2, bw, bh, bw/2.2);
    ctx.fill();
    ctx.restore();
  });

  // 自機
  ctx.save();
  ctx.translate(G.player.x, G.player.y);
  const sc = S * (1 + G.shipLevel*0.1);
  ctx.scale(sc, sc);
  const shipColor = ['#ff6b9d','#ff6b9d','#c9a4ff','#ffd24f'][Math.min(G.shipLevel,3)];
  ctx.shadowColor = shipColor; ctx.shadowBlur = 14 + G.shipLevel*5;
  ctx.fillStyle = shipColor;
  ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(18,18); ctx.lineTo(0,10); ctx.lineTo(-18,18); ctx.closePath(); ctx.fill();
  if(G.shipLevel >= 1){
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.moveTo(-18,18); ctx.lineTo(-28,10); ctx.lineTo(-14,6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(18,18); ctx.lineTo(28,10); ctx.lineTo(14,6); ctx.closePath(); ctx.fill();
  }
  if(G.shipLevel >= 2){ ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0,2,4,0,Math.PI*2); ctx.fill(); }
  if(G.shipLevel >= 3){ ctx.fillStyle = 'rgba(255,210,79,0.5)'; ctx.beginPath(); ctx.moveTo(-8,16); ctx.lineTo(0,32); ctx.lineTo(8,16); ctx.closePath(); ctx.fill(); }
  ctx.restore();

  G.particles.forEach(p => { ctx.globalAlpha = Math.max(p.life,0); ctx.fillStyle = p.color; ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size); });
  ctx.globalAlpha = 1;
  ctx.font = `bold ${Math.round(Math.max(16, 18*S))}px sans-serif`; ctx.textAlign = 'center';
  G.popups.forEach(p => {
    ctx.globalAlpha = Math.max(p.life,0);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ===== スタート・結果の画面 ===== */
function showTitle(){
  G = null; updateHud(); $("word").textContent = "―"; render();
  const best = loadSave().best || 0;
  $("box").innerHTML = `
    <h1>🚀 ボキャブラ・シューティング</h1>
    <p class="lead">上から降ってくる「意味」の中から、<br>表示された言葉の正しい意味を撃ち落とそう。</p>
    <ul class="how">
      <li><b>移動</b>　<span class="kbd">1</span>〜<span class="kbd">4</span> でそのレーンへ／<span class="kbd">←</span><span class="kbd">→</span>／画面をドラッグ</li>
      <li><b>発射</b>　<span class="kbd">Space</span> か <span class="kbd">Enter</span> を押している間、連射（タブレットはSHOOTボタン）</li>
      <li><b>ミス</b>　まちがった意味に当てたり、正解を撃ちもらすと❤が減る</li>
    </ul>
    <p class="best-line">自己ベスト <b>${best}</b> 点</p>
    <div class="btns">
      <button class="btn" onclick="startGame()">スタート</button>
      <button class="btn secondary" onclick="goBack()">戻る</button>
    </div>
    <p class="note">右上の「⛶ 全画面」で、さらに大きくできます。正解すると「語彙」のレベルが上がります（ホームにもどったときに反映）。</p>`;
  $("overlay").hidden = false;
}
function endGame(){
  if(!G) return;
  cancelAnimationFrame(rafId);
  G.phase = 'gameover'; G.isFiring = false;
  const sv = loadSave();
  const prev = sv.best || 0;
  const isNew = G.score > 0 && G.score > prev;
  const newTier = Math.floor(G.score / 100);
  const xp = isNew && newTier > sv.tier ? (newTier - sv.tier) * 10 : 0;
  if(G.score > 0) pushPending(o => o.scores.push(G.score));
  const wrong = Object.entries(G.wrongWords);
  $("box").innerHTML = `
    ${isNew ? `<div class="newbest">🎉 自己ベスト更新！ 🎉</div>` : ``}
    ${xp ? `<div class="xp">🏆 自己ベストで${newTier*100}点を初めて超えたので、<br>お祝いとして経験値＋${xp}獲得した！</div>` : ``}
    <div class="big">${G.score} 点</div>
    <p class="best-line">自己ベスト <b>${Math.max(prev, G.score)}</b> 点</p>
    <div class="lvres">レベル${G.levelIndex+1}〜${esc(VS_LEVEL_NAMES[G.levelIndex])}〜に到達${G.levelIndex > 0 ? `<br>${G.levelIndex}回レベルアップ！` : ``}</div>
    <div class="btns">
      <button class="btn" onclick="startGame()">もう一度プレイする</button>
      <button class="btn secondary" onclick="goBack()">戻る</button>
    </div>
    ${wrong.length ? `<div class="wrong"><p class="ttl">まちがえた言葉（${wrong.length}）</p>${wrong.map(([q,m]) => `<div class="it"><span class="q">${esc(q)}</span>${esc(m)}</div>`).join("")}</div>` : ``}`;
  $("overlay").hidden = false;
}
function goBack(){ location.href = "kokugo_app.html?from=minigame"; }

/* ===== 操作 ===== */
const field = $("field");
function pointerX(e){ const r = cv.getBoundingClientRect(); return (e.touches ? e.touches[0].clientX : e.clientX) - r.left; }
const tMove = e => { if(!G || G.phase !== 'playing') return; e.preventDefault(); G.player.targetX = pointerX(e); };
cv.addEventListener('touchstart', tMove, {passive:false});
cv.addEventListener('touchmove', tMove, {passive:false});
cv.addEventListener('mousedown', e => { if(G && G.phase === 'playing') G.player.targetX = pointerX(e); });
cv.addEventListener('mousemove', e => { if(e.buttons === 1 && G && G.phase === 'playing') G.player.targetX = pointerX(e); });
const fireBtn = $("fireBtn");
const fireOn = e => { e.preventDefault(); if(G) G.isFiring = true; };
const fireOff = e => { if(e) e.preventDefault(); if(G) G.isFiring = false; };
fireBtn.addEventListener('touchstart', fireOn, {passive:false});
fireBtn.addEventListener('touchend', fireOff, {passive:false});
fireBtn.addEventListener('touchcancel', fireOff);
fireBtn.addEventListener('mousedown', fireOn);
window.addEventListener('mouseup', () => { if(G) G.isFiring = false; });
window.addEventListener('keydown', e => {
  if(!G || G.phase !== 'playing'){
    // スタート・結果の画面では、Enterで始める（押しっぱなしの連射キーで、結果画面をすぐ飛ばさないようにrepeatは無視）
    if(e.key === 'Enter' && !e.repeat && !$("overlay").hidden){ e.preventDefault(); startGame(); }
    return;
  }
  if(e.code === 'Space' || e.key === 'Enter'){ e.preventDefault(); G.isFiring = true; }
  else if(e.key >= '1' && e.key <= '4'){ e.preventDefault(); moveToLane(Number(e.key)-1); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); moveToLane(G.laneIndex-1); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); moveToLane(G.laneIndex+1); }
});
window.addEventListener('keyup', e => { if(G && (e.code === 'Space' || e.key === 'Enter')) G.isFiring = false; });

fitCanvas();
showTitle();
</script>
