  @property --tilt{syntax:'<angle>';inherits:true;initial-value:32deg;}

<script>
'use strict';
/* =========================================================================
   故事成語すごろく（試作 第4版、2026-11-12〜）
   第1版は「マス目の表に問題が並ぶだけで機械的」と教員に言われたので、すごろくらしさを全面的に強化：
   ・村→川→山→城へ続く道の「地図」の盤。途中に分かれ道（近道＝危険／遠回り＝安全で宝が多い）。
   ・ライバルの狸の旅商人「ポン吉」と競走。先にゴールされるとボスが強くなる。追い抜くとボーナス。
   ・立体サイコロ、駒のジャンプ、効果音、紙吹雪、小判の演出。
   ・問題以外のマス：おみくじ、宝箱、茶屋、落とし穴、登竜門（正解で滝を登って一気に進む）、小判。
   ・連続正解のコンボ、早押しボーナス。ゴールではボスをルーレットで決める。
   画像は img/ フォルダに置けば自動で使う（IMG参照、無ければ絵文字と図形で代わりに表示）。
   第3版：盤を奥へ傾けた立体表示＋カメラ追従、金のサイコロの回り方を修正、「おみくじ」マスの文字が巨大化する不具合を修正
   （モーダルの飾りと同じclass名だった）、ボス戦を全面改修（bossNextQuestion参照）。
   第4版：いつも見える銭袋（入る・出るを小判と数字で見せる）、結果パネル（何が起きたかを1行ずつ）、道を約60〜70マスに延長・
   分かれ道3か所・関所3か所（必ず止まる）、特殊キャラ（通りかかると小イベント）、ポン吉のいたずら（こちらが調子よいほど必死）、
   ボス戦はスクロールなしで全体が見える2列。
   ========================================================================= */
const SAVE_KEY = 'koji_sugoroku_v1';
const KOJI_PENDING_DEFEAT_LSKEY = 'kokugo_koji_boss_defeated_v1'; // 本体kokugo_app.htmlのkojiApplyPendingDefeatsが読む

/* 2026-11-13 第8版：「勢い」（正解で大きい目が出やすくなる）はやめた。
   修行ステータスで「たくさん問題に答えるほど強くなる」ので、速く進むことが必ずしも得ではなくなったため（教員の判断）。
   サイコロはふつう（1〜6が同じ確率）。ポン吉のいたずら「おもり」のときだけ小さい目が出やすい。 */
const DIE_EVEN = [1,1,1,1,1,1], DIE_SLOW = [35,28,18,10,6,3];
const ZENI_START = 30, ZENI_PER_CORRECT = 10, ITEM_MAX = 5, SPEED_BONUS_MS = 20000;   // 答える時間は、せかしすぎないよう倍に（教員の指示 2026-11-13）
const BOSS_UNDEFEATED_WEIGHT = 3, BOSS_DEFEATED_WEIGHT = 1;
const TIER_WEIGHT = { 1:3, 2:2, 3:1 };
const QUESTION_TYPES = ['story','meaning','usage','kanji'];
const SQ_INFO = {
  start:{ic:'🏁',label:'スタート'}, goal:{ic:'🐉',label:'登竜門'}, story:{ic:'📜',label:'話'}, meaning:{ic:'💡',label:'意味'},
  usage:{ic:'🎯',label:'使い方'}, kanji:{ic:'✏️',label:'漢字'}, event:{ic:'⭐',label:'故事'}, omikuji:{ic:'🎴',label:'おみくじ'},
  chest:{ic:'🎁',label:'宝箱'}, shop:{ic:'🏮',label:'店'}, coin:{ic:'🪙',label:'小判'}, pit:{ic:'🕳️',label:'落とし穴'},
  dragon:{ic:'🐉',label:'登竜門'}, tea:{ic:'🍡',label:'茶屋'}, gate:{ic:'⛩️',label:'関所'}, dojo:{ic:'🥋',label:'道場'},
};
/* ---------- 修行ステータス（2026-11-13 教員の指示：たくさん問題に挑戦するほど得をする。正解でこのすごろくだけの力が上がり、ボス戦で有利に） ----------
   問題の種類ごとに1つの力が上がる：📜話→攻撃力／💡意味→体力／🎯使い方→見切り／✏️漢字→集中。
   正解 +3、まちがいでも挑戦点 +1（下がることはない）。道場マスでは、えらんだ力を3問つづけて修行できる。
   ランク G〜S によってボス戦が変わる：攻撃力＝1問のダメージ、体力＝ハートの数、見切り＝選択肢を2つ消せる回数、集中＝ボスの特技を見破る確率。 */
const STAT_GAIN_OK = 3, STAT_GAIN_NG = 1, DOJO_PERFECT_BONUS = 5;
/* SSSの上に EX・UR・UL・Ω・∞ の5段階（2026-11-14 教員の指示：SSSより上に行く人のために）。間はだんだん広く */
const RANKS = ['G','F','E','D','C','B','A','S','SS','SSS','EX','UR','UL','Ω','∞'], RANK_PTS = [0, 3, 6, 9, 13, 18, 24, 30, 38, 48, 60, 74, 90, 108, 130];   // Sの上にSS・SSS（2026-11-14 教員の指示）   // 盤を短くしたので少し上がりやすく（2026-11-13）
// ランクの色（2026-11-14 教員の指示：S金・Aピンク・B緑・C黄・Dオレンジ・E水色・F紫・G灰）
const RANK_COLOR = ['#9e9e9e','#9c5de0','#4fc3f7','#ff8c1a','#ffd83a','#3cb043','#ff6fae','#ffc400','#ff3d7f','#7c4dff','#00bfa5','#d50000','#1a1a2e','#0d0d0d','#000'];
const RANK_DARK_TEXT = [false,false,true,false,true,false,false,true,false,false,false,false,false,false,false];
const rk = r => `<span class="rk r${RANKS[r]} rn${r}" style="background:${RANK_COLOR[r]};color:${RANK_DARK_TEXT[r] ? '#3a2a00' : '#fff'}">${RANKS[r]}</span>`;
const rankOf = p => { let r = 0; RANK_PTS.forEach((t, i) => { if(p >= t) r = i; }); return r; };
const atkDmg = r => 1 + Math.floor(r / 2);
const hpBonus = r => Math.floor(r / 2);
// ボス戦（自動の対決）の数値。ランク r（G=0〜S=7）から決まる
const pHpOf = r => 80 + r * 20, pAtkOf = r => 4 + r * 2;     // あなた：HP・1回の攻撃
const bHpOf = r => 80 + r * 20, bAtkOf = r => 3 + r * 2;   // 力が同じランクなら、ほぼ勝てない（試算：同ランク・応援ありで約15%、1ランク上なら約9割）     // ボス：HP・1回の攻撃
const smashPct = r => r <= 9 ? r * 8 : Math.min(90, 72 + (r - 9) * 3);                                  // ボスの強打（1.8倍）の確率
const specialPct = r => r <= 9 ? 10 + r * 8 : Math.min(95, 82 + (r - 9) * 2);                           // ボスが特技を使う確率
const guardPct = r => r <= 9 ? r * 10 : Math.min(98, 90 + (r - 9) * 2);                     // 防御力：ハートが減るとき、1つ防ぐ確率（ボスの攻撃＝強打の確率と対になる）
const hitBase = r => 90 + r * 3;                  // 命中率（ボスの回避率を引いた分が、実際に当たる確率）
const evadePct = r => r <= 9 ? r * 5 : 45 + (r - 9) * 3;                      // ボスの回避率
const hitPct = () => Math.max(50, Math.min(100, hitBase(statRank('focus')) - evadePct(foeRank('evade'))));
const STATS = [
  { key:'atk',    facet:'story',   ic:'⚔️', name:'攻撃力', color:'#d84315', eff:r => `1回の攻撃 ${pAtkOf(r)}` },
  { key:'hp',     facet:'meaning', ic:'❤️', name:'体力',   color:'#c2185b', eff:r => `HP ${pHpOf(r)}` },
  { key:'mikiri', facet:'usage',   ic:'🛡️', name:'防御力', color:'#1565c0', eff:r => `ダメージ半分 ${guardPct(r)}%` },
  { key:'focus',  facet:'kanji',   ic:'🏹', name:'命中率', color:'#2e7d32', eff:r => `命中 ${Math.min(100, hitBase(r))}%` },   // 表示は100%で止める（計算はそのまま。2026-11-14 教員の指示）
];
const statOfFacet = f => STATS.find(t => t.facet === f) || STATS[0];
const statRank = key => rankOf((G && G.stat && G.stat[key]) || 0);
/* クリアするほど、タイトルの鯉が濃くなり、問題に正解したときの力の上がり方も大きくなる（2026-11-14 教員の指示）
   クリア0〜1回：正解+3　2〜4回：+4　5回〜：+5（まちがいの+1は同じ）。色はクリア8回でいちばん濃い */

const koiDepthT = () => Math.min(1, ((SAVE && SAVE.koiClears) || 0) / CLEAR_KOI_MAX);   // タイトルの鯉の濃さ 0〜1

   染め物で布を染め液に1回ひたすのが「一入（ひとしお）」。クリア1回＝1入、負け＝¼入。8入（八入＝やしお）で色はいちばん濃くなるが、数はその先も増える。 */

   濃さが0%でなければ、1%の確率で「天才型」（オールB以上） */
function koiStartStat(){
  const t = koiDepthT(), o = {};
  if(t <= 0){ STATS.forEach(st => o[st.key] = 0); return { stat:o, genius:false }; }
  const genius = Math.random() < .01;

}

const COIN_CH = String.fromCodePoint(0x1FA99);
function fixCoins(root){
  if(!root) return;
  if(root.nodeType === 3){ if(root.nodeValue.includes(COIN_CH)) swapCoinText(root); return; }
  if(root.nodeType !== 1 || !root.textContent || !root.textContent.includes(COIN_CH)) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = [];
  while(w.nextNode()) if(w.currentNode.nodeValue.includes(COIN_CH)) list.push(w.currentNode);
  list.forEach(swapCoinText);
}
function swapCoinText(t){
  const parent = t.parentNode; if(!parent) return;
  const parts = t.nodeValue.split(COIN_CH), frag = document.createDocumentFragment();
  parts.forEach((p, i) => {
    if(p) frag.appendChild(document.createTextNode(p));
    if(i < parts.length - 1){ const c = document.createElement('i'); c.className = 'cn'; c.setAttribute('aria-label', 'コイン'); frag.appendChild(c); }
  });
  parent.replaceChild(frag, t);
}

function compatible(a, b){ return a.id !== b.id && !(a.avoid || []).includes(b.id) && !(b.avoid || []).includes(a.id); }
function meaningDistractors(w, n){
  const pool = KOJI_WORDS.filter(o => compatible(w, o)).map(o => o.meaning);
  const L = w.meaning.length;
  const near = shuffle(pool).sort((a, b) => Math.abs(a.length - L) - Math.abs(b.length - L)).slice(0, 6);
  return shuffle(near).slice(0, n);
}
function questionFromData(it, facet, w){
  const q = { facet, wid:w.id, w, e:it.e, choices:it.c.map((t, i) => ({ t, ok:i === it.a })) };
  if(it.kind === 'story2word'){ q.storyText = it.q; q.prompt = it.s; }
  else if(it.kind === 'meaning' || it.kind === 'word2story'){ q.wordBig = it.q; q.prompt = it.instr; }
  else { q.scene = it.q; q.prompt = it.instr; }
  if(facet === 'meaning') q.hint = w.story ? `話：${w.story}` : `読み：${w.yomi || '？'}`;
  else q.hint = w.meaning ? `答えの故事成語は「${w.meaning}」という意味です。` : `読み：${w.yomi || '？'}`;
  q.choices = shuffle(q.choices);
  return q;
}
function makeQuestion(facet, w, opts){
  opts = opts || {};
  const dq = w.dataQs[facet] || [];
  if(dq.length && (!w.rich || Math.random() < 0.5)) return questionFromData(dq[rnd(dq.length)], facet, w);
  const q = { facet, wid:w.id, w };
  if(facet === 'story'){
    const sq = w.storyQs[rnd(w.storyQs.length)];
    q.showStory = !opts.noStory; q.prompt = sq.q;
    q.choices = sq.c.map((t, i) => ({ t, ok:i === 0 }));
    q.hint = opts.noStory ? `話：${w.story}` : `「${w.word}」は「${w.meaning}」という意味の言葉です。`;
  } else if(facet === 'meaning'){
    q.prompt = `「${w.word}」の意味として、正しいものはどれ？`;   // 読みはルビで出す
    const ds = [];
    if(w.misuse) ds.push(w.misuse);
    meaningDistractors(w, 3).forEach(d => { if(ds.length < 3) ds.push(d); });
    q.choices = [{ t:w.meaning, ok:true }].concat(ds.map(t => ({ t, ok:false })));
    q.hint = `話：${w.story}`;
  } else if(facet === 'usage'){
    q.scene = w.usage[rnd(w.usage.length)];
    q.prompt = 'この場面にいちばん合う故事成語は？';
    let others = shuffle(KOJI_WORDS.filter(o => compatible(w, o))).slice(0, 3).map(o => o.word);
    if(w.word.length > Math.max(...others.map(t => t.length))){
      const longer = shuffle(WORDS.filter(o => o.id !== w.id && o.word.length >= w.word.length && compatible(w, o)));
      if(longer.length) others[2] = longer[0].word;
    }
    q.choices = [{ t:w.word, ok:true }].concat(others.map(t => ({ t, ok:false })));
    q.hint = `答えの故事成語は「${w.meaning}」という意味です。`;
  } else if(facet === 'kanji'){
    q.big = w.kanji.q; q.prompt = '□に入る漢字はどれ？'; q.kanjiMode = true;
    q.choices = [{ t:w.kanji.a, ok:true }].concat(w.kanji.c.map(t => ({ t, ok:false })));
    q.hint = `読み：${w.yomi}／意味：${w.meaning}`;
  }
  q.choices = shuffle(q.choices);

}
function pickWordForFacet(facet, minTier){
  minTier = minTier || 1;
  // その段階以上の語がない観点（漢字の穴埋めは第一・第二段階の語だけ、など）は段階を下げる
  while(minTier > 1 && !WORDS.some(w => facetsOf(w).includes(facet) && w.tier >= minTier)) minTier--;
  const ws = WORDS.filter(w => facetsOf(w).includes(facet) && w.tier >= minTier)
    .map(w => ({ w, wt: TIER_WEIGHT[w.tier] * (hasStamp(w.id, facet) ? 1 : 2.5) }));
  let r = Math.random() * ws.reduce((s, x) => s + x.wt, 0);
  for(const x of ws){ r -= x.wt; if(r <= 0) return x.w; }
  return ws[ws.length - 1].w;
}
function randomQuestion(minTier){
  const f = QUESTION_TYPES[rnd(4)];
  return makeQuestion(f, pickWordForFacet(f, minTier));
}
// ボス戦の出題段階（教員の指示）：仲間にした（倒した）ボスの数で、出る段階を広げる。
// 0〜1匹＝第一段階だけ／2匹＝第二段階も少し／3匹＝第二段階もしっかり／4匹＝第三段階も。数はいつも 第一＞第二＞第三。

function bossRandomQuestion(){
  const tw = bossTierWeights(), tiers = Object.keys(tw).map(Number);
  let r = Math.random() * tiers.reduce((t, k) => t + tw[k], 0), tier = 1;
  for(const k of tiers){ r -= tw[k]; if(r <= 0){ tier = k; break; } }
  // その段階の語がもつ観点から選ぶ（なければ1つ下の段階へ）
  for(; tier >= 1; tier--){
    const fs = QUESTION_TYPES.filter(f => WORDS.some(w => w.tier === tier && facetsOf(w).includes(f)));
    if(!fs.length) continue;
    const f = fs[rnd(fs.length)];
    const ws = WORDS.filter(w => w.tier === tier && facetsOf(w).includes(f)).map(w => ({ w, wt: hasStamp(w.id, f) ? 1 : 2.5 }));
    let x = Math.random() * ws.reduce((t, o) => t + o.wt, 0);
    for(const o of ws){ x -= o.wt; if(x <= 0) return makeQuestion(f, o.w); }
    return makeQuestion(f, ws[ws.length - 1].w);
  }
  return randomQuestion();
}

   道の通り道（pts）はなめらかな曲線にして、マスを等間隔に置く。

const WORLD_W = 2000, WORLD_H = 1300;
const LEGS = [

function catmull(pts, per){
  const out = [];
  for(let i = 0; i < pts.length - 1; i++){
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for(let k = 0; k < per; k++){
      const t = k / per, t2 = t * t, t3 = t2 * t;
      out.push([0,1].map(j => .5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * t + (2*p0[j] - 5*p1[j] + 4*p2[j] - p3[j]) * t2 + (-p0[j] + 3*p1[j] - 3*p2[j] + p3[j]) * t3)));
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}
function sampleCurve(pts, n, includeStart, includeEnd){
  const c = catmull(pts, 24), d = [0];
  for(let i = 1; i < c.length; i++) d.push(d[i - 1] + Math.hypot(c[i][0] - c[i - 1][0], c[i][1] - c[i - 1][1]));
  const L = d[d.length - 1], out = [];
  const slots = n + (includeStart ? 0 : 1) + (includeEnd ? 0 : 1) - 1;
  for(let k = 0; k < n; k++){
    const idx = k + (includeStart ? 0 : 1), target = L * idx / slots;
    let j = 1; while(j < d.length - 1 && d[j] < target) j++;
    const r = (target - d[j - 1]) / ((d[j] - d[j - 1]) || 1);
    out.push([c[j - 1][0] + (c[j][0] - c[j - 1][0]) * r, c[j - 1][1] + (c[j][1] - c[j - 1][1]) * r]);
  }
  return out;
}
function buildBoard(){
  const sq = [];
  const add = (t, p, extra) => { const [type, ev] = t.split(':'); sq.push(Object.assign({ id:sq.length, type, ev, x:Math.round(mx(p[0])), y:Math.round(p[1]), next:[] }, extra || {})); return sq.length - 1; };   // お化け屋敷・海は左右反対
  const link = (a, b) => { if(!sq[a].next.includes(b)) sq[a].next.push(b); };
  let prevEnd = null, branchEnds = [];
  LEGS.forEach(leg => {
    if(leg.line){
      const ids = sampleCurve(leg.line, leg.types.length, true, true).map((p, i) => add(leg.types[i], p));
      for(let i = 0; i < ids.length - 1; i++) link(ids[i], ids[i + 1]);
      if(branchEnds.length) branchEnds.forEach(e => link(e, ids[0])); else if(prevEnd !== null) link(prevEnd, ids[0]);
      branchEnds = []; prevEnd = ids[ids.length - 1];
    } else {
      leg.fork.forEach(b => {
        const ids = sampleCurve(b.pts, b.types.length, false, false).map((p, i) => add(b.types[i], p, { branch:b.name }));
        link(prevEnd, ids[0]); for(let i = 0; i < ids.length - 1; i++) link(ids[i], ids[i + 1]);
        branchEnds.push(ids[ids.length - 1]);
        sq[ids[0]].branchInfo = b;
      });
    }
  });
  sq.forEach(s => { if(s.type === 'gate') s.gateNo = +s.ev; });
  const goal = sq.find(s => s.type === 'goal').id;
  sq.forEach(s => s.remain = Infinity); sq[goal].remain = 0;
  for(let changed = true; changed;){ changed = false; sq.forEach(s => s.next.forEach(n => { if(sq[n].remain + 1 < s.remain){ s.remain = sq[n].remain + 1; changed = true; } })); }
  return sq;
}

/* ---------- カメラ（盤を奥へ傾けて立体的に見せる。動いている駒を追いかける） ---------- */
function camera(){
  /* マップはいつも全体を見せる（教員の指示）。盤を奥へ傾けると、遠近法で手前（下）が大きく広がるため、
     計算で見積もると下が見切れた。そこで、実際に画面に映った盤の大きさ（getBoundingClientRect）を測り、
     ステージにおさまるまで縮小と中央合わせを数回くり返す。 */
  const st = $('#stagewrap'), w = $('#world'); if(!st || !w) return;
  const tilt = 30;
  w.style.transition = 'none';
  w.style.setProperty('--tilt', tilt + 'deg');
  w.style.transformOrigin = `${WORLD_W / 2}px ${WORLD_H / 2}px`;
  const sr = st.getBoundingClientRect();
  let z = Math.min(st.clientWidth / WORLD_W, st.clientHeight / WORLD_H) || .4, tx = 0, ty = 0;
  const apply = () => { w.style.transform = `translate(${st.clientWidth / 2 - WORLD_W / 2 + tx}px, ${st.clientHeight / 2 - WORLD_H / 2 + ty}px) rotateX(${tilt}deg) scale(${z})`; };
  for(let i = 0; i < 5; i++){
    apply();
    const r = w.getBoundingClientRect();
    if(!r.width || !r.height) break;
    // 上には城・木が立っている分、下には盤の厚みの分の余白をとる
    const k = Math.min(sr.width * .96 / r.width, sr.height * .86 / r.height);
    z *= k;
    apply();
    const r2 = w.getBoundingClientRect();
    tx += (sr.left + sr.width / 2) - (r2.left + r2.width / 2);
    ty += (sr.top + sr.height * .53) - (r2.top + r2.height / 2);
    if(Math.abs(k - 1) < .01) break;
  }
  apply();
}

// サイコロは地図の上に投げる（教員の指示）。あなたは左下から、ボスは右上から転がってきて、地図の真ん中で止まる。
async function rollCube(n, quick){
  const cube = $('#cube'), md = $('#mapDice'); if(!cube) return;
  if(md){ md.className = 'mapdice ' + (quick ? 'foe' : 'me'); void md.offsetWidth; md.classList.add('throw'); }
  SFX.roll();
  const [tx, ty] = FACE_ROT[n];
  const spinX = 360 * (2 + rnd(2)), spinY = 360 * (2 + rnd(2));
  const nx = tx + 360 * Math.ceil((G.cubeX + spinX - tx) / 360), ny = ty + 360 * Math.ceil((G.cubeY + spinY - ty) / 360);
  G.cubeX = nx; G.cubeY = ny;
  cube.style.transition = quick ? 'transform 1s cubic-bezier(.17,.67,.24,1.02)' : 'transform 1.25s cubic-bezier(.17,.67,.24,1.02)';
  cube.style.transform = `rotateX(${nx}deg) rotateY(${ny}deg)`;
  await sleep(quick ? 1050 : 1300);
  SFX.land();
  if(md){ md.classList.add('landed'); setTimeout(() => { if(md.isConnected){ md.classList.add('fade'); } }, quick ? 700 : 900); }
}
async function roll(){
  if(!G || G.phase !== 'roll' || G.busy) return;
  G.phase = 'rolling'; G.busy = true;
  $('#rollBtn').disabled = true;
  G.log = [];
  let n;
  if(G.fixedNext){ n = G.fixedNext; G.fixedNext = null; }
  else if(G.slowNext){ n = weightedFrom(DIE_SLOW); G.slowNext = false; }
  else n = weightedDie();
  await rollCube(n);
  if(G.adjust){
    G.adjust = false;
    n = await new Promise(res => {
      window._adj = v => { closeModal(); res(v); };
      openModal(`<div class="evtitle">🎴 五十歩百歩の札</div><p>出た目は <b>${n}</b>。1つ増やす？減らす？</p>
        <div class="btnrow">${n > 1 ? `<button class="btn sub" onclick="_adj(${n-1})">−1して ${n-1}</button>` : ''}
        <button class="btn sub" onclick="_adj(${n})">そのまま ${n}</button>${n < 6 ? `<button class="btn" onclick="_adj(${n+1})">+1して ${n+1}</button>` : ''}</div>`);
    });
  }
  if(G.boostNext){ floatAt(G.player.pos, G.boostNext > 0 ? `🎲 +${G.boostNext}` : `🎲 ${G.boostNext}`, G.boostNext > 0 ? '#ffd54f' : '#80d8ff'); n = Math.max(1, n + G.boostNext); G.boostNext = 0; }
  if(G.buddies.kame > 0){ G.buddies.kame--; floatAt(G.player.pos, '🐢 亀の背中で +1', '#ffd54f'); n += 1; }
  banner(`${n} マス進む！`);
  setCam(G.player.pos);
  await sleep(600);
  await movePiece(G.player, n, 'player');

  updateRace();
  landOn();
}
// 駒を1マスずつ動かす。分かれ道では、あなたは選ぶ／ポン吉は気まぐれ。
// まだ通っていない関所には、目が残っていても必ず止まる。あなたは特殊キャラのいるマスを通ると出会う。n<0は来た道を戻る。
async function movePiece(piece, n, who){
  const el = who === 'player' ? $('#pcPlayer') : $('#pcRival');
  for(let k = 0; k < Math.abs(n); k++){
    const cur = G.squares[piece.pos];
    let nextId;
    if(n < 0){ if(!piece.hist.length) break; nextId = piece.hist.pop(); }
    else {
      if(cur.type === 'goal') break;
      if(cur.next.length > 1) nextId = who === 'player' ? await chooseFork(cur) : cur.next[rnd(cur.next.length)];
      else nextId = cur.next[0];
      piece.hist.push(piece.pos);
    }
    piece.pos = nextId;
    placePieces();
    setCam(piece.pos);
    const pe = who === 'player' ? $('#pcPlayer') : $('#pcRival');
    if(pe){ pe.classList.remove('hop'); void pe.offsetWidth; pe.classList.add('hop'); }
    SFX.step();
    await sleep(240);
    const ns = G.squares[piece.pos];
    if(ns.type === 'goal') break;
    if(n > 0 && who === 'player' && ns.type === 'dragon' && !G.dragon){
      if(k < Math.abs(n) - 1){ floatAt(ns.id, '登竜門だ！', '#80d8ff'); SFX.drum(); await sleep(700); }
      break;
    }
    if(n > 0 && ns.type === 'gate' && !piece.cleared[ns.id]){
      if(k < Math.abs(n) - 1){ floatAt(ns.id, '関所だ！ 止まれ！', '#ffd54f'); SFX.drum(); await sleep(700); }
      break;
    }
  }
  const st = document.getElementById('sq' + piece.pos); if(st && who === 'player') st.classList.add('near');
}
function chooseFork(cur){
  return new Promise(res => {
    window._fork = id => { closeModal(); res(id); };
    const opts = cur.next.map(id => ({ id, b:G.squares[id].branchInfo, rem:G.squares[id].remain + 1 }));
    openModal(`<div class="evtitle">🔀 分かれ道</div>
      <div class="forkopt">${opts.map(o => `<button onclick="_fork(${o.id})"><b>${o.b.name}</b><br>${o.b.desc}</button>`).join('')}</div>`);
  });
}

/* ---------- マスに止まったとき ---------- */
async function landOn(){
  const s = G.squares[G.player.pos];
  G.phase = 'square';
  // 特殊キャラ（カエルなど）は、通りすぎても何もない。ぴったり止まれたらラッキー（2026-11-14 教員の指示）。そのときはマスの代わりにキャラのイベント
  if(G.npcs[s.id]){ await npcEncounter(s.id); renderBoard(); return endPlayerTurn(); }
  if(s.type === 'goal'){
    if(G.escort){ G.escort = false; G.log = []; addZeni(60, s.id, '親鳥のお礼'); await infoAsync('🐔 お母さんに会えた！', ''); }
    return setTimeout(castleShop, 400);
  }
  if(s.type === 'gate'){ if(!G.player.cleared[s.id]) await gateEvent(s); return endPlayerTurn(); }
  if(QUESTION_TYPES.includes(s.type)){
    const r = SQ_RULES[s.type];
    return askOnBoard(makeQuestion(s.type, pickWordForFacet(s.type)), { title:r.title, preview:sqPreview(r), effect: ok => r.fx(ok, s),
      onResult: async ok => { if(r.after && !(CURRENT_Q && CURRENT_Q.shielded)) await r.after(ok, s); endPlayerTurn(); } });
  }
  if(SQ_RULES[s.type]){
    G.sqOk = await squareQuiz(s);
    if(!G.sqOk && CURRENT_Q && CURRENT_Q.shielded) return eventModal('🛡️ 矛盾の盾が守った', 'マスの悪いことは起きなかった', '', '');
  }
  const fn = SQUARES[s.type];
  if(fn) return fn(s);
  endPlayerTurn();
}

/* ---------- 読み仮名（ルビ）（2026-11-13 教員の指示：読み方が分からない人が多そう） ----------
   故事成語：すごろくの語は yomi、知識ドリルの語は解説の「「X」の読み方は「Y」」から。
   人名・国名・書名：下の NAME_YOMI。国名（一字）は「楚の」のように「の」が続くときだけ（「越える」などに付けないため）。
   漢字の穴うめ（□）の問題には付けない（読みが答えのヒントになるため）。 */
const NAME_YOMI = {
  '項羽':'こうう','孫臏':'そんぴん','藺相如':'りんしょうじょ','韓非子':'かんぴし','孔子':'こうし','荘子':'そうし','老子':'ろうし','孟子':'もうし',
  '晏嬰':'あんえい','晏子':'あんし','管仲':'かんちゅう','廉頗':'れんぱ','韓信':'かんしん','劉邦':'りゅうほう','顔回':'がんかい','扁鵲':'へんじゃく',
  '桓公':'かんこう','桓侯':'かんこう','景公':'けいこう','恵施':'けいし','遊説家':'ゆうぜいか','宰相':'さいしょう','礼記':'らいき','黄河':'こうが',
  '賈島':'かとう','韓愈':'かんゆ','勾践':'こうせん','夫差':'ふさ','車胤':'しゃいん','孫康':'そんこう','狙公':'そこう','恵王':'けいおう',
  '呉起':'ごき','膿':'うみ','淮南子':'えなんじ','戦国策':'せんごくさく','史記':'しき','論語':'ろんご','国境':'こっきょう','儒学者':'じゅがくしゃ',
  '楚の':'そ','晋の':'しん','斉の':'せい','趙の':'ちょう','秦の':'しん','魏の':'ぎ','燕の':'えん','宋の':'そう','呉の':'ご','越の':'えつ','杞の':'き','漢の':'かん','唐の':'とう',
};
const YOMI = {};
function buildYomi(){
  WORDS.forEach(w => { if(w.yomi) YOMI[w.word] = w.yomi; if(w.dataWord && w.yomi) YOMI[w.dataWord] = YOMI[w.dataWord] || ''; });
  DATA_ITEMS.forEach(it => { const m = (it.e || '').match(/「([^」]+)」の読み方は「([^」]+)」/); if(m && !YOMI[m[1]]) YOMI[m[1]] = m[2]; });
  Object.keys(YOMI).forEach(k => { if(!YOMI[k]) delete YOMI[k]; });
  Object.assign(YOMI, NAME_YOMI);
}
let RUBY_RE = null;
function ruby(text){
  if(!text) return text;
  if(!RUBY_RE){
    buildYomi();
    const SPECIAL = '.*+?^$(){}|[]' + String.fromCharCode(92);
    const keys = Object.keys(YOMI).sort((a, b) => b.length - a.length).map(k => k.split('').map(ch => SPECIAL.includes(ch) ? String.fromCharCode(92) + ch : ch).join(''));
    RUBY_RE = new RegExp(keys.join('|'), 'g');
  }
  // タグの中（属性など）には付けない：タグと文字に分けて、文字の部分だけ
  return String(text).split(/(<[^>]+>)/).map(part => part.startsWith('<') ? part : part.replace(RUBY_RE, m => {
    if(m.length === 2 && m.endsWith('の') && NAME_YOMI[m]) return `<ruby>${m[0]}<rt>${NAME_YOMI[m]}</rt></ruby>の`;
    return `<ruby>${m}<rt>${YOMI[m]}</rt></ruby>`;
  })).join('');
}

// 問題の結果：大きく「正解／ざんねん」→ 変化の一覧（結果パネル）→ 正しい答え → 解説（いつもたたんでおく）
function answerPanelHtml(q, ok, rows, title){
  const w = q.w;
  const exp = q.e ? q.e : `<b>${w.word}</b>（${w.yomi}）…${w.meaning}${w.source ? `（出典『${w.source}』）` : ''}`;
  return resultHtml(title || (ok ? '⭕ 正解！' : '❌ ざんねん…'), ok ? 'ok' : 'ng', rows) +
    `<details class="explain"><summary>📖 解説を読む</summary><div>${exp}</div></details>`; // 解説はいつもたたんでおき、見たい人だけ開く（教員の指示）
}
function bindChoices(onPick){
  document.querySelectorAll('#choices .choice').forEach(btn => btn.onclick = () => {
    if(CURRENT_Q.answered) return;
    CURRENT_Q.answered = true; CURRENT_Q.answeredAt = Date.now();
    const ok = btn.dataset.ok === '1';
    btn.classList.add(ok ? 'correct' : 'wrong');
    if(!ok) document.querySelector('#choices .choice[data-ok="1"]').classList.add('correct');
    $('#choices').classList.add('done');
    document.querySelectorAll('#choices .choice').forEach(b => b.disabled = true);
    (ok ? SFX.correct : SFX.wrong)();
    onPick(ok);
  });
}
function stampIfAvailable(q){
  if(!facetsOf(q.w).includes(q.facet)) return;
  if(giveStamp(q.wid, q.facet)){
    G.gained.push({ wid:q.wid, facet:q.facet });
    const f = facetInfo(q.facet);
    logRow('🏅', '故事成語図鑑にスタンプ', `${f.icon}${f.label}`, 'up', `「${q.w.word}」${isComplete(q.w) ? '　🎉 カード完成！' : ''}`, true);
  }
}
// ボードの問題。opts.title＝見出し、opts.onResult(ok)＝結果のあとの処理（なければふつうにターン終了）
function askOnBoard(q, opts){
  opts = opts || {};
  G.phase = 'question';
  G.log = [];
  CURRENT_Q = { q, answered:false, shownAt:Date.now() };
  openModal(questionHtml(q, { tierLabel:true, title:opts.title, preview:opts.preview }));   // 時間制限（早押しの棒）はなし（2026-11-15 教員の指示）
  renderItems($('#qItems'));
  const sp = setInterval(() => {
    const bar = $('#speedBar'); if(!bar || !CURRENT_Q || CURRENT_Q.q !== q || CURRENT_Q.answered){ clearInterval(sp); return; }
    bar.style.width = Math.max(0, 1 - (Date.now() - CURRENT_Q.shownAt) / SPEED_BONUS_MS) * 100 + '%';
  }, 100);
  bindChoices(ok => {
    G.phase = 'answered'; G.answered++;
    const sq = G.player.pos;
    if(ok){
      G.correct++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak); redCorrect();
      addZeni(ZENI_PER_CORRECT, sq, '正解');
      if(G.streak >= 2) addZeni(Math.min(15, 5 * (G.streak - 1)), sq, `🔥${G.streak}連続正解`);
      if(G.streak % 5 === 0){ const fi = KOJI_ITEMS.filter(x => x.foe); const it = fi[rnd(fi.length)]; if(!addItem(it.id)) addZeni(20, sq, 'アイテムのかわり'); }
      if(G.haisui){ G.haisui = false; gainStat(q.facet, true, STAT_GAIN_OK * 2, '背水の陣'); }
      stampIfAvailable(q);
    } else {
      if(G.streak >= 2) logRow('🔥', '連続正解', 'とぎれた', 'down', `${G.streak}回で終了`);
      G.streak = 0;
      if(G.shield){ G.shield = false; CURRENT_Q.shielded = true; logRow('🛡️', '矛盾の盾', '使用', 'info', 'マスの悪いことを防いだ'); }
      if(G.haisui){ G.haisui = false; CURRENT_Q.noGain = true; logRow('🌊', '背水の陣', '失敗', 'down', '挑戦点なし'); }
    }
    if(!CURRENT_Q.noGain && !opts.noStat) gainStat(q.facet, ok);   // 修行ステータス（正解+3・まちがい+1。背水の陣の失敗は0）
    if(!opts.noStat) bossKeepPace(q.facet, ok);   // 今は何もしない（問題の正誤で上がるのは自分の力だけ。2026-11-14 教員の指示）
    if(opts.effect && !(CURRENT_Q.shielded)) opts.effect(ok);   // マスごとの「良いこと／悪いこと」（盾をかまえていれば悪いことは起きない）
    updateHud();
    $('#qItems').innerHTML = '';
    window._qres = v => { closeModal(); opts.onResult(v); };
    const nextCall = opts.onResult ? `_qres(${ok})` : 'endPlayerTurn()';
    $('#fbArea').innerHTML = answerPanelHtml(q, ok, takeLog()) + `<div class="btnrow"><button class="btn" onclick="${nextCall}">次へ</button></div>`;
    { const fa = $('#fbArea'); if(fa && fa.scrollIntoView) fa.scrollIntoView({ block:'nearest' }); }
  });
}

/* ---------- 関所（通りかかったら必ず止まって答える） ----------
   正解：通れる＋ほうびの銭／まちがい：通行料をはらって通る（はらえなければ足止めで、次のターンにもう一度問い）。
   関所が先へ進むほど、問いの段階が上がる（第1関＝第一段階〜、城門＝第三段階の語も）。 */
const gateName = s => s.gateNo === 3 ? '城門' : `第${s.gateNo}の関所`;
const gateToll = s => 20 + 10 * s.gateNo;
async function gateEvent(s, retry){
  const toll = gateToll(s);
  G.phase = 'event'; G.log = [];
  if(!retry){
    SFX.drum();
    await choiceAsync(`<div class="evtitle">⛩️ ${gateName(s)}</div><div class="bigemoji">🦉</div><p style="text-align:center">「問いに答えよ！」</p>
`,
      [{ key:'go', label:'⚔️ 問いに答える', cls:'gold' }]);
  }
  const ok = await askAsync(randomQuestion(Math.min(3, s.gateNo)), `⛩️ ${gateName(s)}の問い`);
  G.log = [];
  if(ok){
    G.player.cleared[s.id] = true; G.player.gateLock = null;
    addZeni(toll, s.id, `${gateName(s)}のほうび`); SFX.fanfare();
    await infoAsync('⛩️ 通ってよし！', '');
  } else if(G.zeni >= toll){
    G.player.cleared[s.id] = true; G.player.gateLock = null;
    addZeni(-toll, s.id, '通行料');
    await infoAsync('⛩️ 通行料をはらった', '');
  } else {
    G.player.gateLock = s.id; SFX.bad();
    logRow('⛩️', '足止め', '次のターンも関所', 'down', `通行料（${toll}銭）が足りない`);
    await infoAsync('⛩️ 足止め', '次のターンにもう一度');
  }
  if(G.player.cleared[s.id] && G.escort){
    G.escort = false; G.log = [];
    addZeni(60, s.id, '親鳥のお礼');
    await infoAsync('🐔 お母さんに会えた！', '');
  }
}

/* =========================================================================
   エピソード（2026-11-13 教員の指示：選択肢ごとに、それぞれ面白い話が見られるように。全部の選択肢を見たくなる設計に）
   ・選んだ選択肢ごとに、短い「場面」（絵＋一行ずつ）が流れる。はじめて見た話は📕NEW＋ほうび10銭。
   ・ボタンに「NEW／✓」、上に「📕 エピソード 2/5」。まだ見ていない選択肢は金色のボタン。
   ・ふつうの選択肢を全部見ると、次に会ったとき「✨ひみつの選択肢」が出る（それまでは🔒？？？）。
   ・結果が運で分かれる選択肢は、結果ごとに別のエピソード（集める楽しみ）。
   scenes の ch は「どの選択肢の話か」（省略時はキーと同じ）。
   ========================================================================= */
const EP = KOJI_EP;   // エピソードのデータは koji_sugoroku_data.js へ移した（2026-11-20〜、本体の管理者画面でも使うため）
const epKey = (ev, sk) => ev + '.' + sk;
const epSeen = (ev, sk) => !!(SAVE.ep && SAVE.ep[epKey(ev, sk)]);
const epChOf = (ev, sk) => EP[ev].scenes[sk].ch || sk;
const epChoiceSeen = (ev, ch) => Object.keys(EP[ev].scenes).some(sk => epChOf(ev, sk) === ch && epSeen(ev, sk));
const epAllChoices = ev => Object.keys(EP[ev].opts).every(ch => epChoiceSeen(ev, ch));
function epCount(ev){ const ks = Object.keys(EP[ev].scenes); return [ks.filter(sk => epSeen(ev, sk)).length, ks.length]; }
function epTotal(){ let n = 0, t = 0; Object.keys(EP).forEach(ev => { const [a, b] = epCount(ev); n += a; t += b; }); return [n, t]; }
const EP_SECRET_CHANCE = .25;   // ひみつの選択肢が出る確率（全部見なくてよいので、NEW・鍵・数は出さない：教員の指示）
// 選択肢を出す（NEW/✓・エピソード数・ひみつの選択肢）。dis＝押せない選択肢 { key:true }
function epChoose(ev, head, dis){
  const e = EP[ev], opts = [];
  for(const [k, label] of Object.entries(e.opts)) opts.push({ key:k, label, cls:'', disabled:!!(dis && dis[k]) });
  const sk = Object.keys(e.secret)[0];
  if(Math.random() < EP_SECRET_CHANCE) opts.push({ key:sk, label:e.secret[sk], cls:'' });   // 見た目は同じ（教員の指示）
  return choiceAsync(head, opts);
}
// 場面を一行ずつ見せる（文字は1つずつ入れかえるので重ならない）
function sceneAsync(title, beats, isNew){
  return new Promise(res => {

// ボードは、はじめにルーレットでランダムに決める（2026-11-14 教員の指示）。最後に光ったボードに決まる
async function boardRoulette(){
  closeModal();
  const ids = BOARD_ORDER, target = rnd(ids.length);
  app.innerHTML = `<div class="card boardsel"><h2>どのボードになるかな？</h2>
    <div class="bslist">${ids.map((id, i) => { const b = BOARDS[id];
      return `<div class="bsbtn" id="br${i}" style="background:${b.sky}"><span class="bsic">${b.ic}</span><b>${b.name}</b></div>`; }).join('')}</div></div>`;
  // 順番ではなく、ランダムな場所がピカピカ光る（2026-11-15 教員の指示）。同じ所が続けて光らないようにし、最後は target
  const steps = 18 + rnd(5);
  let prev = -1;
  for(let k = 0; k <= steps; k++){
    let i;
    if(k === steps) i = target;
    else { do{ i = rnd(ids.length); } while(i === prev || (k === steps - 1 && i === target)); }
    prev = i;
    document.querySelectorAll('.bsbtn').forEach(d => d.classList.remove('on'));
    const el = document.getElementById('br' + i); if(el) el.classList.add('on');
    SFX.tick();
    await sleep(60 + k * k * 1.1);
  }
  const win = document.getElementById('br' + target); if(win) win.classList.add('win');
  SFX.fanfare(); await sleep(1300);
  newGame(ids[target]);
}

   暗い画面に「今回のボスは……」→ スポットライトが舞台を左右に探す（影だけ見える）→ ライトが当たってボスが現れ、名前を紹介 */
function bossSpotlight(boss){
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'spot'; document.body.appendChild(o);
    const step = (html, ms) => new Promise(r => { o.innerHTML = html; setTimeout(r, ms); });
    const img = cls => `<img class="spot-boss ${cls}" src="${spriteOf(boss.id, 'pose1')}" alt="">`;
    (async () => {
      await step('<div class="spot-t">今回のボスは……</div>', 1500);
      SFX.drum(); setTimeout(SFX.drum, 450); setTimeout(SFX.drum, 900);
      await step(`<div class="spot-stage"><div class="spot-light sweep"></div><div class="spot-egg"></div></div><div class="spot-t small">……</div>`, 2000);
      SFX.fanfare();
      await step(`<div class="spot-stage"><div class="spot-light on"></div>${img('lit')}</div>
        <div class="spot-name">${boss.name}</div><div class="spot-sub">${boss.fullName || ''}　${boss.style || ''}</div>`, 2600);
      o.classList.add('out'); setTimeout(() => { o.remove(); res(); }, 500);
    })();
  });
}
async function bossRoulette(title, preset){
  const boss = preset || pickBoss();
  SFX.fanfare();
  openModal(`<div style="text-align:center;"><div class="evtitle">${title}</div>
    <div class="roulette">${KOJI_BOSSES.map((b, i) => `<div id="rl${i}"><img src="${spriteOf(b.id,'pose1')}" alt=""></div>`).join('')}</div></div>`);
  const target = KOJI_BOSSES.indexOf(boss);
  const steps = 16 + target + 4 * rnd(2);   // 最後に光る k=steps が target になるように（steps % 4 === target）
  for(let k = 0; k <= steps; k++){
    document.querySelectorAll('.roulette div').forEach(d => d.classList.remove('on'));
    const el = document.getElementById('rl' + (k % 4)); if(el) el.classList.add('on');
    SFX.tick();
    await sleep(60 + k * k * 1.2);
  }
  const win = document.getElementById('rl' + target); if(win) win.classList.add('win');
  SFX.drum(); await sleep(250); SFX.drum();
  await sleep(700);
  return boss;
}
function pickBoss(){
  const ws = KOJI_BOSSES.map(b => ({ b, wt: SAVE.defeated[b.id] ? BOSS_DEFEATED_WEIGHT : BOSS_UNDEFEATED_WEIGHT }));
  let r = Math.random() * ws.reduce((s, x) => s + x.wt, 0);
  for(const x of ws){ r -= x.wt; if(r <= 0) return x.b; }
  return ws[0].b;
}

const KOI_IMG = {};
function koiImg(hex){
  if(KOI_IMG[hex]) return KOI_IMG[hex];
  try{
    const S = 240, c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d');
    x.font = `${S * .8}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('🐟', S / 2, S * .55);
    const d = x.getImageData(0, 0, S, S), a = d.data;
    const tr = parseInt(hex.slice(1, 3), 16), tg = parseInt(hex.slice(3, 5), 16), tb = parseInt(hex.slice(5, 7), 16);
    for(let i = 0; i < a.length; i += 4){
      if(!a[i + 3]) continue;
      const L = (a[i] * .3 + a[i + 1] * .59 + a[i + 2] * .11) / 255;   // 元の明るさ（陰影）を残す
      const k = .35 + L * .95, w = Math.max(0, L - .85) * 4;          // とても明るいところ（目の光）は白っぽく
      a[i]     = Math.min(255, tr * k * (1 - w) + 255 * w);
      a[i + 1] = Math.min(255, tg * k * (1 - w) + 255 * w);
      a[i + 2] = Math.min(255, tb * k * (1 - w) + 255 * w);
    }
    x.putImageData(d, 0, 0);
    // 絵のまわりの余白を切りそろえて、真ん中に置く（フォントによって絵の位置がずれるため）
    let x0 = S, y0 = S, x1 = 0, y1 = 0;
    for(let y = 0; y < S; y++) for(let xx = 0; xx < S; xx++) if(a[(y * S + xx) * 4 + 3] > 8){ if(xx < x0) x0 = xx; if(xx > x1) x1 = xx; if(y < y0) y0 = y; if(y > y1) y1 = y; }
    if(x1 <= x0) return KOI_IMG[hex] = c.toDataURL();
    const w = x1 - x0 + 1, h = y1 - y0 + 1, m = Math.max(w, h) + 8, o = document.createElement('canvas');
    o.width = o.height = m;
    o.getContext('2d').drawImage(c, x0, y0, w, h, (m - w) / 2, (m - h) / 2, w, h);
    return KOI_IMG[hex] = o.toDataURL();
  }catch(e){ return null; }
}

      <b>👹 ボス図鑑</b>
      <div class="bosscol">${KOJI_BOSSES.map(b => `<div class="bcell" onclick="showBossInfo('${b.id}')"><img src="${spriteOf(b.id,'pose1')}" class="${SAVE.defeated[b.id] ? '' : 'unknown'}" alt=""><br>${SAVE.defeated[b.id] ? `${b.name}<br>倒した回数 ${SAVE.defeated[b.id]}` : '？？？'}</div>`).join('')}</div>
    </div></div>`;
}
// ボス図鑑：タップでプロフィール（1回倒すと性格など、2回倒すと裏話）
function showBossInfo(id){
  const b = KOJI_BOSSES.find(x => x.id === id), n = SAVE.defeated[id] || 0, pf = (typeof KOJI_BOSS_PROFILE !== 'undefined' && KOJI_BOSS_PROFILE[id]) || {};
  if(!n){
    openModal(`<div class="bigemoji"><img src="${spriteOf(id,'pose1')}" class="bossinfoimg unknown" alt=""></div>
      <div class="evtitle">？？？</div><p style="text-align:center">まだ出会っていない</p>
      <div class="btnrow"><button class="btn" onclick="closeModal()">閉じる</button></div>`);
    return;
  }
  const w = wordById(b.word), color = (BOSS_LINES[id] || {}).color || '#555';
  openModal(`<div class="bossinfo" style="--bc:${color}">
    <img src="${spriteOf(id,'pose1')}" class="bossinfoimg" alt="">
    <div class="evtitle">${b.name}</div>
    <p class="note" style="text-align:center">「${w ? w.word : ''}」のボス　・　倒した回数 ${n}</p>
    <div class="kuchi">「${pf.kuchiguse || ''}」</div>
    <table class="ptable">
      <tr><th>性格</th><td>${pf.seikaku || ''}</td></tr>
      <tr><th>好き</th><td>${pf.suki || ''}</td></tr>
      <tr><th>苦手</th><td>${pf.nigate || ''}</td></tr>
      <tr><th>とくい技</th><td>${BOSS_SPECIAL[id] ? `${BOSS_SPECIAL[id].name}（${BOSS_SPECIAL[id].text}）` : ''}</td></tr>
    </table>
    ${n >= 2 ? `<div class="storybox"><b>🤫 裏話</b><br>${pf.ura || ''}</div>` : '<p class="note" style="text-align:center">🔒 裏話：もう1回倒すと見られる</p>'}
    </div>
    <div class="btnrow"><button class="btn" onclick="closeModal()">閉じる</button></div>`);
}
function showCard(wid){
  const w = wordById(wid), fs = facetsOf(w);
  const du = (w.dataQs.usage || [])[0];
  const usageEx = w.usage ? w.usage[0] : (du ? du.q.replace('（　）', `「${du.c[du.a]}」`) : '');
  const showMeaning = hasStamp(w.id, 'meaning') || (!fs.includes('meaning') && hasStamp(w.id, 'story'));
  openModal(`<div class="evtitle" style="font-family:'Yu Mincho',serif;font-size:1.6rem;">${w.word}<span class="note" style="font-size:.9rem;font-family:inherit;">${w.yomi ? `（${w.yomi}）` : ''}</span></div>
    <p class="note">${KOJI_TIER_LABEL[w.tier]}${w.source ? `　・　出典『${w.source}』` : ''}</p>
    <div class="stamps" style="justify-content:flex-start;">${stampsHtml(w)}</div>
    ${w.meaning ? (showMeaning ? `<p><b>💡 意味</b><br>${w.meaning}</p>` : '<p class="note">💡 意味：スタンプを集めると表示されます</p>') : ''}
    ${w.story ? (hasStamp(w.id,'story') ? `<div class="storybox"><b>📜 もとになった話</b><br>${w.story}</div>` : '<p class="note">📜 話：スタンプを集めると表示されます</p>') : ''}
    ${usageEx ? (hasStamp(w.id,'usage') ? `<p><b>🎯 使う場面の例</b><br>${usageEx}</p>` : '<p class="note">🎯 使い方：スタンプを集めると表示されます</p>') : ''}
    <div class="btnrow"><button class="btn" onclick="closeModal()">閉じる</button></div>`);
}

showTitle();
// 今日のミニゲーム・スロット（?daily=1／?slot=1）：いきなりボードの抽選から始め、結果画面で終わり（daily_minigame.js）
if(typeof dailyMgPage === "function") dailyMgPage("kokugo_app.html?from=daily", () => { closeModal(); boardRoulette(); }, {ends:["showResult"], quits:["showTitle"]});
</script>
